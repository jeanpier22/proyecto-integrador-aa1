<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-adobo-instantaneo", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "Adobito AQP: adobo arequipeño instantáneo", "grupo": "Grupo (sin número)", "seccion": "No indicada", "fecha": "04/11/2026 (2.ª versión)", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Davita Lucero Aguilar Choquiluque", "María Cristina Quispe Rivera", "Alexandra Cuba Aroni", "Sarai Virginia Champi Hermoza"], "dictamen": "menor", "resumen": "La segunda versión muestra un avance importante: el capítulo 1 ya incorpora cifras de fuentes oficiales (Ipsos, INEI, MINCETUR, PromPerú), causas y consecuencias del problema del cliente y del problema social, las metas generales de los ODS 9 y 12 y dos megatendencias de CEPLAN (2021); la ficha técnica tiene sus 14 apartados (precio de S/ 19.90, proceso de fabricación, sostenibilidad, redes sociales, registro sanitario y vida útil); los segmentos están priorizados con datos; y el capítulo 3, que antes solo tenía títulos, ahora presenta el mapa de empatía, el BMC con los 9 bloques y un análisis de cinco competidores con cuadro comparativo. Se mantiene el tono crítico que se valoró en la versión anterior: cada cifra se acompaña de su límite. Lo pendiente es más fino: el problema sigue formulado como «oportunidad»; el problema social y los ODS se quedan en lo general; el 2.3 (Beneficios clave) está vacío; la explicación de los 9 bloques del BMC consiste solo en la imagen; los competidores directos son productos coreanos y de trekking que no compiten por el adobo y falta su análisis de fortalezas, debilidades y ventaja competitiva; no hay indicadores de gestión. En lo formal, la bibliografía solo cubre el capítulo 1 (los competidores no figuran), la numeración del capítulo 3 es incorrecta, no hay numeración ni fuente en la ficha técnica, el BMC y las tablas, y la carátula sigue con una sola carrera para las cuatro integrantes.", "fortalezas": ["El capítulo 1 ahora dimensiona el contexto con cifras citadas: 59 % de consumo de alimentos fuera del hogar (Ipsos Perú, 2024), 2 h 11 min diarias de preparación de alimentos en mujeres frente a 58 min en hombres (INEI, 2025a), 1 207 036 arribos nacionales a Arequipa en 2024 (MINCETUR, 2025) y 8 % de preferencia de destino (PROMPERÚ, 2026) (pp. 5-6).", "Mantienen el análisis crítico de cada dato: aclaran que el 59 % «no representa una medición directa de la demanda» del producto y que el 8 % de PromPerú no demuestra intención de compra (pp. 5-6). Es el tipo de lectura que pide la rúbrica.", "Subsanaron las observaciones de estructura: el capítulo 1 tiene causas y consecuencias para el problema del cliente (1.1.1, pp. 4-5) y para el problema social (1.2.3, pp. 10-11), y se declaran dos megatendencias de CEPLAN con su vínculo con el proyecto (pp. 9-10).", "La ficha técnica (p. 15) completa los 14 apartados: precio de S/ 19.90 por vaso de 60 g, opciones de compra, ingredientes, flujo de 9 pasos de fabricación, sostenibilidad, redes sociales, registro sanitario y rotulado (DIGESA «en trámite», octógonos «si aplica») y vida útil estimada de 6 meses «en validación».", "El diferencial frente a sopas instantáneas, picanterías, delivery y congelados está enunciado en 2.4 (p. 16), y los segmentos de 2.5 (pp. 16-19) se priorizan (turistas nacionales, trabajadores de 25 a 44 años y consumidores de gastronomía regional) con datos de MINCETUR, INEI y PROMPERÚ.", "El capítulo 3 ya existe y es coherente con el cap. 2: mapa de empatía del turista nacional de 25 a 55 años, NSE B y C (Figura 4, p. 22), BMC de 9 bloques con precio de S/ 19.90 y canales alineados con la ficha (p. 23) y cinco competidores con cuadro comparativo, precios publicados y fuentes (pp. 23-25)."], "prioridades": ["Completar el 2.3 (Beneficios clave), que solo tiene el título en la p. 15, y explicar el BMC bloque por bloque (3.2.1 a 3.2.9) en texto, relacionando cada bloque con la propuesta de valor y el segmento; hoy solo hay una imagen (p. 23).", "Rehacer el análisis de competidores: reemplazar o complementar a Bibigo y Yopokki (tteokbokki coreano) con competidores que atiendan la misma necesidad con platos peruanos o regionales listos o instantáneos (sazonadores y pastas de adobo, platos congelados, picanterías con venta para llevar), y por cada competidor indicar fortalezas, debilidades, ventaja competitiva propia y estrategia de diferenciación.", "Agregar los indicadores de gestión con fórmula y ejemplo de cálculo; el cap. 1 (p. 9) promete medir rendimiento de insumos y residuos, pero no se definen.", "Sustentar con evidencia las afirmaciones críticas de la ficha: el registro sanitario «en trámite» (¿hay constancia de DIGESA?), la vida útil de «6 meses» y la viabilidad de liofilizar un guiso de cerdo.", "Corregir el capítulo 1: formular el problema desde el cliente (no como «oportunidad»), citar la meta específica de los ODS 9 y 12 y respaldar el problema social con datos (por ejemplo, el dato de la FAO que citan en la p. 12 pero no cifran).", "Corregir el formato académico: carátula con título, sección y grupo; índice; numeración de 3.1 a 3.3; numeración, título y fuente de la ficha técnica, el BMC y las tablas; e incluir en las referencias todas las fuentes citadas en el capítulo 3 y en 2.5."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, analizadas críticamente para mostrar qué aportan al proyecto en relación con las megatendencias y los ODS.", "falta": "Mejoró mucho: hay nueve referencias oficiales (CEPLAN 2021, INEI, MINCETUR, PROMPERÚ 2026, Ipsos 2024, FAO 2024, ONU 2015) y análisis crítico de sus límites. Falta rigor en el uso: PROMPERÚ (2025) sobre el turista extranjero, INEI (2025) y los nueve sitios comerciales del capítulo 3 (Inca Chef, CJ CheilJedang, K-Food, Yopokki, Yaxa, Ajinomoto, Tottus, Nongshim, Fuku Store) se citan, pero no figuran en las referencias; las referencias traen asteriscos de formato; la URL de INEI (2025a) apunta a un archivo genérico («Lib2010/libro.pdf») y debe verificarse; y el dato de FAO (2024) no se cifra. Siguen faltando fuentes técnicas sobre liofilización o deshidratación."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cualitativa y cuantitativa, vinculada de forma explícita con megatendencias, ODS y necesidades del cliente.", "falta": "Ya hay evidencia cuantitativa, hipótesis del cliente y causas y consecuencias, pero las cifras (59 % come fuera de casa, tiempo de cocina, arribos) son de contexto y no dimensionan el problema del adobo. El problema sigue formulado como una «oportunidad» (pp. 3 y 7), el problema social y los ODS 9 y 12 se mantienen en lo general (sin metas) y las megatendencias no están respaldadas con datos. No se indica la línea de investigación CERTUS."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Los seis apartados están, la ficha está completa y los segmentos tienen datos. Falta el 2.3, sustentar el diferencial con una comparación por criterios (autenticidad, contenido de carne, tiempo, vida útil, precio, canal) y evidencia de la viabilidad técnica, el registro sanitario y la vida útil. El rango de edad del segmento principal es incoherente: «se determinará con la investigación» (p. 17) frente a «25 a 55 años, NSE B y C» (p. 22)."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "Ya están el mapa de empatía y el BMC con sus 9 bloques, coherentes con el cap. 2. Falta argumentar cada bloque en texto (3.2.1 a 3.2.9), el análisis de fortalezas, debilidades y ventaja competitiva de cada competidor, competidores que realmente disputen la necesidad y los indicadores de gestión. El capítulo no está numerado como 3.1 a 3.3."}], "viabilidad": {"resumen": "La versión nueva ya reconoce el registro sanitario y los octógonos en la ficha, pero los riesgos de fondo persisten: el trámite sanitario, la factibilidad técnica de liofilizar un guiso de cerdo, y la aceptación cultural de un adobo «instantáneo». El grupo ahora tiene los datos para empezar a probarlos.", "riesgos": [{"tema": "Regulación", "titulo": "Registro sanitario y planta habilitada (DIGESA)", "choque": "La ficha (p. 15) dice «Registro sanitario ante DIGESA (en trámite)». Un alimento envasado con carne requiere registro sanitario y producción en un establecimiento que cumpla las normas de higiene y HACCP; no puede producirse en una cocina doméstica. No se menciona dónde se fabricará, ni el costo del trámite en la estructura de costos del BMC.", "ideas": ["Adjuntar como anexo la constancia o el expediente de DIGESA si el trámite ya se inició; si no, reformular la ficha como «por tramitar».", "Explorar la maquila con una planta de alimentos habilitada en Arequipa o con laboratorios universitarios de industrias alimentarias.", "Mientras no haya registro, limitar el MVP a degustaciones controladas y pruebas sensoriales, sin venta comercial."]}, {"tema": "Tecnología", "titulo": "Viabilidad técnica de liofilizar o deshidratar un guiso de cerdo", "choque": "El adobo es un guiso con grasa y carne de cerdo; la grasa dificulta la liofilización, puede enranciarse y la carne reconstituida suele quedar fibrosa. La ficha promete una vida útil de 6 meses «en validación» sin ningún sustento y un preparado «con solo agregar agua» (3 a 5 minutos). Aparte, el informe aún no define si es liofilizado o deshidratado, que implican costos muy distintos.", "ideas": ["Buscar artículos científicos sobre liofilización y deshidratación de carnes y comidas preparadas para estimar rehidratación, textura y vida útil.", "Probar dos o tres variantes de prototipo y compararlas en una prueba sensorial a ciegas con un adobo de picantería.", "Cotizar un estudio de vida útil acelerado en un laboratorio acreditado por INACAL."]}, {"tema": "Regulación", "titulo": "Octógonos de advertencia y empaque como souvenir", "choque": "Por la Ley 30021, un adobo concentrado probablemente supere los límites de sodio o grasas saturadas y deba llevar octógonos. La ficha los menciona como «si aplica», pero el producto se plantea como recuerdo gastronómico para turistas (Caso 3, p. 19) y los octógonos afectan esa percepción.", "ideas": ["Estimar el perfil nutricional de una porción de 60 g con tablas de composición de alimentos (CENAN/INS) y compararlo con los parámetros de la Ley 30021.", "Evaluar ajustes de receta y medir en la prueba sensorial si se pierde la identidad del plato.", "Diseñar el empaque considerando desde ya el espacio de los octógonos y del rotulado."]}, {"tema": "Adopción", "titulo": "Autenticidad percibida de un adobo «instantáneo»", "choque": "En Arequipa el adobo es un plato de picantería, de preparación lenta, que se come con pan. Un consumidor local puede percibir el formato instantáneo (descrito como «tipo sopa instantánea») como poco auténtico. El informe ya admite que la aceptación debe comprobarse (p. 4), pero el segmento secundario es de residentes que conocen el plato.", "ideas": ["Definir como hipótesis qué debe conservar un adobo para ser aceptado como «verdadero» (sabor, ingredientes, textura).", "Diferenciar la propuesta para turistas y para arequipeños.", "Considerar alianzas con una picantería reconocida para dar legitimidad al producto."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "incompleto", "nota": "Ahora indica «Instituto CERTUS», carrera, curso e integrantes, pero la carrera es una sola («Dirección de Empresas») para las cuatro integrantes; faltan el título del proyecto, la sección y el número de grupo, y el docente figura como «Eanpier Brandol Ancorij Sanchez» (debe ser «Jeanpier Brandol Ancori Sanchez»)."}, {"codigo": "—", "apartado": "Índice", "estado": "ausente", "nota": "Sigue sin índice. Generarlo de forma automática desde los estilos de título."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "incompleto", "nota": "Ahora tiene causas y consecuencias (1.1.1) y cifras (1.1.2), pero se formula como «oportunidad» y no hay evidencia cualitativa propia."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "incompleto", "nota": "ODS 9 y 12 (1.2.1), dos megatendencias de CEPLAN (1.2.2) y causas y consecuencias (1.2.3), pero sin metas, sin cifras y sin la línea de investigación CERTUS. Hay dos apartados con el título «Importancia de las fuentes bibliográficas» (1.1.2 y 1.2.4)."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": ""}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Los 14 apartados están en una infografía (p. 15) sin número, título ni fuente; tiene textos recortados o con erratas y no se indica si fue generada con IA."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "ausente", "nota": "Solo figura el título (p. 15); los beneficios solo aparecen dentro de la infografía."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "Tabla problema-solución y alternativas existentes (pp. 15-16); la tabla no tiene número ni fuente."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Tres segmentos con segmentación y datos (pp. 16-19). Quedan sin definir la edad del principal y su tamaño; hay rótulos de imágenes pegados en el texto («Gobierno del Perú», «Boletines», «INEI»)."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Cinco casos hipotéticos (pp. 19-20)."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Figura 4 (p. 22) con sus seis cuadrantes. Está titulado «3.1», pero la numeración del capítulo es errónea."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "incompleto", "nota": "Imagen del BMC (p. 23) con los 9 bloques, rotulada «3.4» y «1.1.1»; sin figura numerada ni explicación de los bloques."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "incompleto", "nota": "Cinco competidores y cuadro comparativo (pp. 23-25), pero sin fortalezas, debilidades, ventaja competitiva ni estrategia de diferenciación, y rotulado «1.1.2», «3.3.2» y «3.3.3»."}, {"codigo": "—", "apartado": "Indicadores de gestión", "estado": "ausente", "nota": ""}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Hay nueve referencias (pp. 26-27) con asteriscos de formato y sin las fuentes del capítulo 3 ni de PROMPERÚ (2025)."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Avance claro: ya hay cifras de fuentes oficiales, causas y consecuencias y dos megatendencias. Falta que el problema deje de ser una «oportunidad», y llevar el problema social y los ODS a un nivel específico.", "observaciones": [{"severidad": "importante", "titulo": "Las cifras contextualizan, pero no dimensionan el problema", "ubicacion": "1.1.2, pp. 5-6", "cita": "este resultado permite identificar la importancia de los hábitos de consumo fuera de casa; sin embargo, no representa una medición directa de la demanda", "problema": "Valoramos que reconozcan el límite de cada dato. Aun así, las cifras (59 % de consumo fuera del hogar, tiempo de preparación de alimentos, arribos y preferencia de destino) describen el contexto general y no muestran cuántas personas tienen el problema de «no poder preparar adobo» ni con qué frecuencia. El 59 % no está acotado a Arequipa y el dato de tiempo de preparación (2 h 11 min / 58 min) no se vincula con un perfil de su segmento.", "mejora": "Agregar una cifra que acote el problema al segmento objetivo (por ejemplo, el gasto de los turistas nacionales en alimentación en Arequipa, el consumo de comida regional o la proporción de visitantes que compra productos típicos como recuerdo, con fuentes de MINCETUR o PromPerú). Verificar la URL de INEI (2025a), que apunta a un archivo genérico («Lib2010/libro.pdf»)."}, {"severidad": "importante", "titulo": "El problema sigue formulado como «oportunidad» y desde la solución", "ubicacion": "1.1, pp. 3-4 y 1.2, p. 7", "cita": "Esta situación representa una oportunidad para desarrollar Adobito AQP", "problema": "La redacción inicia con la solución y no con lo que le ocurre al cliente. Las causas están bien separadas de las consecuencias, pero tres de las cuatro consecuencias (p. 5) hablan de oportunidades comerciales poco aprovechadas, que son beneficios para el negocio y no efectos sobre el cliente.", "mejora": "Reformular el párrafo inicial desde el cliente (por ejemplo, el turista que quiere llevarse el sabor del adobo y no tiene cómo hacerlo, o el trabajador que no puede prepararlo). Cambiar las consecuencias por efectos concretos sobre ese cliente (lo que deja de consumir, lo que compra en su lugar)."}, {"severidad": "importante", "titulo": "Problema social y ODS en nivel general, sin metas ni datos", "ubicacion": "1.2 y 1.2.1, pp. 7-9", "cita": "la contribución efectiva a este objetivo deberá sustentarse mediante indicadores del proceso productivo", "problema": "El problema social (pérdida de identidad gastronómica frente a nuevos hábitos) no se respalda con ningún dato; el ODS 12 se vincula con el uso eficiente de insumos, pero ninguna cifra muestra desperdicio ni pérdidas en la cadena del adobo. El ODS 9 se explica de forma general. No se citan metas específicas ni la línea de investigación CERTUS con la que se alinean.", "mejora": "Citar la meta concreta (por ejemplo, la meta 9.3 o 9.5 del ODS 9 y la 12.2 o 12.3 del ODS 12, según lo que puedan sustentar) y usar una cifra del problema social (FAO sobre pérdidas de alimentos en el comercio minorista peruano, que hoy se menciona en la p. 13 sin dato, o PRODUCE sobre la agroindustria regional). Indicar la línea de investigación CERTUS correspondiente."}, {"severidad": "importante", "titulo": "Megatendencias sin dato de respaldo y con un vínculo débil", "ubicacion": "1.2.2, pp. 9-10", "cita": "Escasez de recursos naturales. La disponibilidad limitada de recursos naturales representa un desafío para los sistemas productivos", "problema": "Se citan dos megatendencias de CEPLAN (2021), pero la descripción es genérica y sin página; la de escasez de recursos naturales se vincula con el proyecto solo como una intención («puede incorporar este enfoque»), sin un dato que muestre cómo se manifiesta en el Perú o en los alimentos. La rúbrica exige que el vínculo con megatendencias sea sustentado.", "mejora": "Citar CEPLAN con página, acompañar cada tendencia con un dato (por ejemplo, el crecimiento de alimentos procesados o de comercio digital en el Perú, o un dato de consumo de agua y energía en alimentos) y retener la que mejor se pueda conectar con el producto."}, {"severidad": "sugerencia", "titulo": "Fuentes técnicas ausentes y apartados duplicados de «Importancia de las fuentes bibliográficas»", "ubicacion": "1.1.2 y 1.2.4, pp. 5-6 y 11-13", "cita": "1.2.4. Importancia de las fuentes bibliográficas", "problema": "Los apartados 1.1.2 y 1.2.4 repiten el mismo título, y el 1.2.4 resume fuentes (ONU, CEPLAN, FAO) ya mencionadas antes. Este espacio no aporta como apartado separado y sigue sin haber ningún artículo técnico sobre liofilización o deshidratación, que sustentarían la viabilidad del formato.", "mejora": "Integrar las fuentes dentro del desarrollo de cada apartado, eliminando los dos subtítulos «Importancia de las fuentes bibliográficas». Incorporar al menos 2 artículos científicos (Scopus, SciELO, Redalyc) sobre liofilización o deshidratación de carnes o comidas preparadas."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "El capítulo está completo y ahora coherente con los datos del cap. 1. Los pendientes son el 2.3, el sustento del diferencial y la viabilidad técnica, y los textos de la ficha.", "observaciones": [{"severidad": "importante", "titulo": "El apartado 2.3 Beneficios clave está vacío", "ubicacion": "2.3, p. 15", "cita": "2.3. Beneficios clave para los clientes", "problema": "Debajo del título no hay ningún texto; los beneficios solo aparecen en un recuadro de la infografía de la ficha (apartado 6, «Beneficios principales»). Es un apartado obligatorio y por segmento.", "mejora": "Redactar los beneficios clave diferenciando turistas nacionales y trabajadores, y cuantificar al menos uno (por ejemplo, tiempo de preparación de 3 a 5 minutos frente al adobo tradicional, o precio frente a un plato de picantería), con fuente."}, {"severidad": "importante", "titulo": "Ficha técnica completa, pero con afirmaciones sin sustento y sin formato de figura", "ubicacion": "2.2, infografía de la p. 15", "cita": "Vida útil estimada: 6 meses (en validación).", "problema": "La ficha ya tiene los 14 apartados. Sin embargo, afirma que el registro sanitario de DIGESA está «en trámite» y estima una vida útil de 6 meses sin dar ninguna evidencia, y no define si el producto es liofilizado o deshidratado («y/o»), lo que cambia el costo y la calidad. La imagen no tiene número, título ni fuente, tiene textos cortados («Planificación de la producción para evitar mer…», «con tu clientes») y se ve generada con IA.", "mejora": "Respaldar el estado del registro con la constancia de DIGESA (anexo) o reformularlo como «por tramitar»; apoyar la vida útil en literatura técnica o pruebas; definir un único proceso (liofilizado o deshidratado). Presentar la ficha como «Figura N» con título y nota de fuente (indicando si se elaboró con una herramienta de IA) y corregir los textos de la imagen."}, {"severidad": "importante", "titulo": "El diferencial está enunciado, pero no demostrado", "ubicacion": "2.4, pp. 15-16", "cita": "Sopas instantáneas: ofrecen practicidad, pero no están elaboradas específicamente a partir de la receta del adobo arequipeño.", "problema": "El informe distingue picanterías, delivery, congelados y sopas instantáneas, lo cual mejora la versión anterior. Pero el diferencial se basa solo en que «no es la receta del adobo», una afirmación sin evidencia. No se verificó si ya existen en el mercado peruano adobos, pastas o platos regionales instantáneos o liofilizados (el propio competidor Inca Chef vende lomo saltado deshidratado, p. 23), y no se compara por criterios. Al ser un alimento procesado de receta tradicional, el riesgo de baja innovación (Anexo 2 de los lineamientos) depende de demostrar este diferencial.", "mejora": "Elaborar una tabla comparativa con criterios (autenticidad, contenido de carne, tiempo de preparación, vida útil, precio, canal) que incluya sazonadores y pastas de adobo, platos congelados y platos deshidratados peruanos, y sustentarla con una búsqueda de productos similares en supermercados y en registros de marcas. Precisar si es un plato completo con trozos de cerdo o una base."}, {"severidad": "importante", "titulo": "Segmento principal sin tamaño y con un rango de edad contradictorio", "ubicacion": "2.5, pp. 16-19 y mapa de empatía, p. 22", "cita": "El rango de edad específico se determinará mediante la investigación de mercado.", "problema": "Los segmentos ahora están priorizados y respaldados, pero el principal (turistas nacionales) no se estima en tamaño: se dan arribos a hospedajes, no personas. Además, la p. 17 dice que la edad se definirá más adelante y el mapa de empatía (p. 22) ya la fija en «25 a 55 años, NSE B y C» sin fuente. El segmento complementario usa datos de turistas extranjeros (PROMPERÚ, 2025) que el propio texto reconoce que no corresponden; la fuente no figura en las referencias. También hay una inconsistencia: en la p. 6 el 8 % es «preferencias de destino dentro del país» y en la p. 17 «intención de viaje dentro de la macrorregión sur».", "mejora": "Unificar el perfil (edad, NSE) con una fuente (por ejemplo, el perfil del turista nacional de PromPerú), estimar el tamaño inicial del segmento a partir de los arribos y corregir la descripción del 8 %. Retirar los rótulos de imagen pegados en el texto («Gobierno del Perú», «Boletines», «INEI», «Visita Arequipa»)."}, {"severidad": "sugerencia", "titulo": "Casos de uso hipotéticos sin referencia a datos", "ubicacion": "2.6, pp. 19-20", "cita": "Estos casos son situaciones hipotéticas que permiten comprender la utilidad de la propuesta.", "problema": "Los cinco casos son coherentes con los segmentos, pero los casos 3 y 5 son casi iguales (recuerdo para turistas / curiosidad gastronómica) y ninguno indica precio, canal ni cantidad. Falta conectar al menos uno con el precio de S/ 19.90 y el canal del BMC.", "mejora": "Fusionar los casos 3 y 5, agregar a cada caso el canal (tienda de souvenirs, supermercado, redes sociales) y el precio, "}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El capítulo existe por primera vez y es coherente con el cap. 2. Está completo en los productos (mapa de empatía y BMC), pero falta la explicación de los 9 bloques, el análisis de competidores y los indicadores de gestión.", "observaciones": [{"severidad": "importante", "titulo": "El BMC se presenta solo como imagen, sin explicar los 9 bloques", "ubicacion": "BMC, p. 23", "cita": "1.1.1. Identificación y características de los nueve bloques del BMC", "problema": "Bajo ese título solo hay una imagen del BMC; no hay texto que explique cada bloque ni su relación con la propuesta de valor. El BMC es legible y coherente con el cap. 2 (precio de S/ 19.90, tres segmentos, canales de supermercados, tiendas de souvenirs y redes), pero hay puntos sin sustento: los socios clave incluyen laboratorios y empresas de liofilización sin indicar cuáles, y la estructura de costos queda como hipótesis (el precio es referencial en esta etapa).", "mejora": "Colocar el BMC como «Figura N» con fuente y, debajo, un subapartado por bloque (3.2.1 a 3.2.9) que explique su contenido y lo enlace con el segmento y el diferencial. Nombrar los socios, y comprobar que la fuente de ingresos del turista coincida con el canal propuesto."}, {"severidad": "critico", "titulo": "Competidores directos que no compiten por el mismo plato y análisis incompleto", "ubicacion": "3.3, pp. 23-25", "cita": "Se considera un competidor directo por su propuesta de adaptar una preparación gastronómica tradicional a un formato práctico e individual", "problema": "Dos de los tres competidores directos (Bibigo y Yopokki) son marcas coreanas de tteokbokki; compiten por el formato, no por la necesidad de un plato peruano. Inca Chef es el único comparable, pero atiende a trekking en Cusco. Las alternativas que el propio informe señala en 2.4 (picanterías, delivery, congelados, pastas y sazonadores de adobo) no se analizan. Para cada competidor falta la descripción de fortalezas y debilidades, la ventaja competitiva propia y la estrategia de diferenciación que pide la estructura del TAP.", "mejora": "Reorganizar en directos (productos peruanos o regionales listos, deshidratados o de adobo para llevar) e indirectos (sopas y fideos instantáneos, comida coreana instantánea), y cerrar con una tabla de fortalezas y debilidades, la ventaja competitiva de Adobito AQP y la estrategia de diferenciación (por ejemplo, según las estrategias genéricas de Porter)."}, {"severidad": "sugerencia", "titulo": "Mapa de empatía correcto, pero sin sustento y con una sola figura", "ubicacion": "3.1, Figura 4, p. 22", "cita": "Nota. Elaboración propia con base en el perfil del turista de Arequipa (MINCETUR, 2024) y en hipótesis del equipo.", "problema": "El mapa incluye los seis cuadrantes y la propuesta de valor, y su nota reconoce que se basa en hipótesis. Es de buena calidad, pero solo cubre al segmento principal (turista nacional), se numera como «Figura 4» sin Figuras 1 a 3 en el documento y la fuente de MINCETUR (2024) no figura en las referencias. Los datos del cuadro «Qué dice y hace» son hipótesis, lo cual es aceptable en esta etapa.", "mejora": "Numerar correlativamente las figuras y tablas, añadir el mapa del segmento secundario (trabajadores) o justificar por qué solo hay uno. Como recomendación para la siguiente etapa, las hipótesis del mapa de empatía deberán validarse con evidencia real en el capítulo 5 (AA2)."}, {"severidad": "importante", "titulo": "Faltan los indicadores de gestión", "ubicacion": "Capítulo 3", "cita": "", "problema": "No hay KPI. En el cap. 1 (p. 9) se promete medir el rendimiento de insumos, la cantidad de residuos y el uso de recursos para sustentar el ODS 12, pero no se definen.", "mejora": "Proponer de 4 a 6 indicadores con nombre, fórmula, meta y ejemplo de cálculo, que cubran lo comercial (conversión, ventas por canal), lo productivo (rendimiento de insumos, merma) y lo ambiental. Esqueleto de forma: «Indicador = (A / B) × 100; meta: X %»."}, {"severidad": "importante", "titulo": "Numeración de títulos del capítulo 3 incorrecta", "ubicacion": "pp. 22-25", "cita": ".3.4. Business Model Canvas", "problema": "Los títulos aparecen como «.3.4. Business Model Canvas», «1.1.1. Identificación…», «1.1.2. Competidores», «1.1.2.1. Competidores directos», «3.3.2. Competidores indirectos» y «3.3.3. Cuadro comparativo». Deben ser 3.2, 3.2.1 a 3.2.9, 3.3, 3.3.1, 3.3.2 y 3.3.3.", "mejora": "Usar la lista multinivel de títulos del procesador de textos y rehacer la numeración (3.1, 3.2, 3.2.1 a 3.2.9, 3.3). La página 21 con el título de capítulo suelto puede unirse con el contenido."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Hay mejoras (referencias, tablas con numeración parcial), pero faltan el índice, la carátula completa, la numeración y las fuentes de varias tablas y figuras, y las referencias del capítulo 3.", "observaciones": [{"severidad": "importante", "titulo": "Carátula incompleta y sin índice", "ubicacion": "Carátula (p. 1)", "cita": "Docente: Eanpier Brandol Ancorij Sanchez", "problema": "No figuran el título del proyecto, la sección ni el grupo, y el nombre del docente está mal escrito («Eanpier Brandol Ancorij Sanchez»; debe ser «Jeanpier Brandol Ancori Sanchez»). Tampoco hay índice.", "mejora": "Completar la carátula con el título del proyecto, la sección, el grupo y el docente, e insertar un índice automático. Nombrar el archivo como AA1_Sección_Informe del TAP_Grupo X."}, {"severidad": "importante", "titulo": "Referencias incompletas y con formato defectuoso", "ubicacion": "Referencias, pp. 26-27", "cita": "Centro Nacional de Planeamiento Estratégico. (2021). *Megatendencias 2050: grandes retos e implicancias*.", "problema": "La lista tiene nueve referencias con cursivas escritas como asteriscos. No incluye las fuentes del capítulo 3 (Inca Chef, CJ CheilJedang, K-Food Perú, Yopokki, Yaxa Perú, Ajinomoto del Perú, Tottus Perú, Nongshim, Fuku Store), ni PROMPERÚ (2025) del segmento complementario, ni MINCETUR (2024) del mapa de empatía; se citan «INEI, 2025» y «INEI (2025)» sin a ni b; MINCETUR (s. f.) figura en la lista como «Gerencia Regional de Comercio Exterior y Turismo de Arequipa». Las citas de CEPLAN (2021) no indican página.", "mejora": "Revisar una por una las citas y agregar todas las referencias faltantes en orden alfabético con sangría francesa, cursivas reales y año. Diferenciar INEI 2025a, 2025b. Verificar que cada URL abra el documento citado."}, {"severidad": "importante", "titulo": "Tablas y figuras sin numeración, título y fuente consistentes", "ubicacion": "p. 15 (ficha), p. 16 (tabla 2.4), p. 25 (cuadro de competidores), p. 22 (Figura 4) y p. 23 (BMC)", "cita": "Criterio / Inca Chef / Bibigo / Yopokki / Ajinomen / Nongshim", "problema": "La ficha técnica, la tabla problema-solución, el BMC y el cuadro comparativo no tienen número, título ni nota de fuente. Solo el mapa de empatía tiene «Figura 4», sin que existan las Figuras 1 a 3. En 2.5 hay rótulos de imágenes pegados en el texto, y en la p. 21 la portada del capítulo 3 ocupa una página sola.", "mejora": "Aplicar APA 7: «Tabla N» o «Figura N» en negrita, título en cursiva arriba y «Nota. Elaboración propia» o la fuente debajo, en forma correlativa en todo el documento. Eliminar los rótulos sueltos."}]}], "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 3, "responsabilidad": 3}}</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const all = D.secciones.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${D.fortalezas?.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${D.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>
    <div class="grade"><span class="big">${total}</span><span class="of">/ 20</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${D.prioridades.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

D.secciones.forEach((s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
  </section>`;
});

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const toc = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => ['s' + i, s.titulo, s.observaciones.length]));
document.getElementById('toc').innerHTML = toc.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
