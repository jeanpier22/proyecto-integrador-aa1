 solo hay edad, ciudad y ocupación, preguntas 1 a 3).", "AA2: Reformular la pregunta 9 sin condicional («si el sabor y la preparación son buenos») y eliminar el sesgo de las preguntas 6 a 8.", "AA2: Probar el precio del informe: agregar «¿Comprarías Adobito AQP a S/ 19,90?» y completar la pregunta 10 con «Menos de S/ 10», «Más de S/ 25» y «No pagaría».", "AA2: Agregar preguntas de canal, cantidad, propósito (consumo propio o regalo) y barreras de compra, que sostienen los bloques del BMC.", "AA2: Escribir una matriz hipótesis, pregunta, métrica y criterio de aceptación, definir muestra con cuota de turistas nacionales y complementar con una degustación del prototipo para validar la funcionalidad.", "AA2: Aplicar el instrumento, presentar resultados con porcentajes y número de respuestas, y derivar mejoras concretas al MVP (cap. 5).", "AA2: Elaborar el cap. 6 completo (hoy no existe): las 7 piezas a 3 años con S/ 19.90, receta costeada por unidad y cotización de maquila; sin esto el criterio Análisis presupuestal queda en 1.", "AA2: Aplicar la encuesta de 5.2.4 con n >= 30 turistas nacionales (más un segmento secundario aparte) y agregar 5.3-5.5: muestra, tablas con % y n, prueba de H1-H3 con umbral previo (p. ej. >= 40 % «probablemente/definitivamente sí» y >= 40 % «sí» a S/ 19.90).", "AA2: Producir una muestra real (maquila o laboratorio) y hacer una degustación de 10-20 personas (sabor, textura, rehidratación, tiempo real vs. 3-5 min); sin esto el MVP no valida la funcionalidad del producto.", "AA2: Cotizar 2 proveedores de liofilizado/deshidratado (lote mínimo, S/ por kg) y calcular el costo unitario de 60 g; verificar que el precio de S/ 19.90 (S/ 16,86 sin IGV) deje margen luego de la comisión del canal.", "AA2: Escribir en 4.3.4 por qué cada herramienta (Canva, maqueta, CapCut, Google Forms) y añadir las que faltan: ficha de receta, formato de degustación, hoja de costos; documentar los pasos realizados con fechas y evidencias (fotos).", "AA2: Justificar el precio frente a la competencia por porción reconstituida (no por envase): S/ 0,33 por gramo seco de Adobito frente a S/ 0,03 por gramo de comidas listas de Tottus; y definir precio al público vs. precio a tienda."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, analizadas críticamente para mostrar qué aportan al proyecto en relación con las megatendencias y los ODS.", "falta": "Se mantiene el nivel Logrado (fuentes oficiales y recientes; ahora con lectura crítica de cada dato). Para subir falta cerrar la bibliografía APA 7: faltan al menos 7 fuentes citadas en el texto, hay 2 entradas duplicadas y la URL de INEI 2025a es genérica."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencias vinculadas a megatendencias, ODS y necesidades del cliente.", "falta": "Cumple con cifras oficiales, causas y consecuencias, ODS y megatendencias; el problema ya se formula desde el cliente. Para llegar a Sobresaliente falta dimensionar al turista nacional (gasto o compra de productos típicos) y dar cifras al problema social."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Los seis apartados están completos y el segmento ya es consistente. Falta demostrar el diferencial con una comparación por criterios frente a Pouchamama (aún no aparece en 2.4)."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía argumentando la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "Actualización 20/11: ya se agregó el apartado 3.3.10 que argumenta la coherencia entre los nueve bloques, los KPI con fórmula (3.4) y la numeración corregida. Solo queda rotular el BMC y el mapa de empatía como figura o tabla con número, título y fuente."}], "viabilidad": {"resumen": "La versión nueva admite que el registro sanitario y la vida útil están pendientes, lo que es un avance. Los riesgos de fondo siguen abiertos: el trámite y la planta habilitada, la factibilidad de liofilizar un guiso de cerdo, el rotulado y la competencia de un liofilizado peruano ya existente. Conviene empezar a probarlos antes de la AA2.", "riesgos": [{"tema": "Regulación", "titulo": "Registro sanitario y planta habilitada (DIGESA)", "choque": "La ficha (p. 17) indica «Pendiente de gestión ante DIGESA, previo a la comercialización». Un alimento envasado con carne requiere registro sanitario y producción en un establecimiento con buenas prácticas de manufactura y HACCP; no puede elaborarse en una cocina doméstica. El BMC menciona «trámites sanitarios» en costos y «empresas especializadas en procesamiento» como socios (p. 35), pero no define dónde se fabricaría el prototipo.", "ideas": ["Averiguar en DIGESA el procedimiento y los requisitos del registro sanitario para alimentos deshidratados o liofilizados con carne.", "Explorar maquila con una planta habilitada en Arequipa o con laboratorios de industrias alimentarias de una universidad.", "Mientras no haya registro, limitar el MVP a degustaciones controladas y pruebas sensoriales, sin venta comercial."]}, {"tema": "Tecnología", "titulo": "Viabilidad técnica de liofilizar o deshidratar un guiso de cerdo", "choque": "El adobo es un guiso con grasa y carne de cerdo; la grasa dificulta la liofilización, puede enranciarse y la carne rehidratada suele quedar fibrosa. La ficha todavía no define si será deshidratado o liofilizado («según los resultados de las pruebas técnicas», p. 16), que implican costos e infraestructura muy distintos, y fija un objetivo de 6 meses de vida útil (p. 17). Los 3 a 5 minutos de preparación se declaran estimados.", "ideas": ["Buscar artículos científicos sobre liofilización y deshidratación de carnes y comidas preparadas para decidir la tecnología (las secciones 1.1.2 y 1.2.4 los mencionan, pero no se citan).", "Decidir si el prototipo usará cerdo magro, carne deshilachada u otra estrategia para controlar la grasa.", "Consultar con un tecnólogo de alimentos cómo estimar la vida útil (actividad de agua, pruebas aceleradas)."]}, {"tema": "Regulación", "titulo": "Octógonos de advertencia y empaque como souvenir", "choque": "Por la Ley 30021, un adobo concentrado probablemente supere los límites de sodio o grasas saturadas y deba llevar octógonos. La versión anterior los mencionaba en la ficha; la nueva ya no incluye el rotulado, aunque el producto se plantea como recuerdo gastronómico para turistas (Caso 3, p. 27).", "ideas": ["Estimar el perfil nutricional de una porción de 60 g con tablas de composición de alimentos (CENAN/INS) y compararlo con los parámetros de la Ley 30021.", "Evaluar ajustes de receta y medir en la prueba sensorial si se pierde la identidad del plato.", "Reincorporar el rotulado en la ficha técnica y diseñar el envase considerando el espacio de los octógonos."]}, {"tema": "Mercado", "titulo": "Competencia de un liofilizado peruano ya existente", "choque": "Pouchamama (p. 36) ya vende platos peruanos liofilizados a viajeros. La propuesta de Adobito AQP se diferencia por la identidad arequipeña, pero el diferencial depende de que un turista nacional prefiera un adobo liofilizado frente a otros recuerdos gastronómicos o al plato fresco en la picantería, y todavía no se argumenta con criterios.", "ideas": ["Construir la tabla comparativa por criterios que se pide en el cap. 2.", "Definir qué experiencia ofrece Adobito AQP que Pouchamama no cubre (por ejemplo, el vínculo con la picantería de origen o el souvenir regional).", "Considerar alianzas con picanterías reconocidas para dar legitimidad al producto."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "incompleto", "nota": "Indica «Instituto CERTUS», carrera, curso, docente e integrantes (p. 1), pero la carrera es una sola («Dirección de Empresas») para las cuatro integrantes; faltan el título del proyecto, la sección y el número de grupo, y el docente figura como «Jeanpier Brandol Ancorij Sanchez»; verificar el apellido."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Ya hay índice (p. 2), con páginas coincidentes con el PDF. La numeración de los apartados del cap. 3 es incorrecta («3.3 Identificación… 3.3.1 / 3.2.2…3.2.9», «3.4 Competidores / 3.3.1, 3.3.2»)."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "incompleto", "nota": "Hay contexto con cifras (pp. 4-6), antecedentes locales e internacionales (pp. 6-7) y causas y consecuencias (1.1.1, pp. 7-8). Se formula como «oportunidad» y el dato de INEI 2024 no trae cifra."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "incompleto", "nota": "Hay ODS 9 y 12 con metas (pp. 10-11), dos megatendencias de CEPLAN (pp. 11-12) y causas y consecuencias (1.2.3, pp. 12-13). El problema social es general, sin cifras; los apartados 1.1.2 y 1.2.4 duplican el título «Importancia de las fuentes bibliográficas»."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Descripción clara (p. 15); el público objetivo mencionado («estudiantes, trabajadores, turistas») no coincide con el segmento principal de la 2.5."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Tabla de texto con 20 características (pp. 15-18), con nota de elaboración propia y de validación pendiente. Sin número y título de tabla; ya no incluye rotulado ni octógonos."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Subsanado: beneficios funcionales y emocionales (pp. 18-19)."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "incompleto", "nota": "Tabla problema-solución y alternativas existentes (pp. 20-21); la diferenciación se enuncia pero no se demuestra con comparación por criterios; la tabla no tiene número ni fuente."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "incompleto", "nota": "Tres segmentos con segmentación y datos de MINCETUR, PROMPERÚ e INEI (pp. 22-25). Edad y tamaño del principal sin definir; datos de turistas extranjeros bajo un segmento complementario mixto; rótulos de imágenes sueltos («Gobierno del Perú», «Boletines», «INEI», «Visita Arequipa»)."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Cinco casos hipotéticos rotulados como tales (pp. 26-28)."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Tabla con sus seis bloques para el turista nacional (p. 30), con nota de hipótesis. Sin número y título de figura o tabla; erratas («un recuerdo auténtica»)."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Imagen con los 9 bloques (p. 31) y explicación de cada bloque en texto (pp. 32-35), coherente con la ficha. Sin figura numerada ni fuente; numeración errónea; la explicación describe pero no argumenta la coherencia entre bloques."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Cinco competidores (tres directos y dos indirectos) con fortalezas, debilidades, ventaja competitiva y estrategia de diferenciación (pp. 36-39). Faltan la matriz comparativa y las referencias; rotulado con numeración errada."}, {"codigo": "3.x", "apartado": "Indicadores de gestión", "estado": "ausente", "nota": "No hay KPI con fórmula y ejemplo de cálculo."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Nueve referencias (pp. 40-41) con asteriscos de formato; no figuran al menos 12 fuentes citadas en el texto, incluidas las empresas del 3.4."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "El capítulo conserva sus cifras, ODS y megatendencias y ahora desarrolla las metas específicas de los ODS 9 y 12. Persisten la formulación desde la solución y la falta de dimensionamiento del problema, y se perdió parte del análisis crítico de los datos.", "observaciones": [{"severidad": "importante", "titulo": "El problema sigue formulado desde la solución", "ubicacion": "1.1, pp. 5-6 y 1.2, p. 9", "cita": "Este contexto representa una oportunidad para explorar nuevas formas de presentar y difundir preparaciones tradicionales como el adobo arequipeño", "problema": "El apartado 1.1 describe un contexto favorable y una oportunidad comercial, pero no enuncia qué dificultad concreta tiene el cliente ni a quién afecta. El apartado 1.2 abre con «existe la necesidad de impulsar la innovación tecnológica» (p. 9), que justifica el producto, no un problema social. Hablar de lo que «merece ser evaluada» (p. 6) confirma que se parte de la solución (liofilizar) y no del cliente.", "mejora": "Redactar en un párrafo el problema desde el cliente, con la forma «los turistas nacionales que visitan Arequipa no pueden llevarse o consumir después el adobo porque…», y después mostrar cómo las cifras lo respaldan."}, {"severidad": "importante", "titulo": "Las cifras describen el contexto, no dimensionan el problema; el dato de INEI 2024 no trae cifra", "ubicacion": "1.1, pp. 4-5", "cita": "el Instituto Nacional de Estadística e Informática (INEI, 2024) presenta información sobre la participación del gasto en alimentos consumidos fuera del hogar", "problema": "La cita de INEI (2024) no incluye ningún dato y tampoco figura en las referencias. El 59 % de Ipsos (p. 4) y el tiempo de cocina (2 h 11 min frente a 58 min) no están acotados a Arequipa ni al segmento principal, y se perdió la lectura crítica que la versión anterior hacía de cada cifra («no representa una medición directa de la demanda»). Además, los porcentajes de PromPerú de la p. 5 (99 % y 96 %) corresponden a turistas extranjeros, no al segmento de turistas nacionales.", "mejora": "Reemplazar o completar con cifras acotadas al segmento principal (por ejemplo, gasto en alimentación de los turistas nacionales o compra de productos típicos como recuerdo en Arequipa, con MINCETUR o PromPerú), poner la cifra concreta del INEI o retirar la cita, y volver a señalar el alcance de cada dato."}, {"severidad": "importante", "titulo": "Problema social general, sin cifras ni respaldo de la FAO", "ubicacion": "1.2, pp. 9-10 y 1.2.3, pp. 12-13", "cita": "Estas condiciones pueden limitar la diversificación de productos alimenticios regionales y reducir las oportunidades de generar valor agregado a partir de la gastronomía local.", "problema": "Las causas y consecuencias del problema social están redactadas con «pueden» y «posibles», sin un solo dato que las respalde. Los ODS ahora traen metas (9.4, 9.5, 12.2, 12.3, 12.5), lo cual se reconoce como mejora, pero las pérdidas de alimentos se mencionan sin cifra: la FAO (2024) se cita en la p. 6 solo como «se desperdician alimentos» y las megatendencias de CEPLAN (pp. 11-12) no incluyen datos que las acoten. La meta 12.3 queda sin evidencia.", "mejora": "Incorporar la cifra de la FAO (2024) que ya tienen en las referencias y, si es posible, una de CEPLAN o del Ministerio de Desarrollo Agrario sobre pérdidas poscosecha o en la venta al detalle; vincular cada meta ODS con un dato del problema."}, {"severidad": "sugerencia", "titulo": "Apartados duplicados sobre las fuentes y denominación inconsistente del producto", "ubicacion": "1.1.2, p. 8; 1.2.4, p. 13; pp. 9, 10 y 12", "cita": "se respalda la necesidad de desarrollar una sopa instantánea basada en el adobo arequipeño", "problema": "Los apartados 1.1.2 y 1.2.4 tienen el mismo título y explican en abstracto para qué sirven las fuentes, además de afirmar que se usan «artículos científicos sobre liofilización y deshidratación», que no se citan en ninguna parte. El producto se llama «sopa instantánea» en las pp. 9, 10 y 12, pero en el resto del informe es un «adobo arequipeño instantáneo» en vaso.", "mejora": "Reemplazar ambos apartados por un breve análisis de qué aporta cada fuente al problema (como en la versión anterior) o eliminarlos, y usar una sola denominación del producto en todo el informe."}]}, {"etiqueta": "Capítulo II", "titulo": "Definición de propuestas de valor únicas", "resumen": "Capítulo completo y mejor estructurado: ya tiene el 2.3 y una ficha transparente sobre lo que falta validar. Pendientes: demostrar el diferencial, alinear el segmento y separar a los turistas extranjeros.", "observaciones": [{"severidad": "importante", "titulo": "El diferencial está enunciado, pero no demostrado frente al competidor más cercano", "ubicacion": "2.4, pp. 20-21 y 3.4, p. 36", "cita": "Adobito AQP busca diferenciarse de las siguientes alternativas: Picanterías y restaurantes… Servicio de delivery… Presentaciones congeladas… Sopas instantáneas", "problema": "La lista de alternativas de la p. 21 no incluye a Pouchamama, que ya vende platos peruanos liofilizados a viajeros (y que el propio informe analiza en la p. 36), ni a los antecedentes locales de la p. 7 (La Sazón de la Abuela, La Despensa). Además, la diferenciación se afirma por frase («no están elaboradas específicamente a partir de la receta del adobo») y no con criterios comparables; lo mismo ocurre con la ventaja competitiva del cap. 3, que se apoya en «identidad regional específica» sin explicar por qué es defendible.", "mejora": "Elaborar una tabla comparativa con criterios (formato y tecnología, necesidad de frío, identidad regional, ocasión de consumo, canal) que incluya a esos competidores y a Adobito AQP, y redactar una conclusión de una o dos frases sobre el diferencial que sí es único."}, {"severidad": "importante", "titulo": "Segmento principal inconsistente entre 2.1 y 2.5, y sin edad ni tamaño", "ubicacion": "2.1, p. 15; 2.5, pp. 22-25", "cita": "Está dirigido principalmente a estudiantes, trabajadores, turistas y personas que desean disfrutar de este plato típico", "problema": "La 2.1 menciona estudiantes como público principal, que no aparecen como segmento en la 2.5; allí el principal son los turistas nacionales, con rango de edad «que se determinará» (p. 22) y sin una estimación de tamaño (solo arribos totales, 1 207 036, no turistas que consumirían el producto). El segmento complementario (p. 24) mezcla a residentes de Arequipa y consumidores de otras ciudades, lo que no define a un cliente concreto.", "mejora": "Redactar la 2.1 con el mismo segmento principal de la 2.5, definir una edad tentativa (hipótesis) y estimar el tamaño con los datos de MINCETUR (por ejemplo, arribos nacionales por procedencia), y separar claramente el segmento complementario."}, {"severidad": "importante", "titulo": "Datos de turistas extranjeros usados sin constituir un segmento propio", "ubicacion": "1.1, p. 5 y 2.5, p. 25", "cita": "Aunque estos datos corresponden a turistas extranjeros y no a consumidores nacionales, permiten reconocer la importancia de la gastronomía como parte de la experiencia turística de Arequipa.", "problema": "Reconocemos que la 2.5 aclara el origen de los datos. Sin embargo, los porcentajes de PromPerú (2025) sobre el turista extranjero (99 % y 96 %) respaldan en el cap. 1 (p. 5) el contexto del cliente nacional y, en el cap. 2, se colocan bajo un segmento «complementario» de consumidores regionales, sin que el turista extranjero tenga segmentación, tamaño ni propuesta propia. Esas cifras solo sirven para ese segmento.", "mejora": "Mantener a los turistas nacionales como segmento principal y, si se considera al turista extranjero, crearlo como segmento separado, con su propia segmentación, datos de PromPerú y caso de uso; en el cap. 1 usar para los nacionales datos de turismo interno."}, {"severidad": "sugerencia", "titulo": "La ficha técnica deja definiciones abiertas que conviene fijar", "ubicacion": "2.2, pp. 16-18", "cita": "Deshidratación o liofilización, según los resultados de las pruebas técnicas.", "problema": "La ficha es honesta al marcar vida útil, tiempo y registro sanitario como pendientes, y eso se valora. Quedan abiertas la tecnología de conservación y el rotulado nutricional (la versión anterior mencionaba los octógonos), que condicionan el empaque y la vida útil.", "mejora": "Elegir una tecnología tentativa con una fuente técnica que la respalde, y reincorporar el rotulado (sodio y grasas saturadas, octógonos si corresponde)."}, {"severidad": "sugerencia", "titulo": "Casos de uso hipotéticos; la validación real se exigirá en el cap. 5", "ubicacion": "2.6, pp. 26-28", "cita": "Su aceptación deberá comprobarse mediante entrevistas, encuestas y pruebas sensoriales del prototipo", "problema": "Los cinco casos están rotulados como hipotéticos, lo cual es aceptable para la AA1. Los casos 4 y 5 (profesional que vive solo y consumidor interesado) no se enlazan con ningún dato del cap. 1 o 2.5. Se recuerda que la validación real con clientes corresponde al capítulo 5 (AA2).", "mejora": "Conectar cada caso con un dato o una frase del segmento; reservar la validación real con clientes para el cap. 5."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El capítulo avanzó de forma clara: explica los nueve bloques y rehízo los competidores con fortalezas y estrategia de diferenciación. Faltan los indicadores de gestión, la matriz comparativa, la numeración y argumentar la coherencia entre bloques.", "observaciones": [{"severidad": "importante", "titulo": "Faltan los indicadores de gestión", "ubicacion": "Capítulo 3", "cita": "", "problema": "La estructura del TAP pide indicadores de gestión (KPI con fórmula y ejemplo de cálculo) en el capítulo 3 y el informe no los tiene. Las actividades clave (p. 34: pruebas de calidad, vida útil, características sensoriales) ya ofrecen insumos para definirlos.", "mejora": "Agregar de 3 a 5 indicadores (por ejemplo, rendimiento de insumos por lote, merma, costo por unidad, tasa de recompra, satisfacción en la prueba sensorial), cada uno con su fórmula y un ejemplo numérico."}, {"severidad": "importante", "titulo": "La explicación de los 9 bloques es descriptiva y no argumenta la coherencia", "ubicacion": "3.2, pp. 32-35", "cita": "La principal fuente de ingresos de Adobito AQP será la venta de su presentación individual de 60 gramos", "problema": "Los bloques guardan coherencia con la ficha y con el segmento de turistas nacionales (vaso de 60 g, S/ 19.90, tiendas turísticas, redes sociales), pero cada uno se redacta por separado. No se argumenta cómo se sostienen entre sí (por ejemplo, por qué los canales elegidos alcanzan al turista nacional, qué socios cubren la actividad de liofilización o el trámite sanitario, o por qué la relación con el cliente es digital si el producto se compra en tienda). La imagen del BMC (p. 31) no tiene número, título ni fuente.", "mejora": "Agregar un párrafo de cierre que relacione propuesta de valor, segmento, canales, ingresos y socios, y rotular el BMC como «Figura n» con título y «Elaboración propia»."}, {"severidad": "importante", "titulo": "Competidores: sin matriz comparativa y con la clasificación directo/indirecto por revisar", "ubicacion": "3.4, pp. 36-39", "cita": "Pouchamama comercializa comidas peruanas liofilizadas, orientadas principalmente a excursionistas y viajeros.", "problema": "El análisis mejora mucho respecto a la versión anterior, pero ya no hay una tabla comparativa que permita ver las diferencias: hay que leer cinco fichas. Solo Pouchamama compite por el formato; Kuik (congelado) y La Mundial (picantería) son más bien alternativas de otra categoría, y no coinciden con las alternativas listadas en el cap. 2.4. Además, ninguna de las fuentes del 3.4 está en las referencias.", "mejora": "Agregar una tabla resumen con los cinco competidores y los criterios de comparación, revisar qué competidores son directos por formato y cuáles indirectos por necesidad, e incluir las fuentes en la bibliografía."}, {"severidad": "importante", "titulo": "Numeración errónea de los títulos del capítulo 3", "ubicacion": "3.2 a 3.4, pp. 31-36 y p. 2", "cita": "3.2.2. Propuesta de valor", "problema": "Tras «3.2 Business Model Canvas» aparece «3.3 Identificación y características de los 9 bloques» y sus apartados se numeran «3.3.1», «3.2.2»…«3.2.9»; luego «3.4 COMPETIDORES» contiene «3.3.1» y «3.3.2». El índice (p. 2) reproduce el error.", "mejora": "Renumerar: 3.1 Mapa de empatía, 3.2 BMC con 3.2.1 a 3.2.9, 3.3 Competidores (3.3.1 y 3.3.2) y 3.4 Indicadores de gestión, y actualizar el índice."}, {"severidad": "sugerencia", "titulo": "Mapa de empatía sin número, título ni fuente, con erratas", "ubicacion": "3.1, p. 30", "cita": "Quiere llevar un recuerdo auténtica", "problema": "El mapa de empatía se presenta como tabla con nota «Elaboración propia», lo cual es válido, pero sin numeración ni título. Hay una errata en «un recuerdo auténtica». Cubre solo al turista nacional; los segmentos secundarios no tienen mapa, lo que es aceptable si se aclara.", "mejora": "Rotular como «Tabla n» o «Figura n» con título y fuente, corregir la redacción y dejar dicho que el mapa corresponde al segmento principal."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, referencias y tablas", "resumen": "Hay avances (índice, notas en la ficha y en el mapa), pero el rigor de trabajo académico sigue incompleto: carátula, referencias y rotulado de tablas y figuras.", "observaciones": [{"severidad": "importante", "titulo": "Carátula incompleta", "ubicacion": "Carátula, p. 1", "cita": "Carrera: Dirección de Empresas", "problema": "La carátula no tiene el título del proyecto, la sección ni el número de grupo; indica una sola carrera para las cuatro integrantes, y el apellido del docente figura como «Ancorij», que conviene verificar.", "mejora": "Completar la carátula con título, sección, grupo, carrera de cada integrante y el nombre correcto del docente, siguiendo el formato del TAP."}, {"severidad": "importante", "titulo": "Referencias incompletas: al menos 12 fuentes citadas no figuran en la lista", "ubicacion": "Referencias, pp. 40-41", "cita": "Pouchamama, s. f.; Kuik, s. f.; Tottus Perú, s. f.; Paladar Gourmet, s. f.; Gestión, 2024; Encuentro, 2023", "problema": "La lista tiene 9 entradas y faltan en ella: INEI (2024), PROMPERÚ (2025), Gestión/Flanqueo (2024), Encuentro (2023), La Despensa (s. f.), Ministry of Agriculture, Forestry and Fisheries of Japan (s. f.), Tiffins (s. f.), Pouchamama, Kuik, Picantería La Mundial, Tottus Perú y Paladar Gourmet. «INEI, 2025» no distingue entre 2025a y 2025b; la referencia de MINCETUR (s. f.) figura a nombre de la Gerencia Regional. Persisten asteriscos de formato y la URL de INEI (2025a) apunta a un archivo genérico («Lib2010/libro.pdf»).", "mejora": "Completar las referencias en APA 7, hacer coincidir autor y año entre el texto y la lista, usar 2025a y 2025b en el texto, quitar los asteriscos y verificar la URL."}, {"severidad": "importante", "titulo": "Tablas y figuras sin numeración, título y fuente consistentes", "ubicacion": "pp. 15-18, 20-21, 23-25, 30 y 31", "cita": "Gobierno del Perú / Boletines", "problema": "La ficha técnica (pp. 15-18), la tabla problema-solución (pp. 20-21), el mapa de empatía (p. 30) y el BMC (p. 31) no tienen número, título ni fuente en el formato APA 7 (la ficha y el mapa sí traen «Nota. Elaboración propia»). Entre las pp. 23 y 25 quedan rótulos sueltos («Gobierno del Perú», «Boletines», «INEI», «Visita Arequipa») que parecen restos de capturas de las fuentes.", "mejora": "Numerar cada tabla y figura con título arriba y fuente abajo (por ejemplo, «Tabla 1. Ficha técnica de Adobito AQP» / «Elaboración propia, a partir de…») y eliminar los rótulos sueltos."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Instrumento de validación del MVP y del modelo de negocio", "resumen": "Instrumento ordenado pero insuficiente: no filtra al segmento principal, induce respuestas positivas, no prueba el precio de S/ 19,90 ni el canal, y no valida la funcionalidad del MVP.", "observaciones": [{"severidad": "critico", "titulo": "El formulario no identifica al segmento principal del informe", "ubicacion": "Preguntas 1 a 3; informe 2.5 (turistas nacionales)", "cita": "«¿En qué ciudad resides actualmente?» (Arequipa, Lima, otra ciudad del Perú, fuera del Perú)", "problema": "El informe define como segmento principal a los turistas nacionales que visitan Arequipa (2.5) y el BMC (3.2) construye canales, relación y precio sobre ellos. El formulario solo pregunta edad, ciudad de residencia y ocupación. No hay forma de saber si el encuestado visitó Arequipa por turismo ni si acostumbra llevar productos gastronómicos como recuerdo o regalo. Los resultados mezclarían residentes, estudiantes y turistas, y no validarían la demanda del segmento que sostiene el modelo.", "mejora": "Agregar al inicio un filtro «¿Has visitado Arequipa por turismo en los últimos 2 años?» con salto condicional, y la pregunta «Cuando viajas, ¿sueles llevar productos gastronómicos como recuerdo o regalo?» (siempre, a veces, rara vez, nunca). Analizar los resultados por segmento."}, {"severidad": "critico", "titulo": "La pregunta de compra está condicionada y regala la respuesta", "ubicacion": "Pregunta 9", "cita": "Intención de compra «si el sabor y la preparación son buenos» (definitivamente sí / probablemente sí / no estoy seguro(a) / probablemente no / definitivamente no)", "problema": "Condicionar la compra a que el producto sea sabroso y práctico elimina la duda principal: si el producto real cumple eso. Cualquier persona razonable responderá «sí», por lo que el porcentaje de intención de compra no sirve como métrica de viabilidad y tampoco permite proyectar volúmenes en el cap. 6. Se mide además intención declarada, no comportamiento.", "mejora": "Formular sin condicionales: «Después de ver la imagen y la descripción, ¿comprarías Adobito AQP?». Complementar con una pregunta de conducta pasada («¿cuándo fue la última vez que compraste un recuerdo gastronómico y cuánto pagaste?») y un compromiso real (dejar WhatsApp para probar o reservar)."}, {"severidad": "importante", "titulo": "Preguntas con sesgo positivo y redundantes (6, 7 y 8)", "ubicacion": "Preguntas 6, 7 y 8", "cita": "«Nada atractiva / Muy atractiva» (6); «Nada interesado(a) / Muy interesado(a)» (7); opciones de la 8: «disfrutar del sabor del adobo en cualquier momento», «preparación práctica y rápida», «innovación de un plato tradicional en formato instantáneo», «acceso a comida regional fuera de Arequipa»", "problema": "Las preguntas 6 y 7 miden prácticamente lo mismo (atractivo e interés) con escalas de 5 puntos sin punto neutro rotulado. La 8 solo ofrece atributos favorables, redactados con lenguaje promocional, y no permite responder «ninguna»; obliga a elegir una ventaja aunque no la perciba. Ninguna pregunta busca barreras ni objeciones (autenticidad, conservantes, porción de 60 g, precio, que no sepa igual).", "mejora": "Conservar una sola pregunta de interés, agregar «Ninguna» y «Otra» en la 8 o pedir ordenar las tres más importantes, y añadir una pregunta de selección múltiple «¿Qué te preocuparía de un adobo instantáneo?» con «Ninguna» y «Otra»."}, {"severidad": "importante", "titulo": "El precio de referencia no se prueba y la escala está cortada", "ubicacion": "Pregunta 10; informe 3.2.5 (S/ 19,90)", "cita": "«Menos de S/ 10.00 / S/ 10.00 – 14.90 / S/ 15.00 – 19.90 / S/ 20.00 – 24.90»", "problema": "El informe fija S/ 19,90 como precio de venta (ficha técnica y BMC), pero el rango «S/ 15.00 – 19.90» no distingue si la persona aceptaría exactamente ese precio, y no existe «Más de S/ 25» ni «No pagaría», por lo que quien no compraría debe marcar un rango. Tampoco hay referencia de comparación (un plato de adobo en picantería, un recuerdo gastronómico, otros alimentos instantáneos). Aunque el precio sea referencial, el cap. 5 debe tomar de esta pregunta la disposición de pago que alimente el cap. 6.", "mejora": "Agregar «¿Comprarías Adobito AQP a S/ 19,90?» (sí / depende / no), completar los rangos con «Más de S/ 25,00» y «No pagaría», y preguntar cuánto gastó o gastaría en un recuerdo gastronómico. Si es posible, usar dos precios en versiones distintas para comparar."}, {"severidad": "importante", "titulo": "No se mide canal, cantidad ni propósito de compra", "ubicacion": "Formulario completo; informe 3.2.3 (canales) y 3.2.5 (ingresos)", "cita": "Canales del BMC: tiendas turísticas, redes sociales (sin pregunta correspondiente en el formulario)", "problema": "El BMC sostiene canales y volumen sobre hipótesis, y el formulario no recoge ni una respuesta sobre dónde esperaría encontrar el producto la persona (hotel, mercado, tienda turística, aeropuerto, supermercado, en línea), cuántas unidades compraría ni si sería para consumo propio o regalo. Sin eso no se valida el modelo de negocio, solo el interés general.", "mejora": "Agregar tres preguntas: canal preferido de compra, cantidad por compra (1, 2 a 3, 4 o más) y propósito (consumo propio o regalo), y contrastarlas con los canales y la relación con el cliente del BMC."}, {"severidad": "importante", "titulo": "No valida la funcionalidad del MVP", "ubicacion": "Sección «Adobito AQP» (descripción e imagen); pregunta 11", "cita": "«Adobo arequipeño instantáneo en un vaso individual de aproximadamente 60 gramos»", "problema": "La descripción indica formato y peso, pero no cómo se prepara (agua caliente, tiempo), qué contiene ni su vida útil, que son parte de la ficha técnica. La imagen es solo un recurso gráfico, no un prototipo probado. La encuesta no mide sabor, textura, aroma ni tiempo de preparación, que son los atributos centrales de un adobo y que el propio informe dice que deben comprobarse con el prototipo. La pregunta 11 (sugerencias, abierta y obligatoria) es insuficiente para derivar mejoras al MVP.", "mejora": "Completar la descripción con preparación, contenido y vida útil tentativa. Organizar una degustación de 10 a 20 personas con calificación de 1 a 5 de sabor, textura, aroma y parecido con el adobo tradicional, y registrar el tiempo de preparación real. Hacer la 11 opcional y orientada («¿qué cambiarías del producto?»)."}, {"severidad": "importante", "titulo": "No hay hipótesis, muestra ni criterio de aceptación", "ubicacion": "Instrumento y cap. 5 (no incluido en el informe disponible)", "cita": "—", "problema": "No se ve una matriz que relacione cada pregunta con una hipótesis del modelo de negocio (segmento, problema, propuesta de valor, precio, canal), ni la muestra, la forma de llegar a turistas nacionales ni el resultado mínimo que se aceptará (por ejemplo, «al menos 40 % compraría a S/ 19,90»). En la AA2 ya se exige recolección real y conclusiones con métricas; sin criterios previos no podrá concluir si el modelo es viable ni qué mejorar.", "mejora": "Elaborar la tabla hipótesis, pregunta, métrica y criterio de aceptación. Definir una muestra con cuota de turistas nacionales (idealmente 30 o más del segmento), registrar el canal de difusión (evitar que respondan solo familiares y amigos), probar el formulario con 5 personas del segmento y luego aplicarlo."}, {"severidad": "sugerencia", "titulo": "Opciones de respuesta incompletas", "ubicacion": "Preguntas 1 y 4", "cita": "Edad: «18 – 24 / 25 – 34 / 35 – 44 / 45 – 54»; frecuencia: «todos los días / varias veces por semana / una vez por semana / algunas veces al mes»", "problema": "En la edad faltan las personas de 55 años o más y no hay salida para menores de 18. En la frecuencia de consumo de alimentos instantáneos faltan «Casi nunca» y «Nunca», por lo que quien no los consume debe marcar una opción que no le corresponde, lo que sesga los datos.", "mejora": "Agregar «55 años o más», un fin de formulario para menores de 18 y las opciones «Casi nunca» y «Nunca»."}, {"severidad": "sugerencia", "titulo": "La pregunta 5 no explora cómo se obtiene hoy el adobo ni la diferenciación", "ubicacion": "Pregunta 5; informe 2.4 y 3.4", "cita": "«¿Conoces el adobo arequipeño?» (lo he probado / lo conozco pero nunca lo he probado / no lo conozco)", "problema": "Mide conocimiento, pero el informe se diferencia de alternativas (picanterías, presentaciones congeladas, Pouchamama). El formulario no pregunta cómo consigue hoy el adobo la persona ni qué alternativa compraría en su lugar.", "mejora": "Agregar «¿Cómo consigues hoy adobo arequipeño?» (picantería, lo preparo, delivery, producto envasado, no lo consumo) y vincular las respuestas con el cuadro de competidores."}, {"severidad": "sugerencia", "titulo": "Presentación y formato del formulario", "ubicacion": "Encabezado y sección «Adobito AQP»", "cita": "Título del formulario sin nombre; requiere cuenta de Google", "problema": "El formulario aparece como «Título sin título» y exige iniciar sesión en Google, lo que reduce la tasa de respuesta, especialmente de turistas. Además, la imagen no tiene texto alternativo.", "mejora": "Nombrar el formulario, desactivar el requisito de inicio de sesión, agregar texto alternativo a la imagen y mantener la duración total en 5 a 6 minutos."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Modelo de negocio: cambios del 11/11 y vacíos para el cap. 6", "resumen": "El cap. 3 mejoró en forma y cautela (numeración, competidores con fuente, indicadores con fórmula), pero la estructura de costos y los ingresos siguen sin cifras, y la comparación de precios con la competencia no es válida por porción.", "observaciones": [{"severidad": "importante", "titulo": "Comparación de precios sin unidad homogénea", "ubicacion": "3.5.1 a) Pouchamama y 3.5.2 a) Tottus", "cita": "«su precio es elevado frente al propuesto para Adobito AQP» / «seco de res con frejoles y arroz de 500 gramos … S/ 14.90»", "problema": "Adobito cuesta S/ 19,90 por 60 g (S/ 0,33 por gramo seco), mientras Tottus vende 500 g a S/ 14,90 (S/ 0,030/g) y el arroz chaufa 450 g a S/ 10,90 (S/ 0,024/g): Adobito sería 11 a 14 veces más caro por gramo. Pouchamama (S/ 40) no indica gramaje, por lo que no se puede afirmar que sea «elevado». La ventaja competitiva «precio» solo se sostiene si se compara por porción reconstituida (250 ml) y por propuesta (souvenir regional).", "mejora": "Armar una tabla con precio, gramos, porción servida y S/ por porción para los 5 competidores. Argumentar el precio con valor de recuerdo/regalo (no con precio bajo) y probarlo en la encuesta (P12-P13)."}, {"severidad": "importante", "titulo": "Estructura de costos sin cifras", "ubicacion": "3.3.9", "cita": "«será necesario elaborar una estructura de costos detallada … y evaluar si el precio preliminar de S/ 19.90 resulta económicamente viable»", "problema": "El propio informe posterga lo que el cap. 6 exige: costo unitario, fijos y variables, viabilidad del precio. Además, S/ 19,90 incluye IGV: neto S/ 16,86; con comisión de tienda de 30 % el ingreso neto es S/ 11,81 por unidad (verificado con Python).", "mejora": "Reemplazar el párrafo por una tabla con receta por unidad de 60 g (carne, cebolla, ají panca, ajo, vinagre, especias), costo de maquila por unidad, vaso+tapa+etiqueta, análisis y logística. Definir precio al público y precio a tienda."}, {"severidad": "sugerencia", "titulo": "Indicadores de gestión sin metas", "ubicacion": "3.4", "cita": "«las metas específicas de cada indicador deberán establecerse posteriormente»", "problema": "Cinco indicadores con fórmula pero sin meta ni línea base; no se vinculan con las hipótesis H1-H3 del cap. 4.", "mejora": "Fijar metas para la validación y el año 1 (p. ej. conversión >= 15 %, satisfacción >= 80 %, margen bruto >= 45 %) y enlazarlas con los supuestos del cap. 6."}, {"severidad": "sugerencia", "titulo": "Inconsistencia de canales entre secciones", "ubicacion": "2.2 ficha técnica, 3.3.3 y 4.2.3 (Won't)", "cita": "Ficha: «minimarkets, supermercados»; 3.3.3: supermercados «en una etapa posterior»; MoSCoW: «distribución masiva a supermercados» = Won't", "problema": "Los canales de venta aparecen distintos según la sección; el cap. 6 necesita saber qué canal genera los ingresos del año 1 y qué margen se cede.", "mejora": "Unificar: año 1 = ferias, tiendas turísticas y WhatsApp; supermercados desde el año 2 si hay registro sanitario. Reflejarlo en el presupuesto de ingresos."}, {"severidad": "sugerencia", "titulo": "Cambios en caps. 1 y 2", "ubicacion": "1.1 (arribos) y 2.2", "cita": "MINCETUR: «1 207 036 arribos nacionales» (antes 1 661 466 totales); vida útil «objetivo de 6 meses, pendiente de estudios»", "problema": "Mejora: la cifra de arribos ahora corresponde al segmento (nacionales). Pero no se dimensiona el mercado objetivo (cuántos de esos 1,2 millones compran recuerdos gastronómicos), dato necesario para proyectar unidades.", "mejora": "Estimar mercado: arribos nacionales x % que compra souvenir gastronómico (resultado de P5) x % de captura realista; usarlo como techo de ventas en el cap. 6."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Planteamiento y herramientas del MVP", "resumen": "Capítulo bien estructurado (hipótesis, objetivos, MoSCoW, herramientas) y coherente con la propuesta de valor, pero el MVP es solo una maqueta, un video y un formulario: no hay muestra del alimento, no se documentan pasos ni se cuantifican objetivos.", "observaciones": [{"severidad": "critico", "titulo": "El MVP no valida el producto: es una maqueta del envase", "ubicacion": "4.1 y 4.3.1", "cita": "«La maqueta no constituye un alimento terminado ni demuestra que los parámetros de preparación y conservación hayan sido comprobados»", "problema": "La propuesta de valor es un alimento práctico y sabroso; sin una muestra real no se prueban sabor, textura, rehidratación ni los 3-5 minutos. La prueba sensorial está en «Should … siempre que las condiciones técnicas lo permitan» (4.2.3), es decir, opcional. Con solo maqueta se mide el atractivo del diseño, no la funcionalidad ni la viabilidad del modelo, y el cap. 6 no tendría un costo unitario real.", "mejora": "Subir la muestra alimenticia a Must: producir 20-30 unidades en una planta de maquila o laboratorio universitario (con costo cotizado) y hacer una degustación con ficha 1-5 de sabor, textura, aroma, parecido al adobo tradicional y tiempo real de preparación; meta: promedio >= 4 en sabor."}, {"severidad": "importante", "titulo": "Objetivos sin metas medibles y duplicados", "ubicacion": "4.2.2 y 4.3.2; hipótesis 4.2.1", "cita": "«Evaluar el interés de los turistas nacionales …» / «Interés comercial: identificar si los turistas muestran interés …»; H3: «estarían dispuestos a pagar S/ 19.90»", "problema": "4.3.2 repite lo dicho en 4.2.2. Ninguna hipótesis ni objetivo tiene umbral (n, %), por lo que en el cap. 5 no se podrá decidir si el MVP «pasa» o «falla».", "mejora": "Escribir criterios SMART: H1 >= 60 % de turistas con P11 «probablemente/definitivamente sí»; H3 >= 40 % «sí» a S/ 19.90 en P12; H2 >= 50 % elige practicidad/transporte en P9. Fusionar 4.2.2 y 4.3.2."}, {"severidad": "importante", "titulo": "No se evidencian los «pasos seguidos» ni las evidencias del MVP", "ubicacion": "4.3 y 4.3.7", "cita": "«se incorporarán fotografías de la maqueta física del envase y capturas del video demostrativo»", "problema": "La rúbrica (nivel 4) pide sustentar TODOS los pasos. El texto usa futuro: no hay fechas, versiones del diseño, fotos de la maqueta ni capturas del video; tampoco se explica cómo se pasó de la idea a la maqueta ni qué cambió entre versiones.", "mejora": "Añadir una línea de tiempo (idea, boceto en Canva, maqueta, video, formulario, aplicación) con fecha y figuras numeradas con fuente; mostrar al menos dos versiones del envase y qué se corrigió."}, {"severidad": "importante", "titulo": "Herramientas sin sustentar y faltan las del producto físico", "ubicacion": "4.3.4", "cita": "Tabla: Canva, Maqueta física, CapCut, Google Forms", "problema": "Las cuatro herramientas son adecuadas para una prueba de concepto de bajo costo, pero solo se enuncia su uso; no se explica cómo aportan a funcionalidad, usabilidad o viabilidad técnica. Faltan las herramientas centrales de un alimento: receta estandarizada, ficha sensorial, proveedor de liofilizado/deshidratado y laboratorio.", "mejora": "Agregar una columna «Por qué esta herramienta / alternativa descartada» y filas para: ficha de receta (g por ingrediente), formato de degustación, planta de maquila (nombre y lote mínimo), laboratorio (análisis microbiológico), hoja de cálculo de costos."}, {"severidad": "importante", "titulo": "Viabilidad de producción sin responsable: ¿quién deshidrata o liofiliza?", "ubicacion": "3.3.8 y 4.2.3 (Won't: «adquisición de maquinaria propia»)", "cita": "«empresas que brinden servicios de procesamiento y conservación de alimentos»", "problema": "El informe descarta maquinaria propia pero no nombra ni cotiza a nadie que procese el producto. La liofilización es costosa y la tecnología aún no está elegida («deshidratación o liofilización, según los resultados»). Sin ese dato, el costo variable y la capacidad de producción son una incógnita.", "mejora": "Contactar al menos 2 maquiladores/laboratorios (plantas de alimentos en Arequipa, universidades con planta piloto) y registrar lote mínimo, S/ por kg y plazo; elegir la tecnología con una prueba comparativa."}, {"severidad": "sugerencia", "titulo": "Marco regulatorio y etiquetado no entran al MVP", "ubicacion": "2.2 (registro sanitario pendiente) y 4.3.3", "cita": "«Registro sanitario: Pendiente de gestión ante DIGESA»; información del producto: «ingredientes, contenido neto e instrucciones»", "problema": "Para vender en tiendas y supermercados se requiere registro sanitario, rotulado y fecha de vencimiento; el prototipo de etiqueta no incluye registro, lote, vencimiento ni advertencias. La vida útil de 6 meses es solo objetivo.", "mejora": "Añadir a la etiqueta del MVP: registro sanitario (en trámite), lote, fecha de vencimiento, ingredientes en orden decreciente y advertencias. Presupuestar análisis de estabilidad y laboratorio en el cap. 6 (el registro en DIGESA no tiene costo según su Comunicado 05-2026)."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Validación del modelo de negocio con encuesta (n = 105) y entrevistas", "resumen": "El 20/11 se agrega 5.2.5 con resultados reales: n = 105, porcentajes por pregunta y 4 entrevistas en Anexos. Es un avance claro frente al 11/11 (solo instrumento). Falta lo que convierte datos en validación: aislar al segmento principal, contrastar H1-H3, concluir y proponer mejoras al MVP.", "observaciones": [{"severidad": "critico", "titulo": "Resultados sin aislar al segmento principal", "ubicacion": "5.2.5, preguntas 2 y 4", "cita": "«el 48,6 % de los participantes reside en Arequipa, mientras que el 31,4 % vive en Lima ... el 6,7 % reside fuera del país»; «78,1 % ... ha visitado Arequipa»", "problema": "4.3.5 dice que «se deberá distinguir entre las respuestas del segmento principal y las del segmento secundario», pero todas las cifras son del total de 105. Solo 51,4 % reside fuera de Arequipa (cálculo propio con las cifras del informe); no se sabe qué % de turistas nacionales compraría.", "mejora": "Filtrar por P2 (no Arequipa, no extranjero) y P4 = Sí; recalcular P8, P11, P12 y P13 solo para ese grupo y reportar su n."}, {"severidad": "critico", "titulo": "Sin contraste de hipótesis, conclusiones ni mejoras al MVP", "ubicacion": "5.2.5 y cierre del cap. 5", "cita": "El capítulo termina en la guía de entrevista (5.1.4) y no hay conclusiones", "problema": "No se retoman H1-H3 (4.2.1) ni se fijan umbrales. Las dudas medidas (sabor distinto 44,8 %; inocuidad 22,9 %; conservación 22,9 %) no se traducen en cambios del MVP. Es lo que separa 3 de 4 en el criterio.", "mejora": "Tabla H1/H2/H3: umbral, resultado, decisión. Lista de mejoras al MVP con evidencia (degustación, registro sanitario, fecha de vencimiento, información nutricional que piden los entrevistados)."}, {"severidad": "importante", "titulo": "El precio no está respaldado por la validación", "ubicacion": "H3 (4.2.1), P12 y Anexos", "cita": "«45,7 % ... entre S/ 15 y S/ 19,90 ... 44,8 % ... S/ 10 a S/ 14,90»; entrevistas: «S/ 10 a S/ 15», «entre S/ 8 y S/ 15»", "problema": "Solo 8,6 % pagaría S/ 20-24,90. H3 plantea S/ 19,90 y el cap. 6 usa S/ 18,89, en el tramo alto o sobre lo que dicen 3 de los 4 entrevistados. No se sabe cuántos aceptan S/ 18,89.", "mejora": "Reportar % de aceptación por tramo acumulado, no afirmar que H3 se confirma y justificar o ajustar el precio."}, {"severidad": "importante", "titulo": "Error de redacción y cobertura del análisis", "ubicacion": "5.2.5 pregunta 3; pregunta 15; 5.3", "cita": "El párrafo de la P3 (ocupación) es idéntico al de la P2 (ciudad)", "problema": "No se muestra el resultado de ocupación. La P15 (abierta) no se analiza. 5.3 se numera 5.1.1-5.1.4 (duplica 5.1) y sigue en futuro; las entrevistas están solo como resúmenes en Anexos, sin síntesis en el capítulo.", "mejora": "Corregir el párrafo, codificar la P15, renumerar 5.3.x y agregar una síntesis de entrevistas con hallazgos y citas."}, {"severidad": "sugerencia", "titulo": "Canal preferido distinto al del modelo", "ubicacion": "P13 vs. 3.3.3 (Canales)", "cita": "«42,9 % ... supermercados o minimarkets, seguido del 21 % ... tiendas de productos regionales»", "problema": "El hallazgo favorece supermercados, que suelen implicar márgenes de canal altos; el PE del cap. 6 no los incluye.", "mejora": "Reflejar el canal y su comisión en el precio neto y en el PE."}, {"severidad": "sugerencia", "titulo": "Falta evidencia sensorial/técnica", "ubicacion": "4.3.7, 5.2.5", "cita": "«no constituye evidencia de que el alimento haya superado pruebas de conservación, inocuidad, estabilidad o evaluación sensorial»", "problema": "La principal duda del público (sabor diferente) no se probó con muestra.", "mejora": "Degustación de 10-20 personas con registro de sabor, textura y rehidratación."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Proyección financiera y presupuestaria (6.1-6.11)", "resumen": "El 20/11 el cap. 6 pasa de inexistente a presente, con cifras tomadas del Excel (inversión S/ 16 669,74; ingresos año 1 S/ 29 414,96; utilidad neta S/ 1 493,46; PE 1 235 unidades). Verificado con Python: las cuentas internas cuadran salvo diferencias menores. Pero es un borrador: conserva instrucciones de plantilla, no trae las tablas en el texto, calcula los indicadores a 5 años cuando se exigen 3 y, con sus propios flujos, a 3 años el VAN es negativo.", "observaciones": [{"severidad": "critico", "titulo": "Indicadores a 5 años; a 3 años el proyecto no se recupera", "ubicacion": "6.10", "cita": "«VAN S/ 2,689.38 ... TIR 20.51% ... PRI 3.35 años»; «(Pendiente de recalcular)»", "problema": "El propio informe admite el horizonte de 5 años (2026-2030). Recalculado con Python usando sus flujos (3 211,46; 4 518,70; 6 244,25), inversión 16 669,74 y COK 15 %: VAN a 3 años = S/ -6 354,68; TIR negativa (aprox. -7,6 %); flujo acumulado al año 3 = S/ -2 695,33 (cálculo propio). La rúbrica pide viabilidad a 3 años.", "mejora": "Recalcular con 3 años y decidir: subir precio/volumen, bajar inversión o costos, o concluir que el modelo no es viable en ese horizonte."}, {"severidad": "critico", "titulo": "Texto de plantilla y avisos sin borrar; tablas ausentes", "ubicacion": "6.2 a 6.11", "cita": "«Del Excel, copia las tablas de la hoja: Proy Costos»; «Debes cambiar ese rótulo por ...»; «No presentes todavía estos indicadores como resultados definitivos»", "problema": "El capítulo tiene instrucciones de redacción pegadas como si fueran contenido y en el texto exportado no consta ninguna tabla (salvo supuestos 6.1 e indicadores 6.10). No se pudo verificar si hay imágenes de tablas: confirmar en el Doc.", "mejora": "Pegar las tablas numeradas con fuente, eliminar toda instrucción y dejar solo texto final impersonal."}, {"severidad": "importante", "titulo": "Piezas del cap. 6 incompletas", "ubicacion": "6.1, 6.3, 6.8, 6.11", "cita": "«AÑO 4 (2029) ... AÑO 5 (2030)»; «6.11 ... ¿Qué hoja debes copiar? Ninguna por ahora»", "problema": "Faltan el flujo mensual del año 1 y un presupuesto de egresos consolidado; la demanda es a 5 años; 6.11 (sensibilidad) solo describe el método; los S/ 1 500 de costos indirectos (6.2) no se reflejan en el estado de resultados descrito. Los años se rotulan 2026-2028 aunque el negocio aún no opera.", "mejora": "Agregar flujo mensual año 1, egresos consolidados, sensibilidad con escenarios y alinear horizonte y fechas."}, {"severidad": "importante", "titulo": "Precio y margen sin respaldo del mercado validado", "ubicacion": "6.4 y 6.5", "cita": "«costo total unitario aproximado de S/ 16.43 ... margen estimado del 15 % ... S/ 18.89»", "problema": "Verificado con Python: 25 578,23 / 1 557 = 16,43 y x 1,15 = 18,89 (margen de 13,0 % sobre el precio). Costos fijos + variables = 14 706 + 10 872,58 = 25 578,58, no 25 578,23; 1 557 x 18,89 = 29 411,73 vs. 29 414,96 reportado. Se cita el precio de Tottus (S/ 15,00) sin explicar por qué cobrar 26 % más, y la encuesta y 3 entrevistas ubican el pago en S/ 10-15. No hay comisión de canal ni IGV.", "mejora": "Mostrar precio neto de IGV y de canal, justificar el diferencial y reconciliar las diferencias numéricas."}, {"severidad": "importante", "titulo": "Punto de equilibrio global y margen de seguridad frágil", "ubicacion": "6.9", "cita": "«punto de equilibrio aproximado de 1,235 unidades al año ... margen de seguridad aproximado de 20.68%»", "problema": "Verificado: 14 706 / 11,91 = 1 235 y 1 - 1 235/1 557 = 20,7 %. Con utilidad neta de S/ 1 493,46 (5,1 % de ventas, cálculo propio) y demanda de unas 130 unidades/mes sin sustento en la encuesta, una caída de ventas del 21 % anula la ganancia. El PE no se separa por canal (lo reconoce el propio texto).", "mejora": "PE por canal con comisión y escenarios; vincular la demanda de 1 557 con el SOM y con datos de la encuesta."}, {"severidad": "sugerencia", "titulo": "Coherencia con el MVP y con el Excel", "ubicacion": "6.2, 6.6", "cita": "«servicio de liofilización o deshidratación»; equipos «cocina industrial, olla de acero inoxidable, refrigeradora ...»", "problema": "El costo incluye servicio tercerizado de liofilizado/deshidratado pero la inversión no lista ese equipo y el MVP (4.3.1) aún no prueba el producto. Capital aportado S/ 20 000 vs. inversión S/ 16 669,74 (saldo S/ 3 330,26, verificado). Las observaciones del Excel de PE (logro 50 %) aplican igualmente.", "mejora": "Aclarar quién procesa el producto y sustentar con cotizaciones."}]}], "fecha_aa2": "11/11/2026", "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 4, "responsabilidad": 3}, "calificacionAA2": {"validacion": 1}, "enlaces": [{"titulo": "Informe del TAP (Google Docs)", "url": "https://docs.google.com/document/d/17tvVeXOwbJYlneYi10Z5Y0-mmiSG36KGvAwSkklrZs0"}, {"titulo": "Formulario de validación", "url": "https://docs.google.com/forms/d/e/1FAIpQLSfozh5WNxgU0xJ09nTWS_CZXJ4WY8G0d-94apMVeW60I0r0ng/viewform"}, {"titulo": "Excel de punto de equilibrio (cap. 6)", "url": "https://docs.google.com/spreadsheets/d/1smprw16ijmMTRbhE8txfdjoC-0tOF9-y/edit"}], "costosAA2": {"hoja": "Adobito AQP", "tipo_cambio": 3.5, "escenarios": ["Piloto", "Año 1", "Crecimiento"], "supuestos": [{"concepto": "Clientes atendidos al mes", "unidad": "clientes", "valores": [50.0, 200.0, 800.0], "nota": "SUPUESTO sobre el volumen del informe (no declarado)."}, {"concepto": "Mensajes de utilidad por WhatsApp API", "unidad": "mensajes", "valores": [0.0, 200.0, 1000.0], "nota": "Piloto: app gratuita (sin API). Año 1+: solo si pasan a la API."}, {"concepto": "Mensajes de marketing por WhatsApp API", "unidad": "mensajes", "valores": [0.0, 100.0, 500.0], "nota": "Ídem."}, {"concepto": "¿Dominio propio? (1 = sí)", "unidad": "1/0", "valores": [0.0, 1.0, 1.0], "nota": "Opcional (web/QR/tienda en línea)."}, {"concepto": "Horas de desarrollo inicial de la plataforma", "unidad": "horas", "valores": [30.0, 30.0, 30.0], "nota": "SUPUESTO, OPCIONAL: página web sencilla con catálogo y enlace a WhatsApp. Si no la desarrollan, es S/ 0."}, {"concepto": "Horas de mantenimiento al mes", "unidad": "horas", "valores": [0.0, 2.0, 4.0], "nota": "SUPUESTO: bolsa de horas mensual para corrección de errores, actualizaciones y soporte."}, {"concepto": "Encargado fijo de actualizaciones (S/ al mes; 0 = usar bolsa de horas)", "unidad": "S/ / mes", "valores": [0.0, 0.0, 0.0], "nota": "OPCIONAL: si contrata a una persona con pago mensual fijo para actualizar la plataforma, escriba aquí su pago; reemplaza a la bolsa de horas."}], "costos": [{"concepto": "WhatsApp Business API", "valores": [0.0, 45.6, 228.03], "nota": "La app gratuita de WhatsApp Business no cuesta; esto es solo si usan la API"}, {"concepto": "Dominio propio (prorrateado)", "valores": [0.0, 5.83, 5.83], "nota": ""}, {"concepto": "Imprevistos", "valores": [0.0, 5.14, 23.39], "nota": ""}], "total_pen": [0.0, 56.5822, 257.2442], "primer_pago_pen": [0.0, 127.1655, 327.8275], "ingreso_etiqueta": "Ventas brutas (S/ 19,90 por unidad, 1 unidad por cliente)", "ingreso_pen": [995.0, 3980.0, 15920.0], "chat_pen": null, "desarrollo_pen": 1500.0, "mantenimiento_pen": [0.0, 80.0, 160.0], "total_con_mant_pen": [0.0, 136.5822, 417.2442], "tarifa_desarrollo": 50, "tarifa_mantenimiento": 40, "pct_ingreso": [0.0, 0.0142, 0.0162], "por_usuario_pen": [0.0, 0.2829, 0.3216], "notas": ["Sitio web estático en Firebase Hosting o similar: dentro de la capa gratuita; el costo real es solo el dominio.", "Formularios (Google Forms) y la app WhatsApp Business no tienen costo. La API de WhatsApp solo conviene con automatización y volumen.", "No requieren base de datos, IA ni servidores para el MVP: su costo digital es marginal."], "elaborado": "11/11/2026", "primer_pago_total_pen": [1500.0, 1627.1655, 1827.8275], "costo_anio1_pen": [1500.0, 3138.986, 6506.93], "necesidades": {"nombre": "Adobito AQP", "resumen": "Producto físico: sopa instantánea de adobo de 60 g. No necesita nube; el costo está en insumos, deshidratado o liofilizado, empaque, permisos sanitarios y comercialización.", "items": [{"rubro": "Insumos del adobo", "necesidad": "Ingredientes de la receta arequipeña para una porción de 60 g.", "origen": "Inferido", "proveedor": "Mercados y mayoristas de Arequipa (p. ej. Mercado San Camilo, distribuidores de abarrotes)", "producto": "Carne, ají panca, especias, chicha de jora u otros", "precio": "Cotizar por kilo", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "Calcular el costo de insumos por unidad de 60 g con receta estandarizada."}, {"rubro": "Deshidratado o liofilizado", "necesidad": "Producción de la sopa instantánea (liofilizada o deshidratada). El prototipo aún está por probar sensorialmente.", "origen": "Declarado", "proveedor": "Planta de maquila alimentaria o laboratorio de procesamiento", "producto": "Servicio de maquila por lote", "precio": "Cotizar por kilo o por lote", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "Pedir 2 cotizaciones con lote mínimo."}, {"rubro": "Empaque y etiqueta", "necesidad": "Presentación individual de 60 g con instrucciones de preparación (250 ml de agua caliente).", "origen": "Declarado", "proveedor": "Fabricantes de empaques flexibles e imprentas", "producto": "Sachet o envase con impresión y etiqueta", "precio": "Cotizar por millar", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "Incluir el rotulado obligatorio de alimentos envasados."}, {"rubro": "Registro sanitario", "necesidad": "Para vender alimentos procesados envasados en tiendas y supermercados.", "origen": "Inferido", "proveedor": "DIGESA (Ministerio de Salud) por la VUCE", "producto": "Registro sanitario de alimento", "precio": "Sin costo para el administrado: DIGESA (Comunicado 05-2026, 03/08/2026) indica que los registros sanitarios continúan sin costo; si la VUCE cobra derechos, los devuelve", "pen": 0, "frecuencia": "única", "estado": "Verificado", "nota": "Fuente: comunicado oficial de DIGESA. Sí cuestan los análisis de laboratorio y los gastos del expediente (ver otros rubros). Confirmar el trámite vigente en la VUCE al iniciar."}, {"rubro": "Análisis de laboratorio y vida útil", "necesidad": "Sustentar la inocuidad y la fecha de vencimiento del producto.", "origen": "Inferido", "proveedor": "Laboratorios acreditados ante INACAL", "producto": "Análisis microbiológico y fisicoquímico", "precio": "Cotizar por análisis", "pen": null, "frecuencia": "única", "estado": "Cotizar", "nota": ""}, {"rubro": "Difusión en redes", "necesidad": "Facebook, Instagram y TikTok (3.2.3).", "origen": "Declarado", "proveedor": "Meta Ads / TikTok Ads", "producto": "Publicidad pagada (opcional)", "precio": "Presupuesto propio del grupo", "pen": null, "frecuencia": "mensual", "estado": "Cotizar", "nota": "Las cuentas orgánicas no cuestan."}, {"rubro": "Recepción de pedidos", "necesidad": "WhatsApp Business como canal de atención y pedidos (app, no API).", "origen": "Declarado", "proveedor": "Meta", "producto": "WhatsApp Business (aplicación)", "precio": "Gratis. La API cobra por mensaje en Perú: marketing aprox. USD 0,0703 y utilidad USD 0,02 a 0,03 (alza desde el 01/10/2026), según fuentes de terceros que citan la tarifa de Meta", "pen": 0, "frecuencia": "mensual", "estado": "Referencial", "nota": "Precios de la API: confirmar en la lista oficial de Meta si pasan a usarla."}, {"rubro": "Ventas en ferias y puntos de venta", "necesidad": "Canales: tiendas, zonas turísticas, minimarkets, supermercados y ferias.", "origen": "Declarado", "proveedor": "Organizadores de ferias y tiendas aliadas", "producto": "Alquiler de stand y comisión de venta", "precio": "Cotizar por feria y por punto de venta", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": ""}]}, "estados_precio": {"Verificado": "Precio leído de la fuente oficial o coincidente en varias fuentes el 11/11/2026.", "Referencial": "Cifra de referencia: confirmar con la calculadora o lista de precios oficial del proveedor antes de presentar.", "Cotizar": "No hay precio público confiable: el grupo debe pedir cotización a 2 o más proveedores y anexarla."}}, "notasAA2": {"id": "grupo-adobo-instantaneo", "fecha": "20/11/2026", "mvp": 3, "herramientas": 2, "validacion": 3, "presupuesto": 2, "compromiso": 4, "total": 14, "justificacion": {"mvp": "Define hipótesis H1-H3 (4.2.1), objetivos y una matriz MoSCoW coherentes con la propuesta de valor para turistas nacionales, y admite que la maqueta «no constituye un alimento terminado» (4.3.1). Se queda en 3 (no 4) porque los objetivos no tienen metas, 4.2.2 y 4.3.2 se repiten, los pasos seguidos no se documentan («se incorporarán fotografías», 4.3.7) y el MVP no incluye muestra comestible.", "herramientas": "Canva, maqueta, CapCut y Google Forms (4.3.4) sirven para una prueba de concepto de bajo costo, pero se enuncian sin sustentar su aporte a funcionalidad ni viabilidad técnica. Faltan las herramientas propias de un alimento: receta estandarizada, planta de maquila o laboratorio (nadie deshidrata ni liofiliza según el informe) y ficha sensorial; por eso queda en 2.", "validacion": "Ahora hay datos reales: 5.2.5 reporta una encuesta de n = 105 con porcentajes por pregunta (atractivo 72,3 % en 4-5; compra 73,3 % entre definitivamente y probablemente; pago S/ 15-19,90 = 45,7 % y S/ 10-14,90 = 44,8 %; sabor distinto al tradicional como mayor duda, 44,8 %) y 4 entrevistas en Anexos. Pasa de 2 a 3 por tener resultados e inferencias iniciales. No llega a 4: (a) no aisla al segmento principal (48,6 % reside en Arequipa y 6,7 % fuera del pais; 78,1 % visito Arequipa; no se filtra la P4), pese a que 4.3.5 dice que «se debera distinguir»; (b) no contrasta H1-H3 contra umbrales ni hay conclusiones; (c) no hay mejoras al MVP derivadas de los datos; (d) el texto de la P3 repite el de la P2 (copia); (e) la P15 abierta y las entrevistas no se analizan en el cap. 5 (solo resumenes en Anexos; los 3 entrevistados que dan rango de precio dicen S/ 10-15, S/ 8-15 y S/ 10-15, por debajo de S/ 18,89-19,90); (f) 5.3 usa numeracion 5.1.1-5.1.4 duplicada y el texto sigue en futuro; (g) sin prueba sensorial.", "presupuesto": "El 20/11 aparece el cap. 6 (6.1-6.11) con cifras: demanda 1 557/1 713/1 918 unidades, costo unitario S/ 6,98 (S/ 837,96 / 120), gastos adm. S/ 11 166 y de venta S/ 3 540, precio S/ 18,89, ingresos S/ 29 414,96, inversion S/ 16 669,74, EERR y flujo anual, PE de 1 235 unid., VAN S/ 2 689,38, TIR 20,51 %, PRI 3,35 anos. Sube de 1 a 2, no a 3: (1) el texto exportado no trae las tablas (solo cifras en parrafos) y conserva instrucciones de plantilla («Del Excel, copia las tablas...», «Debes cambiar ese rotulo...») y avisos «Pendiente de recalcular»; (2) indicadores calculados a 5 anos (2026-2030) y la rubrica pide 3: recalculado con Python con los flujos del propio informe (3 211,46; 4 518,70; 6 244,25; inversion 16 669,74; COK 15 %), el VAN a 3 anos es S/ -6 354,68, la TIR negativa (aprox. -7,6 %) y el acumulado al ano 3 sigue en S/ -2 695,33: a 3 anos NO se recupera la inversion (consistente con el PRI de 3,35 anos que el informe declara); (3) sin flujo mensual del ano 1 ni presupuesto de egresos consolidado en el informe; (4) 6.11 sensibilidad vacio (solo descripcion metodologica); (5) PE global, sin separar por canal, aunque la encuesta prefiere supermercados/minimarkets (42,9 %) y no hay comision de canal; (6) precio S/ 18,89 (15 % sobre costo total unitario S/ 16,43) frente a S/ 19,90 de H3 y a los rangos de las entrevistas; (7) ano 1 rotulado «2026» y demanda a 5 anos. Coherente con el Excel de PE (logro 50 %, nivel 2).", "compromiso": "a criterio del docente"}, "cambios_vs_6nov": "Mejoró mucho: el 06/11 el texto llegaba solo al cap. 3; el 11/11 aparecen el cap. 4 completo (hipótesis, objetivos, MoSCoW, herramientas, usuarios) y el cap. 5 con metodología e instrumento de 16 preguntas que incorporan las correcciones del formulario. Caps. 1-3 reescritos con más cautela y mejor numeración. Sigue igual de grave: no hay resultados de la encuesta ni cap. 6, ni elevator pitch.", "camino_al_20": ["Cap. 6: recalcular VAN, TIR, PRI, ROI y B/C a 3 anos (con los flujos actuales el VAN a 3 anos da S/ -6 354,68; calculo propio) y concluir con honestidad sobre viabilidad: ajustar precio, volumen o costos hasta recuperar la inversion en el horizonte pedido, o justificar por que no.", "Cap. 6: pegar las tablas reales (costos unitarios, gastos, precios, ingresos mensual y anual, inversion, EERR, flujo mensual ano 1, flujo a 3 anos, PE), borrar todas las instrucciones de plantilla, corregir el rotulo «UNIDADES» y el desfase de S/ 0,94 en ingresos, y reducir la demanda a 3 anos.", "Cap. 6: completar 6.11 con escenarios reales (precio -10 %, ventas -20 %, costo +15 %, comision de canal 30 %) y un PE por canal (directo, tienda, supermercado), alineado con el canal mas preferido en la encuesta (supermercados 42,9 %).", "Cap. 5: separar los resultados del segmento principal (turistas nacionales: residentes fuera de Arequipa que visitaron la ciudad) del secundario; corregir el texto de la P3 (repite el de la P2) y analizar la P15 abierta; indicar fecha, medio y criterio de muestra.", "Cap. 5: contrastar H1-H3 con umbrales definidos y concluir. Resolver la contradiccion de precio: H3 propone S/ 19,90, pero 44,8 % pagaria solo S/ 10-14,90 y 3 entrevistas dan S/ 8-15; justificar S/ 18,89 o bajarlo.", "Cap. 5: documentar mejoras concretas al MVP derivadas de los datos (conservar sabor tradicional, registro sanitario/vida util, informacion nutricional, fecha de vencimiento, instrucciones claras) y hacer una degustacion con muestra real.", "Cap. 4: cuantificar objetivos con metas, fusionar 4.2.2 y 4.3.2, incluir fotos reales de la maqueta y detallar herramientas del producto fisico (receta estandarizada, maquila/laboratorio, ficha sensorial) para subir MVP y Herramientas.", "Preparar el elevator pitch (6x6, letra >= 20, todos participan) con n = 105, % clave, precio y VAN/TIR a 3 anos."], "ajuste_docente": "20/11/2026: +1 punto en Compromiso individual (3→4) por decisión del docente; no proviene de cambios en el informe.", "cambios_vs_11nov": "Caps. 3 y 4 sin cambios (diff identico), por lo que mvp 3 y herramientas 2 no bajan. Cap. 5: se agregan 5.2.5 Resultados (n = 105, 14 preguntas con % y breve lectura) y 4 entrevistas en Anexos; el instrumento 5.1-5.2.4 es el mismo salvo espacios. Cap. 6: aparece en cifras (6.1-6.11) a partir del Excel, con instrucciones de plantilla y avisos aun sin borrar. Elevator pitch: no consta. Nada empeoro."}, "calculadoraXlsx": "calculadora-adobito-aqp-0495c675.xlsx", "excelPE": {"id": "grupo-adobo-instantaneo", "estado": "calificado", "revisado": "18/11/2026 (auditoría completa)", "archivo": "D:\\05 - Personal\\Proyecto de Claude\\Cursos\\Proyecto Integrador\\entregas\\AA2_excel\\grupo-adobo-instantaneo.xlsx", "logro": 50.0, "nivel": 2, "logro_auto": 70, "aviso": "logro_auto solo mide si el contenido aparece; la revisión experta (coherencia con el informe, precios, supuestos) define el logro.", "tecnico": {"hojas": ["Producción", "Carátula", "Mercado TAM-SAM-SOM", "Anexo 2 Proy Demanda", "Proy Costos", "Proy Gastos", "Clasificación de Costos", "Precios", "Proy Ingresos", "Inversión", "EERR", "Prestamos", "Flujos", "Punto de Equilibrio", "Gráficos", "PE"], "formulas": 2343, "numeros_pegados": 641, "pct_formulas": 79, "errores_formula": [], "graficos": 12}, "criterios": [{"clave": "inversion", "nombre": "Inversión inicial", "peso": 10, "puntaje": 7.5, "comentario": "Pieza «Estructura de inversión»: existe. Total S/ 16 669,74 (Inversión!F36; antes 17 070,32) con 18 ítems, cantidad, precio, vida útil, depreciación mensual (EERR!C15 = S/ 143,16) y financiamiento de S/ 20 000 de aportes. AVANCE: el capital de trabajo ya no está pegado, ahora es fórmula (Inversión!E35:F35 = 'Clasificación de Costos'!M17 = S/ 5 639,74; antes valor pegado de 6 040,32). Pendientes: (a) faltan proveedor y cotización por ítem (precios digitados sin fuente); (b) los trámites sanitarios (S/ 800, B34) agrupan registro, laboratorio y vida útil; (c) el capital de trabajo (5 640) sigue sumado en la inversión (Flujos!C15) y a la vez el flujo mensual resta los déficits de los meses 1–6, lo que duplica el desembolso: sin ese doble conteo la inversión neta sería S/ 11 030; (d) no hay equipo de deshidratado/liofilizado mientras el costo unitario incluye S/ 420 de «Servicios tercerizados (liofilizacion-deshidratado)»: aclarar si se terceriza. Se mantiene 75 %. AUDITORÍA 18/11: recalculado con Python, total S/ 16 669,74 correcto (F36 = SUM(F18:F35)); aportes S/ 20 000 (4 socios × 5 000, Inversión!C42:C45) ≥ inversión: «Viable». Nuevo: F18:F34 y H18:N34 son números pegados (no fórmulas) y la depreciación total omite la fila 18 (ver Calidad). Se mantiene 75 %.", "señal_auto_pct": 67, "faltan_palabras": ["desarrollo"]}, {"clave": "costos", "nombre": "Costos y gastos", "peso": 20, "puntaje": 10, "comentario": "Pieza «Estructura de costos y gastos / egresos»: incompleta (tope 50 %). Es correcta la receta (Proy Costos, 7 insumos), la separación fijo/variable (Clasificación de Costos!I34 = S/ 14 706; J34 = S/ 10 872) y los gastos administrativos (S/ 11 166) y de venta (S/ 3 540). AVANCES verificados en la versión nueva: (a) la columna FUENTE (Proy Costos G9:G17) ya no está vacía: Rico Pollo (carne), Hipermercados Tottus (cebolla, ají panca, ajo, chicha de jora, vinagre), Procesadora Agroindustrial La Joya (servicio de liofilización/deshidratado) y Terrapack (envases); (b) se retiró el 36 000 pegado de Clasificación de Costos (E5, E22 vacíos; E17 y E34 = 0). Pendientes: (1) la FUENTE solo nombra un proveedor por rubro, sin monto cotizado, fecha ni anexo y no hay hoja «Cotizaciones»: la regla fija máx. 50 % para costos «Cotizar» con un solo proveedor; (2) el lote de la receta pasó de 90 a 120 packs (Proy Costos!E19 = F19/120) y el costo unitario bajó de S/ 9,31 a S/ 6,98 sin que conste el motivo, mientras el costo total del lote (S/ 837,96) no cambió; (3) K16 contiene «=0,85*120» (= S/ 102) junto al servicio de liofilización, pero el costo que se usa sigue siendo S/ 420 (F16): no consta qué representa ni cuál es el precio vigente (si se usara 102, el costo unitario sería S/ 4,33; cálculo propio con Python); (4) los indirectos de S/ 1 500/año (Proy Costos!O35/C39) siguen sin llegar a EERR, flujo ni PE; (5) faltan comisión del canal (tiendas, ferias), IGV, laboratorio y vida útil como rubros propios; (6) no existe un presupuesto de egresos consolidado como el del modelo; (7) sueldo de administrador S/ 568 (antes 565) sin sustento. Se mantiene 50 %. AUDITORÍA 18/11: recalculado, lote S/ 837,96 / 120 = S/ 6,983 (Proy Costos!E19); CV año 1 = 6,983 × 1 557 = S/ 10 872; CF 14 706 = 11 166 + 3 540. Nuevos: (a) el administrador cobra S/ 568/mes (Proy Gastos!C7:N7 = S/ 6 816/año), sin gratificaciones, CTS ni EsSalud; contrastar con la remuneración mínima vigente (verificar el monto oficial: no consta en el archivo) y sustentar; (b) mano de obra directa S/ 45 por lote de 120 packs (Proy Costos!F18) sin sustento; (c) el informe (3.3.9) menciona mantenimiento de equipos, almacenamiento, distribución, pruebas de desarrollo y análisis de calidad como costos: el Excel no tiene rubro de mantenimiento ni de almacenamiento/distribución, y las pruebas solo caben en Inversión!B34 (S/ 800); (d) los gastos de los años 2–5 se repiten planos (Proy Gastos!D16:G21 = C16), sin inflación, mientras los indirectos sí crecen 3 % con el valor escrito dentro de la fórmula; (e) las cantidades de insumos (21 kg crudos por 120 packs de 60 g) no muestran rendimiento ni merma. Se mantiene 50 %.", "señal_auto_pct": 60, "faltan_palabras": ["proveedor", "cotizacion"]}, {"clave": "ingresos", "nombre": "Ingresos", "peso": 15, "puntaje": 7.5, "comentario": "Pieza «Presupuesto de ingresos»: existe. Precio × unidades con fórmulas (Proy Ingresos, año 1 S/ 29 414; antes S/ 32 958) y estacionalidad mensual explicada en Anexo 2 (supera al modelo en detalle mensual); crecimiento +10/12/10/8 %. CAMBIOS: el margen de beneficio subió de 13 % a 15 % (Precios!C13) y, al bajar el costo unitario, el precio final pasó de S/ 21,17 a S/ 18,89 (Precios!C27 = C14 = CTU 16,43 × 1,15). El precio de la encuesta (Precios!C22 = 19,90, ahora rotulado «según encuesta 2026») y el del competidor (Precios!C18 = S/ 15, rotulado Tottus; antes 17) se registran, pero el precio final sigue siendo cost-plus y difiere de los S/ 19,90 del informe sin explicar por qué se descarta el precio del cliente (coherencia: precio distinto al validado). Pendientes: (a) la validación del cap. 5 aún no entrega resultados: el volumen no sale de datos medidos; (b) el SOM de 1 560 al año equivale a 130 packs/mes de capacidad, pero la proyección llega a 250–279 packs en nov–dic (Anexo 2 M26:N26), el doble de esa capacidad; (c) TAM/SAM digitados e incoherentes (ver mejora de demanda); (d) años 2–5 superan la capacidad sin inversión adicional; (e) no se desglosa IGV. AUDITORÍA 18/11: el puntaje vigente (7,5/15) equivale a 50 %, no a 75 % como decía el rótulo; se corrige el rótulo y se mantiene el puntaje, porque el precio del Excel (S/ 18,89, Precios!C27) difiere del informe (S/ 19,90, ficha técnica 2.2 y 3.3.5) sin explicación, la demanda aparece con tres cifras (1 497 Anexo 2!O8, 1 557 O26, 1 560 Mercado!D16) y la nota de Anexo 2!P26 «Sin superar los 1560 de capacidad operativa» solo se cumple en el total anual: la capacidad es 130 packs/mes y julio–diciembre proyectan 132, 190, 184, 201, 250 y 279 (cálculo propio con Python). Nivel final: 50 %.", "señal_auto_pct": 75, "faltan_palabras": ["volumen"]}, {"clave": "pe", "nombre": "Punto de equilibrio", "peso": 20, "puntaje": 10, "comentario": "Pieza «Punto de equilibrio»: existe. Hoja PE con costos fijos S/ 14 706 (enlazado a Clasificación de Costos!I34), margen de contribución S/ 11,91 (18,89 − 6,98), PE = 1 235 packs/año y S/ 23 331 con fórmulas vivas (PE!C11: html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.notasAA2 ? [['nota-aa2', 'Calificación AA2 (/20)', '']] : D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.prototipoHtml ? [['prototipo-aa2', 'Prototipo', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.excelPE ? [['excel-pe', 'Excel de punto de equilibrio', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
