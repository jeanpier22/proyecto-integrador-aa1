<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.scorebox { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-adobo-instantaneo", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "Adobito AQP: adobo arequipeño instantáneo", "grupo": "Grupo (sin número)", "seccion": "No indicada", "fecha": "04/11/2026 (3.ª versión) · formulario AA2 revisado el 06/11/2026", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Davita Lucero Aguilar Choquiluque", "María Cristina Quispe Rivera", "Alexandra Cuba Aroni", "Sarai Virginia Champi Hermoza"], "dictamen": "menor", "resumen": "La tercera versión corrige varias de las observaciones más relevantes de la anterior: el informe ya tiene índice (p. 2); el apartado 2.3 Beneficios clave, que estaba vacío, ahora está desarrollado con beneficios funcionales y emocionales (pp. 18-19); la ficha técnica pasó de imagen a tabla de texto, y el registro sanitario y la vida útil se declaran con honestidad como «pendiente de gestión ante DIGESA» y «pendiente de estudios de estabilidad e inocuidad» (pp. 17-18); los ODS 9 y 12 se desarrollan con metas específicas (9.4, 9.5, 12.2, 12.3, 12.5; pp. 10-11); los nueve bloques del BMC se explican uno por uno (pp. 32-35); y el análisis de competidores se rehízo con empresas pertinentes (Pouchamama, Kuik, Picantería La Mundial, Tottus, Paladar Gourmet), cada una con fortalezas, debilidades, ventaja competitiva y estrategia de diferenciación (pp. 36-39). Persisten pendientes de fondo y de forma: el problema se sigue formulando desde la solución («oportunidad», pp. 5 y 9) y el problema social queda en un nivel general, sin cifras que lo dimensionen; el diferencial se enuncia, pero no se demuestra con una comparación por criterios frente al competidor más cercano (Pouchamama, liofilizado peruano); el segmento no es coherente entre 2.1 (estudiantes, trabajadores, turistas) y 2.5 (turistas nacionales como principal), y los datos de turistas extranjeros de PromPerú se usan sin constituir un segmento propio (pp. 5 y 25); no hay indicadores de gestión; la numeración del capítulo 3 sigue errada; y la bibliografía tiene 9 entradas mientras que se citan al menos 12 fuentes más (incluidos todos los competidores del 3.4) que no figuran en ella. En conjunto el trabajo sigue en el nivel Logrado de los cuatro criterios, con mejor estructura que la versión anterior; las mejoras necesarias para subir de nivel son específicas y alcanzables antes de la AA2.", "fortalezas": ["El apartado 2.3 Beneficios clave, antes con solo el título, ahora separa beneficios funcionales (facilidad de preparación, ahorro de tiempo, transporte, almacenamiento, porción individual) y emocionales (identidad arequipeña, valor cultural), y advierte que sabor, textura y aceptación deben probarse con el prototipo (pp. 18-19).", "La ficha técnica (pp. 15-18) es ahora una tabla de texto con 20 características y una nota que aclara que vida útil, tiempo de preparación y precio están sujetos a validación; declara con honestidad el registro sanitario como «Pendiente de gestión ante DIGESA, previo a la comercialización» (p. 17), en lugar del «en trámite» de la versión anterior.", "Los ODS 9 y 12 se vinculan con el proyecto mediante metas específicas (9.4, 9.5, 12.2, 12.3 y 12.5, pp. 10-11) y se mantienen las dos megatendencias de CEPLAN (2021) con páginas citadas (p. 11).", "El capítulo 3 explica los nueve bloques del BMC en texto (pp. 32-35), coherentes con la ficha (vaso de 60 g, 250 ml de agua caliente, S/ 19.90, canales y socios) y con el segmento de turistas nacionales; el BMC (p. 31) muestra los nueve bloques y el mapa de empatía (p. 30) tiene sus seis cuadrantes.", "El análisis de competidores (pp. 36-39) se rehízo con empresas que sí compiten por la misma necesidad —en especial Pouchamama, que vende platos peruanos liofilizados— y cada una trae fortalezas, debilidades, ventaja competitiva propia y estrategia de diferenciación, con fuente publicada.", "Se resolvió la contradicción de la 2.ª versión sobre el 8 % de PromPerú: ahora se describe de forma consistente como intención de viaje dentro de la macrorregión sur (p. 23).", "AA2: El formulario abre con un texto de presentación que declara participación voluntaria, anonimato y uso académico, lo cual es una buena práctica ética.", "AA2: Incluye una imagen del producto y una descripción antes de las preguntas de interés (sección «Adobito AQP»), de modo que la persona no responde solo por imaginación.", "AA2: Las preguntas 6 y 7 usan escalas lineales de 1 a 5 con extremos rotulados, y la pregunta 9 usa una escala de intención de compra de cinco niveles.", "AA2: La pregunta 10 intenta medir disposición de pago por rangos y la 11 recoge sugerencias abiertas, que son insumos para mejorar el MVP."], "prioridades": ["Agregar los indicadores de gestión (KPI) del capítulo 3, cada uno con su fórmula y un ejemplo de cálculo (por ejemplo, rendimiento de insumos o merma por lote), tal como pide la estructura del TAP; hoy el apartado no existe.", "Demostrar el diferencial con una tabla comparativa por criterios (formato, tecnología de conservación, identidad regional, necesidad de frío, ocasión de consumo) que incluya a Pouchamama, Kuik, La Mundial y a los dos antecedentes locales que citan en la p. 7 (La Sazón de la Abuela y La Despensa), y concluir qué ventaja es defendible frente a quien ya vende liofilizados peruanos.", "Unificar el segmento: la 2.1 (p. 15) dice «estudiantes, trabajadores, turistas»; la 2.5, «turistas nacionales» como principal. Mantener a los turistas nacionales como segmento principal, definir su rango de edad y tamaño, y tratar a los turistas extranjeros (datos de PromPerú 2025) como un segmento propio y separado, no como parte de los «consumidores interesados en la gastronomía regional» (p. 25).", "Reformular el problema desde el cliente y no desde la solución (pp. 5 y 9) y dimensionarlo con cifras acotadas al segmento (por ejemplo, gasto en alimentación o compra de productos típicos de los turistas nacionales en Arequipa); completar el problema social con datos (el dato de FAO citado en la p. 6 no se cifra).", "Completar la bibliografía en APA 7 con todas las fuentes citadas en el texto (Gestión/Flanqueo 2024, INEI 2024, PromPerú 2025, Ministry of Agriculture, Forestry and Fisheries of Japan, Tiffins, Encuentro 2023, La Despensa y las cinco empresas del 3.4), quitar los asteriscos de formato y verificar la URL de INEI (2025a).", "Corregir el formato: carátula con título del proyecto, sección, grupo y carrera de cada integrante; numeración de títulos del cap. 3 (3.2, 3.2.1…, 3.3); y número, título y fuente en cada tabla y figura (ficha, tabla 2.4, mapa de empatía, BMC).", "AA2: Filtrar al segmento principal: preguntar si visitó Arequipa por turismo en los últimos 2 años y si suele llevar productos gastronómicos como recuerdo o regalo (hoy solo hay edad, ciudad y ocupación, preguntas 1 a 3).", "AA2: Reformular la pregunta 9 sin condicional («si el sabor y la preparación son buenos») y eliminar el sesgo de las preguntas 6 a 8.", "AA2: Probar el precio del informe: agregar «¿Comprarías Adobito AQP a S/ 19,90?» y completar la pregunta 10 con «Menos de S/ 10», «Más de S/ 25» y «No pagaría».", "AA2: Agregar preguntas de canal, cantidad, propósito (consumo propio o regalo) y barreras de compra, que sostienen los bloques del BMC.", "AA2: Escribir una matriz hipótesis, pregunta, métrica y criterio de aceptación, definir muestra con cuota de turistas nacionales y complementar con una degustación del prototipo para validar la funcionalidad.", "AA2: Aplicar el instrumento, presentar resultados con porcentajes y número de respuestas, y derivar mejoras concretas al MVP (cap. 5)."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, analizadas críticamente para mostrar qué aportan al proyecto en relación con las megatendencias y los ODS.", "falta": "Las nueve fuentes de la lista (CEPLAN 2021, INEI 2025, MINCETUR 2025, PROMPERÚ 2026, Ipsos 2024, FAO 2024, ONU 2015) son oficiales y recientes, y por eso se mantiene el nivel Logrado. Para subir de nivel, falta cerrar el uso riguroso: al menos 12 fuentes citadas en el texto no figuran en las referencias (incluidas las cinco empresas del 3.4 y PROMPERÚ 2025); las secciones 1.1.2 y 1.2.4 afirman que se usan «artículos científicos sobre liofilización y deshidratación», pero no se cita ninguno; el análisis crítico de los límites de cada dato (que sí tenía la versión anterior) se perdió; y la URL de INEI (2025a) apunta a un archivo genérico."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencias vinculadas a megatendencias, ODS y necesidades del cliente.", "falta": "Cumple con cifras de fuentes oficiales, causas y consecuencias, ODS con metas específicas y dos megatendencias. Para llegar a Sobresaliente falta que el problema se formule desde el cliente (hoy se plantea como «oportunidad», pp. 5 y 9), que las cifras dimensionen a los turistas nacionales y no solo el contexto (el dato del INEI 2024 en la p. 4 no trae cifra; los porcentajes de PromPerú de la p. 5 corresponden a turistas extranjeros), y que el problema social tenga datos y no solo hipótesis generales."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Los seis apartados están completos, incluido el 2.3. Falta demostrar la diferenciación con una comparación por criterios frente a Pouchamama y a los antecedentes locales, y alinear el segmento entre la descripción (2.1) y los segmentos (2.5), con rango de edad y tamaño del principal."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía argumentando la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "El BMC y el mapa de empatía existen y los bloques se explican con coherencia. Para subir de nivel falta argumentar explícitamente cómo se sostienen entre sí los bloques (segmento, propuesta, canales, ingresos), agregar los indicadores de gestión, corregir la numeración del capítulo y rotular el BMC y el mapa como figura o tabla con fuente."}], "viabilidad": {"resumen": "La versión nueva admite que el registro sanitario y la vida útil están pendientes, lo que es un avance. Los riesgos de fondo siguen abiertos: el trámite y la planta habilitada, la factibilidad de liofilizar un guiso de cerdo, el rotulado y la competencia de un liofilizado peruano ya existente. Conviene empezar a probarlos antes de la AA2.", "riesgos": [{"tema": "Regulación", "titulo": "Registro sanitario y planta habilitada (DIGESA)", "choque": "La ficha (p. 17) indica «Pendiente de gestión ante DIGESA, previo a la comercialización». Un alimento envasado con carne requiere registro sanitario y producción en un establecimiento con buenas prácticas de manufactura y HACCP; no puede elaborarse en una cocina doméstica. El BMC menciona «trámites sanitarios» en costos y «empresas especializadas en procesamiento» como socios (p. 35), pero no define dónde se fabricaría el prototipo.", "ideas": ["Averiguar en DIGESA el procedimiento y los requisitos del registro sanitario para alimentos deshidratados o liofilizados con carne.", "Explorar maquila con una planta habilitada en Arequipa o con laboratorios de industrias alimentarias de una universidad.", "Mientras no haya registro, limitar el MVP a degustaciones controladas y pruebas sensoriales, sin venta comercial."]}, {"tema": "Tecnología", "titulo": "Viabilidad técnica de liofilizar o deshidratar un guiso de cerdo", "choque": "El adobo es un guiso con grasa y carne de cerdo; la grasa dificulta la liofilización, puede enranciarse y la carne rehidratada suele quedar fibrosa. La ficha todavía no define si será deshidratado o liofilizado («según los resultados de las pruebas técnicas», p. 16), que implican costos e infraestructura muy distintos, y fija un objetivo de 6 meses de vida útil (p. 17). Los 3 a 5 minutos de preparación se declaran estimados.", "ideas": ["Buscar artículos científicos sobre liofilización y deshidratación de carnes y comidas preparadas para decidir la tecnología (las secciones 1.1.2 y 1.2.4 los mencionan, pero no se citan).", "Decidir si el prototipo usará cerdo magro, carne deshilachada u otra estrategia para controlar la grasa.", "Consultar con un tecnólogo de alimentos cómo estimar la vida útil (actividad de agua, pruebas aceleradas)."]}, {"tema": "Regulación", "titulo": "Octógonos de advertencia y empaque como souvenir", "choque": "Por la Ley 30021, un adobo concentrado probablemente supere los límites de sodio o grasas saturadas y deba llevar octógonos. La versión anterior los mencionaba en la ficha; la nueva ya no incluye el rotulado, aunque el producto se plantea como recuerdo gastronómico para turistas (Caso 3, p. 27).", "ideas": ["Estimar el perfil nutricional de una porción de 60 g con tablas de composición de alimentos (CENAN/INS) y compararlo con los parámetros de la Ley 30021.", "Evaluar ajustes de receta y medir en la prueba sensorial si se pierde la identidad del plato.", "Reincorporar el rotulado en la ficha técnica y diseñar el envase considerando el espacio de los octógonos."]}, {"tema": "Mercado", "titulo": "Competencia de un liofilizado peruano ya existente", "choque": "Pouchamama (p. 36) ya vende platos peruanos liofilizados a viajeros. La propuesta de Adobito AQP se diferencia por la identidad arequipeña, pero el diferencial depende de que un turista nacional prefiera un adobo liofilizado frente a otros recuerdos gastronómicos o al plato fresco en la picantería, y todavía no se argumenta con criterios.", "ideas": ["Construir la tabla comparativa por criterios que se pide en el cap. 2.", "Definir qué experiencia ofrece Adobito AQP que Pouchamama no cubre (por ejemplo, el vínculo con la picantería de origen o el souvenir regional).", "Considerar alianzas con picanterías reconocidas para dar legitimidad al producto."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "incompleto", "nota": "Indica «Instituto CERTUS», carrera, curso, docente e integrantes (p. 1), pero la carrera es una sola («Dirección de Empresas») para las cuatro integrantes; faltan el título del proyecto, la sección y el número de grupo, y el docente figura como «Jeanpier Brandol Ancorij Sanchez»; verificar el apellido."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Ya hay índice (p. 2), con páginas coincidentes con el PDF. La numeración de los apartados del cap. 3 es incorrecta («3.3 Identificación… 3.3.1 / 3.2.2…3.2.9», «3.4 Competidores / 3.3.1, 3.3.2»)."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "incompleto", "nota": "Hay contexto con cifras (pp. 4-6), antecedentes locales e internacionales (pp. 6-7) y causas y consecuencias (1.1.1, pp. 7-8). Se formula como «oportunidad» y el dato de INEI 2024 no trae cifra."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "incompleto", "nota": "Hay ODS 9 y 12 con metas (pp. 10-11), dos megatendencias de CEPLAN (pp. 11-12) y causas y consecuencias (1.2.3, pp. 12-13). El problema social es general, sin cifras; los apartados 1.1.2 y 1.2.4 duplican el título «Importancia de las fuentes bibliográficas»."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Descripción clara (p. 15); el público objetivo mencionado («estudiantes, trabajadores, turistas») no coincide con el segmento principal de la 2.5."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Tabla de texto con 20 características (pp. 15-18), con nota de elaboración propia y de validación pendiente. Sin número y título de tabla; ya no incluye rotulado ni octógonos."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Subsanado: beneficios funcionales y emocionales (pp. 18-19)."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "incompleto", "nota": "Tabla problema-solución y alternativas existentes (pp. 20-21); la diferenciación se enuncia pero no se demuestra con comparación por criterios; la tabla no tiene número ni fuente."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "incompleto", "nota": "Tres segmentos con segmentación y datos de MINCETUR, PROMPERÚ e INEI (pp. 22-25). Edad y tamaño del principal sin definir; datos de turistas extranjeros bajo un segmento complementario mixto; rótulos de imágenes sueltos («Gobierno del Perú», «Boletines», «INEI», «Visita Arequipa»)."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Cinco casos hipotéticos rotulados como tales (pp. 26-28)."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Tabla con sus seis bloques para el turista nacional (p. 30), con nota de hipótesis. Sin número y título de figura o tabla; erratas («un recuerdo auténtica»)."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Imagen con los 9 bloques (p. 31) y explicación de cada bloque en texto (pp. 32-35), coherente con la ficha. Sin figura numerada ni fuente; numeración errónea; la explicación describe pero no argumenta la coherencia entre bloques."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Cinco competidores (tres directos y dos indirectos) con fortalezas, debilidades, ventaja competitiva y estrategia de diferenciación (pp. 36-39). Faltan la matriz comparativa y las referencias; rotulado con numeración errada."}, {"codigo": "3.x", "apartado": "Indicadores de gestión", "estado": "ausente", "nota": "No hay KPI con fórmula y ejemplo de cálculo."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Nueve referencias (pp. 40-41) con asteriscos de formato; no figuran al menos 12 fuentes citadas en el texto, incluidas las empresas del 3.4."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "El capítulo conserva sus cifras, ODS y megatendencias y ahora desarrolla las metas específicas de los ODS 9 y 12. Persisten la formulación desde la solución y la falta de dimensionamiento del problema, y se perdió parte del análisis crítico de los datos.", "observaciones": [{"severidad": "importante", "titulo": "El problema sigue formulado desde la solución", "ubicacion": "1.1, pp. 5-6 y 1.2, p. 9", "cita": "Este contexto representa una oportunidad para explorar nuevas formas de presentar y difundir preparaciones tradicionales como el adobo arequipeño", "problema": "El apartado 1.1 describe un contexto favorable y una oportunidad comercial, pero no enuncia qué dificultad concreta tiene el cliente ni a quién afecta. El apartado 1.2 abre con «existe la necesidad de impulsar la innovación tecnológica» (p. 9), que justifica el producto, no un problema social. Hablar de lo que «merece ser evaluada» (p. 6) confirma que se parte de la solución (liofilizar) y no del cliente.", "mejora": "Redactar en un párrafo el problema desde el cliente, con la forma «los turistas nacionales que visitan Arequipa no pueden llevarse o consumir después el adobo porque…», y después mostrar cómo las cifras lo respaldan."}, {"severidad": "importante", "titulo": "Las cifras describen el contexto, no dimensionan el problema; el dato de INEI 2024 no trae cifra", "ubicacion": "1.1, pp. 4-5", "cita": "el Instituto Nacional de Estadística e Informática (INEI, 2024) presenta información sobre la participación del gasto en alimentos consumidos fuera del hogar", "problema": "La cita de INEI (2024) no incluye ningún dato y tampoco figura en las referencias. El 59 % de Ipsos (p. 4) y el tiempo de cocina (2 h 11 min frente a 58 min) no están acotados a Arequipa ni al segmento principal, y se perdió la lectura crítica que la versión anterior hacía de cada cifra («no representa una medición directa de la demanda»). Además, los porcentajes de PromPerú de la p. 5 (99 % y 96 %) corresponden a turistas extranjeros, no al segmento de turistas nacionales.", "mejora": "Reemplazar o completar con cifras acotadas al segmento principal (por ejemplo, gasto en alimentación de los turistas nacionales o compra de productos típicos como recuerdo en Arequipa, con MINCETUR o PromPerú), poner la cifra concreta del INEI o retirar la cita, y volver a señalar el alcance de cada dato."}, {"severidad": "importante", "titulo": "Problema social general, sin cifras ni respaldo de la FAO", "ubicacion": "1.2, pp. 9-10 y 1.2.3, pp. 12-13", "cita": "Estas condiciones pueden limitar la diversificación de productos alimenticios regionales y reducir las oportunidades de generar valor agregado a partir de la gastronomía local.", "problema": "Las causas y consecuencias del problema social están redactadas con «pueden» y «posibles», sin un solo dato que las respalde. Los ODS ahora traen metas (9.4, 9.5, 12.2, 12.3, 12.5), lo cual se reconoce como mejora, pero las pérdidas de alimentos se mencionan sin cifra: la FAO (2024) se cita en la p. 6 solo como «se desperdician alimentos» y las megatendencias de CEPLAN (pp. 11-12) no incluyen datos que las acoten. La meta 12.3 queda sin evidencia.", "mejora": "Incorporar la cifra de la FAO (2024) que ya tienen en las referencias y, si es posible, una de CEPLAN o del Ministerio de Desarrollo Agrario sobre pérdidas poscosecha o en la venta al detalle; vincular cada meta ODS con un dato del problema."}, {"severidad": "sugerencia", "titulo": "Apartados duplicados sobre las fuentes y denominación inconsistente del producto", "ubicacion": "1.1.2, p. 8; 1.2.4, p. 13; pp. 9, 10 y 12", "cita": "se respalda la necesidad de desarrollar una sopa instantánea basada en el adobo arequipeño", "problema": "Los apartados 1.1.2 y 1.2.4 tienen el mismo título y explican en abstracto para qué sirven las fuentes, además de afirmar que se usan «artículos científicos sobre liofilización y deshidratación», que no se citan en ninguna parte. El producto se llama «sopa instantánea» en las pp. 9, 10 y 12, pero en el resto del informe es un «adobo arequipeño instantáneo» en vaso.", "mejora": "Reemplazar ambos apartados por un breve análisis de qué aporta cada fuente al problema (como en la versión anterior) o eliminarlos, y usar una sola denominación del producto en todo el informe."}]}, {"etiqueta": "Capítulo II", "titulo": "Definición de propuestas de valor únicas", "resumen": "Capítulo completo y mejor estructurado: ya tiene el 2.3 y una ficha transparente sobre lo que falta validar. Pendientes: demostrar el diferencial, alinear el segmento y separar a los turistas extranjeros.", "observaciones": [{"severidad": "importante", "titulo": "El diferencial está enunciado, pero no demostrado frente al competidor más cercano", "ubicacion": "2.4, pp. 20-21 y 3.4, p. 36", "cita": "Adobito AQP busca diferenciarse de las siguientes alternativas: Picanterías y restaurantes… Servicio de delivery… Presentaciones congeladas… Sopas instantáneas", "problema": "La lista de alternativas de la p. 21 no incluye a Pouchamama, que ya vende platos peruanos liofilizados a viajeros (y que el propio informe analiza en la p. 36), ni a los antecedentes locales de la p. 7 (La Sazón de la Abuela, La Despensa). Además, la diferenciación se afirma por frase («no están elaboradas específicamente a partir de la receta del adobo») y no con criterios comparables; lo mismo ocurre con la ventaja competitiva del cap. 3, que se apoya en «identidad regional específica» sin explicar por qué es defendible.", "mejora": "Elaborar una tabla comparativa con criterios (formato y tecnología, necesidad de frío, identidad regional, ocasión de consumo, canal) que incluya a esos competidores y a Adobito AQP, y redactar una conclusión de una o dos frases sobre el diferencial que sí es único."}, {"severidad": "importante", "titulo": "Segmento principal inconsistente entre 2.1 y 2.5, y sin edad ni tamaño", "ubicacion": "2.1, p. 15; 2.5, pp. 22-25", "cita": "Está dirigido principalmente a estudiantes, trabajadores, turistas y personas que desean disfrutar de este plato típico", "problema": "La 2.1 menciona estudiantes como público principal, que no aparecen como segmento en la 2.5; allí el principal son los turistas nacionales, con rango de edad «que se determinará» (p. 22) y sin una estimación de tamaño (solo arribos totales, 1 207 036, no turistas que consumirían el producto). El segmento complementario (p. 24) mezcla a residentes de Arequipa y consumidores de otras ciudades, lo que no define a un cliente concreto.", "mejora": "Redactar la 2.1 con el mismo segmento principal de la 2.5, definir una edad tentativa (hipótesis) y estimar el tamaño con los datos de MINCETUR (por ejemplo, arribos nacionales por procedencia), y separar claramente el segmento complementario."}, {"severidad": "importante", "titulo": "Datos de turistas extranjeros usados sin constituir un segmento propio", "ubicacion": "1.1, p. 5 y 2.5, p. 25", "cita": "Aunque estos datos corresponden a turistas extranjeros y no a consumidores nacionales, permiten reconocer la importancia de la gastronomía como parte de la experiencia turística de Arequipa.", "problema": "Reconocemos que la 2.5 aclara el origen de los datos. Sin embargo, los porcentajes de PromPerú (2025) sobre el turista extranjero (99 % y 96 %) respaldan en el cap. 1 (p. 5) el contexto del cliente nacional y, en el cap. 2, se colocan bajo un segmento «complementario» de consumidores regionales, sin que el turista extranjero tenga segmentación, tamaño ni propuesta propia. Esas cifras solo sirven para ese segmento.", "mejora": "Mantener a los turistas nacionales como segmento principal y, si se considera al turista extranjero, crearlo como segmento separado, con su propia segmentación, datos de PromPerú y caso de uso; en el cap. 1 usar para los nacionales datos de turismo interno."}, {"severidad": "sugerencia", "titulo": "La ficha técnica deja definiciones abiertas que conviene fijar", "ubicacion": "2.2, pp. 16-18", "cita": "Deshidratación o liofilización, según los resultados de las pruebas técnicas.", "problema": "La ficha es honesta al marcar vida útil, tiempo y registro sanitario como pendientes, y eso se valora. Quedan abiertas la tecnología de conservación y el rotulado nutricional (la versión anterior mencionaba los octógonos), que condicionan el empaque y la vida útil.", "mejora": "Elegir una tecnología tentativa con una fuente técnica que la respalde, y reincorporar el rotulado (sodio y grasas saturadas, octógonos si corresponde)."}, {"severidad": "sugerencia", "titulo": "Casos de uso hipotéticos; la validación real se exigirá en el cap. 5", "ubicacion": "2.6, pp. 26-28", "cita": "Su aceptación deberá comprobarse mediante entrevistas, encuestas y pruebas sensoriales del prototipo", "problema": "Los cinco casos están rotulados como hipotéticos, lo cual es aceptable para la AA1. Los casos 4 y 5 (profesional que vive solo y consumidor interesado) no se enlazan con ningún dato del cap. 1 o 2.5. Se recuerda que la validación real con clientes corresponde al capítulo 5 (AA2).", "mejora": "Conectar cada caso con un dato o una frase del segmento; reservar la validación real con clientes para el cap. 5."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El capítulo avanzó de forma clara: explica los nueve bloques y rehízo los competidores con fortalezas y estrategia de diferenciación. Faltan los indicadores de gestión, la matriz comparativa, la numeración y argumentar la coherencia entre bloques.", "observaciones": [{"severidad": "importante", "titulo": "Faltan los indicadores de gestión", "ubicacion": "Capítulo 3", "cita": "", "problema": "La estructura del TAP pide indicadores de gestión (KPI con fórmula y ejemplo de cálculo) en el capítulo 3 y el informe no los tiene. Las actividades clave (p. 34: pruebas de calidad, vida útil, características sensoriales) ya ofrecen insumos para definirlos.", "mejora": "Agregar de 3 a 5 indicadores (por ejemplo, rendimiento de insumos por lote, merma, costo por unidad, tasa de recompra, satisfacción en la prueba sensorial), cada uno con su fórmula y un ejemplo numérico."}, {"severidad": "importante", "titulo": "La explicación de los 9 bloques es descriptiva y no argumenta la coherencia", "ubicacion": "3.2, pp. 32-35", "cita": "La principal fuente de ingresos de Adobito AQP será la venta de su presentación individual de 60 gramos", "problema": "Los bloques guardan coherencia con la ficha y con el segmento de turistas nacionales (vaso de 60 g, S/ 19.90, tiendas turísticas, redes sociales), pero cada uno se redacta por separado. No se argumenta cómo se sostienen entre sí (por ejemplo, por qué los canales elegidos alcanzan al turista nacional, qué socios cubren la actividad de liofilización o el trámite sanitario, o por qué la relación con el cliente es digital si el producto se compra en tienda). La imagen del BMC (p. 31) no tiene número, título ni fuente.", "mejora": "Agregar un párrafo de cierre que relacione propuesta de valor, segmento, canales, ingresos y socios, y rotular el BMC como «Figura n» con título y «Elaboración propia»."}, {"severidad": "importante", "titulo": "Competidores: sin matriz comparativa y con la clasificación directo/indirecto por revisar", "ubicacion": "3.4, pp. 36-39", "cita": "Pouchamama comercializa comidas peruanas liofilizadas, orientadas principalmente a excursionistas y viajeros.", "problema": "El análisis mejora mucho respecto a la versión anterior, pero ya no hay una tabla comparativa que permita ver las diferencias: hay que leer cinco fichas. Solo Pouchamama compite por el formato; Kuik (congelado) y La Mundial (picantería) son más bien alternativas de otra categoría, y no coinciden con las alternativas listadas en el cap. 2.4. Además, ninguna de las fuentes del 3.4 está en las referencias.", "mejora": "Agregar una tabla resumen con los cinco competidores y los criterios de comparación, revisar qué competidores son directos por formato y cuáles indirectos por necesidad, e incluir las fuentes en la bibliografía."}, {"severidad": "importante", "titulo": "Numeración errónea de los títulos del capítulo 3", "ubicacion": "3.2 a 3.4, pp. 31-36 y p. 2", "cita": "3.2.2. Propuesta de valor", "problema": "Tras «3.2 Business Model Canvas» aparece «3.3 Identificación y características de los 9 bloques» y sus apartados se numeran «3.3.1», «3.2.2»…«3.2.9»; luego «3.4 COMPETIDORES» contiene «3.3.1» y «3.3.2». El índice (p. 2) reproduce el error.", "mejora": "Renumerar: 3.1 Mapa de empatía, 3.2 BMC con 3.2.1 a 3.2.9, 3.3 Competidores (3.3.1 y 3.3.2) y 3.4 Indicadores de gestión, y actualizar el índice."}, {"severidad": "sugerencia", "titulo": "Mapa de empatía sin número, título ni fuente, con erratas", "ubicacion": "3.1, p. 30", "cita": "Quiere llevar un recuerdo auténtica", "problema": "El mapa de empatía se presenta como tabla con nota «Elaboración propia», lo cual es válido, pero sin numeración ni título. Hay una errata en «un recuerdo auténtica». Cubre solo al turista nacional; los segmentos secundarios no tienen mapa, lo que es aceptable si se aclara.", "mejora": "Rotular como «Tabla n» o «Figura n» con título y fuente, corregir la redacción y dejar dicho que el mapa corresponde al segmento principal."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, referencias y tablas", "resumen": "Hay avances (índice, notas en la ficha y en el mapa), pero el rigor de trabajo académico sigue incompleto: carátula, referencias y rotulado de tablas y figuras.", "observaciones": [{"severidad": "importante", "titulo": "Carátula incompleta", "ubicacion": "Carátula, p. 1", "cita": "Carrera: Dirección de Empresas", "problema": "La carátula no tiene el título del proyecto, la sección ni el número de grupo; indica una sola carrera para las cuatro integrantes, y el apellido del docente figura como «Ancorij», que conviene verificar.", "mejora": "Completar la carátula con título, sección, grupo, carrera de cada integrante y el nombre correcto del docente, siguiendo el formato del TAP."}, {"severidad": "importante", "titulo": "Referencias incompletas: al menos 12 fuentes citadas no figuran en la lista", "ubicacion": "Referencias, pp. 40-41", "cita": "Pouchamama, s. f.; Kuik, s. f.; Tottus Perú, s. f.; Paladar Gourmet, s. f.; Gestión, 2024; Encuentro, 2023", "problema": "La lista tiene 9 entradas y faltan en ella: INEI (2024), PROMPERÚ (2025), Gestión/Flanqueo (2024), Encuentro (2023), La Despensa (s. f.), Ministry of Agriculture, Forestry and Fisheries of Japan (s. f.), Tiffins (s. f.), Pouchamama, Kuik, Picantería La Mundial, Tottus Perú y Paladar Gourmet. «INEI, 2025» no distingue entre 2025a y 2025b; la referencia de MINCETUR (s. f.) figura a nombre de la Gerencia Regional. Persisten asteriscos de formato y la URL de INEI (2025a) apunta a un archivo genérico («Lib2010/libro.pdf»).", "mejora": "Completar las referencias en APA 7, hacer coincidir autor y año entre el texto y la lista, usar 2025a y 2025b en el texto, quitar los asteriscos y verificar la URL."}, {"severidad": "importante", "titulo": "Tablas y figuras sin numeración, título y fuente consistentes", "ubicacion": "pp. 15-18, 20-21, 23-25, 30 y 31", "cita": "Gobierno del Perú / Boletines", "problema": "La ficha técnica (pp. 15-18), la tabla problema-solución (pp. 20-21), el mapa de empatía (p. 30) y el BMC (p. 31) no tienen número, título ni fuente en el formato APA 7 (la ficha y el mapa sí traen «Nota. Elaboración propia»). Entre las pp. 23 y 25 quedan rótulos sueltos («Gobierno del Perú», «Boletines», «INEI», «Visita Arequipa») que parecen restos de capturas de las fuentes.", "mejora": "Numerar cada tabla y figura con título arriba y fuente abajo (por ejemplo, «Tabla 1. Ficha técnica de Adobito AQP» / «Elaboración propia, a partir de…») y eliminar los rótulos sueltos."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Instrumento de validación del MVP y del modelo de negocio", "resumen": "Instrumento ordenado pero insuficiente: no filtra al segmento principal, induce respuestas positivas, no prueba el precio de S/ 19,90 ni el canal, y no valida la funcionalidad del MVP.", "observaciones": [{"severidad": "critico", "titulo": "El formulario no identifica al segmento principal del informe", "ubicacion": "Preguntas 1 a 3; informe 2.5 (turistas nacionales)", "cita": "«¿En qué ciudad resides actualmente?» (Arequipa, Lima, otra ciudad del Perú, fuera del Perú)", "problema": "El informe define como segmento principal a los turistas nacionales que visitan Arequipa (2.5) y el BMC (3.2) construye canales, relación y precio sobre ellos. El formulario solo pregunta edad, ciudad de residencia y ocupación. No hay forma de saber si el encuestado visitó Arequipa por turismo ni si acostumbra llevar productos gastronómicos como recuerdo o regalo. Los resultados mezclarían residentes, estudiantes y turistas, y no validarían la demanda del segmento que sostiene el modelo.", "mejora": "Agregar al inicio un filtro «¿Has visitado Arequipa por turismo en los últimos 2 años?» con salto condicional, y la pregunta «Cuando viajas, ¿sueles llevar productos gastronómicos como recuerdo o regalo?» (siempre, a veces, rara vez, nunca). Analizar los resultados por segmento."}, {"severidad": "critico", "titulo": "La pregunta de compra está condicionada y regala la respuesta", "ubicacion": "Pregunta 9", "cita": "Intención de compra «si el sabor y la preparación son buenos» (definitivamente sí / probablemente sí / no estoy seguro(a) / probablemente no / definitivamente no)", "problema": "Condicionar la compra a que el producto sea sabroso y práctico elimina la duda principal: si el producto real cumple eso. Cualquier persona razonable responderá «sí», por lo que el porcentaje de intención de compra no sirve como métrica de viabilidad y tampoco permite proyectar volúmenes en el cap. 6. Se mide además intención declarada, no comportamiento.", "mejora": "Formular sin condicionales: «Después de ver la imagen y la descripción, ¿comprarías Adobito AQP?». Complementar con una pregunta de conducta pasada («¿cuándo fue la última vez que compraste un recuerdo gastronómico y cuánto pagaste?») y un compromiso real (dejar WhatsApp para probar o reservar)."}, {"severidad": "importante", "titulo": "Preguntas con sesgo positivo y redundantes (6, 7 y 8)", "ubicacion": "Preguntas 6, 7 y 8", "cita": "«Nada atractiva / Muy atractiva» (6); «Nada interesado(a) / Muy interesado(a)» (7); opciones de la 8: «disfrutar del sabor del adobo en cualquier momento», «preparación práctica y rápida», «innovación de un plato tradicional en formato instantáneo», «acceso a comida regional fuera de Arequipa»", "problema": "Las preguntas 6 y 7 miden prácticamente lo mismo (atractivo e interés) con escalas de 5 puntos sin punto neutro rotulado. La 8 solo ofrece atributos favorables, redactados con lenguaje promocional, y no permite responder «ninguna»; obliga a elegir una ventaja aunque no la perciba. Ninguna pregunta busca barreras ni objeciones (autenticidad, conservantes, porción de 60 g, precio, que no sepa igual).", "mejora": "Conservar una sola pregunta de interés, agregar «Ninguna» y «Otra» en la 8 o pedir ordenar las tres más importantes, y añadir una pregunta de selección múltiple «¿Qué te preocuparía de un adobo instantáneo?» con «Ninguna» y «Otra»."}, {"severidad": "importante", "titulo": "El precio de referencia no se prueba y la escala está cortada", "ubicacion": "Pregunta 10; informe 3.2.5 (S/ 19,90)", "cita": "«Menos de S/ 10.00 / S/ 10.00 – 14.90 / S/ 15.00 – 19.90 / S/ 20.00 – 24.90»", "problema": "El informe fija S/ 19,90 como precio de venta (ficha técnica y BMC), pero el rango «S/ 15.00 – 19.90» no distingue si la persona aceptaría exactamente ese precio, y no existe «Más de S/ 25» ni «No pagaría», por lo que quien no compraría debe marcar un rango. Tampoco hay referencia de comparación (un plato de adobo en picantería, un recuerdo gastronómico, otros alimentos instantáneos). Aunque el precio sea referencial, el cap. 5 debe tomar de esta pregunta la disposición de pago que alimente el cap. 6.", "mejora": "Agregar «¿Comprarías Adobito AQP a S/ 19,90?» (sí / depende / no), completar los rangos con «Más de S/ 25,00» y «No pagaría», y preguntar cuánto gastó o gastaría en un recuerdo gastronómico. Si es posible, usar dos precios en versiones distintas para comparar."}, {"severidad": "importante", "titulo": "No se mide canal, cantidad ni propósito de compra", "ubicacion": "Formulario completo; informe 3.2.3 (canales) y 3.2.5 (ingresos)", "cita": "Canales del BMC: tiendas turísticas, redes sociales (sin pregunta correspondiente en el formulario)", "problema": "El BMC sostiene canales y volumen sobre hipótesis, y el formulario no recoge ni una respuesta sobre dónde esperaría encontrar el producto la persona (hotel, mercado, tienda turística, aeropuerto, supermercado, en línea), cuántas unidades compraría ni si sería para consumo propio o regalo. Sin eso no se valida el modelo de negocio, solo el interés general.", "mejora": "Agregar tres preguntas: canal preferido de compra, cantidad por compra (1, 2 a 3, 4 o más) y propósito (consumo propio o regalo), y contrastarlas con los canales y la relación con el cliente del BMC."}, {"severidad": "importante", "titulo": "No valida la funcionalidad del MVP", "ubicacion": "Sección «Adobito AQP» (descripción e imagen); pregunta 11", "cita": "«Adobo arequipeño instantáneo en un vaso individual de aproximadamente 60 gramos»", "problema": "La descripción indica formato y peso, pero no cómo se prepara (agua caliente, tiempo), qué contiene ni su vida útil, que son parte de la ficha técnica. La imagen es solo un recurso gráfico, no un prototipo probado. La encuesta no mide sabor, textura, aroma ni tiempo de preparación, que son los atributos centrales de un adobo y que el propio informe dice que deben comprobarse con el prototipo. La pregunta 11 (sugerencias, abierta y obligatoria) es insuficiente para derivar mejoras al MVP.", "mejora": "Completar la descripción con preparación, contenido y vida útil tentativa. Organizar una degustación de 10 a 20 personas con calificación de 1 a 5 de sabor, textura, aroma y parecido con el adobo tradicional, y registrar el tiempo de preparación real. Hacer la 11 opcional y orientada («¿qué cambiarías del producto?»)."}, {"severidad": "importante", "titulo": "No hay hipótesis, muestra ni criterio de aceptación", "ubicacion": "Instrumento y cap. 5 (no incluido en el informe disponible)", "cita": "—", "problema": "No se ve una matriz que relacione cada pregunta con una hipótesis del modelo de negocio (segmento, problema, propuesta de valor, precio, canal), ni la muestra, la forma de llegar a turistas nacionales ni el resultado mínimo que se aceptará (por ejemplo, «al menos 40 % compraría a S/ 19,90»). En la AA2 ya se exige recolección real y conclusiones con métricas; sin criterios previos no podrá concluir si el modelo es viable ni qué mejorar.", "mejora": "Elaborar la tabla hipótesis, pregunta, métrica y criterio de aceptación. Definir una muestra con cuota de turistas nacionales (idealmente 30 o más del segmento), registrar el canal de difusión (evitar que respondan solo familiares y amigos), probar el formulario con 5 personas del segmento y luego aplicarlo."}, {"severidad": "sugerencia", "titulo": "Opciones de respuesta incompletas", "ubicacion": "Preguntas 1 y 4", "cita": "Edad: «18 – 24 / 25 – 34 / 35 – 44 / 45 – 54»; frecuencia: «todos los días / varias veces por semana / una vez por semana / algunas veces al mes»", "problema": "En la edad faltan las personas de 55 años o más y no hay salida para menores de 18. En la frecuencia de consumo de alimentos instantáneos faltan «Casi nunca» y «Nunca», por lo que quien no los consume debe marcar una opción que no le corresponde, lo que sesga los datos.", "mejora": "Agregar «55 años o más», un fin de formulario para menores de 18 y las opciones «Casi nunca» y «Nunca»."}, {"severidad": "sugerencia", "titulo": "La pregunta 5 no explora cómo se obtiene hoy el adobo ni la diferenciación", "ubicacion": "Pregunta 5; informe 2.4 y 3.4", "cita": "«¿Conoces el adobo arequipeño?» (lo he probado / lo conozco pero nunca lo he probado / no lo conozco)", "problema": "Mide conocimiento, pero el informe se diferencia de alternativas (picanterías, presentaciones congeladas, Pouchamama). El formulario no pregunta cómo consigue hoy el adobo la persona ni qué alternativa compraría en su lugar.", "mejora": "Agregar «¿Cómo consigues hoy adobo arequipeño?» (picantería, lo preparo, delivery, producto envasado, no lo consumo) y vincular las respuestas con el cuadro de competidores."}, {"severidad": "sugerencia", "titulo": "Presentación y formato del formulario", "ubicacion": "Encabezado y sección «Adobito AQP»", "cita": "Título del formulario sin nombre; requiere cuenta de Google", "problema": "El formulario aparece como «Título sin título» y exige iniciar sesión en Google, lo que reduce la tasa de respuesta, especialmente de turistas. Además, la imagen no tiene texto alternativo.", "mejora": "Nombrar el formulario, desactivar el requisito de inicio de sesión, agregar texto alternativo a la imagen y mantener la duración total en 5 a 6 minutos."}]}], "fecha_aa2": "11/11/2026", "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 3, "responsabilidad": 3}, "calificacionAA2": {"validacion": 1}, "enlaces": [{"titulo": "Informe del TAP (Google Docs)", "url": "https://docs.google.com/document/d/17tvVeXOwbJYlneYi10Z5Y0-mmiSG36KGvAwSkklrZs0"}, {"titulo": "Formulario de validación", "url": "https://docs.google.com/forms/d/e/1FAIpQLSfozh5WNxgU0xJ09nTWS_CZXJ4WY8G0d-94apMVeW60I0r0ng/viewform"}], "costosAA2": {"hoja": "Adobito AQP", "tipo_cambio": 3.5, "escenarios": ["Piloto", "Año 1", "Crecimiento"], "supuestos": [{"concepto": "Clientes atendidos al mes", "unidad": "clientes", "valores": [50.0, 200.0, 800.0], "nota": "SUPUESTO sobre el volumen del informe (no declarado)."}, {"concepto": "Mensajes de utilidad por WhatsApp API", "unidad": "mensajes", "valores": [0.0, 200.0, 1000.0], "nota": "Piloto: app gratuita (sin API). Año 1+: solo si pasan a la API."}, {"concepto": "Mensajes de marketing por WhatsApp API", "unidad": "mensajes", "valores": [0.0, 100.0, 500.0], "nota": "Ídem."}, {"concepto": "¿Dominio propio? (1 = sí)", "unidad": "1/0", "valores": [0.0, 1.0, 1.0], "nota": "Opcional (web/QR/tienda en línea)."}, {"concepto": "Horas de desarrollo inicial de la plataforma", "unidad": "horas", "valores": [30.0, 30.0, 30.0], "nota": "SUPUESTO, OPCIONAL: página web sencilla con catálogo y enlace a WhatsApp. Si no la desarrollan, es S/ 0."}, {"concepto": "Horas de mantenimiento al mes", "unidad": "horas", "valores": [0.0, 2.0, 4.0], "nota": "SUPUESTO: bolsa de horas mensual para corrección de errores, actualizaciones y soporte."}, {"concepto": "Encargado fijo de actualizaciones (S/ al mes; 0 = usar bolsa de horas)", "unidad": "S/ / mes", "valores": [0.0, 0.0, 0.0], "nota": "OPCIONAL: si contrata a una persona con pago mensual fijo para actualizar la plataforma, escriba aquí su pago; reemplaza a la bolsa de horas."}], "costos": [{"concepto": "WhatsApp Business API", "valores": [0.0, 45.6, 228.03], "nota": "La app gratuita de WhatsApp Business no cuesta; esto es solo si usan la API"}, {"concepto": "Dominio propio (prorrateado)", "valores": [0.0, 5.83, 5.83], "nota": ""}, {"concepto": "Imprevistos", "valores": [0.0, 5.14, 23.39], "nota": ""}], "total_pen": [0.0, 56.5822, 257.2442], "primer_pago_pen": [0.0, 127.1655, 327.8275], "ingreso_etiqueta": "Ventas brutas (S/ 19,90 por unidad, 1 unidad por cliente)", "ingreso_pen": [995.0, 3980.0, 15920.0], "chat_pen": null, "desarrollo_pen": 1500.0, "mantenimiento_pen": [0.0, 80.0, 160.0], "total             <tr><td><b>Total mensual</b></td>${K.total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td>Primer pago (mes 1, con dominio anual)</td>${f3(K.primer_pago_pen)}</tr>
            <tr><td>Mantenimiento del desarrollador (horas al mes x S/ ${esc(K.tarifa_mantenimiento)} por hora)</td>${f3(K.mantenimiento_pen)}</tr>
            <tr><td><b>Total mensual con mantenimiento</b></td>${K.total_con_mant_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Desarrollo inicial de la plataforma (pago único al desarrollador, a S/ ${esc(K.tarifa_desarrollo)} por hora)</b></td><td class="num" colspan="${K.escenarios.length}"><b>${S(K.desarrollo_pen)}</b></td></tr>
            ${K.primer_pago_total_pen ? `<tr><td><b>Primer pago total: plataforma + primer mes de servicios</b></td>${K.primer_pago_total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Costo total del primer año (plataforma + 12 meses con mantenimiento)</b></td>${K.costo_anio1_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>` : ''}
            ${K.chat_pen ? `<tr><td>De ese total: chat interno y buzón de mensajes</td>${f3(K.chat_pen)}</tr>` : ''}
            <tr><td>${esc(K.ingreso_etiqueta)}</td>${f3(K.ingreso_pen)}</tr>
            <tr><td>Costo de nube / ingreso estimado</td>${K.pct_ingreso.map(v => `<td class="num">${(v * 100).toLocaleString('es-PE', { maximumFractionDigits: 1 })} %</td>`).join('')}</tr>
          </tbody>
        </table></div>
        <ul class="strength">${K.notas.map(n => `<li>${esc(n)}</li>`).join('')}<li>El desarrollo inicial y las horas de mantenimiento son referenciales: reemplácenlos con la cotización real de su desarrollador y verifiquen que el ingreso cubra el mantenimiento mensual.</li></ul>
      </div>`;
    })() : ''}
    ${D.excelPE ? (() => {
      const X = D.excelPE, NIV = pct => pct >= 85 ? 'Sobresaliente' : pct >= 70 ? 'Logrado' : pct >= 50 ? 'En proceso' : 'Inicio';
      const entrega = `<div class="scorebox" id="excel-pe">
        <div class="eyebrow">Evidencia 2 · Excel de costos y punto de equilibrio</div>
        <h3 style="margin:6px 0 8px">Cómo entregar el Excel</h3>
        <ol class="priorities">
          <li><span>Hagan el archivo en <b>.xlsx</b> (si lo trabajan en Google Sheets: Archivo → Descargar → Microsoft Excel).</span></li>
          <li><span>Súbanlo a <b>Google Drive</b> y compártanlo con «Cualquier persona con el enlace → Lector». Nombre: <b>AA2_Cap6_Excel_Punto de equilibrio_Grupo X</b>.</span></li>
          <li><span>Envíen <b>el enlace de Drive</b> al docente. Si no abre, se les pedirá el archivo.</span></li>
          <li><span>Anexen las cotizaciones (capturas o PDF) en una hoja «Cotizaciones» o en la misma carpeta de Drive.</span></li>
          <li><span>Si lo corrigen, suban la nueva versión con el mismo nombre y el mismo enlace.</span></li>
        </ol>`;
      if (X.estado !== 'calificado' || X.logro == null) {
        return entrega + `<p class="summary">Estado: <b>pendiente de entrega</b>. Cuando lo reciban, aquí aparecerá su porcentaje de logro (0 a 100 %) con la retroalimentación por criterio.</p></div>`;
      }
      return entrega + `<div class="grade"><span class="big">${Number(X.logro)} %</span><span class="of">de logro · ${NIV(Number(X.logro))}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio</th><th class="num">Puntaje</th><th>Retroalimentación</th></tr></thead>
          <tbody>${X.criterios.map(c => `<tr><td>${esc(c.nombre)}</td><td class="num">${Number(c.puntaje)} / ${Number(c.peso)}</td><td>${esc(c.comentario || '')}</td></tr>`).join('')}</tbody>
        </table></div>
        ${X.fortalezas?.length ? `<h4 style="margin:12px 0 6px">Lo que está bien</h4><ul class="strength">${X.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        ${X.mejoras?.length ? `<h4 style="margin:12px 0 6px">Para mejorar</h4><ol class="priorities">${X.mejoras.map(m => `<li><span>${esc(m)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Indicador preliminar elaborado con la rúbrica del Excel de punto de equilibrio. La calificación final de la AA2 la define el docente.${X.revisado ? ' Revisión del ' + esc(X.revisado) + '.' : ''}</p></div>`;
    })() : ''}
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.prototipoHtml ? [['prototipo-aa2', 'Prototipo', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.excelPE ? [['excel-pe', 'Excel de punto de equilibrio', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
