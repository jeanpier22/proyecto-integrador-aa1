/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

e resolvió la contradicción de la 2.ª versión sobre el 8 % de PromPerú: ahora se describe de forma consistente como intención de viaje dentro de la macrorregión sur (p. 23)."], "prioridades": ["Agregar los indicadores de gestión (KPI) del capítulo 3, cada uno con su fórmula y un ejemplo de cálculo (por ejemplo, rendimiento de insumos o merma por lote), tal como pide la estructura del TAP; hoy el apartado no existe.", "Demostrar el diferencial con una tabla comparativa por criterios (formato, tecnología de conservación, identidad regional, necesidad de frío, ocasión de consumo) que incluya a Pouchamama, Kuik, La Mundial y a los dos antecedentes locales que citan en la p. 7 (La Sazón de la Abuela y La Despensa), y concluir qué ventaja es defendible frente a quien ya vende liofilizados peruanos.", "Unificar el segmento: la 2.1 (p. 15) dice «estudiantes, trabajadores, turistas»; la 2.5, «turistas nacionales» como principal. Mantener a los turistas nacionales como segmento principal, definir su rango de edad y tamaño, y tratar a los turistas extranjeros (datos de PromPerú 2025) como un segmento propio y separado, no como parte de los «consumidores interesados en la gastronomía regional» (p. 25).", "Reformular el problema desde el cliente y no desde la solución (pp. 5 y 9) y dimensionarlo con cifras acotadas al segmento (por ejemplo, gasto en alimentación o compra de productos típicos de los turistas nacionales en Arequipa); completar el problema social con datos (el dato de FAO citado en la p. 6 no se cifra).", "Completar la bibliografía en APA 7 con todas las fuentes citadas en el texto (Gestión/Flanqueo 2024, INEI 2024, PromPerú 2025, Ministry of Agriculture, Forestry and Fisheries of Japan, Tiffins, Encuentro 2023, La Despensa y las cinco empresas del 3.4), quitar los asteriscos de formato y verificar la URL de INEI (2025a).", "Corregir el formato: carátula con título del proyecto, sección, grupo y carrera de cada integrante; numeración de títulos del cap. 3 (3.2, 3.2.1…, 3.3); y número, título y fuente en cada tabla y figura (ficha, tabla 2.4, mapa de empatía, BMC)."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, analizadas críticamente para mostrar qué aportan al proyecto en relación con las megatendencias y los ODS.", "falta": "Las nueve fuentes de la lista (CEPLAN 2021, INEI 2025, MINCETUR 2025, PROMPERÚ 2026, Ipsos 2024, FAO 2024, ONU 2015) son oficiales y recientes, y por eso se mantiene el nivel Logrado. Para subir de nivel, falta cerrar el uso riguroso: al menos 12 fuentes citadas en el texto no figuran en las referencias (incluidas las cinco empresas del 3.4 y PROMPERÚ 2025); las secciones 1.1.2 y 1.2.4 afirman que se usan «artículos científicos sobre liofilización y deshidratación», pero no se cita ninguno; el análisis crítico de los límites de cada dato (que sí tenía la versión anterior) se perdió; y la URL de INEI (2025a) apunta a un archivo genérico."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencias vinculadas a megatendencias, ODS y necesidades del cliente.", "falta": "Cumple con cifras de fuentes oficiales, causas y consecuencias, ODS con metas específicas y dos megatendencias. Para llegar a Sobresaliente falta que el problema se formule desde el cliente (hoy se plantea como «oportunidad», pp. 5 y 9), que las cifras dimensionen a los turistas nacionales y no solo el contexto (el dato del INEI 2024 en la p. 4 no trae cifra; los porcentajes de PromPerú de la p. 5 corresponden a turistas extranjeros), y que el problema social tenga datos y no solo hipótesis generales."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Los seis apartados están completos, incluido el 2.3. Falta demostrar la diferenciación con una comparación por criterios frente a Pouchamama y a los antecedentes locales, y alinear el segmento entre la descripción (2.1) y los segmentos (2.5), con rango de edad y tamaño del principal."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía argumentando la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "El BMC y el mapa de empatía existen y los bloques se explican con coherencia. Para subir de nivel falta argumentar explícitamente cómo se sostienen entre sí los bloques (segmento, propuesta, canales, ingresos), agregar los indicadores de gestión, corregir la numeración del capítulo y rotular el BMC y el mapa como figura o tabla con fuente."}], "viabilidad": {"resumen": "La versión nueva admite que el registro sanitario y la vida útil están pendientes, lo que es un avance. Los riesgos de fondo siguen abiertos: el trámite y la planta habilitada, la factibilidad de liofilizar un guiso de cerdo, el rotulado y la competencia de un liofilizado peruano ya existente. Conviene empezar a probarlos antes de la AA2.", "riesgos": [{"tema": "Regulación", "titulo": "Registro sanitario y planta habilitada (DIGESA)", "choque": "La ficha (p. 17) indica «Pendiente de gestión ante DIGESA, previo a la comercialización». Un alimento envasado con carne requiere registro sanitario y producción en un establecimiento con buenas prácticas de manufactura y HACCP; no puede elaborarse en una cocina doméstica. El BMC menciona «trámites sanitarios» en costos y «empresas especializadas en procesamiento» como socios (p. 35), pero no define dónde se fabricaría el prototipo.", "ideas": ["Averiguar en DIGESA el procedimiento y los requisitos del registro sanitario para alimentos deshidratados o liofilizados con carne.", "Explorar maquila con una planta habilitada en Arequipa o con laboratorios de industrias alimentarias de una universidad.", "Mientras no haya registro, limitar el MVP a degustaciones controladas y pruebas sensoriales, sin venta comercial."]}, {"tema": "Tecnología", "titulo": "Viabilidad técnica de liofilizar o deshidratar un guiso de cerdo", "choque": "El adobo es un guiso con grasa y carne de cerdo; la grasa dificulta la liofilización, puede enranciarse y la carne rehidratada suele quedar fibrosa. La ficha todavía no define si será deshidratado o liofilizado («según los resultados de las pruebas técnicas», p. 16), que implican costos e infraestructura muy distintos, y fija un objetivo de 6 meses de vida útil (p. 17). Los 3 a 5 minutos de preparación se declaran estimados.", "ideas": ["Buscar artículos científicos sobre liofilización y deshidratación de carnes y comidas preparadas para decidir la tecnología (las secciones 1.1.2 y 1.2.4 los mencionan, pero no se citan).", "Decidir si el prototipo usará cerdo magro, carne deshilachada u otra estrategia para controlar la grasa.", "Consultar con un tecnólogo de alimentos cómo estimar la vida útil (actividad de agua, pruebas aceleradas)."]}, {"tema": "Regulación", "titulo": "Octógonos de advertencia y empaque como souvenir", "choque": "Por la Ley 30021, un adobo concentrado probablemente supere los límites de sodio o grasas saturadas y deba llevar octógonos. La versión anterior los mencionaba en la ficha; la nueva ya no incluye el rotulado, aunque el producto se plantea como recuerdo gastronómico para turistas (Caso 3, p. 27).", "ideas": ["Estimar el perfil nutricional de una porción de 60 g con tablas de composición de alimentos (CENAN/INS) y compararlo con los parámetros de la Ley 30021.", "Evaluar ajustes de receta y medir en la prueba sensorial si se pierde la identidad del plato.", "Reincorporar el rotulado en la ficha técnica y diseñar el envase considerando el espacio de los octógonos."]}, {"tema": "Mercado", "titulo": "Competencia de un liofilizado peruano ya existente", "choque": "Pouchamama (p. 36) ya vende platos peruanos liofilizados a viajeros. La propuesta de Adobito AQP se diferencia por la identidad arequipeña, pero el diferencial depende de que un turista nacional prefiera un adobo liofilizado frente a otros recuerdos gastronómicos o al plato fresco en la picantería, y todavía no se argumenta con criterios.", "ideas": ["Construir la tabla comparativa por criterios que se pide en el cap. 2.", "Definir qué experiencia ofrece Adobito AQP que Pouchamama no cubre (por ejemplo, el vínculo con la picantería de origen o el souvenir regional).", "Considerar alianzas con picanterías reconocidas para dar legitimidad al producto."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "incompleto", "nota": "Indica «Instituto CERTUS», carrera, curso, docente e integrantes (p. 1), pero la carrera es una sola («Dirección de Empresas») para las cuatro integrantes; faltan el título del proyecto, la sección y el número de grupo, y el docente figura como «Jeanpier Brandol Ancorij Sanchez»; verificar el apellido."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Ya hay índice (p. 2), con páginas coincidentes con el PDF. La numeración de los apartados del cap. 3 es incorrecta («3.3 Identificación… 3.3.1 / 3.2.2…3.2.9», «3.4 Competidores / 3.3.1, 3.3.2»)."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "incompleto", "nota": "Hay contexto con cifras (pp. 4-6), antecedentes locales e internacionales (pp. 6-7) y causas y consecuencias (1.1.1, pp. 7-8). Se formula como «oportunidad» y el dato de INEI 2024 no trae cifra."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "incompleto", "nota": "Hay ODS 9 y 12 con metas (pp. 10-11), dos megatendencias de CEPLAN (pp. 11-12) y causas y consecuencias (1.2.3, pp. 12-13). El problema social es general, sin cifras; los apartados 1.1.2 y 1.2.4 duplican el título «Importancia de las fuentes bibliográficas»."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Descripción clara (p. 15); el público objetivo mencionado («estudiantes, trabajadores, turistas») no coincide con el segmento principal de la 2.5."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Tabla de texto con 20 características (pp. 15-18), con nota de elaboración propia y de validación pendiente. Sin número y título de tabla; ya no incluye rotulado ni octógonos."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Subsanado: beneficios funcionales y emocionales (pp. 18-19)."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "incompleto", "nota": "Tabla problema-solución y alternativas existentes (pp. 20-21); la diferenciación se enuncia pero no se demuestra con comparación por criterios; la tabla no tiene número ni fuente."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "incompleto", "nota": "Tres segmentos con segmentación y datos de MINCETUR, PROMPERÚ e INEI (pp. 22-25). Edad y tamaño del principal sin definir; datos de turistas extranjeros bajo un segmento complementario mixto; rótulos de imágenes sueltos («Gobierno del Perú», «Boletines», «INEI», «Visita Arequipa»)."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Cinco casos hipotéticos rotulados como tales (pp. 26-28)."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Tabla con sus seis bloques para el turista nacional (p. 30), con nota de hipótesis. Sin número y título de figura o tabla; erratas («un recuerdo auténtica»)."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Imagen con los 9 bloques (p. 31) y explicación de cada bloque en texto (pp. 32-35), coherente con la ficha. Sin figura numerada ni fuente; numeración errónea; la explicación describe pero no argumenta la coherencia entre bloques."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Cinco competidores (tres directos y dos indirectos) con fortalezas, debilidades, ventaja competitiva y estrategia de diferenciación (pp. 36-39). Faltan la matriz comparativa y las referencias; rotulado con numeración errada."}, {"codigo": "3.x", "apartado": "Indicadores de gestión", "estado": "ausente", "nota": "No hay KPI con fórmula y ejemplo de cálculo."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Nueve referencias (pp. 40-41) con asteriscos de formato; no figuran al menos 12 fuentes citadas en el texto, incluidas las empresas del 3.4."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "El capítulo conserva sus cifras, ODS y megatendencias y ahora desarrolla las metas específicas de los ODS 9 y 12. Persisten la formulación desde la solución y la falta de dimensionamiento del problema, y se perdió parte del análisis crítico de los datos.", "observaciones": [{"severidad": "importante", "titulo": "El problema sigue formulado desde la solución", "ubicacion": "1.1, pp. 5-6 y 1.2, p. 9", "cita": "Este contexto representa una oportunidad para explorar nuevas formas de presentar y difundir preparaciones tradicionales como el adobo arequipeño", "problema": "El apartado 1.1 describe un contexto favorable y una oportunidad comercial, pero no enuncia qué dificultad concreta tiene el cliente ni a quién afecta. El apartado 1.2 abre con «existe la necesidad de impulsar la innovación tecnológica» (p. 9), que justifica el producto, no un problema social. Hablar de lo que «merece ser evaluada» (p. 6) confirma que se parte de la solución (liofilizar) y no del cliente.", "mejora": "Redactar en un párrafo el problema desde el cliente, con la forma «los turistas nacionales que visitan Arequipa no pueden llevarse o consumir después el adobo porque…», y después mostrar cómo las cifras lo respaldan."}, {"severidad": "importante", "titulo": "Las cifras describen el contexto, no dimensionan el problema; el dato de INEI 2024 no trae cifra", "ubicacion": "1.1, pp. 4-5", "cita": "el Instituto Nacional de Estadística e Informática (INEI, 2024) presenta información sobre la participación del gasto en alimentos consumidos fuera del hogar", "problema": "La cita de INEI (2024) no incluye ningún dato y tampoco figura en las referencias. El 59 % de Ipsos (p. 4) y el tiempo de cocina (2 h 11 min frente a 58 min) no están acotados a Arequipa ni al segmento principal, y se perdió la lectura crítica que la versión anterior hacía de cada cifra («no representa una medición directa de la demanda»). Además, los porcentajes de PromPerú de la p. 5 (99 % y 96 %) corresponden a turistas extranjeros, no al segmento de turistas nacionales.", "mejora": "Reemplazar o completar con cifras acotadas al segmento principal (por ejemplo, gasto en alimentación de los turistas nacionales o compra de productos típicos como recuerdo en Arequipa, con MINCETUR o PromPerú), poner la cifra concreta del INEI o retirar la cita, y volver a señalar el alcance de cada dato."}, {"severidad": "importante", "titulo": "Problema social general, sin cifras ni respaldo de la FAO", "ubicacion": "1.2, pp. 9-10 y 1.2.3, pp. 12-13", "cita": "Estas condiciones pueden limitar la diversificación de productos alimenticios regionales y reducir las oportunidades de generar valor agregado a partir de la gastronomía local.", "problema": "Las causas y consecuencias del problema social están redactadas con «pueden» y «posibles», sin un solo dato que las respalde. Los ODS ahora traen metas (9.4, 9.5, 12.2, 12.3, 12.5), lo cual se reconoce como mejora, pero las pérdidas de alimentos se mencionan sin cifra: la FAO (2024) se cita en la p. 6 solo como «se desperdician alimentos» y las megatendencias de CEPLAN (pp. 11-12) no incluyen datos que las acoten. La meta 12.3 queda sin evidencia.", "mejora": "Incorporar la cifra de la FAO (2024) que ya tienen en las referencias y, si es posible, una de CEPLAN o del Ministerio de Desarrollo Agrario sobre pérdidas poscosecha o en la venta al detalle; vincular cada meta ODS con un dato del problema."}, {"severidad": "sugerencia", "titulo": "Apartados duplicados sobre las fuentes y denominación inconsistente del producto", "ubicacion": "1.1.2, p. 8; 1.2.4, p. 13; pp. 9, 10 y 12", "cita": "se respalda la necesidad de desarrollar una sopa instantánea basada en el adobo arequipeño", "problema": "Los apartados 1.1.2 y 1.2.4 tienen el mismo título y explican en abstracto para qué sirven las fuentes, además de afirmar que se usan «artículos científicos sobre liofilización y deshidratación», que no se citan en ninguna parte. El producto se llama «sopa instantánea» en las pp. 9, 10 y 12, pero en el resto del informe es un «adobo arequipeño instantáneo» en vaso.", "mejora": "Reemplazar ambos apartados por un breve análisis de qué aporta cada fuente al problema (como en la versión anterior) o eliminarlos, y usar una sola denominación del producto en todo el informe."}]}, {"etiqueta": "Capítulo II", "titulo": "Definición de propuestas de valor únicas", "resumen": "Capítulo completo y mejor estructurado: ya tiene el 2.3 y una ficha transparente sobre lo que falta validar. Pendientes: demostrar el diferencial, alinear el segmento y separar a los turistas extranjeros.", "observaciones": [{"severidad": "importante", "titulo": "El diferencial está enunciado, pero no demostrado frente al competidor más cercano", "ubicacion": "2.4, pp. 20-21 y 3.4, p. 36", "cita": "Adobito AQP busca diferenciarse de las siguientes alternativas: Picanterías y restaurantes… Servicio de delivery… Presentaciones congeladas… Sopas instantáneas", "problema": "La lista de alternativas de la p. 21 no incluye a Pouchamama, que ya vende platos peruanos liofilizados a viajeros (y que el propio informe analiza en la p. 36), ni a los antecedentes locales de la p. 7 (La Sazón de la Abuela, La Despensa). Además, la diferenciación se afirma por frase («no están elaboradas específicamente a partir de la receta del adobo») y no con criterios comparables; lo mismo ocurre con la ventaja competitiva del cap. 3, que se apoya en «identidad regional específica» sin explicar por qué es defendible.", "mejora": "Elaborar una tabla comparativa con criterios (formato y tecnología, necesidad de frío, identidad regional, ocasión de consumo, canal) que incluya a esos competidores y a Adobito AQP, y redactar una conclusión de una o dos frases sobre el diferencial que sí es único."}, {"severidad": "importante", "titulo": "Segmento principal inconsistente entre 2.1 y 2.5, y sin edad ni tamaño", "ubicacion": "2.1, p. 15; 2.5, pp. 22-25", "cita": "Está dirigido principalmente a estudiantes, trabajadores, turistas y personas que desean disfrutar de este plato típico", "problema": "La 2.1 menciona estudiantes como público principal, que no aparecen como segmento en la 2.5; allí el principal son los turistas nacionales, con rango de edad «que se determinará» (p. 22) y sin una estimación de tamaño (solo arribos totales, 1 207 036, no turistas que consumirían el producto). El segmento complementario (p. 24) mezcla a residentes de Arequipa y consumidores de otras ciudades, lo que no define a un cliente concreto.", "mejora": "Redactar la 2.1 con el mismo segmento principal de la 2.5, definir una edad tentativa (hipótesis) y estimar el tamaño con los datos de MINCETUR (por ejemplo, arribos nacionales por procedencia), y separar claramente el segmento complementario."}, {"severidad": "importante", "titulo": "Datos de turistas extranjeros usados sin constituir un segmento propio", "ubicacion": "1.1, p. 5 y 2.5, p. 25", "cita": "Aunque estos datos corresponden a turistas extranjeros y no a consumidores nacionales, permiten reconocer la importancia de la gastronomía como parte de la experiencia turística de Arequipa.", "problema": "Reconocemos que la 2.5 aclara el origen de los datos. Sin embargo, los porcentajes de PromPerú (2025) sobre el turista extranjero (99 % y 96 %) respaldan en el cap. 1 (p. 5) el contexto del cliente nacional y, en el cap. 2, se colocan bajo un segmento «complementario» de consumidores regionales, sin que el turista extranjero tenga segmentación, tamaño ni propuesta propia. Esas cifras solo sirven para ese segmento.", "mejora": "Mantener a los turistas nacionales como segmento principal y, si se considera al turista extranjero, crearlo como segmento separado, con su propia segmentación, datos de PromPerú y caso de uso; en el cap. 1 usar para los nacionales datos de turismo interno."}, {"severidad": "sugerencia", "titulo": "La ficha técnica deja definiciones abiertas que conviene fijar", "ubicacion": "2.2, pp. 16-18", "cita": "Deshidratación o liofilización, según los resultados de las pruebas técnicas.", "problema": "La ficha es honesta al marcar vida útil, tiempo y registro sanitario como pendientes, y eso se valora. Quedan abiertas la tecnología de conservación y el rotulado nutricional (la versión anterior mencionaba los octógonos), que condicionan el empaque y la vida útil.", "mejora": "Elegir una tecnología tentativa con una fuente técnica que la respalde, y reincorporar el rotulado (sodio y grasas saturadas, octógonos si corresponde)."}, {"severidad": "sugerencia", "titulo": "Casos de uso hipotéticos; la validación real se exigirá en el cap. 5", "ubicacion": "2.6, pp. 26-28", "cita": "Su aceptación deberá comprobarse mediante entrevistas, encuestas y pruebas sensoriales del prototipo", "problema": "Los cinco casos están rotulados como hipotéticos, lo cual es aceptable para la AA1. Los casos 4 y 5 (profesional que vive solo y consumidor interesado) no se enlazan con ningún dato del cap. 1 o 2.5. Se recuerda que la validación real con clientes corresponde al capítulo 5 (AA2).", "mejora": "Conectar cada caso con un dato o una frase del segmento; reservar la validación real con clientes para el cap. 5."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El capítulo avanzó de forma clara: explica los nueve bloques y rehízo los competidores con fortalezas y estrategia de diferenciación. Faltan los indicadores de gestión, la matriz comparativa, la numeración y argumentar la coherencia entre bloques.", "observaciones": [{"severidad": "importante", "titulo": "Faltan los indicadores de gestión", "ubicacion": "Capítulo 3", "cita": "", "problema": "La estructura del TAP pide indicadores de gestión (KPI con fórmula y ejemplo de cálculo) en el capítulo 3 y el informe no los tiene. Las actividades clave (p. 34: pruebas de calidad, vida útil, características sensoriales) ya ofrecen insumos para definirlos.", "mejora": "Agregar de 3 a 5 indicadores (por ejemplo, rendimiento de insumos por lote, merma, costo por unidad, tasa de recompra, satisfacción en la prueba sensorial), cada uno con su fórmula y un ejemplo numérico."}, {"severidad": "importante", "titulo": "La explicación de los 9 bloques es descriptiva y no argumenta la coherencia", "ubicacion": "3.2, pp. 32-35", "cita": "La principal fuente de ingresos de Adobito AQP será la venta de su presentación individual de 60 gramos", "problema": "Los bloques guardan coherencia con la ficha y con el segmento de turistas nacionales (vaso de 60 g, S/ 19.90, tiendas turísticas, redes sociales), pero cada uno se redacta por separado. No se argumenta cómo se sostienen entre sí (por ejemplo, por qué los canales elegidos alcanzan al turista nacional, qué socios cubren la actividad de liofilización o el trámite sanitario, o por qué la relación con el cliente es digital si el producto se compra en tienda). La imagen del BMC (p. 31) no tiene número, título ni fuente.", "mejora": "Agregar un párrafo de cierre que relacione propuesta de valor, segmento, canales, ingresos y socios, y rotular el BMC como «Figura n» con título y «Elaboración propia»."}, {"severidad": "importante", "titulo": "Competidores: sin matriz comparativa y con la clasificación directo/indirecto por revisar", "ubicacion": "3.4, pp. 36-39", "cita": "Pouchamama comercializa comidas peruanas liofilizadas, orientadas principalmente a excursionistas y viajeros.", "problema": "El análisis mejora mucho respecto a la versión anterior, pero ya no hay una tabla comparativa que permita ver las diferencias: hay que leer cinco fichas. Solo Pouchamama compite por el formato; Kuik (congelado) y La Mundial (picantería) son más bien alternativas de otra categoría, y no coinciden con las alternativas listadas en el cap. 2.4. Además, ninguna de las fuentes del 3.4 está en las referencias.", "mejora": "Agregar una tabla resumen con los cinco competidores y los criterios de comparación, revisar qué competidores son directos por formato y cuáles indirectos por necesidad, e incluir las fuentes en la bibliografía."}, {"severidad": "importante", "titulo": "Numeración errónea de los títulos del capítulo 3", "ubicacion": "3.2 a 3.4, pp. 31-36 y p. 2", "cita": "3.2.2. Propuesta de valor", "problema": "Tras «3.2 Business Model Canvas» aparece «3.3 Identificación y características de los 9 bloques» y sus apartados se numeran «3.3.1», «3.2.2»…«3.2.9»; luego «3.4 COMPETIDORES» contiene «3.3.1» y «3.3.2». El índice (p. 2) reproduce el error.", "mejora": "Renumerar: 3.1 Mapa de empatía, 3.2 BMC con 3.2.1 a 3.2.9, 3.3 Competidores (3.3.1 y 3.3.2) y 3.4 Indicadores de gestión, y actualizar el índice."}, {"severidad": "sugerencia", "titulo": "Mapa de empatía sin número, título ni fuente, con erratas", "ubicacion": "3.1, p. 30", "cita": "Quiere llevar un recuerdo auténtica", "problema": "El mapa de empatía se presenta como tabla con nota «Elaboración propia», lo cual es válido, pero sin numeración ni título. Hay una errata en «un recuerdo auténtica». Cubre solo al turista nacional; los segmentos secundarios no tienen mapa, lo que es aceptable si se aclara.", "mejora": "Rotular como «Tabla n» o «Figura n» con título y fuente, corregir la redacción y dejar dicho que el mapa corresponde al segmento principal."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, referencias y tablas", "resumen": "Hay avances (índice, notas en la ficha y en el mapa), pero el rigor de trabajo académico sigue incompleto: carátula, referencias y rotulado de tablas y figuras.", "observaciones": [{"severidad": "importante", "titulo": "Carátula incompleta", "ubicacion": "Carátula, p. 1", "cita": "Carrera: Dirección de Empresas", "problema": "La carátula no tiene el título del proyecto, la sección ni el número de grupo; indica una sola carrera para las cuatro integrantes, y el apellido del docente figura como «Ancorij», que conviene verificar.", "mejora": "Completar la carátula con título, sección, grupo, carrera de cada integrante y el nombre correcto del docente, siguiendo el formato del TAP."}, {"severidad": "importante", "titulo": "Referencias incompletas: al menos 12 fuentes citadas no figuran en la lista", "ubicacion": "Referencias, pp. 40-41", "cita": "Pouchamama, s. f.; Kuik, s. f.; Tottus Perú, s. f.; Paladar Gourmet, s. f.; Gestión, 2024; Encuentro, 2023", "problema": "La lista tiene 9 entradas y faltan en ella: INEI (2024), PROMPERÚ (2025), Gestión/Flanqueo (2024), Encuentro (2023), La Despensa (s. f.), Ministry of Agriculture, Forestry and Fisheries of Japan (s. f.), Tiffins (s. f.), Pouchamama, Kuik, Picantería La Mundial, Tottus Perú y Paladar Gourmet. «INEI, 2025» no distingue entre 2025a y 2025b; la referencia de MINCETUR (s. f.) figura a nombre de la Gerencia Regional. Persisten asteriscos de formato y la URL de INEI (2025a) apunta a un archivo genérico («Lib2010/libro.pdf»).", "mejora": "Completar las referencias en APA 7, hacer coincidir autor y año entre el texto y la lista, usar 2025a y 2025b en el texto, quitar los asteriscos y verificar la URL."}, {"severidad": "importante", "titulo": "Tablas y figuras sin numeración, título y fuente consistentes", "ubicacion": "pp. 15-18, 20-21, 23-25, 30 y 31", "cita": "Gobierno del Perú / Boletines", "problema": "La ficha técnica (pp. 15-18), la tabla problema-solución (pp. 20-21), el mapa de empatía (p. 30) y el BMC (p. 31) no tienen número, título ni fuente en el formato APA 7 (la ficha y el mapa sí traen «Nota. Elaboración propia»). Entre las pp. 23 y 25 quedan rótulos sueltos («Gobierno del Perú», «Boletines», «INEI», «Visita Arequipa») que parecen restos de capturas de las fuentes.", "mejora": "Numerar cada tabla y figura con título arriba y fuente abajo (por ejemplo, «Tabla 1. Ficha técnica de Adobito AQP» / «Elaboración propia, a partir de…») y eliminar los rótulos sueltos."}]}], "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 3, "responsabilidad": 3}}</script>

<div class="wrap">
  <nav class="toc" aria-label="Contenido">
    <div class="lbl">Contenido</div>
    <ol id="toc"></ol>
    <p class="progress" id="progress" style="margin-top:14px"></p>
  </nav>
  <main id="main"></main>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const isAA2 = s => /^AA2/.test(s.etiqueta || '');
const secAA2 = D.secciones.filter(isAA2);
const fortAA1 = (D.fortalezas || []).filter(f => !/^AA2:/.test(f));
const fortAA2 = (D.fortalezas || []).filter(f => /^AA2:/.test(f)).map(f => f.replace(/^AA2:\s*/, ''));
const priAA1 = (D.prioridades || []).filter(p => !/^AA2:/.test(p));
const priAA2 = (D.prioridades || []).filter(p => /^AA2:/.test(p)).map(p => p.replace(/^AA2:\s*/, ''));
const all = D.secciones.filter(s => !isAA2(s)).flatMap(s => s.observaciones.map(o => o.severidad));
const allAA2 = secAA2.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;
const countAA2 = sev => allAA2.filter(x => x === sev).length;
const hasAA2 = secAA2.length > 0 || fortAA2.length > 0 || priAA2.length > 0;
const tabbar = hasAA2 ? `<nav class="tabs" role="tablist" aria-label="Evidencias">
  <button class="tab on" role="tab" data-tab="aa1" aria-selected="true">Evidencia 1 (AA1)</button>
  <button class="tab" role="tab" data-tab="aa2" aria-selected="false">Evidencia 2 (AA2) <span class="n">${allAA2.length}</span></button>
</nav>` : '';

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += tabbar;
html += '<div id="tab-aa1" class="tabpane">';
html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${fortAA1.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA1.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>
    <div class="grade"><span class="big">${total}</span><span class="of">/ 20</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${priAA1.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

const renderSec = (s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
  </section>`;
};
D.secciones.forEach((s, si) => { if (!isAA2(s)) renderSec(s, si); });
html += '</div>';

if (hasAA2) {
  html += '<div id="tab-aa2" class="tabpane" hidden>';
  html += `<section class="block aa2" id="aa2">
    <div class="head"><div class="eyebrow">Evidencia 2 · avance en curso</div><h2>Evidencia 2 (AA2): retroalimentación de avance</h2></div>
    <p class="summary">Esta parte corresponde a la Evidencia 2 (capítulos 4, 5 y 6 y elevator pitch). Es retroalimentación formativa para que puedan mejorar mientras avanzan: todavía no es una calificación. Se irá actualizando en este mismo enlace.</p>
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
