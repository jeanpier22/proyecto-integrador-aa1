do tras la prueba piloto."}, {"severidad": "importante", "titulo": "Los segmentos del MVP no se identifican y no se filtra el público objetivo", "ubicacion": "Preguntas 1 a 3 (edad, distrito, relación con el alquiler); 5.1.2", "cita": "¿En qué distrito de Arequipa resides actualmente?", "problema": "El MVP (capítulo IV) se acota a equipos tecnológicos y audiovisuales para estudiantes universitarios y creadores de contenido, pero el formulario no pregunta ocupación, si estudia, si crea contenido, si posee equipos ni su valor. La edad parte en «18 a 24 años» sin descartar menores y la lista de distritos incluye una opción abierta, por lo que se puede responder desde fuera de Arequipa. Al difundirse por redes, grupos académicos y contactos personales (5.1.3), habrá un sesgo de autoselección hacia personas cercanas al equipo, sin que luego se puedan separar los resultados del segmento prioritario.", "mejora": "Agregar: ocupación (estudiante universitario, creador de contenido, trabajador, emprendedor, organizador de eventos), si posee equipos tecnológicos (cuáles, valor aproximado) y una pregunta filtro «¿Resides en Arequipa?» que finalice el formulario si la respuesta es no. Reportar los resultados por segmento y por perfil, y declarar el método de difusión y sus sesgos."}, {"severidad": "importante", "titulo": "Fallas de flujo: preguntas obligatorias que no corresponden al perfil", "ubicacion": "Pregunta 3 y sus saltos; «¿Tambien te interesa ofrecer objetos propios en alquiler?»; sección «Validación de la propuesta AlquiTodo»", "cita": "¿Qué tan dispuesto(a) estarías a utilizar AlquiTodo para ofrecer tus objetos en alquiler?", "problema": "(1) La sección de validación es común y cada pregunta es obligatoria, por lo que un arrendatario puro debe responder disposición «para ofrecer», y un propietario puro, disposición «para alquilar»; esto contamina los promedios por perfil. (2) Quien elige «Me interesan ambas actividades» pasa por la sección de arrendatarios y luego se le pregunta si «también» le interesa ofrecer, lo que es redundante y si responde «No» se contradice. (3) La sección «Motivos de desinterés» no define un salto propio: salvo que se haya configurado en la revisión de «Ir a sección», quien declara no tener interés continuaría hacia las preguntas de arrendatarios (verificar en la vista previa del formulario). (4) La pregunta sobre la última vez que alquilaron «y cuánto pagaron» mezcla dos datos y es solo para quienes respondieron «Sí».", "mejora": "Separar la disposición de uso en dos preguntas condicionadas al perfil o hacer una sola («qué tan dispuesto estarías a usar AlquiTodo como…»). Retirar la pregunta «¿También…?» para el perfil «ambas» y dirigir cada rama al final del formulario con «Enviar» cuando corresponda. Hacer una prueba de recorrido completo con los cuatro perfiles y registrar en el informe la prueba piloto que 5.1.3 solo «recomienda»."}, {"severidad": "importante", "titulo": "Escalas y preguntas de importancia que no permiten priorizar", "ubicacion": "«De las siguientes funcionalidades de AlquiTodo, ¿cuáles consideras más importantes?» (selección múltiple de 9 funciones); escalas 1–5", "cita": "Pagos integrados en la plataforma. / Registro fotográfico del objeto durante la entrega y devolución. / Sistema para reportar incidencias o problemas.", "problema": "Sin límite de selecciones, es probable que la mayoría marque casi todas, y no habrá forma de decidir qué entra y qué sale del MVP; el informe proponía una cuadrícula con escala de importancia, que se perdió. Las escalas de disposición solo rotulan los extremos («Nada dispuesto(a)» / «Muy dispuesto(a)»), mientras el informe preveía los cinco niveles. Algunas preguntas mezclan pasado e hipótesis («Cuando alquilas o necesitarías alquilar…») o usan verbos que inducen respuestas posibles pero no probables («¿Qué dificultades podrías encontrar…?», «¿Con qué frecuencia podrías necesitar…?»), y la frecuencia de objetos sin uso («Casi siempre… Nunca») no tiene periodo ni tipo de objeto.", "mejora": "Pedir elegir las 3 funciones más importantes, o ordenar o puntuar cada una, e incluir una pregunta «cuál no usarías». Rotular los cinco niveles de cada escala. Redactar en pasado o en conducta real cuando sea posible («En los últimos 12 meses, ¿cuántas veces…?») y fijar periodos («en el último año»)."}, {"severidad": "importante", "titulo": "Hipótesis de mayor riesgo sin cobertura: valor del diferencial y compromiso real", "ubicacion": "Cobertura frente a Tabla 5 (3.3.4), Tabla 6 y objetivos del capítulo IV", "cita": "", "problema": "Cobertura actual: problema y frecuencia (sí), tipos de objetos y categoría tecnológica (sí), preocupaciones y condiciones del propietario (sí), importancia de funciones (sí), disposición de uso (sí, en abstracto), comisión y tarifa (parcial, ver observación sobre disposición de pago). Faltan: (a) valor del diferencial frente a Facebook (por qué importaría el calendario por fechas o el registro fotográfico para ceder el 15 %); (b) fuga de operaciones; (c) canales actuales (ya mencionado); (d) disposición a pagar dentro de la plataforma (Yape, tarjeta) que depende del tipo de pago del MVP; (e) valor de los equipos que publicarían; (f) cualquier medida de compromiso real (dejar WhatsApp o correo para el piloto), que da una conversión mucho más confiable que una escala de 1 a 5; (g) preguntas vinculadas a los indicadores de la Tabla 6 (conversión de solicitud a pago, publicaciones por propietario).", "mejora": "Elaborar una matriz hipótesis → pregunta → indicador → umbral de éxito (por ejemplo, ≥ 40 % de propietarios dispuestos a publicar un equipo de más de S/ 500 con el esquema mostrado; ≥ 30 % de arrendatarios que elegirían AlquiTodo frente a Facebook). Añadir las preguntas faltantes y una de contacto voluntario para el piloto."}, {"severidad": "sugerencia", "titulo": "Sin plan de análisis ni criterios de decisión, y entrevistas con preguntas guiadas", "ubicacion": "5.1.1; 5.1.4, pregunta 7 de la guía de entrevista", "cita": "¿Considera viable el modelo de ingresos basado en una comisión del 15 % para el propietario y una tarifa de servicio del 5 % para el arrendatario?", "problema": "Los objetivos específicos de 5.1.1 no tienen indicador ni meta, y no se declara cómo se analizarán los datos (tablas de frecuencia, cruces por perfil y segmento, análisis de las respuestas abiertas). La pregunta 7 de la guía induce una respuesta afirmativa («¿Considera viable…?») y las entrevistas a especialistas (desarrolladores, comercio electrónico) no sustituyen la voz de propietarios y arrendatarios reales.", "mejora": "Declarar el plan de análisis y los umbrales antes de aplicar. Reformular la pregunta de la guía de forma abierta («¿Qué comisión consideraría razonable para este tipo de plataforma y por qué?») y agregar al menos 3 entrevistas breves a propietarios de equipos de la categoría inicial."}, {"severidad": "sugerencia", "titulo": "Detalles de forma del formulario", "ubicacion": "Formulario: títulos de sección y opciones", "cita": "MOTIVOS DE DESINTERES", "problema": "Falta la tilde en «DESINTERES» y en la pregunta «¿Tambien te interesa…?»; los distritos terminan con punto («Cayma.»), igual que otras opciones; el formulario declara «No existen respuestas correctas o incorrectas» pero no informa cómo se tratarán los datos personales si se pide iniciar sesión con Google. No hay una pregunta que pida el correo o WhatsApp para el piloto ni consentimiento para recontactar.", "mejora": "Corregir ortografía y uniformar la puntuación de las opciones; indicar que la encuesta es anónima (o qué datos se guardan) y agregar un campo opcional de contacto con consentimiento."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Modelo de negocio (cambios 11/11)", "resumen": "La versión del 11/11 eliminó el contenido de 3.4 (Tabla 6 de indicadores de gestión): queda solo el título. Era el único puente medible entre el modelo y la validación.", "observaciones": [{"severidad": "importante", "titulo": "La sección 3.4 «Indicadores de gestión» quedó vacía", "ubicacion": "3.4, p. 62 (índice) y cuerpo del cap. 3", "cita": "3.4. Indicadores de gestión [sin contenido]", "problema": "En la versión del 06/11 la 3.4 traía la Tabla 6 (publicaciones activas, solicitudes por publicación, tasa de aceptación ≥ 60 %, alquileres completados ≥ 20 al mes, ingreso bruto S/ 20 por cada S/ 100, incidencias ≤ 10 %). Se borró sin reemplazo. Sin ella, los objetivos del MVP (4.b) y los criterios del cap. 5 pierden el vínculo con las metas operativas, y el cap. 6 no tiene volúmenes de partida.", "mejora": "Restituir la Tabla 6 y volverla la base del cap. 6: usar las metas ya definidas (20 alquileres/mes al mes 3; ticket S/ 100) como supuesto de ingresos y cerrar la fórmula, p. ej. ingreso mensual = alquileres × ticket × 20 % = 20 × 100 × 0,20 = S/ 400, y reemplazarla por los valores reales de la encuesta (5.2) cuando existan."}, {"severidad": "sugerencia", "titulo": "Unificar la cifra de ingreso por alquiler con IGV y costo de pasarela", "ubicacion": "3.2.5 y Caso 3, pp. 44-45", "cita": "AlquiTodo obtendrá S/ 20 de ingreso bruto: S/ 15 + S/ 5", "problema": "El ingreso bruto de S/ 20 por cada S/ 100 se usa como si fuera ingreso neto. Con IGV 18 % y pasarela (Culqi 3,44 % + USD 0,20 sobre S/ 105) el margen de contribución es S/ 12,64, no S/ 20.", "mejora": "Agregar una fila «ingreso neto por alquiler»: 20/1,18 = S/ 16,95 menos pasarela S/ 4,31 = S/ 12,64 por cada S/ 100, y usar esa cifra en el cap. 6."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Producto mínimo viable", "resumen": "El cap. 4 no cambió respecto del 06/11: describe 11 funcionalidades y 7 objetivos, pero sin priorización, sin metas medibles, sin pasos de desarrollo ni herramientas. El apartado g) Imágenes sigue vacío.", "observaciones": [{"severidad": "critico", "titulo": "No hay herramientas para diseñar, construir y validar el MVP", "ubicacion": "Cap. 4 (a-g), pp. 63-68", "cita": "El MVP de AlquiTodo estará disponible inicialmente mediante una página web responsiva", "problema": "No se nombra ninguna herramienta de prototipado (Figma), desarrollo (framework, hosting, base de datos), pago ni medición; solo se decide «web sin app» y se listan navegadores y redes sociales (4.d y 4.f). Sin tabla de herramientas no se puede sustentar funcionalidad, usabilidad ni viabilidad técnica, ni costear el cap. 6.", "mejora": "Agregar la «Tabla 4.x Herramientas del MVP» con columnas herramienta, uso, criterio (funcionalidad/usabilidad/viabilidad), costo mensual S/, responsable y alternativa descartada. Ejemplo: Figma (prototipo, gratis); Firebase Hosting + Firestore + Auth (publicaciones y chat, cuotas gratis; cerca de S/ 0-10 al mes en piloto); Cloud Storage (fotos del estado del objeto); Google Forms (validación); Culqi (pasarela, 3,44 % + USD 0,20 por venta, fuera del MVP inicial). Indicar cuál de los 4 integrantes construye cada parte."}, {"severidad": "critico", "titulo": "Los objetivos del MVP no son medibles y no se enlazan con la validación", "ubicacion": "4.b, p. 64", "cita": "Validar la propuesta de valor: comprobar si los usuarios consideran conveniente contar con una plataforma…", "problema": "Los 7 objetivos son verbos de intención sin indicador, meta, muestra ni plazo. El cap. 5 sí define umbrales (≥ 60 % de disposición alta, ≥ 50 % de aceptación de tarifa), pero el cap. 4 no los usa, por lo que no hay trazabilidad objetivo del MVP, indicador y resultado.", "mejora": "Reescribir cada objetivo con indicador y fuente, p. ej.: «Evaluar la aceptación de la comisión: al menos 50 % de los propietarios acepta 15 % (n ≥ 40), medido en la pregunta 15 de la encuesta, antes del [fecha]». Añadir a la tabla de funcionalidades la columna «Objetivo que prueba»."}, {"severidad": "importante", "titulo": "Funcionalidades no priorizadas y sin pago ni calificaciones: la hipótesis más riesgosa queda sin probar", "ubicacion": "4.c, tabla de 11 funcionalidades", "cita": "La integración de una pasarela de pagos deberá evaluarse antes del lanzamiento comercial.", "problema": "Son 11 funciones al mismo nivel; un MVP «mínimo» exige separar esencial, complementaria y fuera de alcance. Además se excluyen pago, depósito y calificaciones, que son la fuente de ingreso (20 %) y de confianza que el cap. 3 declara como diferenciador; el cap. 3 anuncia calendario e incidencias y el cap. 4 no los incluye. El MVP no puede probar que el propietario ceda el 15 % si no hay cobro.", "mejora": "Agregar columnas «Prioridad (MoSCoW)» e «Hipótesis que prueba». Proponer un MVP concierge: reserva en la web y cobro manual por Yape o transferencia con comprobante, registrando la comisión del 20 %; así se mide aceptación de tarifa y fuga a WhatsApp sin pasarela. Mover calendario/disponibilidad e incidencias al MVP o justificar su salida."}, {"severidad": "importante", "titulo": "Faltan los pasos seguidos para desarrollar el MVP y las imágenes del prototipo", "ubicacion": "4.g «Imágenes», p. 68", "cita": "g) Imágenes [vacío]", "problema": "El apartado de imágenes está en blanco y no se documenta el proceso (flujo de usuario, wireframes, prototipo, pruebas con usuarios). La rúbrica exige «todos los pasos seguidos» para el nivel 4.", "mejora": "Incluir 4-6 capturas numeradas (Figura 4.1 registro, 4.2 publicación con fotos, 4.3 solicitud por fechas, 4.4 registro del estado del objeto, 4.5 chat) con fuente, más un cronograma de 4 pasos (requerimientos, wireframes, prototipo navegable, prueba con 5 usuarios) con fechas y responsables. Insertar el prototipo en el formulario del cap. 5."}, {"severidad": "sugerencia", "titulo": "Corregir formato académico del cap. 4", "ubicacion": "4.a-4.g", "cita": "Tablas sin número ni título", "problema": "Las tablas de funcionalidades, plataformas y redes sociales no tienen número, título ni «Nota. Elaboración propia»; el cap. 4 no usa numeración 4.1…", "mejora": "Numerar los apartados (4.1 Descripción, 4.2 Objetivos…) y rotular tablas y figuras en APA 7."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Validación del MVP (cambios 11/11)", "resumen": "El diseño mejoró: objetivo general y 7 específicos, tabla de criterios de aceptación definidos antes de aplicar, meta de 80 respuestas con cuota de 40 propietarios, piloto con 5 personas y enlace público forms.gle. Sigue sin resultados reales: 5.1.4 y 5.1.5 con marcadores y 5.2 con el texto de la plantilla.", "observaciones": [{"severidad": "critico", "titulo": "Siguen sin existir resultados, análisis ni mejoras al MVP", "ubicacion": "5.2, pp. 79-80", "cita": "Presentar los resultados de las encuestas, respetando el orden de cada pregunta.", "problema": "La sección 5.2 conserva las viñetas de la plantilla. No hay n obtenido, ni distribución por perfil, ni gráficos, ni conclusión sobre viabilidad. Sin datos reales el criterio no puede pasar de «En proceso».", "mejora": "Aplicar la encuesta y presentar en 5.2: (a) n total y por perfil (meta 80, ≥ 40 propietarios) y canal de origen; (b) un gráfico por pregunta con su interpretación; (c) la tabla de criterios del 5.1.1 con el resultado observado (p. ej. «propietarios con disposición 4-5: 27/40 = 67,5 %, cumple el 60 %»); (d) tabla hallazgo, decisión y mejora al MVP."}, {"severidad": "critico", "titulo": "Entrevistas a especialistas y organización de instrumentos siguen con marcadores", "ubicacion": "5.1.4 y 5.1.5, pp. 78-79", "cita": "Especialista 1: [Indicar nombre, profesión y experiencia, previa autorización] / [Insertar enlace de Google Forms]", "problema": "Se anuncian dos entrevistas pero no hay nombres, transcripción ni enlaces; 5.1.5 conserva «[Insertar enlace…]» aunque el formulario ya tiene enlace en 5.1.3.", "mejora": "Realizar las 2 entrevistas (guía de 8 preguntas ya definida), anexar acta o grabación con consentimiento y resumir 3 hallazgos por entrevistado. Completar 5.1.5 con la tabla instrumento, enlace, fecha y n. Si no hay especialistas, retirar la promesa."}, {"severidad": "importante", "titulo": "Objetivo y tabla de indicadores duplicados bajo el título 5.1.2; títulos repetidos en el índice", "ubicacion": "5.1.1 y 5.1.2, pp. 70-71", "cita": "El objetivo general de la validación es… / Para establecer los criterios de validación…", "problema": "El bloque del objetivo, los 7 específicos y la tabla de indicadores aparecen dos veces (dentro de 5.1.1 y de nuevo al abrir 5.1.2); el índice repite «5.1» y «5.1.2». Es un error de edición que resta rigor.", "mejora": "Eliminar el bloque duplicado de 5.1.2 y dejar allí solo población y muestra; corregir el índice."}, {"severidad": "importante", "titulo": "El informe ya no lista las preguntas y hay inconsistencias con el instrumento", "ubicacion": "5.1.3, pp. 71-78", "cita": "El cuestionario estará organizado en seis secciones: [Tabla 5.1]", "problema": "Se reemplazó el cuestionario de 16 preguntas por una tabla de 6 secciones (el formulario real tiene 24), pero ya no se puede verificar qué se pregunta. Además no hay filtro de residencia en Arequipa pese a que la población objetivo es arequipeña, y el criterio «las tres funcionalidades con mayor frecuencia» no define el desempate.", "mejora": "Anexar el cuestionario completo (o la exportación del Forms) y una tabla pregunta, objetivo específico que mide. Agregar el filtro de distrito y la definición de respuesta válida (completa, residente, sin duplicado)."}, {"severidad": "importante", "titulo": "Criterios de aceptación definidos, pero con umbrales débiles y sin las dos hipótesis críticas", "ubicacion": "5.1.1, tabla de indicadores", "cita": "Igual o superior al 50 % en cada perfil", "problema": "Es positivo haber fijado umbrales antes de aplicar. Pero con n = 40 propietarios, un 60 % tiene un margen de error cercano a ±15 puntos; no hay umbral para fuga fuera de la plataforma ni para confianza (depósito/seguro), que son las dos hipótesis críticas; y la disposición de pago se mide con porcentajes abstractos, no con el ejemplo en soles.", "mejora": "Añadir 2 indicadores: (1) % de propietarios que aceptarían 15 % sabiendo que Facebook es gratis (≥ 50 %); (2) % de arrendatarios que cerraría dentro de la plataforma (≥ 60 %). Declarar qué decisión se toma si no se cumple (p. ej. bajar la comisión a 10 % o cobrar solo al arrendatario)."}, {"severidad": "sugerencia", "titulo": "Documentar el resultado del piloto de 5 personas", "ubicacion": "5.1.3, p. 78", "cita": "Antes de la difusión general, se realizará una prueba piloto con cinco personas", "problema": "Hay una mejora real en el muestreo (cuota por lado del mercado, registro del origen, piloto), pero el piloto aún no tiene evidencia.", "mejora": "Registrar en el informe qué preguntas cambiaron tras el piloto (antes y después) como primera evidencia de mejora derivada de datos."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Proyección financiera (versión 11/11)", "resumen": "El cap. 6 sigue siendo la plantilla ajena «Cuadro 6.1 DEL TAP 2024» (inversión S/ 88 869 con maquinaria S/ 59 000, inmueble y vehículos), sin relación con una plataforma web. Las secciones 6.2 a 6.6 están vacías y no existen VAN, TIR ni PRI.", "observaciones": [{"severidad": "critico", "titulo": "La estructura de inversión es una plantilla ajena e incoherente con el MVP", "ubicacion": "6.1, pp. 80-81", "cita": "Cuadro 6.1 DEL TAP 2024 … Maquinarias S/59.000,00 … INVERSIÓN TOTAL S/88.869,00", "problema": "La tabla suma (82 414 + 6 455 = 88 869), pero corresponde a otro negocio: maquinaria S/ 59 000, inmueble S/ 7 316 y capital de trabajo vacío. AlquiTodo es una web sin inventario propio. Incluso el texto «contexto: A continuación indicaremos los principales» quedó sin terminar.", "mejora": "Construir una inversión propia: desarrollo inicial (p. ej. 300 h × S/ 50 = S/ 15 000), dominio y marca (cerca de S/ 70-300), equipos si no se poseen, constitución y licencias, marketing de lanzamiento y capital de trabajo de 3 meses (mantenimiento 3 × S/ 960 = S/ 2 880 más nube y comisiones). Referencia de S/ 18 000-22 000, no S/ 88 869. Respaldar cada partida con cotización."}, {"severidad": "critico", "titulo": "Faltan seis de las siete piezas del cap. 6", "ubicacion": "6.2 a 6.6, p. 81", "cita": "6.2. Estructura de Costos y Gastos [vacío] … 6.6. Flujo de Caja Económico proyectado [vacío]", "problema": "No hay estructura de costos y gastos, presupuesto de ingresos, presupuesto de egresos, flujo de caja mensual del año 1, flujo económico a 3 años ni valorización (VAN, TIR, PRI); tampoco existe sección 6.7. Con el cap. 6 en blanco, las proyecciones no tienen relación con el MVP.", "mejora": "Armar las 6 piezas con el MVP y el cap. 3 como base. Ingresos: ticket S/ 100 × 20 % × alquileres (meta 20/mes al mes 3 = S/ 400; escenario año 1 de 40/mes = S/ 800). Egresos: nube y servicios (S/ 78-350 al mes), pasarela 3,44 % + USD 0,20 por venta, mantenimiento (S/ 40/h × 12-24 h = S/ 480-960) y publicidad. Flujo mensual año 1, flujo anual a 3 años, VAN con COK explícito (p. ej. 15-20 %), TIR, PRI y valorización."}, {"severidad": "critico", "titulo": "Con las metas del propio informe el negocio no llega al punto de equilibrio", "ubicacion": "Cap. 3 (metas de Tabla 6 del 06/11) y cap. 4", "cita": "Al menos 20 alquileres al mes al tercer mes de operación", "problema": "Verificado con Python: margen de contribución por alquiler de S/ 100 = 20/1,18 − 4,31 (pasarela) = S/ 12,64 (S/ 15,69 sin IGV). Con 20 alquileres al mes el margen es S/ 253 frente a un mantenimiento de S/ 480-960. Punto de equilibrio: 38 alquileres al mes (piloto) y 76 (año 1) solo para cubrir el mantenimiento; cerca de 104 al sumar nube y servicios (S/ 1 310 al mes). Costo estimado del año 1 de S/ 30 700 frente a ingreso de S/ 9 600 (40 alquileres al mes).", "mejora": "Presentar el cálculo PE = costos fijos ÷ (precio − costo variable unitario) en el Word y decidir cómo llegar: subir el ticket promedio (cámara S/ 100-300 frente a carpa S/ 50), activar Premium S/ 29,90 y destacados S/ 20 desde el mes 4, reducir horas de mantenimiento o fijar una meta de 80-100 alquileres al mes. Mostrar en el flujo cuándo se recupera la inversión (PRI)."}, {"severidad": "importante", "titulo": "Los ingresos complementarios y los costos no vienen de la validación ni de la lista de precios", "ubicacion": "Cap. 3 (Premium S/ 29,90; destacado S/ 20) y cap. 6", "cita": "Premium S/ 29.90 mensuales … S/ 20 por objeto durante siete días", "problema": "Los precios de Premium y destacados se presentan sin datos de la encuesta ni conversión (% de propietarios que paga). Los costos de nube, SMS, verificación de identidad y pasarela no figuran en ningún cuadro.", "mejora": "Usar precios de proveedor: Culqi 3,44 % + USD 0,20, SES USD 0,10 por mil, Firestore con cuotas gratis, dominio cerca de S/ 70 al año, más supuestos explícitos (usuarios, requests, mensajes). Declarar la conversión Premium (p. ej. 5 % de 100 propietarios = 5 × S/ 29,90 = S/ 149,50 al mes) y medirla con una pregunta de la encuesta."}, {"severidad": "importante", "titulo": "No hay análisis del entorno interno y externo ni conclusión de viabilidad a 3 años", "ubicacion": "Cap. 6 completo", "cita": "6. PROYECCIÓN FINANCIERA En esta sección, se presentan las proyecciones…", "problema": "Solo hay una frase introductoria; la rúbrica pide proyecciones con ingresos, egresos, flujo e indicadores y la conclusión de viabilidad a 3 años.", "mejora": "Cerrar con una tabla de tres escenarios (piloto 10, año 1 40 y crecimiento 200 alquileres al mes) con VAN/TIR/PRI de cada uno y una conclusión del tipo «viable si se alcanzan X alquileres al mes; con la aceptación observada en la encuesta se lograría en el mes N». Incluir un FODA breve."}, {"severidad": "sugerencia", "titulo": "El Excel de punto de equilibrio es un entregable aparte, pero el Word debe resumirlo", "ubicacion": "Cap. 6", "cita": "", "problema": "El Excel aún no fue entregado y no se evaluó; el informe debe poder leerse sin él.", "mejora": "Incluir en 6.2 una tabla resumen de costos fijos y variables y el punto de equilibrio en alquileres y en soles, con enlace al Excel."}]}], "fecha_aa2": "11/11/2026", "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 4, "responsabilidad": 3}, "calificacionAA2": {"validacion": 2}, "enlaces": [{"titulo": "Informe del TAP (Google Docs)", "url": "https://docs.google.com/document/d/1sKn5sQZazJnTytyv7NsjJeIIAFXsv1hfdWQDefpEXNs"}, {"titulo": "Formulario de validación (Encuesta de validación de AlquiTodo)", "url": "https://docs.google.com/forms/d/17B3irWPv-wHQab8UI4FYpW9a6MvwSGnci5qMmpQq7co/edit"}, {"titulo": "Excel de punto de equilibrio (cap. 6)", "url": "https://docs.google.com/spreadsheets/d/1InzhPlDWqgU7NnMwAjKDVsbQp1NFsWS9/edit"}], "costosAA2": {"hoja": "AlquiTodo", "tipo_cambio": 3.5, "escenarios": ["Piloto", "Año 1", "Crecimiento"], "supuestos": [{"concepto": "Usuarios activos al mes", "unidad": "usuarios", "valores": [100.0, 600.0, 3000.0], "nota": "SUPUESTO. Metas del informe: 100 publicaciones y 20 alquileres/mes al mes 3."}, {"concepto": "Alquileres concretados al mes", "unidad": "alquileres", "valores": [10.0, 40.0, 200.0], "nota": "Meta: 20 al mes 3 (indicadores)."}, {"concepto": "Requests por usuario al mes", "unidad": "req/usuario", "valores": [150.0, 150.0, 150.0], "nota": "SUPUESTO: búsquedas, chat y solicitudes."}, {"concepto": "Segundos de CPU por request", "unidad": "seg", "valores": [0.3, 0.3, 0.3], "nota": "SUPUESTO."}, {"concepto": "vCPU por instancia", "unidad": "vCPU", "valores": [1.0, 1.0, 1.0], "nota": ""}, {"concepto": "Memoria por instancia", "unidad": "GiB", "valores": [0.5, 0.5, 0.5], "nota": ""}, {"concepto": "Lecturas Firestore por usuario al mes", "unidad": "lecturas", "valores": [600.0, 600.0, 600.0], "nota": "SUPUESTO: catálogo, filtros y chat en tiempo real."}, {"concepto": "Escrituras Firestore por usuario al mes", "unidad": "escrituras", "valores": [60.0, 60.0, 60.0], "nota": "SUPUESTO."}, {"concepto": "Mensajes de chat enviad at/buzón entre usuarios (3.2.8 y 4.1). El chat en tiempo real suma lecturas y escrituras.", "origen": "Declarado", "proveedor": "Google Firebase", "producto": "Cloud Firestore", "precio": "USD 0,06 por 100 mil lecturas; USD 0,18 por 100 mil escrituras; 50 mil lecturas y 20 mil escrituras gratis por día", "pen": null, "frecuencia": "por uso", "estado": "Verificado", "nota": "Cuotas gratis leídas el 11/11/2026."}, {"rubro": "Fotos de productos y del estado del artículo", "necesidad": "Fotos de cada publicación y registro fotográfico antes y después de la entrega (4.3).", "origen": "Declarado", "proveedor": "Google Cloud", "producto": "Cloud Storage", "precio": "USD 0,020 por GB-mes (5 GB gratis)", "pen": null, "frecuencia": "por uso", "estado": "Referencial", "nota": ""}, {"rubro": "Registro y verificación de correo/teléfono", "necesidad": "Registro con correo y teléfono, verificados (4.3).", "origen": "Declarado", "proveedor": "Google Firebase / Identity Platform", "producto": "Authentication + SMS de verificación", "precio": "Gratis hasta 50 mil usuarios; SMS a Perú: aprox. USD 0,06 por mensaje (supuesto)", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "Verificar solo por correo reduce este costo a casi cero."}, {"rubro": "Verificación de identidad de propietarios", "necesidad": "Validar identidad 'cuando corresponda' (3.2.8), fase posterior. El informe no nombra proveedor.", "origen": "Declarado", "proveedor": "Por definir (proveedores de verificación de identidad)", "producto": "Verificación documento + selfie", "precio": "Aprox. USD 1 por verificación (supuesto)", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "Pedir cotización a 2 proveedores; la cifra de USD 1 es solo un supuesto de trabajo."}, {"rubro": "Avisos del buzón por correo", "necesidad": "Correo cuando hay un mensaje nuevo sin leer.", "origen": "Inferido", "proveedor": "Amazon Web Services", "producto": "Amazon SES", "precio": "USD 0,10 por mil correos (modalid MEN_TAP 6.5 solo muestra el total anual; (f) el formato visual (anchos, colores, impresión) no se evaluó: solo contenido.", "señal_auto_pct": 100, "faltan_palabras": []}], "fortalezas": ["Avance respecto de la versión anterior (61,25 % a 63,75 %): ahora usa la plantilla de la calculadora del curso (12 hojas: Supuestos, Costos, Inversion, Proyeccion, EERR, Flujos, PE) más 7 hojas propias y, por primera vez, incluye gráfico del PE (dispersión, ejes 0 a 1 680 unidades que cubren el cruce de 1 181), PE en soles (S/ 32 705, PE C18), estado de resultados (EERR), flujo financiero y préstamo, y el acumulado mensual con la inversión (FLUJO_MENSUAL B36:M36).", "Honestidad y control de la propia proyección: AUDITORIA_PDF concilia 17 cifras del PDF anterior con el Excel (A5:E24), lista 16 riesgos con prioridad (A28:C43) y reconoce que el PDF previo no debe presentarse como proyección vigente; ENCUESTA_80 documenta n = 80 (46 propietarios, 40 arrendatarios) con páginas de origen y admite que no sustenta 1 200 alquileres ni la población de 120 000 (A28:C36). Recalculado con Python: VAN 7 676,06, TIR 41,58 %, PRI 2,03 y B/C 1,47 coinciden con Flujos C25:C28.", "Supuestos más prudentes y mejor enlazados: crecimiento de 35 % anual en lugar de 190 % (Supuestos B11), volumen del año 1 contrastado con publicaciones y capacidad (Mercado B5:B19), costo variable por categoría con pasarela Culqi y sensibilidad de una variable a la vez (ESCENARIOS_VIABILIDAD) que muestra que −20 % de demanda o −15 % de ticket vuelven el VAN negativo.", "Corrige la plantilla ajena del informe: el libro no contiene la inversión de S/ 88 869 con maquinaria; el cap. 6 se reconstruye con cuadros 6.1 a 6.7 en 06_RESUMEN_TAP conectados por fórmula a las hojas de cálculo."], "mejoras": ["Precio alineado con el informe: el ticket medio ponderado del Excel es S/ 138,50 (Supuestos C17:C21 = 170/135/65/85/80) y el informe usa S/ 100 por alquiler (11/11, líneas 381, 455, 473); es casi el mismo S/ 140 de la versión anterior, o sea la brecha no se corrigió. Unificar la cifra (idealmente con una pregunta de precio por categoría en la encuesta) o explicar en el Word por qué difiere. Con S/ 100 el PE contable sube a 1 655 alquileres al año (138 por mes; recalculado con Python, ticket uniforme).", "Brecha de inversión NO resuelta: de S/ 17 499 bajó a S/ 9 331 (Inversion F29; Resumen D40 «FALTA FINANCIACIÓN»; 06_RESUMEN_TAP B61 «PENDIENTE»), pero porque se redujo el capital de trabajo y el desarrollo, no porque haya nueva fuente; la hoja Prestamo sigue en 0. Decidir aportes adicionales, préstamo (la hoja ya existe) o desarrollo por etapas (MVP de S/ 5 000 primero) y mostrarlo en el flujo financiero.", "Cotizaciones: WEB_COTIZACION no trae ni un monto (D6:D23 vacío, B30 «POR COTIZAR»). Completar con ≥ 2 proveedores por módulo de desarrollo (y por hosting/nube, pasarela Culqi frente a Niubiz o Mercado Pago, verificación de identidad, contabilidad, mantenimiento), con columna FUENTE y capturas o PDF anexos. Es lo que sube «Costos» de 50 % a 75 % y «Inversión» de 50 % a 75 %.", "Recuperar el desglose de la inversión por módulo con entregable y la partida de constitución (S/ 600) de la versión anterior; la versión actual solo tiene dos líneas (S/ 5 000 y S/ 6 500, Inversion B6:E7) cuyo reparto interno no consta.", "Rubros del MVP sin ítem propio: base de datos y chat en tiempo real, almacenamiento de fotos, SMS y verificación de identidad (referencia de costos/grupo-3-alquitodo.json: S/ 105 al mes en el año 1, supuesto de USD 1 por verificación), mantenimiento por horas (S/ 480 al mes con S/ 40/h, supuesto por cotizar, frente a los S/ 100 de Costos_Fijos D8). Definir si el apoyo operativo de S/ 1 000 (D12) cubre el mantenimiento y declararlo.", "Costos fijos de los años 2 y 3: restituir el escalamiento por rubro (marketing, apoyo, hosting) que tenía la versión anterior (S/ 2 450 y S/ 3 285 al mes) o justificar por qué solo crecen 5 % (Supuestos B12) cuando el volumen crece 35 % al año; año 3: S/ 24 277 frente a S/ 39 420 antes.", "Rotación y volumen: la hipótesis de 0,75 alquileres por publicación al mes (Mercado B9) es 2 a 4 veces la del informe (20 alquileres con 100 publicaciones, 24 con 60) y el mes 3 del flujo da 65 alquileres frente a la meta de 20 del informe. Reconciliar las metas del cap. 4 con la proyección (el cap. 5 debe aportar la rotación medida en el piloto) y vincular la captación de publicaciones con el gasto de marketing de S/ 400 al mes.", "IGV: aclarar si el 20 % de comisión incluye IGV (Supuestos B38 declara el modelo «SIN IGV»; la versión anterior descontaba el IGV: ingreso neto S/ 23,73 de S/ 28,00). Si lo incluye, el ingreso unitario baja de S/ 27,70 a S/ 23,47 y el VAN pasa a ≈ −S/ 5 594 (recalculado con Python; supuesto). Consultar al contador y agregar la columna de IGV.", "Punto de equilibrio: rotular el MES de equilibrio en la hoja PE (flujo operativo positivo desde el mes 5, FLUJO_MENSUAL F31; EBIT desde el mes 7, H33; recalculado con Python: PE de caja 84 al mes y contable 98,4 al mes), mostrar el PE mensual y separar «PE de caja» (sin amortización: 1 005 al año) de «PE contable» (1 181); explicar el margen de seguridad de solo 1,6 % en el año 1 (PE C19) y agregar una hoja CTU (CFU + CVU) como el modelo.", "Flujo mensual del año 1: rotular el mes de saldo mínimo, separar la inversión del capital de trabajo (la fila 36 parte de S/ 16 331 que ya incluye S/ 4 831 de capital de trabajo, cuando el déficit operativo máximo es S/ 2 083 en el mes 4), agregar el saldo de caja inicial con los aportes de S/ 7 000 y mostrar los 12 meses en el cuadro 6.5 de 06_RESUMEN_TAP (A34:B38 solo trae el total).", "Indicadores: sustentar el COK de 20 % (Supuestos H9) con el costo de oportunidad de cada socio o WACC como el modelo, agregar PRI descontado, rotular el B/C como razón simplificada y retirar el doble conteo del capital de trabajo (recalculado con Python: VAN S/ 12 507 sin él).", "Escenarios: completar pesimista/base/optimista (ya existen tres estreses, ESCENARIOS_VIABILIDAD C4:E4), agregar uno con el ticket S/ 100 del informe y otro con la rotación del informe, redactar la conclusión de viabilidad con números (VAN −S/ 5 844 con −20 % de demanda, −S/ 2 843 con −15 % de ticket) y las decisiones (cómo cubrir la brecha, qué hacer si no se llega al equilibrio); actualizar los textos que dicen «15 % anual» (ESCENARIOS G21; AUDITORIA_PDF C40) a 35 %.", "Limpieza: corregir Resumen D43 («25 de 25» no cuenta «FALTA FINANCIACIÓN»), actualizar el texto de FLUJO_MENSUAL A2 (45 → 180; la hoja da 46 → 178), convertir en fórmula o dato fuente los pesos mensuales (B5:M5) y el volumen por categoría (Supuestos G17:G21), retirar el «90» suelto heredado de la plantilla (A5 de Costos_Variables, Costos_Fijos e Inversion; Flujos D30) y el texto de la calculadora web (Instrucciones B22).", "Tipo de cambio: Supuestos C33 usa S/ 3,85 (cargo fijo de pasarela S/ 0,77); actualizar a ≈ 3,45 (SUNAT 3,452 al 05/11) y verificar la tarifa de Culqi (3,44 % + USD 0,20 por venta online, inafecto a IGV, culqi.com/precios).", "Informe Word: el texto del 11/11 aún contiene la plantilla ajena (S/ 88 869, línea 909); trasladar al Word los cuadros 6.1 a 6.7 de 06_RESUMEN_TAP y las aclaraciones de condición (A56:A63) y unificar el ticket (S/ 100 en el informe, S/ 138,50 en el Excel).", "Entrega: el archivo recibido es .xlsx; no consta en el archivo el nombre del documento en Drive (debe ser «AA2_Cap6_Excel_Punto de equilibrio_Grupo X»; el nombre en la carpeta es «AlquiTodo_Proyección Financiera Cap6.xlsx») ni el acceso «cualquiera con el enlace: lector»; verificar ambos con el enlace. Falta la hoja «Cotizaciones» con montos.", "Camino para subir (logro 63,75 % a ≥ 85 %): (1) cotizaciones con ≥ 2 proveedores y rubros del MVP (criterio 2: 50 % a 75 %, +5 pts; criterio 1: 50 % a 75 %, +2,5 pts); (2) ticket y rotación alineados con el informe y el piloto, IGV aclarado (criterio 3: 50 % a 75 %, +3,75 pts); (3) mes de equilibrio, PE mensual y CTU  676 es condicional: con −20 % de demanda o −15 % de ticket pasa a negativo. Logro 63,75 % (nota 12,75/20), nivel 2 (+2,5 puntos).", "cambios_version": [{"hoja": "Estructura del libro", "celda": "—", "antes": "15 hojas propias (GUIA, SUPUESTOS, WEB_Y_INVERSION, COSTOS_FIJOS, TICKET_Y_COMISION, DEMANDA_36M, FLUJO_36M, IMPUESTOS_RMT, PROYECCION_3A, PUNTO_EQUILIBRIO, ESCENARIOS, CAP6_PARA_WORD, CONTROL, ...)", "ahora": "19 hojas: 12 de la plantilla de la calculadora (Instrucciones, Resumen, Supuestos, Costos_Variables, Costos_Fijos, Inversion, Mercado, Proyeccion, Prestamo, EERR, Flujos, PE) + Hoja1, 06_RESUMEN_TAP, FLUJO_MENSUAL, AUDITORIA_PDF, ENCUESTA_80, WEB_COTIZACION, ESCENARIOS_VIABILIDAD; ninguna oculta"}, {"hoja": "Gráficos", "celda": "Flujos / PE", "antes": "0 gráficos", "ahora": "2 gráficos: barras del flujo económico (Flujos) y dispersión del PE año 1 con ingresos, costo total y costo fijo, ejes 0 a 1 680 (PE B32:E42)"}, {"hoja": "Ticket / precio", "celda": "TICKET_Y_COMISION B9 → Supuestos C17:C21", "antes": "S/ 140 (150 y 130 al 50 %)", "ahora": "S/ 138,50 ponderado (170/135/65/85/80 por categoría); informe: S/ 100: NO alineado"}, {"hoja": "Comisión", "celda": "Supuestos B30:B31", "antes": "15 % + 5 %", "ahora": "15 % + 5 % (sin cambio)"}, {"hoja": "IGV", "celda": "TICKET_Y_COMISION E:F → Supuestos B38", "antes": "comisión S/ 28 con IGV; ingreso neto S/ 23,73", "ahora": "ingreso S/ 27,70 «sin IGV»; no se descuenta IGV de la comisión"}, {"hoja": "Volumen año 1", "celda": "PROYECCION_3A C7 → Proyeccion C10", "antes": "1 102 alquileres", "ahora": "1 200 alquileres"}, {"hoja": "Volumen años 2 y 3", "celda": "PROYECCION_3A D7:E7 → Proyeccion D10:E10", "antes": "3 200 y 4 805 (crecimiento por publicaciones)", "ahora": "1 620 y 2 186 (35 % anual, Supuestos B11)"}, {"hoja": "Ingresos de AlquiTodo", "celda": "PROYECCION_3A C14:E14 → Proyeccion C18:E18", "antes": "S/ 26 149 / 75 932 / 114 017", "ahora": "S/ 33 240 / 44 874 / 60 555"}, {"hoja": "Inversión de desarro         ${N.cambios_vs_6nov ? `<p class="summary"><b>Cambios frente al 06/11:</b> ${esc(N.cambios_vs_6nov)}</p>` : ''}
        ${N.camino_al_20?.length ? `<h4 style="margin:12px 0 6px">Camino para subir la nota</h4><ol class="priorities">${N.camino_al_20.map(c => `<li><span>${esc(c)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Calificación preliminar con la rúbrica oficial de la AA2 y criterio exigente de revisión de negocios. El criterio «Compromiso» es individual y lo define el docente (se muestra 3 por defecto). El Excel de punto de equilibrio se evalúa aparte y puede modificar el criterio de análisis presupuestal. La nota final la decide el docente.</p>
      </div>`;
    })() : ''}
    ${D.calificacionAA2 && !D.notasAA2 ? (() => {
      const p = Number(D.calificacionAA2.validacion);
      const NIV2 = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
      return `<div class="scorebox" id="nota-aa2">
        <div class="eyebrow">Calificación preliminar parcial · solo del formulario de validación</div>
        <div class="grade"><span class="big">${p}</span><span class="of">/ 4</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio de la rúbrica AA2</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
          <tbody>
            <tr><td>Validación del modelo de negocio (cap. 5)</td><td><span class="lvl l${p}">${NIV2[p] ?? '—'}</span></td><td class="num">${p} / 4</td></tr>
            <tr><td>Planteamiento del MVP · Herramientas · Análisis presupuestal · Compromiso</td><td>Pendiente</td><td class="num">—</td></tr>
          </tbody>
        </table></div>
        <p class="summary">Esta nota evalúa solo el instrumento (el formulario), porque aún no hay resultados reales. Para subir de nivel: con muestra real y análisis de resultados (n y %) se llega a 3; con mejoras al MVP derivadas de esos datos, a 4. La calificación final de la AA2 la define el docente e incluye los demás criterios y la exposición.</p>
      </div>`;
    })() : ''}
    ${D.prototipoHtml ? `<div id="prototipo-aa2">
      <h3 style="margin:18px 0 8px">Prototipo navegable de la plataforma</h3>
      <p class="summary">Prototipo referencial elaborado a partir del MVP y de las imágenes de referencia de su informe, para visualizar cómo podría verse y usarse su plataforma. Los datos son ficticios; no es el producto final. Pruébenlo aquí o <a href="${esc(D.prototipoHtml)}" target="_blank" rel="noopener noreferrer">ábranlo en pantalla completa</a>.</p>
      <iframe src="${esc(D.prototipoHtml)}" title="Prototipo de la plataforma" loading="lazy" style="width:100%;height:680px;border:1px solid var(--rule);border-radius:10px;background:#fff"></iframe>
    </div>` : ''}
    ${D.costosAA2 ? (() => {
      const K = D.costosAA2, S = n => 'S/ ' + Number(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const f3 = arr => arr.map(v => `<td class="num">${S(v)}</td>`).join('');
      const sup = v => Number(v).toLocaleString('es-PE', { maximumFractionDigits: 2 });
      return `<div class="costos" id="costos-aa2">
        <h3 style="margin:18px 0 8px">Costos de nube y servicios digitales (estimación)</h3>
        <p class="summary">Estimación mensual con proveedores reales (Google Cloud / Firebase, OpenAI, WhatsApp) para tres escenarios de uso. Los volúmenes son supuestos elaborados a partir de su MVP: reemplácenlos con los datos de su prototipo. Tipo de cambio: S/ ${esc(K.tipo_cambio)} por USD. Los precios son cifras de referencia que deben confirmarse con la calculadora oficial de cada proveedor.</p>
        ${K.necesidades ? `<h4 style="margin:14px 0 6px">Qué necesita su proyecto, con proveedor y precio</h4>
        <p class="summary">${esc(K.necesidades.resumen)} Estado del precio: <b>Verificado</b> (fuente oficial, 11/11/2026), <b>Referencial</b> (confirmar en la lista oficial del proveedor) y <b>Cotizar</b> (pidan 2 o más cotizaciones y anéxenlas). Úsenla para armar su Excel.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Rubro</th><th>Qué necesitan (según su informe)</th><th>Proveedor · producto</th><th>Precio de referencia</th><th>Estado</th></tr></thead>
          <tbody>${K.necesidades.items.map(i => `<tr><td><b>${esc(i.rubro)}</b><br><span class="where">${esc(i.origen)}</span></td><td>${esc(i.necesidad)}</td><td>${esc(i.proveedor)}<br><span class="where">${esc(i.producto)}</span></td><td>${esc(i.precio)}${i.nota ? `<br><span class="where">${esc(i.nota)}</span>` : ''}</td><td><span class="lvl ${i.estado === 'Verificado' ? 'l4' : i.estado === 'Referencial' ? 'l2' : 'l1'}">${esc(i.estado)}</span></td></tr>`).join('')}</tbody>
        </table></div>` : ''}
        ${D.calculadoraXlsx ? `<p class="summary" style="margin-top:12px"><b>Calculadora de su proyecto:</b> <a href="${esc(D.calculadoraXlsx)}" download>descargar Excel</a>. Cambien la cantidad de usuarios en la columna «Calculadora (edite)» y verán el costo mensual de los servicios, el primer pago para construir la plataforma, el mantenimiento (bolsa de horas o un encargado fijo) y el costo del primer año.</p>` : ''}
        <div class="table-wrap"><table>
          <thead><tr><th>Supuesto de uso</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.supuestos.map(r => `<tr><td>${esc(r.concepto)} <span class="where">${esc(r.unidad)}</span></td>${r.valores.map(v => `<td class="num">${sup(v)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Servicio (costo mensual)</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.costos.map(r => `<tr><td>${esc(r.concepto)}</td>${f3(r.valores)}</tr>`).join('')}
            <tr><td><b>Total mensual</b></td>${K.total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td>Primer pago (mes 1, con dominio anual)</td>${f3(K.primer_pago_pen)}</tr>
            <tr><td>Mantenimiento del desarrollador (horas al mes x S/ ${esc(K.tarifa_mantenimiento)} por hora)</td>${f3(K.mantenimiento_pen)}</tr>
            <tr><td><b>Total mensual con mantenimiento</b></td>${K.total_con_mant_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Desarrollo inicial de la plataforma (pago único al desarrollador, a S/ ${esc(K.tarifa_desarrollo)} por hora)</b></td><td class="num" colspan="${K.escenarios.length}"><b>${S(K.desarrollo_pen)}</b></td></tr>
            ${K.primer_pago_total_pen ? `<tr><td><b>Primer pago total: plataforma + primer mes de servicios</b></td>${K.primer_pago_total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Costo total del primer año (plataforma + 12 meses con mantenimiento)</b></td>${K.costo_anio1_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>` : ''}
            ${K.chat_pen ? `<tr><td>De ese total: chat interno y buzón de mensajes</td>${f3(K.chat_pen)}</tr>` : ''}
            <tr><td>${esc(K.ingreso_etiqueta)}</td>${f3(K.ingreso_pen)}</tr>
            <tr><td>Costo de nube / ingreso estimado</td>${K.pct_ingreso.map(v => `<td class="num">${(v * 100).toLocaleString('es-PE', { maximumFractionDigits: 1 })} %</td>`).join('')}</tr>
          </tbody>
        </table></div>
        <ul class="strength">${K.notas.map(n => `<li>${esc(n)}</li>`).join('')}<li>El desarrollo inicial y las horas de mantenimiento son referenciales: reemplácenlos con la cotización real de su desarrollador y verifiquen que el ingreso cubra el mantenimiento mensual.</li></ul>
      </div>`;
    })() : ''}
    ${D.excelPE ? (() => {
      const X = D.excelPE, NIV = pct => pct >= 85 ? 'Sobresaliente' : pct >= 70 ? 'Logrado' : pct >= 50 ? 'En proceso' : 'Inicio';
      const entrega = `<div class="scorebox" id="excel-pe">
        <div class="eyebrow">Evidencia 2 · Excel de costos y punto de equilibrio</div>
        <h3 style="margin:6px 0 8px">Cómo entregar el Excel</h3>
        <ol class="priorities">
          <li><span>Hagan el archivo en <b>.xlsx</b> (si lo trabajan en Google Sheets: Archivo → Descargar → Microsoft Excel).</span></li>
          <li><span>Súbanlo a <b>Google Drive</b> y compártanlo con «Cualquier persona con el enlace → Lector». Nombre: <b>AA2_Cap6_Excel_Punto de equilibrio_Grupo X</b>.</span></li>
          <li><span>Envíen <b>el enlace de Drive</b> al docente. Si no abre, se les pedirá el archivo.</span></li>
          <li><span>Anexen las cotizaciones (capturas o PDF) en una hoja «Cotizaciones» o en la misma carpeta de Drive.</span></li>
          <li><span>Si lo corrigen, suban la nueva versión con el mismo nombre y el mismo enlace.</span></li>
        </ol>`;
      if (X.estado !== 'calificado' || X.logro == null) {
        const lista = [
          'Las 7 piezas del cap. 6, parecidas al modelo del docente: estructura de inversión, costos y gastos, presupuesto de ingresos, presupuesto de egresos, flujo de caja mensual del año 1, flujo económico a 3 años e indicadores (VAN, TIR, B/C, recuperación).',
          'Precio y volumen iguales a los de su informe y su validación (cap. 5); si usan otro precio, explicar por qué.',
          'Todos los costos del MVP, incluidos indirectos, depreciación, mantenimiento y comisiones de pago, clasificados en fijos y variables, con proveedor y fuente.',
          'Hoja «Cotizaciones» con al menos 2 proveedores por rubro (captura o PDF, con fecha y vigencia).',
          'Punto de equilibrio en unidades y en soles, con fórmula (costos fijos ÷ margen de contribución), margen de seguridad y el mes en que se alcanza.',
          'Gráfico del punto de equilibrio donde el eje de unidades cubra el equilibrio y se vea el cruce de ingresos y costos totales, con ejes y series rotulados.',
          'Flujo mensual del año 1 con saldo acumulado y el mes de saldo más bajo (capital necesario); sin contar dos veces el capital de trabajo.',
          'Horizonte de 3 años (no 5), con la tasa de descuento (COK) sustentada.',
          'Escenarios pesimista, base y optimista (ventas −20 % o +20 %, costos +10 %) con una conclusión de viabilidad con números.',
          'Fórmulas vivas (no números pegados), sin errores (#REF!, #DIV/0!, #VALUE!), sin rótulos ni hojas de otros proyectos, sin hojas vacías o duplicadas.',
          'Formato .xlsx, nombre «AA2_Cap6_Excel_Punto de equilibrio_Grupo X» y enlace de Drive con «Cualquier persona con el enlace → Lector».'
        ];
        return entrega + `<p class="summary">Estado: <b>pendiente de entrega</b>. Cuando lo reciban, aquí aparecerá su nota sobre 20 (y su porcentaje de logro) con la retroalimentación por criterio.</p>
        <h4 style="margin:12px 0 6px">Qué debe contener su Excel (revisión previa)</h4><ol class="priorities">${lista.map(m => `<li><span>${esc(m)}</span></li>`).join('')}</ol></div>`;
      }
      const notaX = (Number(X.logro) * 0.2).toFixed(1).replace('.0', '');
      return entrega + `<div class="grade"><span class="big">${notaX} / 20</span><span class="of">nota del Excel · ${Number(X.logro)} % de logro · ${NIV(Number(X.logro))}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio</th><th class="num">Puntaje</th><th>Retroalimentación</th></tr></thead>
          <tbody>${X.criterios.map(c => `<tr><td>${esc(c.nombre)}</td><td class="num">${Number(c.puntaje)} / ${Number(c.peso)}</td><td>${esc(c.comentario || '')}</td></tr>`).join('')}</tbody>
        </table></div>
        ${X.paridad?.length ? `<h4 style="margin:12px 0 6px">Comparación con el modelo del docente</h4><div class="table-wrap"><table>
          <thead><tr><th>Pieza del modelo</th><th>Hoja del grupo</th><th>Estado</th><th>Nota</th></tr></thead>
          <tbody>${X.paridad.map(p => `<tr><td>${esc(p.pieza)}</td><td>${esc(p.hoja || '—')}</td><td>${esc(p.estado || '')}</td><td>${esc(p.nota || '')}</td></tr>`).join('')}</tbody>
        </table></div>` : ''}
        ${X.fortalezas?.length ? `<h4 style="margin:12px 0 6px">Lo que está bien</h4><ul class="strength">${X.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        ${X.mejoras?.length ? `<h4 style="margin:12px 0 6px">Para mejorar</h4><ol class="priorities">${X.mejoras.map(m => `<li><span>${esc(m)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Indicador preliminar elaborado con la rúbrica del Excel de punto de equilibrio. La calificación final de la AA2 la define el docente.${X.revisado ? ' Revisión del ' + esc(X.revisado) + '.' : ''}</p></div>`;
    })() : ''}
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.notasAA2 ? [['nota-aa2', 'Calificación AA2 (/20)', '']] : D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.prototipoHtml ? [['prototipo-aa2', 'Prototipo', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.excelPE ? [['excel-pe', 'Excel de punto de equilibrio', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
