<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-3-alquitodo", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "AlquiTodo: marketplace web de alquiler temporal de productos entre personas en Arequipa", "grupo": "Grupo 03", "seccion": "No indicada", "fecha": "04/11/2026 (2.ª versión)", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Anahi Nicol Nashely Mamani Machacca", "Ernesto Becerra Ccopa", "Yanira Karol Vasquez Sulla", "Elizabeth Noemi Saraya Parillo"], "dictamen": "menor", "resumen": "La versión del 04/11 (52 páginas) subsana la mayoría de las observaciones de la anterior. El capítulo 1 ahora tiene 1.1 y 1.2 con causas y consecuencias, la megatendencia «Acelerada innovación y desarrollo tecnológico» de CEPLAN (2025) y las metas 12.2 y 12.5 del ODS 12, con las limitaciones señaladas con honestidad. Las cifras se presentan en la Tabla 1 con su alcance. Lo más importante es que desapareció la contradicción central: el modelo de ingresos es el mismo en todo el documento (15 % al propietario y 5 % al arrendatario, 20 % bruto), el pago pasa por la plataforma y las funciones de confianza son coherentes entre los capítulos 1, 2 y 3. Además, el BMC se explica bloque por bloque (3.2.1 a 3.2.9), los competidores están completos y con sus fuentes en la bibliografía, y se corrigieron el índice, el encabezado de plantilla y el título en la carátula. Persisten pendientes de fondo. La ficha técnica sigue sin cuatro de los ocho campos (proceso de desarrollo, empaque y presentación, sostenibilidad e integración con redes sociales), los segmentos no tienen variables ni tamaño y las cifras aún no dimensionan la demanda en Arequipa. Tampoco hay evidencia cualitativa, y los mapas de empatía no indican su base. Además, se eliminó el apartado de indicadores de gestión, que estaba en la versión anterior. En lo formal, el docente sigue como «ANCORIJ», faltan sección y carreras, y las referencias tienen errores de APA 7.", "fortalezas": ["Reorganizaron el capítulo 1 en 1.1 Problema del cliente y 1.2 Problema social, cada uno con causas y consecuencias (pp. 3-4 y 7-8), y agregaron la megatendencia «Acelerada innovación y desarrollo tecnológico» de CEPLAN (2025) (1.2.3, p. 9) y las metas 12.2 y 12.5 del ODS 12 (1.2.4, pp. 9-10). Además, mantuvieron la advertencia de que el beneficio ambiental depende de que el alquiler sustituya una compra y de los desplazamientos.", "Presentan las cifras con criterio: la Tabla 1 (p. 5) indica para cada dato (Datum, INEI, ElRUC.pe) su alcance y qué no permite concluir, y reconocen que no hay medición local de la demanda: «Esta brecha no debe cubrirse trasladando automáticamente porcentajes nacionales a la realidad local» (p. 6).", "Unificaron el modelo de ingresos: comisión compartida de 15 % al propietario más 5 % al arrendatario, con el ejemplo de S/ 100 (S/ 105 / S/ 85 / S/ 20 brutos) en 2.1 (p. 12), la Tabla 2 (p. 14), el caso 2 (p. 24), el BMC (pp. 33 y 37) y 3.3.4 (p. 50). Además, el pago pasa por la plataforma y se liquida al propietario al cerrar el alquiler (3.2.5, p. 38), lo que resuelve el problema de cobrar una comisión sobre pagos hechos fuera del sistema.", "El BMC ahora está explicado bloque por bloque (3.2.1 a 3.2.9, pp. 35-41), con un párrafo por bloque y vínculos explícitos con los mapas de empatía (por ejemplo, p. 35 y p. 39). La figura del lienzo tiene número y título (Figura 3, p. 34).", "El análisis de competidores creció a seis directos locales o digitales (Petulap, SISAQP, JCP Maquinarias, DEBOSS Eventos, Eventus, Alquilo Cosas) y dos indirectos (Facebook Marketplace y Promart). Incluye la Tabla 3 con cobertura, precio publicado, fortaleza y diferencia, fecha de consulta (1 de noviembre de 2026) y todas las fuentes en la bibliografía. También explicitan que no se puede afirmar que AlquiTodo sea más barato (p. 48).", "Corrigieron los problemas formales más visibles: el índice ahora coincide con las páginas, desapareció el encabezado de la plantilla y los capítulos 4 a 12, aparece el título del proyecto en la carátula y las tablas tienen número, título y nota (Tablas 1 a 3)."], "prioridades": ["Completar la ficha técnica (Tabla 2, pp. 13-14): faltan el proceso de desarrollo de la plataforma, el empaque y presentación (identidad visual, dominio, interfaz), la sostenibilidad y la integración con redes sociales. Los 4 campos que ya tienen están bien resueltos (nombre, servicio, precio y funcionalidades).", "Describir los segmentos con variables concretas y con tamaño (2.5, pp. 20-22): hoy solo indican «mayores de 18 años» en Arequipa. Falta edad, NSE, distritos, frecuencia de necesidad y una estimación del número de personas, con fuente.", "Dimensionar el problema con datos más cercanos a Arequipa y agregar evidencia cualitativa: las cifras de la Tabla 1 son nacionales, de 2021 y sobre electrónicos, y los mapas de empatía (3.1) no dicen si se basan en entrevistas, observación o supuestos.", "Reponer el apartado de indicadores de gestión, con definición, fórmula, ejemplo de cálculo y meta. La versión anterior tenía siete y ahora no figura ninguno.", "Resolver las tensiones que quedan en el alcance de la primera versión: las publicaciones destacadas y el plan Premium aparecen como servicios vigentes en 2.1, la Tabla 2 y el caso 5, pero el BMC los presenta como etapas posteriores. Además, el depósito de garantía queda fuera de la custodia de AlquiTodo (1.2.5, p. 10) aunque la plataforma sí retiene el pago del alquiler.", "Corregir la carátula (apellido del docente «ANCORI», nombre completo de la institución, sección y carrera de cada integrante) y las referencias (orden alfabético único, formato APA 7 de «Autor. (año).», incluir INEI (2010) y retirar o citar a Osterwalder y Pigneur)."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actuales y confiables, analizadas críticamente para mostrar qué aportan al proyecto en relación con las megatendencias y los ODS.", "falta": "Ya tienen fuentes confiables (Hamari et al., Moeller y Wittkowski, CEPLAN, PNUMA, INEI) y un análisis crítico claro. Para llegar a Sobresaliente, deben corregir el APA 7 (INEI, 2010 está citado pero no figura en la lista; Osterwalder y Pigneur (2010) figura pero no se cita; la lista no está ordenada alfabéticamente y falta el punto antes del año), actualizar el dato de Datum (2021) o explicar por qué sigue vigente, y sustentar el problema social con alguna fuente local además de la global del PNUMA."}, {"criterio": "Planteamiento del problema", "exige": "La pertinencia del problema sustentada con evidencia cualitativa y cuantitativa, y con su vínculo con las megatendencias, los ODS y las necesidades del cliente detallado.", "falta": "Ya tienen el vínculo con la megatendencia y con las metas 12.2 y 12.5, además de causas y consecuencias. Les falta evidencia cualitativa propia (entrevistas o sondeo breve a arrendatarios y propietarios de Arequipa) y al menos un dato que mida el problema en sí en el contexto local. Con eso, el vínculo con las necesidades del cliente quedaría demostrado y no solo descrito."}, {"criterio": "Propuesta de valor", "exige": "Una propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso, todos coherentes con el problema.", "falta": "Completar los 4 campos pendientes de la ficha técnica y precisar los segmentos con variables y tamaño. Además, deben convertir la ventaja competitiva en algo comprobable: ahora es una hipótesis declarada (3.3.4, p. 50) y habrá que mostrar en el MVP qué atributo concreto no ofrece Facebook Marketplace."}, {"criterio": "Modelo de negocio", "exige": "El BMC y el mapa de empatía, argumentando la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "El BMC ya está argumentado y coherente. Para consolidar el nivel, indiquen la base de los mapas de empatía (entrevistas o supuestos), agreguen los números de figura a los mapas, repongan los indicadores de gestión y alineen el estado de los ingresos complementarios (Premium y publicaciones destacadas) en todos los capítulos."}], "viabilidad": {"resumen": "AlquiTodo ya tiene un modelo de ingresos coherente y un flujo completo (solicitud, pago, entrega, devolución, incidencias). El reto sigue siendo comercial: conseguir propietarios y arrendatarios a la vez y evitar que cierren el trato por fuera cuando existe una alternativa gratuita. Antes de la AA2 deben validar con datos si pagarían una tarifa total del 20 % y cuánto cuesta operar el flujo completo.", "riesgos": [{"tema": "Competencia", "titulo": "Facebook Marketplace y los grupos locales siguen siendo gratuitos", "choque": "Los propietarios ya publican sin costo y coordinan por mensajes. AlquiTodo cobra el 20 % bruto sobre cada alquiler, de modo que la tarifa total sube el precio y reduce lo que recibe el propietario, y los usuarios pueden evitarla acordando el trato por fuera una vez que se conocen. En el documento este riesgo se plantea como un asunto de ventaja competitiva, pero no se explica cómo evitar la fuga de operaciones.", "ideas": ["Preguntar en la encuesta de la AA2 a propietarios cuánto pagarían y por qué: qué función de la plataforma (pago seguro, calendario, evidencias) justifica descontar el 15 %.", "Comparar la tarifa total (20 % más los costos de la pasarela) con el costo de publicar en Facebook, que es cero, y con el margen que dejan los competidores formales.", "Evaluar medidas que den motivos para quedarse dentro de la plataforma, como el pago protegido, el historial de calificaciones o el registro de evidencias que sirven si hay un daño."]}, {"tema": "Costos", "titulo": "La pasarela y los costos operativos no están cuantificados", "choque": "El documento reconoce que los S/ 20 por cada S/ 100 son ingreso bruto y que habrá comisiones de la pasarela, soporte, verificación de identidad, moderación y reclamos (3.2.5 y 3.2.9), pero no hay ninguna cifra. Sin ellas no se puede saber si el margen cubre el costo de cada transacción.", "ideas": ["Cotizar al menos dos proveedores de pasarela con modo marketplace (Culqi, Izipay, Niubiz, Mercado Pago) y registrar su porcentaje y la forma de liquidar fondos a terceros.", "Calcular el punto de equilibrio con un cuadro simple: costos fijos mensuales divididos entre el ingreso neto por alquiler, para saber cuántos alquileres necesitan al mes."]}, {"tema": "Regulación", "titulo": "Datos personales, reclamos y comprobantes", "choque": "La plataforma recopilará DNI y datos de contacto, retendrá pagos y recibirá reclamos por daños o estafas. En el capítulo solo se menciona de forma general «proteger los datos personales» y «procedimiento de atención de reclamos». No aparece el Libro de Reclamaciones virtual, la Ley 29733 y la declaración del banco de datos ante la ANPD, ni la emisión de comprobantes electrónicos por la tarifa que cobra AlquiTodo.", "ideas": ["Revisar qué exige el Código de Protección y Defensa del Consumidor a una plataforma intermediaria y redactar los términos y condiciones con asesoría.", "Incluir en la estructura de costos el Libro de Reclamaciones virtual, la facturación electrónica y la inscripción del banco de datos ante la ANPD."]}, {"tema": "Adopción", "titulo": "Desconfianza a entregar bienes de valor a desconocidos", "choque": "Los mapas de empatía (pp. 30-32) reconocen el temor a daños, pérdidas e incumplimientos, y el modelo declara que no habrá seguro ni custodia del depósito de garantía. Es probable que los propietarios de equipos costosos, como cámaras, laptops o proyectores, no publiquen si el único respaldo es el registro fotográfico y las calificaciones.", "ideas": ["Medir en la encuesta de la AA2 qué porcentaje de propietarios entregaría un equipo a un desconocido y con qué condiciones: depósito, copia del DNI, contrato o seguro.", "Explorar un piloto acotado con una sola comunidad (por ejemplo, estudiantes de un instituto), donde la confianza ya existe, y priorizar categorías de menor valor."]}, {"tema": "Mercado", "titulo": "Lanzar los dos lados del marketplace a la vez y con un alcance amplio", "choque": "Un marketplace con pocas publicaciones no atrae arrendatarios y, sin arrendatarios, nadie publica. A esto se suman el alcance amplio (ocho categorías, desde herramientas hasta artículos para eventos) y el flujo completo que quieren construir (pasarela, verificación de identidad, chat, evidencias, incidencias y calificaciones), que será costoso de desarrollar para una primera versión. En Arequipa ya existen proveedores especializados por rubro.", "ideas": ["Priorizar una o dos categorías para el lanzamiento (por ejemplo, equipos tecnológicos y artículos para eventos) y definir qué funciones tendrá el MVP y cuáles quedan para una etapa posterior.", "Calcular cuántas publicaciones necesitan para que la búsqueda resulte útil y de dónde saldrán (comunidades educativas o pequeños negocios que ya alquilan)."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "incompleto", "nota": "Ya incluye el título del proyecto y el grupo. Falta la sección y la carrera de cada integrante (no se puede verificar el máximo de 2 por carrera). El nombre de la institución sigue genérico y el apellido del docente dice «ANCORIJ»."}, {"codigo": "—", "apartado": "Índice", "estado": "completo", "nota": "Corregido: las páginas coinciden con el contenido y ya no figuran los capítulos de la plantilla."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "completo", "nota": "Tiene 1.1.1 y 1.1.2 con causas y consecuencias para ambos lados del mercado. Sin evidencia cualitativa propia."}, {"codigo": "1.1.3", "apartado": "Cifras estadísticas que dimensionan el problema", "estado": "incompleto", "nota": "La Tabla 1 está bien analizada, pero los datos son nacionales (Datum, 2021) o de contexto (población, 59 empresas CIIU 7729) y no miden la demanda en Arequipa."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "Incluye megatendencia de CEPLAN (2025) y metas 12.2 y 12.5 del ODS 12 con sus limitaciones. Le faltan datos locales."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Describe el marketplace y su modelo de ingresos, coherente con el BMC. Los ingresos complementarios aparecen como vigentes, a diferencia del BMC."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "incompleto", "nota": "Tabla 2 con precio y 15 filas, pero faltan el proceso de desarrollo, el empaque y presentación, la sostenibilidad y la integración con redes sociales."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Separados para arrendatarios y propietarios."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "Ocho problemas con su solución, coherentes con el capítulo 1."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "incompleto", "nota": "Subgrupos claros para cada lado del mercado, pero sin variables demográficas, NSE, distritos ni tamaño."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Seis casos hipotéticos, incluidos el de incidencia y el de ingresos complementarios."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Dos mapas con análisis (arrendatario y propietario). No indican su base y las figuras no tienen número ni fuente."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Lienzo (Figura 3) y un párrafo por bloque, coherente con el capítulo 2. El texto del lienzo es muy pequeño."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Seis directos y dos indirectos con Tabla 3, ventaja competitiva y fuentes en la bibliografía. Eventus se describe con muy poca información."}, {"codigo": "3.4", "apartado": "Indicadores de gestión", "estado": "ausente", "nota": "La versión anterior tenía siete indicadores con fórmula y ahora no figura el apartado."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Falta INEI (2010), figura Osterwalder y Pigneur sin citarse, no está ordenada alfabéticamente y las entradas no llevan el punto antes del año."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Mejoró de forma importante: tiene 1.1 y 1.2 con causas y consecuencias, una megatendencia con fuente, la meta del ODS 12 y cifras analizadas con criterio. Persisten la falta de datos que midan la demanda local y la ausencia de evidencia cualitativa.", "observaciones": [{"severidad": "importante", "titulo": "Las cifras contextualizan, pero aún no dimensionan el problema en Arequipa", "ubicacion": "1.1.3, Tabla 1, pp. 5-6", "cita": "no permite calcular la demanda actual de una plataforma entre particulares en Arequipa", "problema": "Mejoró frente a la versión anterior: ya no usan cifras de conectividad y la Tabla 1 explica con claridad el alcance de cada dato. Sin embargo, los porcentajes de Datum (25 %, 11 %, 10 %) son nacionales, de 2021 y se refieren a alquilar productos electrónicos, y los demás datos describen la población de Arequipa y 59 empresas formales registradas. Ustedes reconocen que no hay una medición del gasto en productos de uso ocasional ni de la disposición a alquilar en la ciudad. Por eso la pertinencia sigue sin sustento cuantitativo local. ElRUC.pe, además, es un directorio privado que reordena datos de SUNAT.", "mejora": "Busquen un dato más cercano a Arequipa: estudios de consumo de Ipsos, Arellano, Kantar o Datum posteriores a 2021, datos del INEI sobre hogares o población universitaria en Arequipa, o el padrón de SUNAT como fuente primaria de las empresas de alquiler. Mientras tanto, la mejor manera de cerrar esta brecha es la encuesta que ya planifican para la AA2; si hacen un sondeo breve antes de la entrega, incorporen sus resultados en esta tabla."}, {"severidad": "importante", "titulo": "No hay evidencia cualitativa que respalde el problema", "ubicacion": "1.1, pp. 3-4", "cita": "Entre sus preocupaciones se encuentran los daños, la pérdida del producto, los retrasos en la devolución", "problema": "Las preocupaciones de propietarios y arrendatarios se sustentan en la literatura (Moeller y Wittkowski, 2010; Ruiz Ramírez y Ruiz Rodríguez, 2018) y en la lógica del equipo, pero no en testimonios, entrevistas ni observación de personas de Arequipa. La rúbrica pide para el nivel Sobresaliente evidencias cualitativas y cuantitativas, y los mapas de empatía del capítulo 3 dependen de este tipo de información.", "mejora": "Realicen entre 5 y 10 conversaciones breves con posibles arrendatarios y propietarios y reporten el número de entrevistados, cuántos mencionan cada dificultad y dos o tres frases textuales anonimizadas. Esqueleto: «De los N propietarios consultados, X indicaron que…»."}, {"severidad": "sugerencia", "titulo": "El problema social carece de datos locales y la prueba más fuerte es global", "ubicacion": "1.2.2, p. 8", "cita": "el uso mundial de materiales se ha multiplicado por más de tres en los últimos 50 años", "problema": "El dato del PNUMA (2024) es confiable, y ustedes aclaran que no mide el impacto en Arequipa, pero el problema social queda sustentado solo con una cifra mundial. La conexión con la meta 12.2 del ODS 12 depende de que los bienes realmente permanezcan sin uso, algo que el capítulo no cuantifica.", "mejora": "Busquen una cifra sobre residuos de aparatos eléctricos o electrónicos, consumo de bienes duraderos o el uso ocasional de herramientas en el Perú (MINAM, INEI u organismos internacionales). Si no existe, anuncien que se medirá con la encuesta, por ejemplo, con la pregunta «¿con qué frecuencia usa los objetos que compró para una ocasión?»."}, {"severidad": "sugerencia", "titulo": "La respuesta propuesta adelanta un modelo completo que el resto del documento no sostiene del todo", "ubicacion": "1.2.5, p. 10", "cita": "los depósitos de garantía podrán solicitarse para determinados artículos; sin embargo, según el modelo propuesto, las condiciones y la entrega del depósito serán acordadas entre propietario y arrendatario", "problema": "La plataforma retendrá el pago del alquiler hasta cerrar la operación, pero deja el depósito fuera de su custodia. Para el propietario de un equipo costoso, el depósito es justamente la protección principal y su gestión queda fuera del sistema, lo que debilita la confianza que el capítulo quiere resolver. No es una contradicción, pero sí una decisión que conviene justificar.", "mejora": "Expliquen por qué el depósito no se gestiona dentro de la pasarela (costo, regulación, complejidad) o evalúen incluirlo en la primera versión para las categorías de mayor valor."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "Ahora es coherente con el capítulo 1 y con el BMC, tiene precio definido y casos de uso sólidos. Faltan cuatro campos de la ficha técnica, variables en los segmentos y mostrar el diferencial más allá de la integración del flujo.", "observaciones": [{"severidad": "importante", "titulo": "Ficha técnica todavía sin cuatro campos", "ubicacion": "2.2, Tabla 2, pp. 13-14", "cita": "Formato de funcionamiento: Página web, desde la cual se podrán gestionar publicaciones, búsquedas, solicitudes y operaciones de alquiler.", "problema": "Mejoró de forma notable: ahora es una tabla numerada, con nota de fuente, precio (comisión, Premium y publicaciones destacadas), funcionalidades y medidas de confianza. De los 8 campos de la estructura oficial siguen sin aparecer el proceso de fabricación (en un servicio digital: cómo y con qué herramientas se desarrollará la web), el empaque y presentación (identidad visual, dominio, interfaz), la sostenibilidad y la integración con redes sociales. Esta última aparece solo en los canales del BMC (p. 36).", "mejora": "Agreguen cuatro filas a la Tabla 2: proceso de desarrollo (etapas, herramientas, responsables), presentación (marca, colores, adaptación a celulares), sostenibilidad (relación con las metas 12.2 y 12.5, con la reserva que ya hacen en 1.2.4) e integración con redes sociales (Facebook e Instagram para captación y compartir publicaciones)."}, {"severidad": "importante", "titulo": "Segmentos todavía sin variables concretas ni tamaño", "ubicacion": "2.5, pp. 20-22", "cita": "personas mayores de 18 años ubicadas en Arequipa, Perú, así como por pequeños negocios", "problema": "Detallan subgrupos claros (estudiantes universitarios, creadores de contenido, familias y organizadores de eventos, propietarios frecuentes). Aun así, el criterio demográfico es solo la mayoría de edad y no se indican distritos, NSE, frecuencia de necesidad ni cuántas personas podrían ser. Sin eso no se puede diseñar la captación inicial ni calcular la demanda en la AA2.", "mejora": "Describan cada segmento con variables geográficas (distritos de Arequipa con mayor presencia universitaria o comercial), demográficas (edad, NSE), psicográficas y conductuales (cuántas veces al año necesita el objeto) y estimen su tamaño con datos del INEI o de estudios de mercado, citando la fuente. También conviene indicar cuál será el primer segmento al que atenderán."}, {"severidad": "importante", "titulo": "Ingresos complementarios presentados como vigentes en el capítulo 2 y como futuros en el BMC", "ubicacion": "2.1, p. 12; Tabla 2, p. 14; caso 5, p. 26; BMC, pp. 33 y 38", "cita": "Estos servicios complementarios no reemplazan la comisión por alquiler: se plantean para etapas de consolidación y expansión, respectivamente", "problema": "En 2.1 afirman que AlquiTodo «contará con» publicaciones destacadas y el plan Premium, la Tabla 2 los incluye como parte de la ficha y el caso 5 los describe en funcionamiento. En cambio, el BMC y 3.2.5 los consideran propuestas «para etapas posteriores» que deben validarse. La contradicción central de la versión anterior desapareció, pero este desfase hace que el lector no sepa qué incluye la primera versión.", "mejora": "Unifiquen el estado de estos servicios: o forman parte de la primera versión, o se declaran en 2.1, la Tabla 2 y el caso 5 como etapas posteriores (por ejemplo, en una columna «Etapa» de la ficha)."}, {"severidad": "sugerencia", "titulo": "El diferencial es una hipótesis bien planteada que aún no se sustenta con datos", "ubicacion": "3.2.2, p. 36; 3.3.4, p. 49", "cita": "La diferenciación frente a los canales generales de anuncios se encuentra en integrar la solicitud, aceptación, pago, seguimiento de la entrega y devolución, y evaluación posterior del alquiler.", "problema": "Respondieron la observación anterior: ahora explican qué hace AlquiTodo que Facebook Marketplace no hace (reserva por fechas, pago, evidencias, incidencias) y reconocen que es una «diferenciación propuesta», no demostrada. Falta mostrar por qué esa integración importa lo suficiente para que un propietario ceda el 15 % de cada alquiler. Las plataformas digitales también figuran entre los proyectos de baja innovación, por lo que deben demostrar el valor agregado.", "mejora": "Identifiquen uno o dos atributos concretos (por ejemplo, el calendario de disponibilidad por fechas o el registro fotográfico de entrega y devolución) y prueben en el MVP o en la encuesta de la AA2 si los usuarios los valoran. Presenten la comparación con Facebook en una tabla con criterios."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "Es el capítulo más sólido: dos mapas de empatía, BMC de 9 bloques argumentado uno por uno, coherente con el capítulo 2, y una comparación de competidores completa. Falta indicar la base de los mapas, reponer los indicadores y cuantificar costos.", "observaciones": [{"severidad": "importante", "titulo": "Se eliminó el apartado de indicadores de gestión", "ubicacion": "3.3 a 3.3.4, pp. 42-50 (sin indicadores)", "cita": "", "problema": "La versión anterior incluía siete indicadores con definición, fórmula, ejemplo de cálculo y meta. En esta entrega no figura ninguno, y el índice solo llega a 3.3.4 Ventaja competitiva. La estructura del TAP exige los indicadores de gestión del modelo.", "mejora": "Reincorporen el apartado como 3.4, ajustando los indicadores al flujo actual: por ejemplo, publicaciones activas, solicitudes de alquiler, tasa de aceptación, alquileres completados, ingreso bruto por alquiler (S/ 20 por cada S/ 100) y tasa de incidencias. Indiquen de dónde saldrá cada dato."}, {"severidad": "importante", "titulo": "La estructura de costos no tiene cifras y el equilibrio del modelo no se muestra", "ubicacion": "3.2.5 y 3.2.9, pp. 38 y 40-41", "cita": "los S/ 20 del ejemplo representan ingreso bruto y no utilidad neta", "problema": "Es correcto aclarar que el ingreso es bruto y que hay costos de pasarela, verificación y soporte, pero no hay ni una estimación de su monto. Sin una referencia, no se puede juzgar si los S/ 20 por cada S/ 100 alcanzan para cubrir la operación de un flujo tan completo (pasarela, verificación de identidad, moderación y atención de reclamos).", "mejora": "Cotice al menos una pasarela y un proveedor de verificación de identidad y presente un cuadro simple de costos mensuales con un número de alquileres supuesto. Aunque sea referencial, debe mostrar el punto de equilibrio y aclarar que se validará en la AA2."}, {"severidad": "sugerencia", "titulo": "Los mapas de empatía no indican su base y las figuras no tienen número ni fuente", "ubicacion": "3.1, pp. 28-32", "cita": "", "problema": "Los mapas están bien diseñados y el análisis es detallado, pero no se indica si se basan en entrevistas, observación o supuestos del equipo. Además, las figuras de ambos mapas (pp. 28 y 30) no tienen número, título ni nota de fuente, a diferencia del BMC (Figura 3).", "mejora": "Añadan una frase que indique cómo se obtuvo la información (por ejemplo, conversaciones con N personas) y presenten los mapas como «Figura 1» y «Figura 2», con título en cursiva y nota «Elaboración propia»."}, {"severidad": "sugerencia", "titulo": "La comparación de competidores puede ser más útil si todos usan los mismos criterios", "ubicacion": "3.3.1 (Eventus), p. 44; Tabla 3, p. 47", "cita": "Su perfil público presenta una referencia de precios «desde S/ 50», pero no permite verificar en el contenido consultado qué servicio corresponde a ese importe", "problema": "La descripción de Eventus es muy limitada: no se indica qué ofrece, solo que su perfil es público, y se cita como InEventos, un directorio, con lo cual el lector no sabe si es una empresa o un anuncio. Además, la Tabla 3 compara fortalezas, pero casi no menciona debilidades y no incluye los precios de los competidores que sí los publican (Alquilo Cosas) para contrastarlos con la tarifa del 20 %.", "mejora": "Describan a Eventus como empresa con su propia información (servicios y cobertura). En la Tabla 3, agreguen una columna de debilidades y comparen el costo total para el cliente: una carpa a S/ 50 por 3 días, por ejemplo, costaría S/ 52,50 en AlquiTodo con el 5 % de tarifa de servicio."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Mejoró el índice, las tablas y la eliminación de los textos de plantilla. Quedan por corregir la carátula (docente, institución, sección y carreras) y las referencias.", "observaciones": [{"severidad": "importante", "titulo": "Carátula con el apellido del docente mal escrito y datos que faltan", "ubicacion": "Carátula, p. 1", "cita": "DOCENTE: JEANPIER BRANDOL ANCORIJ SANCHEZ", "problema": "Se agregó el título del proyecto, pero el apellido del docente sigue mal escrito (es «ANCORI»). El nombre de la institución continúa incompleto («INSTITUTO DE EDUCACIÓN SUPERIOR TECNOLÓGICO PRIVADO», solo con el logo) y no figuran la sección ni la carrera de cada integrante. Sin las carreras no se puede verificar que haya como máximo dos integrantes de la misma.", "mejora": "Completen la carátula con el nombre completo de la institución, la carrera de cada integrante, la sección y el grupo, y corrijan el apellido del docente."}, {"severidad": "importante", "titulo": "Referencias con errores de APA 7", "ubicacion": "Referencias, pp. 51-52", "cita": "Centro Nacional de Planeamiento Estratégico (2025). Listado referencial de megatendencias que tienen impacto en el Perú.", "problema": "Las referencias no siguen el formato APA 7: falta el punto antes del año («Autor. (año).»), no se aprecia sangría francesa. La lista está dividida en dos bloques, uno con los autores (Centro Nacional... a Ruiz Ramírez) y otro con las fuentes de competidores (Alquilo Cosas a SISAQP), seguidos por Osterwalder y Pigneur, de modo que no es alfabética. Además, INEI (2010) se cita en el texto (p. 5) pero no está en la lista, y Osterwalder y Pigneur (2010) está en la lista pero no se cita.", "mejora": "Ordenen toda la lista alfabéticamente, apliquen el formato «Autor. (año). Título en cursiva. Sitio. URL», agreguen la referencia de INEI (2010) y citen a Osterwalder y Pigneur en 3.2 o retírenla."}, {"severidad": "sugerencia", "titulo": "Texto del lienzo del BMC difícil de leer y nombre inconsistente de una fuente", "ubicacion": "Figura 3, p. 34; 3.3.1, p. 44", "cita": "(InEventos, s. f.)", "problema": "El lienzo se imprime en una sola página con letra muy pequeña, lo que dificulta leerlo. Además, el competidor se llama Eventus en el texto y la tabla, pero la cita y la referencia se hacen a InEventos, lo que confunde al lector sobre quién es la fuente. En el título del capítulo 2, el índice y el encabezado dice «CAPITULO II» sin tilde.", "mejora": "Coloquen el BMC en una página horizontal o con mayor tamaño de letra, citen la fuente con el nombre que corresponde al sitio y revisen la ortografía de los títulos."}]}], "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 4, "responsabilidad": 3}}</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const all = D.secciones.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${D.fortalezas?.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${D.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>
    <div class="grade"><span class="big">${total}</span><span class="of">/ 20</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${D.prioridades.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

D.secciones.forEach((s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
  </section>`;
});

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const toc = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => ['s' + i, s.titulo, s.observaciones.length]));
document.getElementById('toc').innerHTML = toc.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
