<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.scorebox { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-3-alquitodo", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "AlquiTodo: marketplace web de alquiler temporal de productos entre personas en Arequipa", "grupo": "Grupo 03", "seccion": "No indicada", "fecha": "04/11/2026 (2.ª versión) · avance AA2 revisado el 06/11/2026 · formulario AA2 revisado el 06/11/2026", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Anahi Nicol Nashely Mamani Machacca", "Ernesto Becerra Ccopa", "Yanira Karol Vasquez Sulla", "Elizabeth Noemi Saraya Parillo"], "dictamen": "menor", "resumen": "La versión del 04/11 (52 páginas) subsana la mayoría de las observaciones de la anterior. El capítulo 1 ahora tiene 1.1 y 1.2 con causas y consecuencias, la megatendencia «Acelerada innovación y desarrollo tecnológico» de CEPLAN (2025) y las metas 12.2 y 12.5 del ODS 12, con las limitaciones señaladas con honestidad. Las cifras se presentan en la Tabla 1 con su alcance. Lo más importante es que desapareció la contradicción central: el modelo de ingresos es el mismo en todo el documento (15 % al propietario y 5 % al arrendatario, 20 % bruto), el pago pasa por la plataforma y las funciones de confianza son coherentes entre los capítulos 1, 2 y 3. Además, el BMC se explica bloque por bloque (3.2.1 a 3.2.9), los competidores están completos y con sus fuentes en la bibliografía, y se corrigieron el índice, el encabezado de plantilla y el título en la carátula. Persisten pendientes de fondo. La ficha técnica sigue sin cuatro de los ocho campos (proceso de desarrollo, empaque y presentación, sostenibilidad e integración con redes sociales), los segmentos no tienen variables ni tamaño y las cifras aún no dimensionan la demanda en Arequipa. Los mapas de empatía no se rotulan como hipótesis del equipo. Además, se eliminó el apartado de indicadores de gestión, que estaba en la versión anterior. En lo formal, el docente sigue como «ANCORIJ», faltan sección y carreras, y las referencias tienen errores de APA 7.", "fortalezas": ["Reorganizaron el capítulo 1 en 1.1 Problema del cliente y 1.2 Problema social, cada uno con causas y consecuencias (pp. 3-4 y 7-8), y agregaron la megatendencia «Acelerada innovación y desarrollo tecnológico» de CEPLAN (2025) (1.2.3, p. 9) y las metas 12.2 y 12.5 del ODS 12 (1.2.4, pp. 9-10). Además, mantuvieron la advertencia de que el beneficio ambiental depende de que el alquiler sustituya una compra y de los desplazamientos.", "Presentan las cifras con criterio: la Tabla 1 (p. 5) indica para cada dato (Datum, INEI, ElRUC.pe) su alcance y qué no permite concluir, y reconocen que no hay medición local de la demanda: «Esta brecha no debe cubrirse trasladando automáticamente porcentajes nacionales a la realidad local» (p. 6).", "Unificaron el modelo de ingresos: comisión compartida de 15 % al propietario más 5 % al arrendatario, con el ejemplo de S/ 100 (S/ 105 / S/ 85 / S/ 20 brutos) en 2.1 (p. 12), la Tabla 2 (p. 14), el caso 2 (p. 24), el BMC (pp. 33 y 37) y 3.3.4 (p. 50). Además, el pago pasa por la plataforma y se liquida al propietario al cerrar el alquiler (3.2.5, p. 38), lo que resuelve el problema de cobrar una comisión sobre pagos hechos fuera del sistema.", "El BMC ahora está explicado bloque por bloque (3.2.1 a 3.2.9, pp. 35-41), con un párrafo por bloque y vínculos explícitos con los mapas de empatía (por ejemplo, p. 35 y p. 39). La figura del lienzo tiene número y título (Figura 3, p. 34).", "El análisis de competidores creció a seis directos locales o digitales (Petulap, SISAQP, JCP Maquinarias, DEBOSS Eventos, Eventus, Alquilo Cosas) y dos indirectos (Facebook Marketplace y Promart). Incluye la Tabla 3 con cobertura, precio publicado, fortaleza y diferencia, fecha de consulta (1 de noviembre de 2026) y todas las fuentes en la bibliografía. También explicitan que no se puede afirmar que AlquiTodo sea más barato (p. 48).", "Corrigieron los problemas formales más visibles: el índice ahora coincide con las páginas, desapareció el encabezado de la plantilla y los capítulos 4 a 12, aparece el título del proyecto en la carátula y las tablas tienen número, título y nota (Tablas 1 a 3).", "AA2: El capítulo III repone y mejora sus piezas pendientes: indicadores de gestión con fuente de dato (3.4, Tabla 6), mapas de empatía rotulados como hipótesis, figuras 1 a 3 y tablas 4 a 6 numeradas, y una ventaja competitiva convertida en dos atributos verificables (calendario por fechas y registro fotográfico, 3.3.4). Además, la tarifa de 15 % + 5 % es numéricamente consistente en 3.2, 3.2.5, 3.3.4 y la Tabla 6, y reconocen que no puede afirmarse que AlquiTodo sea más barato.", "AA2: En el capítulo IV acotan el alcance de la primera versión a una página web responsiva en Arequipa, descartan la aplicación móvil para contener costos y priorizan equipos tecnológicos y audiovisuales, atendiendo la sugerencia de reducir categorías hecha en la AA1; también mantienen la coherencia de los dos segmentos y de los canales de redes con el capítulo III.", "AA2: Un único formulario con ramificación por perfil (pregunta 3): quien solo alquila va a «Necesidades de los arrendatarios», quien solo ofrece va a «Interés de los propietarios» y quien no tiene interés llega a «Motivos de desinterés». Cubre los dos lados del marketplace y permite medir el desinterés, algo que muchos grupos omiten.", "AA2: La pregunta «¿Qué condiciones necesitarías para sentirte seguro(a) al ofrecer tus objetos?» (depósito, verificación, seguro, contrato, registro fotográfico, calificaciones) y «¿Qué preocupaciones tendrías al ofrecer…?» atacan la hipótesis de confianza señalada en las revisiones previas.", "AA2: La pregunta «¿cuáles consideras más importantes?» lista funciones que el capítulo III declara diferenciadoras (calendario, registro fotográfico durante entrega y devolución, pagos integrados, incidencias, calificaciones), lo que permite contrastar la Tabla 5.", "AA2: Incluye una pregunta de comisión para propietarios (15 % entre las opciones) y una de tarifa para arrendatarios, y las escalas de disposición (1 a 5) tienen extremos rotulados.", "AA2: En el informe reconocen que 100 respuestas no son una muestra representativa de Arequipa (5.1.2) y plantean además dos entrevistas a especialistas, lo que muestra criterio metodológico."], "prioridades": ["Completar la ficha técnica (Tabla 2, pp. 13-14): faltan el proceso de desarrollo de la plataforma, el empaque y presentación (identidad visual, dominio, interfaz), la sostenibilidad y la integración con redes sociales. Los 4 campos que ya tienen están bien resueltos (nombre, servicio, precio y funcionalidades).", "Describir los segmentos con variables concretas y con tamaño (2.5, pp. 20-22): hoy solo indican «mayores de 18 años» en Arequipa. Falta edad, NSE, distritos, frecuencia de necesidad y una estimación del número de personas, con fuente.", "Dimensionar el problema con datos más cercanos a Arequipa: las cifras de la Tabla 1 son nacionales, de 2021 y sobre electrónicos. Las hipótesis sobre los clientes son aceptables en esta entrega; la validación real se exigirá en el capítulo 5 (AA2).", "Reponer el apartado de indicadores de gestión, con definición, fórmula, ejemplo de cálculo y meta. La versión anterior tenía siete y ahora no figura ninguno.", "Resolver las tensiones que quedan en el alcance de la primera versión: las publicaciones destacadas y el plan Premium aparecen como servicios vigentes en 2.1, la Tabla 2 y el caso 5, pero el BMC los presenta como etapas posteriores. Además, el depósito de garantía queda fuera de la custodia de AlquiTodo (1.2.5, p. 10) aunque la plataforma sí retiene el pago del alquiler.", "Corregir la carátula (apellido del docente «ANCORI», nombre completo de la institución, sección y carrera de cada integrante) y las referencias (orden alfabético único, formato APA 7 de «Autor. (año).», incluir INEI (2010) y retirar o citar a Osterwalder y Pigneur).", "AA2: Rehacer los objetivos del capítulo IV con indicador, meta, muestra y plazo (vinculados con la Tabla 6) y priorizar las 11 funcionalidades en esenciales, complementarias y fuera del MVP, justificando lo que se deja fuera.", "AA2: Diseñar el MVP para probar la hipótesis más riesgosa (confianza, pago y fuga de operaciones): incluir calendario de disponibilidad, reporte de incidencias y un pago real o manual (tipo concierge), o retirar de las Tablas 5 y 6 lo que el MVP no podrá medir.", "AA2: Nombrar las herramientas concretas de prototipado, desarrollo, pago y levantamiento de datos, con su justificación (funcionalidad, usabilidad, viabilidad técnica), costo y responsable, describir los pasos seguidos y adecuar el formato del capítulo IV (numeración 4.1…, tablas y figuras numeradas, apartado de imágenes).", "AA2: Rediseñar el bloque de disposición de pago para probar la tarifa real: mostrar el ejemplo de S/ 100 (S/ 105 / S/ 85 / S/ 20) y preguntar por aceptación («sí / no / solo si…») con la comparación explícita frente a publicar gratis en Facebook Marketplace; medir intención de cerrar el trato fuera de la plataforma.", "AA2: Incluir en el formulario una descripción o prototipo del MVP (capturas del flujo: publicar, reservar por fechas, pago y registro fotográfico) antes de las preguntas de disposición y funciones, y pedir que valoren lo que ven, no el concepto.", "AA2: Agregar preguntas de perfil que identifiquen los segmentos del MVP (ocupación: estudiante, creador de contenido, emprendedor, organizador de eventos; posesión de equipos tecnológicos y valor aproximado) y una pregunta filtro de residencia en Arequipa.", "AA2: Corregir la lógica del formulario (preguntas de disposición como arrendatario y como propietario obligatorias para todos; pregunta «¿También te interesa ofrecer?» para quienes ya eligieron «ambas»; confirmar a dónde va quien no tiene interés) y probarlo con 5 a 8 personas antes de difundirlo.", "AA2: Alinear el informe con el instrumento realmente aplicado (5.1.3 describe otro cuestionario de 16 preguntas) y completar 5.1.5 con los enlaces; documentar la prueba piloto.", "AA2: Recolectar los datos (meta de 100 válidas) y las dos entrevistas, y presentar en 5.2 resultados por pregunta con gráficos, interpretación, métricas contra umbrales definidos de antemano y una tabla «hallazgo → mejora al MVP», que es lo que distingue el nivel Sobresaliente.", "AA2: Definir antes de aplicar los criterios de éxito/descarte por hipótesis (por ejemplo, ≥ 50 % de propietarios acepta 15 % frente a la opción gratuita; ≥ 30 % de arrendatarios con intención alta) y vincularlos con los objetivos del capítulo IV y la Tabla 6."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actuales y confiables, analizadas críticamente para mostrar qué aportan al proyecto en relación con las megatendencias y los ODS.", "falta": "Ya tienen fuentes confiables (Hamari et al., Moeller y Wittkowski, CEPLAN, PNUMA, INEI) y un análisis crítico claro. Para llegar a Sobresaliente, deben corregir el APA 7 (INEI, 2010 está citado pero no figura en la lista; Osterwalder y Pigneur (2010) figura pero no se cita; la lista no está ordenada alfabéticamente y falta el punto antes del año), actualizar el dato de Datum (2021) o explicar por qué sigue vigente, y sustentar el problema social con alguna fuente local además de la global del PNUMA."}, {"criterio": "Planteamiento del problema", "exige": "La pertinencia del problema sustentada con evidencia cuantitativa y con su vínculo con las megatendencias, los ODS y las necesidades del cliente detallado (las hipótesis son aceptables en la AA1).", "falta": "Ya tienen el vínculo con la megatendencia y con las metas 12.2 y 12.5, además de causas y consecuencias. Para consolidar el nivel, falta al menos un dato que mida el problema en el contexto local de Arequipa y una cifra local para el problema social."}, {"criterio": "Propuesta de valor", "exige": "Una propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso, todos coherentes con el problema.", "falta": "Completar los 4 campos pendientes de la ficha técnica y precisar los segmentos con variables y tamaño. Además, deben convertir la ventaja competitiva en algo comprobable: ahora es una hipótesis declarada (3.3.4, p. 50) y habrá que mostrar en el MVP qué atributo concreto no ofrece Facebook Marketplace."}, {"criterio": "Modelo de negocio", "exige": "El BMC y el mapa de empatía, argumentando la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "El BMC ya está argumentado y coherente. Para consolidar el nivel, rotulen los mapas de empatía como hipótesis del equipo, agreguen los números de figura, repongan los indicadores de gestión y alineen el estado de los ingresos complementarios (Premium y publicaciones destacadas) en todos los capítulos."}], "viabilidad": {"resumen": "AlquiTodo ya tiene un modelo de ingresos coherente y un flujo completo (solicitud, pago, entrega, devolución, incidencias). El reto sigue siendo comercial: conseguir propietarios y arrendatarios a la vez y evitar que cierren el trato por fuera cuando existe una alternativa gratuita. En la validación del capítulo 5 (AA2) deberán comprobar si pagarían una tarifa total del 20 %.", "riesgos": [{"tema": "Competencia", "titulo": "Facebook Marketplace y los grupos locales siguen siendo gratuitos", "choque": "Los propietarios ya publican sin costo y coordinan por mensajes. AlquiTodo cobra el 20 % bruto sobre cada alquiler, de modo que la tarifa total sube el precio y reduce lo que recibe el propietario, y los usuarios pueden evitarla acordando el trato por fuera una vez que se conocen. En el documento este riesgo se plantea como un asunto de ventaja competitiva, pero no se explica cómo evitar la fuga de operaciones.", "ideas": ["Preguntar en la validación del capítulo 5 (AA2) a propietarios cuánto pagarían y por qué: qué función de la plataforma (pago seguro, calendario, evidencias) justifica descontar el 15 %.", "Evaluar medidas que den motivos para quedarse dentro de la plataforma, como el pago protegido, el historial de calificaciones o el registro de evidencias que sirven si hay un daño."]}, {"tema": "Regulación", "titulo": "Datos personales, reclamos y comprobantes", "choque": "La plataforma recopilará DNI y datos de contacto, retendrá pagos y recibirá reclamos por daños o estafas. En el capítulo solo se menciona de forma general «proteger los datos personales» y «procedimiento de atención de reclamos». No aparece el Libro de Reclamaciones virtual, la Ley 29733 y la declaración del banco de datos ante la ANPD, ni la emisión de comprobantes electrónicos por la tarifa que cobra AlquiTodo.", "ideas": ["Revisar qué exige el Código de Protección y Defensa del Consumidor a una plataforma intermediaria y redactar los términos y condiciones con asesoría.", "Incluir en la estructura de costos el Libro de Reclamaciones virtual, la facturación electrónica y la inscripción del banco de datos ante la ANPD."]}, {"tema": "Adopción", "titulo": "Desconfianza a entregar bienes de valor a desconocidos", "choque": "Los mapas de empatía (pp. 30-32) reconocen el temor a daños, pérdidas e incumplimientos, y el modelo declara que no habrá seguro ni custodia del depósito de garantía. Es probable que los propietarios de equipos costosos, como cámaras, laptops o proyectores, no publiquen si el único respaldo es el registro fotográfico y las calificaciones.", "ideas": ["Medir en la validación del capítulo 5 (AA2) qué porcentaje de propietarios entregaría un equipo a un desconocido y con qué condiciones: depósito, copia del DNI, contrato o seguro.", "Explorar un piloto acotado con una sola comunidad (por ejemplo, estudiantes de un instituto), donde la confianza ya existe, y priorizar categorías de menor valor."]}, {"tema": "Mercado", "titulo": "Lanzar los dos lados del marketplace a la vez y con un alcance amplio", "choque": "Un marketplace con pocas publicaciones no atrae arrendatarios y, sin arrendatarios, nadie publica. A esto se suman el alcance amplio (ocho categorías, desde herramientas hasta artículos para eventos) y el flujo completo que quieren construir (pasarela, verificación de identidad, chat, evidencias, incidencias y calificaciones), que será costoso de desarrollar para una primera versión. En Arequipa ya existen proveedores especializados por rubro.", "ideas": ["Priorizar una o dos categorías para el lanzamiento (por ejemplo, equipos tecnológicos y artículos para eventos) y definir qué funciones tendrá el MVP y cuáles quedan para una etapa posterior.", "Calcular cuántas publicaciones necesitan para que la búsqueda resulte útil y de dónde saldrán (comunidades educativas o pequeños negocios que ya alquilan)."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "incompleto", "nota": "Ya incluye el título del proyecto y el grupo. Falta la sección. El nombre de la institución sigue genérico y el apellido del docente dice «ANCORIJ»."}, {"codigo": "—", "apartado": "Índice", "estado": "completo", "nota": "Corregido: las páginas coinciden con el contenido y ya no figuran los capítulos de la plantilla."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "completo", "nota": "Tiene 1.1.1 y 1.1.2 con causas y consecuencias para ambos lados del mercado."}, {"codigo": "1.1.3", "apartado": "Cifras estadísticas que dimensionan el problema", "estado": "incompleto", "nota": "La Tabla 1 está bien analizada, pero los datos son nacionales (Datum, 2021) o de contexto (población, 59 empresas CIIU 7729) y no miden la demanda en Arequipa."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "Incluye megatendencia de CEPLAN (2025) y metas 12.2 y 12.5 del ODS 12 con sus limitaciones. Le faltan datos locales."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Describe el marketplace y su modelo de ingresos, coherente con el BMC. Los ingresos complementarios aparecen como vigentes, a diferencia del BMC."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "incompleto", "nota": "Tabla 2 con precio y 15 filas, pero faltan el proceso de desarrollo, el empaque y presentación, la sostenibilidad y la integración con redes sociales."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Separados para arrendatarios y propietarios."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "Ocho problemas con su solución, coherentes con el capítulo 1."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "incompleto", "nota": "Subgrupos claros para cada lado del mercado, pero sin variables demográficas, NSE, distritos ni tamaño."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Seis casos hipotéticos, incluidos el de incidencia y el de ingresos complementarios."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Dos mapas con análisis (arrendatario y propietario). No se rotulan como hipótesis del equipo y las figuras no tienen número ni fuente."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Lienzo (Figura 3) y un párrafo por bloque, coherente con el capítulo 2. El texto del lienzo es muy pequeño."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Seis directos y dos indirectos con Tabla 3, ventaja competitiva y fuentes en la bibliografía. Eventus se describe con muy poca información."}, {"codigo": "3.4", "apartado": "Indicadores de gestión", "estado": "ausente", "nota": "La versión anterior tenía siete indicadores con fórmula y ahora no figura el apartado."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Falta INEI (2010), figura Osterwalder y Pigneur sin citarse, no está ordenada alfabéticamente y las entradas no llevan el punto antes del año."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Mejoró de forma importante: tiene 1.1 y 1.2 con causas y consecuencias, una megatendencia con fuente, la meta del ODS 12 y cifras analizadas con criterio. Persiste la falta de datos que midan la demanda local.", "observaciones": [{"severidad": "importante", "titulo": "Las cifras contextualizan, pero aún no dimensionan el problema en Arequipa", "ubicacion": "1.1.3, Tabla 1, pp. 5-6", "cita": "no permite calcular la demanda actual de una plataforma entre particulares en Arequipa", "problema": "Mejoró frente a la versión anterior: ya no usan cifras de conectividad y la Tabla 1 explica con claridad el alcance de cada dato. Sin embargo, los porcentajes de Datum (25 %, 11 %, 10 %) son nacionales, de 2021 y se refieren a alquilar productos electrónicos, y los demás datos describen la población de Arequipa y 59 empresas formales registradas. Ustedes reconocen que no hay una medición del gasto en productos de uso ocasional ni de la disposición a alquilar en la ciudad. ElRUC.pe, además, es un directorio privado que reordena datos de SUNAT.", "mejora": "Busquen un dato más cercano a Arequipa: estudios de consumo de Ipsos, Arellano, Kantar o Datum posteriores a 2021, datos del INEI sobre hogares o población universitaria en Arequipa, o el padrón de SUNAT como fuente primaria de las empresas de alquiler."}, {"severidad": "sugerencia", "titulo": "Las hipótesis sobre propietarios y arrendatarios deberán validarse en el capítulo 5", "ubicacion": "1.1, pp. 3-4", "cita": "Entre sus preocupaciones se encuentran los daños, la pérdida del producto, los retrasos en la devolución", "problema": "Las preocupaciones de propietarios y arrendatarios se sustentan en la literatura (Moeller y Wittkowski, 2010; Ruiz Ramírez y Ruiz Rodríguez, 2018) y en el análisis del equipo. En esta entrega se aceptan como hipótesis bien fundamentadas.", "mejora": "Tengan presente que la validación real con personas de Arequipa se exigirá en el capítulo 5 (AA2); conviene que desde ahora formulen estas preocupaciones como hipótesis verificables."}, {"severidad": "sugerencia", "titulo": "El problema social carece de datos locales y la prueba más fuerte es global", "ubicacion": "1.2.2, p. 8", "cita": "el uso mundial de materiales se ha multiplicado por más de tres en los últimos 50 años", "problema": "El dato del PNUMA (2024) es confiable, y ustedes aclaran que no mide el impacto en Arequipa, pero el problema social queda sustentado solo con una cifra mundial. La conexión con la meta 12.2 del ODS 12 depende de que los bienes realmente permanezcan sin uso, algo que el capítulo no cuantifica.", "mejora": "Busquen una cifra sobre residuos de aparatos eléctricos o electrónicos, consumo de bienes duraderos o el uso ocasional de herramientas en el Perú (MINAM, INEI u organismos internacionales)."}, {"severidad": "sugerencia", "titulo": "La respuesta propuesta adelanta un modelo completo que el resto del documento no sostiene del todo", "ubicacion": "1.2.5, p. 10", "cita": "los depósitos de garantía podrán solicitarse para determinados artículos; sin embargo, según el modelo propuesto, las condiciones y la entrega del depósito serán acordadas entre propietario y arrendatario", "problema": "La plataforma retendrá el pago del alquiler hasta cerrar la operación, pero deja el depósito fuera de su custodia. Para el propietario de un equipo costoso, el depósito es justamente la protección principal y su gestión queda fuera del sistema, lo que debilita la confianza que el capítulo quiere resolver. No es una contradicción, pero sí una decisión que conviene justificar.", "mejora": "Expliquen por qué el depósito no se gestiona dentro de la pasarela (costo, regulación, complejidad) o evalúen incluirlo en la primera versión para las categorías de mayor valor."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "Ahora es coherente con el capítulo 1 y con el BMC, tiene precio definido y casos de uso sólidos. Faltan cuatro campos de la ficha técnica, variables en los segmentos y mostrar el diferencial más allá de la integración del flujo.", "observaciones": [{"severidad": "importante", "titulo": "Ficha técnica todavía sin cuatro campos", "ubicacion": "2.2, Tabla 2, pp. 13-14", "cita": "Formato de funcionamiento: Página web, desde la cual se podrán gestionar publicaciones, búsquedas, solicitudes y operaciones de alquiler.", "problema": "Mejoró de forma notable: ahora es una tabla numerada, con nota de fuente, precio (comisión, Premium y publicaciones destacadas), funcionalidades y medidas de confianza. De los 8 campos de la estructura oficial siguen sin aparecer el proceso de fabricación (en un servicio digital: cómo y con qué herramientas se desarrollará la web), el empaque y presentación (identidad visual, dominio, interfaz), la sostenibilidad y la integración con redes sociales. Esta última aparece solo en los canales del BMC (p. 36).", "mejora": "Agreguen cuatro filas a la Tabla 2: proceso de desarrollo (etapas, herramientas, responsables), presentación (marca, colores, adaptación a celulares), sostenibilidad (relación con las metas 12.2 y 12.5, con la reserva que ya hacen en 1.2.4) e integración con redes sociales (Facebook e Instagram para captación y compartir publicaciones)."}, {"severidad": "importante", "titulo": "Segmentos todavía sin variables concretas ni tamaño", "ubicacion": "2.5, pp. 20-22", "cita": "personas mayores de 18 años ubicadas en Arequipa, Perú, así como por pequeños negocios", "problema": "Detallan subgrupos claros (estudiantes universitarios, creadores de contenido, familias y organizadores de eventos, propietarios frecuentes). Aun así, el criterio demográfico es solo la mayoría de edad y no se indican distritos, NSE, frecuencia de necesidad ni cuántas personas podrían ser. Sin eso no se puede diseñar la captación inicial ni calcular la demanda en la AA2.", "mejora": "Describan cada segmento con variables geográficas (distritos de Arequipa con mayor presencia universitaria o comercial), demográficas (edad, NSE), psicográficas y conductuales (cuántas veces al año necesita el objeto) y estimen su tamaño con datos del INEI o de estudios de mercado, citando la fuente. También conviene indicar cuál será el primer segmento al que atenderán."}, {"severidad": "importante", "titulo": "Ingresos complementarios presentados como vigentes en el capítulo 2 y como futuros en el BMC", "ubicacion": "2.1, p. 12; Tabla 2, p. 14; caso 5, p. 26; BMC, pp. 33 y 38", "cita": "Estos servicios complementarios no reemplazan la comisión por alquiler: se plantean para etapas de consolidación y expansión, respectivamente", "problema": "En 2.1 afirman que AlquiTodo «contará con» publicaciones destacadas y el plan Premium, la Tabla 2 los incluye como parte de la ficha y el caso 5 los describe en funcionamiento. En cambio, el BMC y 3.2.5 los consideran propuestas «para etapas posteriores» que deben validarse. La contradicción central de la versión anterior desapareció, pero este desfase hace que el lector no sepa qué incluye la primera versión.", "mejora": "Unifiquen el estado de estos servicios: o forman parte de la primera versión, o se declaran en 2.1, la Tabla 2 y el caso 5 como etapas posteriores (por ejemplo, en una columna «Etapa» de la ficha)."}, {"severidad": "sugerencia", "titulo": "El diferencial es una hipótesis bien planteada que aún no se sustenta con datos", "ubicacion": "3.2.2, p. 36; 3.3.4, p. 49", "cita": "La diferenciación frente a los canales generales de anuncios se encuentra en integrar la solicitud, aceptación, pago, seguimiento de la entrega y devolución, y evaluación posterior del alquiler.", "problema": "Respondieron la observación anterior: ahora explican qué hace AlquiTodo que Facebook Marketplace no hace (reserva por fechas, pago, evidencias, incidencias) y reconocen que es una «diferenciación propuesta», no demostrada. Falta mostrar por qué esa integración importa lo suficiente para que un propietario ceda el 15 % de cada alquiler. Las plataformas digitales también figuran entre los proyectos de baja innovación, por lo que deben demostrar el valor agregado.", "mejora": "Identifiquen uno o dos atributos concretos (por ejemplo, el calendario de disponibilidad por fechas o el registro fotográfico de entrega y devolución) y prueben en el MVP (AA2) si los usuarios los valoran. Presenten la comparación con Facebook en una tabla con criterios."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "Es el capítulo más sólido: dos mapas de empatía, BMC de 9 bloques argumentado uno por uno, coherente con el capítulo 2, y una comparación de competidores completa. Falta indicar la base de los mapas, y reponer los indicadores de gestión.", "observaciones": [{"severidad": "importante", "titulo": "Se eliminó el apartado de indicadores de gestión", "ubicacion": "3.3 a 3.3.4, pp. 42-50 (sin indicadores)", "cita": "", "problema": "La versión anterior incluía siete indicadores con definición, fórmula, ejemplo de cálculo y meta. En esta entrega no figura ninguno, y el índice solo llega a 3.3.4 Ventaja competitiva. La estructura del TAP exige los indicadores de gestión del modelo.", "mejora": "Reincorporen el apartado como 3.4, ajustando los indicadores al flujo actual: por ejemplo, publicaciones activas, solicitudes de alquiler, tasa de aceptación, alquileres completados, ingreso bruto por alquiler (S/ 20 por cada S/ 100) y tasa de incidencias. Indiquen de dónde saldrá cada dato."}, {"severidad": "sugerencia", "titulo": "Los mapas de empatía no se rotulan como hipótesis y las figuras no tienen número ni fuente", "ubicacion": "3.1, pp. 28-32", "cita": "", "problema": "Los mapas están bien diseñados y el análisis es detallado, pero no se indica que se trate de hipótesis del equipo. Además, las figuras de ambos mapas (pp. 28 y 30) no tienen número, título ni nota de fuente, a diferencia del BMC (Figura 3).", "mejora": "Añadan una frase que los rotule como hipótesis del equipo y presenten los mapas como «Figura 1» y «Figura 2», con título en cursiva y nota «Elaboración propia»."}, {"severidad": "sugerencia", "titulo": "La comparación de competidores puede ser más útil si todos usan los mismos criterios", "ubicacion": "3.3.1 (Eventus), p. 44; Tabla 3, p. 47", "cita": "Su perfil público presenta una referencia de precios «desde S/ 50», pero no permite verificar en el contenido consultado qué servicio corresponde a ese importe", "problema": "La descripción de Eventus es muy limitada: no se indica qué ofrece, solo que su perfil es público, y se cita como InEventos, un directorio, con lo cual el lector no sabe si es una empresa o un anuncio. Además, la Tabla 3 compara fortalezas, pero casi no menciona debilidades.", "mejora": "Describan a Eventus como empresa con su propia información (servicios y cobertura) y agreguen a la Tabla 3 una columna de debilidades."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Mejoró el índice, las tablas y la eliminación de los textos de plantilla. Quedan por corregir la carátula (docente, institución y sección) y las referencias.", "observaciones": [{"severidad": "importante", "titulo": "Carátula con el apellido del docente mal escrito y datos que faltan", "ubicacion": "Carátula, p. 1", "cita": "DOCENTE: JEANPIER BRANDOL ANCORIJ SANCHEZ", "problema": "Se agregó el título del proyecto, pero el apellido del docente sigue mal escrito (es «ANCORI»). El nombre de la institución continúa incompleto («INSTITUTO DE EDUCACIÓN SUPERIOR TECNOLÓGICO PRIVADO», solo con el logo) y no figura la sección.", "mejora": "Completen la carátula con el nombre completo de la institución, la sección y el grupo, y corrijan el apellido del docente."}, {"severidad": "importante", "titulo": "Referencias con errores de APA 7", "ubicacion": "Referencias, pp. 51-52", "cita": "Centro Nacional de Planeamiento Estratégico (2025). Listado referencial de megatendencias que tienen impacto en el Perú.", "problema": "Las referencias no siguen el formato APA 7: falta el punto antes del año («Autor. (año).»), no se aprecia sangría francesa. La lista está dividida en dos bloques, uno con los autores (Centro Nacional... a Ruiz Ramírez) y otro con las fuentes de competidores (Alquilo Cosas a SISAQP), seguidos por Osterwalder y Pigneur, de modo que no es alfabética. Además, INEI (2010) se cita en el texto (p. 5) pero no está en la lista, y Osterwalder y Pigneur (2010) está en la lista pero no se cita.", "mejora": "Ordenen toda la lista alfabéticamente, apliquen el formato «Autor. (año). Título en cursiva. Sitio. URL», agreguen la referencia de INEI (2010) y citen a Osterwalder y Pigneur en 3.2 o retírenla."}, {"severidad": "sugerencia", "titulo": "Texto del lienzo del BMC difícil de leer y nombre inconsistente de una fuente", "ubicacion": "Figura 3, p. 34; 3.3.1, p. 44", "cita": "(InEventos, s. f.)", "problema": "El lienzo se imprime en una sola página con letra muy pequeña, lo que dificulta leerlo. Además, el competidor se llama Eventus en el texto y la tabla, pero la cita y la referencia se hacen a InEventos, lo que confunde al lector sobre quién es la fuente. En el título del capítulo 2, el índice y el encabezado dice «CAPITULO II» sin tilde.", "mejora": "Coloquen el BMC en una página horizontal o con mayor tamaño de letra, citen la fuente con el nombre que corresponde al sitio y revisen la ortografía de los títulos."}]}, {"etiqueta": "AA2 · Capítulo III", "titulo": "Modelo de negocio: revisión de avance AA2", "resumen": "Avance AA2 (06/11/2026): retroalimentación formativa, sin calificación. El capítulo repone los indicadores de gestión (3.4), rotula los mapas de empatía como hipótesis, numera las figuras 1 a 3 y las tablas 4 a 6, mantiene la tarifa de 15 % + 5 % sin contradicciones numéricas y convierte la ventaja competitiva en dos atributos verificables (Tabla 5). Con la exigencia de la AA2, quedan cinco asuntos de fondo: los indicadores no tienen todos fórmula y meta, y no coinciden con lo que la Tabla 5 y el MVP prometen medir; la economía de la tarifa no considera IGV ni costo de pasarela; solo un competidor es realmente comparable; el BMC sigue describiendo un lanzamiento amplio mientras el MVP es acotado; y el texto repite varias veces los mismos párrafos.", "observaciones": [{"severidad": "importante", "titulo": "Indicadores de gestión: fórmula y meta incompletas, y no coinciden con lo que se promete medir", "ubicacion": "3.4, Tabla 6; 3.3.4 (párrafo «De estas diferencias se priorizan dos atributos»)", "cita": "Número de publicaciones con estado activo y disponibilidad vigente al cierre del mes.", "problema": "Reponer el apartado fue un avance, pero la Tabla 6 no llega al nivel AA2. (1) Solo «Tasa de aceptación» y «Tasa de incidencias» tienen fórmula; «Publicaciones activas», «Solicitudes de alquiler» y «Alquileres completados» solo tienen una definición en palabras. (2) La meta del «Ingreso bruto por alquiler» («S/ 20 por cada S/ 100») no es una meta sino la regla de la tarifa; la propia tabla admite que «el monto mensual se fijará al estimar los costos». (3) Las metas no comparten horizonte: unas son «al tercer mes de operación» y otras no indican plazo ni si se refieren al piloto del MVP o a la operación comercial. (4) En 3.3.4 prometen medir «el porcentaje de propietarios que mantienen actualizado el calendario» y «el porcentaje de alquileres con ambos registros completos», pero ninguno de los dos figura en la Tabla 6. (5) Faltan indicadores propios de un marketplace de dos lados: razón propietarios/arrendatarios activos, conversión de solicitud aceptada a pago confirmado, tasa de fuga (operaciones cerradas fuera de la plataforma), costo de captación por usuario y satisfacción (calificación promedio o NPS).", "mejora": "Rehagan la Tabla 6 con una fórmula explícita por indicador (p. ej., conversión = pagos confirmados ÷ solicitudes aceptadas × 100), un periodo de medición y una meta distinta para el piloto del MVP y para el tercer mes de operación. Incorporen los dos indicadores de 3.3.4 y al menos uno de equilibrio de oferta/demanda, uno de fuga y uno de satisfacción. Reemplacen la meta del ingreso bruto por un monto mensual (p. ej., 20 alquileres × S/ 20 = S/ 400) y mantengan la distinción con utilidad neta."}, {"severidad": "importante", "titulo": "La Tabla 5 y la Tabla 6 miden funciones que el MVP del capítulo IV no incluye", "ubicacion": "3.3.4, Tabla 5 (filas «Disponibilidad por fechas», «Pago», «Incidencias y calificaciones»); 3.4, Tabla 6 («Tasa de incidencias»); capítulo IV, c)", "cita": "Pago dentro de la plataforma y liquidación al propietario al cerrar la operación.", "problema": "La ventaja competitiva se sustenta en calendario por fechas, pago dentro de la plataforma, registro fotográfico, canal de incidencias y calificaciones, y la columna «Validación en la AA2» propone medir «tasa de incidencias y uso de calificaciones» y «disposición a pagar dentro de la plataforma». Sin embargo, el capítulo IV deja fuera la integración completa de pagos y las calificaciones públicas, y su lista de 11 funcionalidades no incluye calendario de disponibilidad ni reporte de incidencias. Por tanto, tres de los siete criterios de la Tabla 5 y un indicador de la Tabla 6 no podrán medirse con el MVP tal como está planteado. El capítulo III y el IV describen productos distintos.", "mejora": "Elaboren una matriz de trazabilidad: hipótesis (Tabla 5) → funcionalidad del MVP → indicador (Tabla 6) → instrumento de validación. Si una función no está en el MVP, retiren ese criterio de la validación de la AA2 y márquenlo como etapa posterior; si es esencial para probar el diferencial, inclúyanla en el capítulo IV."}, {"severidad": "importante", "titulo": "La economía de la tarifa del 15 % + 5 % omite IGV, costo de pasarela y plazo de liquidación", "ubicacion": "3.2 (tercer párrafo), 3.2.5, 3.3.4 y Tabla 6", "cita": "AlquiTodo obtendrá S/ 20 de ingreso bruto, antes de descontar los costos de procesamiento de pagos y operación.", "problema": "No hay contradicción numérica entre secciones (S/ 105, S/ 85 y S/ 20 se repiten igual), lo cual es una mejora. Pero el cálculo queda incompleto para esta etapa: (a) no se indica si el 5 % y el 15 % incluyen IGV, aunque en la Tabla 4 sí distinguen precios con y sin IGV (SISAQP, JCP Maquinarias); si los S/ 20 incluyen IGV, el ingreso real es menor. (b) La comisión de la pasarela se calcula sobre el total cobrado (S/ 105), no sobre el precio base, y no se estima ningún porcentaje; no se sabe si el margen por transacción es positivo. (c) 3.2.2 dice que el propietario recibe su importe «cuando la operación se complete», y 3.2.5 «cuando no existan incidencias pendientes», pero no hay plazo máximo de liquidación ni criterio para definir una incidencia pendiente. (d) El 15 % se justifica solo con la hipótesis del diferencial; no se compara con comisiones de otras plataformas de alquiler o marketplace.", "mejora": "Agreguen un cálculo de margen de contribución por transacción (sin necesidad de la tabla completa del capítulo 6): precio base, tarifa, IGV, costo de pasarela cotizado a un proveedor real y margen. Indiquen un plazo de liquidación (p. ej., 48 h tras la devolución confirmada) y contrasten la comisión con al menos dos referentes (marketplaces de alquiler o de servicios), citando la fuente."}, {"severidad": "importante", "titulo": "Solo un competidor es realmente comparable y no hay referencia de precios del segmento que prioriza el MVP", "ubicacion": "3.3.1 y Tabla 4 (Petulap, SISAQP, JCP Maquinarias, DEBOSS Eventos, Eventus); 3.3.2", "cita": "DEBOSS Eventos es una empresa arequipeña dedicada a la producción y atención integral de eventos.", "problema": "Los cinco primeros «directos» son empresas B2B con inventario propio y precio por cotización (producción de eventos, maquinaria de construcción, alquiler de computadoras a empresas); ninguno intermedia bienes de particulares. El texto lo reconoce en la Tabla 4 («paquetes integrales de eventos más que objetos por separado»), lo que contradice su clasificación como «Directo». El único comparable por modelo es Alquilo Cosas, y no se confirmó que opere en Arequipa. Como el capítulo IV prioriza equipos tecnológicos y audiovisuales, los competidores relevantes serían Petulap y SISAQP, pero de ambos solo se sabe que no publican tarifa; no hay una referencia de precio diario de una laptop, cámara o proyector con la que el propietario o el arrendatario puedan evaluar si el 20 % bruto es viable. Además, la descripción en prosa de 3.3.1 repite casi sin cambios las celdas de la Tabla 4.", "mejora": "Reclasifiquen: «competidores directos de producto» (Petulap, SISAQP, Alquilo Cosas) y «sustitutos o referentes de rubro» (DEBOSS, JCP, Eventus). Agreguen referentes de alquiler entre particulares (nacionales o internacionales, p. ej., plataformas como Fat Llama) y obtengan, por cotización simulada o por avisos públicos, al menos tres precios diarios de equipos tecnológicos para fijar un rango de precios. Reduzcan la prosa de 3.3.1 y dejen el análisis en la tabla."}, {"severidad": "importante", "titulo": "El BMC sigue describiendo el lanzamiento amplio, no el alcance acotado del MVP", "ubicacion": "3.2.1 (Segmentos), 3.2.3 (Canales), 3.2.8 (Socios clave); capítulo IV, a) y e)", "cita": "Dentro de este grupo se consideran estudiantes, trabajadores, profesionales, emprendedores, familias, creadores de contenido y organizadores de eventos.", "problema": "El capítulo III considera siete perfiles de arrendatario y seis familias de producto (herramientas, cámaras, deportes, camping, electrodomésticos, celebraciones); el MVP, en cambio, se limita a equipos tecnológicos y audiovisuales para estudiantes universitarios y creadores de contenido. El BMC no distingue la etapa MVP de la etapa de expansión. Hay otras desalineaciones: WhatsApp aparece como canal en el capítulo IV (f) pero no en 3.2.3; 3.2.8 incluye «servicios de verificación de identidad» como socio clave y el MVP excluye la verificación avanzada; 3.2.6 y 3.2.7 enumeran capacidades (marketing, legal, contable, moderación) sin indicar quién las cubre en el equipo.", "mejora": "Agreguen al BMC una columna o nota «Etapa MVP» que indique segmento inicial, categorías, canales y socios mínimos, y alinéenla con el capítulo IV. Indiquen quién del equipo asumirá cada actividad clave en el piloto."}, {"severidad": "sugerencia", "titulo": "Repetición de los mismos párrafos y autorreferencia al «documento de negocio del equipo»", "ubicacion": "3.2 (tercer párrafo), 3.2.5, 3.3.4 (penúltimos párrafos) y Tabla 6", "cita": "Respecto al modelo de ingresos, el documento de negocio del equipo establece que la publicación básica será gratuita", "problema": "El ejemplo de S/ 100 (S/ 105 / S/ 85 / S/ 20) aparece cuatro veces, y la aclaración de que el depósito no es custodiado por AlquiTodo y de que no hay seguro se repite en 3.2, 3.2.4, 3.2.5 y 3.3.4. Además, 3.3.4 habla del «documento de negocio del equipo» como si fuera otra fuente, cuando es este mismo informe. Esta redundancia alarga el capítulo sin aportar información nueva y resta rigor académico. También en 3.2.9, la última oración no termina con punto.", "mejora": "Expliquen la tarifa una sola vez (3.2.5) y remitan a ella con «véase 3.2.5» en los demás apartados. Eliminen la autorreferencia y concentren las advertencias de no-seguro y no-custodia en un solo párrafo de «Alcance y limitaciones»."}, {"severidad": "sugerencia", "titulo": "Mapas de empatía rotulados como hipótesis, pero sin sustento citado ni priorización", "ubicacion": "3.1 (introducción y análisis de ambos mapas); 3.3.1 y 3.3.2 (fuente Meta, 2016)", "cita": "elaboradas a partir de la revisión de la literatura y de la observación de los canales actuales de alquiler", "problema": "El rótulo de hipótesis responde a la observación anterior. Sin embargo, se afirma una base en «la literatura» y en la «observación de los canales», pero el apartado 3.1 no contiene ninguna cita ni indica qué canales se observaron y cuándo. Cada cuadrante es un párrafo largo sin jerarquía: no se distingue cuál es el dolor más crítico ni qué dolor se verificará primero. Por otro lado, el comportamiento de Facebook Marketplace se sustenta solo en una fuente corporativa de 2016 (Meta, 2016), con diez años de antigüedad para un servicio que cambia con frecuencia.", "mejora": "Citen las fuentes ya usadas en el capítulo I dentro de 3.1 e indiquen los canales observados y la fecha. Marquen con un número los tres dolores principales de cada mapa y vincúlenlos con las hipótesis de la validación. Actualicen la fuente de Facebook Marketplace con una página de ayuda vigente consultada en 2026."}]}, {"etiqueta": "AA2 · Capítulo IV", "titulo": "Producto mínimo viable: revisión de avance AA2", "resumen": "Avance AA2 (06/11/2026): retroalimentación formativa, sin calificación. El capítulo ya delimita un formato (página web responsiva), un lugar (Arequipa), una categoría inicial (equipos tecnológicos y audiovisuales), dos segmentos y una lista de 11 funcionalidades, y acierta al no proponer una aplicación móvil. Con el criterio exigente de la AA2, es el apartado más débil del avance: el MVP deja fuera justamente lo que el equipo identificó como hipótesis de mayor riesgo (pago, garantías, confianza); los siete objetivos no son medibles; no se nombra ninguna herramienta, costo ni responsable de desarrollo; no hay pasos seguidos; y las 11 funcionalidades no están priorizadas, de modo que no son «mínimas». Además, la estructura (a, b, c… sin numeración 4.1, tablas sin número y un apartado «g) Imágenes» vacío) no cumple el formato del TAP.", "observaciones": [{"severidad": "critico", "titulo": "El MVP no prueba la hipótesis más riesgosa del marketplace: confianza, pago y garantías", "ubicacion": "c) Funcionalidades clave (párrafos finales); b) Objetivos del MVP; capítulo III, 3.3.4", "cita": "Las funcionalidades relacionadas con la integración completa de pagos, las verificaciones avanzadas de identidad, las calificaciones públicas y la gestión automatizada de depósitos de garantía podrán desarrollarse progresivamente", "problema": "En las revisiones anteriores y en el propio capítulo III se identifica como riesgo central que los propietarios (sobre todo de cámaras y equipos tecnológicos, la categoría elegida) no entreguen sus bienes a desconocidos y que las partes cierren el trato fuera de la plataforma para evitar la tarifa del 20 %. El MVP retira precisamente las cuatro funciones que atienden ese riesgo: pago, verificación, calificaciones y depósito. Lo que queda (registro, catálogo, solicitud, chat y fotos) es un tablón de anuncios con un formulario, es decir, casi lo que ofrece Facebook Marketplace con grupos. Con ese MVP no se puede comprobar si el diferencial justifica el 15 % descontado al propietario, ni si los usuarios pagarían dentro de la plataforma, pese a que el objetivo final del apartado b) es «evaluar la aceptación del modelo de ingresos». Asimismo, la frase «un prototipo funcional o un entorno de prueba» no aclara qué se probará con usuarios reales.", "mejora": "Definan explícitamente la hipótesis más riesgosa (p. ej., «al menos 30 % de los propietarios contactados publicaría un equipo de más de S/ 500 si el pago y el registro fotográfico se hacen dentro de la plataforma») y diseñen el MVP para probarla. Si construir una pasarela es inviable, utilicen un MVP tipo concierge o «Mago de Oz»: el equipo recibe el pago por Yape/transferencia y lo registra manualmente, aplicando la tarifa real de 15 % + 5 %, para medir disposición a pagar y fuga de operaciones. Agreguen un reporte de incidencias mínimo, aunque sea un formulario."}, {"severidad": "critico", "titulo": "Los siete objetivos no son específicos ni medibles", "ubicacion": "b) Objetivos del MVP", "cita": "Validar la propuesta de valor: comprobar si los usuarios consideran conveniente contar con una plataforma que reúna diferentes productos disponibles para alquiler.", "problema": "Los siete objetivos se redactan con verbos de exploración («comprobar», «conocer», «identificar», «recopilar») y no incluyen indicador, meta, muestra ni plazo. «Validar la propuesta de valor» e «identificar la demanda potencial» se solapan, y «recopilar retroalimentación» es una actividad, no un objetivo. No se vincula ninguno con las métricas del capítulo III (Tabla 6): no hay meta de propietarios registrados, publicaciones, solicitudes ni alquileres. Tampoco se definen criterios de éxito o fracaso, de modo que el capítulo 5 no tendrá contra qué comparar sus resultados. La usabilidad («interfaz sencilla… intuitiva», apartado a)) tampoco tiene un criterio verificable.", "mejora": "Reformulen con el formato «verbo + qué + indicador + meta + plazo + muestra»: p. ej., «Conseguir 15 propietarios y 30 publicaciones de equipos tecnológicos en 3 semanas», «Lograr que 20 estudiantes envíen al menos 15 solicitudes de reserva, con una tasa de aceptación ≥ 60 %», «Lograr que 8 de cada 10 usuarios completen el registro y una solicitud sin ayuda en menos de 5 minutos». Definan además el umbral que decide si se persevera, se ajusta o se descarta. Reduzcan a 4 o 5 objetivos."}, {"severidad": "critico", "titulo": "No se nombra ninguna herramienta de diseño o desarrollo, ni su costo, y no se sustenta su elección", "ubicacion": "a) Descripción del MVP (último párrafo); d) Plataformas compatibles; c) (prototipo funcional o entorno de prueba)", "cita": "Desde el punto de vista técnico, se priorizará una interfaz sencilla, adaptable a diferentes tamaños de pantalla", "problema": "La rúbrica exige sustentar cómo las herramientas aportan a funcionalidad, usabilidad y viabilidad técnica. El capítulo no menciona con qué se prototipará el diseño (p. ej., Figma o Canva), con qué se desarrollará la web (plataformas sin código como Webflow o Bubble, un gestor como WordPress con plugins de reservas, un marketplace configurable como Sharetribe, o un desarrollo con framework propio), dónde se alojará, qué base de datos y qué método de pago se usará. Tampoco hay costos (ni siquiera del dominio y hosting), responsables dentro del equipo ni plazo. La única justificación es «reducir los costos iniciales» (d), sin cifras. La tabla de plataformas (Chrome, Edge, Firefox, Android/iOS, tablets) describe dónde se verá el sitio, no con qué se construirá. Facebook, Instagram y WhatsApp son canales de difusión, no herramientas de desarrollo ni de validación (no se indica cómo se levantarán datos: formulario, hoja de cálculo, analítica).", "mejora": "Incluyan una tabla «Herramienta – uso en el MVP – por qué se eligió (funcionalidad, usabilidad, viabilidad técnica) – costo – responsable» con al menos: prototipado (p. ej., Figma), construcción de la plataforma (justificando por qué una opción sin código o un servicio como Sharetribe es viable en 4 semanas), base de datos/alojamiento, pasarela o medio de pago del piloto, formularios y analítica para el capítulo 5. Presenten una alternativa descartada por cada decisión importante. Citen documentación o precios oficiales de cada herramienta."}, {"severidad": "importante", "titulo": "Las 11 funcionalidades no están priorizadas ni justificadas: no son «mínimas»", "ubicacion": "c) Funcionalidades clave (tabla de 11 filas y dos párrafos finales)", "cita": "El MVP incorporará las siguientes funcionalidades esenciales:", "problema": "Se presentan como «esenciales» las 11 funciones, con una descripción de una línea y sin criterio de selección. No se indica cuáles son indispensables para el primer ciclo de prueba y cuáles son deseables (no hay clasificación del tipo «debe / debería / podría / no ahora»), ni qué se descarta y por qué: la justificación de lo que queda fuera se reduce a «podrán desarrollarse progresivamente, dependiendo de los resultados». Hay funciones que podrían simplificarse para un MVP: «Perfiles de usuario» (2) y «Registro» (1) pueden unirse; «Catálogo» (4) y «Búsqueda y filtros» (5) se resuelven con un listado filtrable; y «Comunicación entre usuarios» (8) podría ser un botón a WhatsApp, lo que además contradice la intención de mantener las operaciones dentro de la plataforma. «Información de las condiciones» (9) habla de «requisitos de garantía, cuando corresponda», cuando el modelo establece que la garantía no la gestiona AlquiTodo. No hay criterios de aceptación ni características esenciales (rendimiento, seguridad, accesibilidad) por función.", "mejora": "Prioricen con una tabla de tres columnas (Esencial para probar la hipótesis / Complementaria / Fuera del MVP) y justifiquen cada fila en una frase vinculada con un objetivo del apartado b). Para cada funcionalidad esencial agreguen el criterio de aceptación (p. ej., «un propietario publica un artículo con 3 fotos en menos de 5 minutos»). Expliquen explícitamente qué se deja fuera y qué señal en la validación activaría su desarrollo."}, {"severidad": "importante", "titulo": "Funcionalidades que el capítulo III declara diferenciadoras no figuran en el MVP", "ubicacion": "c) Funcionalidades clave (filas 3, 5, 6, 9, 10); capítulo III, Tabla 5 y 3.3.4", "cita": "Permitirá incorporar fotografías del producto antes de la entrega y después de la devolución.", "problema": "El capítulo III prioriza dos atributos: «calendario de disponibilidad por fechas» y «registro fotográfico de entrega y devolución». Este segundo sí figura (fila 10), pero el primero no: la fila 3 (publicación) no incluye disponibilidad, la fila 5 filtra por «disponibilidad» sin que exista un calendario que la alimente, y la fila 6 envía solicitudes con «el periodo» sin verificar cruces de fechas. Tampoco hay función de gestión de incidencias, aceptación de términos y condiciones, notificaciones (el capítulo III promete avisos de aceptación, pago, entrega y devolución), ni un panel mínimo del equipo para moderar publicaciones, aunque el capítulo III lo considera actividad clave. Sin estas piezas no se pueden medir las tasas de aceptación, de incidencias y de calendario actualizado.", "mejora": "Completen el MVP con el calendario de disponibilidad (aunque sea un campo de fechas bloqueables), las notificaciones por correo o WhatsApp, un formulario de incidencias y la aceptación de términos y condiciones. Si no pueden incluirlas, ajusten el capítulo III (Tabla 5 y Tabla 6) para que no prometa su medición."}, {"severidad": "importante", "titulo": "No se describen los pasos seguidos para desarrollar el MVP", "ubicacion": "Introducción del capítulo IV (segundo párrafo) y apartados a)–g)", "cita": "El desarrollo del MVP se realizará de manera progresiva, priorizando las funciones necesarias", "problema": "La rúbrica de AA2 considera para el nivel más alto «todos los pasos seguidos». El capítulo anuncia un desarrollo «progresivo» pero no describe ninguna etapa: no hay secuencia (investigación, definición de historias de usuario, wireframes, prototipo, prueba con usuarios, ajuste), ni responsables, ni cronograma, ni evidencia de lo ya avanzado (el apartado g) «Imágenes» está vacío). No se sabe si ya existe un prototipo, cuántas versiones tuvo ni qué cambios se hicieron a partir de la revisión de la AA1.", "mejora": "Agreguen un apartado «Proceso de desarrollo» con las etapas realizadas y por realizar, fecha, responsable y producto de cada una (diagrama de flujo del usuario, wireframes, prototipo navegable). Incluyan capturas numeradas del prototipo con su título y fuente en el apartado de figuras, y expliquen qué decisiones de diseño se tomaron a partir de los mapas de empatía."}, {"severidad": "importante", "titulo": "Alcance del piloto: categoría elegida con sustento débil y sin tamaño ni plan para conseguir la oferta inicial", "ubicacion": "a) Descripción del MVP (cuarto párrafo); e) Usuarios objetivo", "cita": "priorizará las categorías de equipos tecnológicos y audiovisuales, debido a su relación con las necesidades de estudiantes universitarios y creadores de contenido.", "problema": "Reducir el alcance a una categoría es una decisión acertada (había sido sugerida en la revisión AA1), pero se justifica sin datos: no se indica cuántos estudiantes o creadores existen en Arequipa, con qué frecuencia necesitan estos equipos ni cuánto pagan. Además, es la categoría donde los propietarios tienen más aversión al riesgo (valor alto del bien) y donde ya compiten Petulap y SISAQP, que alquilan computadoras y proyectores. No se define el tamaño del piloto (cuántos propietarios, cuántas publicaciones, cuántos arrendatarios) ni cómo se resolverá el problema del arranque: el capítulo concluye que ambos lados «deben desarrollarse de manera complementaria» pero no explica de dónde saldrán las primeras publicaciones. El apartado e) solo describe perfiles; no define criterios de selección de participantes ni cómo se contactarán.", "mejora": "Justifiquen la categoría con un dato (p. ej., cantidad de estudiantes de institutos y universidades de Arequipa, o encuestas previas) y delimiten el piloto: «12 propietarios, 25 publicaciones y 40 arrendatarios en 4 semanas, en una o dos instituciones». Describan cómo reclutarán a los primeros propietarios (clubes, docentes, tiendas de fotografía) y qué incentivo tendrán (p. ej., comisión reducida durante el piloto)."}, {"severidad": "importante", "titulo": "Plataformas compatibles: sin viabilidad técnica, costo ni tratamiento de datos personales", "ubicacion": "d) Plataformas compatibles; c) fila 1 «Registro de usuarios»", "cita": "Permitirá crear una cuenta mediante datos básicos, correo electrónico y número de teléfono.", "problema": "La tabla del apartado d) enumera navegadores y dispositivos, lo que es consecuencia de «responsivo» y no una decisión. No se indica con qué dispositivos se probará el sitio, qué velocidad de carga se espera, ni cómo se protegerán los datos. El registro pide correo y teléfono; el modelo completo prevé verificación de identidad (DNI), fotografías de objetos y pagos, pero el capítulo no menciona la Ley N.° 29733 de Protección de Datos Personales, el consentimiento ni la política de privacidad. «Reducir los costos iniciales» se afirma sin una estimación.", "mejora": "Reemplacen la tabla por una sección de «Requisitos técnicos y de seguridad»: dispositivos y navegadores de prueba, tiempo de carga objetivo, almacenamiento de datos, consentimiento y política de privacidad, y costo mensual estimado (dominio, hosting, herramienta de construcción). Citen la norma aplicable."}, {"severidad": "sugerencia", "titulo": "Redes sociales: no se definen metas de captación y WhatsApp no figura en el BMC", "ubicacion": "f) Redes sociales", "cita": "Facebook e Instagram serán los principales canales de promoción.", "problema": "El apartado describe el uso de cada red, pero no contiene metas (alcance, clics al sitio, registros por canal), calendario de publicaciones ni presupuesto. WhatsApp se usará para «coordinar las actividades de validación», pero no figura entre los canales de 3.2.3. Además, si la coordinación de alquileres se desplaza a WhatsApp, aumenta el riesgo de fuga de operaciones y de pérdida de trazabilidad, que es lo que el modelo quiere evitar. El apartado pertenece más al plan de captación (BMC) que a la definición del producto.", "mejora": "Reduzcan el apartado a una tabla con meta mensual por canal y cómo se medirá (p. ej., enlaces con UTM). Incorporen WhatsApp al BMC como canal de soporte durante el piloto y definan reglas para no concretar el alquiler fuera de la plataforma."}, {"severidad": "sugerencia", "titulo": "Formato: apartados con letras, tablas sin número y apartado «g) Imágenes» vacío", "ubicacion": "Todo el capítulo IV; encabezado «4. PRODUCTO MÍNIMO VIABLE»", "cita": "g) Imágenes", "problema": "El capítulo usa «a), b), c)…» en lugar de la numeración 4.1, 4.2, … con la que se estructuran los capítulos I a III. Las tres tablas (funcionalidades, plataformas y redes) no tienen número, título ni nota de fuente, a diferencia de las Tablas 4 a 6 del capítulo III (APA 7). Los objetivos y los perfiles usan viñetas con asterisco. El título del capítulo está en mayúsculas y con numeración «4.» mientras el capítulo III dice «CAPÍTULO III». El apartado g) está vacío, y no hay prototipo ni figuras que respalden la descripción.", "mejora": "Renumeren a 4.1–4.n, añadan «Tabla 7», «Tabla 8»… con título en cursiva y nota «Elaboración propia», unifiquen el estilo de los títulos de capítulo e incorporen figuras numeradas del prototipo (Figura 4 en adelante) o eliminen el apartado g)."}, {"severidad": "sugerencia", "titulo": "Definición de MVP sin marco conceptual: más cercana a un producto reducido que a un experimento", "ubicacion": "Introducción del capítulo IV y a) Descripción del MVP", "cita": "El producto mínimo viable (MVP) de AlquiTodo consiste en una primera versión funcional de la plataforma digital", "problema": "El capítulo no cita ninguna fuente (ni siquiera la definición clásica de MVP de Ries, 2011) y entiende el MVP como «una primera versión funcional» con 11 funciones, es decir, un desarrollo en pequeño. En la literatura de emprendimiento, el MVP es el mínimo de esfuerzo que permite aprender si la hipótesis crítica es cierta, y existen formatos de bajo costo (página de aterrizaje con lista de espera, concierge, prototipo navegable). Esto es importante porque el equipo debe validar el modelo con datos reales en el capítulo 5.", "mejora": "Fundamenten el concepto con una fuente académica (en APA 7) y expliquen qué tipo de MVP eligen y por qué es el más barato para aprender lo que necesitan. Incluyan una frase que enlace el MVP con la hipótesis priorizada del capítulo 3."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Validación del MVP: formulario de validación", "resumen": "Formulario accesible y revisado completo (24 preguntas, 6 secciones). Bien orientado a la exploración, pero con diseño insuficiente para validar el modelo de negocio y el MVP, y sin datos recolectados.", "observaciones": [{"severidad": "critico", "titulo": "No hay recolección real de datos, análisis ni mejoras al MVP", "ubicacion": "5.1.4, 5.1.5 y 5.2 del informe (versión 06/11); formulario publicado", "cita": "Presentar los resultados de las encuestas, respetando el orden de cada pregunta.", "problema": "En el informe, 5.2 conserva el texto de la plantilla; las entrevistas mantienen marcadores como «Especialista 1: [Indicar nombre, profesión y experiencia…]» y «[Insertar enlace de Google Drive]», y el enlace de 5.1.5 es «[Insertar enlace de Google Forms]». El formulario existe, pero el informe no presenta cuántas respuestas se obtuvieron, de quiénes ni con qué resultados. En la AA2 ya no basta con hipótesis ni con un instrumento: se exige evidencia real, análisis y mejoras derivadas de ella.", "mejora": "Aplicar la encuesta hasta la meta de 100 válidas (indicando cuántas por perfil), realizar y adjuntar las dos entrevistas, y presentar en 5.2 cada pregunta con tabla o gráfico e interpretación. Cerrar con 5.3: métricas frente a los umbrales definidos y una tabla «hallazgo → decisión → cambio en el MVP o en la tarifa»."}, {"severidad": "critico", "titulo": "La disposición de pago no prueba la tarifa real ni el sustituto gratuito", "ubicacion": "Formulario: «¿Qué porcentaje adicional sobre el precio del alquiler considerarías aceptable…?» y «¿Qué porcentaje de comisión sobre el precio del alquiler considerarías aceptable…?»", "cita": "0 % (no pagaría una tarifa adicional). / 3 %. / 5 %. / 8 %. / Dependería del precio del alquiler y del servicio ofrecido.", "problema": "(1) Preguntan qué porcentaje es «aceptable» en abstracto, sin anclar en soles ni mostrar el esquema que sí van a cobrar (S/ 100 → S/ 105 al arrendatario, S/ 85 al propietario, S/ 20 para AlquiTodo). El informe (5.1.3, preguntas 14 y 15) sí planteaba ese ejemplo con S/ 60, pero el formulario publicado lo eliminó. (2) Las opciones al arrendatario llegan a 8 % y las del propietario a 20 %; las opciones no equivalen a la propuesta (5 % y 15 % simultáneos), y la opción «dependería» absorbe a los indecisos sin permitir decidir. (3) Nunca se contrapone la alternativa gratuita (Facebook Marketplace, grupos), que es el riesgo competitivo central identificado en el capítulo III. (4) No hay una pregunta sobre cuánto pagaría el arrendatario por objeto o por día; el precio solo se pregunta al propietario (rangos desde S/ 20) y al arrendatario de forma abierta y retrospectiva («qué objeto alquilaste la última vez y cuánto pagaste»), que además se responde solo si contestó «Sí». (5) No se pregunta por la fuga de operaciones.", "mejora": "Reemplazar ambas preguntas por escenarios: «Un alquiler de S/ 100. Con AlquiTodo pagarías S/ 105 y tendrías pago protegido, calendario y registro fotográfico; publicar en Facebook es gratis. ¿Qué harías? (usaría AlquiTodo / usaría Facebook / depende de…)». Para propietarios: «Recibirías S/ 85 por cada S/ 100. ¿Publicarías?», con razones de rechazo. Agregar precio por día por categoría (equipos tecnológicos) y una pregunta de fuga («si ya conoces al arrendatario, ¿cerrarías el siguiente alquiler por fuera?»). Reducir «dependería» a una opción con «especifica de qué»."}, {"severidad": "critico", "titulo": "No se muestra el MVP ni se explica el servicio: se valida un concepto, no el producto", "ubicacion": "Descripción del formulario; sección «Validación de la propuesta AlquiTodo»", "cita": "AlquiTodo es una propuesta de plataforma digital que busca conectar a personas que necesitan alquilar objetos temporalmente con personas que poseen bienes disponibles para ofrecer en alquiler.", "problema": "La única descripción es esa oración. No hay captura, maqueta, video ni descripción de cómo funciona el flujo (solicitud, pago dentro de la plataforma, entrega con registro fotográfico, incidencias) ni del costo para el usuario. Las preguntas «¿Qué tan dispuesto(a) estarías a utilizar AlquiTodo para alquilar…/ofrecer…?» (escala 1–5) piden una intención sin información de precio ni funciones, lo que suele sobreestimar la aceptación. Además, la rúbrica exige validar la funcionalidad del MVP (cap. 4): una lista de funciones para elegir las «más importantes» mide preferencias, no si el MVP es comprensible ni usable.", "mejora": "Insertar antes de las preguntas de validación 2 a 4 imágenes del prototipo (Figma o capturas del MVP real) o un video corto de 60 s, con la tarifa visible. Agregar preguntas de comprensión y usabilidad: «¿Qué entiendes que hace esta pantalla?», «¿Qué te falta para reservar?», y una tarea breve (publicar un objeto en prototipo) en 5 a 8 pruebas de usabilidad con tiempo y errores."}, {"severidad": "importante", "titulo": "El instrumento publicado no coincide con el descrito en el informe", "ubicacion": "5.1.3 del informe frente al formulario publicado", "cita": "Pregunta 7. ¿Cómo buscarías actualmente un objeto que necesitas alquilar?", "problema": "El informe describe 16 preguntas en secciones A a F, con una cuadrícula de importancia de 8 funciones (escala de cinco niveles), la pregunta 7 sobre canales actuales y los ejemplos en soles de las preguntas 14 y 15. El formulario real tiene 24 preguntas en secciones distintas, no incluye la pregunta de canales actuales (con lo cual el objetivo específico «Conocer los medios que utilizan actualmente para encontrar objetos en alquiler», 5.1.1, queda sin medición), reemplaza la cuadrícula por una selección múltiple y añade preguntas nuevas (motivos de desinterés, duración del alquiler, número de objetos, precio por día). El tiempo estimado «4 a 6 minutos» tampoco es creíble con hasta 24 preguntas y varias de selección múltiple.", "mejora": "Actualizar 5.1.3 con el instrumento real (anexo con el formulario completo) y revisar la correspondencia objetivo específico → pregunta con una matriz. Reincorporar la pregunta de canales actuales y de uso de Facebook Marketplace y grupos, y ajustar el tiempo estimado tras la prueba piloto."}, {"severidad": "importante", "titulo": "Los segmentos del MVP no se identifican y no se filtra el público objetivo", "ubicacion": "Preguntas 1 a 3 (edad, distrito, relación con el alquiler); 5.1.2", "cita": "¿En qué distrito de Arequipa resides actualmente?", "problema": "El MVP (capítulo IV) se acota a equipos tecnológicos y audiovisuales para estudiantes universitarios y creadores de contenido, pero el formulario no pregunta ocupación, si estudia, si crea contenido, si posee equipos ni su valor. La edad parte en «18 a 24 años» sin descartar menores y la lista de distritos incluye una opción abierta, por lo que se puede responder desde fuera de Arequipa. Al difundirse por redes, grupos académicos y contactos personales (5.1.3), habrá un sesgo de autoselección hacia personas cercanas al equipo, sin que luego se puedan separar los resultados del segmento prioritario.", "mejora": "Agregar: ocupación (estudiante universitario, creador de contenido, trabajador, emprendedor, organizador de eventos), si posee equipos tecnológicos (cuáles, valor aproximado) y una pregunta filtro «¿Resides en Arequipa?» que finalice el formulario si la respuesta es no. Reportar los resultados por segmento y por perfil, y declarar el método de difusión y sus sesgos."}, {"severidad": "importante", "titulo": "Fallas de flujo: preguntas obligatorias que no corresponden al perfil", "ubicacion": "Pregunta 3 y sus saltos; «¿Tambien te interesa ofrecer objetos propios en alquiler?»; sección «Validación de la propuesta AlquiTodo»", "cita": "¿Qué tan dispuesto(a) estarías a utilizar AlquiTodo para ofrecer tus objetos en alquiler?", "problema": "(1) La sección de validación es común y cada pregunta es obligatoria, por lo que un arrendatario puro debe responder disposición «para ofrecer», y un propietario puro, disposición «para alquilar»; esto contam
