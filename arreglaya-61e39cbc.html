puesta («y recibieras un presupuesto claro»). Preguntar «¿contratarías…?» sobre algo deseable infla el «sí» por cortesía. Las opciones tampoco son balanceadas en todos los casos: la P12 ofrece Sí / Tal vez / No, y la pregunta de intención tiene tres alternativas favorables a la contratación («Tal vez», «Preferiría comparar») frente a una sola negativa, lo que dificulta interpretar el umbral de H4 y H5. Sin escala y sin «No sé», el 50 % o 60 % de los umbrales fijados antes de encuestar tendrá poca capacidad de rechazo de la hipótesis.", "mejora": "Formular preguntas neutras y sin adjetivos ni beneficios, con escala simétrica de 5 puntos y «No sé», y complementar con preguntas de comportamiento pasado (¿qué hizo la última vez?). Definir qué opciones cuentan como éxito (por ejemplo, solo «Sí, lo contrataría») antes de aplicar."}, {"severidad": "importante", "titulo": "La cuadrícula de importancia (P7) no obliga a priorizar y los resultados serán casi todos «importante»", "ubicacion": "P7 (cuadrícula de cinco aspectos, escala 1 a 5) y P14", "cita": "«Que el técnico tenga experiencia y esté verificado. / Recibir un presupuesto claro… / Contar con garantía… / Recibir un comprobante de pago. / Que el técnico llegue en el horario acordado.»", "problema": "Los cinco aspectos son deseables y la escala termina en «Muy importante», por lo que lo previsible es que todos reciban 4 o 5. La P14 sí obliga a elegir una sola ventaja, pero mezcla seis opciones y no permite jerarquizar. Para H2 y para decidir qué entra en el MVP se necesita saber qué atributo pesa más y a cuál renunciarían (por ejemplo, el comprobante frente a la rapidez), no solo si les parecen importantes.", "mejora": "Reemplazar la cuadrícula por un ordenamiento o por «elige las tres más importantes», o plantear compromisos (rapidez frente a precio, garantía frente a menor costo). Conservar la P14 como pregunta de prioridad principal."}, {"severidad": "importante", "titulo": "No se valida el lado del técnico ni la comisión de 20 %", "ubicacion": "Todo el formulario (dirigido solo a clientes)", "cita": "«¿Para quién necesitarías principalmente un servicio técnico?»", "problema": "El modelo de negocio del cap. III es de dos lados: el técnico paga una comisión y recibe clientes y pagos trazables. El formulario no pregunta al técnico si aceptaría la comisión, si cambiaría un directorio gratuito como Champi por ArreglaYa ni cuántos servicios haría al mes. El supuesto de ingreso (S/ 20 por servicio) no se contrasta con nadie. Además, no se pregunta al cliente si recurriría directamente al técnico en una segunda visita, que es el riesgo de desintermediación ya señalado.", "mejora": "Elaborar un segundo formulario (o guion de 5 a 8 entrevistas) para técnicos, con ingreso actual, disposición a la comisión, exclusividad y condiciones. Agregar al formulario de clientes una pregunta sobre cómo contactaría al técnico para una segunda reparación."}, {"severidad": "importante", "titulo": "No hay perfil del encuestado ni preguntas para analizar por segmento", "ubicacion": "Preguntas 1 y 2; ausencia de edad, ocupación, tipo de vivienda o de negocio", "cita": "«¿En qué distrito resides o se encuentra tu negocio?» (opciones: Cayma / Paucarpata / Cerro Colorado / opción vacía)", "problema": "Solo se capta distrito y destino del servicio. Sin edad (o rango), tipo de negocio, si es propietario o inquilino o ingresos aproximados, no se puede contrastar la respuesta con el segmento declarado en el cap. 2 (hogares y pequeños negocios por NSE y estilo de vida) ni analizar por segmento. La cuarta opción de la P1 está en blanco, y la pregunta no tiene «Otro distrito», por lo que no se puede excluir a quien está fuera de la zona de cobertura. Como se aplicará en el entorno cercano del equipo, el resultado puede reflejar solo a familiares y amigos.", "mejora": "Agregar edad por rango, tipo de negocio (bodega, restaurante, peluquería, otro), propiedad de la vivienda y «Otro distrito» con salto al final. Registrar por qué canal llegó cada respuesta, y fijar cuotas por distrito y tipo de cliente."}, {"severidad": "importante", "titulo": "No hay preguntas conductuales ni un compromiso real", "ubicacion": "Preguntas 3 a 6 y cierre del formulario", "cita": "«¿Qué tipo de servicios técnicos has necesitado durante ese periodo?»", "problema": "La P3 y la P4 miden la necesidad, pero no se pregunta qué hizo en la última reparación, cuánto pagó, cuánto esperó, qué salió mal ni si volvió a contratar al mismo técnico. Tampoco hay ninguna acción de compromiso (dejar su WhatsApp para el piloto, reservar un cupo, pagar un adelanto simbólico). Así, todas las respuestas son declaraciones y no hay evidencia de conversión, que es lo que sostiene los indicadores 2 y 6 del cap. 3.4 (5 % de conversión por recorrido).", "mejora": "Añadir tres preguntas sobre la última reparación (servicio, costo y cómo encontró al técnico) y una final opcional: «¿Quieres que te contactemos para probar el servicio?» con número de WhatsApp. Usar el porcentaje de quienes dejan su contacto como señal conductual."}, {"severidad": "importante", "titulo": "No hay un salto condicional ni coherencia de flujo para quien no tuvo necesidad", "ubicacion": "P3 y P4", "cita": "«Si(goto -2) / No(goto -2)»", "problema": "En el formulario publicado, tanto «Sí» como «No» de la P3 continúan a la sección siguiente, y la P4 (tipos de servicios que ha necesitado) sigue apareciendo para quien respondió «No». Esto fuerza respuestas vacías o inventadas y contamina el análisis de la P4, la P5 y la P6, que solo deberían responder quienes tuvieron necesidad. Además, en la P4 no queda claro que las categorías (pintura, instalación de muebles) estén dentro del alcance real del servicio: el informe limita la electricidad a focos, luminarias, interruptores y tomacorrientes, mientras la P4 lista «instalaciones».", "mejora": "Configurar el salto: «No» en la P3 pasa a preguntar por qué no ha necesitado un servicio y continúa con las preguntas del canal y la aceptación. Alinear las categorías de la P4 con el alcance del servicio del cap. 2."}, {"severidad": "sugerencia", "titulo": "Preguntas sin numerar, orden y opciones por pulir", "ubicacion": "Pregunta sin número tras la P9; P1; P8; P15", "cita": "«Si contrataras un servicio técnico a través de ArreglaYa y recibieras un presupuesto claro…» (sin número)", "problema": "La pregunta de intención de contratar, que es la central para H4, aparece sin número entre la P9 y la P12, señal de agregado tardío, y queda dispersa entre canal y visita integral. La P8 ofrece «Página web» y «Redes sociales», pero el MVP funciona por WhatsApp y llamada. La P15 pregunta una frecuencia hipotética («podrías necesitar») cuando ya se midió la necesidad real en la P3. Todas las preguntas, salvo las de la sección I, son obligatorias, lo que puede aumentar el abandono; la P1 y la P2 no lo son.", "mejora": "Numerar todo, ubicar la pregunta de intención al final de la sección de aceptación (después de mostrar el prototipo y el precio), unificar el criterio de obligatoriedad y reemplazar la P15 por frecuencia real (veces en el último año y gasto anual) para estimar la demanda."}, {"severidad": "sugerencia", "titulo": "Sin preguntas abiertas ni consentimiento y contacto para entrevistas", "ubicacion": "Cierre del formulario", "cita": "«La encuesta es confidencial y sus respuestas serán utilizadas únicamente con fines académicos.»", "problema": "Todas las preguntas son cerradas, por lo que no se descubre qué no previeron. No hay una pregunta abierta para sugerencias o razones, ni consentimiento informado explícito, ni forma de seleccionar a quienes aceptarían una entrevista breve, que complementaría la encuesta.", "mejora": "Añadir una o dos preguntas abiertas opcionales («¿Qué tendría que ofrecer ArreglaYa para que lo contrates?») y una casilla de consentimiento con un campo opcional de contacto para entrevistas."}], "puntuacion": {"criterios": [["Coherencia con las hipótesis e informe", 0.75], ["Cobertura del modelo de negocio (precio, canal, segmento)", 0.5], ["Cobertura de la funcionalidad del MVP (prototipo)", 0.5], ["Redacción, sesgo y opciones de respuesta", 0.75], ["Utilidad para analizar y decidir", 0.5]], "nota": "El instrumento mejoró y ahora es coherente con el servicio real, pero no mide precio ni disposición de pago, no muestra prototipo, no incluye el lado del técnico y no tiene ninguna señal conductual. Aún no hay resultados."}, "preguntas": [{"pregunta": "La última vez que necesitaste una reparación, ¿qué servicio fue, cuánto pagaste en total y cómo encontraste al técnico?", "opciones": "Servicio (lista) / Monto en S/ (numérico) / Medio de búsqueda (selección múltiple)", "mide": "Línea base de precio y canal con comportamiento real."}, {"pregunta": "(Muestra el tarifario referencial de dos o tres servicios típicos.) Con estos precios, ¿contratarías el servicio?", "opciones": "Sí / Depende / No / Pagaría menos de S/ ___", "mide": "H3: aceptación con el precio presentado."}, {"pregunta": "¿Cuál es el máximo que pagarías por una visita con presupuesto cerrado, garantía y comprobante?", "opciones": "Monto en S/ (numérico)", "mide": "Disposición de pago y precio techo."}, {"pregunta": "(Muestra capturas del flujo de WhatsApp.) ¿Entiendes cómo se pide el servicio y qué cambiarías?", "opciones": "Escala de 1 a 5 de claridad + pregunta abierta", "mide": "Validación de la funcionalidad del MVP."}, {"pregunta": "Ordena de más a menos importante: presupuesto cerrado, garantía, técnico verificado, puntualidad, comprobante.", "opciones": "Ordenamiento del 1 al 5", "mide": "H2 y priorización del MVP."}, {"pregunta": "¿Te contactamos por WhatsApp para probar el servicio sin costo de inscripción?", "opciones": "Sí, mi número es ___ / No", "mide": "Compromiso real (señal conductual)."}, {"pregunta": "Si tu técnico te atendió bien, ¿volverías a llamarlo directamente o usarías ArreglaYa de nuevo?", "opciones": "Directo con el técnico / ArreglaYa / </section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

const fmt = n => Number(n).toLocaleString('es-PE', { maximumFractionDigits: 2 });
const renderSec = (s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    ${s.puntuacion ? `<div class="scorebox">
      <div class="eyebrow">Puntuación de referencia del formulario (formativa; no es la calificación de la evidencia)</div>
      <div class="grade"><span class="big">${fmt(s.puntuacion.criterios.reduce((a, c) => a + Number(c[1]), 0))}</span><span class="of">/ 5</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Dimensión</th><th class="num">Puntos</th></tr></thead>
        <tbody>${s.puntuacion.criterios.map(c => `<tr><td>${esc(c[0])}</td><td class="num">${fmt(c[1])} / 1</td></tr>`).join('')}</tbody>
      </table></div>
      ${s.puntuacion.nota ? `<p class="summary">${esc(s.puntuacion.nota)}</p>` : ''}
    </div>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
    ${s.preguntas?.length ? `<div><h3 style="margin-bottom:8px">Preguntas que podrían mejorar el formulario</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Pregunta sugerida</th><th>Opciones o escala</th><th>Para qué sirve</th></tr></thead>
        <tbody>${s.preguntas.map(q => `<tr><td>${esc(q.pregunta)}</td><td>${esc(q.opciones)}</td><td>${esc(q.mide)}</td></tr>`).join('')}</tbody>
      </table></div></div>` : ''}
    ${s.consejos?.length ? `<div><h3 style="margin-bottom:8px">Consejos para que los resultados no salgan vacíos ni previsibles</h3>
      <ul class="strength">${s.consejos.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
  </section>`;
};
D.secciones.forEach((s, si) => { if (!isAA2(s)) renderSec(s, si); });
html += '</div>';

if (hasAA2) {
  html += '<div id="tab-aa2" class="tabpane" hidden>';
  html += `<section class="block aa2" id="aa2">
    <div class="head"><div class="eyebrow">Evidencia 2 · avance en curso</div><h2>Evidencia 2 (AA2): retroalimentación de avance</h2></div>
    <p class="summary">Esta parte corresponde a la Evidencia 2 (capítulos 4, 5 y 6 y elevator pitch). Es retroalimentación formativa para que puedan mejorar mientras avanzan. ${D.fecha_aa2 ? `Última actualización: ${esc(D.fecha_aa2)}. ` : ''}Se irá actualizando en este mismo enlace.</p>
    ${D.calificacionAA2 ? (() => {
      const p = Number(D.calificacionAA2.validacion);
      const NIV2 = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
      return `<div class="scorebox" id="nota-aa2">
        <div class="eyebrow">Calificación preliminar parcial · solo del formulario de validación</div>
        <div class="grade"><span class="big">${p}</span><span class="of">/ 4</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio de la rúbrica AA2</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
          <tbody>
            <tr><td>Validación del modelo de negocio (cap. 5)</td><td><span class="lvl l${p}">${NIV2[p] ?? '—'}</span></td><td class="num">${p} / 4</td></tr>
            <tr><td>Planteamiento del MVP · Herramientas · Análisis presupuestal · Compromiso</td><td>Pendiente</td><td class="num">—</td></tr>
          </tbody>
        </table></div>
        <p class="summary">Esta nota evalúa solo el instrumento (el formulario), porque aún no hay resultados reales. Para subir de nivel: con muestra real y análisis de resultados (n y %) se llega a 3; con mejoras al MVP derivadas de esos datos, a 4. La calificación final de la AA2 la define el docente e incluye los demás criterios y la exposición.</p>
      </div>`;
    })() : ''}
    ${D.costosAA2 ? (() => {
      const K = D.costosAA2, S = n => 'S/ ' + Number(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const f3 = arr => arr.map(v => `<td class="num">${S(v)}</td>`).join('');
      const sup = v => Number(v).toLocaleString('es-PE', { maximumFractionDigits: 2 });
      return `<div class="costos" id="costos-aa2">
        <h3 style="margin:18px 0 8px">Costos de nube y servicios digitales (estimación)</h3>
        <p class="summary">Estimación mensual con proveedores reales (Google Cloud / Firebase, OpenAI, WhatsApp) para tres escenarios de uso. Los volúmenes son supuestos elaborados a partir de su MVP: reemplácenlos con los datos de su prototipo. Tipo de cambio: S/ ${esc(K.tipo_cambio)} por USD. Los precios son cifras de referencia que deben confirmarse con la calculadora oficial de cada proveedor.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Supuesto de uso</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.supuestos.map(r => `<tr><td>${esc(r.concepto)} <span class="where">${esc(r.unidad)}</span></td>${r.valores.map(v => `<td class="num">${sup(v)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Servicio (costo mensual)</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.costos.map(r => `<tr><td>${esc(r.concepto)}</td>${f3(r.valores)}</tr>`).join('')}
            <tr><td><b>Total mensual</b></td>${K.total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td>Primer pago (mes 1, con dominio anual)</td>${f3(K.primer_pago_pen)}</tr>
            ${K.chat_pen ? `<tr><td>De ese total: chat interno y buzón de mensajes</td>${f3(K.chat_pen)}</tr>` : ''}
            <tr><td>${esc(K.ingreso_etiqueta)}</td>${f3(K.ingreso_pen)}</tr>
            <tr><td>Costo de nube / ingreso estimado</td>${K.pct_ingreso.map(v => `<td class="num">${(v * 100).toLocaleString('es-PE', { maximumFractionDigits: 1 })} %</td>`).join('')}</tr>
          </tbody>
        </table></div>
        <ul class="strength">${K.notas.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
      </div>`;
    })() : ''}
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
