<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-olivera-trujillo-sanchez-cari", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "ArreglaYa: servicios técnicos para el hogar y pequeños negocios en Arequipa", "grupo": "Grupo (sin número)", "seccion": "No indicada", "fecha": "04/11/2026 (3.ª versión) · formulario AA2 revisado el 06/11/2026", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Olivera Ramirez, Eduardo Antonio", "Cari Sanchez, Aydan Reynaldo", "Sanchez Ccama, Yamile Xiomara", "Trujillo Huamani, Susan Lizbeth"], "dictamen": "menor", "resumen": "Esta tercera versión mejora de forma clara y se acerca a lo que pide la AA1. El capítulo 1 fue reescrito: ahora tiene secciones propias de ODS (1.2) y megatendencias (1.3), enunciado del problema y objetivo general, y cifras de Arequipa con sus límites bien explicados (pp. 3-8). El capítulo 2 tiene una ficha técnica del servicio con nueve campos, un modelo de ingresos coherente (el cliente paga a ArreglaYa, que retiene el pago y descuenta la comisión) y un tratamiento claro de los límites del servicio, la selección de técnicos y la garantía (pp. 8-15). El capítulo 3 sumó como competidores a las plataformas digitales, las tiendas de mejoramiento del hogar y los seguros, con fortalezas, desventajas y un cuadro comparativo (pp. 35-39). Además, ya no hay consignas copiadas, hay índice y la carátula incluye carreras y participación. Persisten: el problema del cliente y el social siguen sin separarse, las megatendencias de tecnología y demografía no tienen fuente y los ODS no citan metas. Retrocedieron dos apartados: desaparecieron los indicadores de gestión y el análisis del entorno que sí estaban en la versión anterior. En el formato, el apellido del docente sigue mal escrito («ANC0RI», con cero), los anexos 2 y 3 son imágenes sin figura numerada ni fuente, y el índice tiene páginas desfasadas.", "fortalezas": ["El capítulo 1 se reescribió con estructura propia: 1.1 con enunciado del problema y objetivo general (pp. 5-6), 1.2 con los ODS 8, 11 y 10 y una cifra por cada uno (p. 6) y 1.3 con tres megatendencias vinculadas a los ODS (pp. 7-8). Retiraron el documento de PwC sobre defensa que sustentaba las megatendencias en la versión anterior.", "Sustentan el problema con cifras de Arequipa y reconocen sus límites con honestidad: el indicador de vivienda «incluye también servicios básicos y título de propiedad, no solo reparaciones» (p. 3), TECSUP es «un solo instituto» con datos «solo hasta 2022» (p. 4) y la encuesta de empleo «solo cubre empresas formales de 20 trabajadores a más» (p. 5). Incorporan fuentes institucionales: INEI, IEES-SNI, CPI Research, CENEPRED y TECSUP.", "El modelo de ingresos quedó coherente: el cliente paga por Yape o Plin a ArreglaYa, que retiene el pago hasta terminar el trabajo, emite el comprobante, descuenta la comisión y transfiere el resto al técnico, con tres controles contra el subregistro de precios (p. 12). Esto resuelve la contradicción de la versión anterior con los «precios claros». La garantía (primero el técnico, luego un fondo con parte de la comisión) y los descuentos (financiados por la comisión, sin bajar el pago del técnico) también están definidos (p. 11).", "El capítulo 2 delimita el alcance del servicio (en electricidad solo focos, luminarias, interruptores y tomacorrientes; sin tableros ni inspecciones certificadas, p. 10), describe una selección de técnicos en cuatro pasos (p. 10) y reconoce que el régimen legal con los técnicos se definirá con asesoría contable y legal (pp. 10-11). La ficha técnica del servicio ya tiene nueve campos, con el proceso de atención en siete pasos (pp. 13-15).", "El análisis de competidores mejoró mucho: incluye maestros y directorios (OLX, arequipa.app, gasfitero.app), Sodimac y Promart con precios y condiciones concretas, plataformas digitales (Champi, Home Solution, GoChamba) y asistencias de seguros (Pacífico, Rímac), cada uno con fortalezas, desventajas y «ajuste aplicado en ArreglaYa», más un cuadro comparativo (pp. 36-39). Reconocen que Sodimac es el competidor más cercano (p. 37) y declaran la fecha de consulta (2 de noviembre de 2026).", "El BMC incluye dos relaciones económicas con ejemplo de cálculo (ingreso por servicio = precio × comisión; punto de equilibrio = costos fijos ÷ ingreso por servicio) y aclara que los valores son ilustrativos y se definirán con cotizaciones y el piloto (p. 35). En la presentación, ya no hay consignas copiadas, hay índice, la carátula tiene carreras y participación, y todas las referencias se citan en el texto y están en orden alfabético."], "prioridades": ["Restituir los indicadores de gestión (KPI con fórmula, meta y ejemplo de cálculo) y el análisis del entorno interno y externo, que estaban en la versión anterior y desaparecieron. Las dos fórmulas del BMC (p. 35) pueden ser el punto de partida.", "Reorganizar el capítulo 1 en problema del cliente y problema social, cada uno con causas y consecuencias, y rotular como hipótesis la afirmación de que los técnicos informales trabajan «sin precios claros, sin garantía y sin comprobante de pago» (p. 3), que no tiene fuente. La validación con clientes reales se exigirá en el capítulo 5 (AA2).", "Sustentar las megatendencias de tecnología y cambio demográfico con CEPLAN u otra fuente (hoy solo la urbanización tiene cita, y es una nota de La República, p. 7) y citar las metas de los ODS 8, 10 y 11 con la ONU.", "Corregir la carátula: el apellido del docente figura como «ANC0RI» (con cero) y faltan la sección y el número de grupo.", "Numerar y titular las tablas y figuras con su fuente («Tabla 1. …», «Nota. Elaboración propia»), incluidas las fichas, el cuadro comparativo y los anexos 2 y 3. Declarar el uso de herramientas de IA si las imágenes de los anexos se generaron con ellas y actualizar el índice, cuyas páginas están desfasadas desde 2.2.1 hasta 3.3."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actuales y confiables, analizadas críticamente para mostrar su aporte al proyecto en relación con megatendencias y ODS.", "falta": "Mejoraron: el capítulo 1 ya no depende de PwC y usa INEI, IEES-SNI, CPI, CENEPRED y TECSUP, con críticas explícitas a sus propios datos. Para llegar a 4 falta pasar las cifras que hoy vienen de prensa (Diario Correo, El Búho, Rumbo Minero, Expreso, Infomercado, La República) a su fuente primaria, sustentar con fuente las megatendencias de tecnología y demografía, citar metas ODS con la ONU y analizar cómo cada fuente aporta al proyecto."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cuantitativa y cualitativa (en la AA1 se aceptan hipótesis rotuladas como tales), y vinculada explícitamente con megatendencias, ODS y necesidades del cliente.", "falta": "Mantiene cifras cuantitativas y vínculo con tres ODS y tres megatendencias, ahora ordenados en secciones. Para llegar a 4 falta separar el problema del cliente y el social con causas y consecuencias, y detallar con más profundidad su vínculo con las necesidades del cliente."}, {"criterio": "Propuesta de valor", "exige": "Una propuesta innovadora y diferenciada, con descripción, ficha técnica, solución, segmentos y casos de uso coherentes con el problema.", "falta": "La ficha del servicio, la segmentación y el diferencial (cobro y garantía de la empresa, recorridos en movilidad) son sólidos y coherentes con el problema. El precio es referencial en la AA1. Falta completar los campos de la ficha oficial que no figuran (presentación, sostenibilidad, redes sociales) y casos de uso centrados en el cliente."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia de los 9 bloques con la propuesta de valor, junto con el análisis de competidores y los indicadores.", "falta": "Hay mapa de empatía con seis cuadrantes, BMC con nueve bloques y competidores muy mejorados. Para llegar a 4 falta argumentar la coherencia entre bloques, recuperar los indicadores con fórmula y el análisis del entorno, y presentar el mapa y el BMC como figuras con título y fuente."}], "viabilidad": {"resumen": "El modelo es más sólido que en la versión anterior: resolvieron quién cobra, cómo se calcula la comisión y cómo se financian la garantía y los descuentos, e incluyeron las alternativas digitales en el análisis. Los riesgos que quedan son más de fondo: que el cliente se salte la plataforma, la relación legal con los técnicos y la dependencia de una movilidad como recurso central.", "riesgos": [{"tema": "Rentabilidad", "titulo": "La comisión podría no cubrir la movilidad y el personal", "choque": "El ejemplo del BMC (S/ 100 de precio, 20 % de comisión, S/ 6 000 de costos fijos y 300 servicios al mes, p. 35) es ilustrativo, pero deja ver el reto: 300 servicios al mes son unos 12 por día hábil, con una movilidad que además capta clientes y debe cubrir tres distritos. La estructura de costos incluye movilidad, combustible, personal administrativo, capacitaciones, seguro de accidentes y fondo de garantía (p. 35), y el descuento por varios servicios también sale de la comisión (p. 11).", "ideas": ["Cotizar movilidad, combustible, herramientas y personal administrativo para Arequipa y reemplazar los S/ 6 000 por un costo fijo real.", "Estimar cuántos servicios por día puede atender una movilidad con dos técnicos, considerando los traslados entre Cayma, Paucarpata y Cerro Colorado.", "Probar en el piloto qué precio promedio y qué comisión aceptan clientes y técnicos."]}, {"tema": "Competencia", "titulo": "Los directorios gratuitos y la contratación directa pueden desplazar a la plataforma", "choque": "Ya incluyeron a Champi, Home Solution y GoChamba, y reconocen que Champi es gratuito, sin comisiones y con contacto directo por WhatsApp (p. 37). El riesgo es que, una vez atendido, el cliente llame directamente al técnico y la comisión desaparezca. Describen controles de precio (p. 12), pero no explican cómo evitarán esa desintermediación en la segunda visita.", "ideas": ["Definir qué ofrece ArreglaYa que el cliente no consigue llamando al técnico: garantía empresarial, reemplazo si el técnico no llega, comprobante, descuento por varios servicios.", "Incluir en el acuerdo con los técnicos una cláusula de no captación directa de los clientes de la plataforma.", "Medir en el piloto cuántos clientes repiten con ArreglaYa y cuántos pasan al técnico directo."]}, {"tema": "Regulación", "titulo": "Relación con los técnicos, comprobantes y responsabilidad", "choque": "La versión anterior mezclaba independientes y «personal técnico»; esta aclara que los técnicos son prestadores de servicios independientes (p. 10), pero habla de técnicos «acompañados o supervisados» por el administrador (p. 10), de «un equipo de técnicos registrados» a quienes ArreglaYa «asigna los trabajos» como «una empresa contratista» (p. 17), y pone movilidad, herramientas y capacitaciones. Con esas condiciones, SUNAFIL podría ver una relación laboral. Además, ArreglaYa cobra, emite el comprobante y responde por la garantía ante el cliente, por lo que el régimen tributario y el seguro no pueden dejarse para después.", "ideas": ["Consultar con un contador y un abogado qué régimen usarán (locación de servicios con RUC, planilla o convenio de prácticas con institutos) y reflejarlo en el modelo.", "Precisar quién emite el comprobante al cliente y cómo se documenta el pago al técnico.", "Estimar el costo del seguro de accidentes y del fondo de garantía con datos reales."]}, {"tema": "Alcance del servicio", "titulo": "El alcance eléctrico es más estrecho que el problema que justifica el proyecto", "choque": "El capítulo 1 se apoya en que «al menos 7 de cada 10 incendios en Arequipa tienen causa eléctrica» (pp. 3, 6) y el ODS 11 se justifica con ese dato, pero el servicio no hace instalaciones nuevas, trabajos en tableros ni inspecciones certificadas (p. 10). Las tareas que sí hace (focos, luminarias, interruptores y tomacorrientes) no son las que más reducen ese riesgo, así que el vínculo entre problema y solución es más débil de lo que presentan.", "ideas": ["Ajustar el planteamiento: el problema central es la desconfianza y la informalidad en reparaciones menores, y el riesgo eléctrico un argumento secundario; o bien ampliar el alcance con técnicos certificados.", "Explicar cómo se deriva al cliente a un especialista certificado y si ArreglaYa recibe algo por esa derivación."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula", "estado": "incompleto", "nota": "Mejoró: incluye carrera y porcentaje de participación (p. 1), pero escribe «ANC0RI» (con cero) y no indica sección ni número de grupo («Grupo: 4 INTEGRANTES»)."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Ahora existe (p. 2) y refleja la numeración. Las páginas están desfasadas desde 2.2.1 (indica p. 14, aparece en la p. 13) hasta 3.3 (indica p. 36, aparece en la p. 35)."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "incompleto", "nota": "El texto (pp. 3-6) es un relato continuo que no separa problema del cliente y problema social. Sí tiene enunciado del problema y objetivo general (pp. 5-6)."}, {"codigo": "1.2–1.3", "apartado": "Problema social (ODS y megatendencias)", "estado": "incompleto", "nota": "Hay ODS 8, 11 y 10 con una cifra cada uno (p. 6) y tres megatendencias (pp. 7-8), pero solo la urbanización tiene fuente y los ODS no citan metas."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Describe el servicio, la plataforma por etapas, la movilidad, el alcance, la verificación de técnicos, la garantía y la comparación con maestros, tiendas y contratistas (pp. 8-13)."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "incompleto", "nota": "Dos fichas, con nueve y diez campos (pp. 13-20). Faltan varios campos oficiales (el precio es referencial en la AA1) (presentación, sostenibilidad, redes sociales). Las tablas no tienen número, título ni fuente."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Seis beneficios concretos (pp. 20-21)."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "Conecta con el capítulo 1 y desarrolla la captación en movilidad y la comunicación por etapas (pp. 21-23), aunque repite contenido de 2.1."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Cinco segmentaciones con distritos, NSE, MYPE y estilos de vida de Arellano, con limitaciones declaradas (pp. 23-29)."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Seis casos con resumen en el anexo 1 (pp. 29-31, 45-47). Dos de ellos (2.6.3 y 2.6.5) son procesos internos y no situaciones del cliente."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Seis cuadrantes en tabla (pp. 31-32), coherentes con el problema. Se repite como imagen en el anexo 2, sin título de figura ni fuente."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Nueve bloques explicados (pp. 32-35) y lienzo en el anexo 3. Falta argumentar la coherencia entre bloques."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Cuatro tipos de competidor con fortalezas, desventajas y ajuste de ArreglaYa, y cuadro comparativo (pp. 35-39). El cuadro no tiene número, título ni fuente."}, {"codigo": "3.x", "apartado": "Indicadores de gestión", "estado": "ausente", "nota": "Estaban en la versión anterior (sin fórmula) y desaparecieron. Solo quedan dos relaciones económicas en el BMC (p. 35). Tampoco está el análisis del entorno interno y externo."}, {"codigo": "—", "apartado": "Referencias APA 7", "estado": "incompleto", "nota": "Orden alfabético, sangría y todas las referencias se citan (pp. 40-44). Predominan notas de prensa y webs comerciales; faltan fuentes primarias para varias cifras, y CEPLAN y ONU."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "El capítulo se reescribió y mejoró: tiene secciones de ODS y megatendencias, enunciado, objetivo y cifras de Arequipa con sus límites explicados. Falta separar el problema del cliente y el social y respaldar con fuente las megatendencias y las metas de los ODS.", "observaciones": [{"severidad": "importante", "titulo": "Problema del cliente y problema social siguen mezclados, sin causas y consecuencias ordenadas", "ubicacion": "«1.1 Planteamiento del problema», pp. 3-6", "cita": "Falta un servicio que conecte estos elementos y ofrezca a los hogares técnicos capacitados, con precios claros y garantía", "problema": "El capítulo se reescribió y es más claro, pero sigue siendo un relato continuo que combina informalidad, vivienda, riesgo eléctrico, empleo juvenil, talento técnico y capacidad de pago (pp. 3-5). No hay un apartado para el problema del cliente y otro para el problema social, cada uno con causas y consecuencias. La síntesis (p. 5) todavía define el problema como la falta de la propia solución, aunque el enunciado de la misma página («¿Cómo pueden los hogares y pequeños negocios de Arequipa acceder a servicios técnicos confiables...?») está mejor planteado.", "mejora": "Dividir 1.1 en «Problema del cliente» y «Problema social». En cada uno, formular el problema sin mencionar la solución y desarrollar causas y consecuencias, por ejemplo en un árbol de problemas presentado como figura numerada. Ubicar las cifras que ya tienen en el apartado que corresponda."}, {"severidad": "sugerencia", "titulo": "Las cifras son todas secundarias; la validación real se exigirá en el capítulo 5", "ubicacion": "pp. 3-5", "cita": "Esto significa que muchos maestros y técnicos trabajan sin precios claros, sin garantía y sin comprobante de pago.", "problema": "Todas las cifras del capítulo son de fuentes secundarias, y la afirmación de que los técnicos informales trabajan «sin precios claros, sin garantía y sin comprobante de pago» (p. 3) es una inferencia sin fuente. Para la AA1 es aceptable plantear estas ideas como hipótesis, siempre que se rotulen como tales.", "mejora": "Rotular esa afirmación como hipótesis del equipo (o respaldarla con una fuente). La validación con clientes reales (entrevistas o encuesta) se exigirá en el capítulo 5 de la AA2."}, {"severidad": "importante", "titulo": "Los ODS no citan metas ni fuente de la ONU", "ubicacion": "«1.2 ODS relacionados», p. 6", "cita": "ODS 8: Trabajo decente y crecimiento económico. ArreglaYa formaliza un servicio que hoy es mayormente informal.", "problema": "Cada ODS está vinculado con cifras del capítulo, lo que es un avance. Pero no se menciona la meta concreta (por ejemplo, la 8.3 sobre formalización de pequeñas empresas o la 11.1 sobre vivienda adecuada), no se cita la ONU y no se relaciona el proyecto con las líneas de investigación de CERTUS. El ODS 11 se sustenta en el riesgo eléctrico, pero el servicio no hace instalaciones nuevas ni inspecciones (p. 10), así que el aporte es menor de lo que se afirma.", "mejora": "Citar la meta específica de cada ODS con la fuente de la ONU o CEPAL, explicar en una oración cómo contribuye el proyecto a esa meta e indicar la línea de investigación CERTUS a la que responde. Moderar el alcance del ODS 11 a lo que el servicio sí cubre."}, {"severidad": "importante", "titulo": "Solo una de las tres megatendencias tiene fuente", "ubicacion": "«1.3 Megatendencias relacionadas», pp. 7-8", "cita": "Según el Centro Nacional de Planeamiento Estratégico (CEPLAN), para 2050 unos 35 millones de peruanos vivirían en zonas urbanas... (La República, 2023).", "problema": "Mejoró: ya no usan el documento de PwC sobre defensa. Pero la urbanización se sustenta con una nota de La República que cita a CEPLAN, y «Auge de la tecnología» y «Cambio demográfico» se describen solo en función del proyecto, sin cifra ni fuente. Así no se demuestra que sean megatendencias, solo se declara.", "mejora": "Citar directamente a CEPLAN (tendencias globales o Perú 2050) para urbanización y cambio demográfico, y una fuente de INEI u OSIPTEL para el uso de WhatsApp y pagos digitales en Arequipa. Para cada megatendencia, agregar una cifra y su consecuencia para el negocio."}, {"severidad": "sugerencia", "titulo": "Varias cifras clave provienen de prensa y no de su fuente primaria", "ubicacion": "pp. 3-5, 7", "cita": "(Diario Correo, 2024); (Diario Correo, 2026); (Infomercado, 2026); (Rumbo Minero, 2026); (El Búho, 2025)", "problema": "El capítulo combina fuentes institucionales sólidas (IEES-SNI, INEI, TECSUP) con notas periodísticas para datos centrales: el 70 % de incendios con causa eléctrica y la responsabilidad del usuario desde el medidor, el 84,8 % de jóvenes informales y el 57,4 % de viviendas adecuadas. Una nota de prensa sirve para ubicar el dato, no para sustentarlo.", "mejora": "Buscar la fuente primaria de cada cifra (Cuerpo General de Bomberos, ENAHO del INEI, MTPE) y dejar la nota solo como apoyo. Si no se encuentra, declarar la limitación en el texto, como ya hicieron en otros casos."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "El capítulo mejoró de forma importante: ficha técnica del servicio, modelo de cobro coherente, selección de técnicos, límites del servicio y segmentación sólida. Falta que los casos de uso muestren al cliente y unificar la relación con los técnicos.", "observaciones": [{"severidad": "sugerencia", "titulo": "La ficha técnica no incluye varios campos oficiales y las tablas no están numeradas", "ubicacion": "«2.2 Fichas técnicas», pp. 13-20", "cita": "7. Condiciones del servicio: Precio según el tarifario referencial por tipo de servicio; comprobante de pago por cada servicio; garantía empresarial cuyo plazo y condiciones se informan antes de contratar", "problema": "Mejoró mucho: la ficha del servicio tiene nueve campos y un proceso en siete pasos, y la de la aplicación quedó separada. Faltan presentación (uniforme, identificación), sostenibilidad (residuos, pinturas) e integración con redes sociales como campos de la ficha. Las tablas no llevan número, título ni fuente. El precio se mantiene como referencial en esta evidencia.", "mejora": "Completar presentación y sostenibilidad en una línea cada una, numerar las tablas («Tabla 1. Ficha técnica del servicio») y agregar la fuente."}, {"severidad": "importante", "titulo": "Dos de los seis casos de uso son procesos internos y no situaciones del cliente", "ubicacion": "«2.6 Ejemplos de casos de uso», pp. 29-31; anexo 1, pp. 45-47", "cita": "2.6.3 Organización y asignación de recorridos y actividades diarias. El administrador ingresa a la plataforma para organizar y programar las actividades de los técnicos", "problema": "Los casos 2.6.3 y 2.6.5 describen el trabajo del administrador y de los técnicos, no una situación vivida por el cliente. Además, los otros casos son descripciones genéricas («un propietario», «una familia»). Un caso de uso debe mostrar una situación real con lugar, problema, qué hace ArreglaYa y resultado.", "mejora": "Reemplazar 2.6.3 y 2.6.5 por escenarios del cliente, por ejemplo: «una familia de Cayma con una fuga y una luminaria malograda paga por Yape y recibe comprobante» o «una peluquería de Paucarpata cambia luminarias antes de abrir», con tiempos y montos estimados."}, {"severidad": "sugerencia", "titulo": "La relación con los técnicos todavía tiene dos versiones", "ubicacion": "pp. 10, 17", "cita": "La plataforma funciona como la de una empresa contratista: ArreglaYa mantiene un equipo de técnicos registrados y les asigna los trabajos según su especialidad y disponibilidad.", "problema": "En 2.1 los técnicos son «prestadores de servicios independientes» que «confirman libremente» (p. 10), pero la ficha de la aplicación dice que ArreglaYa «les asigna los trabajos» y que el administrador «acepta o rechaza a cada técnico» (pp. 17-18). Es un riesgo de coherencia y de regulación.", "mejora": "Elegir una sola descripción (marketplace con técnicos independientes que aceptan trabajos, o empresa con equipo propio) y usarla igual en 2.1, la ficha, el BMC y el cuadro de competidores."}, {"severidad": "sugerencia", "titulo": "La sección 2.4 repite contenido de 2.1 y de las fichas", "ubicacion": "«2.4 Solución a problemas o necesidades específicas», pp. 21-23", "cita": "En conjunto, ArreglaYa responde a la necesidad de acceder a servicios técnicos confiables mediante dos canales complementarios", "problema": "Los recorridos en movilidad, el registro de técnicos, las capacitaciones y las calificaciones por etapas se explican de nuevo en 2.1, en las fichas, en 2.5.5, en 2.6 y en el BMC. Esto alarga el capítulo sin aportar información nueva. Además, la captación en movilidad es un canal y no un valor para el cliente, y 2.4 le dedica casi dos páginas.", "mejora": "Dejar cada tema en un solo lugar y usar remisiones («ver 2.1»). En 2.4 relacionar cada elemento de la propuesta con una causa o consecuencia concreta del capítulo 1."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "Es el capítulo que más avanzó en competidores (cuatro tipos, con fortalezas, desventajas y cuadro comparativo) y mantiene mapa de empatía y BMC. Pierde los indicadores y el entorno, y no argumenta la coherencia entre bloques.", "observaciones": [{"severidad": "importante", "titulo": "Desaparecieron los indicadores de gestión y el análisis del entorno", "ubicacion": "«Capítulo 3», índice (p. 2) y pp. 31-39", "cita": "Supuestos económicos referenciales (a validar en el piloto). Ingreso por servicio = precio promedio del servicio × porcentaje de comisión.", "problema": "La versión anterior tenía seis indicadores (sin fórmula) y un análisis del entorno interno y externo; esta no tiene ninguno de los dos. Solo quedan las dos relaciones económicas del BMC (p. 35), que no son indicadores de gestión. Los lineamientos de la AA1 piden analizar el entorno, y la estructura del capítulo pide indicadores con fórmula y ejemplo de cálculo.", "mejora": "Agregar una tabla de 6 a 8 indicadores (servicios por semana, ticket promedio, comisión por servicio, calificación promedio, tasa de repetición, cumplimiento de garantía, costo por cliente captado) con fórmula, meta y ejemplo de cálculo, y un breve análisis de entorno interno y externo."}, {"severidad": "importante", "titulo": "El BMC está completo, pero no argumenta la coherencia entre bloques", "ubicacion": "«3.2 Business Model Canvas», pp. 32-35; anexo 3, p. 49", "cita": "5. Fuentes de ingresos. ArreglaYa obtiene sus ingresos mediante el cobro de una comisión por cada servicio concretado.", "problema": "Los nueve bloques están explicados y el modelo de ingresos ya es coherente. Pero cada bloque se describe por separado: no se muestra cómo los recorridos (bloque 3) llegan a los segmentos del bloque 1 ni cómo la comisión se conecta con la estructura de costos (bloque 9). Los valores del ejemplo (S/ 100, 20 %) son referenciales y se aceptan en esta evidencia.", "mejora": "Añadir un párrafo que conecte los bloques (segmento, propuesta, canal, ingreso, costo), sin necesidad de cifras definitivas: la tabla de costos y la proyección se desarrollan en el capítulo 6 (AA2)."}, {"severidad": "sugerencia", "titulo": "Las figuras de los anexos 2 y 3 no siguen el formato APA 7 (número de figura y fuente)", "ubicacion": "Anexos 2 y 3, pp. 48-49", "cita": "Anexo 2 Mapa de empatia", "problema": "Los anexos sí están rotulados («Anexo 2 Mapa de empatia» y «Anexo 3. Business Model Canvas (BMC) de ArreglaYa»), pero el rótulo del Anexo 2 no sigue el formato del Anexo 3 (falta el punto después del número y la tilde en «empatía») y ninguna imagen lleva «Figura N.», título descriptivo ni nota de fuente. Además, repiten el contenido de las tablas de 3.1 y 3.2.", "mejora": "Unificar los rótulos («Anexo 2. Mapa de empatía de ArreglaYa»), añadir bajo cada imagen «Figura N. …» con la nota «Elaboración propia» y citar las figuras en el texto del capítulo 3."}, {"severidad": "sugerencia", "titulo": "Los competidores se pueden completar con algunos datos", "ubicacion": "«3.3 Comparación con modelos de negocio existentes», pp. 35-39", "cita": "Promart ... Precio antes de empezar: No verificado", "problema": "Es el apartado más sólido del capítulo. Quedan detalles: el cuadro comparativo no tiene número ni fuente, Promart figura como «No verificado» en precio, no se dimensiona la cobertura de Champi o GoChamba en Arequipa (cuántos técnicos hay) y la afirmación «No se identificó una empresa formal... que combine recorridos en movilidad, captación directa y plataforma» (p. 36) es una hipótesis que conviene respaldar con una búsqueda documentada.", "mejora": "Numerar el cuadro («Tabla 3…»), buscar el precio de Promart o retirarlo, y comprobar cuántos técnicos de Arequipa publican en cada directorio para dimensionar al competidor."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "La presentación mejoró (índice, carátula con carreras, sin consignas, referencias ordenadas). Quedan el apellido del docente mal escrito, tablas y figuras sin título ni fuente, y un estilo con rasgos de texto generado.", "observaciones": [{"severidad": "importante", "titulo": "Carátula con el apellido del docente mal escrito y sin sección ni grupo", "ubicacion": "Carátula, p. 1", "cita": "Docente: ... ANC0RI ... Grupo: 4 INTEGRANTES", "problema": "El apellido del docente figura como «ANC0RI» (con cero) y no se indican la sección ni el número de grupo («Grupo: 4 INTEGRANTES»).", "mejora": "Corregir el apellido e indicar la sección y el número de grupo."}, {"severidad": "importante", "titulo": "Tablas y figuras sin número, título ni fuente", "ubicacion": "pp. 13-20, 31-32, 38-39, 45-49", "cita": "Campo Descripción 1. Nombre Servicio técnico a domicilio ArreglaYa.", "problema": "Las fichas técnicas, el mapa de empatía, el cuadro comparativo y los anexos son tablas o imágenes sin «Tabla N.», «Figura N.» ni nota de fuente. En un trabajo académico APA 7, todas deben tener título y fuente, aunque sea «Elaboración propia».", "mejora": "Numerar y titular cada tabla y figura según APA 7 y citarlas en el texto («como muestra la Tabla 2»)."}, {"severidad": "sugerencia", "titulo": "Índice con páginas desfasadas", "ubicacion": "Índice, p. 2", "cita": "2.2.1 Ficha técnica del servicio ... 14", "problema": "El índice ya existe, lo que mejora la versión anterior. Desde 2.2.1 las páginas están corridas en una (2.2.1 aparece en la p. 13, 2.3 en la 20, 3.1 en la 31 y 3.3 en la 35).", "mejora": "Generar el índice automáticamente desde los estilos de título después de la última edición."}, {"severidad": "sugerencia", "titulo": "Estilo con rasgos de texto generado", "ubicacion": "Todo el informe, en particular pp. 21-23, 36-39 y anexos", "cita": "Ajuste aplicado en ArreglaYa ... Así, ArreglaYa no depende exclusivamente de las solicitudes recibidas por medios digitales", "problema": "La redacción ahora es más uniforme que en la versión anterior (ya no hay dos registros tan distintos). Aun así conserva rasgos frecuentes de texto generado: un molde repetido en cada competidor («Modelo de negocio. Fortalezas. Desventajas para el cliente. Ajuste aplicado...»), explicaciones redundantes entre 2.1, 2.4 y las fichas, y matices defensivos repetidos («Estos valores no son datos del mercado», «se validará durante el piloto»).", "mejora": "Redactar con voz propia y con ejemplos concretos del proyecto, y declarar el uso de herramientas de IA si lo hubo. La sustentación permitirá comprobar que el equipo domina el contenido."}, {"severidad": "sugerencia", "titulo": "Bibliografía: predominan notas de prensa y webs comerciales", "ubicacion": "«Bibliografía», pp. 40-44", "cita": "Diario Correo. (2024, 23 de noviembre). Arequipa: El 70% de incendios son originados por riesgos eléctricos.", "problema": "Mejoró: orden alfabético, sangría francesa y todas las referencias se citan en el texto. Pero la mayoría son notas de prensa (Diario Correo, El Búho, Expreso, La República, Rumbo Minero, Perú Retail, Infomercado) y sitios comerciales. Detalles: «arequipa.app» y «gasfitero.app» aparecen en minúscula en el texto frente a la lista, y algunas URL se cortaron con espacios («POBLA CI%C3%93N», «p or-riesgos»).", "mejora": "Verificar que cada enlace funcione, homogeneizar el autor entre texto y lista y reemplazar la prensa por fuentes primarias cuando existan."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Encuesta de validación: retroalimentación de avance AA2", "resumen": "Avance AA2 (06/11/2026): retroalimentación formativa, sin calificación, elaborada sobre el formulario en línea «Encuesta de validación: servicios técnicos a domicilio (Arregla Ya)» y el apartado 4.1 del informe. Un punto fuerte es que el grupo definió hipótesis (H1 a H5) y criterios de éxito antes de encuestar, lo que es la base de una validación seria. Para que el formulario pruebe de verdad esas hipótesis conviene corregir antes de aplicarlo: describe una plataforma que conecta con técnicos, distinta del servicio que plantea el informe (administrador, técnicos propios, WhatsApp y recorridos); no presenta ningún precio, por lo que H3 no puede medirse; y varias preguntas no coinciden con el periodo o los atributos de los criterios de éxito.", "observaciones": [{"severidad": "importante", "titulo": "El formulario describe un servicio distinto al modelo de negocio del informe", "ubicacion": "Preguntas 10 y 11 del formulario; apartado 2.6 (casos de uso) y Cap. III", "cita": "«…una aplicación o plataforma que le conecte con técnicos verificados…» / «…consultar las valoraciones del técnico»", "problema": "Según los casos de uso del informe, ArreglaYa recibe la solicitud por WhatsApp en la primera etapa, un administrador comunica el presupuesto, asigna al técnico y coordina la visita, y capta clientes mediante recorridos en movilidad. Las preguntas 10 y 11, en cambio, describen un marketplace que conecta al cliente con técnicos y muestra valoraciones. Si el encuestado responde sobre una aplicación, la validación no demuestra la aceptación del servicio que el grupo realmente ofrecerá.", "mejora": "Redactar la descripción del servicio tal como se prestará (solicitud por WhatsApp, presupuesto previo, técnico asignado, garantía y comprobante) y preguntar por la aceptación de ese servicio. Si la plataforma es la segunda etapa, plantearla como pregunta aparte."}, {"severidad": "importante", "titulo": "H3 no puede medirse: el formulario nunca presenta un precio", "ubicacion": "Preguntas 9 y 11; hipótesis H3 del apartado 4.1", "cita": "«Al menos el 50 % manifiesta estar dispuesto o muy dispuesto a contratar el servicio con el precio presentado en la encuesta»", "problema": "El criterio de éxito habla de un precio presentado en la encuesta, pero ninguna pregunta muestra el precio de un servicio ni de una visita técnica. La pregunta 9 solo registra cuánto gasta el cliente hoy, y la 11 pregunta por un monto adicional por usar una plataforma, que es otra cosa. Con estos datos no hay forma de decir si se cumplió o no H3.", "mejora": "Presentar al menos un precio referencial por tipo de servicio (o por visita y diagnóstico) y preguntar si lo contrataría con ese precio, con alternativas de aceptación. Usar la pregunta 9 como referencia del ticket actual y comparar."}, {"severidad": "importante", "titulo": "Los criterios de H1 y H2 no coinciden con las preguntas", "ubicacion": "Pregunta 3 y pregunta 7; hipótesis H1 y H2 del apartado 4.1", "cita": "«…haber necesitado un servicio técnico durante el último semestre» / «…verificación del técnico, la garantía y el comprobante de pago»", "problema": "H1 se mide en el último semestre, pero la pregunta 3 abarca los últimos 12 meses. H2 exige importancia de la verificación del técnico, la garantía y el comprobante de pago, y la pregunta 7 evalúa «confianza y seguridad», precios claros, garantía por escrito, rapidez y soluciones múltiples, sin el comprobante de pago. Al aplicar los criterios tal como están escritos, los datos no corresponden.", "mejora": "Hacer coincidir periodo y atributos: o se ajusta el criterio al formulario, o el formulario al criterio. Dejar escrito en el informe qué preguntas y qué opciones suman para cada criterio de éxito."}, {"severidad": "importante", "titulo": "H5 mide utilidad, no preferencia ni descuentos", "ubicacion": "Pregunta 5 y pregunta 7; hipótesis H5 del apartado 4.1", "cita": "«Al menos el 60 % muestra preferencia por contratar varios servicios en una sola visita» y acceder a descuentos", "problema": "La pregunta 5 pregunta qué tan útil sería, lo que no equivale a preferir contratar varios servicios. El informe también supone que el cliente accede a descuentos por varios servicios, pero el formulario no consulta si eso le interesa ni qué descuento esperaría.", "mejora": "Preguntar de forma directa si contrataría dos o más servicios en una misma visita y qué descuento o beneficio esperaría, para sustentar la propuesta de visita integral y el precio del paquete."}, {"severidad": "importante", "titulo": "El capítulo de validación aún no describe muestra, método ni análisis", "ubicacion": "Apartado 4.1 y siguientes", "cita": "«CAPÍTULO IIII VALIDACIÓN»", "problema": "El capítulo presenta hipótesis y criterios de éxito, pero no indica cuántas encuestas se aplicarán, a quién ni cómo se las seleccionará, ni cómo se analizarán los resultados. Los distritos del formulario (solo Cayma, Paucarpata y Cerro Colorado, con una opción en blanco) tampoco se justifican frente al ámbito del negocio.", "mejora": "Agregar la muestra y su justificación (cantidad y cuotas por tipo de cliente y distrito), el método de muestreo, el periodo de aplicación y cómo se calcularán los porcentajes de cada criterio de éxito."}, {"severidad": "importante", "titulo": "Las preguntas 10 y 11 combinan varios atributos en una sola", "ubicacion": "Preguntas 10 y 11", "cita": "«…técnicos verificados, con precios transparentes y garantía en el servicio»", "problema": "Cada pregunta junta tres o más atributos en una sola frase. Si la persona responde «totalmente dispuesto», no se sabe cuál de ellos pesó, y no se puede decidir qué conservar en el MVP si hubiese que priorizar.", "mejora": "Separar los atributos en preguntas distintas o usar una pregunta de priorización (por ejemplo, ordenar de mayor a menor importancia), y dejar una pregunta de intención general más corta."}, {"severidad": "sugerencia", "titulo": "Opciones solapadas y respuestas faltantes en las preguntas 2 y de búsqueda de técnico", "ubicacion": "Pregunta 2 y pregunta sin numerar sobre cómo busca al técnico", "cita": "«Hogar / Vivienda particular / Pequeño negocio / Comercio»; «¿Cómo busca actualmente a un técnico…?»", "problema": "«Hogar» y «Vivienda particular» significan casi lo mismo, igual que «Pequeño negocio» y «Comercio». La pregunta de búsqueda es de opción única, aunque una persona usa varios medios, y no incluye las plataformas ni las tiendas que el informe analiza como competencia (por ejemplo Champi, GoChamba, Sodimac o Promart) ni la opción «Otro».", "mejora": "Unificar las categorías de cliente (por ejemplo, hogar, pequeño negocio y otro), convertir la pregunta de búsqueda en selección múltiple e incluir las plataformas y tiendas que compiten con ArreglaYa y «Otro»."}, {"severidad": "sugerencia", "titulo": "Falta salto para quienes no necesitaron servicios y preguntas sobre el canal", "ubicacion": "Preguntas 3, 4 y siguientes", "cita": "«Ninguna vez»", "problema": "Quien responde «Ninguna vez» en la pregunta 3 debería terminar o saltar las preguntas sobre reparaciones realizadas y dificultades, que no le corresponden. Además no se pregunta cómo prefiere solicitar el servicio (WhatsApp, llamada, aplicación) ni cómo reaccionaría ante un equipo que lo visite en su zona, que es la forma de captación del informe.", "mejora": "Configurar el salto en la pregunta 3 y agregar preguntas sobre el medio preferido de contacto, la confianza en un equipo que realiza recorridos y la urgencia habitual de las reparaciones."}, {"severidad": "sugerencia", "titulo": "Numeración y estructura por revisar", "ubicacion": "Formulario (numeración); informe (numeración de capítulos)", "cita": "«CAPÍTULO IIII VALIDACIÓN»", "problema": "En el formulario hay dos preguntas sin número entre las numeradas, señal de que se agregaron después. En el informe, el capítulo de validación figura como «IIII» y numerado 4.1, pero en la estructura del TAP el capítulo 4 es el MVP y la validación es el capítulo 5.", "mejora": "Renumerar las preguntas del formulario y ajustar la numeración de los capítulos a la estructura oficial del TAP (cap. 4: MVP; cap. 5: validación)."}]}], "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 3, "responsabilidad": 3}}</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };

const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const isAA2 = s => /^AA2/.test(s.etiqueta || '');
const secAA2 = D.secciones.filter(isAA2);
const fortAA1 = (D.fortalezas || []).filter(f => !/^AA2:/.test(f));
const fortAA2 = (D.fortalezas || []).filter(f => /^AA2:/.test(f)).map(f => f.replace(/^AA2:\s*/, ''));
const priAA1 = (D.prioridades || []).filter(p => !/^AA2:/.test(p));
const priAA2 = (D.prioridades || []).filter(p => /^AA2:/.test(p)).map(p => p.replace(/^AA2:\s*/, ''));
const all = D.secciones.filter(s => !isAA2(s)).flatMap(s => s.observaciones.map(o => o.severidad));
const allAA2 = secAA2.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;
const countAA2 = sev => allAA2.filter(x => x === sev).length;
const hasAA2 = secAA2.length > 0 || fortAA2.length > 0 || priAA2.length > 0;
const tabbar = hasAA2 ? `<nav class="tabs" role="tablist" aria-label="Evidencias">
  <button class="tab on" role="tab" data-tab="aa1" aria-selected="true">Evidencia 1 (AA1)</button>
  <button class="tab" role="tab" data-tab="aa2" aria-selected="false">Evidencia 2 (AA2) <span class="n">${allAA2.length}</span></button>
</nav>` : '';

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>

    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += tabbar;
html += '<div id="tab-aa1" class="tabpane">';
html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${fortAA1.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA1.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">

    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${priAA1.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

const renderSec = (s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
  </section>`;
};
D.secciones.forEach((s, si) => { if (!isAA2(s)) renderSec(s, si); });
html += '</div>';

if (hasAA2) {
  html += '<div id="tab-aa2" class="tabpane" hidden>';
  html += `<section class="block aa2" id="aa2">
    <div class="head"><div class="eyebrow">Evidencia 2 · avance en curso</div><h2>Evidencia 2 (AA2): retroalimentación de avance</h2></div>
    <p class="summary">Esta parte corresponde a la Evidencia 2 (capítulos 4, 5 y 6 y elevator pitch). Es retroalimentación formativa para que puedan mejorar mientras avanzan: todavía no es una calificación. Se irá actualizando en este mismo enlace.</p>
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
