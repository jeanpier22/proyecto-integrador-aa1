r el ingreso por servicio del cap. 6.", "mejora": "Añadir una pregunta que muestre el precio referencial de dos o tres servicios típicos (cambio de grifería, de luminaria, destape) y pregunte si lo contrataría a ese precio (Sí / Depende / No / Pagaría menos), con una pregunta abierta numérica de «máximo que pagaría». Preguntar también cuánto pagó en su última reparación."}, {"severidad": "critico", "titulo": "No se muestra un prototipo y la propuesta se evalúa solo con texto", "ubicacion": "Introducción del formulario; P9 y pregunta tras la P9", "cita": "«ArreglaYa recibirá las solicitudes por WhatsApp o llamada. Un administrador se encargará de registrar el pedido, comunicar el presupuesto antes de iniciar el trabajo…»", "problema": "La rúbrica y los lineamientos piden validar el MVP. El formulario describe el servicio en un párrafo, pero no enseña el MVP (capturas del flujo de WhatsApp, mensaje de presupuesto, comprobante, ficha de garantía). El encuestado no tiene un objeto concreto sobre el cual reaccionar, y la validación de la funcionalidad queda reducida a calificar atributos de manera abstracta. Además no se valida ninguna funcionalidad específica del MVP definido en el cap. 4.", "mejora": "Incluir imágenes o un video corto del flujo (solicitud, presupuesto, confirmación, comprobante) y preguntar por cada funcionalidad: si la entendió, si la usaría y qué cambiaría. Registrar qué versión del MVP se mostró."}, {"severidad": "importante", "titulo": "Las preguntas de aceptación son hipotéticas y están formuladas con ventajas obvias (sesgo de aquiescencia)", "ubicacion": "Pregunta sin numerar tras la P9; P12; P14", "cita": "«¿Contratarías dos o más servicios técnicos en una misma visita para ahorrar tiempo y coordinar una sola atención?» / «Si contrataras… y recibieras un presupuesto claro…»", "problema": "La P12 incluye en la propia pregunta el beneficio («para ahorrar tiempo»), y la pregunta de intención condiciona la respuesta («y recibieras un presupuesto claro»). Preguntar «¿contratarías…?» sobre algo deseable infla el «sí» por cortesía. Las opciones tampoco son balanceadas en todos los casos: la P12 ofrece Sí / Tal vez / No, y la pregunta de intención tiene tres alternativas favorables a la contratación («Tal vez», «Preferiría comparar») frente a una sola negativa, lo que dificulta interpretar el umbral de H4 y H5. Sin escala y sin «No sé», el 50 % o 60 % de los umbrales fijados antes de encuestar tendrá poca capacidad de rechazo de la hipótesis.", "mejora": "Formular preguntas neutras y sin adjetivos ni beneficios, con escala simétrica de 5 puntos y «No sé», y complementar con preguntas de comportamiento pasado (¿qué hizo la última vez?). Definir qué opciones cuentan como éxito (por ejemplo, solo «Sí, lo contrataría») antes de aplicar."}, {"severidad": "importante", "titulo": "La cuadrícula de importancia (P7) no obliga a priorizar y los resultados serán casi todos «importante»", "ubicacion": "P7 (cuadrícula de cinco aspectos, escala 1 a 5) y P14", "cita": "«Que el técnico tenga experiencia y esté verificado. / Recibir un presupuesto claro… / Contar con garantía… / Recibir un comprobante de pago. / Que el técnico llegue en el horario acordado.»", "problema": "Los cinco aspectos son deseables y la escala termina en «Muy importante», por lo que lo previsible es que todos reciban 4 o 5. La P14 sí obliga a elegir una sola ventaja, pero mezcla seis opciones y no permite jerarquizar. Para H2 y para decidir qué entra en el MVP se necesita saber qué atributo pesa más y a cuál renunciarían (por ejemplo, el comprobante frente a la rapidez), no solo si les parecen importantes.", "mejora": "Reemplazar la cuadrícula por un ordenamiento o por «elige las tres más importantes», o plantear compromisos (rapidez frente a precio, garantía frente a menor costo). Conservar la P14 como pregunta de prioridad principal."}, {"severidad": "importante", "titulo": "No se valida el lado del técnico ni la comisión de 20 %", "ubicacion": "Todo el formulario (dirigido solo a clientes)", "cita": "«¿Para quién necesitarías principalmente un servicio técnico?»", "problema": "El modelo de negocio del cap. III es de dos lados: el técnico paga una comisión y recibe clientes y pagos trazables. El formulario no pregunta al técnico si aceptaría la comisión, si cambiaría un directorio gratuito como Champi por ArreglaYa ni cuántos servicios haría al mes. El supuesto de ingreso (S/ 20 por servicio) no se contrasta con nadie. Además, no se pregunta al cliente si recurriría directamente al técnico en una segunda visita, que es el riesgo de desintermediación ya señalado.", "mejora": "Elaborar un segundo formulario (o guion de 5 a 8 entrevistas) para técnicos, con ingreso actual, disposición a la comisión, exclusividad y condiciones. Agregar al formulario de clientes una pregunta sobre cómo contactaría al técnico para una segunda reparación."}, {"severidad": "importante", "titulo": "No hay perfil del encuestado ni preguntas para analizar por segmento", "ubicacion": "Preguntas 1 y 2; ausencia de edad, ocupación, tipo de vivienda o de negocio", "cita": "«¿En qué distrito resides o se encuentra tu negocio?» (opciones: Cayma / Paucarpata / Cerro Colorado / opción vacía)", "problema": "Solo se capta distrito y destino del servicio. Sin edad (o rango), tipo de negocio, si es propietario o inquilino o ingresos aproximados, no se puede contrastar la respuesta con el segmento declarado en el cap. 2 (hogares y pequeños negocios por NSE y estilo de vida) ni analizar por segmento. La cuarta opción de la P1 está en blanco, y la pregunta no tiene «Otro distrito», por lo que no se puede excluir a quien está fuera de la zona de cobertura. Como se aplicará en el entorno cercano del equipo, el resultado puede reflejar solo a familiares y amigos.", "mejora": "Agregar edad por rango, tipo de negocio (bodega, restaurante, peluquería, otro), propiedad de la vivienda y «Otro distrito» con salto al final. Registrar por qué canal llegó cada respuesta, y fijar cuotas por distrito y tipo de cliente."}, {"severidad": "importante", "titulo": "No hay preguntas conductuales ni un compromiso real", "ubicacion": "Preguntas 3 a 6 y cierre del formulario", "cita": "«¿Qué tipo de servicios técnicos has necesitado durante ese periodo?»", "problema": "La P3 y la P4 miden la necesidad, pero no se pregunta qué hizo en la última reparación, cuánto pagó, cuánto esperó, qué salió mal ni si volvió a contratar al mismo técnico. Tampoco hay ninguna acción de compromiso (dejar su WhatsApp para el piloto, reservar un cupo, pagar un adelanto simbólico). Así, todas las respuestas son declaraciones y no hay evidencia de conversión, que es lo que sostiene los indicadores 2 y 6 del cap. 3.4 (5 % de conversión por recorrido).", "mejora": "Añadir tres preguntas sobre la última reparación (servicio, costo y cómo encontró al técnico) y una final opcional: «¿Quieres que te contactemos para probar el servicio?» con número de WhatsApp. Usar el porcentaje de quienes dejan su contacto como señal conductual."}, {"severidad": "importante", "titulo": "No hay un salto condicional ni coherencia de flujo para quien no tuvo necesidad", "ubicacion": "P3 y P4", "cita": "«Si(goto -2) / No(goto -2)»", "problema": "En el formulario publicado, tanto «Sí» como «No» de la P3 continúan a la sección siguiente, y la P4 (tipos de servicios que ha necesitado) sigue apareciendo para quien respondió «No». Esto fuerza respuestas vacías o inventadas y contamina el análisis de la P4, la P5 y la P6, que solo deberían responder quienes tuvieron necesidad. Además, en la P4 no queda claro que las categorías (pintura, instalación de muebles) estén dentro del alcance real del servicio: el informe limita la electricidad a focos, luminarias, interruptores y tomacorrientes, mientras la P4 lista «instalaciones».", "mejora": "Configurar el salto: «No» en la P3 pasa a preguntar por qué no ha necesitado un servicio y continúa con las preguntas del canal y la aceptación. Alinear las categorías de la P4 con el alcance del servicio del cap. 2."}, {"severidad": "sugerencia", "titulo": "Preguntas sin numerar, orden y opciones por pulir", "ubicacion": "Pregunta sin número tras la P9; P1; P8; P15", "cita": "«Si contrataras un servicio técnico a través de ArreglaYa y recibieras un presupuesto claro…» (sin número)", "problema": "La pregunta de intención de contratar, que es la central para H4, aparece sin número entre la P9 y la P12, señal de agregado tardío, y queda dispersa entre canal y visita integral. La P8 ofrece «Página web» y «Redes sociales», pero el MVP funciona por WhatsApp y llamada. La P15 pregunta una frecuencia hipotética («podrías necesitar») cuando ya se midió la necesidad real en la P3. Todas las preguntas, salvo las de la sección I, son obligatorias, lo que puede aumentar el abandono; la P1 y la P2 no lo son.", "mejora": "Numerar todo, ubicar la pregunta de intención al final de la sección de aceptación (después de mostrar el prototipo y el precio), unificar el criterio de obligatoriedad y reemplazar la P15 por frecuencia real (veces en el último año y gasto anual) para estimar la demanda."}, {"severidad": "sugerencia", "titulo": "Sin preguntas abiertas ni consentimiento y contacto para entrevistas", "ubicacion": "Cierre del formulario", "cita": "«La encuesta es confidencial y sus respuestas serán utilizadas únicamente con fines académicos.»", "problema": "Todas las preguntas son cerradas, por lo que no se descubre qué no previeron. No hay una pregunta abierta para sugerencias o razones, ni consentimiento informado explícito, ni forma de seleccionar a quienes aceptarían una entrevista breve, que complementaría la encuesta.", "mejora": "Añadir una o dos preguntas abiertas opcionales («¿Qué tendría que ofrecer ArreglaYa para que lo contrates?») y una casilla de consentimiento con un campo opcional de contacto para entrevistas."}], "puntuacion": {"criterios": [["Coherencia con las hipótesis e informe", 0.75], ["Cobertura del modelo de negocio (precio, canal, segmento)", 0.5], ["Cobertura de la funcionalidad del MVP (prototipo)", 0.5], ["Redacción, sesgo y opciones de respuesta", 0.75], ["Utilidad para analizar y decidir", 0.5]], "nota": "El instrumento mejoró y ahora es coherente con el servicio real, pero no mide precio ni disposición de pago, no muestra prototipo, no incluye el lado del técnico y no tiene ninguna señal conductual. Aún no hay resultados."}, "preguntas": [{"pregunta": "La última vez que necesitaste una reparación, ¿qué servicio fue, cuánto pagaste en total y cómo encontraste al técnico?", "opciones": "Servicio (lista) / Monto en S/ (numérico) / Medio de búsqueda (selección múltiple)", "mide": "Línea base de precio y canal con comportamiento real."}, {"pregunta": "(Muestra el tarifario referencial de dos o tres servicios típicos.) Con estos precios, ¿contratarías el servicio?", "opciones": "Sí / Depende / No / Pagaría menos de S/ ___", "mide": "H3: aceptación con el precio presentado."}, {"pregunta": "¿Cuál es el máximo que pagarías por una visita con presupuesto cerrado, garantía y comprobante?", "opciones": "Monto en S/ (numérico)", "mide": "Disposición de pago y precio techo."}, {"pregunta": "(Muestra capturas del flujo de WhatsApp.) ¿Entiendes cómo se pide el servicio y qué cambiarías?", "opciones": "Escala de 1 a 5 de claridad + pregunta abierta", "mide": "Validación de la funcionalidad del MVP."}, {"pregunta": "Ordena de más a menos importante: presupuesto cerrado, garantía, técnico verificado, puntualidad, comprobante.", "opciones": "Ordenamiento del 1 al 5", "mide": "H2 y priorización del MVP."}, {"pregunta": "¿Te contactamos por WhatsApp para probar el servicio sin costo de inscripción?", "opciones": "Sí, mi número es ___ / No", "mide": "Compromiso real (señal conductual)."}, {"pregunta": "Si tu técnico te atendió bien, ¿volverías a llamarlo directamente o usarías ArreglaYa de nuevo?", "opciones": "Directo con el técnico / ArreglaYa / Depende", "mide": "Riesgo de desintermediación."}], "consejos": ["Midan primero el comportamiento pasado y después la intención: quien pagó S/ 80 por un destape la semana pasada da más información que quien «estaría dispuesto» a contratar.", "Muestren el precio y el flujo de WhatsApp antes de preguntar interés; sin ellos, H3 y H4 no se pueden comprobar.", "Escriban antes de aplicar qué opciones cuentan como éxito en cada hipótesis, el denominador (todos los encuestados o solo quienes tuvieron necesidad) y la decisión sobre el MVP si no se cumple.", "Prueben el formulario con 5 personas del segmento antes de difundirlo, y registren por dónde llegó cada respuesta para detectar si solo respondió el círculo cercano.", "Definan la muestra (tamaño, cuotas por distrito y tipo de cliente, periodo) y reporten porcentajes con el número de respuestas y análisis por segmento.", "Combinen la encuesta con 5 a 8 entrevistas a clientes y a técnicos, y con una prueba piloto concierge de dos semanas: la encuesta dice cuántos, la entrevista explica por qué y el piloto muestra qué hacen.", "En el cap. 5 presenten resultados, aprendizajes sobre viabilidad y aceptación y las mejoras concretas al MVP (precio, descuento, canal, cobertura) derivadas de cada cifra."]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Producto mínimo viable (4.1 a 4.8)", "resumen": "Versión 20/11/2026: 4.1–4.7 fueron reescritos (10 pasos, herramienta seleccionada, indicadores económicos), pero 4.8 sigue sin capturas («Insertar aquí las evidencias reales») y todo son metas, no resultados. Criterios: Planteamiento del MVP 3 y Herramientas 3.", "observaciones": [{"severidad": "sugerencia", "titulo": "Mejora: el MVP ahora valida funcionalidad y modelo de negocio", "ubicacion": "4.1, 4.2, 4.4, 4.7", "cita": "Se evaluará el uso del tarifario, la aceptación de los presupuestos, el registro de los pagos, la aplicación de la comisión, la entrega de comprobantes y el control de los gastos de movilidad", "problema": "Cumple lo pedido (funcionalidad y modelo de negocio); incluye las metas «Al menos 10 servicios reales completados» y «al menos 3 recorridos».", "mejora": "Reportar los resultados de esas metas con datos del piloto."}, {"severidad": "importante", "titulo": "Sigue sin evidencia de construcción", "ubicacion": "4.8", "cita": "Insertar aquí las evidencias reales una vez construida y probada la plataforma: Figuras 1 a 5", "problema": "Sin capturas del inicio de sesión, panel, registro, vista del técnico ni estado; no se puede verificar que el MVP exista (solo consta el prototipo evaluado en la encuesta del cap. 5).", "mejora": "Insertar las 5 figuras con título y fuente, y el resultado de la prueba con 2 a 4 técnicos (tareas completadas, tiempo)."}, {"severidad": "importante", "titulo": "Herramienta elegida pero sin comparación con costos", "ubicacion": "4.5", "cita": "Se seleccionará una plataforma web interna… La viabilidad de esta herramienta se evaluará considerando su facilidad de uso, compatibilidad con dispositivos móviles, costo de desarrollo, mantenimiento", "problema": "Se justifica frente a la hoja de cálculo, pero la viabilidad «se evaluará»; no se compara con alternativas no-code ni se enlaza con el S/ 5 000 de 6.1.", "mejora": "Tabla comparativa (web a medida, no-code, hoja de cálculo) con costo, tiempo y riesgos."}, {"severidad": "sugerencia", "titulo": "Comparación de alternativas tecnológicas: ya existe, falta cuantificar y decidir", "ubicacion": "4.5 (tabla nueva)", "cita": "Web a medida / plataforma no-code / hoja de cálculo: costo «Alto», «Bajo o medio», «Bajo»", "problema": "Mejora real: tres alternativas con costo, tiempo, personalización y riesgos. Sigue siendo cualitativa (sin montos ni horas), no declara cuál se elige en la tabla y la nota dice que «deberá complementarse con cotizaciones». 4.8 mantiene «Insertar aquí las evidencias reales» (Figuras 1–5 sin capturas).", "mejora": "Poner costo y tiempo en cifras, indicar la alternativa elegida y vincularla con los S/ 9.125,01 de inversión intangible; insertar las capturas."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Validación (5.1.1 a 5.1.10) en el informe", "resumen": "Versión 20/11/2026: ya hay resultados reales. 5.1.9 procesa 5 entrevistas (3 clientes, 2 técnicos), 5.1.10 presenta 112 respuestas (84 clientes, 44 técnicos) con n y %, 5.1.10.3 evalúa hipótesis con decisión y 5.1.11 propone 5 mejoras al MVP. Faltan H4–H8 en la matriz, la validación de H3 (disposición a pagar), el piloto y mejoras ya incorporadas. Criterio Validación: 3.", "observaciones": [{"severidad": "sugerencia", "titulo": "Resultados reales con n y porcentaje", "ubicacion": "5.1.10.1", "cita": "70 de 84 (83,3 %) necesitaron un técnico; 73 de 84 (86,9 %) valoran útil la propuesta; 51 de 84 (60,7 %) eligen múltiples trabajos", "problema": "Fortaleza: cifras con n, % y criterio de éxito previo; los porcentajes se verificaron (70/84 = 83,3 %; 32/84 = 38,1 %; 51/84 = 60,7 %). Se declara con honestidad que la intención no garantiza el uso real.", "mejora": "Mantener; agregar análisis por distrito y por rol (cliente, técnico, ambos)."}, {"severidad": "importante", "titulo": "La matriz de hipótesis solo evalúa H1–H3", "ubicacion": "5.1.10.3 vs 5.1.5", "cita": "H1 Validada; H2 Parcialmente validada; H3 No validada con la encuesta aplicada", "problema": "Se definieron H1–H8 (H8: comisión de 15 %), pero la matriz termina en H3; no hay decisión para el resto aunque hay datos (zonas 79,1 %, comisión 16,3 % directa).", "mejora": "Completar la matriz con las 8 hipótesis (estado y decisión)."}, {"severidad": "importante", "titulo": "La disposición a pagar y la comisión no están validadas", "ubicacion": "5.1.10.3; 5.1.10.2", "cita": "No se obtuvo un porcentaje válido… no preguntó directamente si pagarían un monto adicional", "problema": "El modelo depende de la comisión: solo 7 de 43 técnicos (16,3 %) aceptan el 15 %; 19 la condicionan; 11 prefieren tarifa fija; el cliente no fue consultado sobre el precio.", "mejora": "Aplicar una nueva ronda con precio concreto y la comisión del cap. 6; decidir con regla previa."}, {"severidad": "importante", "titulo": "Las mejoras al MVP son propuestas, no cambios probados", "ubicacion": "5.1.11", "cita": "Estas mejoras deberán incorporarse progresivamente al MVP y comprobarse durante el piloto", "problema": "Las 5 mejoras (verificación de técnicos, presupuesto aceptado, visita integral, información económica del técnico, seguimiento) nacen de cifras (38,1 %; 60,7 %), pero 4.8 sigue sin capturas ni versión con cambios.", "mejora": "Mostrar el antes y después en el MVP (capturas) y probarlo con el piloto de ≥ 10 servicios."}, {"severidad": "sugerencia", "titulo": "Muestra y exclusiones", "ubicacion": "5.1.10", "cita": "se procesaron las primeras 112 respuestas… Las 10 posteriores fueron excluidas", "problema": "El objetivo era 100 y se analizan 112; excluir 10 por «periodo» sin criterio de calidad parece arbitrario; el muestreo es por conveniencia (reconocido en 5.1.2).", "mejora": "Justificar el corte o incluir todas; declarar límites y margen de error aproximado."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Proyección financiera y presupuestaria", "resumen": "Versión 20/11/2026 (10:22): el cap. 6 ahora tiene las 7 piezas con cifras: inversión por categoría (S/ 23.791,51), costos y gastos, ingresos (ticket S/ 150, comisión 20 %, 264/330/396 servicios al mes), egresos, flujo mensual de 2027 en 12 meses con saldo acumulado, flujo a 3 años y VAN S/ 75.990,62, TIR 159,90 %, PRI 9,38 meses y PE 107 servicios/mes, más sensibilidad con tres escenarios. Verificado con script: las cuentas internas cuadran. Pero el resultado favorable descansa en un ticket que pasó de S/ 53 a S/ 150 sin respaldo en el cap. 5, en 4 recorridos al mes (66 servicios por recorrido) frente a los 8 por recorrido del cap. 3.2, y en una comisión del 20 % no validada (la validada es 15 %). Criterio Análisis presupuestal: 3.", "observaciones": [{"severidad": "critico", "titulo": "Ticket de S/ 150 sin sustento en la validación; triplica el anterior", "ubicacion": "6.3, 3.x (tarifario referencial), 5.1.10", "cita": "Ticket promedio = (0,50 × 80) + (0,30 × 160) + (0,20 × 310) = S/ 150 (versión anterior: S/ 53)", "problema": "Cálculo propio: la ponderación es aritméticamente correcta, pero los precios S/ 80, 160 y 310 y la mezcla 50/30/20 son supuestos; el cap. 5 no reporta qué suelen pagar los clientes (5.1.4 dice que la encuesta lo pregunta, pero 5.1.10 no presenta ese resultado) y H3 quedó «No validada». El paso de un VAN negativo a +S/ 75.990 viene en buena parte de este supuesto.", "mejora": "Sustentar el tarifario con al menos 3 cotizaciones locales por servicio y con la pregunta de monto de la encuesta; si no hay dato, mostrar el VAN con el ticket anterior (S/ 53) como escenario."}, {"severidad": "critico", "titulo": "Movilidad: 4 recorridos al mes no es coherente con 8 servicios por recorrido", "ubicacion": "6.2 vs 3.2", "cita": "«con 264 servicios mensuales y cuatro recorridos al mes, el supuesto implica 66 servicios por recorrido» vs «80 × 10 % = 8 servicios» por recorrido (3.2)", "problema": "El propio informe reconoce los 66 servicios por recorrido pero no lo corrige. Cálculo propio: con 8 servicios por recorrido, 264 servicios requieren 33 recorridos al mes = S/ 4.950 al mes (S/ 59.400 al año) en vez de S/ 7.200; el resultado operativo 2027 pasaría de +S/ 38.676 a ≈ –S/ 13.524. Con ese modelo el CV de S/ 5 deja de ser creíble.", "mejora": "Usar un solo modelo: recorridos con conversión y servicios por recorrido medidos en el piloto, o captación digital sin recorridos; recalcular movilidad, PE, VAN y TIR."}, {"severidad": "importante", "titulo": "Comisión 20 % vs 15 % validada; la sensibilidad no incluye el VAN", "ubicacion": "6.3, 6.8 vs 5.1.10.2", "cita": "Comisión 20 % (6.3) frente a «modelo de comisión del 15 %»: 7 de 43 técnicos aceptan directo (16,3 %) y 19 condicional (44,2 %)", "problema": "El cap. 6 lo reconoce en la nota de consistencia pero mantiene 20 % como base. Cálculo propio: con 15 % y ticket S/ 150 la comisión neta es S/ 19,07 y el resultado operativo 2027 ≈ S/ 18.541 (menor que S/ 38.676). La sensibilidad 6.8 (pesimista –S/ 5.661,08; base S/ 38.676,37; optimista S/ 103.664,89; verificado) varía todo a la vez y no muestra VAN/TIR por escenario ni cuál variable pesa más.", "mejora": "Tomar 15 % como base o sustentar 20 % con datos; añadir VAN/PE por escenario y una sensibilidad variable por variable (ticket, comisión, movilidad, volumen)."}, {"severidad": "importante", "titulo": "TIR de 159,90 % y PE de 107 servicios/mes no resisten el contraste con el cap. 3.2", "ubicacion": "6.7, 6.9 vs 3.2", "cita": "TIR económica 159,90 % … Punto de equilibrio 107 servicios/mes (vs «4 800 servicios mensuales», 3.2)", "problema": "Verificado con script: VAN al 18 % = S/ 75.990,62, TIR ≈ 159,90 %, PRI 9,38 meses (acumulado –1.324,50 a setiembre y +2.182,85 a octubre) y PE ≈ 106,2, que el informe redondea a 107/mes. Los cálculos son correctos, pero una TIR de 160 % con aporte 100 % propio y sin técnicos ni clientes aún captados es señal de supuestos optimistas, y 3.2 sigue concluyendo un PE de 4 800 servicios/mes.", "mejora": "Conciliar 3.2 con 6.7 (un solo PE), explicar por qué la TIR es tan alta y mostrar el VAN con el escenario del cap. 5 (15 %, movilidad real)."}, {"severidad": "importante", "titulo": "Inversión por categorías pero sin rubros ni cotizaciones; no coincide con el Excel", "ubicacion": "6.1", "cita": "Inversión fija tangible 6.760,00; intangible 9.125,01; capital de trabajo 7.906,50; total 23.791,51", "problema": "Mejora real: tres categorías que suman el total (verificado). Falta el detalle por rubro (cantidad, precio, proveedor) y no se explica el aumento de S/ 4.400 frente a los S/ 19.391,51 de la versión anterior. Cruce con el Excel descargado el 20/11 (10:24): la hoja «Modelo financiero 2027-2029» registra inversión S/ 24.391,51 (provisional), ticket S/ 53, 240 servicios/mes, VAN –S/ 52.012,60, «No existe TIR» y «No viable en horizonte 3 años»; «Estructura de Inversión» sigue en S/ 19.391,51. El informe dice tomar los datos del Excel, pero esa copia no coincide (el Excel se revisa aparte).", "mejora": "Presentar el desglose por rubro con cotizaciones y alinear informe y Excel (mismas cifras y misma versión) antes de la entrega."}, {"severidad": "sugerencia", "titulo": "Restos de borrador y numeración", "ubicacion": "6.2, 6.3, 6.5, 6.6", "cita": "«En el informe, el tarifario del capítulo II debe actualizarse…»; dos tablas llamadas «Tabla 6.6»", "problema": "Quedan notas de trabajo dentro del texto, la numeración de tablas se repite y el flujo de 6.5 usa una rampa (198 a 363) con saltos en noviembre y diciembre (+33) sin justificación.", "mejora": "Eliminar frases de borrador, renumerar tablas y justificar la rampa de captación."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Modelo de negocio (3.2 y tarifario, versión 20/11/2026 10:22)", "resumen": "Se agregó el tarifario referencial (S/ 80 / 160 / 310), la mezcla 50/30/20 y el ticket ponderado de S/ 150, una interpretación del mapa de empatía por segmento (hipótesis), y la tabla del BMC pasó a S/ 150 y comisión S/ 30. Pero el texto bajo la tabla sigue con S/ 100 × 20 % = S/ 20 y mantiene el PE de 4 800 servicios.", "observaciones": [{"severidad": "importante", "titulo": "3.2 quedó a medias: la tabla usa S/ 150 y el cálculo debajo usa S/ 100", "ubicacion": "3.2", "cita": "Tabla: Precio promedio S/ 150, comisión S/ 30, ingreso por recorrido S/ 160 | Texto: «S/ 100 × 20 % = S/ 20 … 8 × S/ 20 = S/ 160»", "problema": "Cálculo propio: con S/ 150 y 20 %, 8 servicios dan 8 × 30 = S/ 240 por recorrido (no S/ 160), el margen tras movilidad es S/ 90 (no S/ 10) y el PE sería 6 000 ÷ 90 ≈ 67 recorridos ≈ 533 servicios, no 4 800. El indicador «Cobertura del recorrido» de 4.7 (S/ 160 ÷ S/ 150 = 106,67 %) quedó igual.", "mejora": "Recalcular 3.2 y el indicador de 4.7 con S/ 150 y unirlos al cap. 6."}, {"severidad": "sugerencia", "titulo": "Tarifario y mezcla de servicios son supuestos sin cotización", "ubicacion": "3.x «Tarifario referencial»", "cita": "50 % básicos, 30 % intermedios, 20 % complejos", "problema": "El texto declara que son supuestos (bien), pero el tarifario reemplazó al rango anterior (gasfitería S/ 45–80, visita desde S/ 20) sin explicar por qué los precios suben tanto.", "mejora": "Incluir cotizaciones o el resultado de la pregunta de precios de la encuesta como respaldo."}, {"severidad": "sugerencia", "titulo": "Interpretación del mapa de empatía por segmento: falta contrastarla", "ubicacion": "3.1", "cita": "«Estas características representan hipótesis… deberán contrastarse»", "problema": "Adición positiva (hogares vs. pequeños negocios), pero hoy sin evidencia propia.", "mejora": "Ligarla con respuestas de la encuesta o entrevistas."}]}], "fecha_aa2": "11/11/2026", "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 3, "responsabilidad": 3}, "calificacionAA2": {"validacion": 2}, "enlaces": [{"titulo": "Informe del TAP (Google Docs)", "url": "https://docs.google.com/document/d/12dpTvdTYUuEtEt3ieBOAfdEQWKlHFBz1"}, {"titulo": "Formulario de validación", "url": "https://docs.google.com/forms/d/e/1FAIpQLSdcvF31LWisDPkP4RwstkLmyN7xQxY8GBDmKMzj1XvaNAxMVw/viewform"}], "costosAA2": {"hoja": "ArreglaYa", "tipo_cambio": 3.5, "escenarios": ["Piloto", "Año 1", "Crecimiento"], "supuestos": [{"concepto": "Usuarios de la plataforma (admin + técnicos)", "unidad": "usuarios", "valores": [3.0, 6.0, 15.0], "nota": "SUPUESTO: el informe no declara número de técnicos."}, {"concepto": "Servicios realizados al mes", "unidad": "servicios", "valores": [50.0, 300.0, 1000.0], "nota": "300 = ejemplo ilustrativo del informe."}, {"concepto": "Requests por usuario al mes", "unidad": "req/usuario", "valores": [1500.0, 1500.0, 1500.0], "nota": "SUPUESTO: uso intensivo de la gestión diaria."}, {"concepto": "Segundos de ota": ""}], "total_pen": [0.0, 6.4167, 7.1097], "primer_pago_pen": [0.0, 77.0, 77.693], "ingreso_etiqueta": "Ingreso por comisión (20 % de S/ 100 por servicio)", "ingreso_pen": [1000.0, 6000.0, 20000.0], "chat_pen": null, "desarrollo_pen": 5000.0, "mantenimiento_pen": [160.0, 320.0, 640.0], "total_con_mant_pen": [160.0, 326.4167, 647.1097], "tarifa_desarrollo": 50, "tarifa_mantenimiento": 40, "pct_ingreso": [0.0, 0.0011, 0.0004], "por_usuario_pen": [0.0, 1.0694, 0.474], "notas": ["La atención por WhatsApp usa la app WhatsApp Business gratuita (no API): costo S/ 0.", "Mapas y geolocalización no están declarados; si calculan rutas con Google Maps Platform habria un costo adicional no incluido aqui.", "El costo de nube es marginal frente al costo fijo operativo (S/ 6 000 en su ejemplo): el riesgo financiero no está en la nube."], "elaborado": "11/11/2026", "primer_pago_total_pen": [5000.0, 5077.0, 5077.693], "costo_anio1_pen": [6920.0, 8917.0, 12765.316], "necesidades": {"nombre": "ArreglaYa", "resumen": "Servicio técnico a domicilio con movilidad equipada, apoyado por una web interna liviana. La nube cuesta casi nada: el costo real está en la operación (movilidad, herramientas, técnicos).", "items": [{"rubro": "Web interna de gestión", "necesidad": "Plataforma para administrador y técnicos (agenda, recorridos, registro de servicios), accesible desde PC y móvil (2.2.2).", "origen": "Declarado", "proveedor": "Google Firebase", "producto": "Hosting + Firestore", "precio": "Hosting: USD 0,15 por GB (360 MB/día gratis). Firestore: cuotas diarias gratis (50 mil lecturas, 20 mil escrituras), luego precio de Google Cloud", "pen": null, "frecuencia": "por uso", "estado": "Verificado", "nota": "Cuotas y precio de Hosting leídos en firebase.google.com/pricing el 11/11/2026. Volumen muy bajo: casi todo cae en la capa gratuita."}, {"rubro": "Accesos con permisos", "necesidad": "Perfiles diferenciados de administrador y técnico.", "origen": "Declarado", "proveedor": "Google Firebase", "producto": "Firebase Authentication", "precio": "Gratis hasta 50 mil usuarios activos", "pen": 0, "frecuencia": "mensual", "estado": "Verificado", "nota": ""}, {"rubro": "Atención de pedidos", "necesidad": "Los clientes piden por WhatsApp, llamada o redes.", "origen": "Declarado", "proveedor": "Meta", "producto": "WhatsApp Business (aplicación)", "precio": "Gratis", "pen": 0, "frecuencia": "mensual", "estado": "Verificado", "nota": "No necesitan la API."}, {"rubro": "Cobros con Yape/Plin", "necesidad": "Pago manual a ArreglaYa; solo registran los pagos recibidos.", "origen": "Declarado", "proveedor": "Yape (BCP) / Plin", "producto": "Cobro por billetera digital", "precio": "Confirmar condiciones y comisiones vigentes para cuentas de negocio", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "Verificar con el banco antes de asumir que no hay comisión."}, {"rubro": "Movilidad equipada", "necesidad": "Vehículo equipado que recorre Cayma, Paucarpata y Cerro Colorado.", "origen": "Declarado", "proveedor": "Concesionarias, alquiler de vehículos o compra de segundo uso en Arequipa", "producto": "Compra o alquiler, combustible, seguro y mantenimiento", "precio": "Sin precio público único", "pen": null, "frecuencia": "única", "estado": "Cotizar", "nota": "Pedir 2 cotizaciones: compra y alquiler. Es la mayor inversión del modelo."}, {"rubro": "Herramientas y materiales", "necesidad": "Equipo de gasfitería, electricidad básica y pintura.", "origen": "Declarado", "proveedor": "Ferreterías y distribuidores (p. ej. Sodimac, Promart, ferreterías locales)", "producto": "Juego de herramientas y stock inicial de materiales", "precio": "Sin precio público único", "pen": null, "frecuencia": "única", "estado": "Cotizar", "nota": "Armar la lista de herramientas con cantidades y cotizarla en 2 proveedores."}, {"rubro": "Técnicos", "necesidad": "Técnicos independientes: el modelo cobra comisión del 20 % por servicio (ejemplo del informe: precio S/ 100).", "origen": "Declarado", "proveedor": "Técnicos independientes", "producto": "Pago por servicio realizado", "precio": "Según tarifario del grupo (aún no declarado)", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "El informe da costos fijos S/ 6 000 y punto de equilibrio de 300 servicios solo como ejemplo ilustrativo: deben sustentarlos con cotizaciones."}, {"rubro": "Dominio", "necesidad": "Opcional para la web interna.", "origen": "Opcional", "proveedor": "GoDaddy u otro registrador", "producto": "Dominio .com", "precio": "GoDaddy LatAm ofrece .com desde S/ 0,01 el primer año (promoción); renovación no confirmada, se estima USD 20 al año", "pen": 70, "frecuencia": "anual", "estado": "Referencial", "nota": "El precio de renovación suele ser mayor que el del primer año; confirmar en el checkout de pe.godaddy.com."}, {"rubro": "Desarrollo inicial", "necesidad": "Web interna etapa 1 (perfiles, agenda, registro).", "origen": "Inferido", "proveedor": "Desarrollador freelance o equipo propio", "producto": "100 horas a S/ 50 por hora (supuesto)", "precio": "S/ 5 000 (supuesto)", "pen": 5000, "frecuencia": "única", "estado": "Cotizar", "nota": "Reemplazar con cotización real. Mercado: freelancers peruanos cobran entre USD 10 y 50 por hora (mediana aprox. USD 20, freelancermap); un sueldo en planilla de desarrollador ronda S/ 2 537 al mes (Indeed, oct. 2026)."}]}, "estados_precio": {"Verificado": "Precio leído de la fuente oficial o coincidente en varias fuentes el 11/11/2026.", "Referencial": "Cifra de referencia: confirmar con la calculadora o lista de precios oficial del proveedor antes de presentar.", "Cotizar": "No hay precio público confiable: el grupo debe pedir cotización a 2 o más proveedores y anexarla."}}, "notasAA2": {"id": "grupo-olivera-trujillo-sanchez-cari", "fecha": "20/11/2026 (10:22)", "mvp": 3, "herramientas": 3, "validacion": 3, "presupuesto": 3, "compromiso": 3, "total": 15, "justificacion": {"mvp": "3 (igual). El cap. 4 mejoró: 4.1–4.2 añaden objetivos comerciales y económicos (tarifario, comisión, comprobante, costo de movilidad), el flujo pasa de 7 a 10 pasos (4.4: cotización, aceptación del presupuesto, pago por Yape/Plin, distribución de ingresos, comprobante y garantía) y 4.7 suma indicadores «Servicios reales contratados» (≥ 10) y «Rentabilidad por servicio y costo por recorrido» (≥ 3 recorridos). Pero 4.8 sigue con «Insertar aquí las evidencias reales» (Figuras 1–5 sin capturas) y todo son metas, no resultados del piloto del MVP. No sube a 4 sin evidencia de construcción y prueba. Sin cambios de nota a las 10:22: 4.8 sigue sin capturas.", "herramientas": "3 (antes 2). 4.5 ya elige: «plataforma web interna» + WhatsApp Business, y la contrasta con la hoja de cálculo (accesos diferenciados, vistas, móvil, crecimiento gradual). Falta para el 4: comparar al menos dos alternativas con costo, tiempo y viabilidad técnica; 4.5 dice que la viabilidad «se evaluará», y el costo de desarrollo (S/ 5 000 en 6.1) no se enlaza con la elección. 10:22: se agregó la tabla comparativa de tres alternativas (web a medida, no-code, hoja de cálculo) con costo, tiempo, personalización y riesgo, pero es cualitativa y sin cotizaciones; la nota se mantiene en 3.", "validacion": "3 (antes 2). Aparecen resultados reales: encuesta de 112 respuestas (84 clientes, 44 técnicos), 5 entrevistas, matriz de hipótesis con criterio, resultado y decisión (H1 83,3 % validada; H2 parcial; H3 «No validada con la encuesta aplicada») y 5 mejoras propuestas en 5.1.11 derivadas de las cifras. No llega a 4: las mejoras son propuestas, no incorporadas ni probadas en el MVP; la matriz solo evalúa H1–H3 (H4–H8 definidas en 5.1.5 no aparecen); la comisión se validó al 15 % y el informe usa 20 % (3.2, 4.7, 6.3); no hay piloto ni servicios reales; se excluyen 10 respuestas sin criterio claro. Sin cambios en el cap. 5 a las 10:22; la nota se mantiene.", "presupuesto": "3 (antes 2). El cap. 6 ahora cubre las 7 piezas con cifras: inversión por categoría (S/ 23.791,51 = 6.760 + 9.125,01 + 7.906,50, verificado), costos fijos/variables con movilidad separada, ingresos (ticket S/ 150, comisión 20 %, neto S/ 25,42), egresos 2027-2029, flujo mensual 2027 de 12 meses con saldo acumulado (PRI 9,38 meses), flujo a 3 años, VAN S/ 75.990,62, TIR 159,90 %, PE 107 servicios/mes y sensibilidad en 3 escenarios; recalculado con Python: todo cuadra. No llega a 4: el ticket pasó de S/ 53 a S/ 150 sin respaldo en el cap. 5; la movilidad (4 recorridos, 66 servicios por recorrido) contradice los 8 por recorrido del cap. 3.2 (cálculo propio: con 8 por recorrido el resultado 2027 sería ≈ –S/ 13.524); se usa 20 % cuando lo validado fue 15 %; el cap. 3.2 quedó con S/ 100 × 20 % = S/ 20 y PE 4.800; la inversión no tiene rubros ni cotizaciones; el Excel descargado (10:24) aún tiene ticket S/ 53, VAN –S/ 52.012,60 e inversión S/ 24.391,51, es decir no coincide con el informe.", "compromiso": "a criterio del docente"}, "cambios_vs_6nov": "Mejoró: aparecen el cap. 4 completo en texto (objetivos, MoSCoW, flujo, indicadores) y el cap. 5 reestructurado (5.1.1 a 5.1.10, guías de encuesta y entrevista, tabla de hipótesis). No cambió: caps. 1 a 3 idénticos (solo «Grupo: 4»), con el ejemplo ilustrativo del PE. Sigue ausente: cap. 6 vacío, sin resultados de encuesta ni entrevistas, sin capturas del MVP.", "camino_al_20": ["Sustentar el ticket de S/ 150 (tarifario con 3 cotizaciones locales y precio pagado de la encuesta); mostrar también el escenario con el ticket anterior de S/ 53.", "Resolver la movilidad: 4 recorridos al mes con 66 servicios por recorrido contradice los 8 por recorrido de 3.2 (con 8, ≈ 33 recorridos y S/ 59.400 al año, cálculo propio); un solo modelo operativo y recalcular PE, VAN y TIR.", "Corregir 3.2: usar S/ 150 y 20 % (o 15 %) en el texto de cálculo (S/ 240 por recorrido, no S/ 160) y en el indicador de cobertura de 4.7; eliminar el PE de 4.800 o conciliarlo con el de 107.", "Usar la comisión validada (15 %) como base o sustentar   const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
