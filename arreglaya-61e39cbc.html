<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.scorebox { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-olivera-trujillo-sanchez-cari", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "ArreglaYa: servicios técnicos para el hogar y pequeños negocios en Arequipa", "grupo": "Grupo (sin número)", "seccion": "No indicada", "fecha": "04/11/2026 (3.ª versión) · formulario AA2 revisado el 06/11/2026", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Olivera Ramirez, Eduardo Antonio", "Cari Sanchez, Aydan Reynaldo", "Sanchez Ccama, Yamile Xiomara", "Trujillo Huamani, Susan Lizbeth"], "dictamen": "menor", "resumen": "Esta tercera versión mejora de forma clara y se acerca a lo que pide la AA1. El capítulo 1 fue reescrito: ahora tiene secciones propias de ODS (1.2) y megatendencias (1.3), enunciado del problema y objetivo general, y cifras de Arequipa con sus límites bien explicados (pp. 3-8). El capítulo 2 tiene una ficha técnica del servicio con nueve campos, un modelo de ingresos coherente (el cliente paga a ArreglaYa, que retiene el pago y descuenta la comisión) y un tratamiento claro de los límites del servicio, la selección de técnicos y la garantía (pp. 8-15). El capítulo 3 sumó como competidores a las plataformas digitales, las tiendas de mejoramiento del hogar y los seguros, con fortalezas, desventajas y un cuadro comparativo (pp. 35-39). Además, ya no hay consignas copiadas, hay índice y la carátula incluye carreras y participación. Persisten: el problema del cliente y el social siguen sin separarse, las megatendencias de tecnología y demografía no tienen fuente y los ODS no citan metas. Retrocedieron dos apartados: desaparecieron los indicadores de gestión y el análisis del entorno que sí estaban en la versión anterior. En el formato, el apellido del docente sigue mal escrito («ANC0RI», con cero), los anexos 2 y 3 son imágenes sin figura numerada ni fuente, y el índice tiene páginas desfasadas.", "fortalezas": ["El capítulo 1 se reescribió con estructura propia: 1.1 con enunciado del problema y objetivo general (pp. 5-6), 1.2 con los ODS 8, 11 y 10 y una cifra por cada uno (p. 6) y 1.3 con tres megatendencias vinculadas a los ODS (pp. 7-8). Retiraron el documento de PwC sobre defensa que sustentaba las megatendencias en la versión anterior.", "Sustentan el problema con cifras de Arequipa y reconocen sus límites con honestidad: el indicador de vivienda «incluye también servicios básicos y título de propiedad, no solo reparaciones» (p. 3), TECSUP es «un solo instituto» con datos «solo hasta 2022» (p. 4) y la encuesta de empleo «solo cubre empresas formales de 20 trabajadores a más» (p. 5). Incorporan fuentes institucionales: INEI, IEES-SNI, CPI Research, CENEPRED y TECSUP.", "El modelo de ingresos quedó coherente: el cliente paga por Yape o Plin a ArreglaYa, que retiene el pago hasta terminar el trabajo, emite el comprobante, descuenta la comisión y transfiere el resto al técnico, con tres controles contra el subregistro de precios (p. 12). Esto resuelve la contradicción de la versión anterior con los «precios claros». La garantía (primero el técnico, luego un fondo con parte de la comisión) y los descuentos (financiados por la comisión, sin bajar el pago del técnico) también están definidos (p. 11).", "El capítulo 2 delimita el alcance del servicio (en electricidad solo focos, luminarias, interruptores y tomacorrientes; sin tableros ni inspecciones certificadas, p. 10), describe una selección de técnicos en cuatro pasos (p. 10) y reconoce que el régimen legal con los técnicos se definirá con asesoría contable y legal (pp. 10-11). La ficha técnica del servicio ya tiene nueve campos, con el proceso de atención en siete pasos (pp. 13-15).", "El análisis de competidores mejoró mucho: incluye maestros y directorios (OLX, arequipa.app, gasfitero.app), Sodimac y Promart con precios y condiciones concretas, plataformas digitales (Champi, Home Solution, GoChamba) y asistencias de seguros (Pacífico, Rímac), cada uno con fortalezas, desventajas y «ajuste aplicado en ArreglaYa», más un cuadro comparativo (pp. 36-39). Reconocen que Sodimac es el competidor más cercano (p. 37) y declaran la fecha de consulta (2 de noviembre de 2026).", "El BMC incluye dos relaciones económicas con ejemplo de cálculo (ingreso por servicio = precio × comisión; punto de equilibrio = costos fijos ÷ ingreso por servicio) y aclara que los valores son ilustrativos y se definirán con cotizaciones y el piloto (p. 35). En la presentación, ya no hay consignas copiadas, hay índice, la carátula tiene carreras y participación, y todas las referencias se citan en el texto y están en orden alfabético.", "AA2: Se restituyeron los seis indicadores de gestión del capítulo III (3.4) con fórmula, meta, frecuencia y ejemplo de cálculo, y la comparación con competidores incluye precios publicados de Sodimac y fuentes con fecha de consulta. Además, el grupo definió hipótesis y criterios de éxito (4.1) antes de aplicar la encuesta, lo que es la base de una validación seria.", "AA2: El BMC explica de forma coherente el flujo de pago (el cliente paga a ArreglaYa, que retiene, emite comprobante, descuenta la comisión y transfiere al técnico) y declara con honestidad los supuestos económicos como referenciales y la relación con los técnicos como hipótesis legal por revisar.", "AA2: El formulario ya describe el servicio tal como lo plantea el informe (WhatsApp o llamada, administrador que registra y comunica el presupuesto, técnico asignado, garantía y comprobante), y se corrigió la versión que hablaba de una aplicación: la aceptación que se mide es la del servicio real.", "AA2: La pregunta 3 usa seis meses, coherente con el criterio de H1, y la pregunta 7 ya incluye el comprobante de pago entre los atributos de H2 (cuadrícula de 1 a 5 con cinco filas).", "AA2: Cubre varias hipótesis del informe con preguntas propias: visita integral (P12 y P13, para H5), canal de solicitud (P8), aceptación de recorridos (P9), dificultades actuales (P5) y canales de búsqueda con tiendas y plataformas (P6), lo que permite contrastar contra la competencia analizada en 3.3.", "AA2: Incluye P13 sobre qué beneficio atrae más en la visita integral (descuento, costo único de desplazamiento, prioridad, coordinación), útil para decidir cómo financiar el descuento sin bajar el pago del técnico.", "AA2: La introducción es honesta y clara: explica el proceso, la confidencialidad y el tiempo (3 a 5 minutos); las preguntas 5, 6, 13 y 14 permiten opciones adecuadas y «Otros».", "AA2: El cap. 4 es coherente con la etapa 1 del 2.2.2 (dos perfiles, clientes por WhatsApp) y presenta MoSCoW, flujo de 7 pasos e indicadores de MVP con metas declaradas «no resultados obtenidos».", "AA2: El cap. 5 define hipótesis H1–H5 con criterios previos, reconoce el muestreo por conveniencia y evita inventar resultados; incluye guías de entrevista para técnicos y clientes.", "AA2: El tarifario piloto del 2.2 da precios por servicio y se compara con Sodimac (grifería S/ 64,90; luminaria S/ 34,90), base útil para un presupuesto de ingresos realista.", "AA2: Cap. 6 completo en las 7 piezas, con flujo mensual de 12 meses, VAN/TIR/PRI, PE y sensibilidad con 3 escenarios; las cuentas internas cuadran (verificado con script)."], "prioridades": ["Restituir los indicadores de gestión (KPI con fórmula, meta y ejemplo de cálculo) y el análisis del entorno interno y externo, que estaban en la versión anterior y desaparecieron. Las dos fórmulas del BMC (p. 35) pueden ser el punto de partida.", "Reorganizar el capítulo 1 en problema del cliente y problema social, cada uno con causas y consecuencias, y rotular como hipótesis la afirmación de que los técnicos informales trabajan «sin precios claros, sin garantía y sin comprobante de pago» (p. 3), que no tiene fuente. La validación con clientes reales se exigirá en el capítulo 5 (AA2).", "Sustentar las megatendencias de tecnología y cambio demográfico con CEPLAN u otra fuente (hoy solo la urbanización tiene cita, y es una nota de La República, p. 7) y citar las metas de los ODS 8, 10 y 11 con la ONU.", "Corregir la carátula: el apellido del docente figura como «ANC0RI» (con cero) y faltan la sección y el número de grupo.", "Numerar y titular las tablas y figuras con su fuente («Tabla 1. …», «Nota. Elaboración propia»), incluidas las fichas, el cuadro comparativo y los anexos 2 y 3. Declarar el uso de herramientas de IA si las imágenes de los anexos se generaron con ellas y actualizar el índice, cuyas páginas están desfasadas desde 2.2.1 hasta 3.3.", "AA2: Unificar los supuestos numéricos de 3.2 y 3.4 en una sola cadena (contactos por recorrido, conversión, ticket, comisión neta, costo por recorrido): hoy el indicador 2 (5 % de conversión) deja S/ 80 por recorrido y el indicador 6 supone S/ 180, y el punto de equilibrio de 300 servicios exigiría unos 75 recorridos mensuales que cuestan más de lo que ingresa por comisión. Cuantificar la estructura de costos y el ingreso neto por servicio (IGV, Yape/Plin, garantía, descuentos) como insumo del capítulo 6.", "AA2: Completar la validación como capítulo 5 (y crear el capítulo 4 del MVP): justificar cada umbral (60 %, 70 %, 50 %) con muestra mínima y margen de error, definir la regla de decisión por hipótesis, la metodología (población, muestreo, periodo, plan de análisis) y las hipótesis del lado del técnico y de los supuestos económicos, con una prueba conductual además de la encuesta.", "AA2: Hacer verificable la ventaja competitiva: tabla de precios comparables (maestro independiente, Sodimac, ArreglaYa), análisis del efecto de la comisión de 20 % frente a directorios gratuitos como Champi, y mapa de empatía por segmento rotulado como hipótesis o sustentado con datos de la encuesta.", "AA2: Presentar un precio concreto (visita técnica o servicios típicos con tarifario referencial) y medir la disposición de pago con alternativas de aceptación, incluido un monto máximo. Sin precio, H3 no se puede medir tal como está escrita y no se valida el modelo de negocio.", "AA2: Mostrar el producto antes de preguntar: capturas del flujo de WhatsApp, un mensaje de presupuesto de ejemplo o un tarifario de dos o tres servicios, y no solo una descripción en texto.", "AA2: Agregar preguntas conductuales sobre la última reparación (qué fue, cuánto pagó, cómo encontró al técnico, qué salió mal) y una acción de compromiso (dejar el WhatsApp para el piloto, reservar un cupo).", "AA2: Perfilar al encuestado (tipo de vivienda o negocio, edad o rango, distrito sin opción vacía) y definir muestra, cuotas, canal de difusión y periodo para poder analizar por segmento.", "AA2: Validar el lado del técnico con un instrumento propio (aceptación de la comisión de 20 %, comparación con directorios gratuitos como Champi, riesgo de contratación directa).", "AA2: Aplicar el formulario, publicar resultados con el número de respuestas, análisis por segmento y mejoras concretas al MVP (precio, descuento, canal, cobertura) con la regla de decisión definida antes.", "AA2: Redactar el capítulo 6 completo (las 7 piezas a 3 años) con el ticket del tarifario (≈ S/ 53), no con el ejemplo de S/ 100, y con cotizaciones de movilidad, herramientas y administrador.", "AA2: Recalcular el punto de equilibrio con PE = costos fijos ÷ (precio − costo variable): con ticket S/ 53 y comisión 20 % da 566 servicios/mes (668 netos de IGV); contrastarlo con la capacidad diaria de técnicos y movilidad.", "AA2: Aplicar la encuesta (≥ 100 respuestas) y las 5 entrevistas; llenar la tabla de hipótesis con n, % y decisión.", "AA2: Alinear el informe con el formulario final (15 preguntas, periodo semestral, precio visible) y eliminar notas de edición y la P12 de «monto adicional», que contradice la comisión.", "AA2: Definir quién paga movilidad y herramientas, validar la comisión del 20 % con técnicos y reconciliar la cobertura por recorrido (S/ 80 vs S/ 150).", "AA2: Documentar el MVP real: capturas (Figuras 1 a 5), pasos seguidos, herramienta elegida con tabla comparativa y mejoras derivadas del piloto.", "AA2: Unificar ticket, comisión, movilidad y PE entre caps. 3, 4, 5, 6 y el Excel (Excel descargado: S/ 53; informe: S/ 150; 15 % validado vs 20 % usado; 8 vs 66 servicios por recorrido)."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actuales y confiables, analizadas críticamente para mostrar su aporte al proyecto en relación con megatendencias y ODS.", "falta": "Mejoraron: el capítulo 1 ya no depende de PwC y usa INEI, IEES-SNI, CPI, CENEPRED y TECSUP, con críticas explícitas a sus propios datos. Para llegar a 4 falta pasar las cifras que hoy vienen de prensa (Diario Correo, El Búho, Rumbo Minero, Expreso, Infomercado, La República) a su fuente primaria, sustentar con fuente las megatendencias de tecnología y demografía, citar metas ODS con la ONU y analizar cómo cada fuente aporta al proyecto."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cuantitativa y cualitativa (en la AA1 se aceptan hipótesis rotuladas como tales), y vinculada explícitamente con megatendencias, ODS y necesidades del cliente.", "falta": "Mantiene cifras cuantitativas y vínculo con tres ODS y tres megatendencias, ahora ordenados en secciones. Para llegar a 4 falta separar el problema del cliente y el social con causas y consecuencias, y detallar con más profundidad su vínculo con las necesidades del cliente."}, {"criterio": "Propuesta de valor", "exige": "Una propuesta innovadora y diferenciada, con descripción, ficha técnica, solución, segmentos y casos de uso coherentes con el problema.", "falta": "La ficha del servicio, la segmentación y el diferencial (cobro y garantía de la empresa, recorridos en movilidad) son sólidos y coherentes con el problema. El precio es referencial en la AA1. Falta completar los campos de la ficha oficial que no figuran (presentación, sostenibilidad, redes sociales) y casos de uso centrados en el cliente."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia de los 9 bloques con la propuesta de valor, junto con el análisis de competidores y los indicadores.", "falta": "Hay mapa de empatía con seis cuadrantes, BMC con nueve bloques y competidores muy mejorados. Para llegar a 4 falta argumentar la coherencia entre bloques, recuperar los indicadores con fórmula y el análisis del entorno, y presentar el mapa y el BMC como figuras con título y fuente."}], "viabilidad": {"resumen": "El modelo es más sólido que en la versión anterior: resolvieron quién cobra, cómo se calcula la comisión y cómo se financian la garantía y los descuentos, e incluyeron las alternativas digitales en el análisis. Los riesgos que quedan son más de fondo: que el cliente se salte la plataforma, la relación legal con los técnicos y la dependencia de una movilidad como recurso central.", "riesgos": [{"tema": "Rentabilidad", "titulo": "La comisión podría no cubrir la movilidad y el personal", "choque": "El ejemplo del BMC (S/ 100 de precio, 20 % de comisión, S/ 6 000 de costos fijos y 300 servicios al mes, p. 35) es ilustrativo, pero deja ver el reto: 300 servicios al mes son unos 12 por día hábil, con una movilidad que además capta clientes y debe cubrir tres distritos. La estructura de costos incluye movilidad, combustible, personal administrativo, capacitaciones, seguro de accidentes y fondo de garantía (p. 35), y el descuento por varios servicios también sale de la comisión (p. 11).", "ideas": ["Cotizar movilidad, combustible, herramientas y personal administrativo para Arequipa y reemplazar los S/ 6 000 por un costo fijo real.", "Estimar cuántos servicios por día puede atender una movilidad con dos técnicos, considerando los traslados entre Cayma, Paucarpata y Cerro Colorado.", "Probar en el piloto qué precio promedio y qué comisión aceptan clientes y técnicos."]}, {"tema": "Competencia", "titulo": "Los directorios gratuitos y la contratación directa pueden desplazar a la plataforma", "choque": "Ya incluyeron a Champi, Home Solution y GoChamba, y reconocen que Champi es gratuito, sin comisiones y con contacto directo por WhatsApp (p. 37). El riesgo es que, una vez atendido, el cliente llame directamente al técnico y la comisión desaparezca. Describen controles de precio (p. 12), pero no explican cómo evitarán esa desintermediación en la segunda visita.", "ideas": ["Definir qué ofrece ArreglaYa que el cliente no consigue llamando al técnico: garantía empresarial, reemplazo si el técnico no llega, comprobante, descuento por varios servicios.", "Incluir en el acuerdo con los técnicos una cláusula de no captación directa de los clientes de la plataforma.", "Medir en el piloto cuántos clientes repiten con ArreglaYa y cuántos pasan al técnico directo."]}, {"tema": "Regulación", "titulo": "Relación con los técnicos, comprobantes y responsabilidad", "choque": "La versión anterior mezclaba independientes y «personal técnico»; esta aclara que los técnicos son prestadores de servicios independientes (p. 10), pero habla de técnicos «acompañados o supervisados» por el administrador (p. 10), de «un equipo de técnicos registrados» a quienes ArreglaYa «asigna los trabajos» como «una empresa contratista» (p. 17), y pone movilidad, herramientas y capacitaciones. Con esas condiciones, SUNAFIL podría ver una relación laboral. Además, ArreglaYa cobra, emite el comprobante y responde por la garantía ante el cliente, por lo que el régimen tributario y el seguro no pueden dejarse para después.", "ideas": ["Consultar con un contador y un abogado qué régimen usarán (locación de servicios con RUC, planilla o convenio de prácticas con institutos) y reflejarlo en el modelo.", "Precisar quién emite el comprobante al cliente y cómo se documenta el pago al técnico.", "Estimar el costo del seguro de accidentes y del fondo de garantía con datos reales."]}, {"tema": "Alcance del servicio", "titulo": "El alcance eléctrico es más estrecho que el problema que justifica el proyecto", "choque": "El capítulo 1 se apoya en que «al menos 7 de cada 10 incendios en Arequipa tienen causa eléctrica» (pp. 3, 6) y el ODS 11 se justifica con ese dato, pero el servicio no hace instalaciones nuevas, trabajos en tableros ni inspecciones certificadas (p. 10). Las tareas que sí hace (focos, luminarias, interruptores y tomacorrientes) no son las que más reducen ese riesgo, así que el vínculo entre problema y solución es más débil de lo que presentan.", "ideas": ["Ajustar el planteamiento: el problema central es la desconfianza y la informalidad en reparaciones menores, y el riesgo eléctrico un argumento secundario; o bien ampliar el alcance con técnicos certificados.", "Explicar cómo se deriva al cliente a un especialista certificado y si ArreglaYa recibe algo por esa derivación."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula", "estado": "incompleto", "nota": "Mejoró: incluye carrera y porcentaje de participación (p. 1), pero escribe «ANC0RI» (con cero) y no indica sección ni número de grupo («Grupo: 4 INTEGRANTES»)."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Ahora existe (p. 2) y refleja la numeración. Las páginas están desfasadas desde 2.2.1 (indica p. 14, aparece en la p. 13) hasta 3.3 (indica p. 36, aparece en la p. 35)."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "incompleto", "nota": "El texto (pp. 3-6) es un relato continuo que no separa problema del cliente y problema social. Sí tiene enunciado del problema y objetivo general (pp. 5-6)."}, {"codigo": "1.2–1.3", "apartado": "Problema social (ODS y megatendencias)", "estado": "incompleto", "nota": "Hay ODS 8, 11 y 10 con una cifra cada uno (p. 6) y tres megatendencias (pp. 7-8), pero solo la urbanización tiene fuente y los ODS no citan metas."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Describe el servicio, la plataforma por etapas, la movilidad, el alcance, la verificación de técnicos, la garantía y la comparación con maestros, tiendas y contratistas (pp. 8-13)."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "incompleto", "nota": "Dos fichas, con nueve y diez campos (pp. 13-20). Faltan varios campos oficiales (el precio es referencial en la AA1) (presentación, sostenibilidad, redes sociales). Las tablas no tienen número, título ni fuente."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Seis beneficios concretos (pp. 20-21)."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "Conecta con el capítulo 1 y desarrolla la captación en movilidad y la comunicación por etapas (pp. 21-23), aunque repite contenido de 2.1."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Cinco segmentaciones con distritos, NSE, MYPE y estilos de vida de Arellano, con limitaciones declaradas (pp. 23-29)."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Seis casos con resumen en el anexo 1 (pp. 29-31, 45-47). Dos de ellos (2.6.3 y 2.6.5) son procesos internos y no situaciones del cliente."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Seis cuadrantes en tabla (pp. 31-32), coherentes con el problema. Se repite como imagen en el anexo 2, sin título de figura ni fuente."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Nueve bloques explicados (pp. 32-35) y lienzo en el anexo 3. Falta argumentar la coherencia entre bloques."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Cuatro tipos de competidor con fortalezas, desventajas y ajuste de ArreglaYa, y cuadro comparativo (pp. 35-39). El cuadro no tiene número, título ni fuente."}, {"codigo": "3.x", "apartado": "Indicadores de gestión", "estado": "ausente", "nota": "Estaban en la versión anterior (sin fórmula) y desaparecieron. Solo quedan dos relaciones económicas en el BMC (p. 35). Tampoco está el análisis del entorno interno y externo."}, {"codigo": "—", "apartado": "Referencias APA 7", "estado": "incompleto", "nota": "Orden alfabético, sangría y todas las referencias se citan (pp. 40-44). Predominan notas de prensa y webs comerciales; faltan fuentes primarias para varias cifras, y CEPLAN y ONU."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "El capítulo se reescribió y mejoró: tiene secciones de ODS y megatendencias, enunciado, objetivo y cifras de Arequipa con sus límites explicados. Falta separar el problema del cliente y el social y respaldar con fuente las megatendencias y las metas de los ODS.", "observaciones": [{"severidad": "importante", "titulo": "Problema del cliente y problema social siguen mezclados, sin causas y consecuencias ordenadas", "ubicacion": "«1.1 Planteamiento del problema», pp. 3-6", "cita": "Falta un servicio que conecte estos elementos y ofrezca a los hogares técnicos capacitados, con precios claros y garantía", "problema": "El capítulo se reescribió y es más claro, pero sigue siendo un relato continuo que combina informalidad, vivienda, riesgo eléctrico, empleo juvenil, talento técnico y capacidad de pago (pp. 3-5). No hay un apartado para el problema del cliente y otro para el problema social, cada uno con causas y consecuencias. La síntesis (p. 5) todavía define el problema como la falta de la propia solución, aunque el enunciado de la misma página («¿Cómo pueden los hogares y pequeños negocios de Arequipa acceder a servicios técnicos confiables...?») está mejor planteado.", "mejora": "Dividir 1.1 en «Problema del cliente» y «Problema social». En cada uno, formular el problema sin mencionar la solución y desarrollar causas y consecuencias, por ejemplo en un árbol de problemas presentado como figura numerada. Ubicar las cifras que ya tienen en el apartado que corresponda."}, {"severidad": "sugerencia", "titulo": "Las cifras son todas secundarias; la validación real se exigirá en el capítulo 5", "ubicacion": "pp. 3-5", "cita": "Esto significa que muchos maestros y técnicos trabajan sin precios claros, sin garantía y sin comprobante de pago.", "problema": "Todas las cifras del capítulo son de fuentes secundarias, y la afirmación de que los técnicos informales trabajan «sin precios claros, sin garantía y sin comprobante de pago» (p. 3) es una inferencia sin fuente. Para la AA1 es aceptable plantear estas ideas como hipótesis, siempre que se rotulen como tales.", "mejora": "Rotular esa afirmación como hipótesis del equipo (o respaldarla con una fuente). La validación con clientes reales (entrevistas o encuesta) se exigirá en el capítulo 5 de la AA2."}, {"severidad": "importante", "titulo": "Los ODS no citan metas ni fuente de la ONU", "ubicacion": "«1.2 ODS relacionados», p. 6", "cita": "ODS 8: Trabajo decente y crecimiento económico. ArreglaYa formaliza un servicio que hoy es mayormente informal.", "problema": "Cada ODS está vinculado con cifras del capítulo, lo que es un avance. Pero no se menciona la meta concreta (por ejemplo, la 8.3 sobre formalización de pequeñas empresas o la 11.1 sobre vivienda adecuada), no se cita la ONU y no se relaciona el proyecto con las líneas de investigación de CERTUS. El ODS 11 se sustenta en el riesgo eléctrico, pero el servicio no hace instalaciones nuevas ni inspecciones (p. 10), así que el aporte es menor de lo que se afirma.", "mejora": "Citar la meta específica de cada ODS con la fuente de la ONU o CEPAL, explicar en una oración cómo contribuye el proyecto a esa meta e indicar la línea de investigación CERTUS a la que responde. Moderar el alcance del ODS 11 a lo que el servicio sí cubre."}, {"severidad": "importante", "titulo": "Solo una de las tres megatendencias tiene fuente", "ubicacion": "«1.3 Megatendencias relacionadas», pp. 7-8", "cita": "Según el Centro Nacional de Planeamiento Estratégico (CEPLAN), para 2050 unos 35 millones de peruanos vivirían en zonas urbanas... (La República, 2023).", "problema": "Mejoró: ya no usan el documento de PwC sobre defensa. Pero la urbanización se sustenta con una nota de La República que cita a CEPLAN, y «Auge de la tecnología» y «Cambio demográfico» se describen solo en función del proyecto, sin cifra ni fuente. Así no se demuestra que sean megatendencias, solo se declara.", "mejora": "Citar directamente a CEPLAN (tendencias globales o Perú 2050) para urbanización y cambio demográfico, y una fuente de INEI u OSIPTEL para el uso de WhatsApp y pagos digitales en Arequipa. Para cada megatendencia, agregar una cifra y su consecuencia para el negocio."}, {"severidad": "sugerencia", "titulo": "Varias cifras clave provienen de prensa y no de su fuente primaria", "ubicacion": "pp. 3-5, 7", "cita": "(Diario Correo, 2024); (Diario Correo, 2026); (Infomercado, 2026); (Rumbo Minero, 2026); (El Búho, 2025)", "problema": "El capítulo combina fuentes institucionales sólidas (IEES-SNI, INEI, TECSUP) con notas periodísticas para datos centrales: el 70 % de incendios con causa eléctrica y la responsabilidad del usuario desde el medidor, el 84,8 % de jóvenes informales y el 57,4 % de viviendas adecuadas. Una nota de prensa sirve para ubicar el dato, no para sustentarlo.", "mejora": "Buscar la fuente primaria de cada cifra (Cuerpo General de Bomberos, ENAHO del INEI, MTPE) y dejar la nota solo como apoyo. Si no se encuentra, declarar la limitación en el texto, como ya hicieron en otros casos."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "El capítulo mejoró de forma importante: ficha técnica del servicio, modelo de cobro coherente, selección de técnicos, límites del servicio y segmentación sólida. Falta que los casos de uso muestren al cliente y unificar la relación con los técnicos.", "observaciones": [{"severidad": "sugerencia", "titulo": "La ficha técnica no incluye varios campos oficiales y las tablas no están numeradas", "ubicacion": "«2.2 Fichas técnicas», pp. 13-20", "cita": "7. Condiciones del servicio: Precio según el tarifario referencial por tipo de servicio; comprobante de pago por cada servicio; garantía empresarial cuyo plazo y condiciones se informan antes de contratar", "problema": "Mejoró mucho: la ficha del servicio tiene nueve campos y un proceso en siete pasos, y la de la aplicación quedó separada. Faltan presentación (uniforme, identificación), sostenibilidad (residuos, pinturas) e integración con redes sociales como campos de la ficha. Las tablas no llevan número, título ni fuente. El precio se mantiene como referencial en esta evidencia.", "mejora": "Completar presentación y sostenibilidad en una línea cada una, numerar las tablas («Tabla 1. Ficha técnica del servicio») y agregar la fuente."}, {"severidad": "importante", "titulo": "Dos de los seis casos de uso son procesos internos y no situaciones del cliente", "ubicacion": "«2.6 Ejemplos de casos de uso», pp. 29-31; anexo 1, pp. 45-47", "cita": "2.6.3 Organización y asignación de recorridos y actividades diarias. El administrador ingresa a la plataforma para organizar y programar las actividades de los técnicos", "problema": "Los casos 2.6.3 y 2.6.5 describen el trabajo del administrador y de los técnicos, no una situación vivida por el cliente. Además, los otros casos son descripciones genéricas («un propietario», «una familia»). Un caso de uso debe mostrar una situación real con lugar, problema, qué hace ArreglaYa y resultado.", "mejora": "Reemplazar 2.6.3 y 2.6.5 por escenarios del cliente, por ejemplo: «una familia de Cayma con una fuga y una luminaria malograda paga por Yape y recibe comprobante» o «una peluquería de Paucarpata cambia luminarias antes de abrir», con tiempos y montos estimados."}, {"severidad": "sugerencia", "titulo": "La relación con los técnicos todavía tiene dos versiones", "ubicacion": "pp. 10, 17", "cita": "La plataforma funciona como la de una empresa contratista: ArreglaYa mantiene un equipo de técnicos registrados y les asigna los trabajos según su especialidad y disponibilidad.", "problema": "En 2.1 los técnicos son «prestadores de servicios independientes» que «confirman libremente» (p. 10), pero la ficha de la aplicación dice que ArreglaYa «les asigna los trabajos» y que el administrador «acepta o rechaza a cada técnico» (pp. 17-18). Es un riesgo de coherencia y de regulación.", "mejora": "Elegir una sola descripción (marketplace con técnicos independientes que aceptan trabajos, o empresa con equipo propio) y usarla igual en 2.1, la ficha, el BMC y el cuadro de competidores."}, {"severidad": "sugerencia", "titulo": "La sección 2.4 repite contenido de 2.1 y de las fichas", "ubicacion": "«2.4 Solución a problemas o necesidades específicas», pp. 21-23", "cita": "En conjunto, ArreglaYa responde a la necesidad de acceder a servicios técnicos confiables mediante dos canales complementarios", "problema": "Los recorridos en movilidad, el registro de técnicos, las capacitaciones y las calificaciones por etapas se explican de nuevo en 2.1, en las fichas, en 2.5.5, en 2.6 y en el BMC. Esto alarga el capítulo sin aportar información nueva. Además, la captación en movilidad es un canal y no un valor para el cliente, y 2.4 le dedica casi dos páginas.", "mejora": "Dejar cada tema en un solo lugar y usar remisiones («ver 2.1»). En 2.4 relacionar cada elemento de la propuesta con una causa o consecuencia concreta del capítulo 1."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "Es el capítulo que más avanzó en competidores (cuatro tipos, con fortalezas, desventajas y cuadro comparativo) y mantiene mapa de empatía y BMC. Pierde los indicadores y el entorno, y no argumenta la coherencia entre bloques.", "observaciones": [{"severidad": "importante", "titulo": "Desaparecieron los indicadores de gestión y el análisis del entorno", "ubicacion": "«Capítulo 3», índice (p. 2) y pp. 31-39", "cita": "Supuestos económicos referenciales (a validar en el piloto). Ingreso por servicio = precio promedio del servicio × porcentaje de comisión.", "problema": "La versión anterior tenía seis indicadores (sin fórmula) y un análisis del entorno interno y externo; esta no tiene ninguno de los dos. Solo quedan las dos relaciones económicas del BMC (p. 35), que no son indicadores de gestión. Los lineamientos de la AA1 piden analizar el entorno, y la estructura del capítulo pide indicadores con fórmula y ejemplo de cálculo.", "mejora": "Agregar una tabla de 6 a 8 indicadores (servicios por semana, ticket promedio, comisión por servicio, calificación promedio, tasa de repetición, cumplimiento de garantía, costo por cliente captado) con fórmula, meta y ejemplo de cálculo, y un breve análisis de entorno interno y externo."}, {"severidad": "importante", "titulo": "El BMC está completo, pero no argumenta la coherencia entre bloques", "ubicacion": "«3.2 Business Model Canvas», pp. 32-35; anexo 3, p. 49", "cita": "5. Fuentes de ingresos. ArreglaYa obtiene sus ingresos mediante el cobro de una comisión por cada servicio concretado.", "problema": "Los nueve bloques están explicados y el modelo de ingresos ya es coherente. Pero cada bloque se describe por separado: no se muestra cómo los recorridos (bloque 3) llegan a los segmentos del bloque 1 ni cómo la comisión se conecta con la estructura de costos (bloque 9). Los valores del ejemplo (S/ 100, 20 %) son referenciales y se aceptan en esta evidencia.", "mejora": "Añadir un párrafo que conecte los bloques (segmento, propuesta, canal, ingreso, costo), sin necesidad de cifras definitivas: la tabla de costos y la proyección se desarrollan en el capítulo 6 (AA2)."}, {"severidad": "sugerencia", "titulo": "Las figuras de los anexos 2 y 3 no siguen el formato APA 7 (número de figura y fuente)", "ubicacion": "Anexos 2 y 3, pp. 48-49", "cita": "Anexo 2 Mapa de empatia", "problema": "Los anexos sí están rotulados («Anexo 2 Mapa de empatia» y «Anexo 3. Business Model Canvas (BMC) de ArreglaYa»), pero el rótulo del Anexo 2 no sigue el formato del Anexo 3 (falta el punto después del número y la tilde en «empatía») y ninguna imagen lleva «Figura N.», título descriptivo ni nota de fuente. Además, repiten el contenido de las tablas de 3.1 y 3.2.", "mejora": "Unificar los rótulos («Anexo 2. Mapa de empatía de ArreglaYa»), añadir bajo cada imagen «Figura N. …» con la nota «Elaboración propia» y citar las figuras en el texto del capítulo 3."}, {"severidad": "sugerencia", "titulo": "Los competidores se pueden completar con algunos datos", "ubicacion": "«3.3 Comparación con modelos de negocio existentes», pp. 35-39", "cita": "Promart ... Precio antes de empezar: No verificado", "problema": "Es el apartado más sólido del capítulo. Quedan detalles: el cuadro comparativo no tiene número ni fuente, Promart figura como «No verificado» en precio, no se dimensiona la cobertura de Champi o GoChamba en Arequipa (cuántos técnicos hay) y la afirmación «No se identificó una empresa formal... que combine recorridos en movilidad, captación directa y plataforma» (p. 36) es una hipótesis que conviene respaldar con una búsqueda documentada.", "mejora": "Numerar el cuadro («Tabla 3…»), buscar el precio de Promart o retirarlo, y comprobar cuántos técnicos de Arequipa publican en cada directorio para dimensionar al competidor."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "La presentación mejoró (índice, carátula con carreras, sin consignas, referencias ordenadas). Quedan el apellido del docente mal escrito, tablas y figuras sin título ni fuente, y un estilo con rasgos de texto generado.", "observaciones": [{"severidad": "importante", "titulo": "Carátula con el apellido del docente mal escrito y sin sección ni grupo", "ubicacion": "Carátula, p. 1", "cita": "Docente: ... ANC0RI ... Grupo: 4 INTEGRANTES", "problema": "El apellido del docente figura como «ANC0RI» (con cero) y no se indican la sección ni el número de grupo («Grupo: 4 INTEGRANTES»).", "mejora": "Corregir el apellido e indicar la sección y el número de grupo."}, {"severidad": "importante", "titulo": "Tablas y figuras sin número, título ni fuente", "ubicacion": "pp. 13-20, 31-32, 38-39, 45-49", "cita": "Campo Descripción 1. Nombre Servicio técnico a domicilio ArreglaYa.", "problema": "Las fichas técnicas, el mapa de empatía, el cuadro comparativo y los anexos son tablas o imágenes sin «Tabla N.», «Figura N.» ni nota de fuente. En un trabajo académico APA 7, todas deben tener título y fuente, aunque sea «Elaboración propia».", "mejora": "Numerar y titular cada tabla y figura según APA 7 y citarlas en el texto («como muestra la Tabla 2»)."}, {"severidad": "sugerencia", "titulo": "Índice con páginas desfasadas", "ubicacion": "Índice, p. 2", "cita": "2.2.1 Ficha técnica del servicio ... 14", "problema": "El índice ya existe, lo que mejora la versión anterior. Desde 2.2.1 las páginas están corridas en una (2.2.1 aparece en la p. 13, 2.3 en la 20, 3.1 en la 31 y 3.3 en la 35).", "mejora": "Generar el índice automáticamente desde los estilos de título después de la última edición."}, {"severidad": "sugerencia", "titulo": "Estilo con rasgos de texto generado", "ubicacion": "Todo el informe, en particular pp. 21-23, 36-39 y anexos", "cita": "Ajuste aplicado en ArreglaYa ... Así, ArreglaYa no depende exclusivamente de las solicitudes recibidas por medios digitales", "problema": "La redacción ahora es más uniforme que en la versión anterior (ya no hay dos registros tan distintos). Aun así conserva rasgos frecuentes de texto generado: un molde repetido en cada competidor («Modelo de negocio. Fortalezas. Desventajas para el cliente. Ajuste aplicado...»), explicaciones redundantes entre 2.1, 2.4 y las fichas, y matices defensivos repetidos («Estos valores no son datos del mercado», «se validará durante el piloto»).", "mejora": "Redactar con voz propia y con ejemplos concretos del proyecto, y declarar el uso de herramientas de IA si lo hubo. La sustentación permitirá comprobar que el equipo domina el contenido."}, {"severidad": "sugerencia", "titulo": "Bibliografía: predominan notas de prensa y webs comerciales", "ubicacion": "«Bibliografía», pp. 40-44", "cita": "Diario Correo. (2024, 23 de noviembre). Arequipa: El 70% de incendios son originados por riesgos eléctricos.", "problema": "Mejoró: orden alfabético, sangría francesa y todas las referencias se citan en el texto. Pero la mayoría son notas de prensa (Diario Correo, El Búho, Expreso, La República, Rumbo Minero, Perú Retail, Infomercado) y sitios comerciales. Detalles: «arequipa.app» y «gasfitero.app» aparecen en minúscula en el texto frente a la lista, y algunas URL se cortaron con espacios («POBLA CI%C3%93N», «p or-riesgos»).", "mejora": "Verificar que cada enlace funcione, homogeneizar el autor entre texto y lista y reemplazar la prensa por fuentes primarias cuando existan."}]}, {"etiqueta": "AA2 · Capítulo III", "titulo": "Modelo de negocio: revisión de avance AA2", "resumen": "Avance AA2 (06/11/2026): retroalimentación formativa, sin calificación. Se revisó el capítulo III (mapa de empatía 3.1, BMC 3.2, comparación con modelos existentes 3.3 e indicadores 3.4) con exigencia máxima y en clave AA2, es decir, como base de la proyección financiera del capítulo 6. Avances: se recuperaron los seis indicadores de gestión con fórmula, meta y ejemplo (3.4), la comparación con competidores incluye precios publicados de Sodimac y fuentes con fecha de consulta (3.3) y el BMC explica el flujo de pago (comisión retenida y transferencia al técnico). Los puntos críticos: (1) los supuestos numéricos de 3.2 y 3.4 se contradicen entre sí (con la meta de conversión por recorrido de 5 %, cada recorrido deja S/ 80 de comisión y no los S/ 180 del indicador 6, y alcanzar los 300 servicios del punto de equilibrio costaría más en recorridos que lo que se ingresa); (2) la estructura de costos enumera rubros sin ningún monto, sin supuestos de ingreso neto y con omisiones (IGV, comisiones de Yape/Plin, comprobantes electrónicos, asesoría contable y legal); (3) el mapa de empatía y la ventaja competitiva se afirman sin base ni rótulo de hipótesis; y (4) el lado de los técnicos, que paga la comisión, no tiene ningún supuesto ni validación.", "observaciones": [{"severidad": "critico", "titulo": "Los supuestos de 3.2 y 3.4 son incompatibles: el embudo de recorridos no cubre su propio costo", "ubicacion": "«3.2 BMC · Supuestos económicos referenciales» y «3.4 Indicadores de Gestión», indicadores 2 y 6", "cita": "«S/ 100 ... comisión de 20 % ... 300 servicios al mes» / «4 ÷ 80 × 100 = 5 %» / «S/ 180 ÷ S/ 150 × 100 = 120 %»", "problema": "Con los propios supuestos del capítulo (ticket S/ 100, comisión 20 %, es decir S/ 20 por servicio), el ejemplo del indicador 2 (4 contratos por 80 hogares abordados) deja S/ 80 de comisión por recorrido, no los S/ 180 del indicador 6; frente a un costo de S/ 150 por recorrido la cobertura sería de 53 %, no de 120 %. Para cubrir S/ 150 se necesitan 7,5 servicios por recorrido, es decir, una conversión de 9,4 %, casi el doble de la meta de 5 %. Además, el punto de equilibrio de 300 servicios al mes (6 000 ÷ 20) con conversión de 5 % exigiría abordar 6 000 hogares o negocios al mes, unos 75 recorridos de 80 contactos; a S/ 150 cada uno serían S/ 11 250 mensuales solo en recorridos, más que los S/ 6 000 de costos fijos y que los S/ 6 000 de comisiones. Las metas de los indicadores 2 y 6 no pueden cumplirse a la vez. A ello se suma que la movilidad figura dentro de los costos fijos del punto de equilibrio y también como costo variable por recorrido, con riesgo de doble conteo.", "mejora": "Construir una sola cadena de supuestos con tabla numerada: contactos por recorrido, conversión, ticket, comisión, comisión neta por servicio, costo por recorrido y servicios por recorrido, y derivar de ella las metas de los indicadores 2 y 6 y el punto de equilibrio. Separar costos fijos y variables sin repetir la movilidad. Declarar qué conversión mínima por recorrido hace viable el recorrido y qué hacer si la validación no la respalda (reducir el costo del recorrido, subir el ticket o cambiar de canal)."}, {"severidad": "importante", "titulo": "La «comisión de 20 %» se trata como ingreso, pero el ingreso neto por servicio no está definido", "ubicacion": "«3.2 BMC · 5. Fuentes de ingresos» y ejemplo de supuestos económicos", "cita": "«Una parte de la comisión se destina a un fondo de garantía y a financiar los descuentos por varios servicios en una misma visita, sin reducir el pago del técnico»", "problema": "El texto reconoce que la comisión financia el fondo de garantía y los descuentos por visita integral, pero el ejemplo calcula «cada servicio dejaría S/ 20» como si todo fuera margen. No se estima cuánto sale de esos S/ 20 para garantía, descuento, comisión de Yape/Plin o de la pasarela, IGV (si ArreglaYa emite el comprobante por el total del servicio o solo por su comisión, la base imponible cambia), seguro de accidentes y comprobante electrónico. Tampoco se declara el porcentaje de descuento ni la tasa esperada de reclamos de garantía, de modo que el ingreso neto real por servicio puede ser una fracción de S/ 20 y el punto de equilibrio, mucho mayor que 300.", "mejora": "Presentar una tabla «de S/ 100 cobrados al cliente a S/ X de ingreso neto de ArreglaYa»: pago al técnico, comisión bruta, IGV, comisión de la billetera o pasarela, reserva de garantía (con tasa de reclamo supuesta), descuento por visita integral (con porcentaje) y margen resultante. Aclarar quién emite el comprobante y por qué monto. Esa tabla es el insumo directo del presupuesto de ingresos del capítulo 6."}, {"severidad": "importante", "titulo": "La estructura de costos solo enumera rubros: sin montos, sin clasificación fija/variable y con omisiones", "ubicacion": "«3.2 BMC · 9. Estructura de costos»", "cita": "«alquiler y mantenimiento de la movilidad, combustible, publicidad y material promocional, desarrollo y mantenimiento de la página web, remuneración del personal administrativo, herramientas y equipos, capacitaciones, fondo de garantía, seguro de accidentes ... y otros gastos necesarios»", "problema": "Los rubros de movilidad, herramientas, marketing y garantía están nombrados, pero ninguno tiene monto, unidad (mensual, por recorrido, por servicio) ni clasificación fija/variable, y el cierre «otros gastos necesarios» no es un rubro. Faltan costos que el propio capítulo implica: comisión de cobro por Yape/Plin, emisión de comprobantes electrónicos, asesoría contable y legal (se declaran socios clave, pero no costos), conductor de la movilidad, constitución formal y licencias, verificación de antecedentes de los técnicos y la inversión inicial (herramientas, material publicitario, desarrollo de la plataforma). El ejemplo de «S/ 6 000 de costos fijos» no se descompone en ninguno de estos rubros.", "mejora": "Presentar la estructura de costos como tabla numerada (rubro, tipo, unidad, supuesto y fuente de cotización) y reemplazar «otros gastos» por rubros concretos. Cotizar al menos movilidad, combustible, herramientas, seguro y desarrollo web con proveedores de Arequipa y vincular cada rubro con la actividad clave que lo genera, de modo que el capítulo 6 solo deba proyectar lo ya definido."}, {"severidad": "importante", "titulo": "El lado técnico del modelo de dos lados no tiene supuestos ni validación, y la comisión compite con directorios gratuitos", "ubicacion": "«Coherencia del modelo de negocio» (3.2) y «Competidor 3: plataformas digitales» (3.3)", "cita": "«ArreglaYa opera como un modelo de dos lados ... incorpora técnicos que buscan solicitudes organizadas, pagos trazables y oportunidades de capacitación» / «Champi. Directorio gratuito ... sin comisiones»", "problema": "El texto describe al técnico como segundo segmento, pero el BMC no lo incluye en «Segmentos de clientes» ni en «Relación con los clientes», y no hay supuestos sobre cuántos técnicos se necesitan, cuántos servicios hace cada uno al mes, qué comisión aceptaría ni por qué dejaría de usar un directorio gratuito como Champi, donde conserva el 100 % del cobro. La viabilidad de la comisión de 20 % depende de esa aceptación y no está respaldada. Tampoco se aborda el riesgo de contratación directa en la segunda visita, ya señalado en la revisión anterior.", "mejora": "Agregar al BMC el segmento de técnicos con su propuesta de valor, canal y relación, y estimar la oferta necesaria (técnicos por especialidad y por distrito). Incluir en la validación, aunque sea con una muestra pequeña, la aceptación de técnicos a la comisión y a la exclusividad por servicio. Un indicador adicional (retención de técnicos o repetición del cliente por la plataforma) permitiría detectar la desintermediación."}, {"severidad": "importante", "titulo": "La comparación con la competencia no es de precios ni demuestra una ventaja competitiva verificable", "ubicacion": "«3.3 Comparación con modelos de negocio existentes», cuadro comparativo", "cita": "«Precio antes de empezar: Sí, por tarifario confirmado» (ArreglaYa) / Promart: «No verificado» / «visita inmediata cuando la movilidad está en la zona»", "problema": "Se publican precios de Sodimac (S/ 64,90 grifería; S/ 34,90 luminarias; S/ 25 de reprogramación), pero ArreglaYa no presenta ningún precio equivalente, por lo que el lector no sabe si cuesta más, igual o menos. Para el cliente, además, la comisión de 20 % puede traducirse en un precio mayor que el del maestro independiente o el de los directorios gratuitos, y esto no se analiza. Las ventajas declaradas («visita inmediata», «cercanía barrial», «rapidez») dependen de que haya una movilidad en la zona y no tienen ninguna medición. No se dimensiona la oferta de Champi, Home Solution o GoChamba en Arequipa (cantidad de técnicos), ni se consideran los grupos de WhatsApp o Facebook Marketplace, ni las ferreterías que derivan maestros. El cuadro no tiene número, título ni fuente, y la fila de ArreglaYa coloca la «cobertura inicial en 3 distritos» como limitación sin explicarla.", "mejora": "Agregar una tabla de precios comparables para dos o tres servicios típicos (cambio de grifería, luminaria, destape) con rango del maestro independiente, Sodimac y ArreglaYa (con la fuente y la fecha). Definir la ventaja competitiva con una métrica verificable (por ejemplo, tiempo medio de llegada o precio total con comprobante y garantía) y medirla en la validación. Numerar el cuadro («Tabla 4. …») con su fuente."}, {"severidad": "importante", "titulo": "El mapa de empatía no tiene base real ni está rotulado como hipótesis, y mezcla hogares con negocios", "ubicacion": "«3.1 Mapa de empatía del segmento de clientes de ArreglaYa»", "cita": "«Malas experiencias: quejas de conocidos sobre técnicos que cobraron de más, hicieron un mal trabajo o desaparecieron.»", "problema": "Los seis cuadrantes presentan afirmaciones sobre lo que el cliente siente, oye y ve sin ninguna fuente, entrevista ni dato del propio levantamiento, y sin indicar que son supuestos del equipo. Se construye un único perfil para «hogar o local», cuando el BMC distingue familias, bodegas, restaurantes y peluquerías, cuyas urgencias, presupuestos y dolores difieren (un restaurante pierde ventas si se malogra el gas o la luz; una familia puede postergar un arreglo). El cuadrante «¿Qué dice y hace?» mezcla conducta con dolor, y no se explicita la persona (edad, distrito, ocupación) que representa.", "mejora": "Rotular el mapa como «hipótesis a validar» y contrastarlo con las respuestas de la encuesta (sobre todo las preguntas de búsqueda del técnico y de dificultades), o con dos o tres entrevistas breves. Elaborar un mapa por segmento prioritario (hogar y pequeño negocio) con una persona concreta y presentarlo como figura numerada con su fuente."}, {"severidad": "importante", "titulo": "El segmento no está dimensionado ni priorizado y no se vincula con la cobertura de tres distritos", "ubicacion": "«3.2 BMC · 1. Segmentos de clientes» y cuadro comparativo («Cobertura inicial en 3 distritos»)", "cita": "«hogares y pequeños negocios de Arequipa ... familias, bodegas, restaurantes, peluquerías y tiendas»", "problema": "El bloque define el segmento como todos los hogares y negocios de Arequipa, mientras que la operación inicial es de tres distritos (según el cuadro comparativo y el formulario). No se estima el tamaño del segmento inicial (viviendas y MYPE de esos distritos) ni cuántos servicios por año requeriría, de modo que no se puede contrastar la meta de 300 servicios mensuales con el mercado accesible. Tampoco se elige un segmento de arranque ni se justifican los distritos. Se incluye además como segmento a quien «conoce la empresa mediante los recorridos», que es un canal de captación y no un tipo de cliente.", "mejora": "Delimitar un segmento inicial (por ejemplo, hogares y bodegas de Cayma, Paucarpata y Cerro Colorado), dimensionarlo con datos del INEI o de la Municipalidad y calcular la participación necesaria para llegar a la meta de servicios. Quitar del bloque de segmentos lo que corresponde a canales."}, {"severidad": "importante", "titulo": "Inconsistencias entre el BMC y el modelo operativo del capítulo II (socios, canales, etapas y calificaciones)", "ubicacion": "«3.2 BMC · 3. Canales, 4. Relación, 8. Socios clave» y «3.3 Competidor 2»", "cita": "«se buscarán acuerdos de cooperación con estas empresas para apoyar la capacitación de los técnicos» / «(por WhatsApp en la primera etapa, con registro del administrador, y en el módulo para clientes en la segunda)»", "problema": "El BMC enumera los socios sin incluir a Yape o Plin, de los que depende el cobro y retención del pago, ni al proveedor de comprobantes electrónicos ni a la aseguradora del seguro de accidentes, y no menciona a Sodimac o Promart, con quienes 3.3 anuncia acuerdos. El canal omite que el cliente paga y recibe el comprobante por una vía no descrita (¿QR del administrador?), y la plataforma aparece como canal, recurso y costo («página web») sin indicar la etapa del MVP en que existe cada bloque. Que la calificación del técnico la registre el administrador en la primera etapa introduce un sesgo (quien evalúa es quien cobra la comisión), y el indicador de satisfacción (≥ 85 %) depende de ese registro. Finalmente, el precio «confirmado antes de empezar» por tarifario (3.2) convive con la «visita inmediata» (3.3), sin explicar cómo se fija un precio cerrado sin diagnosticar, que es lo que Sodimac resuelve con visita técnica previa.", "mejora": "Añadir una columna «etapa» al BMC (MVP con WhatsApp y administrador / etapa 2 con módulo), completar los socios con los proveedores de pago, comprobante y seguro, y explicar cómo se cotiza un servicio de precio variable (tarifario por servicio estándar y diagnóstico con costo declarado para el resto). Describir cómo se garantiza que la calificación no la filtre el administrador (por ejemplo, formulario enviado directamente al cliente)."}, {"severidad": "sugerencia", "titulo": "Los indicadores de 3.4 tienen metas sin sustento y un ejemplo que no cumple su propia meta", "ubicacion": "«3.4 Indicadores de Gestión», tabla de seis indicadores", "cita": "«5. Cumplimiento de presupuesto ... ≥ 95 % ... 47 ÷ 50 × 100 = 94 %.»", "problema": "Es un avance restituir los indicadores con fórmula, frecuencia y ejemplo. Sin embargo, el ejemplo del indicador 5 (94 %) incumple la meta (≥ 95 %) sin comentarlo, y ninguna meta (40 %, 5 %, 85 %, 5 %, 95 %, 100 %) tiene referencia ni línea base. No se indica la fuente del dato ni el responsable de medirlo, ni qué decisión se toma al incumplirlos. El texto afirma que las metas se revisan «después de las primeras cuatro semanas», pero no hay un calendario ni un tamaño mínimo de muestra para que esas cuatro semanas sean concluyentes. Falta un indicador de rentabilidad del servicio (margen neto por servicio) y uno de desintermediación.", "mejora": "Añadir las columnas «Fuente del dato», «Responsable» y «Decisión si no se cumple», justificar cada meta con la referencia (resultado de la encuesta o benchmark) y corregir el ejemplo del indicador 5. Incorporar el margen neto por servicio, que conecta directamente con el capítulo 6."}, {"severidad": "sugerencia", "titulo": "Las tablas del capítulo no cumplen APA 7 y la numeración es irregular", "ubicacion": "3.1, 3.3 (cuadro comparativo), 3.4 (indicadores); inicio del texto del capítulo", "cita": "«3.4. Indicadores de Gestión» / «Capítulo 3. Modelo de negocio» / «Competidor 1:»", "problema": "El mapa de empatía, el cuadro comparativo y la tabla de indicadores no tienen «Tabla N.», título ni nota de fuente, observación que ya se había hecho y persiste. Los títulos mezclan estilos («Capítulo 3.», «3.4.» con punto final, «Competidor 1:» sin numeración) y el subtítulo 3.4 desarrolla cada indicador con encabezados «1. Indicador de...» que repiten la tabla sin agregar fórmulas ni criterios. El capítulo comienza con un párrafo sobre el registro de calificaciones por el administrador que corresponde al capítulo II y queda suelto antes del título. El rótulo «Capítulo 3» no coincide con el estilo del capítulo siguiente («CAPÍTULO IIII»).", "mejora": "Numerar y titular todas las tablas y figuras con su fuente («Nota. Elaboración propia»), unificar el sistema de numeración y el estilo de títulos, trasladar el párrafo suelto al capítulo II y condensar las explicaciones por indicador en la propia tabla."}, {"severidad": "sugerencia", "titulo": "Falta enlazar cada bloque del BMC con la hipótesis que lo valida y con el capítulo 6", "ubicacion": "«3.2 BMC · Coherencia del modelo de negocio»", "cita": "«por eso el piloto medirá el ingreso neto por servicio y el costo por recorrido antes de ampliar cobertura»", "problema": "El párrafo de coherencia es un avance, porque declara qué debe medir el piloto, pero no se indica cuándo, con qué tamaño ni cómo se vincula con la encuesta de validación (las hipótesis H1 a H5 no miden ingreso neto ni costo por recorrido). El modelo queda con dos pruebas distintas (piloto y encuesta) sin una secuencia.", "mejora": "Agregar una tabla «bloque del BMC · supuesto crítico · cómo se valida (encuesta, piloto, cotización) · capítulo donde se desarrolla», que permita ver qué se valida ahora y qué queda para el piloto y la proyección financiera."}]}, {"etiqueta": "AA2 · Validación", "titulo": "Objetivos y criterios de éxito: revisión de avance AA2", "resumen": "Avance AA2 (06/11/2026): retroalimentación formativa, sin calificación. Se revisó el apartado 4.1 «Objetivos y criterios de éxito (antes de encuestar)», que en el documento se rotula «CAPÍTULO IIII VALIDACIÓN». Es un buen punto de partida que se fijen hipótesis y umbrales antes de recolectar datos; sin embargo, el apartado todavía no permite juzgar la validez de la validación: los umbrales (60 %, 70 % y 50 %) no tienen justificación ni se asocian a una muestra mínima o a un margen de error; no hay regla de decisión si no se cumplen; las hipótesis miden aceptación declarada y no conducta, y solo del lado del cliente, y no se conectan con los supuestos económicos de 3.2 y 3.4. Además, el texto entregado llega hasta la fila de H1 de la tabla de hipótesis, por lo que las columnas «Objetivo de la encuesta» y «Criterio de éxito» de H2 a H5 se evaluaron según lo reportado en la revisión del formulario. En la estructura del TAP la validación es el capítulo 5 y el capítulo 4 es el MVP, que todavía no figura en el documento.", "observaciones": [{"severidad": "critico", "titulo": "Los criterios de éxito (60 %, 70 %, 50 %) no tienen justificación ni muestra mínima asociada", "ubicacion": "«4.1 Objetivos y criterios de éxito», columna «Criterio de éxito»", "cita": "«Al menos el 50 % manifiesta estar dispuesto o muy dispuesto a contratar el servicio con el precio presentado en la encuesta»", "problema": "Los umbrales se enuncian como porcentajes sin explicar por qué ese valor demuestra viabilidad (¿por qué 50 % y no 30 % o 70 %?), sin una referencia (estudios, benchmarks, punto de equilibrio) y sin vincularlos con la muestra. Un porcentaje sobre pocos casos es muy inestable: con 30 encuestas, un resultado de 60 % tiene un margen de error de aproximadamente ±17,5 puntos (95 % de confianza), con 50 sería ±13,6 y con 100 ±9,6; con tan pocos casos un 55 % y un 65 % no se distinguen del umbral. Tampoco se relacionan con el tamaño del mercado: no se indica a qué población se generaliza (hogares y MYPE de los tres distritos), ni cuántos clientes harían falta para sostener los 300 servicios mensuales del punto de equilibrio. Además, el criterio se calcula «sobre el total» y no por segmento, de modo que hogares y negocios pueden compensarse.", "mejora": "Justificar cada umbral con su fuente o con el punto de equilibrio (por ejemplo, «para llegar a 300 servicios se necesita convertir X % del segmento»), establecer la muestra mínima (cantidad total y por segmento y distrito) con el margen de error aceptado y reformular los criterios en términos del intervalo de confianza (por ejemplo, «el límite inferior supera 50 %»). Calcular los resultados por segmento."}, {"severidad": "importante", "titulo": "Las hipótesis no son plenamente falsables ni están operacionalizadas", "ubicacion": "«4.1», tabla de hipótesis", "cita": "«H1. Existe una necesidad frecuente de servicios técnicos a domicilio.»", "problema": "H1 usa «frecuente» sin definirlo (¿una vez al semestre?, ¿al mes?), y su criterio no indica qué respuesta cuenta como éxito. «Necesidad» y «frecuente» se miden con la pregunta del formulario, pero el texto no vincula hipótesis, pregunta, opción de respuesta y fórmula de cálculo. Tampoco se declara qué resultado refutaría cada hipótesis. Una hipótesis falsable tiene variable, población, umbral, periodo y condición de rechazo, y hoy la tabla solo ofrece un enunciado y un porcentaje. En el texto recibido, además, la tabla se interrumpe en H1 y no se pueden verificar los objetivos de H2 a H5.", "mejora": "Completar la tabla con las columnas: hipótesis, variable, pregunta del formulario, opción(es) que cuentan, fórmula del indicador, umbral, condición de rechazo y decisión asociada. Definir «frecuente» con un periodo y una frecuencia concretos."}, {"severidad": "importante", "titulo": "No hay regla de decisión: no se dice qué cambia si una hipótesis no se cumple", "ubicacion": "«4.1», segundo párrafo", "cita": "«Los criterios de éxito se definen previamente para determinar si la propuesta responde a las necesidades del mercado y cuenta con aceptación por parte de los clientes potenciales.»", "problema": "El párrafo define los criterios solo para dar un resultado de «cumple/no cumple», pero no establece qué decisión se toma en cada caso. No se indica, por ejemplo, qué hará el grupo si H3 (precio) se cumple con 40 % y no con 50 %, ni si fallar H5 elimina la visita integral del MVP, ni cuándo la propuesta se replantea. Sin una regla previa, la interpretación quedará condicionada por el resultado, que es justamente lo que el registro previo de hipótesis busca evitar. La rúbrica de nivel Sobresaliente exige mejoras al MVP derivadas del análisis crítico, algo que solo es posible si cada hipótesis está ligada a una decisión.", "mejora": "Agregar una tabla «si se cumple / si no se cumple» por hipótesis, con la acción asociada sobre el MVP, el precio, la comisión o la cobertura. Incluir un umbral de descarte (por ejemplo, si H3 queda por debajo de 30 %, se revisa el modelo de ingresos)."}, {"severidad": "importante", "titulo": "Las hipótesis H1 a H5 no se conectan con los supuestos económicos ni con los indicadores del capítulo III", "ubicacion": "«4.1» frente a «3.2 · supuestos económicos» y «3.4 · indicadores 1 y 2»", "cita": "«Conversión de recorridos ... ≥ 5 %» frente a un criterio de aceptación de ≥ 50 % con el precio presentado", "problema": "El capítulo III basa la viabilidad en una comisión de 20 %, un ticket de S/ 100, conversión de solicitudes ≥ 40 % y conversión de recorridos ≥ 5 %, pero la validación no prueba ninguno de esos supuestos: no hay hipótesis sobre el ticket aceptado en relación con el pago por Yape o Plin, sobre el interés en recibir visitas en movilidad ni sobre el comportamiento de repetición. Tampoco se explica cómo el 50 % de disposición declarada se convierte en el 5 % de conversión de recorridos; esa brecha entre intención y contratación no se modela. Todas las hipótesis son del cliente, y la hipótesis de que el técnico acepte la comisión y trabaje con ArreglaYa, de la que depende el modelo de dos lados, no está planteada.", "mejora": "Derivar las hipótesis de los supuestos críticos del BMC (ticket, comisión, canal de recorridos, descuento por visita integral, aceptación del técnico) y mostrar en una tabla cómo cada criterio de éxito alimenta una variable del capítulo 6. Incluir un factor de ajuste entre intención declarada y contratación real (por ejemplo, tomar solo las respuestas «muy dispuesto»)."}, {"severidad": "importante", "titulo": "El método de validación está ausente: población, muestreo, instrumento, periodo y plan de análisis", "ubicacion": "«4.1» y apartados siguientes (no existen)", "cita": "«Antes de aplicar las encuestas, ArreglaYa establece las hipótesis que busca comprobar»", "problema": "Más allá de lo observado en el formulario, el capítulo no declara la población objetivo (hogares y MYPE de los tres distritos), el tamaño de la muestra y su justificación, el tipo de muestreo (probabilístico, por cuotas o por conveniencia), los canales de difusión (si es solo WhatsApp y redes del equipo, la muestra se sesga hacia conocidos), el periodo de aplicación, los criterios de depuración de respuestas, el tratamiento de datos personales ni el plan de análisis (frecuencias, cruces por segmento, intervalos de confianza). Con un muestreo por conveniencia los resultados no pueden presentarse como representativos del mercado ni usarse para proyectar ingresos.", "mejora": "Redactar un apartado de metodología: población y marco muestral, tamaño de muestra con su cálculo, cuotas por segmento y distrito, método y canales de difusión, periodo, instrumento (anexar el formulario final), criterios de exclusión y plan de análisis, y declarar las limitaciones por sesgo de selección y de aquiescencia."}, {"severidad": "importante", "titulo": "La validación se limita a intención declarada y no incluye una prueba de conducta sobre el MVP", "ubicacion": "«4.1» y «3.2 · Coherencia del modelo de negocio» («el piloto medirá ...»)", "cita": "«a contratar el servicio con el precio presentado en la encuesta»", "problema": "Todos los criterios se miden con una encuesta, es decir, con lo que la persona dice que haría. El BMC, en cambio, remite la medición decisiva (ingreso neto, costo por recorrido) a un «piloto» que no se planifica. La encuesta no permite saber si el cliente aceptaría un técnico desconocido ni si pagaría por Yape y esperaría a la visita. Con exigencia de nivel AA2, la validación debería incluir al menos una prueba conductual de bajo costo (preventa, lista de espera, solicitudes reales por WhatsApp con una oferta concreta, o 5 a 10 servicios piloto), con una métrica y un umbral.", "mejora": "Incorporar una segunda etapa de validación conductual (por ejemplo, un piloto concierge de dos semanas en un distrito, con los indicadores 1, 2 y 6 de 3.4) y definir en el capítulo 4 qué funciones del MVP se prueban con la encuesta y cuáles con el piloto."}, {"severidad": "importante", "titulo": "«Antes de encuestar» no es verificable y la numeración no corresponde a la estructura del TAP", "ubicacion": "Título «CAPÍTULO IIII VALIDACIÓN» y apartado «4.1»", "cita": "«CAPÍTULO IIII VALIDACIÓN» / «4.1 OBJETIVOS Y CRITERIOS DE ÉXITO (ANTES DE ENCUESTAR)»", "problema": "El rótulo «IIII» no es un número romano válido (corresponde a IV), y la validación está numerada como 4.1, pero en la estructura del TAP el capítulo 4 es el MVP y la validación es el capítulo 5; en el documento no existe aún un capítulo 4 (MVP), de modo que el contenido que debería sustentar qué se valida (funcionalidades, objetivos del MVP) no tiene dónde apoyarse. Por otro lado, el título afirma que los criterios se fijaron antes de encuestar, pero el formulario ya existe y no hay fecha, versión ni evidencia de que los umbrales precedan a la recolección; un criterio escrito después de ver resultados pierde su valor como prueba.", "mejora": "Renumerar según el TAP (cap. 4 MVP y cap. 5 Validación, con 5.1 Objetivos e hipótesis, 5.2 Metodología, 5.3 Resultados, 5.4 Análisis y mejoras al MVP) y agregar la fecha de elaboración de las hipótesis y de la versión del formulario, congelando los umbrales antes de aplicar la encuesta."}, {"severidad": "sugerencia", "titulo": "Redacción y formato del apartado 4.1", "ubicacion": "«4.1», primer párrafo y tabla de hipótesis", "cita": "«busca comprobar,estas se relacionan con las necesidades»", "problema": "Hay errores de puntuación («comprobar,estas»), el título está en mayúsculas sostenidas con un estilo distinto del resto del informe y la tabla de hipótesis no tiene número, título ni fuente (APA 7). La introducción dice que las hipótesis «se relacionan con las necesidades ... la confianza ... la aceptación», pero no dice cuáles corresponden a cada tema ni a qué decisión sirven. Se emplea «ArreglaYa establece» (sujeto empresa) y no una redacción impersonal propia del informe.", "mejora": "Corregir la ortografía y el estilo del título, numerar y titular la tabla («Tabla 5. Hipótesis, objetivos y criterios de éxito de la validación», con la nota de fuente) y reescribir la introducción en forma impersonal con una frase por cada hipótesis."}, {"severidad": "sugerencia", "titulo": "Los criterios deben distinguirse por segmento y por tipo de respuesta", "ubicacion": "«4.1», columna «Criterio de éxito»", "cita": "«Al menos el 60 % muestra preferencia por contratar varios servicios en una sola visita»", "problema": "Se plantean porcentajes globales («al menos el 60 %») sin precisar si se calculan sobre todos los encuestados, sobre quienes tuvieron necesidad en el periodo o sobre quienes están dispuestos a pagar. Un denominador distinto cambia por completo la conclusión (por ejemplo, el 60 % de quienes necesitaron un servicio frente al 60 % de la muestra completa, incluidos quienes respondieron «Ninguna vez»).", "mejora": "Declarar para cada criterio el denominador (total de la muestra o filtrado), las opciones que cuentan como éxito (por ejemplo, 4 y 5 en una escala de 5) y los cruces por segmento (hogar y pequeño negocio) y por distrito."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Formulario de validación del MVP y del modelo de negocio", "resumen": "Instrumento mejorado en coherencia con el servicio, pero todavía incompleto para validar el modelo: sin precio, sin disposición de pago, sin prototipo, sin lado del técnico y sin resultados.", "observaciones": [{"severidad": "critico", "titulo": "No hay precio ni disposición de pago: H3 sigue sin poder medirse", "ubicacion": "Pregunta sin numerar tras la P9 (intención de contratar) y preguntas 12–14; hipótesis H3 del apartado 4.1", "cita": "«Si contrataras un servicio técnico a través de ArreglaYa y recibieras un presupuesto claro antes de iniciar el trabajo, ¿estarías dispuesto(a) a contratarlo?»", "problema": "El criterio de H3 exige aceptación «con el precio presentado en la encuesta», pero ninguna pregunta presenta un precio, un tarifario ni un rango, ni pregunta cuánto pagaría o qué precio le parecería caro o barato. La opción «Tal vez, dependería del precio y del tipo de reparación» lo reconoce: el encuestado no tiene el precio. Tampoco se pregunta cuánto pagó por su última reparación, de modo que no hay línea base para comparar. Como el modelo de ingresos es una comisión del 20 % sobre el precio, sin esta información no se puede valida
