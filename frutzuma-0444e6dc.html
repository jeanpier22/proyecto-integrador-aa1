<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.scorebox { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

 frases dirigidas al evaluador dentro del texto, el índice sin el apartado 3.4.1, referencias fuera de orden alfabético y la fecha de la carátula sin actualizar.", "fortalezas": ["Resolvieron las contradicciones señaladas: vida útil «Objetivo comercial: 4 meses... condicionado a estudio de vida útil» (Tabla 4), sin versión con azúcar añadida ni acesulfame («no forman parte de la propuesta actual») y tres sabores coherentes en la Tabla 3 y el 2.1.", "El capítulo 1 ahora dimensiona el problema social con cifras oficiales: 8 994 762 toneladas de residuos sólidos municipales en 2024 (MINAM, 2025) y más de 12 millones de toneladas de alimentos perdidos o desperdiciados (FAO, 2026), vinculadas a las metas 3.4, 12.3 y 12.5 (Tabla 2) y a dos megatendencias de CEPLAN (2023). Además, cada dato se acompaña de lo que no prueba, y reconocen la tensión del sachet con el ODS 12 (1.2, último párrafo).", "La Tabla 10 incorpora la columna «Precio por litro preparado» (Naturale S/ 3,27/L; Zuko S/ 0,60/L si rinde 2 L) y el párrafo final del 3.3 reconoce con honestidad que «a S/ 2,00/L... FRÚTZUMA no aspira a ganar por precio» y propone una prueba de sabor a ciegas frente a Zuko en la AA2.", "El capítulo 3 se completó: 3.3 cierra con ventaja competitiva y estrategia de diferenciación, la Tabla 12 añade un ejemplo de cálculo por indicador (marcado como no real), el FODA tiene cuatro estrategias y el 3.4.1 separa la planificación del equipo.", "Recuperaron contenido perdido en la v2: la columna «Validación» de la Tabla 7, las filas de funcionalidad, sostenibilidad y redes sociales de la Tabla 4, el proceso en la Tabla 6 y las redes concretas del canal (Instagram, TikTok, Facebook, WhatsApp Business).", "AA2: Hay filtro de segmento: «Lugar de residencia» (Arequipa / Otro departamento del Perú) y «¿En qué rango de edad te encuentras?» (la opción «Más de 46 años» termina la encuesta), más la pregunta «Ocupación» (Estudias / Trabajas / Ambos), coherentes con el segmento de 18 a 45 años del in  y marcar como obligatorias las preguntas clave.", "AA2: Aplicar el instrumento a muestra real del segmento, presentar tablas de resultados con n, y proponer mejoras concretas al MVP a partir de los datos (cap. 5).", "AA2: Desarrollar el cap. 6 completo (7 piezas, 3 años, VAN/TIR/PRI), empezando por la ficha de costeo por sachet con receta y 2 cotizaciones: sustentar o corregir los S/ 0,70 y fijar el margen por canal (con ese costo: sachet 30 %, kit 6 23,6 %, kit 12 20 %).", "AA2: Recolectar datos reales (encuesta rediseñada a n ≥ 50, 8–10 entrevistas y cata de los 3 sabores) y redactar el cap. 5 con muestra, resultados (n y %), conclusiones con métricas y mejoras al MVP.", "AA2: Corregir el formulario antes de seguir aplicándolo: probar S/ 1,00 / 5,50 / 10,50, incluir rangos menores a S/ 1,00, retiro en cafetería, agua potable y competidores; eliminar el kit de 24.", "AA2: Agregar al cap. 4 una sección de herramientas (formulario, WhatsApp Business, maquila o selladora, laboratorio) con justificación, los pasos seguidos y criterios de éxito numéricos por hipótesis (p. ej. ≥ 60 % acepta S/ 1,00).", "AA2: Calcular el punto de equilibrio con costos fijos y variables listados (CF ÷ (P − CVu)), incluyendo la comisión de las cafeterías, y compararlo con la demanda validada.", "AA2: Presentar evidencia técnica de la vida útil (estabilidad a 0, 30, 60 y 120 días) o declarar una vida útil comprobada menor, y presupuestar laboratorio y rotulado en la inversión.", "AA2: Integrar los costos fijos de Producción (S/ 3 310/mes = S/ 39 720/año) en egresos, flujo, PE y capital de trabajo, y rehacer VAN/TIR/PRI y la conclusión de viabilidad (con el costo completo el PE ≈ 57 924 > capacidad 48 000).", "AA2: Cap. 5: declarar n y muestreo, ampliar a n ≥ 50, contrastar H1–H3 con sus metas (sabores 47/26/47 % vs 85/75/60 %), corregir «68,4 % muy práctico» (26,3 % en 5) y derivar mejoras explícitas al MVP; añadir entrevistas reales.", "AA2: Sustentar los costos variables con receta y 2 cotizaciones, evitar doble conteo de mano de obra y retirar «azúcar» si la fórmula es sin azúcar; modelar kits y el descuento del canal bodega.", "AA2: Cuadrar demanda con SOM y capacidad, y cerrar el financiamiento (aporte vs. S/ 24 819,78 del flujo financiero).", "AA2: Cap. 4: sección de herramientas, MoSCoW completo, pasos seguidos y reponer H4 de portabilidad; decidir planta propia o maquila.", "AA2: Actualizar caps. 2–3 (precio, kits, canal), unificar el pitch (3.6 y 6.15, este con texto corrupto) y corregir portada, índice y nombres de sabores."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, con análisis crítico de lo que aportan al proyecto en torno a megatendencias y ODS.", "falta": "Cumple: fuentes oficiales de 2023 a 2026 (CEPLAN, INEI, MINAM, FAO, OMS, OSIPTEL, ONU), analizadas con criterio y vinculadas a las metas 3.4, 12.3 y 12.5. Para sostener el nivel, verificar que la cifra de Arequipa (9,1 %, INEI 2026) figure en la nota citada, porque la referencia habla de un incremento nacional de 1,3 %, y que la URL del informe de enfermedades no transmisibles corresponda a 2025 y no a 2024; añadir un dato del mercado de bebidas."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencias cualitativas y cuantitativas, con vínculo con megatendencias, ODS y necesidades del cliente.", "falta": "Cumple: la parte cuantitativa y el vínculo con ODS y megatendencias están bien, y las hipótesis sobre el cliente son aceptables en la AA1. Para llegar al nivel sobresaliente falta formular el problema del cliente con claridad en el 1.4 (quién, cuándo, qué pierde) y añadir una cifra del mercado de bebidas o del consumo fuera del hogar."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Todos los elementos están y ahora son coherentes entre sí. El diferencial (dosis personal, tres mezclas y retiro agrupado) sigue siendo una hipótesis que el propio informe no presenta como exclusiva, en una categoría cercana a las de baja innovación del Anexo 2; falta demostrarlo con datos."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia entre los nueve bloques y la propuesta de valor.", "falta": "BMC de nueve bloques, coherencia por pares (3.2.1), competidores con precio por litro, ventaja competitiva e indicadores con ejemplo. Falta retirar el marcador de plantilla del cuadrante «Dice y hace» del mapa de empatía y completarlo con frases hipotéticas del segmento."}], "viabilidad": {"resumen": "La v3 es más cautelosa y quita las decisiones de formulación más riesgosas (azúcar añadida y acesulfame). El choque más fuerte sigue siendo el registro sanitario; los costos y márgenes se trabajarán en el cap. 6 (AA2), por lo que el precio es referencial.", "riesgos": [{"tema": "Regulación", "titulo": "Registro sanitario, HACCP y rotulado", "choque": "Un concentrado envasado con vida útil de 4 meses necesita registro sanitario, análisis de laboratorio acreditado, plan HACCP y rotulado conforme al Manual de Advertencias Publicitarias. Incluso la versión «sin azúcar añadida» contiene azúcares libres según la OMS (2026), como el propio informe indica.", "ideas": ["Averiguar en DIGESA el costo y plazo del registro y sumarlos al costeo de la AA2.", "Consultar a un tecnólogo de alimentos para simular el rotulado de cada formulación.", "Buscar una maquila de Arequipa con habilitación sanitaria y HACCP."]}, {"tema": "Costos", "titulo": "Costos y margen por definir en el cap. 6", "choque": "El precio de S/ 1,00 por sachet es referencial; la tabla de costos, gastos y egresos corresponde al cap. 6 (AA2). Se anticipa que el envase de barrera, el lote mínimo y el laboratorio influirán en el margen.", "ideas": ["Obtener cotizaciones de maquila y de envase para el cap. 6.", "Calcular el margen por canal (retiro propio frente a cafetería)."]}, {"tema": "Competencia", "titulo": "Competidores con sachets y atributo copiable", "choque": "Naturale y FIFU ya venden sachets y el atributo diferencial es copiable.", "ideas": ["Hacer la prueba ciega de sabor en la AA2.", "Probar un diferencial más difícil de copiar, como frutas regionales."]}, {"tema": "Adopción", "titulo": "Se necesita agua segura y un recipiente", "choque": "El informe lo reconoce (Tabla 1, caso 1), pero aún no define si el cliente lleva botella o agua. Sin esa respuesta se pierde la practicidad frente a una bebida lista.", "ideas": ["Plantear la pregunta sobre agua y recipiente como hipótesis y contrastarla en la AA2.", "Empezar el piloto en institutos u oficinas con dispensadores."]}, {"tema": "Operación", "titulo": "Vida útil objetivo y puntos de retiro", "choque": "La vida útil de 4 meses es un objetivo sin estudio de estabilidad, y los puntos de retiro dependen de cafeterías que todavía no han sido consultadas.", "ideas": ["Consultar a un laboratorio universitario por un estudio acelerado.", "Conversar con dos o tres cafeterías sobre comisión y almacenamiento."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "completo", "nota": "Ya incluye carrera, sección (M394) y grupo 7; la fecha sigue siendo 30 de octubre."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Contiene una instrucción de Word dirigida al lector («regenera la tabla de contenido desde Referencias»), agrupa «2.3–2.4» aunque son apartados separados y omite el 3.4.1."}, {"codigo": "—", "apartado": "Introducción", "estado": "completo", "nota": "Presenta propósito, alcance y estructura, y advierte que no se atribuyen testimonios."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "completo", "nota": "Tabla 1 con causas y consecuencias; se presenta como hipótesis, aceptable en la AA1."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "Cifras de MINAM (2025), FAO (2026) e INEI (2026), metas 3.4, 12.3 y 12.5 (Tabla 2) y megatendencias de CEPLAN."}, {"codigo": "1.3", "apartado": "Megatendencia, oportunidad comercial y pregunta", "estado": "completo", "nota": "Incluye precios de sustitutos y la pregunta central."}, {"codigo": "1.4", "apartado": "Definición del problema", "estado": "incompleto", "nota": "Define una brecha por investigar y no formula con claridad el problema del cliente (quién, cuándo, qué pierde)."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Tres sabores y diferenciación coherentes; el diferencial no se declara exclusivo."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Tabla 4 con sostenibilidad, redes, funcionalidades y pruebas; precio (2.2.1) y proceso (2.2.2) completos."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Cinco beneficios en un solo párrafo, vinculados a la Tabla 1."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "La Tabla 7 recuperó la columna de validación."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Segmentación 2.5.1 a 2.5.6."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Seis casos breves."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "incompleto", "nota": "Tabla 8 con hipótesis; «Dice y hace» mantiene un marcador de posición de plantilla."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Tabla 9, Figura 1 y coherencia por pares en 3.2.1."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Tabla 10 con precio por litro, ventaja competitiva y estrategia de diferenciación."}, {"codigo": "3.4", "apartado": "FODA", "estado": "completo", "nota": "Con cuatro estrategias; la planificación del equipo pasó al 3.4.1."}, {"codigo": "3.5", "apartado": "Indicadores de gestión", "estado": "completo", "nota": "Cinco indicadores con fórmula, meta, frecuencia y ejemplo de cálculo."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Todas las fuentes se citan, pero las entradas no están en orden alfabético y dos de Tottus Perú (s. f.) necesitan a/b."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Mejora el problema social, que ahora tiene datos oficiales, y se mantiene la separación entre problema del cliente y problema social. Las hipótesis sobre el cliente son aceptables en esta AA1; falta formular con claridad el problema en el 1.4.", "observaciones": [{"severidad": "sugerencia", "titulo": "Rotular las entrevistas del anexo como hipótesis y validarlas en la AA2", "ubicacion": "Introducción; 1.1, Tabla 1; Anexo", "cita": "Incluye tres entrevistas simuladas para orientar el trabajo de campo", "problema": "El informe declara con claridad que las tres entrevistas del anexo son simuladas y que no se usan en los capítulos 1 a 3; esto es aceptable en la AA1 y no constituye falta de integridad. Conviene presentarlas como hipótesis de trabajo.", "mejora": "Rotular el anexo como hipótesis de trabajo y, en el cap. 5 (AA2), validarlas con personas reales de Arequipa, con fecha, lugar, código anónimo y consentimiento."}, {"severidad": "importante", "titulo": "El 1.4 describe lo que se estudiará y no formula el problema del cliente", "ubicacion": "1.1 (primer párrafo) y 1.4", "cita": "aún no se ha demostrado si estas alternativas satisfacen a quienes buscan preparar una bebida de sabor frutal", "problema": "Las cautelas son valiosas, pero el 1.4 no define el problema del cliente de forma concreta (qué le ocurre, con qué frecuencia, qué pierde): describe lo que el grupo estudiará. Aunque se plantee como hipótesis, la definición debe ser una afirmación clara.", "mejora": "Redactar el 1.4 como una hipótesis explícita, por ejemplo: «Los estudiantes y trabajadores de 18 a 45 años de Arequipa no preparan bebidas fuera de casa porque...», y dejar la incertidumbre para el plan de validación de la AA2."}, {"severidad": "importante", "titulo": "Falta una cifra del mercado o del consumo fuera del hogar en Arequipa", "ubicacion": "1.1 y 1.3", "cita": "no representa una medida de demanda del producto", "problema": "Las cifras del INEI sobre consumo de fruta, exceso de peso y población ocupada se aclaran como contexto, no como demanda. Siguen sin aparecer el tamaño o crecimiento del mercado de bebidas o refrescos ni el gasto fuera del hogar. El dato del estudio de Guzman-Vilca et al. (2022) proviene de 2017-2018.", "mejora": "Agregar una o dos cifras recientes del mercado de bebidas (INEI-ENAHO, Euromonitor o Kantar, citadas en APA) y la población de 18 a 45 años que estudia o trabaja en Arequipa."}, {"severidad": "sugerencia", "titulo": "Verificar la cifra de Arequipa del INEI y la referencia", "ubicacion": "1.1, tercer párrafo; Referencias", "cita": "la población ocupada de la ciudad de Arequipa aumentó 9,1 %", "problema": "La referencia citada se titula «Población ocupada a nivel nacional se incrementó 1,3 %...» y no está claro que la nota contenga el dato de la ciudad de Arequipa. La otra referencia del INEI dice 2025 en el título y 2024 en la URL.", "mejora": "Comprobar que ambos datos figuren en el documento citado, corregir la URL si corresponde y citar la tabla o página exacta."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "Los apartados están completos y ya no se contradicen. El diferencial sigue en el plano de la hipótesis.", "observaciones": [{"severidad": "critico", "titulo": "El diferencial sigue sin demostrarse y se declara no exclusivo", "ubicacion": "2.1, tercer párrafo; 3.3, ventaja competitiva", "cita": "Esta combinación no se presenta como exclusiva hasta contrastarla", "problema": "El informe reconoce que Naturale y FIFU ya comercializan sachets y que la combinación de tres sabores mixtos, dosis para 500 ml y retiro agrupado «todavía no demuestra exclusividad». Los concentrados y refrescos están cerca de la categoría de baja innovación del Anexo 2 de los lineamientos, por lo que se necesita una diferenciación comprobada, no solo planteada.", "mejora": "Elegir el atributo más fuerte y respaldarlo con datos del prototipo: prueba ciega frente a Zuko y Naturale, disposición a pagar, y un atributo más difícil de imitar (frutas regionales, venta institucional). Anotar el resultado en la AA2."}, {"severidad": "sugerencia", "titulo": "Redacción dirigida al evaluador y exceso de salvedades", "ubicacion": "Introducción; 2.2 (nota de la Tabla 4); Anexo", "cita": "El docente solicita más entrevistas reales para acreditar evidencia cualitativa.", "problema": "Algunas frases le hablan al docente y no al lector (en el anexo: «El docente solicita...»). Casi todos los párrafos repiten que algo es una hipótesis o que «no se afirma», lo que resta claridad sobre qué decidió el equipo.", "mejora": "Reunir las limitaciones en un párrafo y redactar el resto con decisiones claras; quitar las referencias directas al docente."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "BMC argumentado, competidores comparables por litro, ventaja competitiva, FODA e indicadores con ejemplo. Falta que el mapa de empatía tenga voz del cliente.", "observaciones": [{"severidad": "sugerencia", "titulo": "Completar el cuadrante «Dice y hace» del mapa de empatía", "ubicacion": "3.1, Tabla 8", "cita": "[Espacio para incorporar dos o tres frases literales de los entrevistados, con códigos E01–E10 y fecha.]", "problema": "El cuadrante «Dice y hace» conserva un texto de plantilla. Con hipótesis basta en la AA1, por lo que no afecta el nivel del criterio; conviene completarlo.", "mejora": "Completar el mapa con dos o tres frases hipotéticas del segmento por cuadrante clave, rotuladas como supuestos del grupo, y quitar el marcador."}, {"severidad": "sugerencia", "titulo": "BMC: canales y cafeterías con doble rol", "ubicacion": "3.2, Tabla 9; 2.5.6", "cita": "cafeterías: puntos de retiro o compradoras mayoristas, según contrato", "problema": "Las cafeterías aparecen como canal (Tabla 9) y como cliente secundario (2.5.6). La Figura 1 repite celdas combinadas que no se distinguen en la maquetación.", "mejora": "Precisar si la cafetería es canal o cliente y su rol en los ingresos; revisar el título y el formato de la Figura 1 según APA 7."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Carátula completa y todas las fuentes citadas. Quedan instrucciones de Word en el texto, un índice incompleto y referencias sin ordenar.", "observaciones": [{"severidad": "importante", "titulo": "Índice con instrucciones de Word y apartados faltantes", "ubicacion": "Índice", "cita": "Índice de consulta de esta versión. Los apartados utilizan estilos de título de Word; si se modifica el contenido, regenera la tabla de contenido desde Referencias → Tabla de contenido.", "problema": "Es una instrucción dirigida a quien edita, no al lector. El índice agrupa «2.3–2.4» (en el cuerpo son apartados separados), omite el 3.4.1 y el 1.3 figura con otro nombre; los números de página no se pueden contrastar con el cuerpo del DOCX.", "mejora": "Generar el índice automático, eliminar la nota y comprobar los números de página en el PDF final."}, {"severidad": "importante", "titulo": "Referencias fuera de orden y con entradas ambiguas", "ubicacion": "Referencias bibliográficas", "cita": "Tottus Perú. (s. f.). Bebida instantánea en polvo Zuko naranja... / Tottus Perú. (s. f.). Zuko: bebidas instantáneas...", "problema": "Las entradas de Procefrut Perú, OSIPTEL, OMS, Osterwalder y Pigneur, y Vivanda aparecen después de Wong y Tottus, sin orden alfabético. Dos entradas de Tottus Perú tienen el mismo autor y año sin a/b. Procefrut Perú se usa para D' Kampu; conviene decirlo en el texto. Los títulos de libros, informes y revistas deben ir en cursiva.", "mejora": "Ordenar alfabéticamente, diferenciar con s. f.-a y s. f.-b, aclarar la entrada de D' Kampu y revisar las cursivas."}, {"severidad": "sugerencia", "titulo": "Fecha y detalles de maquetación", "ubicacion": "Carátula; Figura 1", "cita": "Arequipa, Perú  ·  30 de octubre de 2026", "problema": "La fecha de la carátula no se actualizó respecto a la v2. Falta un espacio tras «Sección:» y la Figura 1 repite celdas combinadas.", "mejora": "Actualizar la fecha, revisar la maquetación y hacer una lectura final de erratas."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Encuesta de validación del MVP y del modelo de negocio (cap. 5)", "resumen": "Revisión del formulario vigente al 11/11/2026 (se conserva como referencia). El informe del 18/11 ya muestra sus resultados (n = 19) en el cap. 5; ver esa sección. Las observaciones de diseño del instrumento siguen vigentes para una segunda ronda.", "observaciones": [{"severidad": "critico", "titulo": "No se valida el precio de referencia ni las presentaciones del informe", "ubicacion": "Sección V; informe 2.2.1 y Tabla de precios", "cita": "«¿Cuánto estarías dispuesto(a) a pagar por un sachet individual de FRÚTZUMMA?» (De S/ 1.00 a S/ 1.50 / De S/ 1.60 a S/ 2.00 / Más de S/ 2.00)", "problema": "El informe plantea S/ 1,00 por sachet, S/ 5,50 por kit de seis y S/ 10,50 por kit de doce, y el formulario no pone a prueba ninguno de esos precios. Los rangos arrancan en S/ 1,00, por lo que quien pagaría menos no tiene opción, y los tramos están desordenados (hay un vacío entre S/ 1,50 y S/ 1,60). Además, «¿Cómo preferirías comprar FRÚTZUMA?» ofrece un Kit de 24 que el informe no contempla y no indica el precio de ninguna presentación. Sin esto no se puede decidir el precio de la AA2 ni calcular ingresos del cap. 6.", "mejora": "Preguntar «¿Comprarías un sachet a S/ 1,00?» (Sí / Depende / No) y presentar cada kit con su precio. Usar una escala de sensibilidad al precio (demasiado barato / conveniente / caro / demasiado caro) y rangos continuos que incluyan menos de S/ 1,00. Eliminar el kit de 24 o justificarlo en el cap. 4."}, {"severidad": "critico", "titulo": "No hay criterios de validación, tamaño de muestra ni plan de análisis", "ubicacion": "Informe, cap. 4 (H1 a H4, «Encuesta a 50 personas del segmento objetivo»); formulario completo", "cita": "«Encuesta a 50  personas del segmento objetivo.»", "problema": "El informe menciona 50 personas, pero ni el informe ni el formulario establecen cómo se elegirá la muestra, qué porcentaje mínimo confirma cada hipótesis ni qué decisión del MVP cambiaría si no se cumple. Sin ello no hay análisis crítico posible y el criterio «Validación del modelo de negocio» no puede pasar de la etapa de herramienta. Tampoco se registra el medio por el que llegó cada respuesta, lo que impide detectar sesgo de familiares y amigos.", "mejora": "Escribir en el cap. 5 una tabla Hipótesis, Pregunta que la mide, Muestra y Criterio de aceptación (por ejemplo, «al menos 60 % califica 4 o 5 en atractivo y 40 % compraría a S/ 1,00»), definir cuotas por ocupación y edad y registrar el origen de cada respuesta."}, {"severidad": "importante", "titulo": "No se pregunta por acceso a agua potable ni recipiente, condición de uso del producto", "ubicacion": "Secciones II a V; informe 2.5 (segmento) y Caso 1", "cita": "El informe: «tienen acceso habitual a agua potable»; el formulario no incluye ninguna pregunta sobre agua", "problema": "El producto se diluye en agua potable y el informe lo declara como condición del segmento y como hipótesis por validar. Si el cliente no cuenta con agua o botella en su jornada, la propuesta de practicidad deja de funcionar. El formulario nunca lo consulta.", "mejora": "Agregar «Fuera de casa, ¿tienes acceso a agua potable y a un recipiente para prepararlo?» (Siempre / A veces / Casi nunca) y analizarla cruzada con intención de compra."}, {"severidad": "importante", "titulo": "El canal no incluye las opciones del modelo ni se compra por pedido agrupado", "ubicacion": "Sección V, pregunta de canal; informe 3.2 (BMC, canales)", "cita": "«Canal por el cual preferirías adquirir el producto.» (Whtasapp / Distribución por bodegas o tiendas / Supermercados)", "problema": "El BMC plantea pedidos por WhatsApp, puntos de retiro y pedidos agrupados, pero el formulario no ofrece punto de retiro, institutos u oficinas ni pregunta si pediría con compañeros. Sobran supermercados, que no figuran en el modelo. Además, está escrito «Whtasapp» y la pregunta no es una pregunta.", "mejora": "Reformular como «¿Cómo preferirías comprarlo?» con: WhatsApp con retiro en un punto, delivery, bodega o tienda cercana, cafetería del instituto o trabajo, otra; y preguntar «¿Pedirías junto con compañeros para un kit?»."}, {"severidad": "importante", "titulo": "No se identifica qué consume y paga hoy el cliente ni se incluyen los competidores reales", "ubicacion": "Sección II, «Cuando tienes poco tiempo, ¿qué bebida sueles elegir?»", "cita": "«Jugos preparados (pura fruta) / Gaseosas / Refresco en polvo / Agua / Frugos / Otro»", "problema": "Faltan los concentrados líquidos en sachet o botella, que son la competencia directa del informe (Naturale, FIFU) y Zuko. Tampoco se pregunta cuánto gasta ni cuándo fue la última vez que compró una bebida fuera de casa, que es el dato más confiable. Es una pregunta de una sola respuesta y no permite medir la frecuencia por tipo de bebida.", "mejora": "Agregar «Concentrado en sachet o botella» como opción, preguntar «¿Cuándo fue la última vez que compraste una bebida fuera de casa, cuál y cuánto pagaste?» y pedir la marca de refresco o concentrado."}, {"severidad": "importante", "titulo": "Preguntas que inducen la respuesta", "ubicacion": "Sección II y III", "cita": "«¿Tiene dificultades para tomar bebidas de fruta durante el día?» (Si / No / Ninguna); descripción: «fácil de preparar, ideal para personas con poco tiempo»", "problema": "La primera tiene opciones superpuestas (No y Ninguna significan lo mismo), no pregunta cuál es la dificultad y no abre la causa; el tratamiento de usted rompe con el tuteo del resto. La descripción previa a la pregunta de atractivo usa adjetivos favorables («fácil», «ideal») que condicionan la nota. Además «atractiva» y «probable que probaras» miden casi lo mismo y ambas se leen como cortesía.", "mejora": "Cambiar a «¿Qué dificultades tienes para tomar bebidas de fruta durante el día?» con opciones concretas y «Ninguna». Quitar los adjetivos de la descripción, usar una sola pregunta de intención («¿Lo comprarías?») y comparar con lo que el cliente hace hoy."}, {"severidad": "importante", "titulo": "Opciones de respuesta incompletas", "ubicacion": "Sección I y II", "cita": "Frecuencia: «Menos de una vez a la semana / 1 a 2 veces por semana / 3 a 4 veces por semana / 5 a 6 veces por semana»; edad: «36 a 45 años» y «Más de 46 años»", "problema": "En frecuencia faltan «Nunca» y «Todos los días»; quien nunca toma refrescos o los toma a diario no tiene opción. En edad, quien tiene 46 años queda sin opción exacta («36 a 45» y «Más de 46»). La opción «Otro» de bebida aparece en blanco. Todas las preguntas, salvo los sabores, son opcionales, por lo que pueden quedar sin responder las claves.", "mejora": "Completar frecuencia con «Nunca» y «Todos los días», cambiar la última edad a «Más de 45 años», rotular la opción «Otra (especifica)» y marcar como obligatorias las preguntas clave."}, {"severidad": "sugerencia", "titulo": "Los sabores no obligan a elegir ni capturan nuevas opciones", "ubicacion": "Sección IV, matriz de sabores", "cita": "«¿Qué tanto te agradaría estos sabores?» (Maracuyá con mango / Fresa con Sandía / Piña con Jamaica, 1 a 5)", "problema": "En una matriz de 1 a 5 es habitual que todos reciban 4 o 5, lo que hace al resultado previsible. Tampoco hay una pregunta abierta para otros sabores ni se comparan con lo que el cliente consume.", "mejora": "Pedir elegir el sabor favorito, ordenar los tres y agregar «¿Qué otro sabor te gustaría?» como respuesta abierta opcional."}, {"severidad": "sugerencia", "titulo": "Se muestra solo una imagen del producto, sin muestra para probar", "ubicacion": "Secciones III y IV (imágenes)", "cita": "Dos imágenes de 1600×900 px y la descripción «un concentrado de frutas en un sachet de 60 ml»", "problema": "Las imágenes mejoran la validez, pero la validación del MVP exige que el cliente pueda probar o ver el sachet real y su preparación. Las preguntas de sabor y practicidad se contestan sobre una descripción, no sobre una experiencia.", "mejora": "Aplicar la encuesta presencialmente con una muestra preparada del sachet y la botella, o mostrar un video corto de la preparación, y registrar en cada respuesta si probó el producto."}, {"severidad": "sugerencia", "titulo": "Marca escrita de tres maneras y errores de redacción", "ubicacion": "Todo el formulario", "cita": "«FRÚTZUMMA» / «FRUTZUMMA» / «FRÚTZUMA»; «Whtasapp»; «Si»; «Más de 46 años»", "problema": "El informe usa FRÚTZUMA, pero el título, la descripción y las preguntas dicen FRÚTZUMMA, FRUTZUMMA o FRÚTZUMA. La falta de tildes («Si») y errores como «Whtasapp» restan seriedad al instrumento y pueden confundir a los encuestados.", "mejora": "Unificar el nombre del producto con el informe, corregir ortografía y tildes y hacer una prueba piloto con 5 personas del segmento antes de la aplicación, midiendo el tiempo de respuesta."}], "preguntas": [{"pregunta": "¿Lugar de residencia? ¿Edad? ¿Ocupación?", "opciones": "Arequipa / Otro (fin); 18-25 / 26-35 / 36-45 / Más de 46 (fin); Estudias / Trabajas / Ambos", "mide": "Filtro del segmento (correcto). Ajustar el tramo de edad a «Más de 45»."}, {"pregunta": "¿Con qué frecuencia consumes refrescos de frutas? / ¿Tiene dificultades para tomar bebidas de fruta durante el día? / ¿Qué bebida sueles elegir con poco tiempo?", "opciones": "Cuatro tramos sin «Nunca» ni «Todos los días»; Si / No / Ninguna; seis opciones sin concentrados", "mide": "Hábito y problema; hipótesis H1. Opciones incompletas y pregunta guiada."}, {"pregunta": "¿Qué tan atractiva te parece la propuesta? / ¿Qué tan probable sería que probaras?", "opciones": "Escala de 1 a 5 (Nada atractiva a Muy atractiva)", "mide": "Atractivo e intención de prueba; hipótesis H2. Las dos preguntas se solapan."}, {"pregunta": "¿Qué tanto te agradaría estos sabores? / ¿Qué tan práctico sería?", "opciones": "Matriz de 1 a 5 para tres sabores (obligatoria); escala de 1 a 5", "mide": "Aceptación de sabores (H3) y practicidad (funcionalidad del MVP)."}, {"pregunta": "¿Cómo preferirías comprar? / ¿Cuánto pagarías por un sachet? / ¿Canal de adquisición?", "opciones": "Individual, kit de 6, 12 o 24, no estoy seguro; tres rangos de S/ 1,00 a más de S/ 2,00; Whtasapp, bodegas, supermercados", "mide": "Presentación, precio y canal. No prueba S/ 1,00 ni los precios de los kits y no recoge el punto de retiro."}, {"pregunta": "¿Qué podemos mejorar en FRÚTZUMA?", "opciones": "Respuesta abierta (opcional)", "mide": "Mejoras al MVP; útil para el cap. 5 si se codifican las respuestas."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Coherencia del modelo de negocio con la validación y pitch", "resumen": "El cap. 3 no cambió desde el 11/11 y quedó desfasado respecto de lo validado y proyectado: el BMC y la ficha mantienen S/ 1,00, kits de S/ 5,50 y S/ 10,50 y retiro en cafeterías, mientras los caps. 5 y 6 usan S/ 1,80 y bodegas/tiendas. Hay dos pitches distintos.", "observaciones": [{"severidad": "importante", "titulo": "BMC y caps. 2–3 sin actualizar con la validación", "ubicacion": "3.2, Tabla 9 (Ingresos y Canales); 2.2.1, Tabla 5", "cita": "«Unidad S/ 1,00; kit 6 S/ 5,50; kit 12 S/ 10,50 (hipótesis)» / «cafeterías: puntos de retiro»", "problema": "El cap. 5 concluye «Se utilizará S/1,80» y «Se priorizará este canal» (bodegas/tiendas, 68,4 %), y el cap. 6 modela solo el sachet a S/ 1,80 sin kits. Los capítulos previos no se ajustaron, por lo que el modelo de negocio descrito no es el que se proyecta.", "mejora": "Actualizar BMC (Ingresos, Canales, Relaciones, Socios) y la Tabla 5 con precio y canal validados y con el descuento al bodeguero; indicar qué pasa con los kits (el 57,9 % prefiere un kit)."}, {"severidad": "importante", "titulo": "Precio S/ 1,80 contradice el posicionamiento declarado", "ubicacion": "3.3, párrafo final; Tabla 10", "cita": "«A S/ 2,00/L para una unidad, FRÚTZUMA no aspira a ganar por precio frente al refresco en polvo»", "problema": "Con 500 ml por sachet, S/ 1,80 equivale a S/ 3,60/L (cálculo propio): más que Naturale (S/ 3,27/L) y 6 veces Zuko (S/ 0,60/L). El cap. 3 no discute ese salto ni lo sustenta con la validación (nadie eligió «más de S/ 2,00»).", "mejora": "Sustentar el diferencial de valor que justifica S/ 3,60/L o revisar presentación/precio."}, {"severidad": "sugerencia", "titulo": "Mapa de empatía y entrevistas siguen vacíos", "ubicacion": "3.1, Tabla 8; Anexo", "cita": "«[Espacio para incorporar dos o tres frases literales de los entrevistados…]»", "problema": "No se hicieron entrevistas; el anexo conserva tres «entrevistas simuladas». La rúbrica AA2 exige recolección real.", "mejora": "Hacer 8–10 entrevistas, completar el mapa y retirar las simuladas."}, {"severidad": "importante", "titulo": "Dos elevator pitch distintos y uno con texto corrupto", "ubicacion": "3.6 y 6.15", "cita": "«Actualmente ofrecemos tres sabores: Piñamaica, Fresandia y Maracum6.15. Elevator Pitch de FRÚTZUMA Para la presentaciango.»", "problema": "El pitch de 3.6 habla de retiro cerca de centros de estudio y 4 meses de vida útil; el de 6.15 de bodegas y tiendas, con un párrafo pegado por error. Ninguno cita resultados de validación ni cifras financieras.", "mejora": "Dejar un solo pitch de 60–90 s con 2–3 métricas reales (n, % de aceptación, precio, punto de equilibrio) y corregir el texto."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Planteamiento del MVP y herramientas (cap. 4)", "resumen": "Mejora clara: la Tabla 4.1 ya trae metas numéricas por hipótesis y el MoSCoW enlaza funcionalidades con hipótesis. Faltan herramientas, pasos seguidos, MoSCoW completo y las funcionalidades del modelo (kits, pedido, bodegas); se eliminó la H4 de portabilidad.", "observaciones": [{"severidad": "importante", "titulo": "Sigue sin existir la sección de herramientas", "ubicacion": "Cap. 4 (4.1–4.2)", "cita": "«Por lo pronto el MVP solo tendrá el apartado ´´debe tener (Must)´´»", "problema": "No se explica con qué se desarrollará y validará el MVP (formulación/prototipo, maquila o llenadora, Google Forms, WhatsApp). Es más: el Excel asume planta propia (máquina de llenar y sellar S/ 3 695) mientras el cap. 3.2.1 dice evaluar maquila antes de invertir.", "mejora": "Agregar tabla Herramienta – función – por qué es adecuada (funcionalidad, usabilidad, viabilidad técnica) y decidir planta propia o maquila."}, {"severidad": "importante", "titulo": "MoSCoW incompleto y sin funcionalidades del modelo", "ubicacion": "4.2", "cita": "«1. Concentrado líquido en sachets individuales… 4. Identificación e instrucciones básicas»", "problema": "Solo hay 4 «Must». Ninguna recoge kits, pedido por WhatsApp ni venta en bodegas, que son canal y formato adoptados en los caps. 5–6. Se retiró la funcionalidad de envase seguro/portabilidad y su H4, aunque la propuesta de valor sigue basada en portabilidad.", "mejora": "Completar Should/Could/Won't, reponer H4 con prueba de transporte y sellado, e incluir kits y canal."}, {"severidad": "importante", "titulo": "Metas de H3 no operativas y muestra planificada no cumplida", "ubicacion": "4.1, H1 y H3", "cita": "«Encuesta a 50 personas del segmento objetivo» / «85% aceptación… 75%… 60%» con «escala de valoración del 1 al 5»", "problema": "Las metas se expresan en % de aceptación pero se miden con escala 1–5 sin definir qué puntaje cuenta como aceptación; H1 fija n = 50 y se aplicó a 19. No hay criterio de decisión (qué se hace si no se cumple).", "mejora": "Definir aceptación = % de respuestas 4–5 y la regla de decisión (p. ej. reformular un sabor bajo 60 %)."}, {"severidad": "sugerencia", "titulo": "No se describen los pasos seguidos", "ubicacion": "Cap. 4", "cita": "", "problema": "La rúbrica pide sustentar los pasos del MVP. No se muestra prototipo, fotos, muestra ni versiones del concepto (solo «imágenes y muestras» mencionadas en H2).", "mejora": "Agregar línea de tiempo con evidencia (fotos del prototipo, versiones, fechas)."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Validación del modelo de negocio (cap. 5)", "resumen": "Primera recolección real: encuesta con n = 19 (18 en precio), conclusiones con métricas y decisiones de precio, canal y formato. Falta contrastar las hipótesis con sus metas (los sabores no las cumplen), hay errores de lectura, no hay entrevistas ni mejoras al MVP.", "observaciones": [{"severidad": "critico", "titulo": "Los resultados de sabores no cumplen H3, pero se rotulan «Favorable»", "ubicacion": "5, Recolecta los datos y Conclusiones; figura «¿Qué tanto te agradaría estos sabores?»", "cita": "«Mayor interés en Maracumango y Piñamaica | Favorable»", "problema": "Con los conteos de la figura (n = 19), las calificaciones 4–5 son 9/19 (47 %) en Maracumango, 5/19 (26 %) en Fresa–sandía y 9/19 (47 %) en Piñamaica (cálculo propio). Las metas de H3 eran 85 %, 75 % y 60 %: ninguna se cumple. Aun así el cap. 6 asigna 50/20/30 % de la mezcla a Piñamaica/Fresandia/Maracumango por esa pregunta.", "mejora": "Presentar la tabla n y % por puntaje, contrastar con la meta, reconocer que H3 no se valida y rediseñar sabores/mezcla (por ejemplo reformular Fresa–sandía)."}, {"severidad": "critico", "titulo": "No se declara n ni el muestreo; muestra menor a la planificada", "ubicacion": "Cap. 5 y 4.1 (H1)", "cita": "«Encuesta a 50 personas del segmento objetivo»", "problema": "El texto no indica cuántas personas respondieron (las figuras muestran 19, y 18 en precio), cómo se eligieron, ni fechas. Con 19 casos, 36,8 % o 26,3 % equivalen a 7 y 5 personas y no admiten conclusiones de mercado.", "mejora": "Indicar n por pregunta, método y fecha, ampliar a n ≥ 50 y mostrar los conteos junto a los porcentajes."}, {"severidad": "importante", "titulo": "Errores de lectura de los datos", "ubicacion": "5, Recolecta los datos; Análisis", "cita": "«El 68,4% de los encuestados cree que es muy práctico nuestro producto» / «El 73.3% estudia y trabaja»", "problema": "En la figura de practicidad, 68,4 % es la suma de 4 (42,1 %) y 5 (26,3 %); «muy práctico» (5) es 26,3 %, y 26,3 % respondió 1–2. La ocupación «Ambos» es 73,7 % (14/19), no 73,3 %. Además, de ocupar dos actividades no se deduce falta de tiempo (no se midió). El apartado conserva etiquetas «Capítulo I / Capítulo IV» y una frase truncada («todos los encuestados son del a»).", "mejora": "Corregir cifras, redactar el análisis a partir de las figuras y limpiar el texto."}, {"severidad": "importante", "titulo": "Hipótesis H1 y H2 sin resultados", "ubicacion": "5", "cita": "«Esta fue una pregunta filtro…»", "problema": "No se reportan los resultados de «¿Tiene dificultades para tomar bebidas de fruta?» (H1), «¿Qué tan atractiva…?» ni «¿Qué tan probable…?» (H2): justo los que validan necesidad y aceptación. Tampoco se muestra consumo actual, competidores ni disposición a pagar menos de S/ 1,00.", "mejora": "Incluir esas tablas y la comparación con 80 % y 75 %."}, {"severidad": "importante", "titulo": "Decisiones de precio y formato mal sustentadas", "ubicacion": "5, Conclusiones, filas Precio y Kit de 6", "cita": "«66,7 % acepta S/1,60–S/2,00 | Se utilizará S/1,80 como precio referencial»", "problema": "12 de 18 eligieron el tramo S/ 1,60–2,00 (no necesariamente S/ 1,80) y 6 de 18 no pasan de S/ 1,50; nadie eligió más de S/ 2,00. Un 57,9 % (11/19) prefiere un kit (6: 26,3 %; 12: 10,5 %; 24: 21,1 %) y el kit de 24 se ignora. El cap. 6 no modela kits.", "mejora": "Probar S/ 1,80 directamente (precio puntual) y decidir los formatos con los datos."}, {"severidad": "importante", "titulo": "Metodología mal rotulada y sin entrevistas ni mejoras al MVP", "ubicacion": "5, primer párrafo", "cita": "«La metodología es cualitativa se utilizaron las encuestas y entrevistas…»", "problema": "La encuesta es cuantitativa y no se aplicó ninguna entrevista (solo la guía). No hay una sola mejora al MVP derivada de los datos, que es lo que distingue el nivel 4.", "mejora": "Hacer entrevistas reales y agregar una tabla Hallazgo → Mejora al MVP → Responsable."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Proyección financiera y presupuestaria a 3 años (cap. 6)", "resumen": "El cap. 6 ahora está desarrollado (7 piezas, PE y análisis interno/externo) y su aritmética coincide con el Excel entregado. El hallazgo central: S/ 39 720 anuales de costos fijos de Producción se muestran en la Tabla 4 pero no entran en egresos, flujo, PE ni capital de trabajo. Con el costo completo (cálculo propio) el modelo pierde dinero y no es viable al precio y capacidad supuestos.", "observaciones": [{"severidad": "critico", "titulo": "Costos fijos de Producción omitidos de egresos, flujo, PE y capital de trabajo", "ubicacion": "6.2.2 Tabla 4 vs. Tablas 6, 7, 9, 12", "cita": "«Los costos fijos mensuales ascienden a S/ 6,670.00» / «Costos fijos | S/ 41,531.35»", "problema": "La Tabla 4 incluye ingeniero part time (S/ 850) y 2 operarios (S/ 2 460) = S/ 3 310/mes, pero los egresos solo cargan administración (36 360) y venta (3 960); 6.2.2 dice S/ 80 040 anuales y la Tabla 12 usa 41 531,35 (40 320 + depreciación). Coincide con el Excel (Proyeccion C31:C34 no toma Costos_Fijos!H7). La plantilla del Excel solo admite costos Administrativo y Venta; el grupo agregó Producción por su cuenta pero no la enlazó al modelo. Con el costo completo (cálculo propio): EBIT año 1 ≈ −S/ 13 921, años 2–3 ≈ −S/ 12 966 y −S/ 11 999; VAN negativo (≈ −S/ 35 mil a −49 mil según el tratamiento del capital de trabajo); PE ≈ 57 924 sachets, mayor que la capacidad de 48 000 (margen de seguridad −20,7 %, no 38,32 %).", "mejora": "Incluir Producción (como costo indirecto de producción o con su propia fila) en egresos, flujo, PE y capital de trabajo, y rehacer VAN/TIR/PRI y conclusiones."}, {"severidad": "critico", "titulo": "La conclusión de viabilidad no se sostiene", "ubicacion": "6.9 Tabla 11; 6.14", "cita": "«VAN económico S/ 27,370.24… TIR económica 60.90%… FRÚTZUMA presenta una situación favorable»", "problema": "Los indicadores son aritméticamente correctos pero parten del costo incompleto. Al precio S/ 1,80 y con 48 000 unidades se necesitaría ≈ S/ 2,09 por sachet solo para cubrir el costo fijo completo (cálculo propio), fuera del rango máximo de la encuesta (S/ 2,00).", "mejora": "Presentar un análisis de viabilidad con costo completo y alternativas (precio, maquila en vez de planta, capacidad, reducción de costos fijos)."}, {"severidad": "importante", "titulo": "Demanda, capacidad y financiamiento no cuadran", "ubicacion": "6.13; 6.1; 6.8 Tabla 10", "cita": "«La demanda proyectada supera el mercado alcanzable» / «Existe una diferencia de S/ 19,819.78»", "problema": "El propio informe reconoce 48 000 unidades = 1,8 × SOM (26 000), año 3 sobre la capacidad y brecha de financiamiento. Además el Flujo financiero (Año 0: −S/ 24 819,78) supone un aporte propio de S/ 24 819,78 que 6.13 dice que no existe (aporte + préstamo = S/ 10 000). Se agradece la transparencia, pero son errores que invalidan el flujo mientras no se corrijan.", "mejora": "Fijar la demanda en función de SOM y la validación, ajustar la capacidad y declarar las fuentes de financiamiento que cierran la inversión."}, {"severidad": "importante", "titulo": "Costos variables sin sustento y con inconsistencias", "ubicacion": "6.2.1 Tabla 3", "cita": "«El costo variable incluye los insumos… como frutas, azúcar, agua, fórmula, sachet y mano de obra directa»", "problema": "No hay receta, cantidades ni cotizaciones. Se cita azúcar aunque la ficha técnica (Tabla 4 del cap. 2) descarta la formulación con azúcar añadida (stevia/sin azúcar); incluye mano de obra directa y a la vez hay 2 operarios en costos fijos (posible doble conteo); no se incluyen comisión del canal bodega, envase secundario ni merma.", "mejora": "Presentar ficha de costeo por sabor con insumos, unidad y proveedor, y completar costos de canal, empaque y merma."}, {"severidad": "importante", "titulo": "Ingresos sin kits ni descuento de canal", "ubicacion": "6.3 Tabla 5; 5 Conclusiones", "cita": "«precio de venta de S/ 1.80 por sachet» / canal 68,4 % bodegas", "problema": "Se vende todo a precio al público de S/ 1,80 cuando el canal elegido (bodegas/tiendas) compra con descuento, y no se modelan kits aunque 57,9 % los prefiere. Los ingresos 86 400 (=48 000 × 1,80) parten de la mezcla 50/20/30 % basada en preferencia de sabor, no en compra.", "mejora": "Usar el precio neto al canal y un mix de presentaciones respaldado en la encuesta."}, {"severidad": "importante", "titulo": "Flujo mensual del año 1 es plano y no es un flujo de caja completo", "ubicacion": "6.6 Tabla 8", "cita": "«Enero | S/ 7,200.00 | … | S/ 2,250.88»", "problema": "Los 12 meses son idénticos (sin arranque, estacionalidad ni inventario), no incluyen inversión, impuestos, préstamo ni saldo de caja acumulado, y el total «flujo operativo» (S/ 27 010,56) no es el EBIT ni el flujo de las Tablas 9–10.", "mejora": "Construir flujo mensual con saldo de caja inicial/final y mes de equilibrio."}, {"severidad": "sugerencia", "titulo": "Error de suma en la Tabla 2 y detalles de forma", "ubicacion": "6.1 Tabla 2; numeración de tablas; 6.9", "cita": "«Otros equipos y mobiliario | S/ 898.40» / «Total inversión fija | S/ 10,023.30»", "problema": "Las filas suman S/ 10 024,30 (el Excel y el texto dan 10 023,30); cocina industrial y balanza aparecen en el texto pero no en la tabla. La tasa de descuento (17 %) y la tasa de impuesto (29,5 %, deducida de las cifras) no se sustentan en el informe, y la numeración «Tabla 1…» se repite con los capítulos 1–3.", "mejora": "Corregir la tabla, numerar correctamente y justificar COK e impuesto con fuentes."}, {"severidad": "sugerencia", "titulo": "Coincidencias con el Excel y piezas completas", "ubicacion": "Cap. 6 completo", "cita": "", "problema": "Las 7 piezas están presentes y los resultados coinciden con el Excel entregado (inversión, ingresos, VAN, TIR, PRI, B/C, PE). Los nombres FRUTZUMMA/FRESANDIA del Excel difieren del informe. La plantilla del Excel rotula al revés los ejes del gráfico PE; no se penaliza al grupo.", "mejora": "Mantener consistencia de nombres y conservar la transparencia de 6.13 como insumo de la corrección."}]}], "fecha_aa2": "11/11/2026", "calificacion": {"fuentes": 4, "problema": 3, "propuesta": 3, "modelo": 4, "responsabilidad": 3}, "calificacionAA2": {"validacion": 2}, "enlaces": [{"titulo": "Informe del TAP (Google Docs)", "url": "https://docs.google.com/document/d/1yiaO1OPKO_oMEqvIdoZb4yOKN1v0VezY"}, {"titulo": "Formulario de validación", "url": "https://docs.google.com/forms/d/e/1FAIpQLSfqWssBIC_w1tmiXGUjw2vgGMCVefkKXdHh1wOpEnzVtVUebQ/viewform"}, {"titulo": "Excel de punto de equilibrio (cap. 6)", "url": "https://docs.google.com/spreadsheets/d/1lQcTSnNHBoE6c84RrQLwBMEutq2xj4jQcOEb8S3-xmI/edit"}], "costosAA2": {"hoja": "Frutzuma", "tipo_cambio": 3.5, "escenarios": ["Piloto", "Año 1", "Crecimiento"], "supuestos": [{"concepto": "Clientes atendidos al mes", "unidad": "clientes", "valores": [50.0, 200.0, 800.0], "nota": "SUPUESTO sobre el volumen del informe (no declarado)."}, {"concepto": "Mensajes de utilidad por WhatsApp API", "unidad": "mensajes", "valores": [0.0, 200.0, 1000.0], "nota": "Piloto: app gratuita (sin API). Año 1+: solo si pasan a la API."}, {"concepto": "Mensajes de marketing por WhatsApp API", "unidad": "mensajes", "valores": [0.0, 100. u costo digital es marginal."], "elaborado": "11/11/2026", "primer_pago_total_pen": [1500.0, 1627.1655, 1827.8275], "costo_anio1_pen": [1500.0, 3138.986, 6506.93], "necesidades": {"nombre": "Frútzuma", "resumen": "Producto físico: concentrado de fruta en sachets de 60 ml en tres sabores. El MVP es el producto; el costo está en insumos, envasado, permisos y distribución.", "items": [{"rubro": "Fruta e insumos", "necesidad": "Sabores Maracumango, fresa con sandía y Piñamaica. El informe da un costo variable de ejemplo de S/ 0,70 por sachet.", "origen": "Declarado", "proveedor": "Mercados mayoristas de Arequipa y proveedores de pulpa de fruta", "producto": "Pulpa o fruta, azúcar y conservantes permitidos", "precio": "Cotizar por kilo", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "Sustentar los S/ 0,70 con la receta por sachet y precios actuales."}, {"rubro": "Sachet y envasado", "necesidad": "Sachet individual de 60 ml (rinde ~500 ml de agua) y selladora.", "origen": "Declarado", "proveedor": "Fabricantes de empaques flexibles y proveedores de maquinaria de envasado", "producto": "Sachets impresos y equipo de sellado", "precio": "Cotizar por millar y por equipo", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": ""}, {"rubro": "Registro sanitario", "necesidad": "Para comercializar un alimento envasado en cafeterías y tiendas.", "origen": "Inferido", "proveedor": "DIGESA (Ministerio de Salud) por la VUCE", "producto": "Registro sanitario de alimento", "precio": "Sin costo para el administrado: DIGESA (Comunicado 05-2026, 03/08/2026) indica que los registros sanitarios continúan sin costo; si la VUCE cobra derechos, los devuelve", "pen": 0, "frecuencia": "única", "estado": "Verificado", "nota": "Fuente: comunicado oficial de DIGESA. Sí cuestan los análisis de laboratorio y los gastos del expediente (ver otros rubros). Confirmar el trámite vigente en la VUCE al iniciar."}, {"rubro": "Análisis de laboratorio", "necesidad": "Inocuidad r antes de presentar.", "Cotizar": "No hay precio público confiable: el grupo debe pedir cotización a 2 o más proveedores y anexarla."}}, "notasAA2": {"id": "grupo-quispe-quintanilla-sosa", "fecha": "18/11/2026", "mvp": 2, "herramientas": 2, "validacion": 3, "presupuesto": 2, "compromiso": 3, "total": 12, "justificacion": {"mvp": "Cap. 4: la Tabla 4.1 ahora fija metas numéricas (H1 80 %, H2 75 %, H3 85/75/60 % por sabor) con su forma de medición, y el MoSCoW (4 «Must») enlaza cada funcionalidad con una hipótesis: mejora real frente al 11/11. Sigue en 2 porque (a) el MVP solo declara «Must» (sin Should/Could/Won't), (b) no relata los pasos seguidos ni muestra el prototipo/muestra usada, (c) se retiró la H4 de portabilidad/envase y ninguna funcionalidad recoge kits, pedido por WhatsApp ni canal bodegas, que son el modelo que el propio cap. 5 y 6 adoptan, y (d) H1 pide encuesta a 50 personas y se aplicó a 19.", "herramientas": "Sin sección de herramientas en el cap. 4. Aun así, el expediente ya identifica instrumentos: MoSCoW (4.2), guía de encuesta y de entrevista (cap. 5), Google Forms y un modelo financiero en Excel (cap. 6; inversión en máquina llenadora y selladora S/ 3 695 en Tabla 2). No se justifica cómo aportan a funcionalidad, usabilidad o viabilidad técnica, no hay herramienta de prototipado/formulación del producto y el Excel supone planta propia mientras el cap. 3.2.1 decía evaluar maquila. Nivel 2: parcialmente alineadas.", "validacion": "Hay recolección real: encuesta en Google Forms, n = 19 (18 en la pregunta de pago; figuras de resultados), tabla de conclusiones con métricas y decisiones (S/ 1,80, bodegas/tiendas, mantener kit de 6). Cumple el nivel 3 de forma mínima. No llega a 4 y tiene fallas serias: (1) el texto nunca declara n ni el muestreo, y n = 19 es menos de la mitad de los 50 que la H1 exige; (2) no se contrastan H1–H3 con sus metas: de las figuras de sabores (cálculo propio, calificaciones 4–5 sobre 19) Maracumango 47 %, Fresa–sandía 26 % y Piñamaica 47 %, muy por debajo de 85/75/60 %, pero la Conclusión los rotula «Favorable»; (3) «68,4 % lo considera muy práctico» es en realidad el top-2 (4: 42,1 % + 5: 26,3 %); «muy práctico» (5) es 26,3 %; (4) «73,3 % estudia y trabaja» no coincide con la figura (73,7 %) y de ahí se infiere falta de tiempo sin medirla; (5) los resultados de la pregunta de dificultad (H1) y de atractivo (H2) no aparecen; (6) 57,9 % prefiere un kit (6, 12 o 24) y el 21,1 % eligió el de 24, que se ignora; (7) no hay entrevistas, el cap. 5 se rotula «cualitativa» siendo una encuesta cuantitativa, y no se derivan mejoras al MVP (nivel 4).", "presupuesto": "El cap. 6 ya trae las 7 piezas: inversión S/ 29 819,78 (Tablas 1–2), costos variables y fijos (3–4), ingresos (5), egresos (6), flujo mensual año 1 (8), flujo económico y financiero a 3 años (9–10) e indicadores VAN/TIR/PRI/B-C y PE (11–12). La aritmética es correcta (verificada con script: ingresos 86 400/88 819,20/91 306,14; EBIT 25 799,21; VAN 27 370,24; TIR 60,9 %; PRI 1,51; B/C 1,92) y coincide con el Excel entregado. Pero el modelo no es confiable: la Tabla 4 suma S/ 6 670/mes (S/ 80 040/año) e incluye Producción (ingeniero S/ 850 + 2 operarios S/ 2 460 = S/ 3 310/mes), mientras las Tablas 6–12 solo cargan administración (36 360) y venta (3 960) = S/ 40 320 + depreciación; el costo fijo del PE (S/ 41 531,35) omite S/ 39 720/año y el capital de trabajo (S/ 19 796,48) omite S/ 13 240. Con el costo completo (cálculo propio) EBIT año 1 ≈ −S/ 13 921, PE ≈ 57 924 sachets > capacidad 48 000, y VAN negativo (≈ −S/ 35 mil a −49 mil según supuestos). Además: demanda 48 000 = 1,8 × SOM 26 000 (admitido en 6.13), brecha de financiamiento S/ 19 819,78, el Flujo financiero asume S/ 24 819,78 de aporte no declarado, flujo mensual plano de 12 meses iguales sin impuestos/préstamo/saldo de caja, sin kits ni margen del canal bodega, y sin sustento de costos (sin recetas ni cotizaciones). Es nivel 2: proyecciones completas en forma, incoherentes con el modelo. Se reconoce la honestidad de 6.13, pero la conclusión «favorable» no se sostiene.", "compromiso": "a criterio del docente"}, "cambios_vs_6nov": "Nueva versión Word del 18/11 (caps. 4, 5 y 6 desarrollados; antes eran la consigna). Los caps. 1–3 no cambiaron en contenido; la portada ya dice AA2 pero conserva la fecha 30/10/2026 y el índice sigue siendo el de la AA1.", "camino_al_20": ["Cap. 6 (prioridad máxima): integrar Producción (S/ 3 310/mes) en egresos, estado de resultados, flujo, PE y capital de trabajo (≈ S/ 33 036; inversión ≈ S/ 43 060, cálculo propio), rehacer VAN/TIR/PRI y concluir con honestidad: con el costo completo el negocio no es viable al precio S/ 1,80 y capacidad 48 000 (PE ≈ 57 924; precio de equilibrio a 48 000 unidades ≈ S/ 2,09, fuera del rango máximo de S/ 2,00 de la encuesta). Replantear precio, maquila, capacidad o costos.", "Cap. 6: sustentar costos variables con receta por sabor y 2 cotizaciones (fruta, sachet, llenado, etiqueta, merma, comisión), retirar «azúcar» si el producto es sin azúcar/stevia (Tabla 4 del cap. 2) y evitar doble conteo de mano de obra (CV vs. 2 operarios); modelar kits (6/12/24) y el margen o descuento de bodegas; cuadrar demanda con SOM y capacidad; cerrar el financiamiento (S/ 19 819,78); flujo mensual con estacionalidad/arranque, impuestos, préstamo y saldo de caja.", "Cap. 5: declarar n y método de muestreo, ampliar a n ≥ 50, contrastar H1–H3 con sus metas (sabores: 47/26/47 % vs 85/75/60 %), corregir «muy práctico» (26,3 % en 5; 68,4 % en 4–5), reportar dificultad (H1) y atractivo (H2), agregar 8–10 entrevistas reales y una cata de 3 sabores; y derivar mejoras explícitas al MVP (replantear Fresa–sandía, kit de 24, rango de precio, canal bodega).", "Cap. 4: agregar sección de herramientas con justificación (prototipo, formulación/maquila, Forms, WhatsApp), Should/Could/Won't, funcionalidades del modelo (kits, pedido, bodegas), pasos seguidos y reponer la H4 de portabilidad/envase.", "Coherencia ent       return `<div class="costos" id="costos-aa2">
        <h3 style="margin:18px 0 8px">Costos de nube y servicios digitales (estimación)</h3>
        <p class="summary">Estimación mensual con proveedores reales (Google Cloud / Firebase, OpenAI, WhatsApp) para tres escenarios de uso. Los volúmenes son supuestos elaborados a partir de su MVP: reemplácenlos con los datos de su prototipo. Tipo de cambio: S/ ${esc(K.tipo_cambio)} por USD. Los precios son cifras de referencia que deben confirmarse con la calculadora oficial de cada proveedor.</p>
        ${K.necesidades ? `<h4 style="margin:14px 0 6px">Qué necesita su proyecto, con proveedor y precio</h4>
        <p class="summary">${esc(K.necesidades.resumen)} Estado del precio: <b>Verificado</b> (fuente oficial, 11/11/2026), <b>Referencial</b> (confirmar en la lista oficial del proveedor) y <b>Cotizar</b> (pidan 2 o más cotizaciones y anéxenlas). Úsenla para armar su Excel.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Rubro</th><th>Qué necesitan (según su informe)</th><th>Proveedor · producto</th><th>Precio de referencia</th><th>Estado</th></tr></thead>
          <tbody>${K.necesidades.items.map(i => `<tr><td><b>${esc(i.rubro)}</b><br><span class="where">${esc(i.origen)}</span></td><td>${esc(i.necesidad)}</td><td>${esc(i.proveedor)}<br><span class="where">${esc(i.producto)}</span></td><td>${esc(i.precio)}${i.nota ? `<br><span class="where">${esc(i.nota)}</span>` : ''}</td><td><span class="lvl ${i.estado === 'Verificado' ? 'l4' : i.estado === 'Referencial' ? 'l2' : 'l1'}">${esc(i.estado)}</span></td></tr>`).join('')}</tbody>
        </table></div>` : ''}
        ${D.calculadoraXlsx ? `<p class="summary" style="margin-top:12px"><b>Calculadora de su proyecto:</b> <a href="${esc(D.calculadoraXlsx)}" download>descargar Excel</a>. Cambien la cantidad de usuarios en la columna «Calculadora (edite)» y verán el costo mensual de los servicios, el primer pago para construir la plataforma, el mantenimiento (bolsa de horas o un encargado fijo) y el costo del primer año.</p>` : ''}
        <div class="table-wrap"><table>
          <thead><tr><th>Supuesto de uso</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.supuestos.map(r => `<tr><td>${esc(r.concepto)} <span class="where">${esc(r.unidad)}</span></td>${r.valores.map(v => `<td class="num">${sup(v)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Servicio (costo mensual)</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.costos.map(r => `<tr><td>${esc(r.concepto)}</td>${f3(r.valores)}</tr>`).join('')}
            <tr><td><b>Total mensual</b></td>${K.total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td>Primer pago (mes 1, con dominio anual)</td>${f3(K.primer_pago_pen)}</tr>
            <tr><td>Mantenimiento del desarrollador (horas al mes x S/ ${esc(K.tarifa_mantenimiento)} por hora)</td>${f3(K.mantenimiento_pen)}</tr>
            <tr><td><b>Total mensual con mantenimiento</b></td>${K.total_con_mant_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Desarrollo inicial de la plataforma (pago único al desarrollador, a S/ ${esc(K.tarifa_desarrollo)} por hora)</b></td><td class="num" colspan="${K.escenarios.length}"><b>${S(K.desarrollo_pen)}</b></td></tr>
            ${K.primer_pago_total_pen ? `<tr><td><b>Primer pago total: plataforma + primer mes de servicios</b></td>${K.primer_pago_total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Costo total del primer año (plataforma + 12 meses con mantenimiento)</b></td>${K.costo_anio1_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>` : ''}
            ${K.chat_pen ? `<tr><td>De ese total: chat interno y buzón de mensajes</td>${f3(K.chat_pen)}</tr>` : ''}
            <tr><td>${esc(K.ingreso_etiqueta)}</td>${f3(K.ingreso_pen)}</tr>
            <tr><td>Costo de nube / ingreso estimado</td>${K.pct_ingreso.map(v => `<td class="num">${(v * 100).toLocaleString('es-PE', { maximumFractionDigits: 1 })} %</td>`).join('')}</tr>
          </tbody>
        </table></div>
        <ul class="strength">${K.notas.map(n => `<li>${esc(n)}</li>`).join('')}<li>El desarrollo inicial y las horas de mantenimiento son referenciales: reemplácenlos con la cotización real de su desarrollador y verifiquen que el ingreso cubra el mantenimiento mensual.</li></ul>
      </div>`;
    })() : ''}
    ${D.excelPE ? (() => {
      const X = D.excelPE, NIV = pct => pct >= 85 ? 'Sobresaliente' : pct >= 70 ? 'Logrado' : pct >= 50 ? 'En proceso' : 'Inicio';
      const entrega = `<div class="scorebox" id="excel-pe">
        <div class="eyebrow">Evidencia 2 · Excel de costos y punto de equilibrio</div>
        <h3 style="margin:6px 0 8px">Cómo entregar el Excel</h3>
        <ol class="priorities">
          <li><span>Hagan el archivo en <b>.xlsx</b> (si lo trabajan en Google Sheets: Archivo → Descargar → Microsoft Excel).</span></li>
          <li><span>Súbanlo a <b>Google Drive</b> y compártanlo con «Cualquier persona con el enlace → Lector». Nombre: <b>AA2_Cap6_Excel_Punto de equilibrio_Grupo X</b>.</span></li>
          <li><span>Envíen <b>el enlace de Drive</b> al docente. Si no abre, se les pedirá el archivo.</span></li>
          <li><span>Anexen las cotizaciones (capturas o PDF) en una hoja «Cotizaciones» o en la misma carpeta de Drive.</span></li>
          <li><span>Si lo corrigen, suban la nueva versión con el mismo nombre y el mismo enlace.</span></li>
        </ol>`;
      if (X.estado !== 'calificado' || X.logro == null) {
        const lista = [
          'Las 7 piezas del cap. 6, parecidas al modelo del docente: estructura de inversión, costos y gastos, presupuesto de ingresos, presupuesto de egresos, flujo de caja mensual del año 1, flujo económico a 3 años e indicadores (VAN, TIR, B/C, recuperación).',
          'Precio y volumen iguales a los de su informe y su validación (cap. 5); si usan otro precio, explicar por qué.',
          'Todos los costos del MVP, incluidos indirectos, depreciación, mantenimiento y comisiones de pago, clasificados en fijos y variables, con proveedor y fuente.',
          'Hoja «Cotizaciones» con al menos 2 proveedores por rubro (captura o PDF, con fecha y vigencia).',
          'Punto de equilibrio en unidades y en soles, con fórmula (costos fijos ÷ margen de contribución), margen de seguridad y el mes en que se alcanza.',
          'Gráfico del punto de equilibrio donde el eje de unidades cubra el equilibrio y se vea el cruce de ingresos y costos totales, con ejes y series rotulados.',
          'Flujo mensual del año 1 con saldo acumulado y el mes de saldo más bajo (capital necesario); sin contar dos veces el capital de trabajo.',
          'Horizonte de 3 años (no 5), con la tasa de descuento (COK) sustentada.',
          'Escenarios pesimista, base y optimista (ventas −20 % o +20 %, costos +10 %) con una conclusión de viabilidad con números.',
          'Fórmulas vivas (no números pegados), sin errores (#REF!, #DIV/0!, #VALUE!), sin rótulos ni hojas de otros proyectos, sin hojas vacías o duplicadas.',
          'Formato .xlsx, nombre «AA2_Cap6_Excel_Punto de equilibrio_Grupo X» y enlace de Drive con «Cualquier persona con el enlace → Lector».'
        ];
        return entrega + `<p class="summary">Estado: <b>pendiente de entrega</b>. Cuando lo reciban, aquí aparecerá su nota sobre 20 (y su porcentaje de logro) con la retroalimentación por criterio.</p>
        <h4 style="margin:12px 0 6px">Qué debe contener su Excel (revisión previa)</h4><ol class="priorities">${lista.map(m => `<li><span>${esc(m)}</span></li>`).join('')}</ol></div>`;
      }
      const notaX = (Number(X.logro) * 0.2).toFixed(1).replace('.0', '');
      return entrega + `<div class="grade"><span class="big">${notaX} / 20</span><span class="of">nota del Excel · ${Number(X.logro)} % de logro · ${NIV(Number(X.logro))}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio</th><th class="num">Puntaje</th><th>Retroalimentación</th></tr></thead>
          <tbody>${X.criterios.map(c => `<tr><td>${esc(c.nombre)}</td><td class="num">${Number(c.puntaje)} / ${Number(c.peso)}</td><td>${esc(c.comentario || '')}</td></tr>`).join('')}</tbody>
        </table></div>
        ${X.paridad?.length ? `<h4 style="margin:12px 0 6px">Comparación con el modelo del docente</h4><div class="table-wrap"><table>
          <thead><tr><th>Pieza del modelo</th><th>Hoja del grupo</th><th>Estado</th><th>Nota</th></tr></thead>
          <tbody>${X.paridad.map(p => `<tr><td>${esc(p.pieza)}</td><td>${esc(p.hoja || '—')}</td><td>${esc(p.estado || '')}</td><td>${esc(p.nota || '')}</td></tr>`).join('')}</tbody>
        </table></div>` : ''}
        ${X.fortalezas?.length ? `<h4 style="margin:12px 0 6px">Lo que está bien</h4><ul class="strength">${X.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        ${X.mejoras?.length ? `<h4 style="margin:12px 0 6px">Para mejorar</h4><ol class="priorities">${X.mejoras.map(m => `<li><span>${esc(m)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Indicador preliminar elaborado con la rúbrica del Excel de punto de equilibrio. La calificación final de la AA2 la define el docente.${X.revisado ? ' Revisión del ' + esc(X.revisado) + '.' : ''}</p></div>`;
    })() : ''}
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.notasAA2 ? [['nota-aa2', 'Calificación AA2 (/20)', '']] : D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.prototipoHtml ? [['prototipo-aa2', 'Prototipo', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.excelPE ? [['excel-pe', 'Excel de punto de equilibrio', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
