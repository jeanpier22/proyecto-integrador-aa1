<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.scorebox { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-quispe-quintanilla-sosa", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "Frútzuma: concentrados de frutas en sachets individuales", "grupo": "Grupo 7", "seccion": "M394", "fecha": "04/11/2026 (3.ª versión, criterio ajustado) · formulario AA2 revisado el 06/11/2026", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Anyeli Quispe Mamani", "Shiomara Quintanilla Barrios", "Harold Sosa Vega"], "dictamen": "menor", "resumen": "La tercera versión resuelve la mayoría de las contradicciones de la anterior: la vida útil figura como objetivo de 4 meses sujeto a validación en todo el documento, la versión con azúcar añadida y el acesulfame se retiraron, los tres sabores se mantienen en la Tabla 3 y el 2.1, la Tabla 7 recuperó su columna de validación, la ficha (Tabla 4) incluye sostenibilidad, redes sociales y funcionalidades, la Tabla 10 calcula el precio por litro preparado y el 3.3 cierra con la ventaja competitiva y la estrategia de diferenciación, los indicadores tienen ejemplo de cálculo, el problema social ahora tiene cifras de MINAM (2025) y FAO (2026), y la carátula ya indica carrera, sección y grupo. Las hipótesis sobre el problema del cliente son aceptables en esta AA1, que no exige entrevistas ni encuestas reales. Lo que persiste: el 1.4 define una brecha por investigar y no formula con claridad el problema del cliente (quién, cuándo, qué pierde), el mapa de empatía conserva un marcador de posición de plantilla, falta una cifra del mercado de bebidas o del consumo fuera del hogar, la cifra de Arequipa (9,1 %) no coincide con la referencia nacional del INEI (1,3 %), y el diferencial frente a Naturale, FIFU y Zuko continúa siendo una hipótesis. El precio es referencial en esta AA1 y no se observa. Quedan además detalles formales: instrucciones de Word y frases dirigidas al evaluador dentro del texto, el índice sin el apartado 3.4.1, referencias fuera de orden alfabético y la fecha de la carátula sin actualizar.", "fortalezas": ["Resolvieron las contradicciones señaladas: vida útil «Objetivo comercial: 4 meses... condicionado a estudio de vida útil» (Tabla 4), sin versión con azúcar añadida ni acesulfame («no forman parte de la propuesta actual») y tres sabores coherentes en la Tabla 3 y el 2.1.", "El capítulo 1 ahora dimensiona el problema social con cifras oficiales: 8 994 762 toneladas de residuos sólidos municipales en 2024 (MINAM, 2025) y más de 12 millones de toneladas de alimentos perdidos o desperdiciados (FAO, 2026), vinculadas a las metas 3.4, 12.3 y 12.5 (Tabla 2) y a dos megatendencias de CEPLAN (2023). Además, cada dato se acompaña de lo que no prueba, y reconocen la tensión del sachet con el ODS 12 (1.2, último párrafo).", "La Tabla 10 incorpora la columna «Precio por litro preparado» (Naturale S/ 3,27/L; Zuko S/ 0,60/L si rinde 2 L) y el párrafo final del 3.3 reconoce con honestidad que «a S/ 2,00/L... FRÚTZUMA no aspira a ganar por precio» y propone una prueba de sabor a ciegas frente a Zuko en la AA2.", "El capítulo 3 se completó: 3.3 cierra con ventaja competitiva y estrategia de diferenciación, la Tabla 12 añade un ejemplo de cálculo por indicador (marcado como no real), el FODA tiene cuatro estrategias y el 3.4.1 separa la planificación del equipo.", "Recuperaron contenido perdido en la v2: la columna «Validación» de la Tabla 7, las filas de funcionalidad, sostenibilidad y redes sociales de la Tabla 4, el proceso en la Tabla 6 y las redes concretas del canal (Instagram, TikTok, Facebook, WhatsApp Business).", "AA2: Hay filtro de segmento: «Lugar de residencia» (Arequipa / Otro departamento del Perú) y «¿En qué rango de edad te encuentras?» (la opción «Más de 46 años» termina la encuesta), más la pregunta «Ocupación» (Estudias / Trabajas / Ambos), coherentes con el segmento de 18 a 45 años del informe.", "AA2: Se muestran la descripción y dos imágenes del producto antes de preguntar «¿Qué tan atractiva te parece...?» y «¿Qué tan probable sería que probaras...?», lo que aporta validez a esas respuestas.", "AA2: Los sabores se califican en una matriz de 1 a 5 (Maracuyá con mango, Fresa con Sandía, Piña con Jamaica) y la practicidad se plantea con la equivalencia «Un sachet de 60 ml prepara unos 500 ml», que es una formulación más neutral.", "AA2: Ya se incluyen preguntas de presentación (Individual, Kit de 6, Kit de 12), precio y canal, y una pregunta abierta final («¿Qué podemos mejorar en FRÚTZUMA?»), con un consentimiento anónimo y académico en la descripción."], "prioridades": ["Precisar el problema del cliente (1.1 y 1.4) como hipótesis formulada con claridad (quién, en qué situación, con qué frecuencia y qué pierde) y apoyarla con una o dos cifras del mercado de bebidas o del consumo fuera del hogar en Arequipa.", "Rotular las tres entrevistas del anexo como hipótesis de trabajo y, en la AA2 (cap. 5), validarlas con personas reales (fecha, lugar, código anónimo y consentimiento).", "Sustentar el diferencial: en la AA2 validar con prueba ciega frente a Zuko y Naturale y valorar un atributo más difícil de imitar (mezclas con frutas regionales, venta institucional).", "Limpiar el documento: quitar la instrucción de Word del índice y el marcador «[Espacio para incorporar...]» de la Tabla 8, retirar las frases dirigidas al evaluador, ordenar y completar las referencias (Tottus a/b, orden alfabético, verificar INEI) y actualizar índice y fecha.", "AA2: Definir por escrito, antes de aplicar, las hipótesis, el tamaño y método de muestra y el criterio de aceptación de cada una (p. ej., «al menos 60 % compra a S/ 1,00»), y analizar después los resultados contra esos criterios.", "AA2: Probar directamente el precio de S/ 1,00 por sachet y los precios por kit (S/ 5,50 y S/ 10,50) con la pregunta «¿Lo comprarías a este precio?» y un precio máximo y mínimo aceptable, en rangos continuos que incluyan menos de S/ 1,00.", "AA2: Agregar preguntas sobre acceso a agua potable y recipiente fuera de casa, canal de retiro o pedido agrupado y qué compra hoy el cliente (marca y gasto), para validar el modelo y no solo el interés.", "AA2: Reformular las preguntas que inducen la respuesta, completar y ordenar las opciones, y marcar como obligatorias las preguntas clave.", "AA2: Aplicar el instrumento a muestra real del segmento, presentar tablas de resultados con n, y proponer mejoras concretas al MVP a partir de los datos (cap. 5)."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, con análisis crítico de lo que aportan al proyecto en torno a megatendencias y ODS.", "falta": "Cumple: fuentes oficiales de 2023 a 2026 (CEPLAN, INEI, MINAM, FAO, OMS, OSIPTEL, ONU), analizadas con criterio y vinculadas a las metas 3.4, 12.3 y 12.5. Para sostener el nivel, verificar que la cifra de Arequipa (9,1 %, INEI 2026) figure en la nota citada, porque la referencia habla de un incremento nacional de 1,3 %, y que la URL del informe de enfermedades no transmisibles corresponda a 2025 y no a 2024; añadir un dato del mercado de bebidas."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencias cualitativas y cuantitativas, con vínculo con megatendencias, ODS y necesidades del cliente.", "falta": "Cumple: la parte cuantitativa y el vínculo con ODS y megatendencias están bien, y las hipótesis sobre el cliente son aceptables en la AA1. Para llegar al nivel sobresaliente falta formular el problema del cliente con claridad en el 1.4 (quién, cuándo, qué pierde) y añadir una cifra del mercado de bebidas o del consumo fuera del hogar."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Todos los elementos están y ahora son coherentes entre sí. El diferencial (dosis personal, tres mezclas y retiro agrupado) sigue siendo una hipótesis que el propio informe no presenta como exclusiva, en una categoría cercana a las de baja innovación del Anexo 2; falta demostrarlo con datos."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia entre los nueve bloques y la propuesta de valor.", "falta": "BMC de nueve bloques, coherencia por pares (3.2.1), competidores con precio por litro, ventaja competitiva e indicadores con ejemplo. Falta retirar el marcador de plantilla del cuadrante «Dice y hace» del mapa de empatía y completarlo con frases hipotéticas del segmento."}], "viabilidad": {"resumen": "La v3 es más cautelosa y quita las decisiones de formulación más riesgosas (azúcar añadida y acesulfame). El choque más fuerte sigue siendo el registro sanitario; los costos y márgenes se trabajarán en el cap. 6 (AA2), por lo que el precio es referencial.", "riesgos": [{"tema": "Regulación", "titulo": "Registro sanitario, HACCP y rotulado", "choque": "Un concentrado envasado con vida útil de 4 meses necesita registro sanitario, análisis de laboratorio acreditado, plan HACCP y rotulado conforme al Manual de Advertencias Publicitarias. Incluso la versión «sin azúcar añadida» contiene azúcares libres según la OMS (2026), como el propio informe indica.", "ideas": ["Averiguar en DIGESA el costo y plazo del registro y sumarlos al costeo de la AA2.", "Consultar a un tecnólogo de alimentos para simular el rotulado de cada formulación.", "Buscar una maquila de Arequipa con habilitación sanitaria y HACCP."]}, {"tema": "Costos", "titulo": "Costos y margen por definir en el cap. 6", "choque": "El precio de S/ 1,00 por sachet es referencial; la tabla de costos, gastos y egresos corresponde al cap. 6 (AA2). Se anticipa que el envase de barrera, el lote mínimo y el laboratorio influirán en el margen.", "ideas": ["Obtener cotizaciones de maquila y de envase para el cap. 6.", "Calcular el margen por canal (retiro propio frente a cafetería)."]}, {"tema": "Competencia", "titulo": "Competidores con sachets y atributo copiable", "choque": "Naturale y FIFU ya venden sachets y el atributo diferencial es copiable.", "ideas": ["Hacer la prueba ciega de sabor en la AA2.", "Probar un diferencial más difícil de copiar, como frutas regionales."]}, {"tema": "Adopción", "titulo": "Se necesita agua segura y un recipiente", "choque": "El informe lo reconoce (Tabla 1, caso 1), pero aún no define si el cliente lleva botella o agua. Sin esa respuesta se pierde la practicidad frente a una bebida lista.", "ideas": ["Plantear la pregunta sobre agua y recipiente como hipótesis y contrastarla en la AA2.", "Empezar el piloto en institutos u oficinas con dispensadores."]}, {"tema": "Operación", "titulo": "Vida útil objetivo y puntos de retiro", "choque": "La vida útil de 4 meses es un objetivo sin estudio de estabilidad, y los puntos de retiro dependen de cafeterías que todavía no han sido consultadas.", "ideas": ["Consultar a un laboratorio universitario por un estudio acelerado.", "Conversar con dos o tres cafeterías sobre comisión y almacenamiento."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "completo", "nota": "Ya incluye carrera, sección (M394) y grupo 7; la fecha sigue siendo 30 de octubre."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Contiene una instrucción de Word dirigida al lector («regenera la tabla de contenido desde Referencias»), agrupa «2.3–2.4» aunque son apartados separados y omite el 3.4.1."}, {"codigo": "—", "apartado": "Introducción", "estado": "completo", "nota": "Presenta propósito, alcance y estructura, y advierte que no se atribuyen testimonios."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "completo", "nota": "Tabla 1 con causas y consecuencias; se presenta como hipótesis, aceptable en la AA1."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "Cifras de MINAM (2025), FAO (2026) e INEI (2026), metas 3.4, 12.3 y 12.5 (Tabla 2) y megatendencias de CEPLAN."}, {"codigo": "1.3", "apartado": "Megatendencia, oportunidad comercial y pregunta", "estado": "completo", "nota": "Incluye precios de sustitutos y la pregunta central."}, {"codigo": "1.4", "apartado": "Definición del problema", "estado": "incompleto", "nota": "Define una brecha por investigar y no formula con claridad el problema del cliente (quién, cuándo, qué pierde)."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Tres sabores y diferenciación coherentes; el diferencial no se declara exclusivo."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Tabla 4 con sostenibilidad, redes, funcionalidades y pruebas; precio (2.2.1) y proceso (2.2.2) completos."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Cinco beneficios en un solo párrafo, vinculados a la Tabla 1."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "La Tabla 7 recuperó la columna de validación."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Segmentación 2.5.1 a 2.5.6."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Seis casos breves."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "incompleto", "nota": "Tabla 8 con hipótesis; «Dice y hace» mantiene un marcador de posición de plantilla."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Tabla 9, Figura 1 y coherencia por pares en 3.2.1."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Tabla 10 con precio por litro, ventaja competitiva y estrategia de diferenciación."}, {"codigo": "3.4", "apartado": "FODA", "estado": "completo", "nota": "Con cuatro estrategias; la planificación del equipo pasó al 3.4.1."}, {"codigo": "3.5", "apartado": "Indicadores de gestión", "estado": "completo", "nota": "Cinco indicadores con fórmula, meta, frecuencia y ejemplo de cálculo."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Todas las fuentes se citan, pero las entradas no están en orden alfabético y dos de Tottus Perú (s. f.) necesitan a/b."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Mejora el problema social, que ahora tiene datos oficiales, y se mantiene la separación entre problema del cliente y problema social. Las hipótesis sobre el cliente son aceptables en esta AA1; falta formular con claridad el problema en el 1.4.", "observaciones": [{"severidad": "sugerencia", "titulo": "Rotular las entrevistas del anexo como hipótesis y validarlas en la AA2", "ubicacion": "Introducción; 1.1, Tabla 1; Anexo", "cita": "Incluye tres entrevistas simuladas para orientar el trabajo de campo", "problema": "El informe declara con claridad que las tres entrevistas del anexo son simuladas y que no se usan en los capítulos 1 a 3; esto es aceptable en la AA1 y no constituye falta de integridad. Conviene presentarlas como hipótesis de trabajo.", "mejora": "Rotular el anexo como hipótesis de trabajo y, en el cap. 5 (AA2), validarlas con personas reales de Arequipa, con fecha, lugar, código anónimo y consentimiento."}, {"severidad": "importante", "titulo": "El 1.4 describe lo que se estudiará y no formula el problema del cliente", "ubicacion": "1.1 (primer párrafo) y 1.4", "cita": "aún no se ha demostrado si estas alternativas satisfacen a quienes buscan preparar una bebida de sabor frutal", "problema": "Las cautelas son valiosas, pero el 1.4 no define el problema del cliente de forma concreta (qué le ocurre, con qué frecuencia, qué pierde): describe lo que el grupo estudiará. Aunque se plantee como hipótesis, la definición debe ser una afirmación clara.", "mejora": "Redactar el 1.4 como una hipótesis explícita, por ejemplo: «Los estudiantes y trabajadores de 18 a 45 años de Arequipa no preparan bebidas fuera de casa porque...», y dejar la incertidumbre para el plan de validación de la AA2."}, {"severidad": "importante", "titulo": "Falta una cifra del mercado o del consumo fuera del hogar en Arequipa", "ubicacion": "1.1 y 1.3", "cita": "no representa una medida de demanda del producto", "problema": "Las cifras del INEI sobre consumo de fruta, exceso de peso y población ocupada se aclaran como contexto, no como demanda. Siguen sin aparecer el tamaño o crecimiento del mercado de bebidas o refrescos ni el gasto fuera del hogar. El dato del estudio de Guzman-Vilca et al. (2022) proviene de 2017-2018.", "mejora": "Agregar una o dos cifras recientes del mercado de bebidas (INEI-ENAHO, Euromonitor o Kantar, citadas en APA) y la población de 18 a 45 años que estudia o trabaja en Arequipa."}, {"severidad": "sugerencia", "titulo": "Verificar la cifra de Arequipa del INEI y la referencia", "ubicacion": "1.1, tercer párrafo; Referencias", "cita": "la población ocupada de la ciudad de Arequipa aumentó 9,1 %", "problema": "La referencia citada se titula «Población ocupada a nivel nacional se incrementó 1,3 %...» y no está claro que la nota contenga el dato de la ciudad de Arequipa. La otra referencia del INEI dice 2025 en el título y 2024 en la URL.", "mejora": "Comprobar que ambos datos figuren en el documento citado, corregir la URL si corresponde y citar la tabla o página exacta."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "Los apartados están completos y ya no se contradicen. El diferencial sigue en el plano de la hipótesis.", "observaciones": [{"severidad": "critico", "titulo": "El diferencial sigue sin demostrarse y se declara no exclusivo", "ubicacion": "2.1, tercer párrafo; 3.3, ventaja competitiva", "cita": "Esta combinación no se presenta como exclusiva hasta contrastarla", "problema": "El informe reconoce que Naturale y FIFU ya comercializan sachets y que la combinación de tres sabores mixtos, dosis para 500 ml y retiro agrupado «todavía no demuestra exclusividad». Los concentrados y refrescos están cerca de la categoría de baja innovación del Anexo 2 de los lineamientos, por lo que se necesita una diferenciación comprobada, no solo planteada.", "mejora": "Elegir el atributo más fuerte y respaldarlo con datos del prototipo: prueba ciega frente a Zuko y Naturale, disposición a pagar, y un atributo más difícil de imitar (frutas regionales, venta institucional). Anotar el resultado en la AA2."}, {"severidad": "sugerencia", "titulo": "Redacción dirigida al evaluador y exceso de salvedades", "ubicacion": "Introducción; 2.2 (nota de la Tabla 4); Anexo", "cita": "El docente solicita más entrevistas reales para acreditar evidencia cualitativa.", "problema": "Algunas frases le hablan al docente y no al lector (en el anexo: «El docente solicita...»). Casi todos los párrafos repiten que algo es una hipótesis o que «no se afirma», lo que resta claridad sobre qué decidió el equipo.", "mejora": "Reunir las limitaciones en un párrafo y redactar el resto con decisiones claras; quitar las referencias directas al docente."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "BMC argumentado, competidores comparables por litro, ventaja competitiva, FODA e indicadores con ejemplo. Falta que el mapa de empatía tenga voz del cliente.", "observaciones": [{"severidad": "sugerencia", "titulo": "Completar el cuadrante «Dice y hace» del mapa de empatía", "ubicacion": "3.1, Tabla 8", "cita": "[Espacio para incorporar dos o tres frases literales de los entrevistados, con códigos E01–E10 y fecha.]", "problema": "El cuadrante «Dice y hace» conserva un texto de plantilla. Con hipótesis basta en la AA1, por lo que no afecta el nivel del criterio; conviene completarlo.", "mejora": "Completar el mapa con dos o tres frases hipotéticas del segmento por cuadrante clave, rotuladas como supuestos del grupo, y quitar el marcador."}, {"severidad": "sugerencia", "titulo": "BMC: canales y cafeterías con doble rol", "ubicacion": "3.2, Tabla 9; 2.5.6", "cita": "cafeterías: puntos de retiro o compradoras mayoristas, según contrato", "problema": "Las cafeterías aparecen como canal (Tabla 9) y como cliente secundario (2.5.6). La Figura 1 repite celdas combinadas que no se distinguen en la maquetación.", "mejora": "Precisar si la cafetería es canal o cliente y su rol en los ingresos; revisar el título y el formato de la Figura 1 según APA 7."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Carátula completa y todas las fuentes citadas. Quedan instrucciones de Word en el texto, un índice incompleto y referencias sin ordenar.", "observaciones": [{"severidad": "importante", "titulo": "Índice con instrucciones de Word y apartados faltantes", "ubicacion": "Índice", "cita": "Índice de consulta de esta versión. Los apartados utilizan estilos de título de Word; si se modifica el contenido, regenera la tabla de contenido desde Referencias → Tabla de contenido.", "problema": "Es una instrucción dirigida a quien edita, no al lector. El índice agrupa «2.3–2.4» (en el cuerpo son apartados separados), omite el 3.4.1 y el 1.3 figura con otro nombre; los números de página no se pueden contrastar con el cuerpo del DOCX.", "mejora": "Generar el índice automático, eliminar la nota y comprobar los números de página en el PDF final."}, {"severidad": "importante", "titulo": "Referencias fuera de orden y con entradas ambiguas", "ubicacion": "Referencias bibliográficas", "cita": "Tottus Perú. (s. f.). Bebida instantánea en polvo Zuko naranja... / Tottus Perú. (s. f.). Zuko: bebidas instantáneas...", "problema": "Las entradas de Procefrut Perú, OSIPTEL, OMS, Osterwalder y Pigneur, y Vivanda aparecen después de Wong y Tottus, sin orden alfabético. Dos entradas de Tottus Perú tienen el mismo autor y año sin a/b. Procefrut Perú se usa para D' Kampu; conviene decirlo en el texto. Los títulos de libros, informes y revistas deben ir en cursiva.", "mejora": "Ordenar alfabéticamente, diferenciar con s. f.-a y s. f.-b, aclarar la entrada de D' Kampu y revisar las cursivas."}, {"severidad": "sugerencia", "titulo": "Fecha y detalles de maquetación", "ubicacion": "Carátula; Figura 1", "cita": "Arequipa, Perú  ·  30 de octubre de 2026", "problema": "La fecha de la carátula no se actualizó respecto a la v2. Falta un espacio tras «Sección:» y la Figura 1 repite celdas combinadas.", "mejora": "Actualizar la fecha, revisar la maquetación y hacer una lectura final de erratas."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Encuesta de validación del MVP y del modelo de negocio (cap. 5)", "resumen": "Revisión sobre la versión en línea vigente al 11/11/2026. El instrumento mejoró en segmentación y presentación del producto, pero no cubre la validación del modelo de negocio ni tiene criterios de aceptación, muestra ni resultados.", "observaciones": [{"severidad": "critico", "titulo": "No se valida el precio de referencia ni las presentaciones del informe", "ubicacion": "Sección V; informe 2.2.1 y Tabla de precios", "cita": "«¿Cuánto estarías dispuesto(a) a pagar por un sachet individual de FRÚTZUMMA?» (De S/ 1.00 a S/ 1.50 / De S/ 1.60 a S/ 2.00 / Más de S/ 2.00)", "problema": "El informe plantea S/ 1,00 por sachet, S/ 5,50 por kit de seis y S/ 10,50 por kit de doce, y el formulario no pone a prueba ninguno de esos precios. Los rangos arrancan en S/ 1,00, por lo que quien pagaría menos no tiene opción, y los tramos están desordenados (hay un vacío entre S/ 1,50 y S/ 1,60). Además, «¿Cómo preferirías comprar FRÚTZUMA?» ofrece un Kit de 24 que el informe no contempla y no indica el precio de ninguna presentación. Sin esto no se puede decidir el precio de la AA2 ni calcular ingresos del cap. 6.", "mejora": "Preguntar «¿Comprarías un sachet a S/ 1,00?» (Sí / Depende / No) y presentar cada kit con su precio. Usar una escala de sensibilidad al precio (demasiado barato / conveniente / caro / demasiado caro) y rangos continuos que incluyan menos de S/ 1,00. Eliminar el kit de 24 o justificarlo en el cap. 4."}, {"severidad": "critico", "titulo": "No hay criterios de validación, tamaño de muestra ni plan de análisis", "ubicacion": "Informe, cap. 4 (H1 a H4, «Encuesta a 50 personas del segmento objetivo»); formulario completo", "cita": "«Encuesta a 50  personas del segmento objetivo.»", "problema": "El informe menciona 50 personas, pero ni el informe ni el formulario establecen cómo se elegirá la muestra, qué porcentaje mínimo confirma cada hipótesis ni qué decisión del MVP cambiaría si no se cumple. Sin ello no hay análisis crítico posible y el criterio «Validación del modelo de negocio» no puede pasar de la etapa de herramienta. Tampoco se registra el medio por el que llegó cada respuesta, lo que impide detectar sesgo de familiares y amigos.", "mejora": "Escribir en el cap. 5 una tabla Hipótesis, Pregunta que la mide, Muestra y Criterio de aceptación (por ejemplo, «al menos 60 % califica 4 o 5 en atractivo y 40 % compraría a S/ 1,00»), definir cuotas por ocupación y edad y registrar el origen de cada respuesta."}, {"severidad": "importante", "titulo": "No se pregunta por acceso a agua potable ni recipiente, condición de uso del producto", "ubicacion": "Secciones II a V; informe 2.5 (segmento) y Caso 1", "cita": "El informe: «tienen acceso habitual a agua potable»; el formulario no incluye ninguna pregunta sobre agua", "problema": "El producto se diluye en agua potable y el informe lo declara como condición del segmento y como hipótesis por validar. Si el cliente no cuenta con agua o botella en su jornada, la propuesta de practicidad deja de funcionar. El formulario nunca lo consulta.", "mejora": "Agregar «Fuera de casa, ¿tienes acceso a agua potable y a un recipiente para prepararlo?» (Siempre / A veces / Casi nunca) y analizarla cruzada con intención de compra."}, {"severidad": "importante", "titulo": "El canal no incluye las opciones del modelo ni se compra por pedido agrupado", "ubicacion": "Sección V, pregunta de canal; informe 3.2 (BMC, canales)", "cita": "«Canal por el cual preferirías adquirir el producto.» (Whtasapp / Distribución por bodegas o tiendas / Supermercados)", "problema": "El BMC plantea pedidos por WhatsApp, puntos de retiro y pedidos agrupados, pero el formulario no ofrece punto de retiro, institutos u oficinas ni pregunta si pediría con compañeros. Sobran supermercados, que no figuran en el modelo. Además, está escrito «Whtasapp» y la pregunta no es una pregunta.", "mejora": "Reformular como «¿Cómo preferirías comprarlo?» con: WhatsApp con retiro en un punto, delivery, bodega o tienda cercana, cafetería del instituto o trabajo, otra; y preguntar «¿Pedirías junto con compañeros para un kit?»."}, {"severidad": "importante", "titulo": "No se identifica qué consume y paga hoy el cliente ni se incluyen los competidores reales", "ubicacion": "Sección II, «Cuando tienes poco tiempo, ¿qué bebida sueles elegir?»", "cita": "«Jugos preparados (pura fruta) / Gaseosas / Refresco en polvo / Agua / Frugos / Otro»", "problema": "Faltan los concentrados líquidos en sachet o botella, que son la competencia directa del informe (Naturale, FIFU) y Zuko. Tampoco se pregunta cuánto gasta ni cuándo fue la última vez que compró una bebida fuera de casa, que es el dato más confiable. Es una pregunta de una sola respuesta y no permite medir la frecuencia por tipo de bebida.", "mejora": "Agregar «Concentrado en sachet o botella» como opción, preguntar «¿Cuándo fue la última vez que compraste una bebida fuera de casa, cuál y cuánto pagaste?» y pedir la marca de refresco o concentrado."}, {"severidad": "importante", "titulo": "Preguntas que inducen la respuesta", "ubicacion": "Sección II y III", "cita": "«¿Tiene dificultades para tomar bebidas de fruta durante el día?» (Si / No / Ninguna); descripción: «fácil de preparar, ideal para personas con poco tiempo»", "problema": "La primera tiene opciones superpuestas (No y Ninguna significan lo mismo), no pregunta cuál es la dificultad y no abre la causa; el tratamiento de usted rompe con el tuteo del resto. La descripción previa a la pregunta de atractivo usa adjetivos favorables («fácil», «ideal») que condicionan la nota. Además «atractiva» y «probable que probaras» miden casi lo mismo y ambas se leen como cortesía.", "mejora": "Cambiar a «¿Qué dificultades tienes para tomar bebidas de fruta durante el día?» con opciones concretas y «Ninguna». Quitar los adjetivos de la descripción, usar una sola pregunta de intención («¿Lo comprarías?») y comparar con lo que el cliente hace hoy."}, {"severidad": "importante", "titulo": "Opciones de respuesta incompletas", "ubicacion": "Sección I y II", "cita": "Frecuencia: «Menos de una vez a la semana / 1 a 2 veces por semana / 3 a 4 veces por semana / 5 a 6 veces por semana»; edad: «36 a 45 años» y «Más de 46 años»", "problema": "En frecuencia faltan «Nunca» y «Todos los días»; quien nunca toma refrescos o los toma a diario no tiene opción. En edad, quien tiene 46 años queda sin opción exacta («36 a 45» y «Más de 46»). La opción «Otro» de bebida aparece en blanco. Todas las preguntas, salvo los sabores, son opcionales, por lo que pueden quedar sin responder las claves.", "mejora": "Completar frecuencia con «Nunca» y «Todos los días», cambiar la última edad a «Más de 45 años», rotular la opción «Otra (especifica)» y marcar como obligatorias las preguntas clave."}, {"severidad": "sugerencia", "titulo": "Los sabores no obligan a elegir ni capturan nuevas opciones", "ubicacion": "Sección IV, matriz de sabores", "cita": "«¿Qué tanto te agradaría estos sabores?» (Maracuyá con mango / Fresa con Sandía / Piña con Jamaica, 1 a 5)", "problema": "En una matriz de 1 a 5 es habitual que todos reciban 4 o 5, lo que hace al resultado previsible. Tampoco hay una pregunta abierta para otros sabores ni se co     <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

const fmt = n => Number(n).toLocaleString('es-PE', { maximumFractionDigits: 2 });
const renderSec = (s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    ${s.puntuacion ? `<div class="scorebox">

      <div class="table-wrap"><table>
        <thead><tr><th>Dimensión</th><th class="num">Puntos</th></tr></thead>

      ${s.puntuacion.nota ? `<p class="summary">${esc(s.puntuacion.nota)}</p>` : ''}

        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>

      </li>`;

    ${s.preguntas?.length ? `<div><h3 style="margin-bottom:8px">Preguntas que podrían mejorar el formulario</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Pregunta sugerida</th><th>Opciones o escala</th><th>Para qué sirve</th></tr></thead>
        <tbody>${s.preguntas.map(q => `<tr><td>${esc(q.pregunta)}</td><td>${esc(q.opciones)}</td><td>${esc(q.mide)}</td></tr>`).join('')}</tbody>

    ${s.consejos?.length ? `<div><h3 style="margin-bottom:8px">Consejos para que los resultados no salgan vacíos ni previsibles</h3>
      <ul class="strength">${s.consejos.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
  </section>`;
};
D.secciones.forEach((s, si) => { if (!isAA2(s)) renderSec(s, si); });
html += '</div>';

if (hasAA2) {
  html += '<div id="tab-aa2" class="tabpane" hidden>';
  html += `<section class="block aa2" id="aa2">
    <div class="head"><div class="eyebrow">Evidencia 2 · avance en curso</div><h2>Evidencia 2 (AA2): retroalimentación de avance</h2></div>
    <p class="summary">Esta parte corresponde a la Evidencia 2 (capítulos 4, 5 y 6 y elevator pitch). Es retroalimentación formativa para que puedan mejorar mientras avanzan. ${D.fecha_aa2 ? `Última actualización: ${esc(D.fecha_aa2)}. ` : ''}Se irá actualizando en este mismo enlace.</p>
    ${D.calificacionAA2 ? (() => {
      const p = Number(D.calificacionAA2.validacion);
      const NIV2 = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
      return `<div class="scorebox" id="nota-aa2">
        <div class="eyebrow">Calificación preliminar parcial · solo del formulario de validación</div>
        <div class="grade"><span class="big">${p}</span><span class="of">/ 4</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio de la rúbrica AA2</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
          <tbody>
            <tr><td>Validación del modelo de negocio (cap. 5)</td><td><span class="lvl l${p}">${NIV2[p] ?? '—'}</span></td><td class="num">${p} / 4</td></tr>
            <tr><td>Planteamiento del MVP · Herramientas · Análisis presupuestal · Compromiso</td><td>Pendiente</td><td class="num">—</td></tr>
          </tbody>
        </table></div>
        <p class="summary">Esta nota evalúa solo el instrumento (el formulario), porque aún no hay resultados reales. Para subir de nivel: con muestra real y análisis de resultados (n y %) se llega a 3; con mejoras al MVP derivadas de esos datos, a 4. La calificación final de la AA2 la define el docente e incluye los demás criterios y la exposición.</p>
      </div>`;
    })() : ''}
    ${D.costosAA2 ? (() => {
      const K = D.costosAA2, S = n => 'S/ ' + Number(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const f3 = arr => arr.map(v => `<td class="num">${S(v)}</td>`).join('');
      const sup = v => Number(v).toLocaleString('es-PE', { maximumFractionDigits: 2 });
      return `<div class="costos" id="costos-aa2">
        <h3 style="margin:18px 0 8px">Costos de nube y servicios digitales (estimación)</h3>
        <p class="summary">Estimación mensual con proveedores reales (Google Cloud / Firebase, OpenAI, WhatsApp) para tres escenarios de uso. Los volúmenes son supuestos elaborados a partir de su MVP: reemplácenlos con los datos de su prototipo. Tipo de cambio: S/ ${esc(K.tipo_cambio)} por USD. Los precios son cifras de referencia que deben confirmarse con la calculadora oficial de cada proveedor.</p>
        ${K.necesidades ? `<h4 style="margin:14px 0 6px">Qué necesita su proyecto, con proveedor y precio</h4>
        <p class="summary">${esc(K.necesidades.resumen)} Estado del precio: <b>Verificado</b> (fuente oficial, 11/11/2026), <b>Referencial</b> (confirmar en la lista oficial del proveedor) y <b>Cotizar</b> (pidan 2 o más cotizaciones y anéxenlas). Úsenla para armar su Excel.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Rubro</th><th>Qué necesitan (según su informe)</th><th>Proveedor · producto</th><th>Precio de referencia</th><th>Estado</th></tr></thead>
          <tbody>${K.necesidades.items.map(i => `<tr><td><b>${esc(i.rubro)}</b><br><span class="where">${esc(i.origen)}</span></td><td>${esc(i.necesidad)}</td><td>${esc(i.proveedor)}<br><span class="where">${esc(i.producto)}</span></td><td>${esc(i.precio)}${i.nota ? `<br><span class="where">${esc(i.nota)}</span>` : ''}</td><td><span class="lvl ${i.estado === 'Verificado' ? 'l4' : i.estado === 'Referencial' ? 'l2' : 'l1'}">${esc(i.estado)}</span></td></tr>`).join('')}</tbody>
        </table></div>` : ''}
        ${D.calculadoraXlsx ? `<p class="summary" style="margin-top:12px"><b>Calculadora de su proyecto:</b> <a href="${esc(D.calculadoraXlsx)}" download>descargar Excel</a>. Cambien la cantidad de usuarios en la columna «Calculadora (edite)» y verán el costo mensual de los servicios, el primer pago para construir la plataforma, el mantenimiento (bolsa de horas o un encargado fijo) y el costo del primer año.</p>` : ''}
        <div class="table-wrap"><table>
          <thead><tr><th>Supuesto de uso</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.supuestos.map(r => `<tr><td>${esc(r.concepto)} <span class="where">${esc(r.unidad)}</span></td>${r.valores.map(v => `<td class="num">${sup(v)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Servicio (costo mensual)</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.costos.map(r => `<tr><td>${esc(r.concepto)}</td>${f3(r.valores)}</tr>`).join('')}
            <tr><td><b>Total mensual</b></td>${K.total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td>Primer pago (mes 1, con dominio anual)</td>${f3(K.primer_pago_pen)}</tr>
            <tr><td>Mantenimiento del desarrollador (horas al mes x S/ ${esc(K.tarifa_mantenimiento)} por hora)</td>${f3(K.mantenimiento_pen)}</tr>
            <tr><td><b>Total mensual con mantenimiento</b></td>${K.total_con_mant_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Desarrollo inicial de la plataforma (pago único al desarrollador, a S/ ${esc(K.tarifa_desarrollo)} por hora)</b></td><td class="num" colspan="${K.escenarios.length}"><b>${S(K.desarrollo_pen)}</b></td></tr>
            ${K.primer_pago_total_pen ? `<tr><td><b>Primer pago total: plataforma + primer mes de servicios</b></td>${K.primer_pago_total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Costo total del primer año (plataforma + 12 meses con mantenimiento)</b></td>${K.costo_anio1_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>` : ''}
            ${K.chat_pen ? `<tr><td>De ese total: chat interno y buzón de mensajes</td>${f3(K.chat_pen)}</tr>` : ''}
            <tr><td>${esc(K.ingreso_etiqueta)}</td>${f3(K.ingreso_pen)}</tr>
            <tr><td>Costo de nube / ingreso estimado</td>${K.pct_ingreso.map(v => `<td class="num">${(v * 100).toLocaleString('es-PE', { maximumFractionDigits: 1 })} %</td>`).join('')}</tr>
          </tbody>
        </table></div>
        <ul class="strength">${K.notas.map(n => `<li>${esc(n)}</li>`).join('')}<li>El desarrollo inicial y las horas de mantenimiento son referenciales: reemplácenlos con la cotización real de su desarrollador y verifiquen que el ingreso cubra el mantenimiento mensual.</li></ul>
      </div>`;
    })() : ''}
    ${D.excelPE ? (() => {
      const X = D.excelPE, NIV = pct => pct >= 85 ? 'Sobresaliente' : pct >= 70 ? 'Logrado' : pct >= 50 ? 'En proceso' : 'Inicio';
      const entrega = `<div class="scorebox" id="excel-pe">
        <div class="eyebrow">Evidencia 2 · Excel de costos y punto de equilibrio</div>
        <h3 style="margin:6px 0 8px">Cómo entregar el Excel</h3>
        <ol class="priorities">
          <li><span>Hagan el archivo en <b>.xlsx</b> (si lo trabajan en Google Sheets: Archivo → Descargar → Microsoft Excel).</span></li>
          <li><span>Súbanlo a <b>Google Drive</b> y compártanlo con «Cualquier persona con el enlace → Lector». Nombre: <b>AA2_Cap6_Excel_Punto de equilibrio_Grupo X</b>.</span></li>
          <li><span>Envíen <b>el enlace de Drive</b> al docente. Si no abre, se les pedirá el archivo.</span></li>
          <li><span>Anexen las cotizaciones (capturas o PDF) en una hoja «Cotizaciones» o en la misma carpeta de Drive.</span></li>
          <li><span>Si lo corrigen, suban la nueva versión con el mismo nombre y el mismo enlace.</span></li>
        </ol>`;
      if (X.estado !== 'calificado' || X.logro == null) {
        return entrega + `<p class="summary">Estado: <b>pendiente de entrega</b>. Cuando lo reciban, aquí aparecerá su porcentaje de logro (0 a 100 %) con la retroalimentación por criterio.</p></div>`;
      }
      return entrega + `<div class="grade"><span class="big">${Number(X.logro)} %</span><span class="of">de logro · ${NIV(Number(X.logro))}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio</th><th class="num">Puntaje</th><th>Retroalimentación</th></tr></thead>
          <tbody>${X.criterios.map(c => `<tr><td>${esc(c.nombre)}</td><td class="num">${Number(c.puntaje)} / ${Number(c.peso)}</td><td>${esc(c.comentario || '')}</td></tr>`).join('')}</tbody>
        </table></div>
        ${X.fortalezas?.length ? `<h4 style="margin:12px 0 6px">Lo que está bien</h4><ul class="strength">${X.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        ${X.mejoras?.length ? `<h4 style="margin:12px 0 6px">Para mejorar</h4><ol class="priorities">${X.mejoras.map(m => `<li><span>${esc(m)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Indicador preliminar elaborado con la rúbrica del Excel de punto de equilibrio. La calificación final de la AA2 la define el docente.${X.revisado ? ' Revisión del ' + esc(X.revisado) + '.' : ''}</p></div>`;
    })() : ''}
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.excelPE ? [['excel-pe', 'Excel de punto de equilibrio', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
