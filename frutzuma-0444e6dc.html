 0 celdas con error (antes 37 #VALUE!), porque Supuestos!B26 pasó de texto «24.65%» a 0,2465 numérico; Prestamo, EERR y Flujos calculan; el libro tiene 513 fórmulas, 12 hojas visibles, supuestos editables en celdas amarillas y 2 gráficos. Persisten: Mercado!B7 y B8 en texto («2.5%», «66.7%»), Mercado!B14:B16 números pegados (TAM, SAM, SOM) en lugar de fórmulas, Mercado!A1 = «ll» (título borrado), Mercado!S8 con texto basura; Supuestos!G17:G19 demanda escrita sin fórmula ni fuente; falta la fila de Producción en Proyeccion (Costos_Fijos!H7 no se usa); Resumen!C36 no concuerda con el costo fijo usado; Flujos!D9:F9 y D19:F21 ceros pegados; sin hoja de cotizaciones/fuentes; gráficos con ejes rotulados al revés (PE) o sin título (Flujos). Instrucciones, Costos_Fijos, Costos_Variables e Inversion sin cambios.", "señal_auto_pct": 75, "faltan_palabras": [], "logro_pct": 50}], "fortalezas": ["Avance reconocido (13/11, tercera entrega): cargaron la demanda del año 1 (Supuestos!G17:G19 = 24 000 + 9 600 + 14 400) y por primera vez el modelo produce ingresos (S/ 86 400; 88 819; 91 306), margen de contribución, utilidad, flujo y PE (Proyeccion!C18:E28; EERR!C5:E15).", "Corrigieron Supuestos!B26 (TEA 0,2465 numérica): desaparecieron los 37 #VALUE! y ahora Prestamo (cuota S/ 2 548,20), EERR y Flujos calculan sin errores.", "Flujo económico y financiero a 3 años con VAN (S/ 27 370,24), TIR (60,9 %), PRI (1,51 años) y B/C (1,92) operativos (Flujos!C25:C30); recalculados con Python coinciden con sus supuestos.", "PE calculado con fórmula CF ÷ margen ponderado (29 608 unid., S/ 53 294, margen de seguridad 38,3 %) y gráfico en el que ya se ve el cruce de ingresos y costo total (PE!B32:E42).", "Conservan lo avanzado antes: Inversión fija de 14 ítems (S/ 10 023,30), costos fijos de 12 rubros con personal de producción (S/ 6 670/mes), hoja Mercado con TAM-SAM-SOM y capacidad (4 000/mes) y verificaciones de Resumen que ahora marcan REVISAR donde la demanda excede SOM y capacidad."], "mejoras": ["PRIORIDAD 1: integrar los costos fijos de Producción (Costos_Fijos!H7 = S/ 3 310/mes) a Proyeccion (nueva fila entre C31 y C32), EERR, Flujos, PE y capital de trabajo (Inversion!F24). Hoy el VAN de S/ 27 370 y la TIR de 60,9 % se apoyan en un costo fijo de S/ 41 531,35; recalculado con Python con producción (S/ 81 251,35) el PE ≈ 57 924 unid. (> capacidad 48 000), la utilidad operativa es negativa (≈ −S/ 13 921 en año 1) y el VAN ≈ −S/ 48 659. Sin esto las conclusiones del libro no son confiables.", "PRIORIDAD 2: reconciliar la demanda con Mercado y capacidad: 48 000 unid. (Supuestos!G17:G19) = 100 % de la capacidad y 1,85 × SOM (26 000); años 2–3 superan la capacidad (49 344; 50 726). Vincular G17:G19 a Mercado (fórmula, no número escrito), explicar la mezcla 50/20/30 % y el crecimiento 2,8 % (Supuestos!B11), o ampliar la capacidad (turnos, equipo) con su inversión. Recalculado con demanda = SOM y costos del Excel: VAN ≈ −S/ 23 793.", "Unificar precios con el informe y el formulario: S/ 1,00 sachet, S/ 5,50 kit de 6 y S/ 10,50 kit de 12, o justificar S/ 1,80. Recalculado con Python con S/ 1,00 y costo fijo completo, PE ≈ 134 808 unid./año, 2,8 veces la capacidad. Modelar los kits (Supuestos!B20:B21) con su envase secundario y canal.", "Cuadrar el financiamiento: aporte + préstamo = S/ 10 000 frente a inversión de S/ 29 819,78 (Resumen!D40 = REVISAR; brecha S/ 19 819,78, ≈ S/ 33 060 con producción en el capital de trabajo). Definir cómo se cubre la diferencia (aporte de socios, capital semilla, mayor préstamo) y reflejarlo en Prestamo y Flujos.", "Agregar la hoja de flujo de caja mensual del año 1 (12 meses con ingresos, egresos, saldo mensual y acumulado), señalando el mes de saldo mínimo (capital requerido) y el mes de equilibrio (hoy no consta en PE ni en otra hoja).", "Sensibilidad con tres escenarios (pesimista −20 % ventas / base / optimista +20 %; precio y costos) y conclusión de viabilidad con números y decisiones. Hoy Resumen!D43 marca 15 de 18 verificaciones, sin análisis asociado.", "Sustentar la COK 17 % (Supuestos!B9: «Justifique su valor»), la TEA 24,65 % (entidad, producto, fuente) y la tasa de impuesto 29,5 % (régimen).", "Gráfico PE: corregir rótulos de ejes (X = Unidades, Y = Soles; hoy invertidos en el XML), marcar el punto de equilibrio y mostrar el mes. Gráfico de Flujos: nombrar la serie y rotular Año/Soles.", "Mercado: restituir fórmulas en B14:B16 (hoy números pegados) y números (no texto) en B7:B8; reponer el título de A1 (hoy «ll») y borrar S8; citar la fuente de la población (INEI), 96 compras/año, 2,5 %, 66,7 %, 68,4 % y 15 %.", "Completar la Inversión: agregar desarrollo de la web/pedidos, análisis de laboratorio/estudio de estabilidad, stock inicial de insumos y sachets, y trámites sanitarios (o declararlos S/ 0 con fuente); añadir proveedor, enlace o cotización (mín. 2) por ítem y vida útil de intangibles (Inversion!G17:G18).", "Agregar proveedor/fuente y cotización a cada rubro de Costos_Fijos y Costos_Variables, y los rubros que faltan según el informe: comisión de pago digital, envase de kits 6 y 12, rotulado, delivery, mermas. Anexar hoja «Cotizaciones».", "Costo variable inconsistente con el informe: Costos_Variables = S/ 0,298–0,426 por sachet frente a S/ 0,70 de ejemplo del informe (sin receta). Unificar o explicar. Recalculado con Python con CVU 0,70 y S/ 1,80: margen 1,10 y PE ≈ 73 865 unid./año con costo fijo completo (81 251,35 ÷ 1,10); cifra de contraste, no de su modelo.", "Modelar los productos que realmente se venden (kits de 6 y 12 en Supuestos!B20:B21, con empaque secundario) para que mezcla, PE e ingresos reflejen presentación y canal.", "Costos indirectos: ya hay depreciación (Inversion!H22) y personal de producción, pero faltan servicios de planta, mantenimiento de equipos y mermas; no consta comisión o convenio con cafeterías de retiro.", "Hoja de egresos consolidada y costo total unitario (CFU + CVU) como en el modelo PLAN_FINANCIERO_CERTUS_URNOVA; no consta en el Exce         <thead><tr><th>Dimensión</th><th class="num">Puntos</th></tr></thead>

      </table></div>
      ${s.puntuacion.nota ? `<p class="summary">${esc(s.puntuacion.nota)}</p>` : ''}

    <ul class="obs">${s.observaciones.map((o, oi) => {

    ${s.consejos?.length ? `<div><h3 style="margin-bottom:8px">Consejos para que los resultados no salgan vacíos ni previsibles</h3>

  </section>`;
};
D.secciones.forEach((s, si) => { if (!isAA2(s)) renderSec(s, si); });
html += '</div>';

if (hasAA2) {
  html += '<div id="tab-aa2" class="tabpane" hidden>';
  html += `<section class="block aa2" id="aa2">
    <div class="head"><div class="eyebrow">Evidencia 2 · avance en curso</div><h2>Evidencia 2 (AA2): retroalimentación de avance</h2></div>
    <p class="summary">Esta parte corresponde a la Evidencia 2 (capítulos 4, 5 y 6 y elevator pitch). Es retroalimentación formativa para que puedan mejorar mientras avanzan. ${D.fecha_aa2 ? `Última actualización: ${esc(D.fecha_aa2)}. ` : ''}Se irá actualizando en este mismo enlace.</p>
    ${D.notasAA2 ? (() => {
      const N = D.notasAA2, NIV3 = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
      const filas = [['mvp', 'Planteamiento del MVP (cap. 4)'], ['herramientas', 'Herramientas para desarrollar el MVP (cap. 4)'], ['validacion', 'Validación del modelo de negocio (cap. 5)'], ['presupuesto', 'Análisis presupuestal (cap. 6)'], ['compromiso', 'Compromiso (individual)']];
      const tot = Number(N.total);
      return `<div class="scorebox" id="nota-aa2">
        <div class="eyebrow">Calificación preliminar de la Evidencia 2 · informe del ${esc(N.fecha)}</div>
        <div class="grade"><span class="big">${tot}</span><span class="of">/ 20</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio de la rúbrica AA2</th><th>Nivel</th><th class="num">Puntos</th><th>Por qué</th></tr></thead>
          <tbody>${filas.map(([k, t]) => { const p = Number(N[k]); return `<tr><td>${t}</td><td><span class="lvl l${p}">${NIV3[p] ?? '—'}</span></td><td class="num">${p} / 4</td><td>${esc((N.justificacion || {})[k] || '')}</td></tr>`; }).join('')}</tbody>
        </table></div>
        ${N.cambios_vs_6nov ? `<p class="summary"><b>Cambios frente al 06/11:</b> ${esc(N.cambios_vs_6nov)}</p>` : ''}
        ${N.camino_al_20?.length ? `<h4 style="margin:12px 0 6px">Camino para subir la nota</h4><ol class="priorities">${N.camino_al_20.map(c => `<li><span>${esc(c)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Calificación preliminar con la rúbrica oficial de la AA2 y criterio exigente de revisión de negocios. El criterio «Compromiso» es individual y lo define el docente (se muestra 3 por defecto). El Excel de punto de equilibrio se evalúa aparte y puede modificar el criterio de análisis presupuestal. La nota final la decide el docente.</p>
      </div>`;
    })() : ''}
    ${D.calificacionAA2 && !D.notasAA2 ? (() => {
      const p = Number(D.calificacionAA2.validacion);
      const NIV2 = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
      return `<div class="scorebox" id="nota-aa2">
        <div class="eyebrow">Calificación preliminar parcial · solo del formulario de validación</div>
        <div class="grade"><span class="big">${p}</span><span class="of">/ 4</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio de la rúbrica AA2</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
          <tbody>
            <tr><td>Validación del modelo de negocio (cap. 5)</td><td><span class="lvl l${p}">${NIV2[p] ?? '—'}</span></td><td class="num">${p} / 4</td></tr>
            <tr><td>Planteamiento del MVP · Herramientas · Análisis presupuestal · Compromiso</td><td>Pendiente</td><td class="num">—</td></tr>
          </tbody>
        </table></div>
        <p class="summary">Esta nota evalúa solo el instrumento (el formulario), porque aún no hay resultados reales. Para subir de nivel: con muestra real y análisis de resultados (n y %) se llega a 3; con mejoras al MVP derivadas de esos datos, a 4. La calificación final de la AA2 la define el docente e incluye los demás criterios y la exposición.</p>
      </div>`;
    })() : ''}
    ${D.prototipoHtml ? `<div id="prototipo-aa2">
      <h3 style="margin:18px 0 8px">Prototipo navegable de la plataforma</h3>
      <p class="summary">Prototipo referencial elaborado a partir del MVP y de las imágenes de referencia de su informe, para visualizar cómo podría verse y usarse su plataforma. Los datos son ficticios; no es el producto final. Pruébenlo aquí o <a href="${esc(D.prototipoHtml)}" target="_blank" rel="noopener noreferrer">ábranlo en pantalla completa</a>.</p>
      <iframe src="${esc(D.prototipoHtml)}" title="Prototipo de la plataforma" loading="lazy" style="width:100%;height:680px;border:1px solid var(--rule);border-radius:10px;background:#fff"></iframe>
    </div>` : ''}
    ${D.costosAA2 ? (() => {
      const K = D.costosAA2, S = n => 'S/ ' + Number(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const f3 = arr => arr.map(v => `<td class="num">${S(v)}</td>`).join('');
      const sup = v => Number(v).toLocaleString('es-PE', { maximumFractionDigits: 2 });
      return `<div class="costos" id="costos-aa2">
        <h3 style="margin:18px 0 8px">Costos de nube y servicios digitales (estimación)</h3>
        <p class="summary">Estimación mensual con proveedores reales (Google Cloud / Firebase, OpenAI, WhatsApp) para tres escenarios de uso. Los volúmenes son supuestos elaborados a partir de su MVP: reemplácenlos con los datos de su prototipo. Tipo de cambio: S/ ${esc(K.tipo_cambio)} por USD. Los precios son cifras de referencia que deben confirmarse con la calculadora oficial de cada proveedor.</p>
        ${K.necesidades ? `<h4 style="margin:14px 0 6px">Qué necesita su proyecto, con proveedor y precio</h4>
        <p class="summary">${esc(K.necesidades.resumen)} Estado del precio: <b>Verificado</b> (fuente oficial, 11/11/2026), <b>Referencial</b> (confirmar en la lista oficial del proveedor) y <b>Cotizar</b> (pidan 2 o más cotizaciones y anéxenlas). Úsenla para armar su Excel.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Rubro</th><th>Qué necesitan (según su informe)</th><th>Proveedor · producto</th><th>Precio de referencia</th><th>Estado</th></tr></thead>
          <tbody>${K.necesidades.items.map(i => `<tr><td><b>${esc(i.rubro)}</b><br><span class="where">${esc(i.origen)}</span></td><td>${esc(i.necesidad)}</td><td>${esc(i.proveedor)}<br><span class="where">${esc(i.producto)}</span></td><td>${esc(i.precio)}${i.nota ? `<br><span class="where">${esc(i.nota)}</span>` : ''}</td><td><span class="lvl ${i.estado === 'Verificado' ? 'l4' : i.estado === 'Referencial' ? 'l2' : 'l1'}">${esc(i.estado)}</span></td></tr>`).join('')}</tbody>
        </table></div>` : ''}
        ${D.calculadoraXlsx ? `<p class="summary" style="margin-top:12px"><b>Calculadora de su proyecto:</b> <a href="${esc(D.calculadoraXlsx)}" download>descargar Excel</a>. Cambien la cantidad de usuarios en la columna «Calculadora (edite)» y verán el costo mensual de los servicios, el primer pago para construir la plataforma, el mantenimiento (bolsa de horas o un encargado fijo) y el costo del primer año.</p>` : ''}
        <div class="table-wrap"><table>
          <thead><tr><th>Supuesto de uso</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>

        </table></div>
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Servicio (costo mensual)</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.costos.map(r => `<tr><td>${esc(r.concepto)}</td>${f3(r.valores)}</tr>`).join('')}
            <tr><td><b>Total mensual</b></td>${K.total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td>Primer pago (mes 1, con dominio anual)</td>${f3(K.primer_pago_pen)}</tr>
            <tr><td>Mantenimiento del desarrollador (horas al mes x S/ ${esc(K.tarifa_mantenimiento)} por hora)</td>${f3(K.mantenimiento_pen)}</tr>
            <tr><td><b>Total mensual con mantenimiento</b></td>${K.total_con_mant_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Desarrollo inicial de la plataforma (pago único al desarrollador, a S/ ${esc(K.tarifa_desarrollo)} por hora)</b></td><td class="num" colspan="${K.escenarios.length}"><b>${S(K.desarrollo_pen)}</b></td></tr>
            ${K.primer_pago_total_pen ? `<tr><td><b>Primer pago total: plataforma + primer mes de servicios</b></td>${K.primer_pago_total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Costo total del primer año (plataforma + 12 meses con mantenimiento)</b></td>${K.costo_anio1_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>` : ''}
            ${K.chat_pen ? `<tr><td>De ese total: chat interno y buzón de mensajes</td>${f3(K.chat_pen)}</tr>` : ''}
            <tr><td>${esc(K.ingreso_etiqueta)}</td>${f3(K.ingreso_pen)}</tr>
            <tr><td>Costo de nube / ingreso estimado</td>${K.pct_ingreso.map(v => `<td class="num">${(v * 100).toLocaleString('es-PE', { maximumFractionDigits: 1 })} %</td>`).join('')}</tr>
          </tbody>
        </table></div>
        <ul class="strength">${K.notas.map(n => `<li>${esc(n)}</li>`).join('')}<li>El desarrollo inicial y las horas de mantenimiento son referenciales: reemplácenlos con la cotización real de su desarrollador y verifiquen que el ingreso cubra el mantenimiento mensual.</li></ul>
      </div>`;
    })() : ''}
    ${D.excelPE ? (() => {
      const X = D.excelPE, NIV = pct => pct >= 85 ? 'Sobresaliente' : pct >= 70 ? 'Logrado' : pct >= 50 ? 'En proceso' : 'Inicio';
      const entrega = `<div class="scorebox" id="excel-pe">
        <div class="eyebrow">Evidencia 2 · Excel de costos y punto de equilibrio</div>
        <h3 style="margin:6px 0 8px">Cómo entregar el Excel</h3>
        <ol class="priorities">
          <li><span>Hagan el archivo en <b>.xlsx</b> (si lo trabajan en Google Sheets: Archivo → Descargar → Microsoft Excel).</span></li>
          <li><span>Súbanlo a <b>Google Drive</b> y compártanlo con «Cualquier persona con el enlace → Lector». Nombre: <b>AA2_Cap6_Excel_Punto de equilibrio_Grupo X</b>.</span></li>
          <li><span>Envíen <b>el enlace de Drive</b> al docente. Si no abre, se les pedirá el archivo.</span></li>
          <li><span>Anexen las cotizaciones (capturas o PDF) en una hoja «Cotizaciones» o en la misma carpeta de Drive.</span></li>
          <li><span>Si lo corrigen, suban la nueva versión con el mismo nombre y el mismo enlace.</span></li>
        </ol>`;
      if (X.estado !== 'calificado' || X.logro == null) {
        const lista = [
          'Las 7 piezas del cap. 6, parecidas al modelo del docente: estructura de inversión, costos y gastos, presupuesto de ingresos, presupuesto de egresos, flujo de caja mensual del año 1, flujo económico a 3 años e indicadores (VAN, TIR, B/C, recuperación).',
          'Precio y volumen iguales a los de su informe y su validación (cap. 5); si usan otro precio, explicar por qué.',
          'Todos los costos del MVP, incluidos indirectos, depreciación, mantenimiento y comisiones de pago, clasificados en fijos y variables, con proveedor y fuente.',
          'Hoja «Cotizaciones» con al menos 2 proveedores por rubro (captura o PDF, con fecha y vigencia).',
          'Punto de equilibrio en unidades y en soles, con fórmula (costos fijos ÷ margen de contribución), margen de seguridad y el mes en que se alcanza.',
          'Gráfico del punto de equilibrio donde el eje de unidades cubra el equilibrio y se vea el cruce de ingresos y costos totales, con ejes y series rotulados.',
          'Flujo mensual del año 1 con saldo acumulado y el mes de saldo más bajo (capital necesario); sin contar dos veces el capital de trabajo.',
          'Horizonte de 3 años (no 5), con la tasa de descuento (COK) sustentada.',
          'Escenarios pesimista, base y optimista (ventas −20 % o +20 %, costos +10 %) con una conclusión de viabilidad con números.',
          'Fórmulas vivas (no números pegados), sin errores (#REF!, #DIV/0!, #VALUE!), sin rótulos ni hojas de otros proyectos, sin hojas vacías o duplicadas.',
          'Formato .xlsx, nombre «AA2_Cap6_Excel_Punto de equilibrio_Grupo X» y enlace de Drive con «Cualquier persona con el enlace → Lector».'
        ];
        return entrega + `<p class="summary">Estado: <b>pendiente de entrega</b>. Cuando lo reciban, aquí aparecerá su nota sobre 20 (y su porcentaje de logro) con la retroalimentación por criterio.</p>
        <h4 style="margin:12px 0 6px">Qué debe contener su Excel (revisión previa)</h4><ol class="priorities">${lista.map(m => `<li><span>${esc(m)}</span></li>`).join('')}</ol></div>`;
      }
      const notaX = (Number(X.logro) * 0.2).toFixed(1).replace('.0', '');
      return entrega + `<div class="grade"><span class="big">${notaX} / 20</span><span class="of">nota del Excel · ${Number(X.logro)} % de logro · ${NIV(Number(X.logro))}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio</th><th class="num">Puntaje</th><th>Retroalimentación</th></tr></thead>
          <tbody>${X.criterios.map(c => `<tr><td>${esc(c.nombre)}</td><td class="num">${Number(c.puntaje)} / ${Number(c.peso)}</td><td>${esc(c.comentario || '')}</td></tr>`).join('')}</tbody>
        </table></div>
        ${X.paridad?.length ? `<h4 style="margin:12px 0 6px">Comparación con el modelo del docente</h4><div class="table-wrap"><table>
          <thead><tr><th>Pieza del modelo</th><th>Hoja del grupo</th><th>Estado</th><th>Nota</th></tr></thead>
          <tbody>${X.paridad.map(p => `<tr><td>${esc(p.pieza)}</td><td>${esc(p.hoja || '—')}</td><td>${esc(p.estado || '')}</td><td>${esc(p.nota || '')}</td></tr>`).join('')}</tbody>
        </table></div>` : ''}
        ${X.fortalezas?.length ? `<h4 style="margin:12px 0 6px">Lo que está bien</h4><ul class="strength">${X.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        ${X.mejoras?.length ? `<h4 style="margin:12px 0 6px">Para mejorar</h4><ol class="priorities">${X.mejoras.map(m => `<li><span>${esc(m)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Indicador preliminar elaborado con la rúbrica del Excel de punto de equilibrio. La calificación final de la AA2 la define el docente.${X.revisado ? ' Revisión del ' + esc(X.revisado) + '.' : ''}</p></div>`;
    })() : ''}
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>

    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.notasAA2 ? [['nota-aa2', 'Calificación AA2 (/20)', '']] : D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.prototipoHtml ? [['prototipo-aa2', 'Prototipo', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.excelPE ? [['excel-pe', 'Excel de punto de equilibrio', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
