<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.scorebox { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

<script type="application/json" id="data">{"id": "grupo-quispe-quintanilla-sosa", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "Frútzuma: concentrados de frutas en sachets individuales", "grupo": "Grupo 7", "seccion": "M394", "fecha": "04/11/2026 (3.ª versión, criterio ajustado) · formulario AA2 revisado el 06/11/2026", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Anyeli Quispe Mamani", "Shiomara Quintanilla Barrios", "Harold Sosa Vega"], "dictamen": "menor", "resumen": "La tercera versión resuelve la mayoría de las contradicciones de la anterior: la vida útil figura como objetivo de 4 meses sujeto a validación en todo el documento, la versión con azúcar añadida y el acesulfame se retiraron, los tres sabores se mantienen en la Tabla 3 y el 2.1, la Tabla 7 recuperó su columna de validación, la ficha (Tabla 4) incluye sostenibilidad, redes sociales y funcionalidades, la Tabla 10 calcula el precio por litro preparado y el 3.3 cierra con la ventaja competitiva y la estrategia de diferenciación, los indicadores tienen ejemplo de cálculo, el problema social ahora tiene cifras de MINAM (2025) y FAO (2026), y la carátula ya indica carrera, sección y grupo. Las hipótesis sobre el problema del cliente son aceptables en esta AA1, que no exige entrevistas ni encuestas reales. Lo que persiste: el 1.4 define una brecha por investigar y no formula con claridad el problema del cliente (quién, cuándo, qué pierde), el mapa de empatía conserva un marcador de posición de plantilla, falta una cifra del mercado de bebidas o del consumo fuera del hogar, la cifra de Arequipa (9,1 %) no coincide con la referencia nacional del INEI (1,3 %), y el diferencial frente a Naturale, FIFU y Zuko continúa siendo una hipótesis. El precio es referencial en esta AA1 y no se observa. Quedan además detalles formales: instrucciones de Word y frases dirigidas al evaluador dentro del texto, el índice sin el apartado 3.4.1, referencias fuera de orden alfabético y la fecha de la carátula sin actualizar.", "fortalezas": ["Resolvieron las contradicciones señaladas: vida útil «Objetivo comercial: 4 meses... condicionado a estudio de vida útil» (Tabla 4), sin versión con azúcar añadida ni acesulfame («no forman parte de la propuesta actual») y tres sabores coherentes en la Tabla 3 y el 2.1.", "El capítulo 1 ahora dimensiona el problema social con cifras oficiales: 8 994 762 toneladas de residuos sólidos municipales en 2024 (MINAM, 2025) y más de 12 millones de toneladas de alimentos perdidos o desperdiciados (FAO, 2026), vinculadas a las metas 3.4, 12.3 y 12.5 (Tabla 2) y a dos megatendencias de CEPLAN (2023). Además, cada dato se acompaña de lo que no prueba, y reconocen la tensión del sachet con el ODS 12 (1.2, último párrafo).", "La Tabla 10 incorpora la columna «Precio por litro preparado» (Naturale S/ 3,27/L; Zuko S/ 0,60/L si rinde 2 L) y el párrafo final del 3.3 reconoce con honestidad que «a S/ 2,00/L... FRÚTZUMA no aspira a ganar por precio» y propone una prueba de sabor a ciegas frente a Zuko en la AA2.", "El capítulo 3 se completó: 3.3 cierra con ventaja competitiva y estrategia de diferenciación, la Tabla 12 añade un ejemplo de cálculo por indicador (marcado como no real), el FODA tiene cuatro estrategias y el 3.4.1 separa la planificación del equipo.", "Recuperaron contenido perdido en la v2: la columna «Validación» de la Tabla 7, las filas de funcionalidad, sostenibilidad y redes sociales de la Tabla 4, el proceso en la Tabla 6 y las redes concretas del canal (Instagram, TikTok, Facebook, WhatsApp Business).", "AA2: Hay filtro de segmento: «Lugar de residencia» (Arequipa / Otro departamento del Perú) y «¿En qué rango de edad te encuentras?» (la opción «Más de 46 años» termina la encuesta), más la pregunta «Ocupación» (Estudias / Trabajas / Ambos), coherentes con el segmento de 18 a 45 años del informe.", "AA2: Se muestran la descripción y dos imágenes del producto antes de preguntar «¿Qué tan atractiva te parece...?» y «¿Qué tan probable sería que probaras...?», lo que aporta validez a esas respuestas.", "AA2: Los sabores se califican en una matriz de 1 a 5 (Maracuyá con mango, Fresa con Sandía, Piña con Jamaica) y la practicidad se plantea con la equivalencia «Un sachet de 60 ml prepara unos 500 ml», que es una formulación más neutral.", "AA2: Ya se incluyen preguntas de presentación (Individual, Kit de 6, Kit de 12), precio y canal, y una pregunta abierta final («¿Qué podemos mejorar en FRÚTZUMA?»), con un consentimiento anónimo y académico en la descripción.", "AA2: La tabla 4.1 vincula cada hipótesis (H1 a H4) con un objetivo y un método de medición, y la lista MoSCoW refiere cada funcionalidad a su hipótesis (p. ej. «Vinculado con H2 y H4»).", "AA2: Honestidad metodológica: el anexo rotula como «NO realizadas» las tres entrevistas simuladas y la Tabla 14 enumera los pendientes (entrevistas, cotizaciones, estabilidad, rotulado, marca).", "AA2: La ficha técnica (Tabla 4) y el análisis de competidores (Tabla 10) son rigurosos: el precio por litro es correcto (S/ 2,00/L sachet; S/ 1,83 kit 6; S/ 1,75 kit 12; Naturale S/ 3,27/L) y el informe advierte los límites de sus datos.", "AA2: El canal (retiro en cafeterías, compra agrupada) es coherente con un costo digital casi nulo según la lista del docente: WhatsApp Business gratis y registro DIGESA sin costo."], "prioridades": ["Precisar el problema del cliente (1.1 y 1.4) como hipótesis formulada con claridad (quién, en qué situación, con qué frecuencia y qué pierde) y apoyarla con una o dos cifras del mercado de bebidas o del consumo fuera del hogar en Arequipa.", "Rotular las tres entrevistas del anexo como hipótesis de trabajo y, en la AA2 (cap. 5), validarlas con personas reales (fecha, lugar, código anónimo y consentimiento).", "Sustentar el diferencial: en la AA2 validar con prueba ciega frente a Zuko y Naturale y valorar un atributo más difícil de imitar (mezclas con frutas regionales, venta institucional).", "Limpiar el documento: quitar la instrucción de Word del índice y el marcador «[Espacio para incorporar...]» de la Tabla 8, retirar las frases dirigidas al evaluador, ordenar y completar las referencias (Tottus a/b, orden alfabético, verificar INEI) y actualizar índice y fecha.", "AA2: Definir por escrito, antes de aplicar, las hipótesis, el tamaño y método de muestra y el criterio de aceptación de cada una (p. ej., «al menos 60 % compra a S/ 1,00»), y analizar después los resultados contra esos criterios.", "AA2: Probar directamente el precio de S/ 1,00 por sachet y los precios por kit (S/ 5,50 y S/ 10,50) con la pregunta «¿Lo comprarías a este precio?» y un precio máximo y mínimo aceptable, en rangos continuos que incluyan menos de S/ 1,00.", "AA2: Agregar preguntas sobre acceso a agua potable y recipiente fuera de casa, canal de retiro o pedido agrupado y qué compra hoy el cliente (marca y gasto), para validar el modelo y no solo el interés.", "AA2: Reformular las preguntas que inducen la respuesta, completar y ordenar las opciones, y marcar como obligatorias las preguntas clave.", "AA2: Aplicar el instrumento a muestra real del segmento, presentar tablas de resultados con n, y proponer mejoras concretas al MVP a partir de los datos (cap. 5).", "AA2: Desarrollar el cap. 6 completo (7 piezas, 3 años, VAN/TIR/PRI), empezando por la ficha de costeo por sachet con receta y 2 cotizaciones: sustentar o corregir los S/ 0,70 y fijar el margen por canal (con ese costo: sachet 30 %, kit 6 23,6 %, kit 12 20 %).", "AA2: Recolectar datos reales (encuesta rediseñada a n ≥ 50, 8–10 entrevistas y cata de los 3 sabores) y redactar el cap. 5 con muestra, resultados (n y %), conclusiones con métricas y mejoras al MVP.", "AA2: Corregir el formulario antes de seguir aplicándolo: probar S/ 1,00 / 5,50 / 10,50, incluir rangos menores a S/ 1,00, retiro en cafetería, agua potable y competidores; eliminar el kit de 24.", "AA2: Agregar al cap. 4 una sección de herramientas (formulario, WhatsApp Business, maquila o selladora, laboratorio) con justificación, los pasos seguidos y criterios de éxito numéricos por hipótesis (p. ej. ≥ 60 % acepta S/ 1,00).", "AA2: Calcular el punto de equilibrio con costos fijos y variables listados (CF ÷ (P − CVu)), incluyendo la comisión de las cafeterías, y compararlo con la demanda validada.", "AA2: Presentar evidencia técnica de la vida útil (estabilidad a 0, 30, 60 y 120 días) o declarar una vida útil comprobada menor, y presupuestar laboratorio y rotulado en la inversión."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, con análisis crítico de lo que aportan al proyecto en torno a megatendencias y ODS.", "falta": "Cumple: fuentes oficiales de 2023 a 2026 (CEPLAN, INEI, MINAM, FAO, OMS, OSIPTEL, ONU), analizadas con criterio y vinculadas a las metas 3.4, 12.3 y 12.5. Para sostener el nivel, verificar que la cifra de Arequipa (9,1 %, INEI 2026) figure en la nota citada, porque la referencia habla de un incremento nacional de 1,3 %, y que la URL del informe de enfermedades no transmisibles corresponda a 2025 y no a 2024; añadir un dato del mercado de bebidas."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencias cualitativas y cuantitativas, con vínculo con megatendencias, ODS y necesidades del cliente.", "falta": "Cumple: la parte cuantitativa y el vínculo con ODS y megatendencias están bien, y las hipótesis sobre el cliente son aceptables en la AA1. Para llegar al nivel sobresaliente falta formular el problema del cliente con claridad en el 1.4 (quién, cuándo, qué pierde) y añadir una cifra del mercado de bebidas o del consumo fuera del hogar."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Todos los elementos están y ahora son coherentes entre sí. El diferencial (dosis personal, tres mezclas y retiro agrupado) sigue siendo una hipótesis que el propio informe no presenta como exclusiva, en una categoría cercana a las de baja innovación del Anexo 2; falta demostrarlo con datos."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia entre los nueve bloques y la propuesta de valor.", "falta": "BMC de nueve bloques, coherencia por pares (3.2.1), competidores con precio por litro, ventaja competitiva e indicadores con ejemplo. Falta retirar el marcador de plantilla del cuadrante «Dice y hace» del mapa de empatía y completarlo con frases hipotéticas del segmento."}], "viabilidad": {"resumen": "La v3 es más cautelosa y quita las decisiones de formulación más riesgosas (azúcar añadida y acesulfame). El choque más fuerte sigue siendo el registro sanitario; los costos y márgenes se trabajarán en el cap. 6 (AA2), por lo que el precio es referencial.", "riesgos": [{"tema": "Regulación", "titulo": "Registro sanitario, HACCP y rotulado", "choque": "Un concentrado envasado con vida útil de 4 meses necesita registro sanitario, análisis de laboratorio acreditado, plan HACCP y rotulado conforme al Manual de Advertencias Publicitarias. Incluso la versión «sin azúcar añadida» contiene azúcares libres según la OMS (2026), como el propio informe indica.", "ideas": ["Averiguar en DIGESA el costo y plazo del registro y sumarlos al costeo de la AA2.", "Consultar a un tecnólogo de alimentos para simular el rotulado de cada formulación.", "Buscar una maquila de Arequipa con habilitación sanitaria y HACCP."]}, {"tema": "Costos", "titulo": "Costos y margen por definir en el cap. 6", "choque": "El precio de S/ 1,00 por sachet es referencial; la tabla de costos, gastos y egresos corresponde al cap. 6 (AA2). Se anticipa que el envase de barrera, el lote mínimo y el laboratorio influirán en el margen.", "ideas": ["Obtener cotizaciones de maquila y de envase para el cap. 6.", "Calcular el margen por canal (retiro propio frente a cafetería)."]}, {"tema": "Competencia", "titulo": "Competidores con sachets y atributo copiable", "choque": "Naturale y FIFU ya venden sachets y el atributo diferencial es copiable.", "ideas": ["Hacer la prueba ciega de sabor en la AA2.", "Probar un diferencial más difícil de copiar, como frutas regionales."]}, {"tema": "Adopción", "titulo": "Se necesita agua segura y un recipiente", "choque": "El informe lo reconoce (Tabla 1, caso 1), pero aún no define si el cliente lleva botella o agua. Sin esa respuesta se pierde la practicidad frente a una bebida lista.", "ideas": ["Plantear la pregunta sobre agua y recipiente como hipótesis y contrastarla en la AA2.", "Empezar el piloto en institutos u oficinas con dispensadores."]}, {"tema": "Operación", "titulo": "Vida útil objetivo y puntos de retiro", "choque": "La vida útil de 4 meses es un objetivo sin estudio de estabilidad, y los puntos de retiro dependen de cafeterías que todavía no han sido consultadas.", "ideas": ["Consultar a un laboratorio universitario por un estudio acelerado.", "Conversar con dos o tres cafeterías sobre comisión y almacenamiento."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "completo", "nota": "Ya incluye carrera, sección (M394) y grupo 7; la fecha sigue siendo 30 de octubre."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Contiene una instrucción de Word dirigida al lector («regenera la tabla de contenido desde Referencias»), agrupa «2.3–2.4» aunque son apartados separados y omite el 3.4.1."}, {"codigo": "—", "apartado": "Introducción", "estado": "completo", "nota": "Presenta propósito, alcance y estructura, y advierte que no se atribuyen testimonios."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "completo", "nota": "Tabla 1 con causas y consecuencias; se presenta como hipótesis, aceptable en la AA1."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "Cifras de MINAM (2025), FAO (2026) e INEI (2026), metas 3.4, 12.3 y 12.5 (Tabla 2) y megatendencias de CEPLAN."}, {"codigo": "1.3", "apartado": "Megatendencia, oportunidad comercial y pregunta", "estado": "completo", "nota": "Incluye precios de sustitutos y la pregunta central."}, {"codigo": "1.4", "apartado": "Definición del problema", "estado": "incompleto", "nota": "Define una brecha por investigar y no formula con claridad el problema del cliente (quién, cuándo, qué pierde)."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Tres sabores y diferenciación coherentes; el diferencial no se declara exclusivo."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Tabla 4 con sostenibilidad, redes, funcionalidades y pruebas; precio (2.2.1) y proceso (2.2.2) completos."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Cinco beneficios en un solo párrafo, vinculados a la Tabla 1."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "La Tabla 7 recuperó la columna de validación."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Segmentación 2.5.1 a 2.5.6."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Seis casos breves."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "incompleto", "nota": "Tabla 8 con hipótesis; «Dice y hace» mantiene un marcador de posición de plantilla."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Tabla 9, Figura 1 y coherencia por pares en 3.2.1."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Tabla 10 con precio por litro, ventaja competitiva y estrategia de diferenciación."}, {"codigo": "3.4", "apartado": "FODA", "estado": "completo", "nota": "Con cuatro estrategias; la planificación del equipo pasó al 3.4.1."}, {"codigo": "3.5", "apartado": "Indicadores de gestión", "estado": "completo", "nota": "Cinco indicadores con fórmula, meta, frecuencia y ejemplo de cálculo."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Todas las fuentes se citan, pero las entradas no están en orden alfabético y dos de Tottus Perú (s. f.) necesitan a/b."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Mejora el problema social, que ahora tiene datos oficiales, y se mantiene la separación entre problema del cliente y problema social. Las hipótesis sobre el cliente son aceptables en esta AA1; falta formular con claridad el problema en el 1.4.", "observaciones": [{"severidad": "sugerencia", "titulo": "Rotular las entrevistas del anexo como hipótesis y validarlas en la AA2", "ubicacion": "Introducción; 1.1, Tabla 1; Anexo", "cita": "Incluye tres entrevistas simuladas para orientar el trabajo de campo", "problema": "El informe declara con claridad que las tres entrevistas del anexo son simuladas y que no se usan en los capítulos 1 a 3; esto es aceptable en la AA1 y no constituye falta de integridad. Conviene presentarlas como hipótesis de trabajo.", "mejora": "Rotular el anexo como hipótesis de trabajo y, en el cap. 5 (AA2), validarlas con personas reales de Arequipa, con fecha, lugar, código anónimo y consentimiento."}, {"severidad": "importante", "titulo": "El 1.4 describe lo que se estudiará y no formula el problema del cliente", "ubicacion": "1.1 (primer párrafo) y 1.4", "cita": "aún no se ha demostrado si estas alternativas satisfacen a quienes buscan preparar una bebida de sabor frutal", "problema": "Las cautelas son valiosas, pero el 1.4 no define el problema del cliente de forma concreta (qué le ocurre, con qué frecuencia, qué pierde): describe lo que el grupo estudiará. Aunque se plantee como hipótesis, la definición debe ser una afirmación clara.", "mejora": "Redactar el 1.4 como una hipótesis explícita, por ejemplo: «Los estudiantes y trabajadores de 18 a 45 años de Arequipa no preparan bebidas fuera de casa porque...», y dejar la incertidumbre para el plan de validación de la AA2."}, {"severidad": "importante", "titulo": "Falta una cifra del mercado o del consumo fuera del hogar en Arequipa", "ubicacion": "1.1 y 1.3", "cita": "no representa una medida de demanda del producto", "problema": "Las cifras del INEI sobre consumo de fruta, exceso de peso y población ocupada se aclaran como contexto, no como demanda. Siguen sin aparecer el tamaño o crecimiento del mercado de bebidas o refrescos ni el gasto fuera del hogar. El dato del estudio de Guzman-Vilca et al. (2022) proviene de 2017-2018.", "mejora": "Agregar una o dos cifras recientes del mercado de bebidas (INEI-ENAHO, Euromonitor o Kantar, citadas en APA) y la población de 18 a 45 años que estudia o trabaja en Arequipa."}, {"severidad": "sugerencia", "titulo": "Verificar la cifra de Arequipa del INEI y la referencia", "ubicacion": "1.1, tercer párrafo; Referencias", "cita": "la población ocupada de la ciudad de Arequipa aumentó 9,1 %", "problema": "La referencia citada se titula «Población ocupada a nivel nacional se incrementó 1,3 %...» y no está claro que la nota contenga el dato de la ciudad de Arequipa. La otra referencia del INEI dice 2025 en el título y 2024 en la URL.", "mejora": "Comprobar que ambos datos figuren en el documento citado, corregir la URL si corresponde y citar la tabla o página exacta."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "Los apartados están completos y ya no se contradicen. El diferencial sigue en el plano de la hipótesis.", "observaciones": [{"severidad": "critico", "titulo": "El diferencial sigue sin demostrarse y se declara no exclusivo", "ubicacion": "2.1, tercer párrafo; 3.3, ventaja competitiva", "cita": "Esta combinación no se presenta como exclusiva hasta contrastarla", "problema": "El informe reconoce que Naturale y FIFU ya comercializan sachets y que la combinación de tres sabores mixtos, dosis para 500 ml y retiro agrupado «todavía no demuestra exclusividad». Los concentrados y refrescos están cerca de la categoría de baja innovación del Anexo 2 de los lineamientos, por lo que se necesita una diferenciación comprobada, no solo planteada.", "mejora": "Elegir el atributo más fuerte y respaldarlo con datos del prototipo: prueba ciega frente a Zuko y Naturale, disposición a pagar, y un atributo más difícil de imitar (frutas regionales, venta institucional). Anotar el resultado en la AA2."}, {"severidad": "sugerencia", "titulo": "Redacción dirigida al evaluador y exceso de salvedades", "ubicacion": "Introducción; 2.2 (nota de la Tabla 4); Anexo", "cita": "El docente solicita más entrevistas reales para acreditar evidencia cualitativa.", "problema": "Algunas frases le hablan al docente y no al lector (en el anexo: «El docente solicita...»). Casi todos los párrafos repiten que algo es una hipótesis o que «no se afirma», lo que resta claridad sobre qué decidió el equipo.", "mejora": "Reunir las limitaciones en un párrafo y redactar el resto con decisiones claras; quitar las referencias directas al docente."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "BMC argumentado, competidores comparables por litro, ventaja competitiva, FODA e indicadores con ejemplo. Falta que el mapa de empatía tenga voz del cliente.", "observaciones": [{"severidad": "sugerencia", "titulo": "Completar el cuadrante «Dice y hace» del mapa de empatía", "ubicacion": "3.1, Tabla 8", "cita": "[Espacio para incorporar dos o tres frases literales de los entrevistados, con códigos E01–E10 y fecha.]", "problema": "El cuadrante «Dice y hace» conserva un texto de plantilla. Con hipótesis basta en la AA1, por lo que no afecta el nivel del criterio; conviene completarlo.", "mejora": "Completar el mapa con dos o tres frases hipotéticas del segmento por cuadrante clave, rotuladas como supuestos del grupo, y quitar el marcador."}, {"severidad": "sugerencia", "titulo": "BMC: canales y cafeterías con doble rol", "ubicacion": "3.2, Tabla 9; 2.5.6", "cita": "cafeterías: puntos de retiro o compradoras mayoristas, según contrato", "problema": "Las cafeterías aparecen como canal (Tabla 9) y como cliente secundario (2.5.6). La Figura 1 repite celdas combinadas que no se distinguen en la maquetación.", "mejora": "Precisar si la cafetería es canal o cliente y su rol en los ingresos; revisar el título y el formato de la Figura 1 según APA 7."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Carátula completa y todas las fuentes citadas. Quedan instrucciones de Word en el texto, un índice incompleto y referencias sin ordenar.", "observaciones": [{"severidad": "importante", "titulo": "Índice con instrucciones de Word y apartados faltantes", "ubicacion": "Índice", "cita": "Índice de consulta de esta versión. Los apartados utilizan estilos de título de Word; si se modifica el contenido, regenera la tabla de contenido desde Referencias → Tabla de contenido.", "problema": "Es una instrucción dirigida a quien edita, no al lector. El índice agrupa «2.3–2.4» (en el cuerpo son apartados separados), omite el 3.4.1 y el 1.3 figura con otro nombre; los números de página no se pueden contrastar con el cuerpo del DOCX.", "mejora": "Generar el índice automático, eliminar la nota y comprobar los números de página en el PDF final."}, {"severidad": "importante", "titulo": "Referencias fuera de orden y con entradas ambiguas", "ubicacion": "Referencias bibliográficas", "cita": "Tottus Perú. (s. f.). Bebida instantánea en polvo Zuko naranja... / Tottus Perú. (s. f.). Zuko: bebidas instantáneas...", "problema": "Las entradas de Procefrut Perú, OSIPTEL, OMS, Osterwalder y Pigneur, y Vivanda aparecen después de Wong y Tottus, sin orden alfabético. Dos entradas de Tottus Perú tienen el mismo autor y año sin a/b. Procefrut Perú se usa para D' Kampu; conviene decirlo en el texto. Los títulos de libros, informes y revistas deben ir en cursiva.", "mejora": "Ordenar alfabéticamente, diferenciar con s. f.-a y s. f.-b, aclarar la entrada de D' Kampu y revisar las cursivas."}, {"severidad": "sugerencia", "titulo": "Fecha y detalles de maquetación", "ubicacion": "Carátula; Figura 1", "cita": "Arequipa, Perú  ·  30 de octubre de 2026", "problema": "La fecha de la carátula no se actualizó respecto a la v2. Falta un espacio tras «Sección:» y la Figura 1 repite celdas combinadas.", "mejora": "Actualizar la fecha, revisar la maquetación y hacer una lectura final de erratas."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Encuesta de validación del MVP y del modelo de negocio (cap. 5)", "resumen": "Revisión sobre la versión en línea vigente al 11/11/2026. El instrumento mejoró en segmentación y presentación del producto, pero no cubre la validación del modelo de negocio ni tiene criterios de aceptación, muestra ni resultados.", "observaciones": [{"severidad": "critico", "titulo": "No se valida el precio de referencia ni las presentaciones del informe", "ubicacion": "Sección V; informe 2.2.1 y Tabla de precios", "cita": "«¿Cuánto estarías dispuesto(a) a pagar por un sachet individual de FRÚTZUMMA?» (De S/ 1.00 a S/ 1.50 / De S/ 1.60 a S/ 2.00 / Más de S/ 2.00)", "problema": "El informe plantea S/ 1,00 por sachet, S/ 5,50 por kit de seis y S/ 10,50 por kit de doce, y el formulario no pone a prueba ninguno de esos precios. Los rangos arrancan en S/ 1,00, por lo que quien pagaría menos no tiene opción, y los tramos están desordenados (hay un vacío entre S/ 1,50 y S/ 1,60). Además, «¿Cómo preferirías comprar FRÚTZUMA?» ofrece un Kit de 24 que el informe no contempla y no indica el precio de ninguna presentación. Sin esto no se puede decidir el precio de la AA2 ni calcular ingresos del cap. 6.", "mejora": "Preguntar «¿Comprarías un sachet a S/ 1,00?» (Sí / Depende / No) y presentar cada kit con su precio. Usar una escala de sensibilidad al precio (demasiado barato / conveniente / caro / demasiado caro) y rangos continuos que incluyan menos de S/ 1,00. Eliminar el kit de 24 o justificarlo en el cap. 4."}, {"severidad": "critico", "titulo": "No hay criterios de validación, tamaño de muestra ni plan de análisis", "ubicacion": "Informe, cap. 4 (H1 a H4, «Encuesta a 50 personas del segmento objetivo»); formulario completo", "cita": "«Encuesta a 50  personas del segmento objetivo.»", "problema": "El informe menciona 50 personas, pero ni el informe ni el formulario establecen cómo se elegirá la muestra, qué porcentaje mínimo confirma cada hipótesis ni qué decisión del MVP cambiaría si no se cumple. Sin ello no hay análisis crítico posible y el criterio «Validación del modelo de negocio» no puede pasar de la etapa de herramienta. Tampoco se registra el medio por el que llegó cada respuesta, lo que impide detectar sesgo de familiares y amigos.", "mejora": "Escribir en el cap. 5 una tabla Hipótesis, Pregunta que la mide, Muestra y Criterio de aceptación (por ejemplo, «al menos 60 % califica 4 o 5 en atractivo y 40 % compraría a S/ 1,00»), definir cuotas por ocupación y edad y registrar el origen de cada respuesta."}, {"severidad": "importante", "titulo": "No se pregunta por acceso a agua potable ni recipiente, condición de uso del producto", "ubicacion": "Secciones II a V; informe 2.5 (segmento) y Caso 1", "cita": "El informe: «tienen acceso habitual a agua potable»; el formulario no incluye ninguna pregunta sobre agua", "problema": "El producto se diluye en agua potable y el informe lo declara como condición del segmento y como hipótesis por validar. Si el cliente no cuenta con agua o botella en su jornada, la propuesta de practicidad deja de funcionar. El formulario nunca lo consulta.", "mejora": "Agregar «Fuera de casa, ¿tienes acceso a agua potable y a un recipiente para prepararlo?» (Siempre / A veces / Casi nunca) y analizarla cruzada con intención de compra."}, {"severidad": "importante", "titulo": "El canal no incluye las opciones del modelo ni se compra por pedido agrupado", "ubicacion": "Sección V, pregunta de canal; informe 3.2 (BMC, canales)", "cita": "«Canal por el cual preferirías adquirir el producto.» (Whtasapp / Distribución por bodegas o tiendas / Supermercados)", "problema": "El BMC plantea pedidos por WhatsApp, puntos de retiro y pedidos agrupados, pero el formulario no ofrece punto de retiro, institutos u oficinas ni pregunta si pediría con compañeros. Sobran supermercados, que no figuran en el modelo. Además, está escrito «Whtasapp» y la pregunta no es una pregunta.", "mejora": "Reformular como «¿Cómo preferirías comprarlo?» con: WhatsApp con retiro en un punto, delivery, bodega o tienda cercana, cafetería del instituto o trabajo, otra; y preguntar «¿Pedirías junto con compañeros para un kit?»."}, {"severidad": "importante", "titulo": "No se identifica qué consume y paga hoy el cliente ni se incluyen los competidores reales", "ubicacion": "Sección II, «Cuando tienes poco tiempo, ¿qué bebida sueles elegir?»", "cita": "«Jugos preparados (pura fruta) / Gaseosas / Refresco en polvo / Agua / Frugos / Otro»", "problema": "Faltan los concentrados líquidos en sachet o botella, que son la competencia directa del informe (Naturale, FIFU) y Zuko. Tampoco se pregunta cuánto gasta ni cuándo fue la última vez que compró una bebida fuera de casa, que es el dato más confiable. Es una pregunta de una sola respuesta y no permite medir la frecuencia por tipo de bebida.", "mejora": "Agregar «Concentrado en sachet o botella» como opción, preguntar «¿Cuándo fue la última vez que compraste una bebida fuera de casa, cuál y cuánto pagaste?» y pedir la marca de refresco o concentrado."}, {"severidad": "importante", "titulo": "Preguntas que inducen la respuesta", "ubicacion": "Sección II y III", "cita": "«¿Tiene dificultades para tomar bebidas de fruta durante el día?» (Si / No / Ninguna); descripción: «fácil de preparar, ideal para personas con poco tiempo»", "problema": "La primera tiene opciones superpuestas (No y Ninguna significan lo mismo), no pregunta cuál es la dificultad y no abre la causa; el tratamiento de usted rompe con el tuteo del resto. La descripción previa a la pregunta de atractivo usa adjetivos favorables («fácil», «ideal») que condicionan la nota. Además «atractiva» y «probable que probaras» miden casi lo mismo y ambas se leen como cortesía.", "mejora": "Cambiar a «¿Qué dificultades tienes para tomar bebidas de fruta durante el día?» con opciones concretas y «Ninguna». Quitar los adjetivos de la descripción, usar una sola pregunta de intención («¿Lo comprarías?») y comparar con lo que el cliente hace hoy."}, {"severidad": "importante", "titulo": "Opciones de respuesta incompletas", "ubicacion": "Sección I y II", "cita": "Frecuencia: «Menos de una vez a la semana / 1 a 2 veces por semana / 3 a 4 veces por semana / 5 a 6 veces por semana»; edad: «36 a 45 años» y «Más de 46 años»", "problema": "En frecuencia faltan «Nunca» y «Todos los días»; quien nunca toma refrescos o los toma a diario no tiene opción. En edad, quien tiene 46 años queda sin opción exacta («36 a 45» y «Más de 46»). La opción «Otro» de bebida aparece en blanco. Todas las preguntas, salvo los sabores, son opcionales, por lo que pueden quedar sin responder las claves.", "mejora": "Completar frecuencia con «Nunca» y «Todos los días», cambiar la última edad a «Más de 45 años», rotular la opción «Otra (especifica)» y marcar como obligatorias las preguntas clave."}, {"severidad": "sugerencia", "titulo": "Los sabores no obligan a elegir ni capturan nuevas opciones", "ubicacion": "Sección IV, matriz de sabores", "cita": "«¿Qué tanto te agradaría estos sabores?» (Maracuyá con mango / Fresa con Sandía / Piña con Jamaica, 1 a 5)", "problema": "En una matriz de 1 a 5 es habitual que todos reciban 4 o 5, lo que hace al resultado previsible. Tampoco hay una pregunta abierta para otros sabores ni se comparan con lo que el cliente consume.", "mejora": "Pedir elegir el sabor favorito, ordenar los tres y agregar «¿Qué otro sabor te gustaría?» como respuesta abierta opcional."}, {"severidad": "sugerencia", "titulo": "Se muestra solo una imagen del producto, sin muestra para probar", "ubicacion": "Secciones III y IV (imágenes)", "cita": "Dos imágenes de 1600×900 px y la descripción «un concentrado de frutas en un sachet de 60 ml»", "problema": "Las imágenes mejoran la validez, pero la validación del MVP exige que el cliente pueda probar o ver el sachet real y su preparación. Las preguntas de sabor y practicidad se contestan sobre una descripción, no sobre una experiencia.", "mejora": "Aplicar la encuesta presencialmente con una muestra preparada del sachet y la botella, o mostrar un video corto de la preparación, y registrar en cada respuesta si probó el producto."}, {"severidad": "sugerencia", "titulo": "Marca escrita de tres maneras y errores de redacción", "ubicacion": "Todo el formulario", "cita": "«FRÚTZUMMA» / «FRUTZUMMA» / «FRÚTZUMA»; «Whtasapp»; «Si»; «Más de 46 años»", "problema": "El informe usa FRÚTZUMA, pero el título, la descripción y las preguntas dicen FRÚTZUMMA, FRUTZUMMA o FRÚTZUMA. La falta de tildes («Si») y errores como «Whtasapp» restan seriedad al instrumento y pueden confundir a los encuestados.", "mejora": "Unificar el nombre del producto con el informe, corregir ortografía y tildes y hacer una prueba piloto con 5 personas del segmento antes de la aplicación, midiendo el tiempo de respuesta."}], "preguntas": [{"pregunta": "¿Lugar de residencia? ¿Edad? ¿Ocupación?", "opciones": "Arequipa / Otro (fin); 18-25 / 26-35 / 36-45 / Más de 46 (fin); Estudias / Trabajas / Ambos", "mide": "Filtro del segmento (correcto). Ajustar el tramo de edad a «Más de 45»."}, {"pregunta": "¿Con qué frecuencia consumes refrescos de frutas? / ¿Tiene dificultades para tomar bebidas de fruta durante el día? / ¿Qué bebida sueles elegir con poco tiempo?", "opciones": "Cuatro tramos sin «Nunca» ni «Todos los días»; Si / No / Ninguna; seis opciones sin concentrados", "mide": "Hábito y problema; hipótesis H1. Opciones incompletas y pregunta guiada."}, {"pregunta": "¿Qué tan atractiva te parece la propuesta? / ¿Qué tan probable sería que probaras?", "opciones": "Escala de 1 a 5 (Nada atractiva a Muy atractiva)", "mide": "Atractivo e intención de prueba; hipótesis H2. Las dos preguntas se solapan."}, {"pregunta": "¿Qué tanto te agradaría estos sabores? / ¿Qué tan práctico sería?", "opciones": "Matriz de 1 a 5 para tres sabores (obligatoria); escala de 1 a 5", "mide": "Aceptación de sabores (H3) y practicidad (funcionalidad del MVP)."}, {"pregunta": "¿Cómo preferirías comprar? / ¿Cuánto pagarías por un sachet? / ¿Canal de adquisición?", "opciones": "Individual, kit de 6, 12 o 24, no estoy seguro; tres rangos de S/ 1,00 a más de S/ 2,00; Whtasapp, bodegas, supermercados", "mide": "Presentación, precio y canal. No prueba S/ 1,00 ni los precios de los kits y no recoge el punto de retiro."}, {"pregunta": "¿Qué podemos mejorar en FRÚTZUMA?", "opciones": "Respuesta abierta (opcional)", "mide": "Mejoras al MVP; útil para el cap. 5 si se codifican las respuestas."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Planteamiento del MVP y herramientas (cap. 4)", "resumen": "El cap. 4 tiene una tabla de hipótesis H1 a H4 con objetivos y forma de medición, y una lista MoSCoW con solo funcionalidades «Must» del producto. Faltan las herramientas, los pasos seguidos, los criterios de éxito y las funcionalidades del modelo (pedido, retiro, kits).", "observaciones": [{"severidad": "critico", "titulo": "El capítulo 4 no tiene una sección de herramientas para diseñar y validar el MVP", "ubicacion": "Cap. 4 (4.1 y 4.2)", "cita": "«Por lo pronto el MVP solo tendrá el apartado ´´debe tener (Must)´´»", "problema": "La consigna exige objetivos, funcionalidades mínimas y herramientas para diseñar y validar el MVP. El informe tiene la tabla 4.1 y la lista MoSCoW, pero no declara con qué se prototipa (formulación, selladora o maquila), con qué se mide (pH/°Brix, pruebas sensoriales, formulario) ni con qué se vende en el piloto (WhatsApp Business, QR, Instagram). Las herramientas están dispersas en la ficha técnica 2.2 y no se justifican.", "mejora": "Agregar 4.3 «Herramientas del MVP» con una tabla Herramienta | Para qué | Por qué es la más simple y viable | Costo. Ejemplo: Google Forms (encuesta, S/ 0), WhatsApp Business (pedidos, S/ 0), prototipo artesanal con selladora de mesa (S/ ___ cotizado), laboratorio acreditado INACAL (análisis, S/ ___ por muestra). Justificar cada una contra funcionalidad, usabilidad y viabilidad técnica."}, {"severidad": "critico", "titulo": "Los objetivos del MVP son hipótesis de aceptación, no objetivos medibles con criterio de éxito", "ubicacion": "4.1, columnas «Objetivo del MVP» y «¿Cómo lo mediremos?»", "cita": "«Comprobar si existe una necesidad real...» / «Encuesta a 50 personas del segmento objetivo»", "problema": "Ninguna hipótesis (H1 a H4) trae una meta numérica que diga cuándo se acepta o rechaza; sin umbral no hay forma de concluir en el cap. 5. Además H4 se mide con «pruebas de transporte» pero se apoya en «la imagen de referencia», que no prueba fugas ni sellado, y H1 a H3 comparten la misma encuesta sin separar qué pregunta mide cada hipótesis.", "mejora": "Escribir un criterio por hipótesis. Ejemplo: H2 se acepta si ≥ 60 % de n = 50 califica 4 o 5 la practicidad; H3 si cada sabor obtiene ≥ 3,5 de 5; H4 si ≥ 9 de 10 sachets prototipo pasan prueba de caída y sellado sin fuga. Añadir H5 de precio («≥ 50 % compraría a S/ 1,00») y H6 de canal («≥ 40 % retiraría en cafetería»)."}, {"severidad": "importante", "titulo": "El MVP queda reducido a «solo Must» y no incluye el piloto de ventas que valida el modelo de negocio", "ubicacion": "4.2 MoSCoW", "cita": "«Por lo pronto el MVP solo tendrá el apartado ´´debe tener (Must)´´»", "problema": "Las 5 funcionalidades son características del producto. Faltan las del modelo: pedido por WhatsApp, kits de 6 y 12, retiro en cafetería y pedido agrupado, que el BMC (3.2) y el pitch (3.6) declaran como parte de la propuesta. Tampoco hay Should/Could/Won't, de modo que no se sabe qué se descarta (QR, versión con stevia, kit 12).", "mejora": "Completar MoSCoW: Must = sachet 60 ml, 3 sabores, rendimiento 500 ml, rotulado mínimo, pedido por WhatsApp con retiro; Should = kit 6; Could = QR y kit 12; Won't (este ciclo) = envío a domicilio y venta en supermercados. Indicar responsable y fecha de cada Must."}, {"severidad": "importante", "titulo": "No se relatan los pasos seguidos para desarrollar el MVP ni los ajustes respecto de la AA1", "ubicacion": "Cap. 4 completo", "cita": "Solo se lee la tabla 4.1 y la lista de 5 funcionalidades", "problema": "La rúbrica pide TODOS los pasos seguidos para el nivel 4. El informe no dice si ya existe un prototipo (formulación probada, sachet sellado), qué se cambió desde la AA1 (se retiró el acesulfame y la fórmula con azúcar, según la Tabla 4) ni qué resultó de las pruebas de 2.2.2.", "mejora": "Agregar en 4.3 una línea de tiempo: (1) hipótesis AA1, (2) formulación y prueba de 3 sabores, (3) prueba de sellado y caída, (4) encuesta, (5) ajustes. Con fecha, responsable y evidencia (foto del prototipo, ficha de cata, registro de pH/°Brix)."}, {"severidad": "importante", "titulo": "Coherencia con la propuesta de valor: la diferenciación del cap. 3 no se refleja en los objetivos del MVP", "ubicacion": "3.3 (ventaja competitiva) frente a 4.1", "cita": "«contrastar en AA2 los tres prototipos mediante prueba de sabor a ciegas frente a Zuko y un concentrado existente»", "problema": "El propio informe se comprometió a una prueba a ciegas frente a Zuko y un concentrado y a calcular costo por litro y margen por canal. El cap. 4 no la recoge: ninguna hipótesis compara contra competencia. Con S/ 2,00/L frente a S/ 0,60/L de Zuko (si rinde 2 L por sobre), la diferenciación es lo que justifica el precio, y no se prueba.", "mejora": "Añadir H5 «Preferencia frente a Zuko y Naturale»: cata a ciegas con ≥ 20 personas, 3 muestras codificadas, criterio ≥ 50 % elige Frútzuma y ≥ 40 % pagaría S/ 1,00. Registrar resultados en una tabla en el cap. 5."}, {"severidad": "sugerencia", "titulo": "La versión del producto del MVP (con o sin azúcar, con stevia) no está decidida", "ubicacion": "Tabla 4, fila «Formulaciones de prueba»", "cita": "«Versión sin azúcar añadida y versión endulzada con stevia, sujetas a análisis nutricional»", "problema": "El costo variable de S/ 0,70 no dice a qué formulación corresponde, y la formulación cambia el costo, el rotulado (advertencias) y la vida útil.", "mejora": "Elegir una formulación base para el piloto, probar la segunda como variante en la cata y costear ambas por sachet."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Validación del MVP y del modelo de negocio (cap. 5)", "resumen": "El cap. 5 es solo la consigna del lineamiento. No hay muestra, resultados ni métricas; el anexo reconoce tres entrevistas simuladas y una tabla de pendientes. El formulario ya fue revisado aparte (2/4).", "observaciones": [{"severidad": "critico", "titulo": "El capítulo 5 es solo la consigna: no hay metodología, datos ni resultados", "ubicacion": "Cap. 5 (viñetas de la consigna)", "cita": "«Recolecta los datos. Analiza los resultados de la encuesta y/o entrevista para determinar la viabilidad del modelo de negocio.»", "problema": "En la versión del 11/11/2026 el texto del cap. 5 es la instrucción del lineamiento copiada. No se informa muestra, método de muestreo, fechas de aplicación, respuestas válidas, porcentajes por pregunta ni conclusiones. La AA2 exige evidencia real y, sin ella, el criterio no pasa de 2.", "mejora": "Aplicar la encuesta rediseñada a n ≥ 50 del segmento (18 a 45 años, Arequipa, estudia y/o trabaja) y redactar 5.1 Metodología (muestra, canal, fechas, filtro), 5.2 Resultados (tabla con n y % por pregunta; gráfico de sabores y de precios), 5.3 Análisis contra criterios y 5.4 Conclusiones con métricas. Anexar el export de Google Forms."}, {"severidad": "critico", "titulo": "El anexo reconoce entrevistas «simuladas» y no hay ninguna entrevista real", "ubicacion": "Anexo, «ENTREVISTAS SIMULADAS (3 EJEMPLOS; NO REALIZADAS)» y Tabla 14", "cita": "«Este anexo es una herramienta de trabajo, no evidencia recabada.»", "problema": "El informe es honesto al rotularlas, pero eso confirma que el trabajo de campo no existe. La Tabla 14 lista como pendientes 5–10 entrevistas, la captura de precios locales y las cotizaciones. Ya no hay flexibilización: faltan entrevistas, encuesta y prueba de producto.", "mejora": "Realizar 8 a 10 entrevistas reales con la guía de la Tabla 13 (consentimiento, código E01–E10, fecha, dos citas textuales) y cargar la síntesis en el cap. 5. Complementar con una cata de los tres sabores a ≥ 20 personas con ficha 1–5. Retirar las simulaciones de la entrega final."}, {"severidad": "critico", "titulo": "El formulario aplicado no valida precio, agua potable ni canal", "ubicacion": "Formulario en línea (ver sección «AA2 · Formulario de validación») y 3.2 BMC", "cita": "«¿Cuánto estarías dispuesto(a) a pagar por un sachet individual...?» con rangos desde S/ 1,00", "problema": "El instrumento no coincide con el modelo del cap. 3: no prueba S/ 1,00, S/ 5,50 ni S/ 10,50, incluye un kit de 24 inexistente en el informe y no pregunta por retiro en cafetería ni por competidores. Las respuestas obtenidas con él no servirían para el presupuesto del cap. 6.", "mejora": "Corregir el formulario antes de seguir recolectando (ver observaciones del formulario) y guardar la versión final como anexo con fecha de cierre. Etiquetar las respuestas ya obtenidas con la versión antigua como «piloto» y no mezclarlas."}, {"severidad": "importante", "titulo": "No hay conclusiones con métricas ni mejoras derivadas al MVP", "ubicacion": "Cap. 5; sin sección de conclusiones", "cita": "«Elabora las conclusiones de validación con métricas.»", "problema": "Es el requisito del nivel 4. Sin datos tampoco hay mejoras. Ejemplo de lo esperado: «El 72 % (36/50) calificó 4–5 la practicidad; Piñamaica obtuvo 3,1/5, por lo que se reformula con menos Jamaica».", "mejora": "Armar una tabla Hallazgo | Métrica | Decisión sobre el MVP. Ejemplos: Piñamaica < 3,5/5 → ajustar fórmula o retirar del lanzamiento; 38 % acepta S/ 1,00 → probar S/ 1,20 o reducir contenido; 55 % prefiere retiro → priorizar 2 cafeterías cercanas a un instituto."}, {"severidad": "importante", "titulo": "Validación técnica y sanitaria sin evidencia: vida útil de 4 meses, estabilidad y rotulado", "ubicacion": "Tabla 4 (Vida útil) y Tabla 14 (Formulación, Inocuidad/rotulado)", "cita": "«Objetivo comercial: 4 meses desde la elaboración, condicionado a estudio de vida útil»", "problema": "Un concentrado frutal envasado, sin azúcar añadida y sin conservantes aprobados, difícilmente se conserva 4 meses a temperatura ambiente. Es el mayor riesgo de factibilidad del producto físico y no hay prueba, costo de laboratorio ni cronograma.", "mejora": "Hacer una prueba acelerada de estabilidad con un laboratorio acreditado (pH, °Brix, microbiología a 0, 30, 60 y 120 días) y cotizar su costo. Mientras tanto declarar en el piloto una vida útil comprobada (por ejemplo refrigerado 15 días) y no la objetivo."}, {"severidad": "sugerencia", "titulo": "Hipótesis de canal y de modelo de negocio sin instrumento", "ubicacion": "3.2 Canales y 3.5 Indicadores", "cita": "«cafeterías: puntos de retiro o compradoras mayoristas, según contrato»", "problema": "El canal de cafeterías es clave para el margen (ver cap. 6) pero ninguna prueba lo valida. Los indicadores de 3.5 son ejemplos ficticios, no resultados.", "mejora": "Visitar 3 a 5 cafeterías, preguntar si aceptarían retiro y qué comisión pedirían, y registrarlo en el cap. 5. Reemplazar los ejemplos de 3.5 por un piloto real (por ejemplo 30 pedidos en 2 semanas)."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Proyección financiera y presupuestaria a 3 años (cap. 6)", "resumen": "El cap. 6 es solo la consigna: ninguna de las siete piezas está desarrollada. El único dato económico es el costo variable de ejemplo de S/ 0,70 (margen S/ 0,30 por sachet, S/ 1,30 por kit de 6 y S/ 2,10 por kit de 12), sin receta ni cotizaciones.", "observaciones": [{"severidad": "critico", "titulo": "El capítulo 6 es solo la consigna: no existe ninguna de las 7 piezas", "ubicacion": "Cap. 6 (lista de viñetas)", "cita": "«Revisa y ajusta las proyecciones financieras y presupuestos, incluyendo: Estructura de inversión total... Valorización del emprendimiento e indicadores de rentabilidad»", "problema": "No hay estructura de inversión, costos y gastos, presupuesto de ingresos y de egresos, flujo mensual del año 1, flujo económico a 3 años, ni VAN, TIR y PRI. Tampoco hay análisis del entorno interno y externo ligado al cap. 6 (el FODA de 3.4 es de la AA1). Fuera del ejemplo de 3.5 no hay un solo número financiero en el expediente.", "mejora": "Armar el cap. 6 así: 6.1 Inversión (laboratorio, rotulado, prototipo, selladora o maquila, capital de trabajo, cada una con cotización); 6.2 Costos y gastos (fijos y variables); 6.3 Ingresos (unidades × precio por canal); 6.4 Egresos; 6.5 Flujo mensual año 1 (12 columnas); 6.6 Flujo anual años 1 a 3; 6.7 VAN, TIR y PRI con tasa de descuento justificada (por ejemplo 12–15 % anual)."}, {"severidad": "critico", "titulo": "El costo variable de S/ 0,70 no tiene sustento y deja un margen frágil, sobre todo en los kits y con comisión de cafeterías", "ubicacion": "3.5, Tabla 12 («S/ 1,00 – S/ 0,70 de costo variable = S/ 0,30/sachet») y Tabla 5", "cita": "«Ejemplo ilustrativo (no real)... S/ 1,00 – S/ 0,70»", "problema": "Verificado con Python: con S/ 0,70 el margen del sachet es S/ 0,30 (30 %); el kit de 6 deja S/ 1,30 (23,6 %) y el kit de 12 S/ 2,10 (20,0 %), porque el descuento de kit se paga con margen. Con 10 % de comisión de la cafetería el sachet queda en S/ 0,20 (el límite de la meta ≥ S/ 0,20 de 3.5); con 15 % el kit 12 deja S/ 0,52 y con 20 % queda en S/ 0,00. Los S/ 0,70 no parten de receta ni incluyen merma (meta ≤ 10 %), empaque secundario de los kits, etiqueta, análisis por lote ni distribución.", "mejora": "Construir la ficha de costeo por sachet de 60 ml: fruta (g × S/ kg) + endulzante + sachet impreso + llenado y sellado (maquila o mano de obra) + etiqueta + merma 5–10 % + caja del kit + comisión del canal. Ejemplo: fruta S/ 0,32 + sachet S/ 0,18 + llenado S/ 0,08 + merma S/ 0,03 + etiqueta S/ 0,05 = S/ 0,66 antes de comisión. Cotizar con 2 proveedores en Arequipa y fijar precio con margen objetivo ≥ 35 % después de comisión."}, {"severidad": "critico", "titulo": "Punto de equilibrio no calculado ni sustentado con costos fijos reales", "ubicacion": "3.2 (Costos), 3.5 y cap. 6", "cita": "«Costos: Fruta, sachet/llenado, análisis, almacenamiento, comercialización y entrega.»", "problema": "PE = costos fijos ÷ (precio − costo variable unitario) no se aplica porque no se listan costos fijos. Con la hoja del docente (nube y mantenimiento ≈ S/ 137/mes en el escenario Año 1 más S/ 1 500 de web opcional amortizada en 12 meses = S/ 125) el fijo sería ≈ S/ 262/mes y el PE ≈ 872 sachets (≈ 201 kits de 6) al mes, sin contar mano de obra, alquiler ni laboratorio. Ese escenario (200 clientes con un kit de 6 al mes) da S/ 1 100 de ingresos, S/ 260 de margen de contribución y S/ 123 tras costos digitales.", "mejora": "En el Excel de PE y en 6.2 separar fijos (maquila mínima o alquiler, sueldos si hay, marketing, laboratorio, contabilidad, licencias) de variables (por sachet). Mostrar el PE en sachets y en soles para sachet y cada kit, y contrastarlo con la demanda del cap. 5 (por ejemplo «PE = 460 sachets/mes = 77 kits de 6; con 40 % de intención de compra se requieren 190 consultas»)."}, {"severidad": "importante", "titulo": "Inversión y gastos de arranque no identificados: laboratorio, rotulado, selladora y capital de trabajo", "ubicacion": "Tabla 14 (Costos, Inocuidad/rotulado) y Tabla 6", "cita": "«2 cotizaciones de envase/maquila y costo de envío por canal.»", "problema": "Según la lista del docente, el registro sanitario DIGESA no tiene costo (Comunicado 05-2026), pero sí los análisis de laboratorio y el rotulado; sachet, selladora y fruta están en «Cotizar». Ninguna cifra aparece en el informe, así que no se puede armar la inversión ni el capital de trabajo.", "mejora": "Agregar la tabla 6.1 con rubros: análisis microbiológico y fisicoquímico y estudio de vida útil (cotizar), diseño e impresión de etiqueta y sachet por millar mínimo, selladora o maquila, prototipo, trámite DIGESA/VUCE, capital de trabajo = costos de 2 meses. Indicar la fuente de financiamiento (aporte propio o préstamo) y su tasa."}, {"severidad": "importante", "titulo": "Presupuesto de ingresos sin volúmenes basados en la validación ni mezcla de canales", "ubicacion": "3.5 y Tabla 5", "cita": "«35 pedidos agrupados / 50 pedidos × 100 = 70 %.»", "problema": "No se proyectan unidades por mes, ni la mezcla sachet / kit 6 / kit 12, ni estacionalidad (inicio de ciclo, calor), ni crecimiento a 3 años. Dado que el canal es cafeterías, tampoco se dice cuántos puntos de retiro se abrirán ni con qué ventas.", "mejora": "Proyectar mes a mes: clientes × frecuencia × ticket. Ejemplo: 60 clientes el mes 1 con crecimiento de 8 % mensual, 1 compra al mes, 70 % kit 6, 20 % sachet suelto, 10 % kit 12 y recompra de 20 % (meta de la Tabla 12); +25 % el año 2 y +20 % el año 3 con justificación."}, {"severidad": "importante", "titulo": "No se puede evaluar la coherencia con el MVP validado porque la validación no existe", "ubicacion": "Caps. 5 y 6", "cita": "«Debe ser coherente con el MVP validado (precios, volúmenes y supuestos salen de la validación)»", "problema": "Los precios S/ 1,00 / 5,50 / 10,50 son «hipótesis, no precio definitivo» (3.2) y el informe dice que «el margen se determinará cuando se conozcan los costos» (Tabla 5). Los supuestos de ventas son ejemplos ficticios. No hay conexión entre datos y presupuesto, y los costos digitales de la lista del docente (WhatsApp Business gratis, dominio S/ 5,83/mes) no están incorporados.", "mejora": "Declarar los supuestos en una tabla Supuesto | Valor | Fuente. Ejemplo: «Precio S/ 1,00: aceptado por 58 % (29/50) en la encuesta; costo por sachet S/ 0,66: cotización de maquila del 05/12». Usar la hoja del docente para costos digitales."}, {"severidad": "sugerencia", "titulo": "No se calculan la valorización ni los indicadores a 3 años", "ubicacion": "Cap. 6, última viñeta", "cita": "«Valorización del emprendimiento e indicadores de rentabilidad»", "problema": "Faltan flujo de caja económico, tasa de descuento (COK), VAN, TIR, PRI, relación beneficio/costo y escenarios. Con un ticket bajo (S/ 1,00) el PRI puede superar los 3 años si la inversión en laboratorio y empaque es alta.", "mejora": "Calcular en Excel: =VNA(tasa; flujos año 1–3) + inversión, =TIR(rango), PRI con flujo acumulado; presentar 3 escenarios (ventas −20 %, base, +20 %) y concluir viabilidad (VAN > 0, TIR > COK, PRI ≤ 36 meses)."}]}], "fecha_aa2": "11/11/2026", "calificacion": {"fuentes": 4, "problema": 3, "propuesta": 3, "modelo": 4, "responsabilidad": 3}, "calificacionAA2": {"validacion": 2}, "enlaces": [{"titulo": "Informe del TAP (Google Docs)", "url": "https://docs.google.com/document/d/1yiaO1OPKO_oMEqvIdoZb4yOKN1v0VezY"}, {"titulo": "Formulario de validación", "url": "https://docs.google.com/forms/d/e/1FAIpQLSfqWssBIC_w1tmiXGUjw2vgGMCVefkKXdHh1wOpEnzVtVUebQ/viewform"}, {"titulo": "Excel de punto de equilibrio (cap. 6)", "url": "https://docs.google.com/spreadsheets/d/1lQcTSnNHBoE6c84RrQLwBMEutq2xj4jQcOEb8S3-xmI/edit"}], "costosAA2": {"hoja": "Frutzuma", "tipo_cambio": 3.5, "escenarios": ["Piloto", "Año 1", "Crecimiento"], "supuestos": [{"concepto": "Clientes atendidos al mes", "unidad": "clientes", "valores": [50.0, 200.0, 800.0], "nota": "SUPUESTO sobre el volumen del informe (no declarado)."}, {"concepto": "Mensajes de utilidad por WhatsApp API", "unidad": "mensajes", "valores": [0.0, 200.0, 1000.0], "nota": "Piloto: app gratuita (sin API). Año 1+: solo si pasan a la API."}, {"concepto": "Mensajes de marketing por WhatsApp API", "unidad": "mensajes", "valores": [0.0, 100.0, 500.0], "nota": "Ídem."}, {"concepto": "¿Dominio propio? (1 = sí)", "unidad": "1/0", "valores": [0.0, 1.0, 1.0], "nota": "Opcional (web/QR/tienda en línea)."}, {"concepto": "Horas de desarrollo inicial de la plataforma", "unidad": "horas", "valores": [30.0, 30.0, 30.0], "nota": "SUPUESTO, OPCIONAL: página web sencilla para pedidos agrupados y QR del empaque. Si no la desarrollan, es S/ 0."}, {"concepto": "Horas de mantenimiento al mes", "unidad": "horas", "valores": [0.0, 2.0, 4.0], "nota": "SUPUESTO: bolsa de horas mensual para corrección de errores, actualizaciones y soporte."}, {"concepto": "Encargado fijo de actualizaciones (S/ al mes; 0 = usar bolsa de horas)", "unidad": "S/ / mes", "valores": [0.0, 0.0, 0.0], "nota": "OPCIONAL: si contrata a una persona con pago mensual fijo para actualizar la plataforma, escriba aquí su pago; reemplaza a la bolsa de horas."}], "costos": [{"concepto": "WhatsApp Business API", "valores": [0.0, 45.6, 228.03], "nota": "La app gratuita de WhatsApp Business no cuesta; esto es solo si usan la API"}, {"concepto": "Dominio propio (prorrateado)", "valores": [0.0, 5.83, 5.83], "nota": ""}, {"concepto": "Imprevistos", "valores": [0.0, 5.14, 23.39], "nota": ""}], "total_pen": [0.0, 56.5822, 257.2442], "primer_pago_pen": [0.0, 127.1655, 327.8275], "ingreso_etiqueta": "Ventas brutas (kit de 6 a S/ 5,50, 1 por cliente)", "ingreso_pen": [275.0, 1100.0, 4400.0], "chat_pen": null, "desarrollo_pen": 1500.0, "mantenimiento_pen": [0.0, 80.0, 160.0], "total_con_mant_pen": [0.0, 136.5822, 417.2442], "tarifa_desarrollo": 50, "tarifa_mantenimiento": 40, "pct_ingreso": [0.0, 0.0514, 0.0585], "por_usuario_pen": [0.0, 0.2829, 0.3216], "notas": ["Sitio web estático en Firebase Hosting o similar: dentro de la capa gratuita; el costo real es solo el dominio.", "Formularios (Google Forms) y la app WhatsApp Business no tienen costo. La API de WhatsApp solo conviene con automatización y volumen.", "No requieren base de datos, IA ni servidores para el MVP: su costo digital es marginal."], "elaborado": "11/11/2026", "primer_pago_total_pen": [1500.0, 1627.1655, 1827.8275], "costo_anio1_pen": [1500.0, 3138.986, 6506.93], "necesidades": {"nombre": "Frútzuma", "resumen": "Producto físico: concentrado de fruta en sachets de 60 ml en tres sabores. El MVP es el producto; el costo está en insumos, envasado, permisos y distribución.", "items": [{"rubro": "Fruta e insumos", "necesidad": "Sabores Maracumango, fresa con sandía y Piñamaica. El informe da un costo variable de ejemplo de S/ 0,70 por sachet.", "origen": "Declarado", "proveedor": "Mercados mayoristas de Arequipa y proveedores de pulpa de fruta", "producto": "Pulpa o fruta, azúcar y conservantes permitidos", "precio": "Cotizar por kilo", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "Sustentar los S/ 0,70 con la receta por sachet y precios actuales."}, {"rubro": "Sachet y envasado", "necesidad": "Sachet individual de 60 ml (rinde ~500 ml de agua) y selladora.", "origen": "Declarado", "proveedor": "Fabricantes de empaques flexibles y proveedores de maquinaria de envasado", "producto": "Sachets impresos y equipo de sellado", "precio": "Cotizar por millar y por equipo", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": ""}, {"rubro": "Registro sanitario", "necesidad": "Para comercializar un alimento envasado en cafeterías y tiendas.", "origen": "Inferido", "proveedor": "DIGESA (Ministerio de Salud) por la VUCE", "producto": "Registro sanitario de alimento", "precio": "Sin costo para el administrado: DIGESA (Comunicado 05-2026, 03/08/2026) indica que los registros sanitarios continúan sin costo; si la VUCE cobra derechos, los devuelve", "pen": 0, "frecuencia": "única", "estado": "Verificado", "nota": "Fuente: comunicado oficial de DIGESA. Sí cuestan los análisis de laboratorio y los gastos del expediente (ver otros rubros). Confirmar el trámite vigente en la VUCE al iniciar."}, {"rubro": "Análisis de laboratorio", "necesidad": "Inocuidad y vida útil del concentrado.", "origen": "Inferido", "proveedor": "Laboratorios acreditados ante INACAL", "producto": "Análisis microbiológico y fisicoquímico", "precio": "Cotizar por análisis", "pen": null, "frecuencia": "única", "estado": "Cotizar", "nota": ""}, {"rubro": "Pedidos y compra agrupada", "necesidad": "WhatsApp Business para consultas, compra agrupada y posventa.", "origen": "Declarado", "proveedor": "Meta", "producto": "WhatsApp Business (aplicación)", "precio": "Gratis. La API cobra por mensaje en Perú: marketing aprox. USD 0,0703 y utilidad USD 0,02 a 0,03 (alza desde el 01/10/2026), según fuentes de terceros que citan la tarifa de Meta", "pen": 0, "frecuencia": "mensual", "estado": "Referencial", "nota": "Confirmar en la lista oficial de Meta si pasan a la API."}, {"rubro": "Redes y promoción", "necesidad": "Instagram, TikTok y Facebook.", "origen": "Declarado", "proveedor": "Meta Ads / TikTok Ads", "producto": "Publicidad pagada (opcional)", "precio": "Presupuesto propio del grupo", "pen": null, "frecuencia": "mensual", "estado": "Cotizar", "nota": ""}, {"rubro": "Punto de retiro", "necesidad": "Retiro de pedidos en cafeterías.", "origen": "Declarado", "proveedor": "Cafeterías aliadas", "producto": "Convenio o comisión por venta", "precio": "A negociar con cada cafetería", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "Si pagan comisión, debe entrar como costo variable."}, {"rubro": "Código QR del empaque", "necesidad": "QR con datos del producto. Solo cuesta si apunta a una web propia.", "origen": "Declarado", "proveedor": "Generadores gratuitos de QR; hosting solo si hay web", "producto": "QR estático", "precio": "Gratis (estático)", "pen": 0, "frecuencia": "única", "estado": "Referencial", "nota": ""}]}, "estados_precio": {"Verificado": "Precio leído de la fuente oficial o coincidente en varias fuentes el 11/11/2026.", "Referencial": "Cifra de referencia: confirmar con la calculadora o lista de precios oficial del proveedor antes de presentar.", "Cotizar": "No hay precio público confiable: el grupo debe pedir cotización a 2 o más proveedores y anexarla."}}, "notasAA2": {"id": "grupo-quispe-quintanilla-sosa", "fecha": "11/11/2026", "mvp": 2, "herramientas": 1, "validacion": 2, "presupuesto": 1, "compromiso": 3, "total": 9, "justificacion": {"mvp": "El cap. 4 tiene la tabla 4.1 (H1 a H4 con objetivo y medición) y una lista MoSCoW de 5 funcionalidades «Must» coherentes con la propuesta de valor del producto. Es nivel 2 porque no hay criterios de éxito numéricos, no se relatan los pasos seguidos y el MVP omite las funcionalidades del modelo (pedido por WhatsApp, retiro en cafetería, kits).", "herramientas": "El cap. 4 no contiene ninguna sección de herramientas: solo la frase «Por lo pronto el MVP solo tendrá el apartado Must». Las menciones a WhatsApp, QR, pruebas de pH y sellado están dispersas en la ficha técnica (Tabla 4) sin justificar su aporte a funcionalidad, usabilidad o viabilidad. Es esbozo (nivel 1).", "validacion": "El cap. 5 es solo la consigna copiada; el anexo reconoce tres entrevistas «simuladas, no realizadas» y una Tabla 14 de pendientes. El único avance real es el formulario en línea (revisado, 2/4), que no prueba S/ 1,00 / 5,50 / 10,50 ni canal ni agua potable. Sin muestra, resultados ni mejoras al MVP no pasa de 2.", "presupuesto": "El cap. 6 es solo la lista de la consigna: no existe ninguna de las 7 piezas ni VAN, TIR o PRI. Lo único numérico es el ejemplo de 3.5 (S/ 1,00 − S/ 0,70 = S/ 0,30), sin receta ni cotizaciones; con ese costo el margen es 30 % en sachet, 23,6 % en kit 6 y 20 % en kit 12, y se anula con 20 % de comisión de cafetería. Es solo consigna (nivel 1).", "compromiso": "a criterio del docente"}, "cambios_vs_6nov": "sin cambios en el Word desde el 06/11", "camino_al_20": ["Cap. 6 (prioridad máxima): ficha de costeo por sachet con receta y 2 cotizaciones (fruta, sachet, llenado, etiqueta, merma, comisión) que sustente o corrija los S/ 0,70; fijar precios con margen ≥ 35 % después de comisión.", "Cap. 6: desarrollar las 7 piezas (inversión, costos y gastos, ingresos, egresos, flujo mensual año 1, flujo a 3 años, VAN/TIR/PRI) con supuestos tomados de la validación y de la lista de precios del docente; entregar además el Excel de punto de equilibrio con PE = CF ÷ (P − CVu).", "Cap. 5: corregir el formulario (precio S/ 1,00 / 5,50 / 10,50, rangos < S/ 1,00, retiro en cafetería, agua potable, competidores, sin kit de 24), aplicarlo a n ≥ 50 y sumar 8–10 entrevistas reales y una cata de 3 sabores; presentar tablas con n y %, conclusiones con métricas y mejoras al MVP (nivel 4).", "Cap. 4: agregar sección de herramientas justificada, criterios de éxito por hipótesis, MoSCoW completo (Should/Could/Won't), funcionalidades del modelo y la línea de tiempo de pasos seguidos.", "Evidencia técnica: estudio de estabilidad que respalde la vida útil o declarar una vida útil comprobada menor; incluir laboratorio y rotulado en la inversión.", "Entrega: portada con carrera, sección y grupo; retirar entrevistas simuladas y actualizar el pie «AA1»; preparar el pitch de 7–10 min (6x6, letra ≥ 20, todos participan) con resultados reales."]}, "calculadoraXlsx": "calculadora-frutzuma-b6030cc1.xlsx", "excelPE": {"id": "grupo-quispe-quintanilla-sosa", "estado": "calificado", "revisado": "2026-11-13", "archivo": "D:\\05 - Personal\\Proyecto de Claude\\Cursos\\Proyecto Integrador\\entregas\\AA2_excel\\grupo-quispe-quintanilla-sosa.xlsx", "logro": 21.2, "nivel": 1, "logro_auto": 69, "aviso": "logro_auto solo mide si el contenido aparece; la revisión experta (coherencia con el informe, precios, supuestos) define el logro.", "tecnico": {"hojas": ["Instrucciones", "Resumen", "Supuestos", "Costos_Variables", "Costos_Fijos", "Inversion", "Mercado", "Proyeccion", "Prestamo", "EERR", "Flujos", "PE"], "formulas": 510, "numeros_pegados": 116, "pct_formulas": 81, "errores_formula": ["Prestamo!C7 #VALUE!", "Prestamo!D11 #VALUE!", "Prestamo!E11 #VALUE!", "Prestamo!F11 #VALUE!", "Prestamo!G11 #VALUE!", "Prestamo!C12 #VALUE!", "Prestamo!D12 #VALUE!", "Prestamo!E12 #VALUE!", "Prestamo!F12 #VALUE!", "Prestamo!G12 #VALUE!", "Prestamo!C13 #VALUE!", "Prestamo!D13 #VALUE!", "Prestamo!E13 #VALUE!", "Prestamo!F13 #VALUE!", "Prestamo!G13 #VALUE!", "EERR!C12 #VALUE!", "EERR!D12 #VALUE!", "EERR!E12 #VALUE!", "EERR!C13 #VALUE!", "EERR!D13 #VALUE!"], "graficos": 2}, "criterios": [{"clave": "inversion", "nombre": "Inversión inicial", "peso": 10, "puntaje": 2.5, "comentario": "Hoja Inversion: las 15 filas de inversión fija (B6:G20) están vacías, por lo que «Inversión fija total» F22 = S/ 0. La inversión total (S/ 18 640, F26) es solo el capital de trabajo = 4 meses × costos fijos de S/ 4 660 (Supuestos!B13). No se listan desarrollo de la web/WhatsApp, equipos o maquila, estudio de estabilidad y análisis de laboratorio, registro/notificación sanitaria, marca ni stock inicial de insumos y sachets, que el propio informe (Tabla 14, pendientes) reconoce como necesarios. Además, aporte propio + préstamo (S/ 5 000 + S/ 5 000 = S/ 10 000) no cubre la inversión de S/ 18 640 (Resumen D40 = REVISAR).", "señal_auto_pct": 67, "faltan_palabras": ["desarrollo"], "logro_pct": 25}, {"clave": "costos", "nombre": "Costos y gastos", "peso": 20, "puntaje": 10.0, "comentario": "Lo mejor del archivo: Costos_Fijos tiene 10 rubros con monto mensual (administrador S/ 1 800, alquiler S/ 1 800, contabilidad S/ 200, servicios S/ 250, marketing S/ 300, etc. = S/ 4 660/mes, S/ 55 920/año) clasificados como administrativo o venta, y Costos_Va function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>
