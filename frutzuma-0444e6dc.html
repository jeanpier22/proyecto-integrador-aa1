<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.scorebox { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

e maquila y de envase para el cap. 6.", "Calcular el margen por canal (retiro propio frente a cafetería)."]}, {"tema": "Competencia", "titulo": "Competidores con sachets y atributo copiable", "choque": "Naturale y FIFU ya venden sachets y el atributo diferencial es copiable.", "ideas": ["Hacer la prueba ciega de sabor en la AA2.", "Probar un diferencial más difícil de copiar, como frutas regionales."]}, {"tema": "Adopción", "titulo": "Se necesita agua segura y un recipiente", "choque": "El informe lo reconoce (Tabla 1, caso 1), pero aún no define si el cliente lleva botella o agua. Sin esa respuesta se pierde la practicidad frente a una bebida lista.", "ideas": ["Plantear la pregunta sobre agua y recipiente como hipótesis y contrastarla en la AA2.", "Empezar el piloto en institutos u oficinas con dispensadores."]}, {"tema": "Operación", "titulo": "Vida útil objetivo y puntos de retiro", "choque": "La vida útil de 4 meses es un objetivo sin estudio de estabilidad, y los puntos de retiro dependen de cafeterías que todavía no han sido consultadas.", "ideas": ["Consultar a un laboratorio universitario por un estudio acelerado.", "Conversar con dos o tres cafeterías sobre comisión y almacenamiento."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "completo", "nota": "Ya incluye carrera, sección (M394) y grupo 7; la fecha sigue siendo 30 de octubre."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Contiene una instrucción de Word dirigida al lector («regenera la tabla de contenido desde Referencias»), agrupa «2.3–2.4» aunque son apartados separados y omite el 3.4.1."}, {"codigo": "—", "apartado": "Introducción", "estado": "completo", "nota": "Presenta propósito, alcance y estructura, y advierte que no se atribuyen testimonios."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "completo", "nota": "Tabla 1 con causas y consecuencias; se presenta como hipótesis, aceptable en la AA1."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "Cifras de MINAM (2025), FAO (2026) e INEI (2026), metas 3.4, 12.3 y 12.5 (Tabla 2) y megatendencias de CEPLAN."}, {"codigo": "1.3", "apartado": "Megatendencia, oportunidad comercial y pregunta", "estado": "completo", "nota": "Incluye precios de sustitutos y la pregunta central."}, {"codigo": "1.4", "apartado": "Definición del problema", "estado": "incompleto", "nota": "Define una brecha por investigar y no formula con claridad el problema del cliente (quién, cuándo, qué pierde)."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Tres sabores y diferenciación coherentes; el diferencial no se declara exclusivo."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Tabla 4 con sostenibilidad, redes, funcionalidades y pruebas; precio (2.2.1) y proceso (2.2.2) completos."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Cinco beneficios en un solo párrafo, vinculados a la Tabla 1."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "La Tabla 7 recuperó la columna de validación."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Segmentación 2.5.1 a 2.5.6."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Seis casos breves."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "incompleto", "nota": "Tabla 8 con hipótesis; «Dice y hace» mantiene un marcador de posición de plantilla."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Tabla 9, Figura 1 y coherencia por pares en 3.2.1."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Tabla 10 con precio por litro, ventaja competitiva y estrategia de diferenciación."}, {"codigo": "3.4", "apartado": "FODA", "estado": "completo", "nota": "Con cuatro estrategias; la planificación del equipo pasó al 3.4.1."}, {"codigo": "3.5", "apartado": "Indicadores de gestión", "estado": "completo", "nota": "Cinco indicadores con fórmula, meta, frecuencia y ejemplo de cálculo."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Todas las fuentes se citan, pero las entradas no están en orden alfabético y dos de Tottus Perú (s. f.) necesitan a/b."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Mejora el problema social, que ahora tiene datos oficiales, y se mantiene la separación entre problema del cliente y problema social. Las hipótesis sobre el cliente son aceptables en esta AA1; falta formular con claridad el problema en el 1.4.", "observaciones": [{"severidad": "sugerencia", "titulo": "Rotular las entrevistas del anexo como hipótesis y validarlas en la AA2", "ubicacion": "Introducción; 1.1, Tabla 1; Anexo", "cita": "Incluye tres entrevistas simuladas para orientar el trabajo de campo", "problema": "El informe declara con claridad que las tres entrevistas del anexo son simuladas y que no se usan en los capítulos 1 a 3; esto es aceptable en la AA1 y no constituye falta de integridad. Conviene presentarlas como hipótesis de trabajo.", "mejora": "Rotular el anexo como hipótesis de trabajo y, en el cap. 5 (AA2), validarlas con personas reales de Arequipa, con fecha, lugar, código anónimo y consentimiento."}, {"severidad": "importante", "titulo": "El 1.4 describe lo que se estudiará y no formula el problema del cliente", "ubicacion": "1.1 (primer párrafo) y 1.4", "cita": "aún no se ha demostrado si estas alternativas satisfacen a quienes buscan preparar una bebida de sabor frutal", "problema": "Las cautelas son valiosas, pero el 1.4 no define el problema del cliente de forma concreta (qué le ocurre, con qué frecuencia, qué pierde): describe lo que el grupo estudiará. Aunque se plantee como hipótesis, la definición debe ser una afirmación clara.", "mejora": "Redactar el 1.4 como una hipótesis explícita, por ejemplo: «Los estudiantes y trabajadores de 18 a 45 años de Arequipa no preparan bebidas fuera de casa porque...», y dejar la incertidumbre para el plan de validación de la AA2."}, {"severidad": "importante", "titulo": "Falta una cifra del mercado o del consumo fuera del hogar en Arequipa", "ubicacion": "1.1 y 1.3", "cita": "no representa una medida de demanda del producto", "problema": "Las cifras del INEI sobre consumo de fruta, exceso de peso y población ocupada se aclaran como contexto, no como demanda. Siguen sin aparecer el tamaño o crecimiento del mercado de bebidas o refrescos ni el gasto fuera del hogar. El dato del estudio de Guzman-Vilca et al. (2022) proviene de 2017-2018.", "mejora": "Agregar una o dos cifras recientes del mercado de bebidas (INEI-ENAHO, Euromonitor o Kantar, citadas en APA) y la población de 18 a 45 años que estudia o trabaja en Arequipa."}, {"severidad": "sugerencia", "titulo": "Verificar la cifra de Arequipa del INEI y la referencia", "ubicacion": "1.1, tercer párrafo; Referencias", "cita": "la población ocupada de la ciudad de Arequipa aumentó 9,1 %", "problema": "La referencia citada se titula «Población ocupada a nivel nacional se incrementó 1,3 %...» y no está claro que la nota contenga el dato de la ciudad de Arequipa. La otra referencia del INEI dice 2025 en el título y 2024 en la URL.", "mejora": "Comprobar que ambos datos figuren en el documento citado, corregir la URL si corresponde y citar la tabla o página exacta."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "Los apartados están completos y ya no se contradicen. El diferencial sigue en el plano de la hipótesis.", "observaciones": [{"severidad": "critico", "titulo": "El diferencial sigue sin demostrarse y se declara no exclusivo", "ubicacion": "2.1, tercer párrafo; 3.3, ventaja competitiva", "cita": "Esta combinación no se presenta como exclusiva hasta contrastarla", "problema": "El informe reconoce que Naturale y FIFU ya comercializan sachets y que la combinación de tres sabores mixtos, dosis para 500 ml y retiro agrupado «todavía no demuestra exclusividad». Los concentrados y refrescos están cerca de la categoría de baja innovación del Anexo 2 de los lineamientos, por lo que se necesita una diferenciación comprobada, no solo planteada.", "mejora": "Elegir el atributo más fuerte y respaldarlo con datos del prototipo: prueba ciega frente a Zuko y Naturale, disposición a pagar, y un atributo más difícil de imitar (frutas regionales, venta institucional). Anotar el resultado en la AA2."}, {"severidad": "sugerencia", "titulo": "Redacción dirigida al evaluador y exceso de salvedades", "ubicacion": "Introducción; 2.2 (nota de la Tabla 4); Anexo", "cita": "El docente solicita más entrevistas reales para acreditar evidencia cualitativa.", "problema": "Algunas frases le hablan al docente y no al lector (en el anexo: «El docente solicita...»). Casi todos los párrafos repiten que algo es una hipótesis o que «no se afirma», lo que resta claridad sobre qué decidió el equipo.", "mejora": "Reunir las limitaciones en un párrafo y redactar el resto con decisiones claras; quitar las referencias directas al docente."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "BMC argumentado, competidores comparables por litro, ventaja competitiva, FODA e indicadores con ejemplo. Falta que el mapa de empatía tenga voz del cliente.", "observaciones": [{"severidad": "sugerencia", "titulo": "Completar el cuadrante «Dice y hace» del mapa de empatía", "ubicacion": "3.1, Tabla 8", "cita": "[Espacio para incorporar dos o tres frases literales de los entrevistados, con códigos E01–E10 y fecha.]", "problema": "El cuadrante «Dice y hace» conserva un texto de plantilla. Con hipótesis basta en la AA1, por lo que no afecta el nivel del criterio; conviene completarlo.", "mejora": "Completar el mapa con dos o tres frases hipotéticas del segmento por cuadrante clave, rotuladas como supuestos del grupo, y quitar el marcador."}, {"severidad": "sugerencia", "titulo": "BMC: canales y cafeterías con doble rol", "ubicacion": "3.2, Tabla 9; 2.5.6", "cita": "cafeterías: puntos de retiro o compradoras mayoristas, según contrato", "problema": "Las cafeterías aparecen como canal (Tabla 9) y como cliente secundario (2.5.6). La Figura 1 repite celdas combinadas que no se distinguen en la maquetación.", "mejora": "Precisar si la cafetería es canal o cliente y su rol en los ingresos; revisar el título y el formato de la Figura 1 según APA 7."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Carátula completa y todas las fuentes citadas. Quedan instrucciones de Word en el texto, un índice incompleto y referencias sin ordenar.", "observaciones": [{"severidad": "importante", "titulo": "Índice con instrucciones de Word y apartados faltantes", "ubicacion": "Índice", "cita": "Índice de consulta de esta versión. Los apartados utilizan estilos de título de Word; si se modifica el contenido, regenera la tabla de contenido desde Referencias → Tabla de contenido.", "problema": "Es una instrucción dirigida a quien edita, no al lector. El índice agrupa «2.3–2.4» (en el cuerpo son apartados separados), omite el 3.4.1 y el 1.3 figura con otro nombre; los números de página no se pueden contrastar con el cuerpo del DOCX.", "mejora": "Generar el índice automático, eliminar la nota y comprobar los números de página en el PDF final."}, {"severidad": "importante", "titulo": "Referencias fuera de orden y con entradas ambiguas", "ubicacion": "Referencias bibliográficas", "cita": "Tottus Perú. (s. f.). Bebida instantánea en polvo Zuko naranja... / Tottus Perú. (s. f.). Zuko: bebidas instantáneas...", "problema": "Las entradas de Procefrut Perú, OSIPTEL, OMS, Osterwalder y Pigneur, y Vivanda aparecen después de Wong y Tottus, sin orden alfabético. Dos entradas de Tottus Perú tienen el mismo autor y año sin a/b. Procefrut Perú se usa para D' Kampu; conviene decirlo en el texto. Los títulos de libros, informes y revistas deben ir en cursiva.", "mejora": "Ordenar alfabéticamente, diferenciar con s. f.-a y s. f.-b, aclarar la entrada de D' Kampu y revisar las cursivas."}, {"severidad": "sugerencia", "titulo": "Fecha y detalles de maquetación", "ubicacion": "Carátula; Figura 1", "cita": "Arequipa, Perú  ·  30 de octubre de 2026", "problema": "La fecha de la carátula no se actualizó respecto a la v2. Falta un espacio tras «Sección:» y la Figura 1 repite celdas combinadas.", "mejora": "Actualizar la fecha, revisar la maquetación y hacer una lectura final de erratas."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Encuesta de validación: retroalimentación de avance AA2", "resumen": "Avance AA2 (06/11/2026): retroalimentación formativa, sin calificación, elaborada a partir de las preguntas enviadas (no del formulario en línea). El formulario es breve y mide practicidad, sabores y disposición de pago, pero todavía no valida el modelo de negocio planteado en el informe (segmento, precio de S/ 1,00, kits, canales por WhatsApp y puntos de retiro, acceso a agua potable) y tiene errores de construcción que deben corregirse antes de aplicarlo: lista de sabores duplicada, marca escrita de tres maneras y opciones de respuesta incompletas. Se sugiere rehacerlo y definir, antes de aplicar, los criterios con que se considerará validado el modelo.", "observaciones": [{"severidad": "importante", "titulo": "No hay filtro del segmento declarado en el informe", "ubicacion": "Preguntas 1 a 4", "cita": "«¿En qué rango de edad te encuentras?» (18 a 25, 26 a 35, 36 a 45, más de 45)", "problema": "El segmento inicial son estudiantes y trabajadores de 18 a 45 años de Arequipa, de NSE B y C. El formulario no pregunta si la persona estudia o trabaja ni si vive en Arequipa, y acepta la opción «Más de 45 años» sin excluirla. Los resultados mezclarían personas fuera del segmento.", "mejora": "Agregar al inicio filtros de residencia en Arequipa, edad (18 a 45, con fin de la encuesta fuera de rango) y ocupación (estudia, trabaja o ambas)."}, {"severidad": "importante", "titulo": "La propuesta se evalúa sin haberla descrito", "ubicacion": "Preguntas 5 y 6", "cita": "«¿Qué tan atractiva te parece la propuesta FRÚTZUMMA?» / «¿Qué tan probable sería que probaras FRÚTZUMMA?»", "problema": "Las preguntas dan por conocida una propuesta que el encuestado no ha visto. Sin una descripción breve y una imagen del sachet, las respuestas no miden aceptación del producto. Además la marca aparece escrita como FRÚTZUMMA, FRÚTZUMA y Frutzuma.", "mejora": "Colocar antes de estas preguntas una descripción de tres líneas (concentrado en sachet de 60 ml que rinde unos 500 ml, sabores y forma de uso) con imagen, y unificar la escritura de la marca como FRÚTZUMA. Atractivo y probabilidad miden casi lo mismo: conservar una pregunta de intención de compra."}, {"severidad": "importante", "titulo": "La lista de sabores está duplicada", "ubicacion": "Pregunta 7", "cita": "«Maracuyá con mango / Fresa con sandía / Piña con Jamaica» (repetidos dos veces)", "problema": "Los tres sabores aparecen dos veces en la misma tabla de calificación, lo que genera confusión y datos duplicados.", "mejora": "Dejar los tres sabores una sola vez y agregar una pregunta abierta opcional: «¿Qué otro sabor te gustaría?»."}, {"severidad": "importante", "titulo": "Opciones de respuesta incompletas o mal agrupadas", "ubicacion": "Preguntas 2, 4 y 9", "cita": "«Nunca / Todos los días / 1 a 2 veces / 3 a 4 veces»; «Gaseosas o frugos»; «De S/ 1.00 a S/ 1.50 / De S/ 1.60 a S/ 2.00»", "problema": "En la pregunta 2 faltan «5 a 6 veces por semana» y «menos de 1 vez por semana», y las opciones están desordenadas. En la 4, «Gaseosas o frugos» mezcla dos categorías y faltan los concentrados que el propio informe identifica como competencia (Naturale, FIFU) y la opción «Otra». En la 9, los rangos dejan un vacío entre S/ 1,50 y S/ 1,60.", "mejora": "Reordenar y completar las frecuencias, separar las categorías de bebidas e incluir los concentrados y «Otra», y definir rangos continuos que incluyan el precio de referencia de S/ 1,00."}, {"severidad": "importante", "titulo": "No se valida el precio de referencia ni las presentaciones del informe", "ubicacion": "Pregunta 9; apartado 2.2.1", "cita": "«¿Cuánto estarías dispuesto(a) a pagar por un sachet individual de FRÚTZUMMA?»", "problema": "El informe propone S/ 1,00 por sachet, S/ 5,50 por kit de seis y S/ 10,50 por kit de doce. La pregunta no prueba S/ 1,00 de forma directa y no pregunta por los kits ni por la cantidad que compraría.", "mejora": "Agregar «¿Comprarías un sachet a S/ 1,00?» (sí, depende, no), una pregunta sobre la presentación preferida (unidad, kit de 6, kit de 12) y otra sobre cuántos sachets compraría por semana."}, {"severidad": "importante", "titulo": "Faltan preguntas sobre canal, compra y acceso a agua potable", "ubicacion": "Formulario completo; tabla de validaciones del informe", "cita": "«Encuesta de aceptación y acceso a agua potable» (informe)", "problema": "El informe plantea pedidos por WhatsApp, puntos de retiro y pedidos agrupados, y reconoce que el producto necesita agua potable para diluirse. El formulario no pregunta cómo preferiría comprar la persona, si pediría junto con compañeros ni si tiene acceso a agua potable fuera de casa.", "mejora": "Agregar preguntas sobre el canal preferido de compra (WhatsApp con retiro, delivery, bodega, universidad o trabajo), sobre pedir en grupo y sobre el acceso a agua potable."}, {"severidad": "sugerencia", "titulo": "Dos preguntas inducen la respuesta", "ubicacion": "Preguntas 3 y 8", "cita": "«¿Te falta tiempo para prepararte refrescos?» / «¿Qué tan práctico te parece que sea un sachet de 60 ml?»", "problema": "La primera sugiere la respuesta esperada y la segunda afirma la practicidad antes de preguntarla. Esto sesga los resultados hacia la hipótesis del grupo.", "mejora": "Reformular en términos neutrales: «¿Qué dificultades tienes para tomar bebidas de fruta durante el día?» (opciones, incluida «Ninguna») y «Un sachet de 60 ml prepara unos 500 ml. ¿Qué tan práctico sería para ti?» (escala de 1 a 5)."}, {"severidad": "importante", "titulo": "No se definen criterios para considerar validado el modelo", "ubicacion": "Informe, anexo «Validaciones pendientes»; cap. 5 (AA2)", "cita": "«Validaciones pendientes»", "problema": "Ni el informe ni el formulario establecen el tamaño de muestra, el método de muestreo ni los porcentajes mínimos con que se aceptará cada hipótesis. Sin ellos, el cap. 5 no podrá concluir con métricas ni justificar mejoras al MVP, que es lo que distingue el nivel más alto de la rúbrica.", "mejora": "Antes de aplicar la encuesta, escribir en el informe las hipótesis, la muestra y el criterio de validación de cada una (por ejemplo, «al menos 60 % califica 4 o 5 en interés»), y después analizar los resultados contra esos criterios y proponer ajustes al MVP."}], "puntuacion": {"criterios": [["Coherencia con los objetivos e hipótesis", 0.5], ["Cobertura del modelo de negocio (segmento, precio, canal)", 0.5], ["Cobertura de la funcionalidad del MVP", 0.5], ["Redacción y opciones de respuesta", 0.5], ["Utilidad para analizar y decidir", 0.5]], "nota": "El formulario es breve y mide practicidad, sabores y precio, pero aún no valida el modelo del informe y tiene errores de construcción. Con las preguntas sugeridas y criterios de validación escritos antes de aplicar, puede subir a cerca de 4."}, "preguntas": [{"pregunta": "¿Vives en Arequipa? ¿Estudias, trabajas o ambas? ¿Qué edad tienes?", "opciones": "Sí/No (fin); Estudio / Trabajo / Ambas; 18 a 25 / 26 a 35 / 36 a 45 (fuera de rango termina)", "mide": "Filtro del segmento: estudiantes y trabajadores de 18 a 45 años."}, {"pregunta": "(Después de una descripción con imagen) ¿Qué tan probable es que compres FRÚTZUMA?", "opciones": "Definitivamente no / Probablemente no / Tal vez / Probablemente sí / Definitivamente sí", "mide": "Intención de compra; reemplaza a «atractiva» y «probable de probar»."}, {"pregunta": "Califica cada sabor (una sola vez) y ¿qué otro sabor te gustaría?", "opciones": "1 a 5 por sabor + respuesta abierta opcional", "mide": "Aceptación de los tres sabores de lanzamiento."}, {"pregunta": "Un sachet de 60 ml prepara unos 500 ml. ¿Qué tan práctico sería para ti?", "opciones": "Escala de 1 a 5", "mide": "Practicidad, sin inducir la respuesta."}, {"pregunta": "¿Comprarías un sachet a S/ 1,00?", "opciones": "Sí / Depende / No", "mide": "Precio de referencia del informe."}, {"pregunta": "¿Qué presentación preferirías?", "opciones": "Sachet suelto (S/ 1,00) / Kit de 6 (S/ 5,50) / Kit de 12 (S/ 10,50) / Ninguna", "mide": "Validar las presentaciones y precios por kit."}, {"pregunta": "¿Cuántos sachets comprarías por semana?", "opciones": "1 a 2 / 3 a 5 / 6 a 10 / Más de 10", "mide": "Volumen para la proyección de ventas del cap. 6."}, {"pregunta": "¿Cómo preferirías comprarlo? ¿Pedirías junto con compañeros?", "opciones": "WhatsApp con retiro / Delivery / Bodega / Universidad o trabajo / Otra; Sí / Tal vez / No", "mide": "Canales del informe y pedido agrupado."}, {"pregunta": "Fuera de casa, ¿tienes acceso a agua potable para diluirlo?", "opciones": "Siempre / A veces / Casi nunca", "mide": "Condición de uso que el informe deja pendiente."}, {"pregunta": "¿Qué bebes con más frecuencia cuando estás fuera de casa?", "opciones": "Jugo envasado / Gaseosa / Refresco en polvo / Concentrado (Naturale, FIFU) / Agua / Otra", "mide": "Competencia real y sustitutos."}], "consejos": ["Para su caso: pregunten «¿cuándo fue la última vez que compraste una bebida fuera de casa y cuánto pagaste?» y, si es posible, dejen probar una muestra o muestren una foto del sachet antes de preguntar por el sabor y el precio.", "Pregunten por lo que la persona ya hizo, no por lo que haría. «¿Cuándo fue la última vez que…? ¿Qué hizo y cuánto pagó?» es más fiable que «¿Compraría…?», porque las intenciones se inflan por cortesía.", "Eviten preguntas que regalan la respuesta (sí/no sobre algo obviamente deseable). Usen escalas balanceadas, incluyan «No sé» y «Otro», y no describan la propuesta con adjetivos.", "Obliguen a elegir. Si todo es «importante», no se aprende nada: pidan ordenar, elegir las tres más importantes o decidir entre dos opciones que tengan un costo.", "Escriban antes de aplicar qué resultado confirmaría cada hipótesis y qué cambiarían en el MVP si no se cumple. Si ninguna respuesta cambiaría una decisión, esa pregunta sobra.", "Cuiden quién responde. Si contestan solo familiares y amigos, los resultados serán previsibles. Fijen cuotas por perfil, registren por dónde llegó cada respuesta y pidan que no sea solo gente conocida.", "Prueben el formulario con 5 personas del segmento antes de difundirlo: midan cuánto tardan, en qué preguntas dudan y qué opciones faltan. Corrijan y recién entonces apliquen.", "Busquen compromisos reales: dejar un WhatsApp para una prueba, reservar un cupo o pagar un adelanto simbólico. Es la señal más fuerte; comparen lo que dicen con lo que hacen.", "Muestren el producto antes de preguntar interés (imagen, prototipo o descripción neutral) y presenten precios concretos con un ejemplo, en vez de rangos muy amplios.", "Analicen por segmentos, no solo en total: crucen por edad, ocupación o perfil, informen porcentajes con el número de respuestas y busquen contradicciones entre preguntas.", "Combinen la encuesta con 5 a 8 entrevistas cortas: la encuesta dice cuántos, la entrevista explica por qué. Pocas preguntas abiertas, específicas y opcionales.", "Mantengan el formulario corto (5 a 6 minutos), con las preguntas fáciles primero y las sensibles al final, saltos condicionales para que nadie responda lo que no le corresponde y obligatorias solo las preguntas clave."]}], "calificacion": {"fuentes": 4, "problema": 3, "propuesta": 3, "modelo": 4, "responsabilidad": 3}}</script>

<div class="wrap">
  <nav class="toc" aria-label="Contenido">
    <div class="lbl">Contenido</div>
    <ol id="toc"></ol>
    <p class="progress" id="progress" style="margin-top:14px"></p>
  </nav>
  <main id="main"></main>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const isAA2 = s => /^AA2/.test(s.etiqueta || '');
const secAA2 = D.secciones.filter(isAA2);
const fortAA1 = (D.fortalezas || []).filter(f => !/^AA2:/.test(f));
const fortAA2 = (D.fortalezas || []).filter(f => /^AA2:/.test(f)).map(f => f.replace(/^AA2:\s*/, ''));
const priAA1 = (D.prioridades || []).filter(p => !/^AA2:/.test(p));
const priAA2 = (D.prioridades || []).filter(p => /^AA2:/.test(p)).map(p => p.replace(/^AA2:\s*/, ''));
const all = D.secciones.filter(s => !isAA2(s)).flatMap(s => s.observaciones.map(o => o.severidad));
const allAA2 = secAA2.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;
const countAA2 = sev => allAA2.filter(x => x === sev).length;
const hasAA2 = secAA2.length > 0 || fortAA2.length > 0 || priAA2.length > 0;
const tabbar = hasAA2 ? `<nav class="tabs" role="tablist" aria-label="Evidencias">
  <button class="tab on" role="tab" data-tab="aa1" aria-selected="true">Evidencia 1 (AA1)</button>
  <button class="tab" role="tab" data-tab="aa2" aria-selected="false">Evidencia 2 (AA2) <span class="n">${allAA2.length}</span></button>
</nav>` : '';

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += tabbar;
html += '<div id="tab-aa1" class="tabpane">';
html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${fortAA1.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA1.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>
    <div class="grade"><span class="big">${total}</span><span class="of">/ 20</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${priAA1.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

const fmt = n => Number(n).toLocaleString('es-PE', { maximumFractionDigits: 2 });
const renderSec = (s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    ${s.puntuacion ? `<div class="scorebox">
      <div class="eyebrow">Puntuación de referencia del formulario (formativa; no es la calificación de la evidencia)</div>
      <div class="grade"><span class="big">${fmt(s.puntuacion.criterios.reduce((a, c) => a + Number(c[1]), 0))}</span><span class="of">/ 5</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Dimensión</th><th class="num">Puntos</th></tr></thead>
        <tbody>${s.puntuacion.criterios.map(c => `<tr><td>${esc(c[0])}</td><td class="num">${fmt(c[1])} / 1</td></tr>`).join('')}</tbody>
      </table></div>
      ${s.puntuacion.nota ? `<p class="summary">${esc(s.puntuacion.nota)}</p>` : ''}
    </div>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
    ${s.preguntas?.length ? `<div><h3 style="margin-bottom:8px">Preguntas que podrían mejorar el formulario</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Pregunta sugerida</th><th>Opciones o escala</th><th>Para qué sirve</th></tr></thead>
        <tbody>${s.preguntas.map(q => `<tr><td>${esc(q.pregunta)}</td><td>${esc(q.opciones)}</td><td>${esc(q.mide)}</td></tr>`).join('')}</tbody>
      </table></div></div>` : ''}
    ${s.consejos?.length ? `<div><h3 style="margin-bottom:8px">Consejos para que los resultados no salgan vacíos ni previsibles</h3>
      <ul class="strength">${s.consejos.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
  </section>`;
};
D.secciones.forEach((s, si) => { if (!isAA2(s)) renderSec(s, si); });
html += '</div>';

if (hasAA2) {
  html += '<div id="tab-aa2" class="tabpane" hidden>';
  html += `<section class="block aa2" id="aa2">
    <div class="head"><div class="eyebrow">Evidencia 2 · avance en curso</div><h2>Evidencia 2 (AA2): retroalimentación de avance</h2></div>
    <p class="summary">Esta parte corresponde a la Evidencia 2 (capítulos 4, 5 y 6 y elevator pitch). Es retroalimentación formativa para que puedan mejorar mientras avanzan: todavía no es una calificación. Se irá actualizando en este mismo enlace.</p>
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
