<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

<script type="application/json" id="data">{"id": "grupo-1", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "Stockly: plataforma web de gestión de inventarios con catálogo y pedidos por WhatsApp para bodegas de Arequipa", "grupo": "1", "seccion": "No indicada", "fecha": "30/10/2026", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Solanch Coaquira Quispe", "Camila Mamani Nina", "Erick Acrota Huisa", "Jhon Hancco Yucra"], "dictamen": "mayor", "resumen": "El capítulo 1 tiene una base académica sólida: usa fuentes de investigación (CEPAL, PRODUCE, artículos indexados y tesis), las analiza con sentido crítico y declara los ODS 8 y 9. Sin embargo, no declara ninguna megatendencia y no tiene cifras sobre bodegas de Arequipa. El capítulo 2 está bien desarrollado en descripción, especificaciones, beneficios y segmentación, pero tiene apartados obligatorios vacíos: el precio en la ficha técnica (2.2.4) y los casos de uso (2.6), que todavía está resaltado en amarillo. En el capítulo 3, el Business Model Canvas solo desarrolla 4 de los 9 bloques y no se presenta el lienzo como figura. El análisis de competencia se limita a un solo competidor, orientado a restaurantes. En lo formal, faltan el contenido del índice, la sección y la carrera en la carátula, la numeración de tablas y figuras, y la corrección de varias referencias APA 7.", "fortalezas": ["El capítulo 1 se apoya en fuentes académicas y oficiales pertinentes (Dini et al., 2021, CEPAL; Shabani et al., 2021; Puican Rodríguez et al., 2025; PRODUCE, 2025) y las usa con sentido crítico, por ejemplo cuando aclaran que un estudio “no se realizó en bodegas peruanas” (p. 4).", "La segmentación de clientes (2.5, pp. 17-19) está trabajada con variables geográficas, demográficas, psicográficas y conductuales, y prioriza distritos concretos de Arequipa.", "El prototipo de pantallas (p. 15) muestra con claridad el flujo del bodeguero y del consumidor, desde el inventario hasta el pedido por WhatsApp.", "Los indicadores de gestión (3.4, pp. 25-26) tienen fórmula y frecuencia, y están vinculados a las funciones reales de la plataforma."], "prioridades": ["Completar los apartados vacíos: 2.6 Casos de uso (p. 19), 2.2.4 Precio y opciones de compra (p. 10) y los bloques e) a i) del BMC (p. 23). Además, insertar el lienzo del BMC como figura.", "Declarar y desarrollar una megatendencia con su fuente (por ejemplo, del informe de CEPLAN) y organizar el capítulo 1 en 1.1 Problema del cliente y 1.2 Problema social, cada uno con causas y consecuencias.", "Dimensionar el problema en Arequipa con cifras específicas sobre bodegas: cuántas hay, qué porcentaje lleva el control en cuaderno y cuánto pierden por mermas o quiebres de stock. Citar la fuente de cada cifra.", "Ampliar el análisis de competidores a 3 o más alternativas que usen realmente las bodegas, incluidas las gratuitas, en una tabla comparativa. Redactar 3.3.4 como la ventaja competitiva de Stockly, no la de PANCA.", "Unificar el segmento (bodegas, farmacias, librerías, ferreterías o tiendas de ropa) y el precio (S/ 85) en todos los capítulos, y sustentar con evidencia la “disposición de pago identificada”.", "Corregir el formato académico: generar el índice, completar la carátula, numerar tablas y figuras con título y fuente, redactar en forma impersonal y corregir la lista de referencias en APA 7."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, analizadas críticamente y vinculadas con megatendencias y ODS.", "falta": "Agregar a las referencias las fuentes citadas que no figuran (PRODUCE, 2025; Hidalgo Vergara y Xiao, 2022), eliminar el duplicado de Puican Rodríguez, completar los datos de la Asociación de Bodegueros y sumar una fuente oficial para la megatendencia y otra con cifras del sector bodeguero."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cualitativa y cuantitativa, con vínculo explícito a megatendencias, ODS y necesidades del cliente.", "falta": "Declarar la megatendencia, aportar cifras de bodegas de Arequipa (no solo de mypes en general) y separar el problema del cliente y el problema social, cada uno con causas y consecuencias."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Completar el precio (2.2.4) y los casos de uso (2.6) y demostrar el diferencial frente a herramientas gratuitas o de bajo costo que ya usan las bodegas."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumentan la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "Desarrollar los bloques de fuentes de ingreso, recursos, actividades, socios y costos; presentar el lienzo como figura; y basar el mapa de empatía en el segmento definido en 2.5, idealmente con entrevistas."}], "viabilidad": {"resumen": "Stockly responde a un dolor real de las bodegas de Arequipa, pero entra en un mercado con muchas herramientas digitales, varias de ellas gratuitas. Su viabilidad depende de que el bodeguero registre de verdad cada venta y de que pague S/ 85 al mes cuando tiene alternativas sin costo.", "riesgos": [{"tema": "Competencia", "titulo": "Alternativas gratuitas o ya instaladas en la bodega", "choque": "Muchas bodegas ya usan el catálogo gratuito de WhatsApp Business, apps de punto de venta con planes gratuitos o las aplicaciones de pedidos de distribuidores y fabricantes. Además, los sistemas POS que emiten comprobantes electrónicos ya incluyen inventario. Frente a estas opciones, el catálogo conectado al stock puede no bastar como diferencial.", "ideas": ["Probar durante una semana 3 o 4 herramientas que hoy usan las bodegas (POS gratuitos, catálogo de WhatsApp Business, apps de distribuidores) y anotar qué hacen y qué no hacen frente a Stockly.", "En la encuesta de la AA2, preguntar qué herramienta usan hoy, cuánto pagan y por qué la dejarían.", "Explorar una alianza con un distribuidor mayorista de Arequipa para que la reposición sugerida se convierta en un pedido directo al proveedor."]}, {"tema": "Adopción", "titulo": "El bodeguero no registra cada venta", "choque": "Si cada venta se registra a mano y la atención es rápida, el stock se desactualiza en pocos días. Así, las alertas y el catálogo pierden confiabilidad, que es justamente el problema que se busca resolver (“siempre que las operaciones se ingresen correctamente”, p. 9). El lector de códigos que mencionan en las pp. 5 y 26 no figura en la ficha técnica.", "ideas": ["Medir en una bodega piloto cuánto tiempo toma registrar las ventas de un día y cuántas quedan sin registrar.", "Evaluar la lectura de código de barras con la cámara del celular y la carga inicial de productos desde una base precargada de productos de consumo masivo."]}, {"tema": "Mercado", "titulo": "Disposición a pagar S/ 85 mensuales", "choque": "Para una bodega de NSE C o D, S/ 85 al mes (S/ 1 020 al año) es un gasto fijo relevante. El informe afirma una “disposición de pago identificada” sin mostrar de dónde sale.", "ideas": ["Validar en la encuesta de la AA2 el precio con preguntas de rango (por ejemplo, el método de Van Westendorp) y no con un sí o un no.", "Explorar un modelo freemium o un plan básico más barato, y cobrar aparte el catálogo con pedidos."]}, {"tema": "Costos", "titulo": "Costo de captar y acompañar a cada bodega", "choque": "El canal principal son las visitas presenciales en 6 distritos y la asesoría del primer mes. Si conseguir y capacitar a cada cliente cuesta varias mensualidades y los clientes abandonan pronto, el negocio no recupera la inversión.", "ideas": ["Estimar cuántas visitas hacen falta para cerrar una venta y cuántas horas de asesoría consume cada cliente.", "Considerar canales de bajo costo, como asociaciones de bodegueros, mercados mayoristas o referidos entre bodegueros."]}, {"tema": "Regulación", "titulo": "Datos personales y comprobantes", "choque": "El catálogo con pedidos recopila nombres y teléfonos de los consumidores, por lo que se aplica la Ley 29733 de Protección de Datos Personales. Además, las bodegas formales necesitan emitir comprobantes ante SUNAT, algo que sí ofrecen competidores como PANCA.", "ideas": ["Averiguar en la Autoridad Nacional de Protección de Datos Personales (MINJUSDH) las obligaciones de una plataforma que almacena datos de terceros.", "Decidir si Stockly integrará la emisión de comprobantes o se posicionará como complemento de un facturador ya existente."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "incompleto", "nota": "Faltan la sección, la carrera de cada integrante y el nombre del proyecto (Stockly). Además, el curso figura como “Proyecto innovador”."}, {"codigo": "—", "apartado": "Índice", "estado": "ausente", "nota": "La página 2 solo tiene el título “Índice”, sin contenido."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "incompleto", "nota": "Causas y consecuencias desarrolladas (pp. 4 y 6), pero sin subtítulo y sin cifras específicas de bodegas."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "incompleto", "nota": "Se declaran los ODS 8 (meta 8.3) y 9. No se declara ninguna megatendencia."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": ""}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "incompleto", "nota": "Tiene 7 de los 8 campos: 2.2.4 Precio y opciones de compra está vacío."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": ""}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": ""}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Bien segmentado, aunque el tipo de negocio no coincide con otros capítulos."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "ausente", "nota": "Solo está el título, resaltado en amarillo (p. 19)."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "incompleto", "nota": "Tiene los 6 cuadrantes, pero en texto genérico y con otro segmento (tiendas de ropa y accesorios)."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "incompleto", "nota": "Solo están desarrollados 4 de los 9 bloques y no se presenta el lienzo."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "incompleto", "nota": "Analiza un solo competidor (PANCA), orientado a gastronomía."}, {"codigo": "3.4", "apartado": "Indicadores de gestión", "estado": "completo", "nota": "Tienen fórmula, pero falta un ejemplo de cálculo."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Hay fuentes citadas que no figuran en la lista, un duplicado y entradas con formato incorrecto."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Problema bien argumentado y con buenas fuentes, pero sin megatendencia, sin cifras propias del sector bodeguero y sin la estructura 1.1 y 1.2.", "observaciones": [{"severidad": "critico", "titulo": "No se declara ninguna megatendencia", "ubicacion": "Capítulo 1, pp. 5-6", "cita": "Esta problemática está directamente relacionada con el ODS 8", "problema": "La rúbrica exige vincular el problema con megatendencias y ODS. Los ODS están, pero la transformación digital solo aparece de forma implícita (“no se adaptan a las nuevas tendencias”, p. 6). En ningún lugar se identifica como megatendencia ni se cita su fuente.", "mejora": "Identificar una megatendencia de un documento oficial (por ejemplo, el informe de megatendencias de CEPLAN), citarla en APA 7 y explicar en un párrafo cómo afecta a las bodegas y por qué hace pertinente el proyecto. Para el ODS 9, indicar también la meta específica, como ya hicieron con la meta 8.3."}, {"severidad": "importante", "titulo": "Faltan cifras del sector bodeguero en Arequipa", "ubicacion": "Capítulo 1, pp. 3 y 6", "cita": "Arequipa concentraba 136.988 MYPE formales", "problema": "Las cifras se refieren a mypes en general (mortalidad, cantidad por región), no a bodegas. No se sabe cuántas bodegas hay en Arequipa, qué proporción lleva el control en cuaderno ni cuánto pierden por mermas o desabastecimiento. Sin esas cifras, el problema del cliente queda dimensionado por analogía.", "mejora": "Buscar 2 o 3 datos específicos del canal tradicional en estudios de mercado (Ipsos, Kantar, CPI), en gremios de bodegueros o en INEI, con año y cita. Ejemplo de forma: “Según [institución] ([año]), en Arequipa existen X bodegas, de las cuales el X %…”."}, {"severidad": "importante", "titulo": "El capítulo no separa problema del cliente y problema social", "ubicacion": "Capítulo 1, pp. 3-6", "cita": "", "problema": "El capítulo es un texto continuo sin subtítulos. Las causas aparecen en dos lugares (p. 4 y p. 6) y las consecuencias sociales (p. 5) se mezclan con las económicas, lo que dificulta reconocer los dos problemas que exige la estructura del TAP.", "mejora": "Organizar el capítulo en 1.1 Problema del cliente (necesidades, causas y consecuencias) y 1.2 Problema social (ODS, megatendencia, causas y consecuencias). Un árbol de problemas como figura numerada puede ayudar a ordenar causas y efectos."}, {"severidad": "importante", "titulo": "La cita de la Asociación de Bodegueros no tiene sustento verificable", "ubicacion": "Capítulo 1, p. 5", "cita": "Andrés Choy, presidente de la Asociación de Bodegueros del Perú (ABP), señala que…", "problema": "Se atribuye una afirmación a una persona sin año, sin documento ni entrevista concreta. En la bibliografía solo figura una página web genérica (“/funciones/”).", "mejora": "Ubicar la declaración original (entrevista en un medio, nota de prensa o informe), con su fecha, y citarla en formato autor-año. Si no se encuentra, reemplazarla por una fuente que sí pueda verificarse."}, {"severidad": "sugerencia", "titulo": "Párrafo con cita mal formulada y redacción por corregir", "ubicacion": "Capítulo 1, p. 6", "cita": "Según el Ministerio de la Producción (2025). En el mundo de las Mypes hay un crecimiento en los pequeño negocios pero pocos de ellos logran prosperar por que no se adaptan…", "problema": "La cita queda como una oración suelta, hay errores de concordancia y ortografía (“pequeño negocios”, “por que”, “aqui”) y “Según Gómez Quispe, 2026.” no sigue el formato autor-año.", "mejora": "Reescribir el párrafo integrando la cita en la oración: “Según [Autor] ([año]), …” o “… ([Autor], [año])”. Revisar la ortografía de todo el capítulo."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "Descripción, especificaciones, beneficios y segmentación bien trabajados, pero faltan el precio y los casos de uso, y el segmento varía entre capítulos.", "observaciones": [{"severidad": "critico", "titulo": "Casos de uso vacíos", "ubicacion": "2.6, p. 19", "cita": "2.6. Ejemplo de casos de uso", "problema": "El apartado solo tiene el título, todavía resaltado en amarillo. La rúbrica pide casos de uso para llegar a Logrado o Sobresaliente.", "mejora": "Desarrollar 2 o 3 casos con una estructura fija: perfil del usuario, situación de partida, pasos que sigue en la plataforma (pueden apoyarse en las pantallas de la p. 15) y resultado esperado. Incluir al menos un caso del lado del consumidor que pide por el catálogo."}, {"severidad": "critico", "titulo": "Precio y opciones de compra sin desarrollar", "ubicacion": "2.2.4, p. 10", "cita": "", "problema": "La ficha técnica tiene 7 de sus 8 campos: el de precio está vacío. Sin embargo, el precio de S/ 85 aparece en 2.5.4 (p. 19) y en 3.3.5 (p. 25), y en el elevator pitch quedó “S/ soles al mes” (p. 27).", "mejora": "Completar 2.2.4 con el precio, la periodicidad, los medios de pago, si hay planes o periodo de prueba, y cómo se calculó el monto (por ejemplo, frente a los precios de la competencia y a la disposición de pago). Usar la misma cifra en todo el documento."}, {"severidad": "importante", "titulo": "El segmento cambia de un capítulo a otro", "ubicacion": "2.1, 2.5.2 y 3.1", "cita": "Dueños, gestores o responsables directos de farmacias independientes, minimarkets, tiendas de abarrotes, librerías, ferreterías y almacenes.", "problema": "El capítulo 1 y la descripción hablan de “pequeñas bodegas”; 2.5.2 agrega farmacias, librerías y ferreterías; y el mapa de empatía (p. 19) incluye “tiendas de ropa, tiendas de accesorios”. Cada uno tiene necesidades de inventario distintas (vencimientos, tallas, miles de códigos), así que la propuesta pierde foco.", "mejora": "Elegir un segmento inicial (por ejemplo, bodegas y tiendas de abarrotes) y mencionar los demás como expansión futura. Ajustar 2.5, 3.1 y el bloque de segmentos del BMC para que digan lo mismo."}, {"severidad": "importante", "titulo": "La disposición de pago se afirma sin evidencia", "ubicacion": "2.5.4 d), p. 19; 3.3.5, p. 25", "cita": "Muestran una alta disposición a adoptar herramientas digitales siempre que… representen un costo mensual accesible (S/ 85.00).", "problema": "No se indica de dónde sale esa conclusión (entrevistas, encuesta, fuente secundaria). En 3.3.5 se habla de “la disposición de pago identificada en el proyecto”, pero el informe no la muestra.", "mejora": "Si hicieron entrevistas, indicar cuántas, a quiénes y qué respondieron, y presentarlo en anexos. Si aún no las hacen, redactarlo como un supuesto que se validará en la AA2."}, {"severidad": "sugerencia", "titulo": "Funciones mencionadas que no están en la ficha técnica", "ubicacion": "Capítulo 1, p. 5; 2.2.2, pp. 8-9", "cita": "facilitar el registro de productos mediante un lector de códigos de barras", "problema": "El lector de códigos de barras (p. 5) y “escanear productos” (p. 26) no aparecen en las especificaciones técnicas ni en las funcionalidades, y es una función clave para la facilidad de uso.", "mejora": "Decidir si la función forma parte de la primera versión. Si es así, agregarla a 2.2.2 y 2.2.3 indicando cómo funcionará (cámara del celular o lector externo); si no, retirarla del capítulo 1."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "Hay mapa de empatía, competidor e indicadores, pero el BMC está a medias y el análisis de competencia es insuficiente.", "observaciones": [{"severidad": "critico", "titulo": "BMC incompleto: 5 de los 9 bloques están vacíos y falta el lienzo", "ubicacion": "3.2, pp. 21-23", "cita": "e) Fuentes de ingreso / f) Recursos clave / g) Actividades clave / h) Socios clave / i) Estructura de costos", "problema": "Solo se desarrollan los bloques de segmentos, propuesta de valor, canales y relación con clientes. Los bloques de ingresos, recursos, actividades, socios y costos solo tienen el título, y no se presenta el lienzo como figura. La rúbrica exige argumentar la coherencia entre los 9 bloques.", "mejora": "Insertar el lienzo completo como figura numerada (con título y fuente) y desarrollar un párrafo por bloque. En los costos pueden aprovechar la tabla de conceptos de la p. 11; en ingresos, el modelo de suscripción. Cerrar con un párrafo que explique cómo se conectan los bloques con la propuesta de valor."}, {"severidad": "critico", "titulo": "Un solo competidor y de otro rubro", "ubicacion": "3.3, pp. 23-25", "cita": "su oferta actual está principalmente orientada a restaurantes y negocios de comida", "problema": "Ustedes mismos reconocen que PANCA atiende a gastronomía, así que no es un competidor directo de bodegas. No se analizan las herramientas que hoy usan las bodegas (POS con plan gratuito, catálogo de WhatsApp Business, apps de distribuidores, el propio cuaderno o Excel). Sin esa comparación, el diferencial no está demostrado.", "mejora": "Identificar al menos 3 competidores directos o sustitutos para bodegas y compararlos en una tabla numerada con criterios como precio, inventario, catálogo, pedidos, facturación, soporte y facilidad de uso. Citar como fuente la web oficial de cada uno, con fecha de consulta."}, {"severidad": "importante", "titulo": "La “ventaja competitiva” describe la de PANCA, no la de Stockly", "ubicacion": "3.3.4, p. 24", "cita": "La principal ventaja competitiva de PANCA es que reúne diferentes herramientas…", "problema": "El apartado debe presentar la ventaja competitiva propia del proyecto. Así como está, refuerza al competidor y deja la ventaja de Stockly solo en 3.3.5.", "mejora": "Redactar 3.3.4 sobre Stockly: qué recurso o capacidad difícil de copiar tiene y por qué el cliente la valoraría frente a las alternativas. Responder: ¿qué hace Stockly que una herramienta gratuita no hace?, ¿por qué no lo copiaría fácilmente un competidor?"}, {"severidad": "importante", "titulo": "Mapa de empatía genérico y sin respaldo en el cliente real", "ubicacion": "3.1, pp. 19-21", "cita": "Le preocupa mantener su negocio funcionando y obtener ganancias.", "problema": "Los enunciados podrían aplicarse a cualquier emprendedor y no reflejan el perfil definido en 2.5 (por ejemplo, la desconfianza ante herramientas complejas o el uso de Yape y Plin). Tampoco se indica si se basan en entrevistas. Además, hay una viñeta vacía en la p. 21.", "mejora": "Presentar el mapa como figura con sus 6 cuadrantes y alimentarlo con frases reales de 3 a 5 bodegueros entrevistados. Indicar en la nota de la figura cuántas personas se entrevistaron y cuándo."}, {"severidad": "sugerencia", "titulo": "Los indicadores no tienen ejemplo de cálculo", "ubicacion": "3.4, pp. 25-26", "cita": "", "problema": "Las fórmulas están bien planteadas, pero no hay metas ni un ejemplo numérico, y todos los indicadores miden el uso del cliente. No hay ninguno sobre el negocio de Stockly (por ejemplo, adquisición de clientes o ingreso recurrente).", "mejora": "Agregar una columna de meta y un ejemplo de cálculo con datos supuestos, y sumar 1 o 2 indicadores del negocio, como costo de adquisición por cliente o ingreso mensual recurrente."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "El documento todavía no cumple el rigor formal de una tesina: tiene apartados vacíos, tablas sin numerar, referencias incompletas y redacción en primera persona.", "observaciones": [{"severidad": "importante", "titulo": "Índice vacío y carátula incompleta", "ubicacion": "Carátula (p. 1) e índice (p. 2)", "cita": "CURSO: Proyecto innovador", "problema": "El índice solo tiene el título. A la carátula le faltan la carrera, la sección, el título del proyecto y la carrera de cada integrante, y el nombre del curso no corresponde (la UD es Proyecto Integrador).", "mejora": "Generar el índice de forma automática desde los estilos de título y completar la carátula con institución, carrera, título del proyecto (Stockly), curso, sección, grupo, integrantes con su carrera y docente."}, {"severidad": "importante", "titulo": "Referencias incompletas, duplicadas y fuera de formato APA 7", "ubicacion": "Bibliografía, p. 28", "cita": "Gomez Quispe & Gerald Edwin (2026).", "problema": "Se citan en el texto PRODUCE (2025) e Hidalgo Vergara y Xiao (2022), pero no figuran en la lista. Puican Rodríguez et al. aparece dos veces, en formatos distintos. En Gómez Quispe, el nombre de pila figura como si fuera otro autor. La entrada de la Asociación de Bodegueros no tiene autor ni fecha. La lista no está en orden alfabético.", "mejora": "Verificar que cada cita del texto esté en la lista y que cada entrada de la lista se cite en el texto. Usar el formato “Apellido, A. A. (año). Título. Editorial o repositorio. URL”, ordenar alfabéticamente con sangría francesa y titular la sección “Referencias”."}, {"severidad": "importante", "titulo": "Tablas y figuras sin numeración, título ni fuente", "ubicacion": "pp. 8-9, 11, 15, 25-26", "cita": "", "problema": "La tabla de especificaciones, la de costos, el prototipo de pantallas y la tabla de indicadores no tienen número, título ni nota de fuente. La tabla de costos de la p. 11 aparece sin introducción dentro de “Proceso de fabricación”.", "mejora": "Aplicar APA 7: “Tabla N” o “Figura N” en negrita, título en cursiva arriba y debajo la nota “Fuente: Elaboración propia” o la cita que corresponda. Introducir cada tabla o figura en el texto antes de que aparezca."}, {"severidad": "sugerencia", "titulo": "Redacción en primera persona y afirmaciones no verificadas", "ubicacion": "pp. 5, 7, 21-22", "cita": "los efectos operativos que hemos comprobado", "problema": "Hay expresiones en primera persona (“nuestra propuesta”, “nuestro público objetivo”, “hemos comprobado”), y la última afirma una comprobación que el informe no muestra.", "mejora": "Redactar en forma impersonal (“se identifica”, “la propuesta”) y presentar como hipótesis lo que todavía no se ha validado."}, {"severidad": "sugerencia", "titulo": "Dato mal interpretado y espacios en blanco en el elevator pitch", "ubicacion": "4.2, pp. 26-27", "cita": "¿Sabías que el 55.4% de las MYPEs comerciales quiebran por fallas en su gestión?", "problema": "Según lo que ustedes mismos citan de PRODUCE (p. 3), el 55,4 % corresponde a empresas formales de todos los sectores que cesaron operaciones, no a mypes comerciales que quebraron por fallas de gestión. Además, el precio quedó en blanco (“S/ /mes”, “S/ soles”).", "mejora": "Usar el dato tal como lo reporta la fuente y completar el precio con la misma cifra de 2.2.4."}]}], "calificacion": {"fuentes": 2, "problema": 3, "propuesta": 2, "modelo": 2, "responsabilidad": 3}}</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const all = D.secciones.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${D.fortalezas?.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${D.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>
    <div class="grade"><span class="big">${total}</span><span class="of">/ 20</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${D.prioridades.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

D.secciones.forEach((s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
  </section>`;
});

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const toc = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => ['s' + i, s.titulo, s.observaciones.length]));
document.getElementById('toc').innerHTML = toc.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
