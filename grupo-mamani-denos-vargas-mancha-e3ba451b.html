<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-mamani-denos-vargas-mancha", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "RENACER: acompañamiento para el bienestar emocional y autoconocimiento de adultos de Arequipa", "grupo": "Grupo (sin número)", "seccion": "No indicada", "fecha": "30/10/2026 (2.ª versión)", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Gustavo Adolfo Mamani Chambilla", "Roxana Lisseth Denos Mamani", "Luz Mery Vargas Chumbes", "Esteyci Mancha Chumbes"], "dictamen": "mayor", "resumen": "Respecto a la primera versión, el avance es grande: ahora el informe tiene índice automático y los capítulos 2 y 3 completos, con ficha técnica (Tabla 1), proceso del servicio (Tabla 3), segmentación en cuatro enfoques, tres casos de uso, dos mapas de empatía, un BMC con sus 9 bloques explicados y un análisis de competidores de Arequipa. Además, en los capítulos 1 y 2 la ayahuasca pasa a ser solo un componente educativo. Sin embargo, el capítulo 3.3 vuelve a ubicarla en el centro del negocio: Mayahuasca «será un proveedor de ayahuasca para RENACER» y se habla de acompañar «antes, durante y después» del proceso, lo que contradice el capítulo 2 y el BMC. El mapa de empatía de varones (Imagen 3) pertenece a otro proyecto (caída del cabello y caspa). Desapareció la lista de referencias y siguen pendientes el problema del cliente con causas y consecuencias, las cifras de Arequipa, la fuente de las megatendencias, las líneas oficiales de CERTUS y los indicadores de gestión. El documento tiene unas 14 300 palabras (≈53 páginas) con muchas repeticiones, y la carátula conserva el título y el docente vacíos.", "fortalezas": ["Corrigieron lo más grave de la versión anterior: desarrollaron los capítulos 2 y 3 con todos sus apartados, entre ellos la ficha técnica (Tabla 1), el proceso de prestación del servicio con etapas y controles (Tabla 3), la segmentación geográfica, demográfica, psicográfica y conductual (2.5), tres casos de uso con personajes y recorrido (2.6) y el BMC con un apartado por bloque (3.2.1 a 3.2.9).", "Mejoraron la forma: agregaron un índice automático con títulos jerárquicos, eliminaron el marcador «CITA…..» y el párrafo duplicado, y numeraron y titularon las Tablas 1, 2 y 3.", "En los capítulos 1 y 2 replantearon la ayahuasca con prudencia, apoyándose en una revisión científica (Dos Santos & Hallak, 2024). En la Tabla 1 definieron incluso las «Afirmaciones permitidas» y las «Afirmaciones que deben evitarse», lo que demuestra criterio ético.", "El análisis de competidores usa establecimientos reales de Arequipa e incluye una «Nota metodológica» honesta sobre los límites de la información pública (3.3.5)."], "prioridades": ["Decidir de forma definitiva el rol de la ayahuasca y alinear todo el informe: si es solo educativa, retirar del 3.3 a Mayahuasca como proveedor y el acompañamiento «durante» el proceso; si no lo es, sustentar su legalidad con normas y fuentes en el capítulo 1 y en el BMC.", "Reemplazar el mapa de empatía de varones (Imagen 3), que corresponde a otro proyecto, y corregir el texto ilegible del BMC (Imagen 4). Lo ideal es construir ambos mapas a partir de entrevistas reales a personas del segmento.", "Volver a incluir la lista de referencias en APA 7 con todas las fuentes citadas (OMS 2023-2026, UNESCO 2022 y 2024, MINSA 2025, Naciones Unidas, Dos Santos & Hallak 2024 y las webs de los competidores), sustentar las megatendencias con CEPLAN y usar las líneas de investigación oficiales de CERTUS.", "Reestructurar el capítulo 1 en 1.1 problema del cliente y 1.2 problema social, cada uno con causas y consecuencias y con cifras de Arequipa y del segmento.", "Fijar un precio referencial o un rango, acotar el segmento a un grupo prioritario y agregar indicadores de gestión con fórmula y un ejemplo de cálculo.", "Completar la carátula, borrar los textos de trabajo y los restos de otro proyecto («SUMASAQ», «antes de la entrega final») y sintetizar el documento eliminando las repeticiones."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actuales y confiables, analizadas de forma crítica para mostrar qué aportan al proyecto en relación con las megatendencias y los ODS.", "falta": "El informe ya no tiene lista de referencias, de modo que ninguna cita se puede verificar. Las megatendencias se sustentan con documentos de la OMS o no tienen cita (1.2.3), en lugar de un estudio de tendencias como el de CEPLAN. Las líneas de investigación (1.3.1 a 1.3.4) no son las oficiales de CERTUS. Los competidores se citan con URL sueltas o con la frase «identificado en resultados públicos»."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cualitativa y cuantitativa, vinculada de forma explícita a megatendencias, ODS y necesidades del cliente.", "falta": "El problema se sigue formulando como «la necesidad de comprender» (1.4) y no como un dolor del cliente con causas y consecuencias. Las cifras siguen siendo nacionales, el único dato de Arequipa es el número de centros y no hay evidencia cualitativa propia, como entrevistas o testimonios."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Ya están todos los elementos. Falta fijar el precio y la duración, que figuran como «por definir»; acotar un segmento que hoy es «18 años a más» de cualquier nivel socioeconómico; aclarar quién brinda el «acompañamiento psicológico»; y demostrar el diferencial frente a un psicólogo particular, sin que el capítulo 3 lo cambie."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "El mapa de empatía de varones es de otro proyecto. El capítulo 3.3 introduce un proveedor de ayahuasca y un acompañamiento durante el proceso que no aparecen en el BMC ni en el capítulo 2. Los competidores directos elegidos no corresponden al servicio descrito y no hay indicadores de gestión con fórmula."}], "viabilidad": {"resumen": "Un servicio de bienestar emocional y talleres en Arequipa puede ser viable si se monta como un servicio profesional formal y con un precio validado. El mayor riesgo sigue siendo la ayahuasca: aunque los capítulos 1 y 2 la presentan solo como tema educativo, el capítulo 3.3 menciona un proveedor y un acompañamiento «durante» el proceso, y esa ambigüedad compromete la legalidad, la reputación y la posibilidad de sumar psicólogos colegiados.", "riesgos": [{"tema": "Regulación", "titulo": "Abastecimiento y acompañamiento del consumo de ayahuasca", "choque": "El principio activo de la ayahuasca (DMT) es una sustancia fiscalizada. Su declaratoria como Patrimonio Cultural de la Nación protege el uso tradicional de los pueblos amazónicos, no un servicio comercial urbano. Que RENACER compre ayahuasca a Mayahuasca o acompañe a sus clientes «durante» el proceso (3.3) podría interpretarse como facilitación del consumo, con consecuencias penales y sanitarias. Además, ningún psicólogo colegiado podría avalarlo dentro de su ejercicio profesional.", "ideas": ["Consultar a un abogado y revisar la normativa de DIGEMID y del Código Penal sobre sustancias fiscalizadas, y escribir la conclusión en el informe con su fuente.", "Si el componente se queda como educativo o de integración de experiencias que la persona ya vivió por su cuenta, eliminar la relación de proveedor y cualquier participación en ceremonias, y decirlo en el BMC (socios y actividades clave).", "Preguntar en la encuesta de la AA2 si la asociación con la ayahuasca atrae o aleja al cliente que busca bienestar emocional."]}, {"tema": "Regulación", "titulo": "Formalización como servicio de salud", "choque": "Si ofrecen «acompañamiento psicológico», este solo puede darlo un psicólogo colegiado y habilitado en el Colegio de Psicólogos del Perú (Ley del Trabajo del Psicólogo). Un local que atiende pacientes puede requerir registro como IPRESS ante la GERESA Arequipa y SUSALUD, además de licencia municipal, ITSE y cumplir la Ley N.º 29733 de protección de datos personales para las fichas de los usuarios.", "ideas": ["Averiguar en la GERESA Arequipa y en la municipalidad del distrito elegido qué trámites, costos y plazos aplican a un consultorio o centro de bienestar.", "Definir qué parte del servicio es educativa (talleres, que no requieren colegiatura) y qué parte es psicológica (sesiones, a cargo de un psicólogo colegiado), con su costo por hora.", "Evaluar empezar con talleres y una red de psicólogos independientes que facturan por sesión, antes de alquilar un local."]}, {"tema": "Competencia", "titulo": "Oferta gratuita y consultorios ya posicionados", "choque": "El cliente que busca bienestar emocional compara con los 15 Centros de Salud Mental Comunitaria gratuitos (dato que ustedes mismos citan), con EsSalud, con centros privados como los que mencionan en 3.3.5 y con plataformas de terapia en línea. Los centros de ceremonias del 3.3.1 compiten por otro público.", "ideas": ["Levantar el precio por sesión o por taller, la modalidad y el tiempo de espera de al menos 5 alternativas reales (incluidas las gratuitas y las en línea), visitando o llamando como cliente.", "Elegir un nicho desatendido (por ejemplo, talleres nocturnos para trabajadores jóvenes o programas para empresas) en lugar de competir como centro general."]}, {"tema": "Mercado", "titulo": "Precio y disposición a pagar sin definir", "choque": "Todo el modelo de ingresos (3.2.5) depende de un precio que todavía está «por definir». Sin un rango, no es posible saber si los talleres y paquetes cubren los honorarios de los profesionales.", "ideas": ["Validar en la encuesta de la AA2 cuánto pagan hoy por una sesión o un taller, con qué frecuencia y si prefieren un paquete o una suscripción.", "Explorar un canal B2B: programas de bienestar para empresas de Arequipa, que deben gestionar los riesgos psicosociales de sus trabajadores (Ley de Seguridad y Salud en el Trabajo)."]}, {"tema": "Adopción", "titulo": "Estigma y costo de captar clientes", "choque": "El temor a ser juzgado, que ustedes identifican como causa del problema, hace más lento y caro captar clientes, sobre todo para una marca nueva. Además, ser asociados con la ayahuasca puede generar desconfianza en parte del público.", "ideas": ["Usar talleres gratuitos o de bajo costo como puerta de entrada y medir cuántos asistentes pasan a un servicio pagado.", "Probar en la AA2 qué canal genera más confianza (recomendación, alianzas con universidades o empresas, redes sociales) y cuánto cuesta cada cliente captado."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula completa", "estado": "incompleto", "nota": "«TÍTULO DEL PROYECTO» y «DOCENTE» siguen vacíos; «CICLO: VIPERÚ – 2026» aparece pegado; faltan la unidad didáctica, la sección, el número de grupo y la carrera de cada integrante."}, {"codigo": "—", "apartado": "Índice", "estado": "completo", "nota": "Índice automático. Revisar la jerarquía: los títulos 2.2.7 a 2.2.9 y 3.3.7 tienen un nivel distinto al de sus pares."}, {"codigo": "1.1", "apartado": "Problema del cliente (necesidades, causas y consecuencias)", "estado": "incompleto", "nota": "No hay un apartado propio. Las causas (temor, estigma) se mencionan, pero no las consecuencias para el cliente."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "incompleto", "nota": "Los ODS 3 y 4 tienen metas. Las megatendencias no tienen una fuente de tendencias y las líneas de investigación no son las oficiales."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": ""}, {"codigo": "2.2", "apartado": "Ficha técnica (8 campos)", "estado": "incompleto", "nota": "Están los 8 campos, pero el precio, la duración y la frecuencia figuran «por definir» y la sostenibilidad no tiene ninguna consideración ambiental."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": ""}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": ""}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "incompleto", "nota": "Bien estructurado en cuatro enfoques, pero demasiado amplio: «18 años a más», ambos sexos y cualquier nivel socioeconómico."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": ""}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "incompleto", "nota": "El de mujeres (Imagen 2) es coherente. El de varones (Imagen 3) corresponde a otro proyecto (caída del cabello, caspa, productos capilares)."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "incompleto", "nota": "Los 9 bloques están explicados, pero hay texto ilegible en «Recursos clave» de la Imagen 4 y el BMC no recoge el proveedor ni el acompañamiento que se mencionan en 3.3."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "incompleto", "nota": "Desarrollado, pero los competidores directos no corresponden al servicio descrito, las debilidades no están verificadas y la tabla contradice al texto."}, {"codigo": "—", "apartado": "Indicadores de gestión", "estado": "ausente", "nota": "Se posterga explícitamente a «la siguiente etapa» (cierre del 3.2)."}, {"codigo": "—", "apartado": "Referencias APA 7", "estado": "ausente", "nota": "La versión anterior tenía una lista de referencias; esta versión no tiene ninguna."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Los ODS ya están bien desarrollados, pero el problema del cliente, las cifras de Arequipa, la fuente de las megatendencias y las líneas de investigación siguen igual que en la versión anterior.", "observaciones": [{"severidad": "critico", "titulo": "El problema sigue formulado como una necesidad de comprender, no como un problema del cliente", "ubicacion": "«Planteamiento del problema» (último párrafo) y 1.4 Definición del problema", "cita": "el problema central de RENACER se define como la necesidad de comprender cómo las personas adultas de Arequipa pueden fortalecer su bienestar emocional", "problema": "Persiste de la versión anterior: el problema se plantea como algo que el equipo necesita investigar y no como un dolor concreto del cliente. Tampoco hay apartados separados para el problema del cliente y el problema social, cada uno con sus causas y consecuencias, como pide la estructura del TAP. Hoy el 1.1 son los ODS y el 1.2 las megatendencias.", "mejora": "Reorganizar el capítulo así: 1.1 Problema del cliente (qué le pasa, por qué le pasa y qué le cuesta: tiempo, dinero, salud, relaciones o trabajo) y 1.2 Problema social (ODS y megatendencias). En cada uno, presentar las causas y las consecuencias en un esquema o una tabla (por ejemplo, un árbol de problemas). Formular el problema como una situación del cliente, no como una tarea del equipo."}, {"severidad": "critico", "titulo": "Siguen faltando cifras de Arequipa y evidencia cualitativa", "ubicacion": "«Planteamiento del problema», párrafos 2 y 3, y 1.1.1", "cita": "la región Arequipa contaba con 15 Centros de Salud Mental Comunitaria", "problema": "Persiste de la versión anterior: las cifras son nacionales (1 862 186 casos, MINSA, 2025) y el único dato de Arequipa es el número de centros, que no dimensiona cuántas personas tienen el problema. Además, esas mismas cifras se repiten en la introducción y en el 1.1.1. Tampoco hay evidencia cualitativa propia: los mapas de empatía no indican que se basen en entrevistas.", "mejora": "Buscar al menos 2 o 3 datos regionales o del segmento (GERESA Arequipa, INEI, encuestas del INSM «Honorio Delgado – Hideyo Noguchi», estudios de Ipsos o de universidades arequipeñas) con año y cita APA 7. Forma sugerida: «Según [institución] ([año]), el X % de los adultos de Arequipa…». Para la parte cualitativa, hacer 5 a 8 entrevistas breves a personas del segmento y resumir lo que dicen."}, {"severidad": "importante", "titulo": "Las megatendencias siguen sin una fuente de tendencias", "ubicacion": "1.2.1 a 1.2.4", "cita": "En los últimos años el autoconocimiento y el desarrollo personal han adquirido mayor importancia", "problema": "Persiste de la versión anterior, aunque ahora hay citas de la OMS en 1.2.1 y 1.2.2. Esos documentos tratan sobre salud mental y salud digital; no son estudios de megatendencias. El 1.2.3 no tiene ninguna cita y el 1.2.4 («Investigación responsable de la conciencia») no es una megatendencia reconocida, sino un tema del proyecto.", "mejora": "Sustentar cada megatendencia con un informe de tendencias reconocido, como el de CEPLAN (megatendencias y tendencias nacionales) u otro equivalente, citando el nombre exacto de la tendencia. Quedarse con 2 o 3 megatendencias bien sustentadas en lugar de cuatro sin fuente."}, {"severidad": "importante", "titulo": "Las líneas de investigación no son las oficiales de CERTUS", "ubicacion": "1.3 Línea de investigación (1.3.1 a 1.3.4)", "cita": "1.3.3. Experiencias no ordinarias de conciencia y ayahuasca", "problema": "Persiste de la versión anterior: las cuatro líneas parecen redactadas por ustedes a partir de los temas del proyecto. La rúbrica pide vincular el proyecto con las líneas de investigación institucionales de CERTUS.", "mejora": "Pedir al docente o descargar el documento oficial de líneas de investigación de CERTUS, elegir la línea (y sublínea) que corresponda, citarla tal como figura y explicar en 3 o 4 líneas cómo se vincula con RENACER."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "El capítulo ya está completo y bien organizado. Falta concretar el precio, acotar el segmento y precisar quién presta el servicio psicológico.", "observaciones": [{"severidad": "importante", "titulo": "El precio, la duración y la frecuencia figuran «por definir»", "ubicacion": "2.2.2, Tabla 1 y 2.2.5 Precio y opciones de atención", "cita": "Precio referencial | Pendiente de validación mediante investigación de mercado", "problema": "La ficha técnica pide el precio y las opciones de compra. Sin un precio referencial no se puede evaluar si el segmento puede pagarlo ni si los ingresos del BMC cubren los honorarios. La validación de la AA2 sirve para ajustar un precio, no para fijarlo desde cero.", "mejora": "Proponer un precio o un rango para cada opción (sesión individual, taller grupal, paquete), sustentado en los precios de 3 a 5 competidores reales de Arequipa, y presentarlo en una tabla. Hacer lo mismo con la duración de cada sesión y la frecuencia sugerida."}, {"severidad": "importante", "titulo": "El segmento sigue siendo demasiado amplio", "ubicacion": "2.5.2 Segmentación demográfica y 2.5.3 (cuatro perfiles)", "cita": "personas adultas de 18 años a más", "problema": "Persiste de la versión anterior, aunque ahora con más detalle. El segmento incluye a ambos sexos, a cualquier ocupación, a cualquier nivel socioeconómico («personas con capacidad de acceder») y cuatro perfiles con necesidades distintas. Con un segmento así no se pueden diseñar el precio, el canal ni el mensaje.", "mejora": "Elegir un segmento prioritario con rango de edad, distritos, NSE y ocupación (los casos de uso sugieren jóvenes de 20 a 30 años, estudiantes y profesionales) y dejar los demás perfiles como segmentos secundarios. Estimar su tamaño con datos de INEI o APEIM."}, {"severidad": "importante", "titulo": "No queda claro quién brinda el «acompañamiento psicológico» ni qué lo diferencia de un psicólogo particular", "ubicacion": "2.1, Tabla 2 y 2.4 (último párrafo)", "cita": "manteniendo una clara diferenciación entre educación, acompañamiento y atención psicológica profesional", "problema": "El componente principal es el «acompañamiento psicológico» (Tabla 2), pero en 2.4 se dice que el servicio se diferencia de la atención psicológica profesional, y los recursos clave (3.2.6) hablan de «profesionales o especialistas». Además, el diferencial declarado en la ficha, la información sobre ayahuasca, es un contenido educativo que también se encuentra gratis en internet. No se demuestra por qué un cliente pagaría por RENACER y no por un psicólogo particular.", "mejora": "Precisar qué servicios brinda un psicólogo colegiado y cuáles son educativos (talleres, contenidos). Luego explicar el diferencial con criterios comparables frente a un consultorio convencional y frente a los centros gratuitos (precio, horario, formato, seguimiento, especialización), idealmente en una tabla."}, {"severidad": "sugerencia", "titulo": "La sostenibilidad no tiene ninguna consideración ambiental", "ubicacion": "2.2.9 Sostenibilidad y responsabilidad social", "cita": "RENACER busca generar un impacto positivo principalmente en el ámbito social", "problema": "La ficha técnica pide «sostenibilidad/consideraciones ambientales». El apartado solo trata el impacto social.", "mejora": "Agregar 2 o 3 medidas ambientales concretas propias de un servicio (por ejemplo, materiales digitales en lugar de impresos o criterios para elegir el local) y relacionarlas con un ODS si corresponde."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El capítulo existe y el BMC está explicado bloque por bloque, pero hay un mapa de empatía de otro proyecto, una contradicción sobre la ayahuasca y faltan los indicadores.", "observaciones": [{"severidad": "critico", "titulo": "El mapa de empatía de varones pertenece a otro proyecto", "ubicacion": "3.1, Imagen 3 (antes del 3.1.7)", "cita": "Alta preocupación por la caída del cabello y la caspa", "problema": "La figura del perfil masculino habla de «Publicidad de productos capilares», «Caída del cabello y caspa», «Producto efectivo y seguro» y «Preocupación por el impacto ambiental». Nada de eso corresponde a RENACER, y además contradice el texto de los apartados 3.1.7 a 3.1.12, que describe otro contenido.", "mejora": "Reemplazar la figura por un mapa de empatía elaborado a partir del texto del 3.1.7 al 3.1.12 y, de ser posible, de entrevistas a varones del segmento. Revisar todas las figuras antes de entregar."}, {"severidad": "critico", "titulo": "El capítulo 3.3 vuelve a poner la ayahuasca en el centro y contradice el capítulo 2 y el BMC", "ubicacion": "3.3 (introducción), 3.3.1 a) Mayahuasca y 3.3.4", "cita": "Mayahuasca también será un proveedor de ayahuasca para RENACER", "problema": "En los capítulos 1 y 2 la ayahuasca es solo un «componente educativo e informativo» (2.2.3). En el 3.3, en cambio, aparece un proveedor de ayahuasca, «la preparación previa, el acompañamiento durante el proceso y la integración posterior» y la «identificación de contraindicaciones», lo que describe un servicio que acompaña el consumo. Ni el BMC (socios y actividades clave) ni la ficha técnica recogen esto. El lector ya no sabe cuál es el negocio, y esa ambigüedad tiene implicancias legales (ver Viabilidad).", "mejora": "Decidir qué hace RENACER con la ayahuasca y escribirlo igual en todos los capítulos. Si es solo educativa, eliminar la relación de proveedor y el acompañamiento «durante» el proceso. Si se plantea otra cosa, sustentar su legalidad con normas y fuentes en el capítulo 1 y reflejarla en los 9 bloques del BMC."}, {"severidad": "importante", "titulo": "Los competidores directos no corresponden al servicio descrito y sus debilidades no están verificadas", "ubicacion": "3.3.1 a 3.3.3, tabla de 3.3.2 y 3.3.5", "cita": "No ofrece un seguimiento psicológico.", "problema": "Como competidores directos se eligieron centros de ceremonias, mientras que los centros de psicología (Cálide, Senses), que ofrecen lo mismo que el capítulo 2, quedan como indirectos. Tampoco se incluyen los Centros de Salud Mental Comunitaria ni las plataformas de terapia en línea. Además, las «debilidades» son dudas («el alcance de su seguimiento psicológico…») y la tabla afirma lo que el texto pide verificar. No hay precios ni fuentes citadas.", "mejora": "Definir los competidores directos según el servicio que realmente ofrecerán. Visitarlos o contactarlos como cliente y comparar en una tabla numerada criterios verificables: precio, modalidad, horario, profesionales, seguimiento y canal, citando la fuente de cada dato. Escribir las debilidades como hechos comprobados."}, {"severidad": "importante", "titulo": "Siguen faltando los indicadores de gestión", "ubicacion": "3.2 (párrafos de cierre)", "cita": "los indicadores financieros de RENACER deberán desarrollarse en la siguiente etapa", "problema": "Persiste de la versión anterior: la estructura del capítulo 3 pide indicadores de gestión con fórmula y ejemplo de cálculo, y el informe los posterga. La Tabla 3 ya menciona controles (registro de consultas, encuesta de satisfacción) que podrían convertirse en indicadores.", "mejora": "Presentar 4 a 6 KPI en una tabla con nombre, fórmula, meta y frecuencia. Por ejemplo, de forma: «Tasa de conversión = (clientes que pagan ÷ personas que consultan) × 100». Incluir indicadores de captación, de retención, de satisfacción y uno económico."}, {"severidad": "importante", "titulo": "El BMC tiene texto ilegible y no argumenta la coherencia entre bloques", "ubicacion": "3.2, Imagen 4 (bloque «Recursos clave») y 3.2.1 a 3.2.9", "cita": "Marcrso EnACEeros para la operación", "problema": "El bloque «Recursos clave» de la figura tiene una línea deformada e ilegible. Los apartados describen cada bloque, pero no explican cómo se conectan (por ejemplo, cómo el canal elegido llega al segmento o cómo el precio cubre la estructura de costos), que es lo que pide el nivel Sobresaliente. El segmento del BMC incluye cinco grupos distintos.", "mejora": "Corregir la figura y agregar un párrafo final que relacione los bloques entre sí: segmento → canal → relación → ingresos, y recursos y actividades → costos. Mantener en el BMC el mismo segmento prioritario que se defina en 2.5."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "El índice y las tablas numeradas son un avance, pero faltan las referencias, la carátula sigue incompleta y hay textos de trabajo y repeticiones que alargan el documento.", "observaciones": [{"severidad": "critico", "titulo": "No hay lista de referencias", "ubicacion": "Final del documento (después de 3.3.8)", "cita": "", "problema": "El documento termina en el 3.3.8 sin sección de referencias, a pesar de que cita a la OMS (2023, 2024, 2025, 2026), la UNESCO (2022, 2024), el MINSA (2025), las Naciones Unidas (s. f.) y a Dos Santos y Hallak (2024). Los competidores aparecen como URL sueltas («Referencia pública: https://…»). La versión anterior sí tenía referencias, aunque incompletas.", "mejora": "Agregar la sección «Referencias» en APA 7, en orden alfabético y con sangría francesa, con una entrada por cada cita (cada año de la OMS es un documento distinto), incluidas las páginas web de los competidores. Verificar que cada cita del texto esté en la lista y viceversa."}, {"severidad": "importante", "titulo": "La carátula sigue incompleta", "ubicacion": "Carátula", "cita": "CICLO: VIPERÚ – 2026", "problema": "Persiste de la versión anterior: «TÍTULO DEL PROYECTO» y «DOCENTE» siguen vacíos. «CICLO: VI» quedó pegado a «PERÚ – 2026». Faltan la unidad didáctica (Proyecto Integrador), la sección, el número de grupo y la carrera de cada integrante. Además, el nombre de una integrante figura como «ESTEYCI», mientras que en la versión anterior decía «STEICY».", "mejora": "Completar todos los campos, separar «CICLO: VI» de «PERÚ – 2026» y confirmar la escritura correcta de cada nombre según el DNI."}, {"severidad": "importante", "titulo": "Quedan textos de trabajo y restos de otro proyecto", "ubicacion": "3.2.9, 3.3 (introducción), tabla de 3.3.2 y 3.3.5.3 a 3.3.5.8", "cita": "A diferencia de un producto físico como SUMASAQ", "problema": "Hay frases que no deberían estar en un informe final: la mención a «SUMASAQ», que es otro proyecto; «identificados a partir de la información proporcionada por el equipo»; «según la información del equipo»; «verificar directamente su oferta actual antes de la entrega final»; y «confirmar ubicación y servicios actuales». Parecen notas internas o instrucciones de una herramienta de redacción y restan credibilidad.", "mejora": "Hacer una lectura final buscando estas frases, verificar los datos pendientes y eliminar las notas. Si una afirmación no se pudo verificar, decidir si se mantiene con su fuente o se retira."}, {"severidad": "importante", "titulo": "El documento es muy extenso y repetitivo", "ubicacion": "Todo el documento (≈14 300 palabras, 53 páginas según el índice)", "cita": "no presenta la ayahuasca como una cura, tratamiento garantizado o sustituto de la atención psicológica profesional", "problema": "La aclaración de que la ayahuasca no es un tratamiento se repite más de diez veces y la palabra «responsable» aparece 88 veces. La lista del 2.2.2 duplica la Tabla 1; el 3.3.4 y el 3.3.8 desarrollan la misma ventaja competitiva; el texto del mapa de empatía repite lo que ya dice la figura, y varios «Resumen e interpretación» son genéricos. El exceso de texto oculta los datos importantes.", "mejora": "Dejar la aclaración ética en un solo lugar (por ejemplo, la Tabla 1 o el 2.2.3) y remitir a ella. Eliminar el 2.2.2 o la Tabla 1, unir el 3.3.4 con el 3.3.8 y reducir el texto del mapa de empatía a una interpretación breve. Usar el espacio ganado para lo que falta: cifras, precios y KPI."}, {"severidad": "sugerencia", "titulo": "Figuras sin número ni fuente y detalles de numeración y redacción", "ubicacion": "Imágenes 2, 3 y 4; tablas de 3.3.2 y 3.3.7; títulos de capítulo", "cita": "3.1Mapa de Empatía", "problema": "Los mapas de empatía y el BMC no tienen «Figura N», título ni nota de fuente. Las tablas de 3.3.2 y 3.3.7 no tienen número ni título, y las Tablas 1 a 3 no tienen nota de fuente. Los capítulos no dicen «Capítulo I/II/III» y usan mayúsculas distintas. Hay errores como «3.1Mapa» y «Objetivos de Desarrollos Sostenible», y frases en primera persona («nuestra propuesta», «nuestros aliados»).", "mejora": "Aplicar el formato APA 7: «Figura N» o «Tabla N» en negrita, título en cursiva arriba y «Nota. Elaboración propia» (o la fuente) debajo. Unificar los títulos de capítulo, corregir la ortografía y redactar en forma impersonal («la propuesta de valor», «los aliados estratégicos»)."}]}], "calificacion": {"fuentes": 2, "problema": 2, "propuesta": 3, "modelo": 2, "responsabilidad": 3}}</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const all = D.secciones.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${D.fortalezas?.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${D.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>
    <div class="grade"><span class="big">${total}</span><span class="of">/ 20</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${D.prioridades.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

D.secciones.forEach((s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
  </section>`;
});

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const toc = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => ['s' + i, s.titulo, s.observaciones.length]));
document.getElementById('toc').innerHTML = toc.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
