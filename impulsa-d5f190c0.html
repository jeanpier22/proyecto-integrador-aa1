<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }

.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.scorebox { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

as ventas y el tiempo disponible entre clientes.", "Probar en el piloto un registro por totales al cierre del día frente al registro venta por venta, y comparar cuál se mantiene.", "Medir en un piloto de 7 a 14 días el porcentaje de días con registro completo, además del uso recurrente que ya definieron."]}, {"tema": "Regulación", "titulo": "Datos personales y nombre comercial", "choque": "La app guardará datos económicos del negocio y, con los cobros pendientes, datos de los clientes del bodeguero; eso los obliga a cumplir la Ley 29733 de Protección de Datos Personales, que ustedes mencionan sin precisar (p. 27). Además, «Impulsa» es un nombre común que puede estar registrado ante INDECOPI.", "ideas": ["Buscar el nombre en la base de marcas de INDECOPI antes de seguir invirtiendo en la identidad visual.", "Revisar qué exige la Ley 29733 a una app que almacena datos de terceros y preparar términos de uso y política de privacidad.", "Aclarar que Impulsa no emite comprobantes electrónicos de SUNAT, para no generar falsas expectativas frente a Alegra o Clarito."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "incompleto", "nota": "Figuran los nombres completos de los integrantes, pero el tema es «Estrategia de medios digitales» (incorrecto) y faltan el título del proyecto, la carrera, la sección y el grupo; el docente sigue como «JEAN PIERRE»."}, {"codigo": "—", "apartado": "Índice", "estado": "completo", "nota": "En la p. 2; algunos números de página no coinciden con el PDF final (por ejemplo, las metas 8.2 y 8.3 figuran en la p. 9 y están en la p. 8)."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "completo", "nota": "Con dimensionamiento (Tabla 1) y causas y consecuencias (Tabla 2), pp. 3-6."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "ODS 8 (metas 8.2 y 8.3), megatendencia de CEPLAN y Tabla 3 (pp. 6-9). Las consecuencias no tienen ninguna cifra que las respalde."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Con dos atributos diferenciadores y la Tabla 4 (pp. 10-12); el diferencial sigue sin demostrarse y Clarito no está en la comparación."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Los 8 campos en la Tabla 5 (pp. 12-13), con precio referencial sustentado en la Tabla 6."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "incompleto", "nota": "Sin apartado propio; los beneficios están dispersos en 2.1.1."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "incompleto", "nota": "Está en 1.3 «Solución propuesta» (pp. 9-10), fuera del capítulo 2."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "incompleto", "nota": "Sin apartado propio. El capítulo 3 cita «los distritos definidos en el capítulo 2» (pp. 17 y 19), pero esos distritos no se definen."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "incompleto", "nota": "Están en 3.6 (pp. 28-29) como tabla funcional; deben ir en el capítulo 2."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Tabla 11 y Figura 2 (pp. 16-17), declarado como hipótesis; es aceptable en la AA1."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Tabla 12 y argumentación de cada bloque en 3.2.1 (pp. 18-20)."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Tabla 13 con precio, fortalezas y debilidades, ventaja competitiva y estrategia de diferenciación (pp. 21-22)."}, {"codigo": "—", "apartado": "Indicadores de gestión", "estado": "completo", "nota": "Tablas 14 y 15 con fórmula, ejemplo y meta (pp. 23-24); las metas comerciales no están sustentadas."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Titulada «Referencias Bibliográficas:», sin sangría francesa, con referencias no citadas y citas sin su entrada exacta."}, {"codigo": "3.5", "apartado": "Análisis interno y externo", "estado": "completo", "nota": "Tablas 16 y 17 con datos de OSIPTEL, BCRP y PRODUCE (pp. 26-28); se declara a la competencia digital como amenaza. Aporta un análisis que los lineamientos piden."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "El capítulo ya tiene la estructura y los vínculos que se pedían; lo pendiente es respaldar con datos el problema social.", "observaciones": [{"severidad": "sugerencia", "titulo": "Validación con cliente real: se exigirá en el capítulo 5", "ubicacion": "1.1.1, pp. 4-5", "cita": "Los resultados deberán incorporarse una vez aplicados los instrumentos", "problema": "Las hipótesis sobre el comportamiento del bodeguero están rotuladas como tales y son aceptables en la AA1. No se penaliza.", "mejora": "Tener presente que la validación real con clientes (entrevistas o encuestas) se exigirá en el capítulo 5 (AA2). Mientras tanto, usar Chambe Torres y Velásquez Arana (2025), que ya está en su lista y estudia cómo los pequeños empresarios usan la información financiera; hoy solo se apoyan en Gómez Quispe (2026), que trata de inventarios, no de rentabilidad."}, {"severidad": "importante", "titulo": "Problema social sin ninguna cifra", "ubicacion": "1.2 y Tabla 3, pp. 6-7", "cita": "no se dispone todavía de evidencia suficiente para afirmar", "problema": "Todas las consecuencias sociales se presentan como «potenciales» y ninguna se apoya en un dato. Así, el problema social queda como una suposición, aunque existen estadísticas oficiales sobre el tema.", "mejora": "Respaldar al menos dos consecuencias con cifras oficiales: por ejemplo, el uso de herramientas TIC en las empresas (el informe del INEI que ya tienen en sus referencias y no citan), la tasa de supervivencia o de bajas de empresas, o la informalidad de las MYPE según PRODUCE. Esqueleto: «Según [institución] ([año]), el X % de las [unidad]…, lo que se relaciona con…»."}, {"severidad": "sugerencia", "titulo": "Título del capítulo y apartado 1.3 fuera de la estructura", "ubicacion": "pp. 3 y 9-10", "cita": "CAPÍTULO 1: NECESIDADES Y PROBLEMAS DEL CLIENTE", "problema": "La estructura oficial titula el capítulo «Planteamiento del problema» y solo tiene 1.1 y 1.2. El apartado 1.3 «Solución propuesta» adelanta contenido que corresponde al capítulo 2.", "mejora": "Rotular «Capítulo 1. Planteamiento del problema» y trasladar el contenido de 1.3 al apartado 2.4 (ver Capítulo II)."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "La descripción, los atributos diferenciadores, la ficha técnica y el precio están bien trabajados; faltan demostrar el diferencial, los apartados 2.3 a 2.6 y un segmento concreto.", "observaciones": [{"severidad": "critico", "titulo": "Diferencial sin demostrar y Clarito fuera de la comparación", "ubicacion": "2.1.1 y Tablas 4 y 6, pp. 11-14", "cita": "esta ventaja es todavía una hipótesis de valor", "problema": "Persiste de las versiones anteriores (sin cambios en la entrega del 04/11): el diferencial no está sustentado, aunque ahora está mucho mejor definido (dos atributos concretos). Las apps de gestión en mercados saturados están entre los productos de baja innovación de los lineamientos. En la Tabla 4 casi todas las celdas de los competidores dicen «No verificado», y Clarito, que ustedes describen en la p. 21 como un sistema para bodegas peruanas con fiados, cierre de caja y reportes de ganancias, no aparece ni en la Tabla 4 ni en la Tabla 6.", "mejora": "Incluir Clarito en ambas tablas. Instalar las versiones gratuitas o de prueba y completar cada celda con lo que comprobaron (con fecha de consulta). Responder en 2.1.1: ¿qué hace el diagnóstico de Impulsa que el reporte de ganancias de Clarito no hace?, ¿por qué un bodeguero que ya usa Clarito o IUNCI cambiaría? Si las pruebas muestran que el atributo ya existe, buscar uno que no exista."}, {"severidad": "importante", "titulo": "Siguen faltando los apartados 2.3 a 2.6", "ubicacion": "Capítulo 2, pp. 10-15; 1.3 (pp. 9-10) y 3.6 (pp. 28-29)", "cita": "Complementan las situaciones desarrolladas en el capítulo 2", "problema": "Persiste de las versiones anteriores (sin cambios en la entrega del 04/11): el capítulo 2 solo tiene 2.1 y 2.2. La solución está en 1.3, los casos de uso en 3.6 y los beneficios dentro de 2.1.1. Además, 3.6 remite a «situaciones desarrolladas en el capítulo 2» que no existen.", "mejora": "Crear 2.3 Beneficios clave, 2.4 Solución a problemas o necesidades específicas (relacionando cada función con una causa de la Tabla 2), 2.5 Segmentos de clientes y 2.6 Casos de uso, y mover allí el contenido que ya tienen. En 2.6, además de la tabla funcional, describir 2 o 3 situaciones reales de un día en la bodega."}, {"severidad": "importante", "titulo": "Segmento general y distritos no definidos", "ubicacion": "1.3 (p. 9), BMC (p. 18), 3.1.1 (p. 17) y 3.2.1 (p. 19)", "cita": "los distritos definidos en el capítulo 2", "problema": "Persiste de las versiones anteriores (sin cambios en la entrega del 04/11): el segmento sigue siendo «propietarios de bodegas y pequeñas tiendas minoristas» sin variables ni tamaño. El capítulo 3 menciona dos veces unos distritos definidos en el capítulo 2, pero no se definen en ninguna parte.", "mejora": "En 2.5, definir el segmento con variables geográficas (qué distritos de Arequipa y por qué), demográficas (edad, tamaño del negocio) y conductuales (cómo registra hoy, si cobra con Yape o Plin), y estimar su tamaño a partir de las 27 091 bodegas que ya calcularon."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El capítulo está completo y argumentado; solo queda ubicar los casos de uso en el capítulo 2.", "observaciones": [{"severidad": "sugerencia", "titulo": "Casos de uso dentro del capítulo 3", "ubicacion": "3.6, pp. 28-29", "cita": "Complementan las situaciones desarrolladas en el capítulo 2", "problema": "Los casos de uso pertenecen al capítulo 2 (2.6). Ubicados en el capítulo 3, alargan el capítulo y rompen la estructura oficial.", "mejora": "Mover los casos de uso a 2.6."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Mejoró mucho (índice, tablas y figuras con título y nota, más fuentes oficiales), pero persisten la carátula incompleta y errores de citación.", "observaciones": [{"severidad": "critico", "titulo": "Carátula todavía incompleta", "ubicacion": "p. 1", "cita": "TEMA: Estrategia de medios digitales … PROFESOR: JEAN PIERRE", "problema": "Persiste de las versiones anteriores y aparece un error nuevo: el tema de la carátula cambió a «Estrategia de medios digitales», que no tiene relación con Impulsa ni con la unidad (en la versión del 30/10 decía «Modelo de negocio en el formato Business Model Canvas con propuesta de valor única»). Siguen sin figurar el título del proyecto, la carrera de los integrantes, la sección y el número de grupo, y el docente continúa como «JEAN PIERRE».", "mejora": "Rehacer la carátula con institución, carrera de cada integrante, título del proyecto (Impulsa: aplicación de control financiero e inventario para bodegas de Arequipa), curso, sección, grupo, integrantes y docente con nombre completo. Revisar que el archivo siga el formato «AA1_Sección_Informe del TAP_Grupo X»."}, {"severidad": "importante", "titulo": "Citas que no coinciden con las referencias", "ubicacion": "pp. 3-4, 10, 12, 26 y 30-31", "cita": "Loyverse POS (2026), IUNCI (2026) y Alegra POS (2026)", "problema": "Persiste de las versiones anteriores (sin cambios en la entrega del 04/11): en el texto se cita PRODUCE (2023) y «Observatorio PRODUCEmpresarial (s. f.)» (p. 10), pero la lista solo tiene la entrada «Ministerio de la Producción (s. f.)» sin ese año; Loyverse, IUNCI y Alegra se citan con 2026 y en la lista figuran sin fecha; el BCRP se cita sin año (p. 26) y hay dos entradas del BCRP, una sin citar (2024); «Gómez» lleva tilde en el texto y no en la lista; UNCTAD (2023) se cita como si se hubiera consultado directamente. A la inversa, Chambe Torres y Velásquez Arana, Buitrón Bernal (PressPerú) y el informe del INEI están en la lista pero no se citan. La referencia del INEI no tiene autor, está ordenada por título y termina en «?utm_source=».", "mejora": "Cotejar cita por cita con la lista. Usar «(UNCTAD, 2023, como se citó en PRODUCE, 2025)» para la cita secundaria. Citar o retirar las referencias no usadas, y preferir el estudio del INEI a la nota de PressPerú. Titular «Referencias», aplicar sangría francesa, quitar el fondo gris del texto pegado y ordenar alfabéticamente (la entrada del INEI debe ir por autor)."}, {"severidad": "importante", "titulo": "Numeración de tablas y nota de figura incompletas", "ubicacion": "pp. 14-16", "cita": "La compatibilidad con Android const", "problema": "La numeración salta de la Tabla 6 (p. 14) a la Tabla 11 (p. 16): no existen las Tablas 7 a 10. La nota de la Figura 1 está cortada a mitad de palabra. Además, los títulos de las tablas van en la misma línea que el número, mientras que las figuras sí siguen el formato APA 7.", "mejora": "Renumerar las tablas de forma correlativa (lo más seguro es usar la función de títulos de Word o Google Docs), completar la nota de la Figura 1 y aplicar a las tablas el mismo formato que a las figuras: «Tabla N» en negrita y, en la línea siguiente, el título en cursiva."}, {"severidad": "sugerencia", "titulo": "Salvedades en casi cada párrafo", "ubicacion": "Todo el documento", "cita": "sujeto a comprobación", "problema": "Persiste de las versiones anteriores (sin cambios en la entrega del 04/11) y se ha intensificado: casi cada párrafo termina con «deberá validarse», «posibles», «potenciales» o «no se afirma». Ser prudentes está bien, pero repetirlo en todos los apartados debilita la argumentación y alarga el texto.", "mejora": "Reunir las limitaciones en un solo apartado breve de alcance y validación (por ejemplo, al final del capítulo 1) y dejar el resto del texto afirmativo y sustentado con fuentes o con los resultados de las entrevistas."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Encuesta de validación: retroalimentación de avance AA2", "resumen": "Avance AA2 (06/11/2026): retroalimentación formativa, sin calificación, elaborada sobre la versión actualizada del formulario en línea «Impulsa: Encuesta sobre la gestión de bodegas» (15 preguntas en cuatro secciones). El grupo incorporó mejoras importantes: una sección de segmentación (relación con el negocio, distrito de Arequipa y tipo de celular), preguntas sobre las herramientas y limitaciones actuales, que incluyen Clarito, Yape y Plin, una sección con el prototipo y una tarea concreta, precios puntuales de S/ 10, S/ 15 y S/ 20, y una pregunta sobre qué tendría que ofrecer Impulsa para preferirla frente a lo que se usa hoy. Para cerrar la validación quedan por resolver: el prototipo como imagen no permite realizar la tarea, hay preguntas de opción única donde corresponde selección múltiple, los filtros no terminan la encuesta, el precio no tiene ramificación ni se pregunta qué funciones serían de pago, y faltan compromiso, canal y criterios de validación.", "observaciones": [{"severidad": "importante", "titulo": "La tarea del prototipo no puede realizarse con una imagen", "ubicacion": "Sección 3, pregunta 10", "cita": "«Intente registrar una venta de S/ 20 en efectivo y otra de S/ 15 mediante Yape. ¿Pudo completar ambas actividades?» (opción: «El prototipo no permite realizar estas actividades»)", "problema": "La tarea es una buena idea para medir usabilidad, pero la sección 3 muestra el prototipo como una imagen, con la que no se puede registrar nada. Quien responde elegirá casi siempre la última opción o contestará sin haberlo intentado, y el resultado no medirá la funcionalidad del MVP.", "mejora": "Reemplazar la imagen por un prototipo interactivo (por ejemplo, un enlace de Figma o Canva) o por un video corto de uso, o aplicar la tarea de manera presencial a 3 o 5 bodegueros observando dónde se detienen."}, {"severidad": "importante", "titulo": "Las preguntas 5 y 6 son de opción única, pero el encuestado puede tener varias respuestas", "ubicacion": "Sección 2, preguntas 5 y 6", "cita": "«¿Cómo administra actualmente la información económica de su negocio y qué herramientas utiliza?»", "problema": "La pregunta 5 combina dos preguntas en una (cómo administra y qué herramientas usa), y ofrece opciones que pueden coexistir (cuaderno, Yape o Plin, Clarito). Con opción única se pierde información y no se sabe, por ejemplo, cuántos usan Clarito además de un cuaderno. La pregunta 6 tiene el mismo problema con las limitaciones.", "mejora": "Convertir las preguntas 5 y 6 en selección múltiple («marque todas las que use») y separar la pregunta 5 en dos: qué herramientas usa y cómo registra sus ventas."}, {"severidad": "importante", "titulo": "Los filtros del segmento no excluyen a quien está fuera de él", "ubicacion": "Preguntas 1, 2 y 3", "cita": "«Otro.» / «Fuera de Arequipa.» / «No utilizo smartphone.»", "problema": "La encuesta ya identifica el rol, el distrito y el celular, lo que es un avance claro. Sin embargo, quien responde «Otro», vive fuera de Arequipa o no usa smartphone sigue contestando todo el formulario, y sus respuestas se mezclarían con las del segmento (bodegas de Arequipa con un celular donde instalar la aplicación).", "mejora": "Configurar que estas opciones terminen la encuesta o envíen a una sección final de agradecimiento, y verificar que la pregunta 1 distinga a quien decide sobre el negocio."}, {"severidad": "importante", "titulo": "La disposición de pago no tiene ramificación y falta definir qué es gratis y qué es de pago", "ubicacion": "Sección 4, preguntas 13 y 14", "cita": "«¿Cuánto estaría dispuesto/a a pagar mensualmente por funciones adicionales de Impulsa?»", "problema": "La pregunta 14 la responde también quien eligió «Un único pago» o «No utilizaría una aplicación de este tipo», y para el pago único no se pregunta ningún monto. Además, el modelo freemium del informe depende de qué funciones serán gratuitas y cuáles de pago, y el formulario no lo pregunta. Los precios de S/ 10, S/ 15 y S/ 20 son puntos aislados, por lo que no se conoce cuánto aceptaría quien rechaza S/ 10.", "mejora": "Hacer que la pregunta 14 aparezca solo si elige pago mensual o versión gratuita con adicionales, agregar una pregunta con las funciones del prototipo para marcar «gratis» o «de pago», y una opción de monto menor a S/ 10 o «No pagaría»."}, {"severidad": "importante", "titulo": "Falta una forma de medir el compromiso y el canal de captación", "ubicacion": "Pregunta 12; informe (canales)", "cita": "«Después de conocer el prototipo, ¿qué tan dispuesto/a estaría a utilizar Impulsa en su negocio?»", "problema": "La intención declarada no se acompaña de una acción. Tampoco se pregunta por qué medio prefiere informarse o recibir soporte, aunque el informe plantea Facebook, Instagram y WhatsApp como canales.", "mejora": "Agregar una pregunta opcional para dejar un WhatsApp y probar Impulsa dos semanas, y otra sobre el medio preferido para informarse y recibir ayuda."}, {"severidad": "importante", "titulo": "Todavía no hay criterios de validación ni muestra definidos", "ubicacion": "Informe (cap. 5, por presentar)", "cita": "—", "problema": "El informe aún no establece el tamaño de muestra, la forma de llegar a bodegueros ni el resultado mínimo que se aceptará como validación (por ejemplo, porcentaje que completa la tarea o que acepta el precio). Sin ellos, el análisis no podrá concluir con métricas ni proponer mejoras al MVP.", "mejora": "Antes de aplicar la encuesta, escribir las hipótesis, la muestra con cuota por distrito y el criterio de validación de cada una, y relacionar cada pregunta con la hipótesis que prueba."}, {"severidad": "sugerencia", "titulo": "Ajustes menores de diseño de preguntas", "ubicacion": "Preguntas 7, 8 y 15", "cita": "«¿Qué tan útil sería…?» (pregunta 7) / «Después de observar el prototipo, ¿qué tan útil…?» (pregunta 8)", "problema": "Usar la misma escala de utilidad antes y después del prototipo es una buena decisión porque permite medir el cambio, pero el informe debería decirlo y calcular esa diferencia. La pregunta 15 es de opción única, aunque varias mejoras pueden ser igualmente decisivas.", "mejora": "Indicar en el informe que las preguntas 7 y 8 se comparan, y en la pregunta 15 permitir elegir hasta dos opciones para conocer las prioridades."}, {"severidad": "sugerencia", "titulo": "Verificar obligatoriedad antes de difundir", "ubicacion": "Formulario en línea", "cita": "—", "problema": "Según la lectura del enlace, ninguna pregunta aparece como obligatoria, lo que podría dejar respuestas incompletas en las preguntas clave.", "mejora": "Marcar como obligatorias las preguntas de segmentación, de la tarea, de intención y de precio."}], "puntuacion": {"criterios": [["Coherencia con los objetivos e hipótesis", 0.75], ["Cobertura del modelo de negocio (segmento, precio, canal)", 0.75], ["Cobertura de la funcionalidad del MVP", 0.75], ["Redacción y opciones de respuesta", 0.75], ["Utilidad para analizar y decidir", 0.5]], "nota": "Subió de 2,75 a 3,5 respecto de la versión anterior gracias a la segmentación, la comparación con Clarito, la tarea del prototipo y los precios puntuales. Para acercarse a 5 falta un prototipo con el que se pueda hacer la tarea, ramificar el precio, medir compromiso y definir criterios de validación."}, "preguntas": [{"pregunta": "¿Qué herramientas usa hoy para llevar sus cuentas? (marque todas)", "opciones": "Cuaderno / Excel / Clarito / Otra aplicación / Yape o Plin / Memoria / No llevo registro", "mide": "Selección múltiple para saber qué combinación de herramientas usa."}, {"pregunta": "(Con un prototipo interactivo o un video) Registre una venta de S/ 20 en efectivo y una de S/ <div class="wrap">
  <nav class="toc" aria-label="Contenido">
    <div class="lbl">Contenido</div>

  <main id="main"></main>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const isAA2 = s => /^AA2/.test(s.etiqueta || '');
const secAA2 = D.secciones.filter(isAA2);
const fortAA1 = (D.fortalezas || []).filter(f => !/^AA2:/.test(f));
const fortAA2 = (D.fortalezas || []).filter(f => /^AA2:/.test(f)).map(f => f.replace(/^AA2:\s*/, ''));
const priAA1 = (D.prioridades || []).filter(p => !/^AA2:/.test(p));
const priAA2 = (D.prioridades || []).filter(p => /^AA2:/.test(p)).map(p => p.replace(/^AA2:\s*/, ''));
const all = D.secciones.filter(s => !isAA2(s)).flatMap(s => s.observaciones.map(o => o.severidad));
const allAA2 = secAA2.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;
const countAA2 = sev => allAA2.filter(x => x === sev).length;
const hasAA2 = secAA2.length > 0 || fortAA2.length > 0 || priAA2.length > 0;
const tabbar = hasAA2 ? `<nav class="tabs" role="tablist" aria-label="Evidencias">
  <button class="tab on" role="tab" data-tab="aa1" aria-selected="true">Evidencia 1 (AA1)</button>
  <button class="tab" role="tab" data-tab="aa2" aria-selected="false">Evidencia 2 (AA2) <span class="n">${allAA2.length}</span></button>
</nav>` : '';

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += tabbar;
html += '<div id="tab-aa1" class="tabpane">';
html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${fortAA1.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA1.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>

    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${priAA1.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

const fmt = n => Number(n).toLocaleString('es-PE', { maximumFractionDigits: 2 });
const renderSec = (s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    ${s.puntuacion ? `<div class="scorebox">
      <div class="eyebrow">Puntuación de referencia del formulario (formativa; no es la calificación de la evidencia)</div>
      <div class="grade"><span class="big">${fmt(s.puntuacion.criterios.reduce((a, c) => a + Number(c[1]), 0))}</span><span class="of">/ 5</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Dimensión</th><th class="num">Puntos</th></tr></thead>
        <tbody>${s.puntuacion.criterios.map(c => `<tr><td>${esc(c[0])}</td><td class="num">${fmt(c[1])} / 1</td></tr>`).join('')}</tbody>
      </table></div>
      ${s.puntuacion.nota ? `<p class="summary">${esc(s.puntuacion.nota)}</p>` : ''}
    </div>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {

      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">

        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
    ${s.preguntas?.length ? `<div><h3 style="margin-bottom:8px">Preguntas que podrían mejorar el formulario</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Pregunta sugerida</th><th>Opciones o escala</th><th>Para qué sirve</th></tr></thead>
        <tbody>${s.preguntas.map(q => `<tr><td>${esc(q.pregunta)}</td><td>${esc(q.opciones)}</td><td>${esc(q.mide)}</td></tr>`).join('')}</tbody>
      </table></div></div>` : ''}
    ${s.consejos?.length ? `<div><h3 style="margin-bottom:8px">Consejos para que los resultados no salgan vacíos ni previsibles</h3>
      <ul class="strength">${s.consejos.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
  </section>`;
};
D.secciones.forEach((s, si) => { if (!isAA2(s)) renderSec(s, si); });
html += '</div>';

if (hasAA2) {
  html += '<div id="tab-aa2" class="tabpane" hidden>';
  html += `<section class="block aa2" id="aa2">
    <div class="head"><div class="eyebrow">Evidencia 2 · avance en curso</div><h2>Evidencia 2 (AA2): retroalimentación de avance</h2></div>
    <p class="summary">Esta parte corresponde a la Evidencia 2 (capítulos 4, 5 y 6 y elevator pitch). Es retroalimentación formativa para que puedan mejorar mientras avanzan: todavía no es una calificación. Se irá actualizando en este mismo enlace.</p>

      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>

    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));

function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>
