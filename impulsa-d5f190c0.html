<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {

  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;

  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }

nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }

.tab:hover { color: var(--ink); background: var(--accent-soft); }

.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.scorebox { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }

.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

ubicar beneficios, solución, segmentos y casos de uso en 2.3 a 2.6; y definir el segmento con distritos, variables y tamaño."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "En lo esencial ya lo alcanzan: el mapa de empatía como hipótesis es válido en la AA1 y las metas comerciales y el precio son referenciales (se sustentan en el cap. 6, AA2). Solo falta ubicar los casos de uso en el capítulo 2."}], "viabilidad": {"resumen": "La necesidad es real y el modelo ya está bien pensado, pero Impulsa entra a un mercado donde una app peruana para bodegas (Clarito) ya vende reportes de ganancias, fiados y cierre de caja, y otras ofrecen planes gratuitos o de US$ 2 al mes. Antes de la AA2 deben comprobar si el bodeguero de Arequipa registraría cada venta, y si valora la explicación de su ganancia.", "riesgos": [{"tema": "Competencia", "titulo": "Clarito ya ofrece lo que Impulsa propone como diferencial", "choque": "Ustedes mismos reconocen que Clarito publicita reportes de ganancias, control de fiados y cierre de caja para bodegas peruanas (pp. 21-22), y que IUNCI funciona sin internet desde US$ 2 al mes. Si el diagnóstico en lenguaje cotidiano resulta ser solo un texto debajo de un reporte, el bodeguero no tendrá un motivo claro para elegir Impulsa.", "ideas": ["Usar Clarito, IUNCI y Loyverse durante una semana con datos de una bodega real y anotar dónde el bodeguero se equivoca o no entiende su ganancia.", "Explorar un diferencial más difícil de copiar: por ejemplo, alertas que expliquen por qué bajó la ganancia (producto, gasto o fiado concreto) o una conciliación diaria de efectivo, Yape y Plin contra lo vendido.", "Preguntar en la encuesta de la AA2 qué apps han probado, cuál dejaron y por qué."]}, {"tema": "Adopción", "titulo": "Registrar cada venta en el celular", "choque": "El cálculo de la ganancia depende de que el comerciante registre todas sus ventas, compras y gastos (p. 29: «los resultados dependen de la calidad, integridad y exactitud de los registros»). En una bodega con decenas de ventas pequeñas al día, atendida por una sola persona, ese registro suele abandonarse en pocas semanas.", "ideas": ["Observar 1 o 2 horas de atención en una bodega y contar las ventas y el tiempo disponible entre clientes.", "Probar en el piloto un registro por totales al cierre del día frente al registro venta por venta, y comparar cuál se mantiene.", "Medir en un piloto de 7 a 14 días el porcentaje de días con registro completo, además del uso recurrente que ya definieron."]}, {"tema": "Regulación", "titulo": "Datos personales y nombre comercial", "choque": "La app guardará datos económicos del negocio y, con los cobros pendientes, datos de los clientes del bodeguero; eso los obliga a cumplir la Ley 29733 de Protección de Datos Personales, que ustedes mencionan sin precisar (p. 27). Además, «Impulsa» es un nombre común que puede estar registrado ante INDECOPI.", "ideas": ["Buscar el nombre en la base de marcas de INDECOPI antes de seguir invirtiendo en la identidad visual.", "Revisar qué exige la Ley 29733 a una app que almacena datos de terceros y preparar términos de uso y política de privacidad.", "Aclarar que Impulsa no emite comprobantes electrónicos de SUNAT, para no generar falsas expectativas frente a Alegra o Clarito."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "incompleto", "nota": "Figuran los nombres completos de los integrantes, pero el tema es «Estrategia de medios digitales» (incorrecto) y faltan el título del proyecto, la carrera, la sección y el grupo; el docente sigue como «JEAN PIERRE»."}, {"codigo": "—", "apartado": "Índice", "estado": "completo", "nota": "En la p. 2; algunos números de página no coinciden con el PDF final (por ejemplo, las metas 8.2 y 8.3 figuran en la p. 9 y están en la p. 8)."}, {"codigo": "1.1", "apartado": "Problema del cliente (causas y consecuencias)", "estado": "completo", "nota": "Con dimensionamiento (Tabla 1) y causas y consecuencias (Tabla 2), pp. 3-6."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "ODS 8 (metas 8.2 y 8.3), megatendencia de CEPLAN y Tabla 3 (pp. 6-9). Las consecuencias no tienen ninguna cifra que las respalde."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Con dos atributos diferenciadores y la Tabla 4 (pp. 10-12); el diferencial sigue sin demostrarse y Clarito no está en la comparación."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Los 8 campos en la Tabla 5 (pp. 12-13), con precio referencial sustentado en la Tabla 6."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "incompleto", "nota": "Sin apartado propio; los beneficios están dispersos en 2.1.1."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "incompleto", "nota": "Está en 1.3 «Solución propuesta» (pp. 9-10), fuera del capítulo 2."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "incompleto", "nota": "Sin apartado propio. El capítulo 3 cita «los distritos definidos en el capítulo 2» (pp. 17 y 19), pero esos distritos no se definen."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "incompleto", "nota": "Están en 3.6 (pp. 28-29) como tabla funcional; deben ir en el capítulo 2."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Tabla 11 y Figura 2 (pp. 16-17), declarado como hipótesis; es aceptable en la AA1."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Tabla 12 y argumentación de cada bloque en 3.2.1 (pp. 18-20)."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Tabla 13 con precio, fortalezas y debilidades, ventaja competitiva y estrategia de diferenciación (pp. 21-22)."}, {"codigo": "—", "apartado": "Indicadores de gestión", "estado": "completo", "nota": "Tablas 14 y 15 con fórmula, ejemplo y meta (pp. 23-24); las metas comerciales no están sustentadas."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Titulada «Referencias Bibliográficas:», sin sangría francesa, con referencias no citadas y citas sin su entrada exacta."}, {"codigo": "3.5", "apartado": "Análisis interno y externo", "estado": "completo", "nota": "Tablas 16 y 17 con datos de OSIPTEL, BCRP y PRODUCE (pp. 26-28); se declara a la competencia digital como amenaza. Aporta un análisis que los lineamientos piden."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "El capítulo ya tiene la estructura y los vínculos que se pedían; lo pendiente es respaldar con datos el problema social.", "observaciones": [{"severidad": "sugerencia", "titulo": "Validación con cliente real: se exigirá en el capítulo 5", "ubicacion": "1.1.1, pp. 4-5", "cita": "Los resultados deberán incorporarse una vez aplicados los instrumentos", "problema": "Las hipótesis sobre el comportamiento del bodeguero están rotuladas como tales y son aceptables en la AA1. No se penaliza.", "mejora": "Tener presente que la validación real con clientes (entrevistas o encuestas) se exigirá en el capítulo 5 (AA2). Mientras tanto, usar Chambe Torres y Velásquez Arana (2025), que ya está en su lista y estudia cómo los pequeños empresarios usan la información financiera; hoy solo se apoyan en Gómez Quispe (2026), que trata de inventarios, no de rentabilidad."}, {"severidad": "importante", "titulo": "Problema social sin ninguna cifra", "ubicacion": "1.2 y Tabla 3, pp. 6-7", "cita": "no se dispone todavía de evidencia suficiente para afirmar", "problema": "Todas las consecuencias sociales se presentan como «potenciales» y ninguna se apoya en un dato. Así, el problema social queda como una suposición, aunque existen estadísticas oficiales sobre el tema.", "mejora": "Respaldar al menos dos consecuencias con cifras oficiales: por ejemplo, el uso de herramientas TIC en las empresas (el informe del INEI que ya tienen en sus referencias y no citan), la tasa de supervivencia o de bajas de empresas, o la informalidad de las MYPE según PRODUCE. Esqueleto: «Según [institución] ([año]), el X % de las [unidad]…, lo que se relaciona con…»."}, {"severidad": "sugerencia", "titulo": "Título del capítulo y apartado 1.3 fuera de la estructura", "ubicacion": "pp. 3 y 9-10", "cita": "CAPÍTULO 1: NECESIDADES Y PROBLEMAS DEL CLIENTE", "problema": "La estructura oficial titula el capítulo «Planteamiento del problema» y solo tiene 1.1 y 1.2. El apartado 1.3 «Solución propuesta» adelanta contenido que corresponde al capítulo 2.", "mejora": "Rotular «Capítulo 1. Planteamiento del problema» y trasladar el contenido de 1.3 al apartado 2.4 (ver Capítulo II)."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "La descripción, los atributos diferenciadores, la ficha técnica y el precio están bien trabajados; faltan demostrar el diferencial, los apartados 2.3 a 2.6 y un segmento concreto.", "observaciones": [{"severidad": "critico", "titulo": "Diferencial sin demostrar y Clarito fuera de la comparación", "ubicacion": "2.1.1 y Tablas 4 y 6, pp. 11-14", "cita": "esta ventaja es todavía una hipótesis de valor", "problema": "Persiste de las versiones anteriores (sin cambios en la entrega del 04/11): el diferencial no está sustentado, aunque ahora está mucho mejor definido (dos atributos concretos). Las apps de gestión en mercados saturados están entre los productos de baja innovación de los lineamientos. En la Tabla 4 casi todas las celdas de los competidores dicen «No verificado», y Clarito, que ustedes describen en la p. 21 como un sistema para bodegas peruanas con fiados, cierre de caja y reportes de ganancias, no aparece ni en la Tabla 4 ni en la Tabla 6.", "mejora": "Incluir Clarito en ambas tablas. Instalar las versiones gratuitas o de prueba y completar cada celda con lo que comprobaron (con fecha de consulta). Responder en 2.1.1: ¿qué hace el diagnóstico de Impulsa que el reporte de ganancias de Clarito no hace?, ¿por qué un bodeguero que ya usa Clarito o IUNCI cambiaría? Si las pruebas muestran que el atributo ya existe, buscar uno que no exista."}, {"severidad": "importante", "titulo": "Siguen faltando los apartados 2.3 a 2.6", "ubicacion": "Capítulo 2, pp. 10-15; 1.3 (pp. 9-10) y 3.6 (pp. 28-29)", "cita": "Complementan las situaciones desarrolladas en el capítulo 2", "problema": "Persiste de las versiones anteriores (sin cambios en la entrega del 04/11): el capítulo 2 solo tiene 2.1 y 2.2. La solución está en 1.3, los casos de uso en 3.6 y los beneficios dentro de 2.1.1. Además, 3.6 remite a «situaciones desarrolladas en el capítulo 2» que no existen.", "mejora": "Crear 2.3 Beneficios clave, 2.4 Solución a problemas o necesidades específicas (relacionando cada función con una causa de la Tabla 2), 2.5 Segmentos de clientes y 2.6 Casos de uso, y mover allí el contenido que ya tienen. En 2.6, además de la tabla funcional, describir 2 o 3 situaciones reales de un día en la bodega."}, {"severidad": "importante", "titulo": "Segmento general y distritos no definidos", "ubicacion": "1.3 (p. 9), BMC (p. 18), 3.1.1 (p. 17) y 3.2.1 (p. 19)", "cita": "los distritos definidos en el capítulo 2", "problema": "Persiste de las versiones anteriores (sin cambios en la entrega del 04/11): el segmento sigue siendo «propietarios de bodegas y pequeñas tiendas minoristas» sin variables ni tamaño. El capítulo 3 menciona dos veces unos distritos definidos en el capítulo 2, pero no se definen en ninguna parte.", "mejora": "En 2.5, definir el segmento con variables geográficas (qué distritos de Arequipa y por qué), demográficas (edad, tamaño del negocio) y conductuales (cómo registra hoy, si cobra con Yape o Plin), y estimar su tamaño a partir de las 27 091 bodegas que ya calcularon."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El capítulo está completo y argumentado; solo queda ubicar los casos de uso en el capítulo 2.", "observaciones": [{"severidad": "sugerencia", "titulo": "Casos de uso dentro del capítulo 3", "ubicacion": "3.6, pp. 28-29", "cita": "Complementan las situaciones desarrolladas en el capítulo 2", "problema": "Los casos de uso pertenecen al capítulo 2 (2.6). Ubicados en el capítulo 3, alargan el capítulo y rompen la estructura oficial.", "mejora": "Mover los casos de uso a 2.6."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Mejoró mucho (índice, tablas y figuras con título y nota, más fuentes oficiales), pero persisten la carátula incompleta y errores de citación.", "observaciones": [{"severidad": "critico", "titulo": "Carátula todavía incompleta", "ubicacion": "p. 1", "cita": "TEMA: Estrategia de medios digitales … PROFESOR: JEAN PIERRE", "problema": "Persiste de las versiones anteriores y aparece un error nuevo: el tema de la carátula cambió a «Estrategia de medios digitales», que no tiene relación con Impulsa ni con la unidad (en la versión del 30/10 decía «Modelo de negocio en el formato Business Model Canvas con propuesta de valor única»). Siguen sin figurar el título del proyecto, la carrera de los integrantes, la sección y el número de grupo, y el docente continúa como «JEAN PIERRE».", "mejora": "Rehacer la carátula con institución, carrera de cada integrante, título del proyecto (Impulsa: aplicación de control financiero e inventario para bodegas de Arequipa), curso, sección, grupo, integrantes y docente con nombre completo. Revisar que el archivo siga el formato «AA1_Sección_Informe del TAP_Grupo X»."}, {"severidad": "importante", "titulo": "Citas que no coinciden con las referencias", "ubicacion": "pp. 3-4, 10, 12, 26 y 30-31", "cita": "Loyverse POS (2026), IUNCI (2026) y Alegra POS (2026)", "problema": "Persiste de las versiones anteriores (sin cambios en la entrega del 04/11): en el texto se cita PRODUCE (2023) y «Observatorio PRODUCEmpresarial (s. f.)» (p. 10), pero la lista solo tiene la entrada «Ministerio de la Producción (s. f.)» sin ese año; Loyverse, IUNCI y Alegra se citan con 2026 y en la lista figuran sin fecha; el BCRP se cita sin año (p. 26) y hay dos entradas del BCRP, una sin citar (2024); «Gómez» lleva tilde en el texto y no en la lista; UNCTAD (2023) se cita como si se hubiera consultado directamente. A la inversa, Chambe Torres y Velásquez Arana, Buitrón Bernal (PressPerú) y el informe del INEI están en la lista pero no se citan. La referencia del INEI no tiene autor, está ordenada por título y termina en «?utm_source=».", "mejora": "Cotejar cita por cita con la lista. Usar «(UNCTAD, 2023, como se citó en PRODUCE, 2025)» para la cita secundaria. Citar o retirar las referencias no usadas, y preferir el estudio del INEI a la nota de PressPerú. Titular «Referencias», aplicar sangría francesa, quitar el fondo gris del texto pegado y ordenar alfabéticamente (la entrada del INEI debe ir por autor)."}, {"severidad": "importante", "titulo": "Numeración de tablas y nota de figura incompletas", "ubicacion": "pp. 14-16", "cita": "La compatibilidad con Android const", "problema": "La numeración salta de la Tabla 6 (p. 14) a la Tabla 11 (p. 16): no existen las Tablas 7 a 10. La nota de la Figura 1 está cortada a mitad de palabra. Además, los títulos de las tablas van en la misma línea que el número, mientras que las figuras sí siguen el formato APA 7.", "mejora": "Renumerar las tablas de forma correlativa (lo más seguro es usar la función de títulos de Word o Google Docs), completar la nota de la Figura 1 y aplicar a las tablas el mismo formato que a las figuras: «Tabla N» en negrita y, en la línea siguiente, el título en cursiva."}, {"severidad": "sugerencia", "titulo": "Salvedades en casi cada párrafo", "ubicacion": "Todo el documento", "cita": "sujeto a comprobación", "problema": "Persiste de las versiones anteriores (sin cambios en la entrega del 04/11) y se ha intensificado: casi cada párrafo termina con «deberá validarse», «posibles», «potenciales» o «no se afirma». Ser prudentes está bien, pero repetirlo en todos los apartados debilita la argumentación y alarga el texto.", "mejora": "Reunir las limitaciones en un solo apartado breve de alcance y validación (por ejemplo, al final del capítulo 1) y dejar el resto del texto afirmativo y sustentado con fuentes o con los resultados de las entrevistas."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Instrumento de validación del MVP y del modelo de negocio (cap. 5)", "resumen": "Instrumento mejor encaminado que el anterior en modelo de negocio (freemium, pago, canal); débil todavía en validación de funcionalidad (prototipo estático) y en rigor de muestra y criterios.", "observaciones": [{"severidad": "critico", "titulo": "La funcionalidad del MVP no se valida: el prototipo es una imagen y la usabilidad se mide con opinión", "ubicacion": "Sección 3, imagen «Prototipo de Impulsa» y preguntas 9 y 10", "cita": "«Después de observar las pantallas del prototipo, ¿qué tan claro le resulta el proceso para registrar una venta en efectivo o mediante Yape?»", "problema": "La sección 3 muestra una única imagen (1536 × 1024) y pregunta qué tan fácil o claro le parece. Esa respuesta mide una impresión, no si el bodeguero puede registrar una venta, y las escalas positivas («Fácil», «Claro») se llenan por cortesía. La validación de la funcionalidad es una de las dos exigencias máximas de la AA2 y aquí no hay ninguna tarea, tiempo ni error observado. Tampoco hay una pregunta abierta para saber qué le confundió.", "mejora": "Reemplazar la imagen por un prototipo clicable (Figma o Canva) o un video del flujo, y pedir la tarea: «Registre una venta de S/ 20 en efectivo y una de S/ 15 por Yape», con opciones «Sin ayuda / Con ayuda / No pude» y una pregunta abierta «¿Qué le resultó confuso?». Complementar con una prueba presencial a 3 a 5 bodegueros midiendo tiempo y errores."}, {"severidad": "importante", "titulo": "Ninguna pregunta es obligatoria y no hay filtro real del segmento", "ubicacion": "Todo el formulario; preguntas 1 y 3", "cita": "«Propietario/a de una tienda minorista.» / «No utilizo smartphone.»", "problema": "Todas las preguntas están marcadas como no obligatorias, de modo que habrá respuestas incompletas, justo en las de precio e intención. Además, quien dice no usar smartphone, o es encargado y no decide la compra, sigue respondiendo y mezcla sus respuestas con las del segmento. La pregunta 1 también admite tiendas minoristas, que no son el segmento «bodegas» definido en el informe. Sí es un acierto que la pregunta 2 solo ofrezca distritos de Arequipa.", "mejora": "Marcar como obligatorias las preguntas 1 a 3, 8 a 15. Hacer que «No utilizo smartphone» envíe a una sección de agradecimiento. Distinguir en la pregunta 1 a quien decide y paga (propietario) de quien solo atiende, y registrar el rol para analizarlos por separado."}, {"severidad": "importante", "titulo": "La pregunta 11 no obliga a priorizar y mezcla modelo gratis con premium sin precio", "ubicacion": "Pregunta 11 (cuadrícula Gratis / Premium)", "cita": "«¿Cómo considera que deberían distribuirse las siguientes funcionalidades de Impulsa entre la versión gratuita y la versión premium?»", "problema": "Todo encuestado ubicará todas las funciones en «Gratis», lo que no aporta información sobre cuáles pagaría. La pregunta pide una opinión sobre cómo distribuir el producto, no una decisión de compra. La cuadrícula tampoco tiene opción «No la usaría», así que no se separa el valor de la utilidad. Y la pregunta se hace antes de saber el precio (preguntas 14 y 15), por lo que no puede usarse para construir el plan premium.", "mejora": "Pedir «Marque como máximo dos funciones por las que sí pagaría» (las seis del prototipo) y una pregunta sobre cuál es indispensable. Agregar la columna «No la usaría». En el análisis, cruzar la pregunta 11 con la 15 para definir qué incluye el plan de pago."}, {"severidad": "importante", "titulo": "Precio explorado solo con rangos y sin referencia al gasto actual; pregunta 15 duplicada", "ubicacion": "Preguntas 14 y 15 (mensual y pago único)", "cita": "«15. Si prefiere un pago mensual: ¿Cuánto estaría dispuesto/a a pagar mensualmente…?» / «De S/ 10 a S/ 15.» / «De S/ 16 a S/ 20.»", "problema": "La disposición de pago se pregunta con rangos abiertos y el encuestado no tiene un precio concreto de la oferta (el informe habla de S/ 10 a S/ 20), por lo que la respuesta tiende a un rango intermedio. No se pregunta cuánto paga hoy por herramientas o cuánto estaría dispuesto a pagar como máximo, y tampoco el precio del competidor (Clarito, IUNCI, Loyverse). Los rangos dejan fuera S/ 15,50 (entre 10-15 y 16-20). La pregunta 14 ofrece «Suscripción mensual con todas las funciones» y la 15 pregunta por «funciones premium», lo que confunde a quien eligió la suscripción. Hay dos preguntas numeradas 15. No se confirmó si el flujo del tramo mensual salta a la pregunta de pago único o termina el formulario.", "mejora": "Añadir una pregunta sobre el gasto actual en herramientas, usar puntos de precio concretos (por ejemplo, ofrecer Impulsa Premium a S/ 10, S/ 15 y S/ 20 y preguntar si lo contrataría), o la secuencia «demasiado barato / barato / caro / demasiado caro». Corregir la numeración y verificar que quien elige pago mensual no vea la pregunta de pago único."}, {"severidad": "importante", "titulo": "Faltan preguntas abiertas y de comparación que expliquen el «por qué»", "ubicacion": "Secciones 2 y 3", "cita": "—", "problema": "Las 15 preguntas son de opción cerrada, salvo el WhatsApp. No se pregunta qué hace falta para preferir Impulsa a Clarito u otra aplicación (el diferencial que el informe aún no demuestra), ni qué aplicaciones probaron y dejaron. La pregunta 5 ofrece «Clarito» y «Aplicaciones móviles», pero no IUNCI ni Loyverse, que el informe analiza. Sin el «por qué» no se pueden proponer mejoras al MVP, que es lo que exige el nivel Sobresaliente.", "mejora": "Agregar una pregunta abierta y obligatoria: «¿Qué tendría que tener Impulsa para que lo use en vez de lo que usa hoy?», otra opcional «¿Qué aplicación probó y dejó de usar, y por qué?», y completar la pregunta 5 con las aplicaciones que el informe compara. Complementar con 5 a 8 entrevistas breves."}, {"severidad": "importante", "titulo": "Compromiso real limitado a un campo opcional y sin tamaño del negocio", "ubicacion": "Pregunta 12 y campo de WhatsApp; secciones 1 y 4", "cita": "«¿Desea dejar su número de WhatsApp para recibir información y participar en la prueba?»", "problema": "La intención (pregunta 12) y el contacto (WhatsApp) son el mejor indicador de aceptación del formulario, pero el contacto es una pregunta de texto abierto sin opción de elegir, y no se pregunta por el tamaño del negocio (ventas diarias, personas que atienden), necesario para segmentar la aceptación y la disposición de pago. Además, no hay aviso de uso de datos personales para recoger el WhatsApp (Ley 29733).", "mejora": "Cambiar el contacto a una pregunta con respuesta «Sí, este es mi número / No» y vincularla con el piloto de dos semanas; agregar ventas diarias aproximadas y personas que atienden; incluir en la introducción una línea de consentimiento sobre el uso del contacto."}, {"severidad": "importante", "titulo": "El cap. 5 aún no define hipótesis, muestra ni criterios, y no hay resultados", "ubicacion": "Informe, cap. 5 (por presentar)", "cita": "—", "problema": "No se informó el tamaño de muestra, la forma de llegar a los bodegueros ni el resultado mínimo que se aceptará como validación. Sin resultados, no existe análisis crítico ni mejoras al MVP, de modo que el criterio de validación no puede pasar del nivel 2. Las flexibilizaciones de la AA1 ya no aplican.", "mejora": "Escribir una tabla hipótesis - pregunta - criterio de éxito (por ejemplo, «al menos 60 % completa la tarea sin ayuda», «al menos 40 % acepta pagar S/ 10 o más»). Definir una muestra mínima por distrito, aplicar el formulario y presentar resultados con porcentajes y n, y un cuadro «Lo que aprendimos - mejora al MVP»."}, {"severidad": "sugerencia", "titulo": "Pregunta 8 describe con adjetivos positivos lo que ofrece la aplicación", "ubicacion": "Pregunta 8", "cita": "«¿Qué tan útil sería para su negocio una aplicación móvil que permita registrar ventas, compras y gastos, organizar los medios de pago y consultar sus ganancias?»", "problema": "La pregunta enumera de una vez todos los beneficios antes de mostrar nada, lo que induce la respuesta «Útil» y mezcla cuatro funciones en una sola pregunta. La escala está balanceada, lo cual es correcto.", "mejora": "Preguntar por la utilidad con una descripción neutra o dividir la pregunta, y comparar luego la respuesta con la posterior al prototipo (hoy no hay una pregunta de utilidad después del prototipo, por lo que no se mide el cambio)."}, {"severidad": "sugerencia", "titulo": "Cuidar el orden y la redacción", "ubicacion": "Preguntas 6, 13 y 14; título interno del formulario", "cita": "«  6. ¿Cómo registra actualmente las ventas de su negocio?  »", "problema": "Hay espacios sobrantes en el enunciado de la pregunta 6, la pregunta 13 mezcla canal de información y de asistencia, y el título interno del formulario es «ENCUESTA IMPULSA» (el público ve «Impulsa: Encuesta sobre la gestión de bodegas»).", "mejora": "Revisar el formulario completo con 5 personas del segmento antes de difundirlo, midiendo el tiempo y las dudas."}]}], "fecha_aa2": "11/11/2026", "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 4, "responsabilidad": 3}, "calificacionAA2": {"validacion": 2}, "enlaces": [{"titulo": "Formulario de validación", "url": "https://docs.google.com/forms/d/e/1FAIpQLSd6kpUf_kF57oS-8vkTaOB2CI8BYdqPAGCYJnjYFZVkszmtIA/viewform"}], "costosAA2": {"hoja": "Impulsa", "tipo_cambio": 3.5, "escenarios": ["Piloto", "Año 1", "Crecimiento"],         </table></div>
        ${N.cambios_vs_6nov ? `<p class="summary"><b>Cambios frente al 06/11:</b> ${esc(N.cambios_vs_6nov)}</p>` : ''}
        ${N.camino_al_20?.length ? `<h4 style="margin:12px 0 6px">Camino para subir la nota</h4><ol class="priorities">${N.camino_al_20.map(c => `<li><span>${esc(c)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Calificación preliminar con la rúbrica oficial de la AA2 y criterio exigente de revisión de negocios. El criterio «Compromiso» es individual y lo define el docente (se muestra 3 por defecto). El Excel de punto de equilibrio se evalúa aparte y puede modificar el criterio de análisis presupuestal. La nota final la decide el docente.</p>
      </div>`;
    })() : ''}
    ${D.calificacionAA2 && !D.notasAA2 ? (() => {
      const p = Number(D.calificacionAA2.validacion);
      const NIV2 = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
      return `<div class="scorebox" id="nota-aa2">
        <div class="eyebrow">Calificación preliminar parcial · solo del formulario de validación</div>
        <div class="grade"><span class="big">${p}</span><span class="of">/ 4</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio de la rúbrica AA2</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
          <tbody>
            <tr><td>Validación del modelo de negocio (cap. 5)</td><td><span class="lvl l${p}">${NIV2[p] ?? '—'}</span></td><td class="num">${p} / 4</td></tr>
            <tr><td>Planteamiento del MVP · Herramientas · Análisis presupuestal · Compromiso</td><td>Pendiente</td><td class="num">—</td></tr>
          </tbody>
        </table></div>
        <p class="summary">Esta nota evalúa solo el instrumento (el formulario), porque aún no hay resultados reales. Para subir de nivel: con muestra real y análisis de resultados (n y %) se llega a 3; con mejoras al MVP derivadas de esos datos, a 4. La calificación final de la AA2 la define el docente e incluye los demás criterios y la exposición.</p>
      </div>`;
    })() : ''}
    ${D.prototipoHtml ? `<div id="prototipo-aa2">
      <h3 style="margin:18px 0 8px">Prototipo navegable de la plataforma</h3>
      <p class="summary">Prototipo referencial elaborado a partir del MVP y de las imágenes de referencia de su informe, para visualizar cómo podría verse y usarse su plataforma. Los datos son ficticios; no es el producto final. Pruébenlo aquí o <a href="${esc(D.prototipoHtml)}" target="_blank" rel="noopener noreferrer">ábranlo en pantalla completa</a>.</p>
      <iframe src="${esc(D.prototipoHtml)}" title="Prototipo de la plataforma" loading="lazy" style="width:100%;height:680px;border:1px solid var(--rule);border-radius:10px;background:#fff"></iframe>
    </div>` : ''}
    ${D.costosAA2 ? (() => {
      const K = D.costosAA2, S = n => 'S/ ' + Number(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const f3 = arr => arr.map(v => `<td class="num">${S(v)}</td>`).join('');
      const sup = v => Number(v).toLocaleString('es-PE', { maximumFractionDigits: 2 });
      return `<div class="costos" id="costos-aa2">
        <h3 style="margin:18px 0 8px">Costos de nube y servicios digitales (estimación)</h3>
        <p class="summary">Estimación mensual con proveedores reales (Google Cloud / Firebase, OpenAI, WhatsApp) para tres escenarios de uso. Los volúmenes son supuestos elaborados a partir de su MVP: reemplácenlos con los datos de su prototipo. Tipo de cambio: S/ ${esc(K.tipo_cambio)} por USD. Los precios son cifras de referencia que deben confirmarse con la calculadora oficial de cada proveedor.</p>
        ${K.necesidades ? `<h4 style="margin:14px 0 6px">Qué necesita su proyecto, con proveedor y precio</h4>
        <p class="summary">${esc(K.necesidades.resumen)} Estado del precio: <b>Verificado</b> (fuente oficial, 11/11/2026), <b>Referencial</b> (confirmar en la lista oficial del proveedor) y <b>Cotizar</b> (pidan 2 o más cotizaciones y anéxenlas). Úsenla para armar su Excel.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Rubro</th><th>Qué necesitan (según su informe)</th><th>Proveedor · producto</th><th>Precio de referencia</th><th>Estado</th></tr></thead>
          <tbody>${K.necesidades.items.map(i => `<tr><td><b>${esc(i.rubro)}</b><br><span class="where">${esc(i.origen)}</span></td><td>${esc(i.necesidad)}</td><td>${esc(i.proveedor)}<br><span class="where">${esc(i.producto)}</span></td><td>${esc(i.precio)}${i.nota ? `<br><span class="where">${esc(i.nota)}</span>` : ''}</td><td><span class="lvl ${i.estado === 'Verificado' ? 'l4' : i.estado === 'Referencial' ? 'l2' : 'l1'}">${esc(i.estado)}</span></td></tr>`).join('')}</tbody>
        </table></div>` : ''}
        ${D.calculadoraXlsx ? `<p class="summary" style="margin-top:12px"><b>Calculadora de su proyecto:</b> <a href="${esc(D.calculadoraXlsx)}" download>descargar Excel</a>. Cambien la cantidad de usuarios en la columna «Calculadora (edite)» y verán el costo mensual de los servicios, el primer pago para construir la plataforma, el mantenimiento (bolsa de horas o un encargado fijo) y el costo del primer año.</p>` : ''}
        <div class="table-wrap"><table>
          <thead><tr><th>Supuesto de uso</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.supuestos.map(r => `<tr><td>${esc(r.concepto)} <span class="where">${esc(r.unidad)}</span></td>${r.valores.map(v => `<td class="num">${sup(v)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Servicio (costo mensual)</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.costos.map(r => `<tr><td>${esc(r.concepto)}</td>${f3(r.valores)}</tr>`).join('')}
            <tr><td><b>Total mensual</b></td>${K.total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td>Primer pago (mes 1, con dominio anual)</td>${f3(K.primer_pago_pen)}</tr>
            <tr><td>Mantenimiento del desarrollador (horas al mes x S/ ${esc(K.tarifa_mantenimiento)} por hora)</td>${f3(K.mantenimiento_pen)}</tr>
            <tr><td><b>Total mensual con mantenimiento</b></td>${K.total_con_mant_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Desarrollo inicial de la plataforma (pago único al desarrollador, a S/ ${esc(K.tarifa_desarrollo)} por hora)</b></td><td class="num" colspan="${K.escenarios.length}"><b>${S(K.desarrollo_pen)}</b></td></tr>
            ${K.primer_pago_total_pen ? `<tr><td><b>Primer pago total: plataforma + primer mes de servicios</b></td>${K.primer_pago_total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Costo total del primer año (plataforma + 12 meses con mantenimiento)</b></td>${K.costo_anio1_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>` : ''}
            ${K.chat_pen ? `<tr><td>De ese total: chat interno y buzón de mensajes</td>${f3(K.chat_pen)}</tr>` : ''}
            <tr><td>${esc(K.ingreso_etiqueta)}</td>${f3(K.ingreso_pen)}</tr>
            <tr><td>Costo de nube / ingreso estimado</td>${K.pct_ingreso.map(v => `<td class="num">${(v * 100).toLocaleString('es-PE', { maximumFractionDigits: 1 })} %</td>`).join('')}</tr>
          </tbody>
        </table></div>
        <ul class="strength">${K.notas.map(n => `<li>${esc(n)}</li>`).join('')}<li>El desarrollo inicial y las horas de mantenimiento son referenciales: reemplácenlos con la cotización real de su desarrollador y verifiquen que el ingreso cubra el mantenimiento mensual.</li></ul>
      </div>`;
    })() : ''}
    ${D.excelPE ? (() => {
      const X = D.excelPE, NIV = pct => pct >= 85 ? 'Sobresaliente' : pct >= 70 ? 'Logrado' : pct >= 50 ? 'En proceso' : 'Inicio';
      const entrega = `<div class="scorebox" id="excel-pe">
        <div class="eyebrow">Evidencia 2 · Excel de costos y punto de equilibrio</div>
        <h3 style="margin:6px 0 8px">Cómo entregar el Excel</h3>
        <ol class="priorities">
          <li><span>Hagan el archivo en <b>.xlsx</b> (si lo trabajan en Google Sheets: Archivo → Descargar → Microsoft Excel).</span></li>
          <li><span>Súbanlo a <b>Google Drive</b> y compártanlo con «Cualquier persona con el enlace → Lector». Nombre: <b>AA2_Cap6_Excel_Punto de equilibrio_Grupo X</b>.</span></li>
          <li><span>Envíen <b>el enlace de Drive</b> al docente. Si no abre, se les pedirá el archivo.</span></li>
          <li><span>Anexen las cotizaciones (capturas o PDF) en una hoja «Cotizaciones» o en la misma carpeta de Drive.</span></li>
          <li><span>Si lo corrigen, suban la nueva versión con el mismo nombre y el mismo enlace.</span></li>
        </ol>`;
      if (X.estado !== 'calificado' || X.logro == null) {
        return entrega + `<p class="summary">Estado: <b>pendiente de entrega</b>. Cuando lo reciban, aquí aparecerá su porcentaje de logro (0 a 100 %) con la retroalimentación por criterio.</p></div>`;
      }
      const notaX = (Number(X.logro) * 0.2).toFixed(1).replace('.0', '');
      return entrega + `<div class="grade"><span class="big">${notaX} / 20</span><span class="of">nota del Excel · ${Number(X.logro)} % de logro · ${NIV(Number(X.logro))}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio</th><th class="num">Puntaje</th><th>Retroalimentación</th></tr></thead>
          <tbody>${X.criterios.map(c => `<tr><td>${esc(c.nombre)}</td><td class="num">${Number(c.puntaje)} / ${Number(c.peso)}</td><td>${esc(c.comentario || '')}</td></tr>`).join('')}</tbody>
        </table></div>
        ${X.fortalezas?.length ? `<h4 style="margin:12px 0 6px">Lo que está bien</h4><ul class="strength">${X.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        ${X.mejoras?.length ? `<h4 style="margin:12px 0 6px">Para mejorar</h4><ol class="priorities">${X.mejoras.map(m => `<li><span>${esc(m)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Indicador preliminar elaborado con la rúbrica del Excel de punto de equilibrio. La calificación final de la AA2 la define el docente.${X.revisado ? ' Revisión del ' + esc(X.revisado) + '.' : ''}</p></div>`;
    })() : ''}
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.notasAA2 ? [['nota-aa2', 'Calificación AA2 (/20)', '']] : D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.prototipoHtml ? [['prototipo-aa2', 'Prototipo', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.excelPE ? [['excel-pe', 'Excel de punto de equilibrio', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
