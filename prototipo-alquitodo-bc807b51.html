<!doctype html>
<html lang="es">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlquiTodo - Prototipo referencial</title>
<style>
:root{--p:#0f766e;--pd:#115e59;--a:#f59e0b;--bg:#f4f7f6;--c:#fff;--t:#1f2937;--m:#6b7280;--b:#e2e8e6;--r:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t);padding-top:30px}
.strip{position:fixed;top:0;left:0;right:0;z-index:50;background:#334155;color:#e2e8f0;font-size:12px;text-align:center;padding:6px 10px;line-height:1.2}
header{background:var(--p);color:#fff;position:sticky;top:30px;z-index:40}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;cursor:pointer;background:none;border:0;color:#fff;display:flex;align-items:center;gap:6px}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;color:#d1fae5;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;position:relative}
nav button:hover,nav button.on{background:rgba(255,255,255,.18);color:#fff}
.badge{background:var(--a);color:#1f2937;border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:4px}
main{max-width:1100px;margin:auto;padding:16px 12px 60px}
h1{font-size:24px;margin:.2em 0 .5em}h2{font-size:19px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.hero{background:linear-gradient(120deg,var(--p),#14b8a6);color:#fff;border-radius:14px;padding:24px;margin-bottom:16px}
.hero h1{margin:0 0 6px}
.search{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
input,select,textarea{font:inherit;padding:9px;border:1px solid #cbd5d1;border-radius:8px;background:#fff;color:var(--t);min-width:0}
.search input{flex:2 1 200px}.search select{flex:1 1 130px}
button.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit;font-weight:600}
button.btn:hover{background:var(--pd)}button.btn.sec{background:#e5eceb;color:var(--t)}button.btn.warn{background:var(--r)}button.btn.am{background:var(--a);color:#1f2937}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible{outline:3px solid var(--a);outline-offset:1px}
.prod{cursor:pointer;padding:0;overflow:hidden;text-align:left;font:inherit;color:inherit}
.prod:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}
.img{height:120px;display:flex;align-items:center;justify-content:center}
.img svg{width:64px;height:64px}
.pb{padding:10px 12px}.pb h3{margin:0 0 4px;font-size:15px}
.price{font-weight:800;color:var(--pd)}.muted{color:var(--m);font-size:13px}
.tag{display:inline-block;background:#d1fae5;color:#065f46;border-radius:6px;font-size:12px;padding:2px 7px}
.tag.y{background:#fef3c7;color:#92400e}.tag.r{background:#fee2e2;color:#991b1b}.tag.g{background:#e5e7eb;color:#374151}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}
.fld input,.fld select,.fld textarea{width:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal button{padding:8px 0;border:1px solid var(--b);background:#fff;border-radius:6px;cursor:pointer;font:inherit}
.cal .oc{background:#e5e7eb;color:#9ca3af;text-decoration:line-through;cursor:not-allowed}
.cal .sel{background:var(--p);color:#fff;border-color:var(--p)}.cal .h{font-size:12px;color:var(--m);text-align:center;font-weight:700;border:0;background:none;cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}td:last-child,th:last-child{text-align:right}
.tot td{font-weight:800;border-top:2px solid var(--t)}
.chat{display:grid;grid-template-columns:280px 1fr;gap:12px;height:520px}
@media(max-width:760px){.chat{grid-template-columns:1fr;height:auto}.chat .win{height:420px}}
.list{overflow:auto;padding:0}
.item{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--b);cursor:pointer;align-items:center}
.item:hover,.item.on{background:#ecfdf5}
.av{width:38px;height:38px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.win{display:flex;flex-direction:column;padding:0;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:#f8fafa}
.m{max-width:75%;padding:8px 11px;border-radius:12px;background:#fff;border:1px solid var(--b);font-size:14px}
.m.me{align-self:flex-end;background:#ccfbf1;border-color:#99f6e4}.m small{display:block;color:var(--m);font-size:11px}
.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--b)}.send input{flex:1}
.photo{height:110px;border:2px dashed #cbd5d1;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--m);font-size:13px;text-align:center;background:#fafcfb}
.photo.f{border-style:solid;border-color:var(--p);background:#ccfbf1;color:var(--pd);font-weight:600}
.stars button{background:none;border:0;font-size:26px;cursor:pointer;color:#cbd5d1;padding:0 2px}.stars button.on{color:var(--a)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;max-width:90%}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="strip" role="note">Prototipo referencial elaborado a partir del MVP del grupo; no es el producto final. Datos ficticios.</div>
<header><div class="bar">
<button class="logo" onclick="go('inicio')" aria-label="AlquiTodo, ir al inicio"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 9l9-6 9 6v11H3z"/><path d="M9 20v-6h6v6"/></svg>AlquiTodo</button>
<nav id="nav" aria-label="Principal"></nav>
</div></header>
<main id="app" tabindex="-1"></main>
<div id="toast" class="toast" role="status" hidden></div>
<script>
var CATS=['Cámaras y video','Audio y eventos','Herramientas','Computación','Camping y deporte','Hogar y fiestas'];
var ZONAS=['Cercado','Yanahuara','Cayma','Cerro Colorado','Paucarpata','Miraflores','José Luis Bustamante'];
var COL={'Cámaras y video':'#0ea5e9','Audio y eventos':'#a855f7','Herramientas':'#f59e0b','Computación':'#14b8a6','Camping y deporte':'#22c55e','Hogar y fiestas':'#ec4899'};
var ICON={'Cámaras y video':'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>','Audio y eventos':'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/>','Herramientas':'<path d="M14 6a4 4 0 005 5l-9 9a2.1 2.1 0 01-3-3l9-9a4 4 0 01-2-2z"/>','Computación':'<rect x="3" y="5" width="18" height="11" rx="1"/><path d="M2 20h20"/>','Camping y deporte':'<path d="M3 20L12 4l9 16z"/><path d="M12 20v-7"/>','Hogar y fiestas':'<path d="M12 3l2.5 5.5 6 .7-4.4 4.1 1.2 6L12 16.4 6.7 19.3l1.2-6L3.500 9.200l6-.7z"/>'};
var P=[
{id:1,t:'Cámara Sony Alpha a6400 + lente 16-50 mm',c:'Cámaras y video',z:'Yanahuara',p:60,o:'Marco Quispe',d:'Kit para video y foto con 2 baterías y tarjeta de 64 GB. Ideal para proyectos del instituto y cortometrajes.',g:300,oc:[8,9,10,18]},
{id:2,t:'Parlante JBL PartyBox 310 con micrófono',c:'Audio y eventos',z:'Cayma',p:90,o:'Lucía Mamani',d:'Parlante de 240 W con luces, ideal para cumpleaños y reuniones. Incluye micrófono inalámbrico.',g:250,oc:[14,15]},
{id:3,t:'Taladro percutor Bosch 700 W + brocas',c:'Herramientas',z:'Paucarpata',p:25,o:'Jorge Cáceres',d:'Taladro con maletín y juego de 20 brocas para concreto, madera y metal.',g:80,oc:[5,6,22]},
{id:4,t:'Laptop Lenovo IdeaPad Ryzen 5 (16 GB)',c:'Computación',z:'Cercado',p:45,o:'Andrea Condori',d:'Laptop para diseño o renders de entrega. Incluye cargador y mouse.',g:400,oc:[11,12]},
{id:5,t:'Carpa 4 personas Coleman + 2 colchonetas',c:'Camping y deporte',z:'Miraflores',p:35,o:'Diego Flores',d:'Carpa impermeable para salidas al Misti o Chachani. Se entrega limpia y armada de prueba.',g:100,oc:[20,21]},
{id:6,t:'Proyector Epson 3300 lúmenes + pantalla',c:'Audio y eventos',z:'José Luis Bustamante',p:70,o:'Rosa Huamán',d:'Proyector HDMI con ecran portátil de 100 pulgadas para exposiciones o cine en casa.',g:250,oc:[]},
{id:7,t:'Dron DJI Mini 3 Fly More Combo',c:'Cámaras y video',z:'Cerro Colorado',p:120,o:'Marco Quispe',d:'Dron de menos de 250 g con 3 baterías. El arrendatario debe conocer la normativa de vuelo.',g:600,oc:[16,17,18]},
{id:8,t:'Mesas y sillas para 20 personas',c:'Hogar y fiestas',z:'Cayma',p:80,o:'Lucía Mamani',d:'10 mesas plegables y 20 sillas. Recojo en domicilio o entrega coordinada.',g:150,oc:[]},
{id:9,t:'Tablet Samsung S6 Lite + lápiz',c:'Computación',z:'Cercado',p:20,o:'Andrea Condori',d:'Tablet para presentaciones, dibujo o lectura de PDFs.',g:150,oc:[3]},
{id:10,t:'Kit de iluminación LED con trípodes (2)',c:'Cámaras y video',z:'Yanahuara',p:40,o:'Marco Quispe',d:'Dos paneles LED bicolor con trípode, para entrevistas y fotografía de producto.',g:200,oc:[]}
];
var S={view:'inicio',u:null,sel:null,fil:{q:'',c:'',z:'',pm:''},sol:[
{id:1,pid:3,rol:'prop',who:'Karla Paredes',ini:12,fin:13,est:'Pendiente'},
{id:2,pid:1,rol:'prop',who:'Luis Medina',ini:24,fin:26,est:'Pendiente'},
{id:3,pid:2,rol:'arr',who:'Lucía Mamani',ini:20,fin:20,est:'Aceptada'},
{id:4,pid:5,rol:'arr',who:'Diego Flores',ini:2,fin:3,est:'Rechazada'}],
chats:[
{id:1,n:'Karla Paredes',pid:3,m:[['o','Hola, ¿el taladro sigue disponible el 12?','09:10'],['me','Sí, lo tengo libre. Ya te llegó la solicitud.','09:14']],un:1},
{id:2,n:'Luis Medina',pid:1,m:[['o','Buenas tardes, ¿puedo recoger la cámara en Yanahuara a las 8 a. m.?','Ayer'],['o','Quedo atento, gracias.','Ayer']],un:2},
{id:3,n:'Lucía Mamani',pid:2,m:[['me','Hola Lucía, ¿me confirmas la entrega del parlante?','Lun'],['o','Confirmado, te espero el 20 a las 5 p. m.','Lun']],un:0}],
cc:1,reg:{antes:false,desp:false},stars:0,res:[
['Andrea C.',5,'Excelente laptop, el trato fue muy puntual.'],['Marco Q.',4,'Cuidó muy bien el equipo, devolvió a tiempo.']],verif:{c:false,t:false},ver1:0,rng:[null,null],pub:[]};
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function unread(){return S.chats.reduce(function(a,c){return a+c.un},0)}
function pend(){return S.sol.filter(function(s){return s.rol==='prop'&&s.est==='Pendiente'}).length}
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},3200)}
function pr(id){return P.concat(S.pub).filter(function(p){return p.id===id})[0]}
function go(v,x){S.view=v;if(x!==undefined)S.sel=x;render();window.scrollTo(0,0);$('app').focus()}
function img(p,h){var c=COL[p.c];return '<div class="img" style="background:'+c+'22;'+(h?'height:'+h+'px':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[p.c]+'</svg></div>'}
function nav(){var it=[['inicio','Inicio'],['catalogo','Catálogo'],['publicar','Publicar'],['solicitudes','Mis solicitudes'],['estado','Estado del objeto'],['calif','Calificaciones'],['buzon','Buzón'],['perfil',S.u?'Mi perfil':'Ingresar']];
$('nav').innerHTML=it.map(function(i){var b='';if(i[0]==='buzon'&&unread())b='<span class="badge" aria-label="'+unread()+' mensajes sin leer">'+unread()+'</span>';if(i[0]==='solicitudes'&&pend())b='<span class="badge" aria-label="'+pend()+' solicitudes pendientes">'+pend()+'</span>';return '<button onclick="go(\''+i[0]+'\')"'+(S.view===i[0]?' class="on" aria-current="page"':'')+'>'+i[1]+b+'</button>'}).join('')}
function filtered(){var f=S.fil;return P.concat(S.pub).filter(function(p){return(!f.q||(p.t+p.d).toLowerCase().indexOf(f.q.toLowerCase())>-1)&&(!f.c||p.c===f.c)&&(!f.z||p.z===f.z)&&(!f.pm||p.p<=+f.pm)})}
function opts(a,v,all){return '<option value="">'+all+'</option>'+a.map(function(x){return '<option'+(x==v?' selected':'')+'>'+x+'</option>'}).join('')}
function filtros(){var f=S.fil;return '<form class="search" onsubmit="event.preventDefault();applyF()" role="search"><label class="sr" for="fq">Buscar</label><input id="fq" placeholder="¿Qué necesitas alquilar? Ej.: cámara, taladro" value="'+esc(f.q)+'"><label class="sr" for="fc">Categoría</label><select id="fc">'+opts(CATS,f.c,'Todas las categorías')+'</select><label class="sr" for="fz">Ubicación</label><select id="fz">'+opts(ZONAS,f.z,'Toda Arequipa')+'</select><label class="sr" for="fp">Precio máximo por día</label><select id="fp"><option value="">Cualquier precio</option>'+[30,50,80,120].map(function(x){return '<option value="'+x+'"'+(f.pm==x?' selected':'')+'>Hasta S/ '+x+' por día</option>'}).join('')+'</select><button class="btn am">Buscar</button></form>'}
function applyF(){S.fil={q:$('fq').value,c:$('fc').value,z:$('fz').value,pm:$('fp').value};S.view='catalogo';render()}
function cards(l){if(!l.length)return '<p class="card">No hay resultados con esos filtros. Prueba ampliar la búsqueda.</p>';return '<div class="grid">'+l.map(function(p){return '<button class="card prod" onclick="go(\'detalle\','+p.id+')" aria-label="Ver '+esc(p.t)+', S/ '+p.p+' por día">'+img(p)+'<div class="pb"><span class="tag">'+p.c+'</span><h3>'+esc(p.t)+'</h3><div class="price">S/ '+p.p+' <span class="muted">/ día</span></div><div class="muted">'+p.z+', Arequipa · '+esc(p.o)+'</div></div></button>'}).join('')+'</div>'}
function vInicio(){return '<section class="hero"><h1>Alquila lo que necesitas, cerca de ti</h1><p style="margin:0">Cámaras, equipos de audio, herramientas y más, de propietarios de Arequipa. Alquila por días y ahorra frente a comprar.</p>'+filtros()+'</section><h2>Categorías</h2><div class="row" style="margin-bottom:14px">'+CATS.map(function(c){return '<button class="btn sec" onclick="S.fil={q:\'\',c:\''+c+'\',z:\'\',pm:\'\'};go(\'catalogo\')">'+c+'</button>'}).join('')+'</div><h2>Destacados esta semana</h2>'+cards(P.slice(0,4))+'<div class="grid" style="margin-top:16px"><div class="card"><b>1. Busca</b><p class="muted">Filtra por categoría, ubicación y precio.</p></div><div class="card"><b>2. Solicita</b><p class="muted">Elige fechas y envía tu solicitud; el propietario la acepta o rechaza.</p></div><div class="card"><b>3. Coordina y recoge</b><p class="muted">Usa el chat interno y registra el estado del objeto con fotos.</p></div></div>'}
function vCatalogo(){var l=filtered();return '<h1>Catálogo</h1><div class="card" style="margin-bottom:14px">'+filtros()+'</div><p class="muted" aria-live="polite">'+l.length+' publicaciones encontradas</p>'+cards(l)}
function calHTML(p){var h='<div class="cal" role="group" aria-label="Disponibilidad, noviembre 2026">'+['L','M','X','J','V','S','D'].map(function(d){return '<button class="h" tabindex="-1" aria-hidden="true">'+d+'</button>'}).join('');h+='<button class="h" tabindex="-1" aria-hidden="true"></button>'.repeat(6);for(var d=1;d<=30;d++){var o=p.oc.indexOf(d)>-1||d<11,s=S.rng[0]!==null&&d>=S.rng[0]&&d<=(S.rng[1]===null?S.rng[0]:S.rng[1]);h+='<button '+(o?'class="oc" disabled aria-label="'+d+' no disponible"':'class="'+(s?'sel':'')+'" onclick="pick('+d+','+p.id+')" aria-label="'+d+' de noviembre'+(s?', seleccionado':'')+'"')+'>'+d+'</button>'}return h+'</div>'}
function pick(d,id){var r=S.rng,p=pr(id);if(r[0]===null||r[1]!==null){S.rng=[d,null]}else if(d<r[0]){S.rng=[d,null]}else{var bad=p.oc.some(function(x){return x>r[0]&&x<=d});if(bad){toast('El rango incluye días no disponibles.');return}S.rng=[r[0],d]}render()}
function resumen(p){var r=S.rng;if(r[0]===null)return '<p class="muted">Selecciona las fechas en el calendario.</p>';var n=(r[1]===null?r[0]:r[1])-r[0]+1,b=n*p.p,c1=b*.05,c2=b*.15;return '<table><caption class="sr">Resumen de pago simulado</caption><tr><td>S/ '+p.p+' × '+n+' día(s)</td><td>S/ '+b.toFixed(2)+'</td></tr><tr><td>Tarifa de servicio al arrendatario (5 %)</td><td>S/ '+c1.toFixed(2)+'</td></tr><tr class="tot"><td>Total a pagar por el arrendatario</td><td>S/ '+(b+c1).toFixed(2)+'</td></tr><tr><td class="muted">Comisión al propietario (15 %), descontada de su cobro</td><td class="muted">− S/ '+c2.toFixed(2)+'</td></tr><tr><td class="muted">Ingreso del propietario</td><td class="muted">S/ '+(b-c2).toFixed(2)+'</td></tr><tr><td class="muted">Ingreso bruto de AlquiTodo (20 %)</td><td class="muted">S/ '+(c1+c2).toFixed(2)+'</td></tr></table><div class="note">Pago en etapa posterior: la pasarela de pagos no forma parte del MVP. Este resumen es solo informativo; el pago se coordinará entre las partes. Garantía referencial: S/ '+p.g+'.</div>'}
function vDetalle(){var p=pr(S.sel);return '<button class="btn sec" onclick="go(\'catalogo\')">← Volver al catálogo</button><div class="two" style="margin-top:12px"><div class="card">'+img(p,240)+'<h1>'+esc(p.t)+'</h1><div class="row"><span class="tag">'+p.c+'</span><span class="tag g">'+p.z+', Arequipa</span></div><p>'+esc(p.d)+'</p><h2>Condiciones</h2><ul><li>Precio: <b>S/ '+p.p+' por día</b></li><li>Garantía: S/ '+p.g+' (referencial)</li><li>Entrega y devolución coordinadas por chat interno</li><li>Registro fotográfico del estado antes y después</li></ul><div class="row"><div class="av" aria-hidden="true">'+p.o[0]+'</div><div><b>'+esc(p.o)+'</b><div class="muted">★ 4,8 · Correo y teléfono verificados</div></div><button class="btn sec" onclick="chatCon(\''+esc(p.o)+'\','+p.id+')">Escribir al propietario</button></div></div><div class="card"><h2 style="margin-top:0">Solicitar alquiler</h2><p class="muted">Noviembre 2026. Elige inicio y fin.</p>'+calHTML(p)+resumen(p)+'<button class="btn" style="width:100%;margin-top:12px" onclick="solicitar('+p.id+')">Enviar solicitud</button></div></div>'}
function solicitar(id){if(!S.u){toast('Ingresa o regístrate para solicitar.');go('perfil');return}if(S.rng[0]===null){toast('Selecciona las fechas primero.');return}S.sol.unshift({id:Date.now(),pid:id,rol:'arr',who:pr(id).o,ini:S.rng[0],fin:S.rng[1]||S.rng[0],est:'Pendiente'});S.rng=[null,null];toast('Solicitud enviada. El propietario la revisará.');go('solicitudes')}
function chatCon(n,pid){var c=S.chats.filter(function(x){return x.n===n})[0];if(!c){c={id:Date.now(),n:n,pid:pid,m:[],un:0};S.chats.unshift(c)}S.cc=c.id;go('buzon')}
function vPublicar(){return '<h1>Publicar un objeto</h1><form class="card fld" onsubmit="event.preventDefault();publicar()"><label for="pt">Título</label><input id="pt" required placeholder="Ej.: Trípode Manfrotto con cabezal"><div class="row"><div style="flex:1 1 180px"><label for="pc">Categoría</label><select id="pc">'+opts(CATS,'','Elegir').replace('<option value="">Elegir</option>','')+'</select></div><div style="flex:1 1 180px"><label for="pz">Ubicación</label><select id="pz">'+opts(ZONAS,'','').replace('<option value="">','<option hidden value="Cercado">')+'</select></div><div style="flex:1 1 120px"><label for="pp">Precio por día (S/)</label><input id="pp" type="number" min="1" required value="30"></div></div><label for="pd">Descripción y condiciones</label><textarea id="pd" rows="3" required placeholder="Estado, accesorios incluidos, requisitos de garantía"></textarea><label>Fotografías (simuladas, mínimo 1)</label><div class="row" id="fotos">'+[0,1,2].map(function(i){return '<button type="button" class="photo'+(S.ph&&S.ph[i]?' f':'')+'" style="flex:1 1 120px" onclick="ph('+i+')" aria-pressed="'+!!(S.ph&&S.ph[i])+'">'+(S.ph&&S.ph[i]?'Foto '+(i+1)+' cargada ✓':'+ Agregar foto '+(i+1))+'</button>'}).join('')+'</div><p class="muted">La publicación básica es gratuita. AlquiTodo cobra 15 % al propietario solo cuando se concreta un alquiler.</p><button class="btn">Publicar</button></form>'}
function ph(i){S.ph=S.ph||[];S.ph[i]=!S.ph[i];render()}
function publicar(){if(!S.ph||!S.ph.some(Boolean)){toast('Agrega al menos una foto (simulada).');return}var id=100+S.pub.length;S.pub.push({id:id,t:$('pt').value,c:$('pc').value,z:$('pz').value,p:+$('pp').value,o:S.u?S.u.n:'Tú',d:$('pd').value,g:0,oc:[]});S.ph=null;toast('Publicación creada y visible en el catálogo.');go('detalle',id)}
function vPerfil(){if(S.u){var v=S.verif;return '<h1>Mi perfil</h1><div class="two"><div class="card"><div class="row"><div class="av" style="width:56px;height:56px;font-size:22px">'+esc(S.u.n[0])+'</div><div><h2 style="margin:0">'+esc(S.u.n)+'</h2><div class="muted">Arequipa · Miembro desde nov. 2026</div></div></div><p>Correo: <b>'+esc(S.u.e)+'</b> '+(v.c?'<span class="tag">verificado</span>':'<span class="tag y">pendiente</span>')+'<br>Teléfono: <b>'+esc(S.u.t)+'</b> '+(v.t?'<span class="tag">verificado</span>':'<span class="tag y">pendiente</span>')+'</p><div class="row">'+(v.c?'':'<button class="btn" onclick="verif(\'c\')">Verificar correo (simulado)</button>')+(v.t?'':'<button class="btn" onclick="verif(\'t\')">Verificar teléfono (código SMS simulado)</button>')+'</div><div class="note">La validación de identidad con documento es una fase posterior.</div><button class="btn sec" style="margin-top:10px" onclick="S.u=null;S.verif={c:false,t:false};go(\'perfil\')">Cerrar sesión</button></div><div class="card"><h2 style="margin-top:0">Mis publicaciones</h2>'+(S.pub.length?S.pub.map(function(p){return '<p>'+esc(p.t)+' · S/ '+p.p+'</p>'}).join(''):'<p class="muted">Aún no has publicado objetos.</p><button class="btn" onclick="go(\'publicar\')">Publicar un objeto</button>')+'</div></div>'}
return '<h1>Registro e ingreso</h1><form class="card fld" style="max-width:480px" onsubmit="event.preventDefault();S.u={n:$(\'rn\').value,e:$(\'re\').value,t:$(\'rt\').value};toast(\'Cuenta creada (simulada).\');go(\'perfil\')"><label for="rn">Nombres y apellidos</label><input id="rn" required value="Valeria Sánchez"><label for="re">Correo electrónico</label><input id="re" type="email" required value="valeria@ejemplo.pe"><label for="rt">Teléfono</label><input id="rt" type="tel" required value="954 123 456" pattern="[0-9 ]{9,11}"><label for="rp">Contraseña</label><input id="rp" type="password" required minlength="6" value="prototipo"><p class="muted">Datos de ejemplo precargados. No se guarda ni envía nada.</p><button class="btn">Crear cuenta</button></form>'}
function verif(k){S.verif[k]=true;toast(k==='c'?'Correo verificado (simulado).':'Teléfono verificado (simulado).');render()}
function vSol(){var h='<h1>Mis solicitudes</h1><div class="row" style="margin-bottom:10px"><button class="btn'+(S.ts==='arr'?' sec':'')+'" onclick="S.ts=\'prop\';render()">Recibidas (soy propietario)</button><button class="btn'+(S.ts==='arr'?'':' sec')+'" onclick="S.ts=\'arr\';render()">Enviadas (soy arrendatario)</button></div>';var t=S.ts==='arr'?'arr':'prop';h+=S.sol.filter(function(s){return s.rol===t}).map(function(s){var p=pr(s.pid),n=s.fin-s.ini+1,tag=s.est==='Pendiente'?'y':s.est==='Aceptada'?'':'r';return '<div class="card" style="margin-bottom:10px"><div class="row sp"><div class="row">'+'<div style="width:90px">'+img(p,60)+'</div><div><b>'+esc(p.t)+'</b><div class="muted">'+(t==='prop'?'Solicita: ':'Propietario: ')+esc(s.who)+' · '+s.ini+(s.fin!==s.ini?'-'+s.fin:'')+' nov. · '+n+' día(s) · S/ '+(n*p.p)+'</div></div></div><span class="tag '+tag+'">'+s.est+'</span></div>'+(t==='prop'&&s.est==='Pendiente'?'<div class="row" style="margin-top:8px"><button class="btn" onclick="resp('+s.id+',\'Aceptada\')">Aceptar</button><button class="btn warn" onclick="resp('+s.id+',\'Rechazada\')">Rechazar</button><button class="btn sec" onclick="chatCon(\''+esc(s.who)+'\','+s.pid+')">Escribir</button></div>':'')+(s.est==='Aceptada'?'<div class="row" style="margin-top:8px"><button class="btn sec" onclick="go(\'estado\')">Registrar estado</button><button class="btn sec" onclick="chatCon(\''+esc(s.who)+'\','+s.pid+')">Chat</button></div>':'')+'</div>'}).join('')||'<p class="card">No hay solicitudes en esta bandeja.</p>';return h}
S.ts='prop';
function resp(id,e){S.sol.forEach(function(s){if(s.id===id)s.est=e});toast('Solicitud '+e.toLowerCase()+'. Se notificó al arrendatario (simulado).');render()}
function vEstado(){var r=S.reg;function blk(k,tt){return '<div class="card"><h2 style="margin-top:0">'+tt+'</h2><div class="photo'+(r[k]?' f':'')+'" style="height:160px">'+(r[k]?'Foto registrada ✓<br>'+(k==='antes'?'Entrega: 20 nov., 5:02 p. m.':'Devolución: 21 nov., 6:15 p. m.'):'Sin foto')+'</div><button class="btn'+(r[k]?' sec':'')+'" style="margin-top:8px" onclick="S.reg.'+k+'=!S.reg.'+k+';render()">'+(r[k]?'Quitar foto simulada':'Tomar/subir foto (simulado)')+'</button><label for="n'+k+'">Observaciones</label><input id="n'+k+'" style="width:100%" placeholder="Rayones, accesorios, nivel de batería..."></div>'}return '<h1>Registro fotográfico del estado</h1><p class="muted">Alquiler: Parlante JBL PartyBox 310, Lucía Mamani. Las fotos antes y después sirven de evidencia en caso de incidencias.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">'+blk('antes','Antes de la entrega')+blk('desp','Después de la devolución')+'</div>'+(r.antes&&r.desp?'<div class="note">Ambos registros completos. Sin diferencias reportadas: se puede cerrar el alquiler y calificar.<br><button class="btn" style="margin-top:6px" onclick="go(\'calif\')">Calificar experiencia</button></div>':'<div class="note">Completa ambos registros para cerrar la operación.</div>')+'<div class="card" style="margin-top:12px"><b>¿Hubo un problema?</b> <button class="btn sec" onclick="toast(\'Incidencia registrada (simulado). El equipo de AlquiTodo se comunicará.\')">Reportar incidencia</button></div>'}
function vCalif(){var s=S.stars;return '<h1>Calificaciones</h1><div class="two"><div class="card"><h2 style="margin-top:0">Califica tu último alquiler</h2><p class="muted">Parlante JBL PartyBox 310, Lucía Mamani</p><div class="stars" role="radiogroup" aria-label="Puntuación">'+[1,2,3,4,5].map(function(i){return '<button class="'+(i<=s?'on':'')+'" onclick="S.stars='+i+';render()" role="radio" aria-checked="'+(i===s)+'" aria-label="'+i+' estrellas">★</button>'}).join('')+'</div><label for="cm" style="font-weight:600">Comentario</label><textarea id="cm" rows="3" style="width:100%" placeholder="Cuéntanos cómo fue la experiencia"></textarea><button class="btn" style="margin-top:8px" onclick="if(!S.stars){toast(\'Elige una puntuación.\');return}S.res.unshift([S.u?S.u.n.split(\' \')[0]:\'Tú\',S.stars,$(\'cm\').value||\'Sin comentario\']);S.stars=0;toast(\'Gracias por tu calificación.\');render()">Enviar</button></div><div class="card"><h2 style="margin-top:0">Reseñas recientes</h2>'+S.res.map(function(r){return '<p><b>'+esc(r[0])+'</b> <span style="color:#f59e0b" aria-label="'+r[1]+' de 5">'+'★'.repeat(r[1])+'</span><br>'+esc(r[2])+'</p>'}).join('')+'</div></div>'}
function vBuzon(){var c=S.chats.filter(function(x){return x.id===S.cc})[0]||S.chats[0];if(c)c.un=0;nav();var h='<h1>Buzón de mensajes</h1><div class="chat"><div class="card list" role="list" aria-label="Conversaciones">'+S.chats.map(function(x){var l=x.m[x.m.length-1];return '<div class="item'+(c&&x.id===c.id?' on':'')+'" role="listitem" tabindex="0" onclick="S.cc='+x.id+';render()" onkeydown="if(event.key===\'Enter\')this.click()"><div class="av">'+x.n[0]+'</div><div style="flex:1;min-width:0"><div class="row sp"><b>'+esc(x.n)+'</b>'+(x.un?'<span class="badge">'+x.un+'</span>':'')+'</div><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(l?esc(l[1]):'Sin mensajes')+'</div></div></div>'}).join('')+'</div>';if(!c)return h+'<div class="card">Sin conversaciones.</div></div>';var p=pr(c.pid);return h+'<div class="card win"><div class="row" style="padding:10px;border-bottom:1px solid var(--b)"><div class="av">'+c.n[0]+'</div><div><b>'+esc(c.n)+'</b><div class="muted">Sobre: '+esc(p?p.t:'')+'</div></div></div><div class="msgs" id="msgs" aria-live="polite">'+c.m.map(function(m){return '<div class="m'+(m[0]==='me'?' me':'')+'">'+esc(m[1])+'<small>'+m[2]+'</small></div>'}).join('')+'</div><form class="send" onsubmit="event.preventDefault();envio()"><label class="sr" for="mi">Mensaje</label><input id="mi" placeholder="Escribe un mensaje..." autocomplete="off"><button class="btn">Enviar</button></form></div></div><div class="note">Chat interno: la coordinación de entrega y devolución se hace dentro de la plataforma, sin compartir datos personales.</div>'}
function envio(){var i=$('mi'),v=i.value.trim();if(!v)return;var c=S.chats.filter(function(x){return x.id===S.cc})[0];c.m.push(['me',v,'Ahora']);render();var m=$('msgs');m.scrollTop=m.scrollHeight;setTimeout(function(){c.m.push(['o','Gracias, lo reviso y te confirmo en breve.','Ahora']);if(S.view==='buzon'&&S.cc===c.id){render();var m=$('msgs');if(m)m.scrollTop=m.scrollHeight}else{c.un++;nav()}},1800)}
function render(){var V={inicio:vInicio,catalogo:vCatalogo,detalle:vDetalle,publicar:vPublicar,perfil:vPerfil,solicitudes:vSol,estado:vEstado,calif:vCalif,buzon:vBuzon};$('app').innerHTML=V[S.view]();nav();var m=$('msgs');if(m)m.scrollTop=m.scrollHeight}
S.cc=1;render();
</script>
</body>
</html>
