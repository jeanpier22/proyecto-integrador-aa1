<!doctype html>
<html lang="es">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stockly - Prototipo referencial</title>
<style>
:root{--p:#5b45d6;--p2:#ede9ff;--p3:#f6f4ff;--tx:#1d1b2e;--mu:#5d5a73;--bd:#dcd8ee;--bg:#f3f1fb;--card:#fff;--ok:#0b6b3a;--okb:#dcf5e6;--er:#a3202a;--erb:#fde2e4;--wa:#fff1cc;--wt:#7a5200}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;padding-top:34px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1f5fd6;outline-offset:2px}
.strip{position:fixed;top:0;left:0;right:0;height:34px;background:#2b2550;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8px;z-index:50;line-height:1.2}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--p)}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--p);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;left:6px;top:7px;width:14px;height:12px;border:2px solid #fff;border-radius:3px}
.modes{display:flex;gap:4px;background:var(--p2);padding:3px;border-radius:10px}
.modes button{border:0;background:transparent;padding:7px 10px;border-radius:8px;color:var(--p);font-weight:600}
.modes button[aria-pressed=true]{background:var(--p);color:#fff}
.shell{display:flex;min-height:calc(100vh - 34px - 55px)}
nav.side{width:210px;background:var(--card);border-right:1px solid var(--bd);padding:12px;display:flex;flex-direction:column;gap:4px}
nav.side button,nav.bot button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;color:var(--tx);font-weight:600;display:flex;gap:8px;align-items:center}
nav button[aria-current=page]{background:var(--p2);color:var(--p)}
nav button .n{margin-left:auto;background:var(--er);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px}
nav.bot{display:none}
main{flex:1;padding:16px;max-width:980px;margin:0 auto;width:100%}
h1{font-size:21px;margin:0 0 4px}h2{font-size:17px;margin:18px 0 8px}
.sub{color:var(--mu);margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.kpi{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;font-family:inherit;color:inherit}
.kpi b{font-size:26px}.kpi span{color:var(--mu);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.em{width:38px;height:38px;border-radius:10px;background:var(--p3);display:grid;place-items:center;font-size:21px;flex:none}
.grow{flex:1;min-width:0}.grow small{color:var(--mu);display:block}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b-ok{background:var(--okb);color:var(--ok)}.b-er{background:var(--erb);color:var(--er)}.b-wa{background:var(--wa);color:var(--wt)}.b-in{background:var(--p2);color:var(--p)}
.btn{border:0;background:var(--p);color:#fff;padding:9px 14px;border-radius:10px;font-weight:700}
.btn.sec{background:var(--p2);color:var(--p)}.btn.sm{padding:6px 10px;font-size:13px}
.btn.wa{background:#0b7a3b}
input,select,textarea{border:1px solid #8d88a8;border-radius:10px;padding:9px 10px;background:#fff;color:var(--tx);width:100%}
label{display:block;font-weight:600;font-size:13px;margin:8px 0 3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 12px;font-weight:600;color:var(--mu)}
.chips button[aria-pressed=true]{background:var(--p);color:#fff;border-color:var(--p)}
.flash{animation:fl 1.4s}
@keyframes fl{0%{background:#c9f2d9}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:2px solid #0b7a3b}}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#1d1b2e;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw}
.dlg{position:fixed;inset:34px 0 0 0;background:rgba(20,15,50,.5);display:grid;place-items:center;z-index:40;padding:12px}
.dlg .card{width:min(440px,100%);max-height:90vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:700}td.r,th.r{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:2px solid var(--bd);background:#fff;border-radius:10px;padding:10px;font-weight:700}
.seg button[aria-pressed=true]{border-color:var(--p);background:var(--p2);color:var(--p)}
.login{max-width:380px;margin:6vh auto;text-align:center}
.cat{max-width:480px;margin:0 auto}
.hero{background:linear-gradient(135deg,#7b66f0,#4a35c4);color:#fff;border-radius:16px;padding:16px;margin-bottom:10px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{text-align:center}.pc .em{width:64px;height:64px;font-size:36px;margin:0 auto 6px}
.qty{display:inline-flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:#fff;font-weight:800}
.scan{border:2px dashed var(--p);border-radius:14px;padding:18px;text-align:center;background:var(--p3)}
.note{font-size:12px;color:var(--mu)}
.chart{width:100%;height:auto}
@media (max-width:760px){
 nav.side{display:none}
 nav.bot{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);z-index:30;justify-content:space-around;padding:4px;overflow-x:auto}
 nav.bot button{flex-direction:column;gap:0;font-size:11px;padding:6px 8px;text-align:center;position:relative;min-width:56px;align-items:center}
 nav.bot button .ic{font-size:19px}
 nav.bot button .n{position:absolute;top:0;right:4px;margin:0;font-size:10px}
 main{padding:12px 12px 84px}
 .grid2{grid-template-columns:1fr}
 .modes button{padding:7px 8px;font-size:13px}
}
</style>
</head>
<body>
<div class="strip" role="note">Prototipo referencial elaborado a partir del MVP del grupo; no es el producto final. Datos ficticios.</div>
<header class="top">
 <div class="logo"><i aria-hidden="true"></i>stockly</div>
 <div class="modes" role="group" aria-label="Vista">
  <button id="mB" aria-pressed="true">Bodeguero</button>
  <button id="mC" aria-pressed="false">Cliente</button>
 </div>
</header>
<div id="app"></div>
<div id="live" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
var S={
 mode:'B',auth:false,view:'inicio',cat:'Todos',q:'',vf:'todos',
 prods:[
  {id:1,n:'Arroz Costeño 1 kg',e:'🍚',c:'Abarrotes',p:4.5,s:25,min:10,v:'2027-06-12'},
  {id:2,n:'Leche Gloria evaporada',e:'🥛',c:'Abarrotes',p:4.2,s:4,min:10,v:'2026-11-25'},
  {id:3,n:'Aceite Primor 1 L',e:'🛢️',c:'Abarrotes',p:8.9,s:6,min:8,v:'2027-03-01'},
  {id:4,n:'Galletas Soda Field',e:'🍪',c:'Snacks',p:2.0,s:19,min:8,v:'2026-11-18'},
  {id:5,n:'Detergente Bolívar 500 g',e:'🧴',c:'Limpieza',p:7.9,s:12,min:6,v:'2028-01-01'},
  {id:6,n:'Papel higiénico Suave x4',e:'🧻',c:'Limpieza',p:6.0,s:20,min:6,v:'2029-01-01'},
  {id:7,n:'Fideos Don Vittorio 500 g',e:'🍝',c:'Abarrotes',p:3.2,s:3,min:10,v:'2027-02-10'},
  {id:8,n:'Gaseosa Inca Kola 600 ml',e:'🥤',c:'Snacks',p:3.5,s:30,min:12,v:'2027-01-20'},
  {id:9,n:'Azúcar rubia 1 kg',e:'🍬',c:'Abarrotes',p:4.1,s:15,min:8,v:'2027-09-30'},
  {id:10,n:'Atún Florida lata',e:'🐟',c:'Abarrotes',p:5.8,s:9,min:6,v:'2026-11-30'}
 ],
 orders:[
  {id:101,cli:'Rosa Quispe',tel:'959 123 456',it:[[1,2],[2,1]],est:'Nuevo',h:'Hoy 08:40'},
  {id:102,cli:'Luis Mamani',tel:'954 778 210',it:[[8,3],[4,2]],est:'Preparando',h:'Hoy 07:55'}
 ],
 sales:[],cart:{},next:200,hoy:'2026-11-11',
 mov:{pid:1,tipo:'Entrada',qty:50,motivo:'Compra / Reposición'},
 flash:null,boleta:null,cliOk:null
};
var $=function(s,r){return (r||document).querySelector(s)};
var money=function(n){return 'S/ '+n.toFixed(2)};
var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function prod(id){return S.prods.filter(function(p){return p.id==id})[0]}
function days(v){return Math.round((new Date(v)-new Date(S.hoy))/864e5)}
function low(){return S.prods.filter(function(p){return p.s<=p.min})}
function exp(){return S.prods.filter(function(p){return days(p.v)<=30})}
function nNew(){return S.orders.filter(function(o){return o.est=='Nuevo'}).length}
function say(m){var t=$('#live');t.textContent=m;t.hidden=false;clearTimeout(say.t);say.t=setTimeout(function(){t.hidden=true},3200)}
function stBadge(p){return p.s<=p.min?'<span class="badge b-er">Stock: '+p.s+'</span>':'<span class="badge b-ok">Stock: '+p.s+'</span>'}
function ordTotal(o){return o.it.reduce(function(a,x){return a+prod(x[0]).p*x[1]},0)}

var NAV=[['inicio','🏠','Inicio'],['productos','📦','Productos'],['mov','🔄','Movimiento'],['alertas','🔔','Alertas'],['pedidos','🧾','Pedidos'],['venta','📷','Boleta'],['reportes','📊','Reportes'],['catalogo','🔗','Catálogo']];
function go(v){S.view=v;render();window.scrollTo(0,0)}
window.__go=go;

function render(){
 $('#mB').setAttribute('aria-pressed',S.mode=='B');$('#mC').setAttribute('aria-pressed',S.mode=='C');
 var h;
 if(S.mode=='C'){h='<main>'+cliente()+'</main>'}
 else if(!S.auth){h='<main>'+login()+'</main>'}
 else{
  var nb=function(c){return NAV.map(function(n){var b=n[0]=='alertas'?low().length+exp().length:n[0]=='pedidos'?nNew():0;return '<button data-go="'+n[0]+'"'+(S.view==n[0]?' aria-current="page"':'')+'><span class="ic" aria-hidden="true">'+n[1]+'</span>'+n[2]+(b?'<span class="n" aria-label="'+b+' pendientes">'+b+'</span>':'')+'</button>'}).join('')};
  h='<div class="shell"><nav class="side" aria-label="Principal">'+nb()+'<button data-act="salir" style="margin-top:auto">↩ Salir</button></nav><main>'+vista()+'</main></div><nav class="bot" aria-label="Principal">'+nb()+'</nav>';
 }
 $('#app').innerHTML=h;
}
function login(){return '<div class="card login"><div class="logo" style="justify-content:center;margin-bottom:8px"><i aria-hidden="true"></i>stockly</div><h1>Ingresa a tu bodega</h1><p class="sub">Credenciales por negocio (simulado)</p><form id="fl" style="text-align:left"><label for="u">Usuario</label><input id="u" value="bodega.laesquina" autocomplete="off"><label for="pw">Contraseña</label><input id="pw" type="password" value="demo1234" autocomplete="off"><p style="margin:14px 0 0"><button class="btn" style="width:100%">Ingresar</button></p></form><p class="note">Cualquier dato funciona en este prototipo.</p></div>'}

function vista(){return({inicio:inicio,productos:productos,mov:movimiento,alertas:alertas,pedidos:pedidos,venta:venta,reportes:reportes,catalogo:catalogoCfg})[S.view]()}

function inicio(){
 var tot=S.prods.reduce(function(a,p){return a+p.s},0);
 return '<h1>¡Hola, María!</h1><p class="sub">Aquí tienes el resumen de tu bodega. Bodega La Esquina · Plan básico</p><div class="cards">'+
 '<div class="card"><button class="btn sec kpi" data-go="productos"><b>'+S.prods.length+'</b><span>Productos ('+tot+' unid.)</span></button></div>'+
 '<div class="card"><button class="btn sec kpi" data-go="pedidos"><b>'+nNew()+'</b><span>Pedidos nuevos</span></button></div>'+
 '<div class="card"><button class="btn sec kpi" data-go="alertas"><b>'+(low().length+exp().length)+'</b><span>Alertas de stock</span></button></div>'+
 '<div class="card"><button class="btn sec kpi" data-go="reportes"><b>Ver</b><span>reportes</span></button></div></div>'+
 '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Stock bajo</h2><button class="btn sm sec" data-go="alertas">Ver todos</button></div>'+
 (low().slice(0,4).map(function(p){return '<div class="item"><span class="em" aria-hidden="true">'+p.e+'</span><div class="grow">'+esc(p.n)+'<small>Quedan '+p.s+' unidades</small></div><span class="badge b-er">Bajo</span></div>'}).join('')||'<p class="note">Sin productos con stock bajo.</p>')+'</div>'+
 '<div class="row" style="margin-top:12px"><button class="btn" data-go="mov">Registrar movimiento</button><button class="btn sec" data-go="venta">Registrar venta por boleta</button></div>'
}

function productos(){
 var L=S.prods.filter(function(p){return (S.cat=='Todos'||p.c==S.cat)&&p.n.toLowerCase().indexOf(S.q.toLowerCase())>-1});
 return '<div class="row" style="justify-content:space-between"><div><h1>Productos</h1><p class="sub">Lista y gestión de tu inventario</p></div><button class="btn" data-act="nuevo">+ Agregar producto</button></div>'+
 '<label for="bq" class="note">Buscar producto</label><input id="bq" type="search" placeholder="Buscar producto..." value="'+esc(S.q)+'">'+
 '<div class="chips" role="group" aria-label="Categoría">'+['Todos','Abarrotes','Snacks','Limpieza'].map(function(c){return '<button data-cat="'+c+'" aria-pressed="'+(S.cat==c)+'">'+c+'</button>'}).join('')+'</div>'+
 '<div class="card" id="lp">'+(L.map(function(p){return '<div class="item'+(S.flash==p.id?' flash':'')+'"><span class="em" aria-hidden="true">'+p.e+'</span><div class="grow">'+esc(p.n)+'<small>'+money(p.p)+' · '+p.c+' · vence '+p.v+'</small></div>'+stBadge(p)+'<span class="qty"><button data-dec="'+p.id+'" aria-label="Restar 1 a '+esc(p.n)+'">−</button><button data-inc="'+p.id+'" aria-label="Sumar 1 a '+esc(p.n)+'">+</button></span><button class="btn sm sec" data-edit="'+p.id+'">Editar</button></div>'}).join('')||'<p class="note">Sin resultados.</p>')+'</div>'
}
function dlgProd(p){
 var n=!p;p=p||{n:'',e:'📦',c:'Abarrotes',p:'',s:0,min:5,v:'2027-12-31'};
 return '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><form class="card" id="fp" data-id="'+(n?'':p.id)+'"><h2 id="dt" style="margin-top:0">'+(n?'Agregar producto':'Editar producto')+'</h2>'+
 '<label for="f1">Nombre</label><input id="f1" required value="'+esc(p.n)+'"><div class="grid2"><div><label for="f2">Precio (S/)</label><input id="f2" type="number" step="0.1" min="0" required value="'+p.p+'"></div><div><label for="f3">Stock</label><input id="f3" type="number" min="0" required value="'+p.s+'"></div><div><label for="f4">Stock mínimo</label><input id="f4" type="number" min="0" value="'+p.min+'"></div><div><label for="f5">Vence</label><input id="f5" type="date" value="'+p.v+'"></div></div><label for="f6">Categoría</label><select id="f6">'+['Abarrotes','Snacks','Limpieza'].map(function(c){return '<option'+(c==p.c?' selected':'')+'>'+c+'</option>'}).join('')+'</select>'+
 '<p class="row" style="margin-bottom:0"><button class="btn">Guardar</button><button type="button" class="btn sec" data-act="cerrar">Cancelar</button></p></form></div>'
}

function movimiento(){
 var m=S.mov,p=prod(m.pid);
 return '<h1>Nuevo movimiento</h1><p class="sub">Registra entradas, salidas o ajustes de forma rápida.</p><form id="fm" class="card" style="max-width:520px"><label for="mp">Producto</label><select id="mp">'+S.prods.map(function(x){return '<option value="'+x.id+'"'+(x.id==m.pid?' selected':'')+'>'+esc(x.n)+' (stock '+x.s+')</option>'}).join('')+'</select>'+
 '<label>Tipo de movimiento</label><div class="seg">'+['Entrada','Salida','Ajuste'].map(function(t){return '<button type="button" data-tipo="'+t+'" aria-pressed="'+(m.tipo==t)+'">'+({Entrada:'⬇ ',Salida:'⬆ ',Ajuste:'✎ '})[t]+t+'</button>'}).join('')+'</div>'+
 '<label for="mq">Cantidad'+(m.tipo=='Ajuste'?' (nuevo stock)':'')+'</label><input id="mq" type="number" min="0" value="'+m.qty+'"><label for="mm">Motivo</label><select id="mm">'+['Compra / Reposición','Venta','Merma o vencimiento','Conteo físico'].map(function(x){return '<option'+(x==m.motivo?' selected':'')+'>'+x+'</option>'}).join('')+'</select>'+
 '<p><button class="btn" style="width:100%">Guardar movimiento</button></p><p class="note" style="margin:0">Stock actual de '+esc(p.n)+': '+p.s+' unidades.</p></form>'
}

function alertas(){
 var l=low(),e=exp().sort(function(a,b){return days(a.v)-days(b.v)});
 return '<h1>Alertas de stock</h1><p class="sub">Notificaciones de productos con stock bajo o próximos a vencer.</p><h2>Stock bajo ('+l.length+')</h2><div class="card">'+(l.map(function(p){return '<div class="item"><span class="em" aria-hidden="true">'+p.e+'</span><div class="grow">'+esc(p.n)+'<small>Quedan '+p.s+' unidades (mínimo '+p.min+')</small></div><button class="btn sm" data-rep="'+p.id+'">Reponer +'+(p.min*2)+'</button></div>'}).join('')||'<p class="note">Todo en orden.</p>')+'</div><h2>Próximos a vencer ('+e.length+')</h2><div class="card">'+(e.map(function(p){var d=days(p.v);return '<div class="item"><span class="em" aria-hidden="true">'+p.e+'</span><div class="grow">'+esc(p.n)+'<small>Vence '+p.v+' · '+p.s+' unid.</small></div><span class="badge '+(d<=7?'b-er':'b-wa')+'">'+(d<0?'Vencido':d+' días')+'</span></div>'}).join('')||'<p class="note">Sin vencimientos próximos.</p>')+'</div><p class="note">Umbral de vencimiento: 30 días. El stock mínimo se configura por producto.</p>'
}

function pedidos(){
 return '<h1>Bandeja de pedidos</h1><p class="sub">Pedidos recibidos desde tu catálogo web.</p>'+(S.orders.map(function(o){
  var cls=o.est=='Nuevo'?'b-in':o.est=='Preparando'?'b-wa':'b-ok';
  return '<div class="card'+(S.flash=='o'+o.id?' flash':'')+'" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>Pedido #'+o.id+' · '+esc(o.cli)+'</b><span class="badge '+cls+'">'+o.est+'</span></div><p class="note" style="margin:2px 0 6px">'+o.h+' · Tel. '+esc(o.tel)+'</p>'+o.it.map(function(x){return '<div>'+x[1]+' × '+esc(prod(x[0]).n)+' — '+money(prod(x[0]).p*x[1])+'</div>'}).join('')+'<p><b>Total: '+money(ordTotal(o))+'</b></p><div class="row">'+(o.est=='Nuevo'?'<button class="btn sm" data-ost="'+o.id+'|Preparando">Aceptar y preparar</button>':'')+(o.est=='Preparando'?'<button class="btn sm" data-ost="'+o.id+'|Entregado">Marcar entregado</button>':'')+'</div></div>'}).join(''))
}

function venta(){
 var b=S.boleta;
 var h='<h1>Registrar venta por boleta</h1><p class="sub">Simulación de lectura de boleta: no usa IA real.</p><div class="card"><div class="scan"><div style="font-size:34px" aria-hidden="true">🧾</div><p>Toma o sube una foto de la boleta</p><button class="btn" data-act="leer">Simular lectura de boleta</button></div></div>';
 if(b){h+='<h2>Productos detectados</h2><div class="card"><table><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Monto</th></tr>'+b.map(function(x){return '<tr><td>'+esc(prod(x[0]).n)+'</td><td class="r">'+x[1]+'</td><td class="r">'+money(prod(x[0]).p*x[1])+'</td></tr>'}).join('')+'<tr><th>Total</th><th></th><th class="r">'+money(b.reduce(function(a,x){return a+prod(x[0]).p*x[1]},0))+'</th></tr></table><p><button class="btn" data-act="confvta">Confirmar y descontar stock</button></p></div>'}
 if(S.sales.length)h+='<h2>Ventas registradas hoy</h2><div class="card">'+S.sales.map(function(v){return '<div class="item"><div class="grow">'+v.h+' · '+v.n+' productos</div><b>'+money(v.t)+'</b></div>'}).join('')+'</div>';
 return h
}

function reportes(){
 var d=[['Lun',180],['Mar',150],['Mié',210],['Jue',170],['Vie',260],['Sáb',310],['Dom',240]];
 var extra=S.sales.reduce(function(a,v){return a+v.t},0);d=d.map(function(x,i){return i==6?[x[0],x[1]+extra]:x});
 var mx=Math.max.apply(null,d.map(function(x){return x[1]}));
 var svg='<svg class="chart" viewBox="0 0 420 200" role="img" aria-label="Ventas por día de la semana en soles">'+d.map(function(x,i){var hh=x[1]/mx*140;return '<rect x="'+(18+i*57)+'" y="'+(160-hh)+'" width="38" height="'+hh+'" rx="6" fill="#5b45d6"/><text x="'+(37+i*57)+'" y="'+(154-hh)+'" text-anchor="middle" font-size="12" fill="#1d1b2e">'+x[1]+'</text><text x="'+(37+i*57)+'" y="182" text-anchor="middle" font-size="12" fill="#5d5a73">'+x[0]+'</text>'}).join('')+'<line x1="10" y1="160" x2="410" y2="160" stroke="#8d88a8"/></svg>';
 var tot=d.reduce(function(a,x){return a+x[1]},0);
 var top=[['Inca Kola 600 ml',64,224],['Arroz Costeño 1 kg',52,234],['Leche Gloria evaporada',47,197.4],['Aceite Primor 1 L',31,275.9],['Galletas Soda Field',58,116]];
 return '<h1>Reportes de ventas</h1><p class="sub">Semana del 03 al 09 de noviembre (datos ficticios)</p><div class="cards"><div class="card"><div class="kpi"><b>'+money(tot)+'</b><span>Ventas de la semana</span></div></div><div class="card"><div class="kpi"><b>'+S.orders.length+'</b><span>Pedidos por catálogo</span></div></div></div><div class="card"><h2 style="margin-top:0">Ventas por día (S/)</h2>'+svg+'</div><h2>Productos más vendidos</h2><div class="card"><table><tr><th>Producto</th><th class="r">Unid.</th><th class="r">Monto</th></tr>'+top.map(function(t){return '<tr><td>'+t[0]+'</td><td class="r">'+t[1]+'</td><td class="r">'+money(t[2])+'</td></tr>'}).join('')+'</table></div><h2>Movimientos recientes</h2><div class="card"><p class="note" style="margin:0">'+(S.movs&&S.movs.length?S.movs.join('<br>'):'Aún no registraste movimientos en esta sesión.')+'</p></div>'
}

function catalogoCfg(){
 var link='https://stockly.example/c/bodega-la-esquina';
 var msg='¡Hola! Mira el catálogo de Bodega La Esquina y haz tu pedido: '+link;
 return '<h1>Catálogo web</h1><p class="sub">Se genera con los productos que registraste. Compártelo por WhatsApp.</p><div class="card" style="max-width:520px"><label for="lk">Enlace de tu catálogo</label><input id="lk" readonly value="'+link+'"><p class="row"><button class="btn sec" data-act="copiar">Copiar enlace</button><a class="btn wa" style="text-decoration:none" href="https://wa.me/?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">Compartir por WhatsApp</a><button class="btn" data-act="vercli">Ver como cliente</button></p><p class="note">En el prototipo, el botón de WhatsApp solo abre el mensaje con el enlace de ejemplo.</p></div>'
}

/* Cliente */
function cliente(){
 if(S.cliOk){var o=S.cliOk;return '<div class="cat card"><h1>¡Pedido enviado!</h1><p>Tu pedido #'+o.id+' llegó a Bodega La Esquina. Te confirmarán la disponibilidad.</p><p><b>Total: '+money(ordTotal(o))+'</b></p><button class="btn" data-act="otro">Hacer otro pedido</button></div>'}
 var L=S.prods.filter(function(p){return (S.cat=='Todos'||p.c==S.cat)&&p.n.toLowerCase().indexOf(S.q.toLowerCase())>-1});
 var cnt=0,tot=0;for(var k in S.cart){cnt+=S.cart[k];tot+=S.cart[k]*prod(k).p}
 var h='<div class="cat"><div class="hero"><div style="font-size:12px;opacity:.9">Catálogo digital</div><h1 style="margin:2px 0">Bodega La Esquina</h1><div>Tus productos de siempre, más cerca de ti.</div></div>'+
 '<label for="bq" class="note">Buscar producto</label><input id="bq" type="search" placeholder="Buscar producto..." value="'+esc(S.q)+'"><div class="chips" role="group" aria-label="Categoría">'+['Todos','Abarrotes','Snacks','Limpieza'].map(function(c){return '<button data-cat="'+c+'" aria-pressed="'+(S.cat==c)+'">'+c+'</button>'}).join('')+'</div><div class="pg">'+
 L.map(function(p){var a=p.s>0;return '<div class="card pc"><div class="em" aria-hidden="true">'+p.e+'</div><div style="min-height:40px">'+esc(p.n)+'</div><b>'+money(p.p)+'</b><div><span class="badge '+(a?'b-ok':'b-er')+'">'+(a?'Disponible':'Agotado')+'</span></div><p style="margin:8px 0 0"><button class="btn sm" data-add="'+p.id+'"'+(a?'':' disabled')+'>+ Agregar</button></p></div>'}).join('')+'</div>';
 if(cnt){
  h+='<h2>Tu pedido</h2><div class="card">'+Object.keys(S.cart).map(function(k){var p=prod(k);return '<div class="item"><span class="em" aria-hidden="true">'+p.e+'</span><div class="grow">'+esc(p.n)+'<small>'+money(p.p)+'</small></div><span class="qty"><button data-cd="'+k+'" aria-label="Quitar uno">−</button><b>'+S.cart[k]+'</b><button data-ci="'+k+'" aria-label="Agregar uno">+</button></span></div>'}).join('')+
  '<form id="fo"><label for="cn">Tu nombre</label><input id="cn" required value="Rosa Quispe"><label for="ct">Celular</label><input id="ct" required value="959 123 456"><label for="cx">Notas (opcional)</label><textarea id="cx" rows="2" placeholder="Ej.: Entregar por la tarde"></textarea><p><b>Total: '+money(tot)+'</b></p><button class="btn wa" style="width:100%">Enviar pedido ('+cnt+' productos)</button><p class="note">El pedido llega a la bandeja de la bodega y también puedes enviarlo por WhatsApp.</p></form></div>'}
 return h+'</div>'
}

/* eventos */
document.addEventListener('click',function(e){
 var t=e.target.closest('button,a');if(!t)return;
 var d=t.dataset;
 if(t.id=='mB'){S.mode='B';render();return}
 if(t.id=='mC'){S.mode='C';S.cat='Todos';S.q='';S.cliOk=null;render();return}
 if(d.go){go(d.go);return}
 if(d.cat){S.cat=d.cat;render();return}
 if(d.inc||d.dec){var p=prod(d.inc||d.dec);p.s=Math.max(0,p.s+(d.inc?1:-1));S.flash=p.id;render();say(p.n+': stock '+p.s);return}
 if(d.edit){mount(dlgProd(prod(d.edit)));return}
 if(d.rep){var r=prod(d.rep);r.s+=r.min*2;S.flash=r.id;render();say(r.n+' repuesto. Stock: '+r.s);return}
 if(d.tipo){S.mov.tipo=d.tipo;S.mov.qty=$('#mq').value;S.mov.pid=$('#mp').value;S.mov.motivo=$('#mm').value;render();return}
 if(d.ost){var a=d.ost.split('|');S.orders.filter(function(o){return o.id==a[0]})[0].est=a[1];S.flash='o'+a[0];render();say('Pedido #'+a[0]+': '+a[1]);return}
 if(d.add){S.cart[d.add]=(S.cart[d.add]||0)+1;render();say('Agregado al pedido');return}
 if(d.ci){S.cart[d.ci]++;render();return}
 if(d.cd){S.cart[d.cd]--;if(S.cart[d.cd]<=0)delete S.cart[d.cd];render();return}
 switch(d.act){
  case 'salir':S.auth=false;render();break;
  case 'nuevo':mount(dlgProd());break;
  case 'cerrar':unmount();break;
  case 'leer':S.boleta=[[8,2],[1,1],[4,3]];render();say('Boleta leída (simulado)');break;
  case 'confvta':var t2=0,n=0;S.boleta.forEach(function(x){var p=prod(x[0]);p.s=Math.max(0,p.s-x[1]);t2+=p.price||p.p*x[1];n+=x[1]});S.sales.push({h:'Ahora',n:n,t:t2});S.boleta=null;render();say('Venta registrada: '+money(t2)+'. Stock actualizado.');break;
  case 'copiar':var i=$('#lk');i.select();try{navigator.clipboard.writeText(i.value)}catch(x){}say('Enlace copiado');break;
  case 'vercli':S.mode='C';S.cat='Todos';S.q='';render();break;
  case 'otro':S.cliOk=null;S.cart={};render();break;
 }
});
document.addEventListener('input',function(e){
 if(e.target.id=='bq'){S.q=e.target.value;var pos=e.target.selectionStart;render();var i=$('#bq');i.focus();i.setSelectionRange(pos,pos)}
});
document.addEventListener('change',function(e){if(e.target.id=='mp'){S.mov.pid=e.target.value;S.mov.qty=$('#mq').value;S.mov.tipo=S.mov.tipo;render()}});
document.addEventListener('keydown',function(e){if(e.key=='Escape'&&$('.dlg'))unmount()});
document.addEventListener('submit',function(e){
 e.preventDefault();var f=e.target;
 if(f.id=='fl'){S.auth=true;S.view='inicio';render();say('Bienvenida, María');return}
 if(f.id=='fp'){var id=f.dataset.id,o=id?prod(id):{id:S.next++,e:'📦'};o.n=$('#f1').value;o.p=parseFloat($('#f2').value);o.s=parseInt($('#f3').value,10);o.min=parseInt($('#f4').value,10)||0;o.v=$('#f5').value||'2030-01-01';o.c=$('#f6').value;if(!id)S.prods.unshift(o);S.flash=o.id;unmount();render();say(id?'Producto actualizado':'Producto agregado');return}
 if(f.id=='fm'){var m={pid:parseInt($('#mp').value,10),q:parseInt($('#mq').value,10)||0},p=prod(m.pid),tipo=S.mov.tipo,bef=p.s;
  if(tipo=='Entrada')p.s+=m.q;else if(tipo=='Salida')p.s=Math.max(0,p.s-m.q);else p.s=m.q;
  (S.movs=S.movs||[]).unshift(tipo+': '+p.n+' ('+bef+' → '+p.s+')');S.mov.pid=m.pid;S.flash=p.id;S.view='productos';render();say(tipo+' guardada: '+p.n+' ahora tiene '+p.s+' unidades');return}
 if(f.id=='fo'){var it=Object.keys(S.cart).map(function(k){return [parseInt(k,10),S.cart[k]]});var o2={id:S.next++,cli:$('#cn').value,tel:$('#ct').value,it:it,est:'Nuevo',h:'Ahora'};S.orders.unshift(o2);S.cart={};S.cliOk=o2;render();return}
});
function mount(h){unmount();var d=document.createElement('div');d.id='dm';d.innerHTML=h;document.body.appendChild(d);var i=d.querySelector('input');if(i)i.focus()}
function unmount(){var d=$('#dm');if(d)d.remove()}
render();
})();
</script>
</body>
</html>
