<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-mamani-denos-vargas-mancha", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "RENACER: servicio de educación emocional y autoconocimiento para adultos de Arequipa", "grupo": "Grupo 06", "seccion": "394", "fecha": "04/11/2026 (3.ª versión; Cap. 1 corregido el 06/11/2026)", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Gustavo Adolfo Mamani Chambilla", "Roxana Lisseth Denos Mamani", "Luz Mery Vargas Chumbes", "Steyci Mancha Chumbes"], "dictamen": "menor", "resumen": "Esta tercera versión (caps. 2 y 3 del 04/11/2026) resolvió los problemas más graves de la anterior: el mapa de empatía de varones ya corresponde a RENACER, el BMC es legible y completo (Figura 4, p. 58), Mayahuasca deja de ser proveedor y pasa a ser un competidor indirecto (3.3.4.1), los competidores directos ahora son servicios de psicología con precios y fuentes (3.3.1 a 3.3.3) y el segmento se acota a jóvenes de 18 a 35 años (2.5). El Capítulo 1, reenviado y corregido el 06/11/2026, subsana la mayor parte de los vacíos señalados: separa el problema del cliente (1.1, con necesidades, causas, consecuencias en la Tabla 1, árbol y definición) del problema social (1.2), incorpora cifras de Arequipa (Romero, 2026; El Búho, 2026), metas de los ODS 3 y 4, dos megatendencias sustentadas en CEPLAN (2024, 2025), la línea de investigación (1.3) y el alcance de validación de las hipótesis (1.4), y ya no contiene frases de indicaciones de corrección. Persisten en el Cap. 1: una cifra regional que contradice el argumento sin explicarse («78 suicidios en lo que va de 2026, frente a 121» en 2025), el predominio de notas de prensa sobre fuentes oficiales, la ayahuasca incluida en el problema sin evidencia de demanda, el dato de ODS 4 (ERCE 2019, escolares) poco pertinente al segmento y una línea de investigación sin fuente institucional. Pendiente en los caps. 2 y 3 (versión del 04/11, no revisados de nuevo en esta actualización): indicadores de gestión, frases de nota de trabajo («Para evitar el error identificado por el docente…») y texto duplicado en 3.2.1 y 3.3.4.1.", "fortalezas": ["Subsanaron el pendiente legal más sensible: Mayahuasca ya no es «proveedor de ayahuasca para RENACER». Ahora aparece como competidor indirecto (3.3.4.1) y el 3.3 declara que los espacios de ceremonias «se consideran competidores indirectos o alternativas sustitutas». La ayahuasca se mantiene como tema educativo, con «Afirmaciones permitidas» y «Afirmaciones que deben evitarse» (Tabla 1, pp. 19-20).", "El mapa de empatía de varones fue rehecho (Figura 3.1, p. 52) con el perfil «Hombre, 18–35 años, residente en Arequipa» y contenido coherente con los apartados 3.1.7 a 3.1.12. El BMC (Figura 4, p. 58) tiene los 9 bloques legibles, incluye el segmento prioritario y una nota «Elaboración propia». Se añadió el apartado 3.2.10 «Coherencia y articulación», que relaciona segmento, canales, relación, ingresos, recursos y costos.", "El capítulo 3.3 se reordenó con criterio: competidores directos reales (Cálide, Senses Psicólogos, CSMC, plataformas de psicología en línea) con modalidad, profesionales, precio (S/ 89 en psicologa.pe; S/ 85 a 150 en Doctoralia), seguimiento y canal, una tabla comparativa (Tabla 5, p. 67) y una clasificación final entre directos e indirectos (p. 76). Las debilidades ahora se redactan como hechos verificables.", "Acotaron el segmento a jóvenes de 18 a 35 años (2.5.2, 2.5.5) y lo plantearon como hipótesis (2.5.6), lo cual es adecuado para esta etapa. El plan de investigación (2.6) queda como base para la validación del capítulo 5 (AA2).", "Volvió la lista de Referencias (pp. 77-78) con fuentes institucionales (OMS, UNESCO, MINSA, CEPLAN) y una revisión científica (Dos Santos & Hallak, 2024). La carátula ya tiene título, sección, grupo y docente.", "Cap. 1 (versión del 06/11/2026): estructura el problema en 1.1 Problema del cliente (1.1.1 a 1.1.6) y 1.2 Problema social, con una Tabla 1 que cuantifica consecuencias en salud, tiempo, dinero y estudio o trabajo con fuentes citadas, un árbol de problemas (Figura 1), cifras de Arequipa (16 % más de problemas de salud mental desde 2024; psiquiatría del Centro Moisés Heresi de 4 115 a 4 837 atenciones), metas ODS 3.4, 3.8 y 4.7, dos megatendencias de CEPLAN y un apartado 1.4 que declara el problema como hipótesis de trabajo. Todas las citas del capítulo figuran en las Referencias."], "prioridades": ["Cap. 1 (1.2.1 y Tabla 1): explicar la cifra de 78 suicidios en 2026 frente a 121 en 2025, que muestra una disminución y contradice la idea de «demanda creciente», o retirarla. Reforzar los datos regionales con una fuente oficial (GERESA Arequipa, MINSA, INSM) y, si existe, con cifras del grupo de 18 a 35 años.", "Cap. 1 (1.1.1): sustentar con datos de demanda en Arequipa el interés por la ayahuasca como parte del problema, o dejarla como componente complementario fuera del problema central; hoy no aparece en las causas (1.1.3), el árbol (Figura 1) ni la definición del problema (1.1.6).", "Cap. 1 (1.2.2 y 1.3): reemplazar el dato de ODS 4 (ERCE 2019, estudiantes de educación básica) por evidencia pertinente al segmento de 18 a 35 años, diferenciar «UNESCO, 2024a/2024b» y respaldar la línea de investigación con la denominación oficial de CERTUS, citada en APA 7.", "Sugerencia: el plan de entrevistas (2.6) es aceptable como hipótesis en la AA1; la validación real con entrevistas o encuestas se exigirá en el capítulo 5 (AA2).", "Precisar quién brinda el «acompañamiento psicológico» y qué lo diferencia de un psicólogo particular o de un CSMC. El precio es referencial en la AA1 y se desarrollará con la tabla de costos en el cap. 6 (AA2).", "Incorporar indicadores de gestión (4 a 6 KPI con fórmula y ejemplo de cálculo) y corregir el formato: referencias en orden alfabético y completas (faltan Cálide, Senses, Mayahuasca, Casa Muyuqui y Ayahuasca Inner World), tablas y figuras numeradas de forma continua, y eliminar los bloques duplicados de 3.3.4.1 y 3.2.1."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actuales y confiables, analizadas de forma crítica para mostrar qué aportan al proyecto en relación con las megatendencias y los ODS.", "falta": "Cap. 1 (06/11): las dos megatendencias ya tienen fuente (CEPLAN, 2024 y 2025), los ODS 3 y 4 traen metas y cifras y todas las citas del capítulo figuran en las Referencias. Falta: un dato de ODS 4 pertinente al segmento (el ERCE 2019 evalúa escolares y no muestra una brecha); depender menos de notas de prensa (El Búho) y de una nota de 2023 para las cifras; sustentar la línea de investigación 1.3 con la fuente institucional de CERTUS; y limpiar las Referencias (entradas con «[COMPLETAR…]» y «Consultar…», duplicados de la Ley 26842 y del MINSA, «&amp;»)."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cuantitativa y fuentes, vinculada de forma explícita a megatendencias, ODS y necesidades del cliente.", "falta": "Cap. 1 (06/11): el problema ya se formula como dificultad del cliente, se separa en problema del cliente y problema social, y se sustenta con cifras de Arequipa, consecuencias cuantificadas en la Tabla 1, ODS y megatendencias. Falta: explicar la cifra de 78 suicidios que contradice el aumento; probar la demanda de ayahuasca que se incluye en el problema; cuantificar mejor tiempo (listas de espera sin plazos) y dinero (el precio de una sesión no es el costo que asume el cliente); y sustentar con fuente las causas de 1.1.3."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Están todos los apartados y el segmento ya es específico. Falta precisar quién presta el acompañamiento psicológico (hoy se habla de «profesionales de psicología cuando corresponda»); demostrar el diferencial frente a un psicólogo particular, más allá de la información sobre ayahuasca; y agregar una consideración ambiental en 2.2.9."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "Mapas de empatía y BMC ya son coherentes con RENACER. Falta incluir indicadores de gestión con fórmula, que el capítulo todavía no tiene, y evitar que los dos mapas de empatía repitan el mismo contenido."}], "viabilidad": {"resumen": "Un servicio de educación emocional con talleres y orientación en Arequipa puede ser viable si se formaliza como servicio profesional y se valida el precio. El riesgo de la ayahuasca baja porque ya no es proveedor ni acompañamiento del consumo, pero sigue presente como parte de la comunicación y de la diferenciación, y hay una referencia ambigua a la «integración posterior».", "riesgos": [{"tema": "Regulación", "titulo": "Comunicación sobre ayahuasca y «integración posterior»", "choque": "El principio activo de la ayahuasca (DMT) es una sustancia fiscalizada. La nueva versión la plantea solo como contenido educativo, lo cual reduce el riesgo, pero en 3.3.4.1 se afirma que RENACER incorporará «evaluación psicológica, seguimiento individualizado e integración posterior» frente a los centros de ceremonias. Eso sugiere acompañar a personas que ya participaron en ceremonias y podría interpretarse como un servicio vinculado a su consumo. Además, el diferencial principal (ficha técnica, 2.2.6.6) es contenido sobre una sustancia fiscalizada, y su difusión en redes (2.2.8) puede generar problemas de reputación y de cumplimiento.", "ideas": ["Aclarar en el informe si «integración posterior» significa solo apoyo educativo, y decirlo igual en el capítulo 2, el 3.3 y el BMC.", "Consultar con un abogado la normativa sobre sustancias fiscalizadas y publicidad en salud, y escribir la conclusión con su fuente.", "Probar en la encuesta de la AA2 si la asociación con la ayahuasca atrae o aleja al cliente que busca bienestar emocional."]}, {"tema": "Regulación", "titulo": "Formalización como servicio de salud", "choque": "Si ofrecen «acompañamiento psicológico», este solo puede darlo un psicólogo colegiado y habilitado. Un local que atiende pacientes puede requerir registro ante GERESA Arequipa y SUSALUD, licencia municipal, ITSE y cumplir la Ley N.º 29733 de protección de datos personales (las fichas de orientación inicial y de seguimiento, Tabla 3, son datos sensibles).", "ideas": ["Definir qué parte del servicio es educativa (talleres) y qué parte psicológica (sesiones a cargo de un psicólogo colegiado), con su costo por hora.", "Averiguar en GERESA Arequipa y en la municipalidad los trámites, costos y plazos para un centro de bienestar.", "Evaluar empezar con talleres y una red de psicólogos independientes que facturan por sesión."]}, {"tema": "Competencia", "titulo": "Oferta gratuita y psicólogos con precio publicado", "choque": "El informe identifica correctamente a la competencia directa: CSMC gratuitos (15 en Arequipa), plataformas en línea desde S/ 89 por sesión, y centros como Cálide y Senses. RENACER todavía no muestra un diferencial medible frente a ellos, y la información que aporta (educación en salud mental) también está disponible gratis en línea.", "ideas": ["Levantar precio, horario y modalidad de al menos 5 alternativas, llamando como cliente, y fijar un precio por debajo o por encima con una razón.", "Elegir un nicho (por ejemplo, talleres nocturnos para trabajadores jóvenes o programas para empresas) y no competir como centro general."]}, {"tema": "Mercado", "titulo": "Precio referencial por validar", "choque": "El precio es referencial en la AA1; el modelo de ingresos (3.2.5) deberá sustentarse con la tabla de costos del cap. 6 (AA2). Se anota como riesgo de mercado, sin efecto en la nota.", "ideas": ["Usar los precios de la Tabla 5 como referencia inicial (S/ 85 a 150 por sesión en línea) y validar en la encuesta de la AA2 cuánto pagan hoy los jóvenes de 18 a 35 años.", "Explorar un canal B2B: programas de bienestar para empresas de Arequipa."]}, {"tema": "Adopción", "titulo": "Estigma y costo de captar clientes", "choque": "El temor a ser juzgado, que el informe identifica como causa del problema, hace más lento y caro captar clientes, sobre todo para una marca nueva sin psicólogos con reputación propia.", "ideas": ["Usar talleres gratuitos o de bajo costo como puerta de entrada y medir cuántos asistentes pasan a un servicio pagado.", "Probar qué canal genera más confianza (recomendación, universidades, empresas, redes) y cuánto cuesta cada cliente captado."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula completa", "estado": "completo", "nota": "Ahora tiene título, sección 394, grupo 06, docente e integrantes. Falta unificar la escritura de nombres (aparece «Steyci» en esta versión, «Esteyci» en la anterior y «Steicy» en la primera) y revisar la carrera de cada integrante."}, {"codigo": "—", "apartado": "Índice", "estado": "completo", "nota": "Índice automático. Tiene entradas repetidas en 3.3.4.1 y la numeración de capítulos 2 y 3 no es uniforme (el capítulo III no lleva el número en el índice)."}, {"codigo": "1.1", "apartado": "Problema del cliente (necesidades, causas y consecuencias)", "estado": "completo", "nota": "Cap. 1 del 06/11: apartado propio 1.1.1 a 1.1.6 (qué le ocurre, necesidades, causas, consecuencias con Tabla 1, árbol Figura 1 y definición). Las causas no llevan fuente, el árbol es una lista lineal y la ayahuasca no aparece en causas ni en la definición."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "Cap. 1 del 06/11: 1.2.1 con cifras de Arequipa, 1.2.2 con metas ODS 3.4, 3.8 y 4.7, y 1.2.3 con dos megatendencias de CEPLAN. No se explicitan causas y consecuencias sociales y el dato de ODS 4 (ERCE) no corresponde al segmento."}, {"codigo": "1.3", "apartado": "Línea de investigación CERTUS", "estado": "incompleto", "nota": "Cap. 1 del 06/11: ya se consigna («gestión empresarial y emprendimiento», sublínea de modelos de negocio y servicios innovadores), pero sin fuente institucional; en las Referencias las entradas de CERTUS son notas («Consultar página oficial de CERTUS») y mencionan la carrera de Dirección de Empresas, distinta de la de la carátula."}, {"codigo": "1.4", "apartado": "Alcance y validación de las hipótesis", "estado": "completo", "nota": "Cap. 1 del 06/11: declara el problema y el segmento como hipótesis sustentadas en fuentes secundarias, a validar en el cap. 5. Adecuado para la AA1."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": ""}, {"codigo": "2.2", "apartado": "Ficha técnica (8 campos)", "estado": "incompleto", "nota": "Están los campos; el precio es referencial en la AA1. La sostenibilidad no trata lo ambiental."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": ""}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": ""}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Ahora hay un segmento prioritario de 18 a 35 años y una hipótesis. Falta dimensionarlo (cuántos jóvenes hay en Arequipa Metropolitana) y precisar el nivel socioeconómico."}, {"codigo": "2.6–2.7", "apartado": "Casos de uso (y plan de entrevistas)", "estado": "completo", "nota": "Tres casos de uso con personajes y recorrido. El plan de entrevistas (2.6) se acepta como hipótesis en esta etapa."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Dos mapas coherentes con el proyecto. El de mujeres no tiene número de figura y el de varones es «Figura 3.1»."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Los 9 bloques son legibles (Figura 4) y se explican en 3.2.1 a 3.2.9, con una sección de coherencia (3.2.10). El 3.2.1 repite el mismo párrafo dos veces."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Directos reales con precios y fuentes en tabla; indirectos separados. Quedan notas de verificación pendientes («se debe confirmar directamente…») y el 3.3.4.1 está duplicado."}, {"codigo": "—", "apartado": "Indicadores de gestión", "estado": "ausente", "nota": "No se desarrollan. Solo aparecen controles en la Tabla 3 (registro de consultas, encuesta de satisfacción)."}, {"codigo": "—", "apartado": "Referencias APA 7", "estado": "incompleto", "nota": "Hay lista, pero sin orden alfabético, con OMS 2023 y 2024 repetidas, sin las fuentes de los competidores y con el MINSA como nota sobre 291 CSMC, que no respalda las cifras del capítulo 1."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Versión del 06/11/2026. Mejoró de forma notable: estructura problema del cliente y problema social, incorpora cifras de Arequipa, metas ODS, dos megatendencias de CEPLAN, línea de investigación y alcance de validación, y desaparecieron las frases de indicaciones de corrección. Quedan por pulir la coherencia de una cifra, la evidencia de la ayahuasca como parte del problema, la pertinencia del dato de ODS 4 y las fuentes de la línea de investigación.", "observaciones": [{"severidad": "importante", "titulo": "Una cifra regional contradice la tendencia que se afirma y las cifras provienen sobre todo de prensa", "ubicacion": "1.2.1 Contexto nacional y regional (p. 6) y Tabla 1 (p. 5)", "cita": "La Gerencia Regional de Salud registró 78 suicidios en lo que va de 2026, frente a 121 en el mismo periodo de 2025", "problema": "Se subsanó el problema anterior de cifras solo nacionales y de fuente que no las respaldaba: ahora hay datos de Arequipa (16 % más de intentos de suicidio y problemas de salud mental desde 2024, Romero, 2026; psiquiatría del Centro Moisés Heresi de 4 115 a 4 837 atenciones, El Búho, 2026) y el MINSA (2023) coincide con su nota de prensa. Pero el dato de los 78 suicidios (Mamani, 2026) muestra una disminución frente a 2025 y se incluye sin comentario antes de concluir «Estas cifras muestran una demanda creciente en el segmento de 18 a 35 años». Además, el 16 % proviene de lo que informó un psicólogo en una nota periodística y el dato del segmento (18 a 29 años) no cubre hasta los 35. El MINSA (2023) y Frisancho (2023) tienen tres años de antigüedad.", "mejora": "Explicar la diferencia entre suicidios, intentos de suicidio y atenciones por salud mental y por qué, aun con menos suicidios, la demanda de atención crece; o retirar el dato. Complementar con una fuente oficial reciente (GERESA Arequipa, MINSA, INSM «Honorio Delgado – Hideyo Noguchi») y, si existe, con cifras de jóvenes de 18 a 35 años."}, {"severidad": "importante", "titulo": "La ayahuasca se presenta como parte del problema sin evidencia de demanda y sin reflejarse en el resto del capítulo", "ubicacion": "1.1.1 Qué le ocurre al cliente (p. 4)", "cita": "A ello se suma el interés de algunas personas por el autoconocimiento y la comprensión de experiencias subjetivas relacionadas con estados no ordinarios de conciencia, entre ellas la ayahuasca", "problema": "Se valora el tratamiento prudente del tema (enfoque educativo y remisión a 2.2.3). Sin embargo, la única fuente (Dos Santos y Hallak, 2024) señala la necesidad de más investigación sobre efectos y riesgos; no muestra que los jóvenes de Arequipa tengan dificultad para hallar información confiable sobre este tema. La ayahuasca tampoco figura en las necesidades (1.1.2), las causas (1.1.3), la Tabla 1, el árbol (Figura 1) ni la definición del problema (1.1.6), por lo que el problema central y el segundo párrafo de 1.1.1 no coinciden.", "mejora": "Aportar un dato o una hipótesis explícita sobre la demanda de información sobre ayahuasca en el segmento (puede quedar como hipótesis para el cap. 5) y reflejarla en 1.1.2, 1.1.3 y 1.1.6; o, si es un componente complementario, retirarla de la formulación del problema y tratarla solo en el capítulo 2."}, {"severidad": "importante", "titulo": "El dato de ODS 4 no corresponde al segmento y la cita de UNESCO es ambigua", "ubicacion": "1.2.2 ODS (p. 7) y Referencias", "cita": "el 71 % de los estudiantes evaluados reportó respuestas positivas en autorregulación escolar y el 85 % en apertura a la diversidad", "problema": "Los porcentajes del ERCE 2019 describen a estudiantes de educación básica y son respuestas positivas, de modo que no evidencian una brecha en jóvenes de 18 a 35 años ni sustentan la conclusión «Estos resultados muestran la importancia de fortalecer habilidades…». La meta 3.8 (cobertura sanitaria universal) se menciona sin relacionarla con lo que ofrece RENACER. En las Referencias hay dos entradas «UNESCO (2024)» y una de ellas termina en «Consultar documento», por lo que el lector no sabe cuál se cita (corresponde 2024a y 2024b).", "mejora": "Buscar un dato sobre educación socioemocional o salud mental en jóvenes y adultos jóvenes (INEI, MINEDU, OMS, UNESCO) o argumentar con claridad por qué el ERCE sirve de antecedente. Relacionar cada meta con una acción concreta de RENACER y diferenciar las citas de UNESCO con a y b."}, {"severidad": "importante", "titulo": "La línea de investigación se consigna, pero sin fuente institucional", "ubicacion": "1.3 Línea de investigación (p. 8) y Referencias", "cita": "El proyecto RENACER se vincula con el área de gestión empresarial y emprendimiento", "problema": "Se subsanó la instrucción pendiente: ahora se nombra un área y una sublínea y se explica su relación con el proyecto. No se indica de qué documento de CERTUS se toma la denominación y, en las Referencias, las entradas de CERTUS son notas incompletas («Consultar página oficial de CERTUS», «Consultar manual institucional») que además mencionan la carrera de Dirección de Empresas, mientras la carátula indica Administración de Empresas. El segundo párrafo de 1.3 repite lo del primero.", "mejora": "Citar la denominación oficial de la línea (documento o página de CERTUS) en APA 7, sustituir las notas «Consultar…» por referencias completas y unificar la carrera de la carátula con la de las Referencias. Condensar los dos párrafos de 1.3."}, {"severidad": "sugerencia", "titulo": "Consecuencias y causas del problema del cliente poco cuantificadas y árbol de problemas lineal", "ubicacion": "1.1.3 (p. 4), Tabla 1 (p. 5) y Figura 1 (p. 6)", "cita": "Listas de espera crecientes en los servicios de salud mental de la región (Frisancho, 2023).", "problema": "La Tabla 1 es un avance claro respecto de la versión anterior. Pero la fila «Tiempo» no da plazos de espera, la fila «Dinero» presenta el precio de una sesión y no el costo que asume el cliente por no atenderse, y las cinco causas de 1.1.3 (estigma, temor a ser juzgado, etc.) no llevan fuente. La Figura 1 es una lista de causas, problema y efectos en tres líneas, sin ramas que muestren qué causa produce qué efecto.", "mejora": "Agregar un dato de espera (días o semanas) y el gasto o la pérdida que afronta el cliente; sustentar al menos estigma y temor a ser juzgado con una cita (OMS u otra fuente); y dibujar el árbol con ramas causa-efecto."}, {"severidad": "sugerencia", "titulo": "Problema social: faltan causas y consecuencias sociales y se podría ajustar la megatendencia digital", "ubicacion": "1.2 y 1.2.3 (pp. 6-7)", "cita": "RENACER utilizará canales digitales para brindar información educativa, facilitar el contacto con los usuarios y complementar las actividades presenciales.", "problema": "La estructura del TAP pide en el problema social los ODS, las megatendencias, las causas y las consecuencias; 1.2 desarrolla los dos primeros, pero no resume causas ni consecuencias a nivel social. Las dos megatendencias están sustentadas en CEPLAN (2024, 2025), lo cual subsana la observación anterior; sin embargo, la de digitalización se apoya en un servicio que la Tabla 2 define como «presencial, complementada con herramientas digitales», por lo que la relación es parcial.", "mejora": "Añadir 3 o 4 líneas con causas y consecuencias sociales (p. ej., carga en los servicios públicos, deserción o menor productividad) y precisar qué parte del servicio es digital para que la megatendencia sea pertinente."}, {"severidad": "sugerencia", "titulo": "Redacción de 1.1.6: repite 1.1.1 y contiene una frase defensiva", "ubicacion": "1.1.6 Definición del problema (p. 6)", "cita": "En consecuencia, RENACER parte de una dificultad del cliente y no de una solución predefinida.", "problema": "La definición reproduce casi textualmente el primer párrafo de 1.1.1 y su última frase responde a una observación anterior en lugar de aportar contenido al trabajo. El condicional «pueden presentar» debilita la definición.", "mejora": "Redactar el problema en una sola oración clara (quién, qué dificultad, por qué y qué consecuencia), sin aludir a las revisiones, y suprimir la repetición de 1.1.1."}, {"severidad": "sugerencia", "titulo": "La validación real se exigirá en el capítulo 5 (AA2)", "ubicacion": "1.4 Alcance y validación de las hipótesis (p. 8)", "cita": "En el capítulo 5 se validarán mediante entrevistas o encuestas reales aplicadas a jóvenes de 18 a 35 años de Arequipa Metropolitana.", "problema": "El apartado 1.4 declara adecuadamente el problema y el segmento como hipótesis sustentadas en fuentes secundarias, lo cual es aceptable en la AA1.", "mejora": "Tener presente que en el capítulo 5 (AA2) deberán aplicar las entrevistas o encuestas y, si se presentan resultados simulados, rotularlos como tales."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "El capítulo está completo y el segmento ya es específico. Falta definir quién brinda el servicio psicológico y demostrar el diferencial.", "observaciones": [{"severidad": "importante", "titulo": "No queda claro quién brinda el «acompañamiento psicológico» ni qué lo diferencia de un psicólogo particular", "ubicacion": "2.1 (p. 16), Tabla 2 (p. 20), 2.4 (p. 34) y 3.3.2 (pp. 67-69)", "cita": "manteniendo una clara diferenciación entre educación, acompañamiento y atención psicológica profesional", "problema": "El primer componente es el «acompañamiento psicológico» (Tabla 2), pero en 2.4 se dice que se diferencia de la atención psicológica profesional, y el 3.3 lo ubica como competidor de Cálide y Senses (atención psicológica). No se dice si lo brindará un psicólogo colegiado ni cuántas horas. El diferencial declarado, la información responsable sobre ayahuasca, es contenido educativo que también está disponible gratis en internet, y el propio 3.3.2 reconoce que RENACER «deberá diferenciarse no por afirmar que los competidores carecen de seguimiento».", "mejora": "Precisar qué servicios brinda un psicólogo colegiado y cuáles son educativos (talleres, contenidos). Luego, en una tabla, comparar a RENACER con un consultorio privado, un CSMC y una plataforma en línea según precio, horario, formato, seguimiento y especialización, y señalar qué ventaja medible ofrece."}, {"severidad": "importante", "titulo": "La ayahuasca sigue siendo el diferenciador principal y quedan ambigüedades", "ubicacion": "2.2.6.6 (pp. 26-27) y 3.3.4.1 (p. 72)", "cita": "Uno de los elementos diferenciadores de RENACER será brindar información educativa sobre las experiencias no ordinarias de conciencia y la ayahuasca.", "problema": "Se valora que la ayahuasca sea un componente educativo y que Mayahuasca ya no sea proveedor. Pero en 3.3.4.1 se afirma que RENACER incorporará «un proceso estructurado de evaluación psicológica, seguimiento individualizado e integración posterior» frente a los centros de ceremonias, y en el caso de uso 3 (p. 44) no queda claro si Andrea ha consumido ayahuasca o solo busca información. Además, el apartado no cita normas sobre la ayahuasca en el Perú (por ejemplo, su condición de Patrimonio Cultural de la Nación o el estatus de sus componentes).", "mejora": "Explicar en 3 o 4 líneas qué significa «integración posterior» y escribirlo igual en todo el informe. Agregar la base normativa de cómo tratarán el tema en redes y talleres, para que se entienda su límite educativo."}, {"severidad": "sugerencia", "titulo": "La sostenibilidad sigue sin consideraciones ambientales", "ubicacion": "2.2.9 (p. 30)", "cita": "RENACER busca generar un impacto positivo principalmente en el ámbito social", "problema": "Persiste de la versión anterior: la ficha técnica pide «sostenibilidad/consideraciones ambientales» y el apartado solo trata lo social.", "mejora": "Agregar 2 o 3 medidas ambientales propias de un servicio (materiales digitales en lugar de impresos, criterios para elegir el local) y relacionarlas con un ODS."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El capítulo mejoró mucho: mapas de empatía y BMC son coherentes, hay un apartado de articulación y los competidores corresponden al servicio. Faltan indicadores de gestión.", "observaciones": [{"severidad": "importante", "titulo": "Siguen faltando los indicadores de gestión", "ubicacion": "Capítulo III (pp. 47-76)", "cita": "", "problema": "La estructura del capítulo 3 pide indicadores de gestión con fórmula y ejemplo de cálculo, y el informe no los incluye ni los menciona. La Tabla 3 ya tiene controles (registro de consultas, encuesta de satisfacción) que se pueden convertir en indicadores.", "mejora": "Presentar 4 a 6 KPI en una tabla con nombre, fórmula, meta y frecuencia. Por ejemplo: «Tasa de conversión = (clientes que pagan ÷ personas que consultan) × 100». Incluir indicadores de captación, retención, satisfacción y uno económico."}, {"severidad": "sugerencia", "titulo": "Los dos mapas de empatía son casi idénticos entre sí", "ubicacion": "3.1 (pp. 47-57)", "cita": "Los valores específicos deberán determinarse mediante el presupuesto y la validación de mercado.", "problema": "Los dos mapas son casi idénticos entre sí y reproducen el mismo texto del capítulo 1, de modo que dos perfiles no aportan información distinta. Además, el mapa de mujeres (p. 47) no tiene número de figura ni nota de fuente.", "mejora": "Diferenciar los perfiles con hallazgos propios de cada uno o, si no hay diferencias, dejar un solo mapa del segmento prioritario; numerar la figura y añadir «Nota. Elaboración propia»."}, {"severidad": "importante", "titulo": "Quedan notas de verificación y texto duplicado en 3.2 y 3.3", "ubicacion": "3.2.1 (p. 59), 3.3.1 (pp. 63-64), 3.3.3 (p. 69) y 3.3.4.1 (pp. 71-75)", "cita": "Para evitar el error identificado por el docente, las debilidades no se presentan como suposiciones.", "problema": "Hay frases que son notas de trabajo, no redacción final: «Para evitar el error identificado por el docente», «se debe confirmar directamente con el establecimiento antes de colocar un horario definitivo», «Esta diferencia deberá verificarse con el propio establecimiento antes de presentarla». El 3.2.1 repite el mismo párrafo dos veces y el bloque «Identificación de los indirectos competidores» (Mayahuasca, Casa Muyuqui, Ayahuasca Inner World) aparece dos veces (pp. 71-73 y 73-75). Las URL de las plataformas quedan en el texto con «?utm_source». Los datos de Cálide y de los competidores indirectos no tienen cita ni referencia.", "mejora": "Eliminar el texto duplicado, verificar los datos pendientes llamando a los establecimientos y reescribir en redacción impersonal. Citar cada competidor con APA 7 (empresa, año, URL) y listarlo en las Referencias."}, {"severidad": "sugerencia", "titulo": "El BMC tiene una descripción por bloque pero poca articulación entre ellos", "ubicacion": "3.2.10 (pp. 62-63) y Figura 4 (p. 58)", "cita": "RENACER se encuentran articulados a partir de una misma lógica de creación, entrega y captura de valor.", "problema": "El 3.2.10 es un avance: relaciona segmento, canales, relación, ingresos, recursos y costos. Pero lo hace de forma general, sin datos (cuántos clientes, cuánto cobra, cuánto cuesta), y la Figura 4 añade una franja «Experiencia del servicio» que no es parte de los 9 bloques. La redacción tiene errores («RENACER se encuentran»; «nos permiten» en primera persona).", "mejora": "Apoyar el 3.2.10 en 3 o 4 números (precio, clientes mensuales, costo principal) y corregir la redacción impersonal."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Se corrigió la carátula y volvió la lista de Referencias, pero esta presenta fallos de forma y falta de coherencia con el texto, y la numeración de tablas y figuras no es continua.", "observaciones": [{"severidad": "importante", "titulo": "La lista de Referencias es incompleta y no respeta APA 7", "ubicacion": "Referencias (pp. 77-78)", "cita": "Organización Mundial de la Salud. (2024). Clasificación de intervenciones, servicios y aplicaciones digitales en salud", "problema": "La lista no está en orden alfabético (Dos Santos & Hallak aparece al final, después de Psicologa.pe). Las entradas de la OMS 2023 y 2024 tienen el mismo título y edición, aunque el texto cita ambas como fuentes distintas, y el texto cita «UNESCO, 2024» para habilidades socioemocionales, mientras que la entrada corresponde al estudio ERCE 2019. Faltan las fuentes de Cálide, Senses Psicólogos, Mayahuasca, Casa Muyuqui y Ayahuasca Inner World, y no hay una fuente que respalde las cifras de 1 862 186 casos. Los apellidos «Organización Mundial de la Salud» deberían citarse con la sigla en el texto (OMS) y la primera cita con el nombre completo.", "mejora": "Ordenar alfabéticamente, con sangría francesa. Verificar una por una que cada cita del texto esté en la lista y viceversa, que los años coincidan con los documentos y que las cifras citadas figuren en la fuente. Evitar usar noticias («Minsa fortalece…») para datos estadísticos y citar el informe técnico."}, {"severidad": "sugerencia", "titulo": "El nombre de <div class="wrap">
  <nav class="toc" aria-label="Contenido">
    <div class="lbl">Contenido</div>
    <ol id="toc"></ol>
    <p class="progress" id="progress" style="margin-top:14px"></p>
  </nav>
  <main id="main"></main>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const all = D.secciones.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${D.fortalezas?.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${D.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>
    <div class="grade"><span class="big">${total}</span><span class="of">/ 20</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${D.prioridades.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

D.secciones.forEach((s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
  </section>`;
});

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const toc = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => ['s' + i, s.titulo, s.observaciones.length]));
document.getElementById('toc').innerHTML = toc.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
