o privado» repite literalmente el horario y el seguimiento de RENACER y propone S/ 160 sin fuente, y la nota dice que los datos «se obtendrán llamando a al menos cinco alternativas»; completar con datos reales de al menos dos consultorios citados o retirar la columna, y quitar la frase de instrucción. Corregir «unes a viernes».", "Cap. 2 (2.5.2): el nivel socioeconómico se fundamenta con A+B (20.2 %) y C (37.4 %) del departamento, pero el segmento elegido es B y C; la cifra de 405 479 personas es departamental. Citar la fuente completa (hoy «Consultar informe estadístico») y aproximar el tamaño a Arequipa Metropolitana (distritos) o declararlo como pendiente.", "Cap. 1 (1.2.1 y Tabla 1): explicar la cifra de 78 suicidios en 2026 frente a 121 en 2025, que muestra una disminución y contradice la «demanda creciente», o retirarla; reforzar con una fuente oficial (GERESA Arequipa, MINSA, INSM).", "Cap. 1 (1.1.1, 1.2.2 y 1.3): sustentar con datos de demanda la ayahuasca como parte del problema o dejarla fuera del problema central; reemplazar el dato ERCE 2019 de escolares por evidencia pertinente al segmento de 18 a 35 años; respaldar la línea de investigación con la denominación oficial de CERTUS y corregir la carrera («Dirección de Empresas» en las Referencias, «Administración de Empresas» en la carátula).", "Cap. 3 (3.2.10 y Tabla 9): unificar las cifras de ejemplo del margen operativo (ingresos S/ 4 800 y costos S/ 3 600) con las de 3.2.10 (S/ 3 000 y S/ 1 000); aclarar si el psicólogo es del equipo (2.1, una psicóloga nominada) o un «psicólogo aliado» pagado a S/ 50 por hora (3.2.10, 3.2.8).", "Sugerencia: la validación real con entrevistas o encuestas (2.6, Tablas 7 y 8) se exigirá en el cap. 5 (AA2); mientras tanto unificar el número de entrevistas (Tabla 7 dice 5, la Tabla 8 tiene 8 filas). El precio es referencial en la AA1 y se desarrollará con la tabla de costos del cap. 6.", "AA2: Cap. V: ejecutar la recolección real (mínimo 8 entrevistas y 97 encuestas), completar las Tablas 24 a 26 y agregar resultados, análisis frente a la Tabla 27, conclusiones con métricas y mejoras al MVP; sin ello el criterio de validación no pasa de En proceso.", "AA2: Cap. IV: describir el taller piloto, documentar los pasos de desarrollo del MVP con evidencia real, identificar al psicólogo (nombre y colegiatura) y redactar el protocolo de riesgo, consentimiento y datos sensibles.", "AA2: Cap. IV y V: unificar los criterios de las Tablas 14, 15, 26 y 27 y corregir las incompatibilidades numéricas (10 inscritos × 70 % de asistencia = 17,5 % de conversión frente a la meta de 25 %; seguimiento en la semana 5 fuera del calendario de 4 semanas); eliminar los [COMPLETAR].", "AA2: Publicar el formulario real (con enlace compartido) y recolectar las respuestas: mínimo 97 encuestas y 8 entrevistas, con fechas, códigos y consentimiento; completar «[COMPLETAR: fechas]» de la Tabla 21.", "AA2: Incorporar al formulario una descripción o ficha visual del servicio (taller de 2 horas, contenido, facilitador, sesión con psicólogo, seguimiento, precio de prueba) antes de las preguntas de interés y pago.", "AA2: Rediseñar la medición de disposición de pago: precio de prueba concreto, intención de compra/inscripción y, si es posible, una prueba de pago real (preinscripción con depósito simbólico).", "AA2: Reemplazar la pregunta 9 por una batería balanceada de atributos (horario, seguimiento, precio, modalidad, quién brinda el servicio, privacidad) y corregir las opciones de la pregunta 8.", "AA2: Añadir preguntas de intención de participar en el taller piloto, uso previo de servicios pagados, y al menos una pregunta abierta final; recoger contacto voluntario para el piloto.", "AA2: Unificar los criterios de éxito (Tablas 15, 26 y 27) en un solo juego, fijado antes de recolectar, y presentar luego resultados, análisis crítico y mejoras al MVP (antes y después)."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actuales y confiables, analizadas de forma crítica para mostrar qué aportan al proyecto en relación con las megatendencias y los ODS.", "falta": "Cap. 1: dos megatendencias con CEPLAN (2024, 2025), ODS 3 y 4 con metas y cifras, y cifras de Arequipa. Cap. 2: se sumó base normativa (DS 023-2001-SA, DS 005-2019-SA, Ley 26842) y datos de mercado (INEI, CPI). Falta: dato de ODS 4 pertinente al segmento (el ERCE 2019 evalúa escolares); depender menos de notas de prensa (El Búho) y de una nota de 2023; fuente institucional para la línea de investigación; y, sobre todo, limpiar las Referencias, donde quedan «[COMPLETAR…]», «Consultar…», duplicados, entradas sueltas, «&amp;», y fuentes de competidores basadas en «testimonio directo»."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cuantitativa y fuentes, vinculada de forma explícita a megatendencias, ODS y necesidades del cliente.", "falta": "El problema ya se formula como dificultad del cliente, se separa en problema del cliente y social y se sustenta con cifras de Arequipa, consecuencias cuantificadas (Tabla 1), ODS y megatendencias; en el Cap. 2 se engancha con la Tabla 5 (problema-solución). Falta: explicar la cifra de 78 suicidios que contradice el aumento; probar la demanda de ayahuasca que se incluye en el problema pero no figura en causas, árbol ni definición; cuantificar mejor tiempo y dinero; y sustentar con fuente las causas de 1.1.3."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Están todos los apartados con contenido: la ficha técnica (Tabla 2) tiene responsable de cada componente, sostenibilidad ambiental y base normativa, hay segmento con NSE y tres casos de uso. Para llegar al nivel superior falta un diferencial demostrado (la Tabla 6 compara con un consultorio cuyos datos son copia de los de RENACER y no tienen fuente; los competidores ya ofrecen horarios amplios, como Cálide, de 9:00 a. m. a 9:00 p. m.); y unificar detalles entre secciones (precio por validar en Tabla 2 y 2.2.5 pero S/ 150 en Tabla 6 y 3.2.10; seguimiento semanal en Tabla 2 y quincenal en el caso de uso 2)."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "Mapa de empatía único y coherente, BMC con 9 bloques, apartado de coherencia con cifras (3.2.10), indicadores de gestión con fórmula y ejemplo (Tabla 9) y competidores directos e indirectos clasificados. Quedan detalles por pulir: las cifras de ejemplo de Tabla 9 no coinciden con las de 3.2.10; la fuente de los datos de competidores (Cálide, Senses, centros de ceremonias) es «testimonio directo» sin referencia verificable; y la relación del psicólogo (equipo o aliado) no es uniforme entre 2.1, 3.2.6, 3.2.8 y 3.2.10."}], "viabilidad": {"resumen": "Un servicio de educación emocional con talleres y sesiones con una psicóloga colegiada en Arequipa puede ser viable si se formaliza como servicio profesional y se valida el precio y el diferencial. El riesgo de la ayahuasca bajó: ya no es proveedor ni acompañamiento del consumo, «integración posterior» se define como apoyo educativo y se agregó la base normativa (2.2.3). Sigue como complemento de comunicación y redes, con necesidad de asesoría legal. Los riesgos principales son ahora la formalización del servicio de salud y la competencia con precios publicados.", "riesgos": [{"tema": "Regulación", "titulo": "Comunicación sobre ayahuasca como complemento educativo", "choque": "Se valora que 2.2.3 defina «integración posterior» como apoyo educativo, que cite el DS 023-2001-SA (el DMT figura en la Lista I B, DS 005-2019-SA) y la Ley 26842 art. 119 sobre publicidad en salud, y que el informe declare que no organiza ni acompaña ceremonias. Aun así, la ayahuasca se mantiene como servicio complementario (Tabla 2, Tabla 3, 2.2.8) y en redes, lo que puede generar riesgo de reputación y de cumplimiento; el propio informe dice que la aplicación a usos tradicionales «deberá ser evaluada por un asesor legal especializado», aún no hecho.", "ideas": ["Obtener y citar un dictamen legal breve (abogado o colegio profesional) sobre contenidos de ayahuasca y publicidad en salud, y escribir su conclusión en 2.2.3.", "Probar en la validación del cap. 5 si el contenido sobre ayahuasca atrae o aleja al cliente que busca bienestar emocional, y mantenerlo como complemento, no como diferencial.", "Revisar un protocolo de publicación en redes (qué se puede decir y qué no) alineado con la lista de «afirmaciones permitidas y que deben evitarse» de la Tabla 2."]}, {"tema": "Regulación", "titulo": "Formalización como servicio de salud", "choque": "Las sesiones las dará una psicóloga colegiada (C.Ps.P. N.° 63830, 2.1), lo cual resuelve la duda de quién presta el acompañamiento. Pero un local que atiende pacientes puede requerir registro ante GERESA Arequipa y SUSALUD, licencia municipal, ITSE y cumplir la Ley N.° 29733 (las fichas de orientación y de seguimiento son datos sensibles); el informe menciona la Ley 29733 solo en la nota de la Tabla 4 y no figura en las Referencias. Además, hay una psicóloga nominada pero el modelo de costos supone un «psicólogo aliado» pagado por hora (3.2.10): conviene definir el vínculo y la capacidad (20 atenciones al mes).", "ideas": ["Averiguar en GERESA Arequipa y en la municipalidad los trámites, costos y plazos para un centro de bienestar, o evaluar iniciar con talleres y una red de psicólogos independientes que facturan por sesión.", "Definir el vínculo con la psicóloga (socia, aliada o contratada) y qué actividades pueden hacer los facilitadores sin ejercer la psicología.", "Citar la Ley 29733 en las Referencias y describir cómo se protegerán las fichas y los registros de seguimiento."]}, {"tema": "Competencia", "titulo": "Oferta gratuita y psicólogos con precio publicado", "choque": "El informe identifica correctamente a la competencia (CSMC gratuitos, plataformas desde S/ 89 por sesión, Cálide y Senses) y la Tabla 6 plantea un diferencial en horario, seguimiento y talleres. Pero el horario (lunes a viernes de 6:00 a 9:00 p. m. y sábado de 9:00 a. m. a 1:00 p. m.) es menos amplio que el de Cálide (lunes a sábado de 9:00 a. m. a 9:00 p. m.) y que el de las plataformas en línea (flexible), y la columna del consultorio privado de la Tabla 6 no tiene datos reales. Con un precio propuesto de S/ 150 frente a S/ 89 en Psicologa.pe, el diferencial medible aún no se sostiene.", "ideas": ["Levantar precio, horario y modalidad de al menos 5 alternativas privadas llamando como cliente, citarlas y fijar el precio con una razón.", "Reforzar el nicho (talleres de gestión emocional para estudiantes y trabajadores jóvenes) y medir en el cap. 5 cuánto valoran el seguimiento estructurado."]}, {"tema": "Mercado", "titulo": "Precio referencial por validar", "choque": "El precio es referencial en la AA1; el modelo de ingresos (3.2.5 y 3.2.10, S/ 150 por sesión y 20 clientes al mes) deberá sustentarse con la tabla de costos del cap. 6 (AA2). Se anota como riesgo de mercado, sin efecto en la nota. Solo conviene unificar la cifra: Tabla 2 y 2.2.5 dicen «por validar» mientras Tabla 6 y 3.2.10 proponen S/ 150.", "ideas": ["Validar en la encuesta de la AA2 cuánto pagan hoy los jóvenes de 18 a 35 años de los niveles B y C y su disposición a pagar por talleres frente a sesiones individuales.", "Explorar un canal B2B: programas de bienestar para empresas de Arequipa."]}, {"tema": "Adopción", "titulo": "Estigma y costo de captar clientes", "choque": "El temor a ser juzgado, que el informe identifica como causa del problema, hace más lento y caro captar clientes, sobre todo para una marca nueva sin psicólogos con reputación propia.", "ideas": ["Usar talleres gratuitos o de bajo costo como puerta de entrada y medir cuántos asistentes pasan a un servicio pagado.", "Probar qué canal genera más confianza (recomendación, universidades, empresas, redes) y cuánto cuesta cada cliente captado."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula completa", "estado": "completo", "nota": "Tiene título, sección 394, grupo 06, docente, integrantes con carrera y escritura uniforme («Steyci»). Observación menor: «CICLO: V» (la UD corresponde al 6.º ciclo) y «MÓDULO: 3»; verificar."}, {"codigo": "—", "apartado": "Índice", "estado": "completo", "nota": "Índice automático con capítulos I a III numerados de forma uniforme. Pequeño detalle: el apartado 3.2.1 no aparece en el índice (salta de 3.2 a 3.2.2)."}, {"codigo": "1.1", "apartado": "Problema del cliente (necesidades, causas y consecuencias)", "estado": "completo", "nota": "Cap. 1 del 06/11: apartado propio 1.1.1 a 1.1.6 (qué le ocurre, necesidades, causas, consecuencias con Tabla 1, árbol Figura 1 y definición). Las causas no llevan fuente, el árbol es una lista lineal y la ayahuasca no aparece en causas ni en la definición."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "Cap. 1 del 06/11: 1.2.1 con cifras de Arequipa, 1.2.2 con metas ODS 3.4, 3.8 y 4.7, y 1.2.3 con dos megatendencias de CEPLAN. No se explicitan causas y consecuencias sociales y el dato de ODS 4 (ERCE) no corresponde al segmento."}, {"codigo": "1.3", "apartado": "Línea de investigación CERTUS", "estado": "incompleto", "nota": "Cap. 1 del 06/11: ya se consigna («gestión empresarial y emprendimiento», sublínea de modelos de negocio y servicios innovadores), pero sin fuente institucional; en las Referencias las entradas de CERTUS son notas («Consultar página oficial de CERTUS») y mencionan la carrera de Dirección de Empresas, distinta de la de la carátula."}, {"codigo": "1.4", "apartado": "Alcance y validación de las hipótesis", "estado": "completo", "nota": "Cap. 1 del 06/11: declara el problema y el segmento como hipótesis sustentadas en fuentes secundarias, a validar en el cap. 5. Adecuado para la AA1."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Describe dos tipos de servicio (educativo y acompañamiento psicológico), nombra a la psicóloga colegiada y explica el diferencial por forma de entrega (nicho, horarios, seguimiento y derivación)."}, {"codigo": "2.2", "apartado": "Ficha técnica (8 campos)", "estado": "completo", "nota": "Tabla 2 con los campos pedidos más 2.2.3 (criterios técnicos y responsabilidad, base normativa), 2.2.6 (proceso, Tabla 4) y 2.2.9 con medidas ambientales (ODS 12). Precio referencial y duración «por definir», aceptable en la AA1. Detalle: precio «por validar» en la ficha pero S/ 150 en Tabla 6 y 3.2.10; «Renacer» con minúscula en varios párrafos."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Cinco beneficios con vínculo a OMS y UNESCO."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "Tabla 5 problema-solución enlazada con el cap. I y 2.4.1 con Tabla 6 de comparación. La columna «Consultorio privado» repite horario y seguimiento de RENACER y propone S/ 160 sin fuente; la nota aún contiene una instrucción de trabajo."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Segmento prioritario de 18 a 35 años con segmentación geográfica, demográfica (incluye NSE B y C y tamaño referencial), psicográfica y cliente prioritario. El NSE se sustenta con A+B (20.2 %) y C (37.4 %) del departamento y el tamaño con 405 479 personas del departamento (no de Arequipa Metropolitana); fuentes CPI e INEI sin enlace («Consultar…»)."}, {"codigo": "2.6–2.7", "apartado": "Casos de uso (y plan de entrevistas)", "estado": "completo", "nota": "Tres casos de uso con resultado esperado; el caso 3 aclara que Andrea no ha consumido ayahuasca. Plan de entrevistas (2.6) aceptable como hipótesis; la Tabla 7 propone 5 entrevistados y la Tabla 8 tiene 8 filas. Caso 2 menciona seguimiento «quincenal» y la Tabla 2 «semanal»."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Un único mapa con los seis cuadrantes (Figura 2), coherente con 2.5 y la propuesta de valor, más matices por perfil rotulados como hipótesis."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Figura 3 con los 9 bloques consistentes con el segmento y la propuesta; 3.2.1 a 3.2.9 los explican y 3.2.10 cuantifica la lógica de ingresos y costos. Se eliminó el texto duplicado."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Directos con precio, modalidad, seguimiento y horario (Tabla 10), fortalezas y limitaciones verificables con oportunidad (Tabla 11) e indirectos clasificados (Tabla 12). Faltan fuentes verificables para Cálide, Senses y los centros de ceremonias («testimonio directo»); queda la frase «sujeto a confirmación directa con el establecimiento»."}, {"codigo": "—", "apartado": "Indicadores de gestión (3.2.11)", "estado": "completo", "nota": "3.2.11 y Tabla 9: seis indicadores con fórmula, ejemplo de cálculo (correctos), meta y frecuencia. Las cifras del margen operativo (S/ 4 800 y S/ 3 600) no coinciden con las de 3.2.10."}, {"codigo": "—", "apartado": "Referencias APA 7", "estado": "incompleto", "nota": "Orden alfabético casi completo, pero con cuatro entradas «[COMPLETAR…]», unas catorce líneas «Consultar…», entradas sueltas («CPI», «proyectos.inei.gob.pe»), duplicados (Ley 26842, MINSA s. f.), «&amp;», UNESCO 2024 sin a/b, INEI 2025 dos veces sin a/b, y desajustes con el texto (Giove 2022 y Agencia Andina no se citan; Leyes 29571 y 29733 no figuran)."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Versión del 06/11/2026. Mejoró de forma notable: estructura problema del cliente y problema social, incorpora cifras de Arequipa, metas ODS, dos megatendencias de CEPLAN, línea de investigación y alcance de validación, y desaparecieron las frases de indicaciones de corrección. Quedan por pulir la coherencia de una cifra, la evidencia de la ayahuasca como parte del problema, la pertinencia del dato de ODS 4 y las fuentes de la línea de investigación.", "observaciones": [{"severidad": "importante", "titulo": "Una cifra regional contradice la tendencia que se afirma y las cifras provienen sobre todo de prensa", "ubicacion": "1.2.1 Contexto nacional y regional (p. 6) y Tabla 1 (p. 5)", "cita": "La Gerencia Regional de Salud registró 78 suicidios en lo que va de 2026, frente a 121 en el mismo periodo de 2025", "problema": "Se subsanó el problema anterior de cifras solo nacionales y de fuente que no las respaldaba: ahora hay datos de Arequipa (16 % más de intentos de suicidio y problemas de salud mental desde 2024, Romero, 2026; psiquiatría del Centro Moisés Heresi de 4 115 a 4 837 atenciones, El Búho, 2026) y el MINSA (2023) coincide con su nota de prensa. Pero el dato de los 78 suicidios (Mamani, 2026) muestra una disminución frente a 2025 y se incluye sin comentario antes de concluir «Estas cifras muestran una demanda creciente en el segmento de 18 a 35 años». Además, el 16 % proviene de lo que informó un psicólogo en una nota periodística y el dato del segmento (18 a 29 años) no cubre hasta los 35. El MINSA (2023) y Frisancho (2023) tienen tres años de antigüedad.", "mejora": "Explicar la diferencia entre suicidios, intentos de suicidio y atenciones por salud mental y por qué, aun con menos suicidios, la demanda de atención crece; o retirar el dato. Complementar con una fuente oficial reciente (GERESA Arequipa, MINSA, INSM «Honorio Delgado – Hideyo Noguchi») y, si existe, con cifras de jóvenes de 18 a 35 años."}, {"severidad": "importante", "titulo": "La ayahuasca se presenta como parte del problema sin evidencia de demanda y sin reflejarse en el resto del capítulo", "ubicacion": "1.1.1 Qué le ocurre al cliente (p. 4)", "cita": "A ello se suma el interés de algunas personas por el autoconocimiento y la comprensión de experiencias subjetivas relacionadas con estados no ordinarios de conciencia, entre ellas la ayahuasca", "problema": "Se valora el tratamiento prudente del tema (enfoque educativo y remisión a 2.2.3). Sin embargo, la única fuente (Dos Santos y Hallak, 2024) señala la necesidad de más investigación sobre efectos y riesgos; no muestra que los jóvenes de Arequipa tengan dificultad para hallar información confiable sobre este tema. La ayahuasca tampoco figura en las necesidades (1.1.2), las causas (1.1.3), la Tabla 1, el árbol (Figura 1) ni la definición del problema (1.1.6), por lo que el problema central y el segundo párrafo de 1.1.1 no coinciden.", "mejora": "Aportar un dato o una hipótesis explícita sobre la demanda de información sobre ayahuasca en el segmento (puede quedar como hipótesis para el cap. 5) y reflejarla en 1.1.2, 1.1.3 y 1.1.6; o, si es un componente complementario, retirarla de la formulación del problema y tratarla solo en el capítulo 2."}, {"severidad": "importante", "titulo": "El dato de ODS 4 no corresponde al segmento y la cita de UNESCO es ambigua", "ubicacion": "1.2.2 ODS (p. 7) y Referencias", "cita": "el 71 % de los estudiantes evaluados reportó respuestas positivas en autorregulación escolar y el 85 % en apertura a la diversidad", "problema": "Los porcentajes del ERCE 2019 describen a estudiantes de educación básica y son respuestas positivas, de modo que no evidencian una brecha en jóvenes de 18 a 35 años ni sustentan la conclusión «Estos resultados muestran la importancia de fortalecer habilidades…». La meta 3.8 (cobertura sanitaria universal) se menciona sin relacionarla con lo que ofrece RENACER. En las Referencias hay dos entradas «UNESCO (2024)» y una de ellas termina en «Consultar documento», por lo que el lector no sabe cuál se cita (corresponde 2024a y 2024b).", "mejora": "Buscar un dato sobre educación socioemocional o salud mental en jóvenes y adultos jóvenes (INEI, MINEDU, OMS, UNESCO) o argumentar con claridad por qué el ERCE sirve de antecedente. Relacionar cada meta con una acción concreta de RENACER y diferenciar las citas de UNESCO con a y b."}, {"severidad": "importante", "titulo": "La línea de investigación se consigna, pero sin fuente institucional", "ubicacion": "1.3 Línea de investigación (p. 8) y Referencias", "cita": "El proyecto RENACER se vincula con el área de gestión empresarial y emprendimiento", "problema": "Se subsanó la instrucción pendiente: ahora se nombra un área y una sublínea y se explica su relación con el proyecto. No se indica de qué documento de CERTUS se toma la denominación y, en las Referencias, las entradas de CERTUS son notas incompletas («Consultar página oficial de CERTUS», «Consultar manual institucional») que además mencionan la carrera de Dirección de Empresas, mientras la carátula indica Administración de Empresas. El segundo párrafo de 1.3 repite lo del primero.", "mejora": "Citar la denominación oficial de la línea (documento o página de CERTUS) en APA 7, sustituir las notas «Consultar…» por referencias completas y unificar la carrera de la carátula con la de las Referencias. Condensar los dos párrafos de 1.3."}, {"severidad": "sugerencia", "titulo": "Consecuencias y causas del problema del cliente poco cuantificadas y árbol de problemas lineal", "ubicacion": "1.1.3 (p. 4), Tabla 1 (p. 5) y Figura 1 (p. 6)", "cita": "Listas de espera crecientes en los servicios de salud mental de la región (Frisancho, 2023).", "problema": "La Tabla 1 es un avance claro respecto de la versión anterior. Pero la fila «Tiempo» no da plazos de espera, la fila «Dinero» presenta el precio de una sesión y no el costo que asume el cliente por no atenderse, y las cinco causas de 1.1.3 (estigma, temor a ser juzgado, etc.) no llevan fuente. La Figura 1 es una lista de causas, problema y efectos en tres líneas, sin ramas que muestren qué causa produce qué efecto.", "mejora": "Agregar un dato de espera (días o semanas) y el gasto o la pérdida que afronta el cliente; sustentar al menos estigma y temor a ser juzgado con una cita (OMS u otra fuente); y dibujar el árbol con ramas causa-efecto."}, {"severidad": "sugerencia", "titulo": "Problema social: faltan causas y consecuencias sociales y se podría ajustar la megatendencia digital", "ubicacion": "1.2 y 1.2.3 (pp. 6-7)", "cita": "RENACER utilizará canales digitales para brindar información educativa, facilitar el contacto con los usuarios y complementar las actividades presenciales.", "problema": "La estructura del TAP pide en el problema social los ODS, las megatendencias, las causas y las consecuencias; 1.2 desarrolla los dos primeros, pero no resume causas ni consecuencias a nivel social. Las dos megatendencias están sustentadas en CEPLAN (2024, 2025), lo cual subsana la observación anterior; sin embargo, la de digitalización se apoya en un servicio que la Tabla 2 define como «presencial, complementada con herramientas digitales», por lo que la relación es parcial.", "mejora": "Añadir 3 o 4 líneas con causas y consecuencias sociales (p. ej., carga en los servicios públicos, deserción o menor productividad) y precisar qué parte del servicio es digital para que la megatendencia sea pertinente."}, {"severidad": "sugerencia", "titulo": "Redacción de 1.1.6: repite 1.1.1 y contiene una frase defensiva", "ubicacion": "1.1.6 Definición del problema (p. 6)", "cita": "En consecuencia, RENACER parte de una dificultad del cliente y no de una solución predefinida.", "problema": "La definición reproduce casi textualmente el primer párrafo de 1.1.1 y su última frase responde a una observación anterior en lugar de aportar contenido al trabajo. El condicional «pueden presentar» debilita la definición.", "mejora": "Redactar el problema en una sola oración clara (quién, qué dificultad, por qué y qué consecuencia), sin aludir a las revisiones, y suprimir la repetición de 1.1.1."}, {"severidad": "sugerencia", "titulo": "La validación real se exigirá en el capítulo 5 (AA2)", "ubicacion": "1.4 Alcance y validación de las hipótesis (p. 8)", "cita": "En el capítulo 5 se validarán mediante entrevistas o encuestas reales aplicadas a jóvenes de 18 a 35 años de Arequipa Metropolitana.", "problema": "El apartado 1.4 declara adecuadamente el problema y el segmento como hipótesis sustentadas en fuentes secundarias, lo cual es aceptable en la AA1.", "mejora": "Tener presente que en el capítulo 5 (AA2) deberán aplicar las entrevistas o encuestas y, si se presentan resultados simulados, rotularlos como tales."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "Mejoró de forma sustancial: nombra a la psicóloga colegiada que presta el acompañamiento y asigna responsables (Tabla 3), compara con un consultorio, un CSMC y una plataforma (Tabla 6), define «integración posterior» y agrega la base normativa de la ayahuasca (2.2.3), añade medidas ambientales (2.2.9) y precisa el segmento con nivel socioeconómico y tamaño (2.5.2). Quedan datos sin sustento en la Tabla 6 (columna del consultorio), una nota que es instrucción de trabajo, cálculos del segmento que no coinciden con la elección de B y C, y detalles de coherencia entre secciones.", "observaciones": [{"severidad": "importante", "titulo": "La columna «Consultorio privado» de la Tabla 6 copia los datos de RENACER y la nota conserva una instrucción de trabajo", "ubicacion": "2.4.1, Tabla 6 «Comparación de RENACER con alternativas de atención en Arequipa» (pp. 17-18)", "cita": "Los datos del consultorio privado se obtendrán llamando a al menos cinco alternativas como cliente.", "problema": "Se valora la nueva comparación (precio, horario, formato, seguimiento y especialización) y que ya se declare que la ayahuasca no es el diferencial principal, lo que subsana la observación sobre el diferencial. Pero en la columna «Consultorio privado» el horario («lunes a viernes de 6:00 p. m. a 9:00 p. m. y sábados de 9:00 a. m. a 1:00 p. m.») y el seguimiento («Contacto entre las 48 y 72 horas posteriores a la primera sesión…») son iguales, palabra por palabra, a los de RENACER; el precio de «S/ 160 por sesión» figura como «propuesta inicial, por validar» sin fuente; y la nota anuncia que esos datos «se obtendrán» llamando a cinco consultorios, es decir, aún no existen. Así, la tabla no permite concluir qué ventaja tiene RENACER. Además, el horario se escribe «unes a viernes» (falta la L) y los competidores ya ofrecen horarios amplios (Cálide: lunes a sábado de 9:00 a. m. a 9:00 p. m.; plataformas: flexible).", "mejora": "Completar la columna con datos reales de al menos dos consultorios (nombre, precio, horario, seguimiento y fuente o fecha de consulta) o retirar la columna y comparar solo con lo verificado (Cálide, Senses, CSMC, plataformas). Eliminar la frase de instrucción de la nota, y concretar la «ventaja medible»: p. ej., cuántas horas más de atención nocturna ofrece frente a las alternativas citadas."}, {"severidad": "sugerencia", "titulo": "Segmentación: el nivel socioeconómico y el tamaño no coinciden con lo que se sustenta", "ubicacion": "2.5.2 Segmentación demográfica (p. 18)", "cita": "una participación de 20.2 % en los niveles A y B conjuntamente, y 37.4 % en el nivel C", "problema": "Se subsana la observación anterior de dimensionar el segmento y precisar el nivel socioeconómico, y es adecuado que lo declaren hipótesis. Pero el texto elige los niveles B y C y cita datos de A y B conjuntos y de C, de modo que no se sabe qué porcentaje corresponde a B; las cifras son del departamento. La cifra de 405,479 personas de 18 a 35 años también es departamental (INEI, 2025) y el propio texto indica que no es el tamaño del segmento metropolitano. Las dos referencias de INEI y la de CPI figuran como «Consultar cuadro estadístico» o solo «CPI», y en el texto la cita de INEI no tiene año ni autor-fecha. La cifra usa coma como separador de miles («405,479») mientras el resto del informe usa espacio.", "mejora": "Citar en APA 7 la tabla exacta de INEI y el informe de APEIM/CPI (autor, año, título y URL), usar el porcentaje de niveles B y C si existe o redefinir el segmento como B y C con el dato correcto, y aproximar el tamaño en los distritos de Arequipa Metropolitana (o declararlo como pendiente para el cap. 5)."}, {"severidad": "sugerencia", "titulo": "La base normativa de la ayahuasca es adecuada, pero sus fuentes no se pueden verificar y la conclusión legal queda pendiente", "ubicacion": "2.2.3 Criterios técnicos y de responsabilidad (p. 13) y Referencias", "cita": "deberá ser evaluada por un asesor legal especializado, considerando también el reconocimiento de su valor cultural mediante la Resolución directoral nacional N.° 836/INC (2008)", "problema": "Se subsana la observación anterior: define «integración posterior» y agrega la base normativa (DS 023-2001-SA, DS 005-2019-SA, Ley 26842, Ley 29571). Falta que las normas se puedan verificar: en las Referencias aparecen como líneas «Consultar el reglamento oficial en PDF», «Consultar la Ley General de Salud en PDF» (dos veces) y «Consultar la modificación oficial de las listas. En esta norma puedes verificar que el DMT figura en la Lista I B», que son indicaciones y no referencias; la Ley 29571 y la Ley 29733 no están listadas, mientras Giove (2022) y Agencia Andina (2008) figuran en la lista pero no se citan en el texto. El apartado pide una opinión legal que aún no se obtuvo.", "mejora": "Citar cada norma en APA 7 (entidad, año, título, número, medio de publicación y enlace al Diario Oficial El Peruano o SPIJ), usar Giove (2022) y la nota de Andina en el texto o retirarlas, y conseguir una breve opinión legal para reemplazar la frase condicional por una conclusión."}, {"severidad": "sugerencia", "titulo": "Detalles que no coinciden entre secciones (precio, seguimiento, profesionales y entrevistados)", "ubicacion": "Tabla 2 y 2.2.5 (pp. 11-14), Tabla 6 (p. 18), caso de uso 2 (p. 22) y Tablas 7 y 8 (pp. 19-21)", "cita": "Por validar. Referencia de mercado: S/ 85 a 150 por sesión en línea", "problema": "El precio es referencial en la AA1, por lo que solo se señala la unificación de cifras: la Tabla 2 y 2.2.5 dicen «por validar» y la Tabla 6 y 3.2.10 proponen S/ 150. Además, el seguimiento es semanal durante el primer mes (Tabla 2) pero «quincenal» en el caso de uso 2; 2.1 nombra a una sola psicóloga y la Tabla 2 habla de «psicólogos colegiados y habilitados»; la Tabla 7 propone 5 entrevistados y la Tabla 8 tiene 8 filas (E1 a E8); y se escribe «Renacer» y «renacer» en lugar de «RENACER» (2.2.3, Tabla 3).", "mejora": "Unificar la cifra de precio como «S/ 150 (referencial)», la frecuencia de seguimiento, el número de profesionales y entrevistas, y la escritura del nombre del proyecto."}, {"severidad": "sugerencia", "titulo": "El diferencial aún se apoya en el complemento de ayahuasca en varias secciones", "ubicacion": "2.1 (p. 10), Tablas 2, 3 y 5 y caso de uso 3 (p. 22)", "cita": "Como complemento, el servicio incluye información educativa sobre experiencias no ordinarias de conciencia, incluida la ayahuasca", "problema": "Se valora que 2.4.1 declare que no es el diferencial principal y que 2.2.3 precise su alcance, y el caso de uso 3 ahora aclara que Andrea no ha consumido la sustancia. Sin embargo, el tema ocupa una fila en Tablas 2, 3 y 5, un caso de uso completo y una etapa del proceso (Tabla 4), con lo cual sigue pesando en la comunicación aunque el problema central (Cap. 1) no lo incluye en causas ni definición.", "mejora": "Mantenerla como un componente opcional y breve, o desarrollarla solo cuando exista evidencia de demanda (cap. 5); evitar que el caso de uso 3 tenga más peso que los dos casos centrales."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El capítulo mejoró mucho: un único mapa de empatía coherente (Figura 2), BMC de 9 bloques con articulación cuantificada (3.2.10), seis indicadores de gestión con fórmula y ejemplo (Tabla 9) y competidores con tablas comparativas y clasificación. Se eliminaron el texto duplicado y las frases de indicaciones de corrección. Quedan fuentes de competidores sin referencia verificable, unos restos de nota de verificación y cifras de ejemplo que no coinciden con las de 3.2.10.", "observaciones": [{"severidad": "importante", "titulo": "Los datos de competidores indirectos y de Cálide se apoyan en «testimonio directo» sin referencia verificable", "ubicacion": "3.3.1 a), 3.3.4.1 (pp. 30 y 34) y Referencias", "cita": "Información obtenida mediante testimonio directo de una integrante del equipo del proyecto RENACER.", "problema": "Se subsanaron el texto duplicado y la nota «para evitar el error identificado por el docente», y los competidores directos tienen precios y fuentes públicas (Psicologa.pe, Doctoralia, MINSA). Pero en las Referencias, las entradas de Ayahuasca Inner World, Cálide, Casa Muyuqui y Senses Psicólogos mantienen «[COMPLETAR: título de la página]» y la frase «Información obtenida mediante testimonio directo…», que no es una fuente citable en APA 7. En 3.3.1 a), el horario de Cálide se atribuye a «su ficha comercial, consultada el 5 de noviembre de 2026» sin enlace, y se añade «Este horario está sujeto a confirmación directa con el establecimiento», una nota de trabajo. Los datos de los tres espacios de ceremonias (3.3.4.1) tampoco permiten comprobar la afirmación.", "mejora": "Citar en APA 7 las páginas consultadas (título, URL y fecha de consulta) o, si fue una comunicación personal, citarla como tal en el texto y no en las Referencias; confirmar el horario de Cálide o retirar la frase de verificación pendiente; y numerar o resumir 3.3.4.2 y 3.3.4.3 con alguna fuente."}, {"severidad": "sugerencia", "titulo": "Los ejemplos de la Tabla 9 no coinciden con las cifras de 3.2.10 y el psicólogo no tiene vínculo uniforme", "ubicacion": "3.2.10 y 3.2.11, Tabla 9 (pp. 28-29); 2.1, 3.2.6 y 3.2.8", "cita": "((4 800 − 3 600) ÷ 4 800) × 100 = 25 %", "problema": "Se subsanó la ausencia de indicadores: la Tabla 9 trae seis KPI con fórmula, ejemplo de cálculo, meta y frecuencia, y los cálculos son correctos (12 ÷ 40 = 30 %; S/ 600 ÷ 12 = S/ 50; 9 ÷ 12 = 75 %; 22 ÷ 25 = 88 %; 18 ÷ 24 = 75 %). Pero el ejemplo del margen operativo usa ingresos de S/ 4 800 y costos de S/ 3 600, mientras 3.2.10 plantea S/ 3 000 de ingreso (20 clientes × S/ 150) y S/ 1 000 de honorarios; la nota aclara que los ejemplos son ilustrativos, pero conviene que partan de los mismos supuestos. Además, 3.2.10 y 3.2.8 hablan de un «psicólogo aliado» pagado a S/ 50 por hora, 3.2.6 lo trata como recurso clave propio y 2.1 nombra a una psicóloga determinada.", "mejora": "Reemplazar los datos del ejemplo por los de 3.2.10 (p. ej., 20 clientes, S/ 3 000, costo directo de S/ 1 000) o explicar la diferencia, y aclarar si el psicólogo es del equipo, socio o aliado remunerado por sesión."}, {"severidad": "sugerencia", "titulo": "El mapa de empatía único se apoya en hipótesis y no incluye evidencia propia", "ubicacion": "3.1 y Figura 2 (p. 24)", "cita": "Nota. Elaboración propia a partir de las hipótesis del capítulo I y del apartado 2.5.", "problema": "Se subsanó la repetición de los dos mapas casi idénticos: ahora hay un único mapa con los seis cuadrantes y coherente con 2.5, y los matices por mujeres y varones se rotulan como hipótesis. Es adecuado para la AA1. El mapa es un gráfico con texto y un personaje; los datos de «qué oye», «qué ve» y «qué dice y hace» son plausibles, pero no se vinculan a una fuente.", "mejora": "Tener presente que en el cap. 5 conviene contrastar cada cuadrante con las entrevistas; puede indicarse qué cuadrantes se validarán primero."}, {"severidad": "sugerencia", "titulo": "El BMC se puede apoyar mejor en la oferta de ingresos y costos", "ubicacion": "Figura 3 y 3.2.5 a 3.2.10 (pp. 25-28)", "cita": "Los ingresos provienen de sesiones individuales con psicólogos colegiados, talleres grupales, programas de seguimiento y contenido digital especializado.", "problema": "Se subsanó la franja ajena a los 9 bloques de la versión anterior, y la lectura de la Figura 3 es completa y coherente con el segmento y la propuesta. El apartado 3.2.10 cuantifica solo las sesiones individuales; los talleres, los programas de seguimiento y el contenido digital que figuran como fuentes de ingreso no tienen supuestos, aunque el precio sea referencial.", "mejora": "Agregar en 3.2.10 una línea sobre cuántos talleres y asistentes se esperan y qué parte del ingreso aportan."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Mejoró la forma: numeración continua de tablas y figuras, notas de fuente, índice uniforme y carátula completa. El punto crítico son las Referencias, que conservan restos de redacción y no coinciden por completo con el texto.", "observaciones": [{"severidad": "importante", "titulo": "Las Referencias conservan restos de redacción («[COMPLETAR…]», «Consultar…») y no coinciden con el texto", "ubicacion": "Referencias (pp. 36 en adelante)", "cita": "Cálide. (s. f.). [COMPLETAR: título de la página]. Información obtenida mediante testimonio directo de una integrante del equipo del proyecto RENACER.", "problema": "La lista ya está casi en orden alfabético y ahora incluye normas, CEPLAN, INEI, CPI y los competidores, pero: (a) cuatro entradas (Ayahuasca Inner World, Cálide, Casa Muyuqui, Senses Psicólogos) tienen «[COMPLETAR: título de la página]» y, tres de ellas, «testimonio directo»; (b) unas catorce líneas son instrucciones y no referencias («Consultar página oficial de CERTUS», «Consultar manual institucional», «Consultar informe estadístico», «Consultar guía oficial», «Consultar directorio oficial de los 306 CSMC del Perú», «Consultar el reglamento oficial en PDF», «Consultar la Ley General de Salud en PDF», «Consultar la modificación oficial de las listas…», «Consultar cuadro estadístico», «Consultar publicación oficial», «Consultar documento…»); (c) hay entradas sueltas («CPI», «proyectos.inei.gob.pe»); (d) están duplicadas la Ley 26842 y la referencia de MINSA (s. f.); (e) aparece «&amp;» en Dos Santos & Hallak y Tindle et al.; (f) hay dos entradas «UNESCO (2024)» sin a/b y dos «INEI (2025)»; (g) las entradas de CERTUS indican «Dirección de Empresas» aunque la carátula dice Administración de Empresas, y CONCYTEC (2019) no se cita en el texto; (h) Giove (2022) y Agencia Andina (2008) se listan pero no se citan, y las Leyes 29571 y 29733 se citan pero no se listan.", "mejora": "Completar cada entrada con autor, año, título, medio y URL (APA 7), eliminar las líneas «Consultar…», unificar duplicados y diferenciar con a y b, quitar «&amp;» y comprobar una por una que cada cita del texto esté en la lista y viceversa. Las comunicaciones personales no van en las Referencias."}, {"severidad": "sugerencia", "titulo": "Carátula: ciclo y módulo por verificar", "ubicacion": "Carátula (p. 1)", "cita": "CICLO: V", "problema": "Se corrigió la escritura del nombre de la integrante (ahora uniforme), pero la carátula indica «CICLO: V» y «MÓDULO: 3» y la UD corresponde al 6.º ciclo.", "mejora": "Verificar ciclo y módulo según el plan de estudios y el formato de carátula de la UD."}, {"severidad": "sugerencia", "titulo": "Redacción: nombre del proyecto y espacios en blanco", "ubicacion": "2.2.3, Tabla 3, 3.3.3 (pp. 13, 15 y 32)", "cita": "Renacer distingue de manera explícita entre educación y atención psicológica.", "problema": "Se corrigieron la repetición de la aclaración ética, la lista duplicada de 2.2.2 y el texto en primera persona. Queda el nombre escrito «Renacer» y «renacer» junto a «RENACER», y bloques de espacios en blanco antes de la Tabla 11 (3.3.3) que dejan una página casi vacía.", "mejora": "Unificar la escritura de RENACER y eliminar los saltos de página manuales."}]}, {"etiqueta": "AA2 · Capítulo IV", "titulo": "Producto mínimo viable: revisión de avance AA2", "resumen": "Avance AA2 (06/11/2026): retroalimentación formativa, sin calificación. El capítulo IV es claro y coherente con la propuesta de valor: la Tabla 14 vincula objetivos con indicadores de la Tabla 9, la Tabla 16 prioriza funcionalidades y se incluyen una ruta de derivación, criterios de exclusión y reglas de comunicación. Para alcanzar el nivel más alto faltan: (1) describir el taller, (2) documentar los pasos de desarrollo del MVP con evidencia real, (3) identificar al psicólogo y precisar el protocolo de riesgo, consentimiento y datos sensibles, (4) corregir las metas y el calendario que se contradicen, (5) probar el pago con un compromiso real y (6) sustentar las herramientas con criterios, alternativas y costos concretos.", "observaciones": [{"severidad": "critico", "titulo": "El MVP aparece como plan y maquetas: faltan los pasos seguidos y evidencia de que algo ya funciona", "ubicacion": "4.6.2 (Tabla 20) y 4.7 (Figuras 5 y 6)", "cita": "Son maquetas elaboradas para el informe y se ajustarán a la identidad visual definitiva. / los datos entre corchetes se completarán con la información definitiva del piloto.", "problema": "El nivel Sobresaliente exige sustentar todos los pasos seguidos para desarrollar el MVP. El capítulo no tiene un apartado de proceso (diseño, construcción, prueba interna, ajuste): la Tabla 20 es el calendario de ejecución del piloto, no los pasos de desarrollo del MVP. Tampoco hay evidencia de que los canales existan (perfiles creados, cuenta de WhatsApp Business configurada, enlace del formulario, capturas reales); las Figuras 5 y 6 son maquetas con datos entre corchetes y la Figura 4 no se acompaña de explicación de cada paso. Un MVP debe poder operarse, no solo describirse.", "mejora": "Agregar un apartado «Pasos de desarrollo del MVP» con una tabla paso, responsable, producto, evidencia y fecha (definición del flujo, creación de perfiles y WhatsApp Business, elaboración de fichas y formularios, prueba interna del formulario y del guion de orientación, ensayo del taller, ajustes). Sustituir las maquetas por capturas reales de lo ya creado y rotular cada figura con su fuente."}, {"severidad": "critico", "titulo": "El componente central del MVP, el taller piloto, no está descrito", "ubicacion": "4.1 (elementos del piloto) y Tabla 16, fila «Taller grupal piloto»", "cita": "Dos horas, presencial, horario nocturno, a cargo de un facilitador", "problema": "Todas las hipótesis (H2 y H3) y casi todas las metas de la Tabla 14 (asistencia, satisfacción, repetición) dependen del taller, pero no se indican su objetivo de aprendizaje, temas, agenda, dinámicas, materiales, local, aforo ni el perfil y la identidad del facilitador. Sin ello no se puede juzgar si es realmente mínimo, si materializa el diferencial de la propuesta de valor del capítulo II ni qué se está evaluando cuando se mide la satisfacción. Tampoco se aclara si el taller es gratuito o pagado en el piloto, dato que condiciona H2 y la tasa de conversión.", "mejora": "Incluir una ficha del taller (objetivo, 3 a 4 módulos con tiempos, técnicas, materiales, local y costo, aforo de 8 a 12, perfil y formación del facilitador, y condición gratuita o de precio simbólico). Relacionar cada módulo con la propuesta de valor y con una hipótesis."}, {"severidad": "critico", "titulo": "Salud mental: el psicólogo no está identificado y falta un protocolo operativo de riesgo y derivación", "ubicacion": "4.1 (sesión individual), 4.5 (Tabla 18) y 4.6.1", "cita": "[COMPLETAR: nombre y N.º de colegiatura, o psicólogo aliado] / presentar riesgo suicida, conductas autolesivas o un cuadro clínico que requiera atención especializada", "problema": "El capítulo II nombraba a la psicóloga con colegiatura; aquí la identidad vuelve a quedar abierta («o psicólogo aliado») y, si es aliado, no hay acuerdo ni rol definido. La Tabla 18 excluye a quien presente riesgo, pero no indica quién lo detecta ni con qué instrumento (la ficha de orientación y la conversación por WhatsApp no incluyen un tamizaje), y el facilitador no es clínico. No existe un protocolo para una crisis durante el taller grupal; la derivación se limita a informar la Línea 113, opción 5, sin registro, sin seguimiento de que la persona accedió a atención ni responsable. Tampoco se declaran los límites del servicio frente a un tratamiento psicológico dentro del consentimiento.", "mejora": "Completar nombre y colegiatura (o convenio con el psicólogo aliado). Redactar un protocolo breve: quién aplica el tamizaje y con qué pregunta o escala, qué se hace ante señales de riesgo antes, durante y después del taller, quién acompaña la derivación y cómo se registra, y capacitación mínima del facilitador en primeros auxilios psicológicos. Declarar en el consentimiento que el taller no es terapia ni sustituye la atención clínica."}, {"severidad": "importante", "titulo": "Consentimiento y datos de salud: el tratamiento de la información sensible no está resuelto", "ubicacion": "4.3 (Tabla 16, «Ficha de orientación y consentimiento») y 4.4 (Tabla 17, WhatsApp Business y formularios)", "cita": "los datos se tratan según la Ley N.º 29733 (Congreso de la República, 2011) / Se debe cuidar la confidencialidad de los datos de salud", "problema": "La ficha recoge información de bienestar emocional, que es dato sensible. Citar la Ley N.º 29733 no basta: no se detallan la finalidad, el consentimiento expreso, el plazo de conservación, quién accede ni qué ocurre con los datos al terminar el piloto, y la «limitación» de WhatsApp Business se enuncia sin medida de mitigación. Los formularios en línea pueden alojar los datos fuera del país. Además, el consentimiento de la sesión individual con el psicólogo (atención, confidencialidad y sus excepciones) es distinto del de la ficha.", "mejora": "Elaborar el texto del consentimiento del piloto y de la sesión individual (anexo), indicar el tratamiento de datos conforme a la Ley N.º 29733 y su reglamento vigente, y fijar reglas operativas: no recibir información clínica por chat, derivar al formulario, limitar el acceso a un responsable y eliminar los datos al cerrar el piloto."}, {"severidad": "importante", "titulo": "Los objetivos de la Tabla 14 no son todavía plenamente medibles: faltan plazo, muestra y vínculo con las hipótesis", "ubicacion": "4.2.2 (Tabla 14) y 4.1.2 (Tabla 13)", "cita": "Rango de S/ 85 a 150 por sesión (Doctoralia, s. f.; Psicologa.pe, s. f.) / ≤ S/ 60", "problema": "La tabla tiene indicador, meta e instrumento, pero no plazo ni base de cálculo por fila, y no indica qué hipótesis prueba cada objetivo: H1 no tiene objetivo propio y H3 («frente a la oferta actual») no tiene indicador comparativo. La fila de disposición de pago no contiene una meta sino un rango de precios de mercado; el precio máximo declarado no es verificable como logro. La meta de costo de captación (≤ S/ 60) no se justifica y el piloto no declara presupuesto de publicidad, de modo que su cálculo es incierto. La meta «clientes que repiten ≥ 70 %» no se puede medir: el piloto no ofrece una segunda compra o taller. Con 8 a 12 participantes, porcentajes como 85 % o 70 % equivalen a diferencias de una sola persona.", "mejora": "Añadir columnas hipótesis, muestra o denominador y plazo. Expresar las metas en conteos (por ejemplo, 7 de 10) y justificar cada cifra con una referencia o un supuesto declarado. Reemplazar la fila de precio por una meta verificable (porcentaje que acepta el precio de prueba o paga una tarifa simbólica). Eliminar o redefinir «repiten» (por ejemplo, intención de asistir a un segundo taller) y fijar el presupuesto de captación."}, {"severidad": "importante", "titulo": "Cifras y calendario internamente incompatibles", "ubicacion": "4.2.2 (Tabla 14), 4.5 y 4.6.2 (Tabla 20)", "cita": "Al menos 40 consultas y 10 inscritos / Seguimiento a las dos semanas del taller / Semana 4: Seguimiento, encuesta y análisis de indicadores", "problema": "Con 10 inscritos y una asistencia mínima de 70 % participan 7 personas, lo que da una conversión de 7 ÷ 40 = 17,5 %, menor que la meta de 25 % de la Tabla 14; para cumplir ambas metas se requieren unos 14 inscritos, por encima del tope de 12 de la muestra del apartado 4.5. Además, el taller se realiza en la semana 3 y el seguimiento a las dos semanas cae en la semana 5, fuera del calendario de cuatro semanas, de modo que el indicador de repetición y el análisis de la semana 4 no pueden calcularse. También es poco realista alcanzar 40 consultas en una semana de captación con cuentas nuevas y sin presupuesto publicitario.", "mejora": "Recalcular las metas de forma consistente (inscritos, asistentes, consultas) y ampliar el calendario a cinco o seis semanas, o ubicar el seguimiento antes. Respaldar la meta de 40 consultas con un supuesto de alcance o presupuesto y fijar un número de consultas alcanzable."}, {"severidad": "importante", "titulo": "La regla de decisión de la Tabla 15 ignora el cumplimiento ético y el pago, y su relación con el capítulo V es confusa", "ubicacion": "4.2.3 (Tabla 15)", "cita": "Se cumplen, al menos, 4 de las 5 primeras metas de la Tabla 14 / Pasar a la validación ampliada del capítulo 5", "problema": "Las «5 primeras metas» excluyen la disposición de pago (H2) y el cumplimiento ético y legal, que pasa a ser una meta más y no una condición. Un piloto podría «continuar» con consentimientos incompletos. Además, la acción «pasar a la validación ampliada del capítulo 5» contradice el capítulo V, donde las entrevistas y la encuesta se aplican al segmento y el piloto solo «complementa»; no se aclara el orden ni si el piloto precede o es simultáneo.", "mejora": "Establecer el 100 % de cumplimiento ético como condición previa (si falla, se detiene el piloto), incluir la disposición de pago en el conteo y precisar la secuencia entre piloto, entrevistas y encuesta en un solo cronograma."}, {"severidad": "importante", "titulo": "La mínima expresión del MVP no se justifica: tres redes, 12 funcionalidades y solo se descartan dos", "ubicacion": "4.1 (siete elementos), 4.1.1 y 4.3 (Tabla 16)", "cita": "perfiles en Instagram, Facebook y TikTok / Aplicación móvil propia: Pospuesta / Pagos en línea y suscripción: Pospuesta", "problema": "Ocho de las 12 funcionalidades se califican como «Imprescindible», y lo único que queda fuera son una aplicación y los pagos, que en un servicio piloto nunca estuvieron en juego. No se explica por qué el piloto necesita tres redes (TikTok exige producción de video; Tabla 17, «Requiere producción de video») cuando la hipótesis H4 solo requiere comparar uno o dos canales, ni por qué la videollamada, el seguimiento y la hoja de cálculo son imprescindibles para validar. El argumento de 4.1.1 («atención presencial con apoyo digital porque la OMS (2023) reconoce las intervenciones digitales») no justifica la modalidad presencial.", "mejora": "Añadir en la Tabla 16 una columna «Por qué es mínima» y una «Qué se deja fuera y por qué» con elementos reales (por ejemplo, dos redes de las tres, videollamada, sesión individual si la hipótesis no la requiere). Reducir el piloto a lo estrictamente necesario para H1 a H4 y rehacer el argumento de 4.1.1 con evidencia sobre la modalidad escogida."}, {"severidad": "importante", "titulo": "La Tabla 17 no sustenta la elección de herramientas: son categorías genéricas, sin criterios, alternativas ni costos", "ubicacion": "4.4 (Tabla 17)", "cita": "Formularios en línea / Hoja de cálculo / Videollamada", "problema": "Tres de las ocho herramientas no son herramientas concretas (no se nombra Google Forms o Microsoft Forms, Google Sheets o Excel, Meet o Zoom). Las columnas «Por qué se elige» y «Limitación» usan frases generales («Gratuito y sencillo», «Alcance variable») sin aplicar criterios de funcionalidad, usabilidad, viabilidad técnica y costo ni comparar con alternativas. No hay costo mensual, responsable de administración ni plan alternativo. La cifra de INEI (97,5 % de hogares con celular y 73,1 % con internet) describe hogares, no el uso de redes y WhatsApp por jóvenes de 18 a 35 años.", "mejora": "Reestructurar la tabla con herramienta concreta, función en el MVP, criterio de selección (funcionalidad, usabilidad, viabilidad técnica, costo), alternativa descartada, costo y responsable. Reemplazar o complementar el dato de hogares con uso de redes y mensajería en el grupo de 18 a 35 años (por ejemplo, ENAHO)."}, {"severidad": "importante", "titulo": "El MVP prueba H2 con disposición declarada, no con un comportamiento de pago", "ubicacion": "4.1.2 (Tabla 13, H2) y 4.2.2 (Tabla 14)", "cita": "Tasa de conversión y disposición de pago declarada", "problema": "Un MVP se justifica por recoger comportamiento, no solo opinión. El piloto no cobra ni compromete un pago (los pagos están pospuestos) y no define el precio del taller; lo declarado en una encuesta suele sobrestimar el pago real. El resultado no permite alimentar el cap. 6 con un precio ni con un volumen sustentados.", "mejora": "Definir un precio de prueba del taller y de la sesión (aunque sea simbólico, con pago por Yape o transferencia manual) o un compromiso de preventa, y medir cuántos de los inscritos lo aceptan."}, {"severidad": "sugerencia", "titulo": "Dato demográfico de 4.4 y su fuente", "ubicacion": "4.4", "cita": "el 97,5 % de los hogares de Arequipa dispone de teléfono celular y el 73,1 % tiene acceso a internet (Instituto Nacional de Estadística e Informática [INEI], 2025)", "problema": "La cifra se atribuye a los Censos Nacionales 2025 sin tabla ni página y no puede comprobarse con lo presentado. Conviene verificarla contra la publicación oficial antes de entregar.", "mejora": "Citar el cuadro y la página exactos (o la URL de la base) y confirmar que los valores son de Arequipa y no del país o de otro ámbito."}, {"severidad": "sugerencia", "titulo": "Cuidados de redacción, rotulado y notas de trabajo", "ubicacion": "4.1, Figura 4, Tabla 14 y Tabla 20", "cita": "4.1. Descripción del MV / Nota. Elaboración propia. Fechas del piloto: [COMPLETAR: fecha de inicio y de fin].", "problema": "El título 4.1 tiene un error («MV»); la nota de la Tabla 20 contiene un marcador pendiente; la Tabla 14 remite a «Tabla 9» y a «apartado 3.2.11» a la vez; la sigla CSMC se usa sin definirse en este capítulo; la Figura 4 no explica cada flujo en el texto. Los marcadores [COMPLETAR] no pueden quedar en el expediente final.", "mejora": "Corregir el título, completar fechas y datos del psicólogo, unificar las remisiones, definir las siglas y describir en el texto cada paso de la Figura 4."}]}, {"etiqueta": "AA2 · Capítulo V", "titulo": "Validación: revisión de avance AA2", "resumen": "Avance AA2 (06/11/2026): retroalimentación formativa, sin calificación. El capítulo V presenta un diseño metodológico ordenado (ficha técnica, cuestionario y guía de entrevista vinculados a objetivos) y el cálculo de 97 encuestas es correcto, y no se simulan resultados. Sin embargo, es solo un plan: no hay entrevistas realizadas, encuesta aplicada, análisis frente a la Tabla 27 ni mejoras al MVP, que es lo que exige la AA2. Además, conviene unificar los criterios de éxito (Tablas 15, 26 y 27), cerrar el diseño de muestreo y cuotas, ajustar la ética de las entrevistas y reconstruir el dimensionamiento de mercado.", "observaciones": [{"severidad": "critico", "titulo": "No hay resultados reales: el capítulo es un plan y las Tablas 24, 25 y 26 están vacías", "ubicacion": "Introducción del capítulo; 5.2.2 a 5.2.4 (Tablas 24 a 26)", "cita": "Este apartado se completa con las respuestas reales de los entrevistados. / Por registrar", "problema": "El capítulo declara que «define cómo se obtendrá la evidencia primaria». En la AA2 se exige recolectar datos reales y analizarlos para determinar la viabilidad; aquí no figuran ni fechas, ni códigos efectivamente asignados, ni un solo dato (E1 a E8 aparecen como «Por registrar») ni resultados de la encuesta ni del piloto. La honestidad de no simular resultados es correcta, pero el criterio de validación solo alcanza el nivel de definir herramientas («En proceso»).", "mejora": "Antes de la exposición, realizar las entrevistas (mínimo 8) y aplicar la encuesta (mínimo 97 respuestas) y completar las Tablas 24 a 26 con códigos, fechas y consentimiento de cada entrevistado, y añadir tablas de resultados de la encuesta con n, frecuencias y porcentajes por pregunta."}, {"severidad": "critico", "titulo": "No hay estructura para analizar resultados, concluir con métricas ni proponer mejoras al MVP", "ubicacion": "Estructura 5.1 a 5.5", "cita": "Los resultados del piloto del capítulo IV complementan ambas técnicas con datos de comportamiento real.", "problema": "La rúbrica del nivel Sobresaliente exige sustentar mejoras al MVP a partir del análisis crítico de los resultados. El capítulo termina en la segmentación (5.5): no existen apartados para los resultados de la encuesta, el análisis frente a los criterios de la Tabla 27, la integración con los datos del piloto, las conclusiones con métricas ni los cambios al MVP (Tablas 13, 14 y 16) y al precio que alimentarán el cap. 6. No se indica cómo se analizarán los datos del piloto en este capítulo.", "mejora": "Agregar apartados: resultados de entrevistas; resultados de la encuesta (por objetivo, con n, % e interpretación); contraste con los criterios de la Tabla 27; conclusiones de validación por hipótesis (confirmada, ajustada o descartada); mejoras al MVP con antes y después; y consecuencias para el cap. 6 (precio, volumen, costos)."}, {"severidad": "importante", "titulo": "Diseño de las entrevistas: criterios de selección, reclutamiento y periodo no definidos", "ubicacion": "5.1.1 y Tabla 21", "cita": "Muestreo: Intencional, por criterios del perfil / Periodo: [COMPLETAR: fechas]", "problema": "No se explicitan los criterios de la selección intencional (edad, sexo, ocupación, experiencia previa con apoyo emocional), cómo se contactará a los participantes, quién entrevistará (si son integrantes que entrevistan a conocidos, hay sesgo de cortesía) ni en qué plazo. El periodo es «[COMPLETAR: fechas]» en ambas columnas y no coincide con la Tabla 20. Guest et al. (2006) sustentan la saturación en 6 a 12 entrevistas, pero se debe definir cómo se verificará (registro de códigos nuevos por entrevista) en lugar de asumirla.", "mejora": "Definir una matriz de perfiles (por ejemplo, 2 estudiantes, 2 dependientes, 2 independientes, 2 con experiencia previa de apoyo), el canal de reclutamiento, el entrevistador y un cronograma con fechas; incluir un criterio operativo de saturación."}, {"severidad": "importante", "titulo": "El cálculo del tamaño de muestra es correcto, pero su interpretación no es coherente con el muestreo no probabilístico", "ubicacion": "5.1.2 y Tabla 21", "cita": "n = (1,96² × 0,5 × 0,5) ÷ 0,10² = 96,04, es decir, 97 encuestas como mínimo", "problema": "Se verificó la operación: 3,8416 × 0,25 ÷ 0,01 = 96,04, y el redondeo a 97 es correcto. El problema es conceptual: declarar 95 % de confianza y 10 % de error para una muestra por conveniencia con cuotas no tiene validez estadística (el propio texto admite que los resultados no se generalizan), y un margen de ±10 puntos es amplio frente a umbrales como ≥ 40 %, ≥ 50 % o ≥ 60 % de la Tabla 27. Los subgrupos por cuota (25 personas) no permiten comparaciones. Tampoco se aclara el tamaño de la población de referencia (la fórmula es para poblaciones grandes y en el capítulo II se citaron 405 479 personas de 18 a 35 años en el departamento).", "mejora": "Presentar el 97 como tamaño de referencia (no como error estadístico) y declarar el sesgo del muestreo; fijar reglas de decisión que consideren la incertidumbre (por ejemplo, que el límite inferior del intervalo supere el umbral) y evitar interpretar diferencias por subgrupo."}, {"severidad": "importante", "titulo": "Cuotas y segmentación: no son coherentes con el filtro ni con el segmento de los capítulos II y III", "ubicacion": "5.5.2 (Tabla 29), 5.5.3 (Tabla 30) y Tabla 22", "cita": "Mínimo 20 por categoría: estudiante, dependiente, independiente o profesional / Escala de interés y motivaciones", "problema": "La cuota de ocupación tiene tres categorías, pero la pregunta 2 de la Tabla 22 ofrece cinco opciones (incluye «Estudio y trabajo» y «Otra»); 3 × 20 = 60, por lo que 40 casos quedan sin regla. La distribución por edad (40, 35 y 25) se funda en supuestos («mayor uso de redes») y no en la estructura poblacional de INEI. El nivel socioeconómico B y C, fijado en el capítulo II como parte del segmento, aparece como «[COMPLETAR: niveles]» y no se mide en ninguna pregunta. La Tabla 29 promete una «escala de interés y motivaciones» y «valora la privacidad» que no existen en el cuestionario (preguntas 1 a 12), de modo que esas variables no se validan.", "mejora": "Alinear las cuotas con las opciones de la pregunta 2, justificar las proporciones con datos de INEI, incorporar una pregunta o un filtro de nivel socioeconómico (o declararlo no medido) y ajustar la Tabla 29 a lo que el cuestionario realmente mide. Los aspectos de residencia y sexo ya se observaron en la sección del formulario."}, {"severidad": "importante", "titulo": "Tres juegos de criterios de éxito para las mismas hipótesis, con umbrales distintos y todavía «ajustables»", "ubicacion": "Tabla 15 (cap. IV), Tabla 26 y Tabla 27", "cita": "Los criterios son propuestos y pueden ajustarse antes de aplicar las entrevistas. / Los criterios de validación se ajustarán con el docente antes de aplicar los instrumentos.", "problema": "H1 se confirma con «6 de 8 entrevistados» (75 %) en la Tabla 26 y con «≥ 60 %» en la Tabla 27; H2 con «al menos la mitad» en la Tabla 26, con «≥ 40 %» en la Tabla 27 y con una conversión de 25 % en la Tabla 14; H4 es «la mayoría» frente a «el canal con mayor porcentaje». Cuatro de los siete objetivos (2, 5, 6 y 7) no tienen un umbral numérico («ordenadas por frecuencia», «mayor preferencia», «informativo»). No se justifica ninguna cifra. Mientras los criterios puedan ajustarse una vez aplicados los instrumentos, la validación pierde objetividad. Además, las notas que dicen «con el docente» son indicaciones de trabajo, no texto del informe.", "mejora": "Unificar en una sola matriz hipótesis, objetivo, instrumento, indicador, umbral y justificación del umbral; fijarla antes de la recolección y retirar las notas sobre ajustes."}, {"severidad": "importante", "titulo": "Coherencia entre hipótesis, objetivos y la propuesta de valor: faltan objetivos y sobran vínculos", "ubicacion": "Tabla 13, Tabla 23 y Tabla 27; objetivo general (5.3)", "cita": "Determinar ... si la propuesta de valor de RENACER responde a sus necesidades y si existe disposición de pago", "problema": "El objetivo general promete evaluar si la propuesta responde a las necesidades, pero ningún objetivo específico mide la aceptación de la propuesta ni la intención de participar (solo la pregunta 5 de entrevistas, sin criterio). Los objetivos 6 (modalidad) y 7 (ayahuasca) se asignan a H3, que según la Tabla 13 trata del horario y el seguimiento «frente a la oferta actual», pero el objetivo 4 solo mide importancia, sin comparar con la oferta actual de la Tabla 6 del capítulo II. La Tabla 23 asigna la pregunta 4 de entrevistas a los objetivos 3, 4 y 6, mientras la Tabla 27 lista «Encuesta» como única técnica para ellos; las indicaciones para el entrevistador no vinculan H4 con la pregunta 2.", "mejora": "Añadir un objetivo y un criterio de aceptación o intención de participar; crear hipótesis para modalidad y para el contenido sobre ayahuasca o retirar esos objetivos; incorporar un ítem comparativo con la oferta actual y reconciliar la columna Técnica con la Tabla 23."}, {"severidad": "importante", "titulo": "Ética de las entrevistas y uso de los datos: incongruencias y sesgos en la guía", "ubicacion": "5.1.3, 5.1.4.1 y Tabla 23", "cita": "Cuéntame cómo sueles manejar una situación de estrés o malestar emocional... ¿Cuándo fue la última vez? / Las respuestas se usarán solo con fines académicos", "problema": "La pregunta 1 invita a relatar episodios recientes de malestar, lo que contradice el compromiso de «no indagar sobre diagnósticos ni experiencias traumáticas», y el entrevistador no es clínico ni se prevé quién actuará si surge una crisis. El texto de consentimiento presentado corresponde solo a la encuesta; no se incluye el de las entrevistas con grabación de audio (plazo de conservación, destino, anonimización). El consentimiento dice «solo con fines académicos» pero los resultados fijan precio y se usan para decidir sobre un emprendimiento. En la pregunta 5 se presenta RENACER antes de preguntar «qué te parece útil», lo que induce respuestas de cortesía.", "mejora": "Reformular la pregunta 1 de modo general (estrategias y recursos, no episodios), adjuntar el consentimiento de las entrevistas, ajustar el propósito («con fines académicos y de validación de un proyecto de emprendimiento») y presentar el servicio con material neutral (maquetas de las Figuras 5 y 6) preguntando también qué no les convence."}, {"severidad": "importante", "titulo": "Dimensionamiento de mercado incompleto, mal definido y con cifras por verificar", "ubicacion": "5.5.1 y Tabla 28", "cita": "Mercado total: Población de la provincia de Arequipa, 1 322 000 (INEI, 2025) / [COMPLETAR: INEI]", "problema": "Los niveles de la Tabla 28 no son un embudo de mercado: el «mercado total» es la población general de la provincia (no de 18 a 35 años), el «mercado inicial» son los 8 a 12 participantes del piloto (una muestra, no un mercado) y el «mercado objetivo» se estimará con el porcentaje de interés de una muestra por conveniencia, lo que no es extrapolable. El dato del mercado disponible está en blanco aunque el capítulo II ya citaba 405 479 personas de 18 a 35 años del departamento. Las cifras de 1 815 000 y 1 322 000 habitantes deben contrastarse con la publicación oficial del INEI (Censos Nacionales 2025), indicando tabla y fecha de consulta, antes de usarlas como base del dimensionamiento.", "mejora": "Construir el embudo con jóvenes de 18 a 35 años de los distritos de Arequipa Metropolitana (INEI), nivel socioeconómico objetivo, y la capacidad de atención del primer año (20 clientes en la BMC); citar tabla y página de cada cifra; usar el resultado de la encuesta solo como indicio, no como porcentaje de mercado."}, {"severidad": "sugerencia", "titulo": "Secuencia metodológica y orden de apartados", "ubicacion": "5.1, 5.1.4, 5.3 y 5.4", "cita": "Los instrumentos se diseñaron para responder a los objetivos específicos de la Tabla 27.", "problema": "Se describe un diseño de dos etapas (primero entrevistas, luego encuesta) pero el cuestionario ya está elaborado y publicado, de modo que no podrá incorporar hallazgos de las entrevistas. Además, las Tablas 21 a 23 remiten a los objetivos O1 a O7 de la Tabla 27, que se presenta después (5.4).", "mejora": "Colocar los objetivos y criterios antes de la metodología (5.1 y 5.2), justificar que el cuestionario se ajustará tras las entrevistas o cambiar el diseño a uno simultáneo."}, {"severidad": "sugerencia", "titulo": "Marcadores y notas de trabajo en el cuerpo del informe", "ubicacion": "Tablas 21, 24, 25, 26, 27 y 30", "cita": "[COMPLETAR: fechas] / Por registrar / Las cuotas son propuestas y se ajustan a la disponibilidad real de participantes.", "problema": "El expediente final no debe contener marcadores ni instrucciones. Además, la explicación de una cuota flexible («se ajustan a la disponibilidad real») debilita su valor metodológico.", "mejora": "Completar o retirar cada marcador; definir una regla de reemplazo de cuotas (por ejemplo, tolerancia de ±5 por celda)."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Instrumento de la encuesta y guía de entrevista (5.1.4)", "resumen": "Instrumento bien organizado, pero incompleto para validar la funcionalidad del MVP y la disposición de pago, y sin datos recolectados.", "observaciones": [{"severidad": "critico", "titulo": "No se identifica el formulario en línea y no hay evidencia de recolección", "ubicacion": "Tabla 21 (Periodo y Modalidad) y 5.2", "cita": "Periodo: [COMPLETAR: fechas]", "problema": "No se entregó el enlace del formulario ni una captura del formulario publicado. El informe solo describe que se compartirá «por redes sociales y WhatsApp» y afirma que los resultados se registran «únicamente con respuestas reales», pero no existe ninguna respuesta ni fecha de aplicación. En la AA2 se exige recolección real de datos (muestra, instrumento, resultados y métricas).", "mejora": "Publicar el formulario, compartir el enlace de vista y agregarlo al informe (anexo). Aplicar como mínimo 97 encuestas y 8 entrevistas y completar la Tabla 21 con las fechas reales, el número de respuestas válidas y los códigos de los entrevistados."}, {"severidad": "critico", "titulo": "El cuestionario nunca muestra el servicio: no valida la funcionalidad del MVP", "ubicacion": "Tabla 22, preguntas 1 a 12", "cita": "¿Cuánto estarías dispuesto(a) a pagar por un taller grupal de educación emocional de 2 horas?", "problema": "Ninguna pregunta describe ni presenta el prototipo (contenido del taller, facilitador, sesión con psicólogo colegiado, seguimiento, canal de WhatsApp). El encuestado responde sobre un taller que no conoce, por lo que la encuesta mide actitudes generales, no la aceptación del MVP. Tampoco hay preguntas de usabilidad o comprensión de la propuesta de valor ni de intención de participar. En la guía de entrevista solo la pregunta 5 describe RENACER, y de forma verbal.", "mejora": "Insertar antes de las preguntas 8 a 11 una ficha breve con el servicio (qué incluye, duración, modalidad, quién lo dirige, precio de prueba) y una imagen del flujo (Figura 4) o de la comunicación en redes. Agregar preguntas de comprensión («¿Qué entiendes que incluye?»), intención de participar en el piloto (escala o sí/no) y qué elemento es más/menos valioso de los siete del MVP."}, {"severidad": "critico", "titulo": "Disposición de pago declarada, sin precio concreto y anclada en el rango que se quiere validar", "ubicacion": "Preguntas 10 y 11; Tabla 27, objetivo 3", "cita": "c) S/ 50 a 84 · d) S/ 85 a 120 · e) S/ 121 a 150", "problema": "Los rangos de la pregunta 11 reproducen la referencia de mercado de Doctoralia y Psicologa.pe (nota de la Tabla 22), por lo que el encuestado se ancla en esos montos. La pregunta 10 usa rangos desiguales (menos de S/ 30; 30 a 50; 51 a 80; más de 80) y no se propone un precio para el taller, que es el producto de entrada. Además, el criterio de éxito (≥ 40 % dispuesto a pagar S/ 85 a 150 por sesión) solo cubre la sesión individual, y la «Lectura de las respuestas» no aclara qué opciones cuentan como disposición de pago (por ejemplo, si «Menos de S/ 30» suma). Es disposición declarada, no pago real: no hay intención de compra ni prueba de pago.", "mejora": "Definir un precio de lanzamiento del taller (y de la sesión) y preguntar la probabilidad de inscribirse a ese precio (escala 1 a 5), complementada con un método de sensibilidad de precio (por ejemplo, Van Westendorp: muy barato, barato, caro, demasiado caro) con respuesta abierta numérica, sin mostrar rangos de referencia. Fijar un criterio de éxito para el taller. Idealmente, incluir una preinscripción con depósito simbólico o reserva como medición de pago real para el piloto."}, {"severidad": "importante", "titulo": "Pregunta 9: solo dos atributos y ambos son los diferenciadores del grupo", "ubicacion": "Pregunta 9; Tabla 27, objetivo 4", "cita": "a) Horarios nocturnos o de fin de semana: 1 2 3 4 5 · b) Seguimiento después del taller o sesión, por ejemplo un contacto a las dos semanas: 1 2 3 4 5", "problema": "La escala evalúa únicamente los atributos que RENACER quiere confirmar, por lo que induce a la aquiescencia (todo atributo propuesto parecerá importante). El ítem (a) es doble (nocturno o fin de semana) y el criterio de éxito es bajo (≥ 50 % puntúa 4 o 5), por lo que casi cualquier resultado lo cumplirá. La importancia declarada tampoco prueba que el seguimiento sea una ventaja frente al consultorio, el CSMC o la plataforma en línea de la Tabla 6.", "mejora": "Presentar una batería balanceada de 6 a 8 atributos (precio, ubicación, horario, modalidad, seguimiento, quién brinda el servicio, privacidad, certificación del psicólogo, contenido), con orden aleatorio, y pedir además que elijan los 2 más importantes (ranking). Separar «nocturno» de «fin de semana». Subir el umbral o definirlo en función de los demás atributos."}, {"severidad": "importante", "titulo": "Pregunta 8: opciones que empujan hacia la propuesta y mezclan dos dimensiones", "ubicacion": "Pregunta 8; Tabla 27, objetivo 6", "cita": "a) Presencial, en la noche entre semana · b) Presencial, sábado · c) Virtual, en la noche entre semana · d) Virtual, en horario flexible · e) Modalidad mixta", "problema": "Modalidad y horario se mezclan en una sola pregunta de respuesta única; no hay opciones de mañana, tarde entre semana ni domingo, y casi todas las alternativas son nocturnas, coherentes con el diseño del taller. El resultado no permite saber si la preferencia nocturna es real ni separar modalidad de franja horaria.", "mejora": "Dividir en dos preguntas: modalidad (presencial, virtual, mixta) y franja disponible (selección múltiple: mañana, tarde, noche entre semana, sábado, domingo). Incluir «Otra» y «Ninguna me conviene»."}, {"severidad": "importante", "titulo": "Preguntas 3 y 4: formulación doble y afirmativa que sesga la medición del problema", "ubicacion": "Preguntas 3 y 4; Tabla 27, objetivo 1", "cita": "¿Con qué frecuencia te cuesta identificar o expresar lo que sientes? · Me resulta difícil saber qué información sobre salud mental o bienestar emocional es confiable.", "problema": "La pregunta 3 pregunta por dos conductas distintas (identificar y expresar) en una misma escala; la 4 es una afirmación única de acuerdo/desacuerdo, tipo de ítem propenso a la aquiescencia. Con muestreo por conveniencia entre personas interesadas en bienestar emocional, el criterio de ≥ 60 % «declara la dificultad» (Tabla 27) tenderá a sobrestimarse. Además, el criterio cuenta «A menudo» y «Casi siempre» sin explicar por qué ese umbral prueba que el problema justifica el servicio.", "mejora": "Separar la pregunta 3 en dos ítems, añadir ítems inversos o neutros y una pregunta sobre conductas reales (si buscó ayuda en los últimos 12 meses y cuánto gastó). Reportar los resultados diferenciando a quienes ya buscaron ayuda de quienes no."}, {"severidad": "importante", "titulo": "Cobertura incompleta de hipótesis y del modelo de negocio", "ubicacion": "Tablas 13, 16, 22 y 27 (H2 y H4)", "cita": "H4: Las redes sociales y WhatsApp son canales eficaces y de costo razonable para captar al segmento.", "problema": "H4 se verifica con costo de captación y origen de las consultas (piloto), pero el cuestionario solo pregunta dónde se informan (pregunta 7, O5), no por dónde contactarían ni qué canal los convencería. No hay preguntas sobre experiencias de pago previas, quién influye en la decisión, ni sobre las alternativas que usan hoy y su precio. Tampoco se pregunta si prefieren el taller o la sesión individual, ni si les resulta confiable que lo brinde un facilitador que no es psicólogo. La encuesta de satisfacción del piloto (Tabla 16) no se presenta como instrumento.", "mejora": "Añadir: canal preferido de contacto, uso previo de servicios de bienestar y monto pagado, preferencia taller versus sesión, y confianza según quién brinda el servicio. Incluir la encuesta de satisfacción y la ficha de orientación como anexos, con las preguntas exactas."}, {"severidad": "importante", "titulo": "Cuotas y variables de control incoherentes con el instrumento", "ubicacion": "Pregunta 2, 5.1.4.1 y Tabla 30", "cita": "Ocupación: Mínimo 20 por categoría: estudiante, dependiente, independiente o profesional", "problema": "La pregunta 2 ofrece cinco opciones («Solo estudio», «Estudio y trabajo», «Trabajo en una empresa…», «Soy independiente o profesional», «Otra») que no coinciden con las tres categorías de la cuota; no se sabe dónde se clasifica a quien estudia y trabaja. Se piden sexo y distrito como datos de control, pero no el nivel socioeconómico, aunque el segmento objetivo (apartado 2.5) se define por NSE. La edad tiene un rango de 31 a 35 que quedaría en 25 encuestas, insuficiente para analizar por subgrupo.", "mejora": "Alinear las opciones de la pregunta 2 con las categorías de cuota, agregar una pregunta o proxy de nivel socioeconómico (distrito, ingreso aproximado) y declarar que los análisis por subgrupo son solo descriptivos."}, {"severidad": "sugerencia", "titulo": "Pregunta 12 sobre ayahuasca: formulación que informa antes de medir", "ubicacion": "Pregunta 12; Tabla 27, objetivo 7", "cita": "Si un servicio de bienestar emocional incluyera información educativa sobre experiencias no ordinarias de conciencia, como la ayahuasca, ¿cómo influiría en tu interés?", "problema": "El eufemismo «experiencias no ordinarias de conciencia» y la primera opción («Me interesaría más») sugieren una valoración positiva. Además, el MVP declara que la ayahuasca no es parte del piloto (4.1.1); preguntarla en una encuesta de validación de 12 preguntas sin explicar su rol puede confundir y desviar la atención del servicio principal.", "mejora": "Ubicarla al final, con redacción neutral (por ejemplo, «¿Cómo cambiaría tu interés si el servicio incluyera información sobre ayahuasca?») y opciones simétricas (aumentaría mucho, aumentaría algo, sin cambio, disminuiría algo, disminuiría mucho), con una nota que aclare que no es parte del servicio ofrecido."}, {"severidad": "sugerencia", "titulo": "Instrumento sin preguntas abiertas ni captación de contactos para el piloto", "ubicacion": "Tabla 22", "cita": "Cuestionario de 12 preguntas cerradas (apartado 5.1.4)", "problema": "Todo el cuestionario es cerrado: no se puede recoger objeciones, lenguaje del cliente ni sugerencias de mejora para el MVP, que es lo     <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
