<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {

  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { margin-top: 28px; padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

corrección, y la numeración de tablas y figuras es continua. Persisten: en el Cap. 1, la cifra de 78 suicidios (menor que 2025) sin explicar, la ayahuasca en el problema sin evidencia de demanda, el dato de ODS 4 (ERCE 2019, escolares) y la línea de investigación sin fuente institucional; en el Cap. 2, la Tabla 6 con la columna «Consultorio privado» copiada de la de RENACER (horario y seguimiento idénticos) y un precio de S/ 160 sin fuente, junto con una nota que aún es una instrucción de trabajo («se obtendrán llamando a al menos cinco alternativas»), y el cálculo del segmento (niveles A+B y C citados, pero se elige B y C; cifra departamental y no metropolitana); y en el conjunto, las Referencias con restos de redacción: cuatro entradas con «[COMPLETAR…]» y «testimonio directo», unas catorce líneas «Consultar…», entradas sueltas («CPI», «proyectos.inei.gob.pe»), duplicados y «&amp;».", "fortalezas": ["Cap. 2 (2.1, Tabla 3): subsanaron la ambigüedad sobre quién brinda el acompañamiento psicológico. Ahora se nombra a la psicóloga con colegiatura (C.Ps.P. N.° 63830), se separa lo educativo (facilitadores) de lo psicológico (psicólogo colegiado) y se explica la derivación a un CSMC. La Tabla 3 asigna responsable y finalidad a cada componente.", "Cap. 2 (2.4.1, Tabla 6): se agregó la comparación con consultorio privado, CSMC y plataforma en línea (precio, horario, formato, seguimiento, especialización) y tres ventajas verificables a validar (horarios, seguimiento estructurado, talleres grupales más sesiones individuales). Además, la ayahuasca se declara «complemento educativo, no el diferencial principal».", "Cap. 2 (2.2.3): el riesgo legal más sensible quedó tratado con prudencia. Define «integración posterior» como apoyo educativo y de orientación, aplicable por igual a los caps. II y III y al BMC; agrega la base normativa (DS 023-2001-SA, DS 005-2019-SA, Ley 26842 art. 119, Ley 29571, RDN 836/INC) y remite a un asesor legal la aplicación a usos tradicionales. El caso de uso 3 aclara que Andrea no ha consumido ayahuasca.", "Cap. 2 (2.2.9, 2.5): la sostenibilidad ahora incluye tres medidas ambientales vinculadas al ODS 12, y la segmentación añade nivel socioeconómico (B y C, como hipótesis), una referencia de tamaño (INEI, 405 479 personas de 18 a 35 años en el departamento) y un cliente prioritario definido.", "Cap. 3 (3.1, 3.2): un único mapa de empatía con los seis cuadrantes (Figura 2) coherente con 2.5 y con los matices por perfil rotulados como hipótesis; el BMC (Figura 3) con los 9 bloques consistentes con el segmento y la propuesta de valor, desarrollado en 3.2.1 a 3.2.9, y el apartado 3.2.10 cuantifica la lógica de ingresos y costos (S/ 150, 20 clientes, S/ 3 000 de ingreso, S/ 50 por hora de psicólogo).", "Cap. 3 (3.2.11, Tabla 9): seis indicadores (conversión, costo de captación, retención, satisfacción, asistencia a talleres y margen operativo) con fórmula, ejemplo de cálculo, meta y frecuencia, vinculados a los controles de la Tabla 4. Los cálculos de los ejemplos son correctos y la nota aclara que son ilustrativos.", "Cap. 3 (3.3): competidores directos reales (Cálide, Senses Psicólogos, CSMC y plataformas) con modalidad, profesionales, precio, seguimiento y canal en la Tabla 10; fortalezas y limitaciones verificables con oportunidad para RENACER (Tabla 11) y clasificación entre directos e indirectos (Tabla 12). Los dos bloques duplicados y las notas «para evitar el error identificado por el docente» desaparecieron.", "Cap. 1 (versión del 06/11/2026): estructura el problema en 1.1 y 1.2, con Tabla 1 que cuantifica consecuencias, cifras de Arequipa, metas ODS 3.4, 3.8 y 4.7, dos megatendencias de CEPLAN y un apartado 1.4 que declara el problema como hipótesis de trabajo.", "Formato: la numeración de tablas y figuras ahora es continua (Tablas 1 a 12, Figuras 1 a 3), cada una con título y «Nota. Elaboración propia» o fuente, y el índice automático es consistente con los capítulos."], "prioridades": ["Referencias (prioridad más urgente): sustituir las cuatro entradas «[COMPLETAR: título de la página]» (Ayahuasca Inner World, Cálide, Casa Muyuqui, Senses) por citas verificables (título de la página, URL y fecha de consulta; «testimonio directo de una integrante» no es una fuente citable), eliminar las líneas «Consultar…» y las entradas sueltas («CPI», «proyectos.inei.gob.pe»), unificar los duplicados (Ley 26842, MINSA s. f.), diferenciar UNESCO 2024a/2024b y los dos INEI 2025, retirar «&amp;» y alinear lo citado con lo listado (Giove, 2022 y Agencia Andina, 2008 figuran en la lista y no en el texto; las Leyes 29571 y 29733 se citan y no figuran).", "Cap. 2 (Tabla 6): la columna «Consultorio privado» repite literalmente el horario y el seguimiento de RENACER y propone S/ 160 sin fuente, y la nota dice que los datos «se obtendrán llamando a al menos cinco alternativas»; completar con datos reales de al menos dos consultorios citados o retirar la columna, y quitar la frase de instrucción. Corregir «unes a viernes».", "Cap. 2 (2.5.2): el nivel socioeconómico se fundamenta con A+B (20.2 %) y C (37.4 %) del departamento, pero el segmento elegido es B y C; la cifra de 405 479 personas es departamental. Citar la fuente completa (hoy «Consultar informe estadístico») y aproximar el tamaño a Arequipa Metropolitana (distritos) o declararlo como pendiente.", "Cap. 1 (1.2.1 y Tabla 1): explicar la cifra de 78 suicidios en 2026 frente a 121 en 2025, que muestra una disminución y contradice la «demanda creciente», o retirarla; reforzar con una fuente oficial (GERESA Arequipa, MINSA, INSM).", "Cap. 1 (1.1.1, 1.2.2 y 1.3): sustentar con datos de demanda la ayahuasca como parte del problema o dejarla fuera del problema central; reemplazar el dato ERCE 2019 de escolares por evidencia pertinente al segmento de 18 a 35 años; respaldar la línea de investigación con la denominación oficial de CERTUS y corregir la carrera («Dirección de Empresas» en las Referencias, «Administración de Empresas» en la carátula).", "Cap. 3 (3.2.10 y Tabla 9): unificar las cifras de ejemplo del margen operativo (ingresos S/ 4 800 y costos S/ 3 600) con las de 3.2.10 (S/ 3 000 y S/ 1 000); aclarar si el psicólogo es del equipo (2.1, una psicóloga nominada) o un «psicólogo aliado» pagado a S/ 50 por hora (3.2.10, 3.2.8).", "Sugerencia: la validación real con entrevistas o encuestas (2.6, Tablas 7 y 8) se exigirá en el cap. 5 (AA2); mientras tanto unificar el número de entrevistas (Tabla 7 dice 5, la Tabla 8 tiene 8 filas). El precio es referencial en la AA1 y se desarrollará con la tabla de costos del cap. 6."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actuales y confiables, analizadas de forma crítica para mostrar qué aportan al proyecto en relación con las megatendencias y los ODS.", "falta": "Cap. 1: dos megatendencias con CEPLAN (2024, 2025), ODS 3 y 4 con metas y cifras, y cifras de Arequipa. Cap. 2: se sumó base normativa (DS 023-2001-SA, DS 005-2019-SA, Ley 26842) y datos de mercado (INEI, CPI). Falta: dato de ODS 4 pertinente al segmento (el ERCE 2019 evalúa escolares); depender menos de notas de prensa (El Búho) y de una nota de 2023; fuente institucional para la línea de investigación; y, sobre todo, limpiar las Referencias, donde quedan «[COMPLETAR…]», «Consultar…», duplicados, entradas sueltas, «&amp;», y fuentes de competidores basadas en «testimonio directo»."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cuantitativa y fuentes, vinculada de forma explícita a megatendencias, ODS y necesidades del cliente.", "falta": "El problema ya se formula como dificultad del cliente, se separa en problema del cliente y social y se sustenta con cifras de Arequipa, consecuencias cuantificadas (Tabla 1), ODS y megatendencias; en el Cap. 2 se engancha con la Tabla 5 (problema-solución). Falta: explicar la cifra de 78 suicidios que contradice el aumento; probar la demanda de ayahuasca que se incluye en el problema pero no figura en causas, árbol ni definición; cuantificar mejor tiempo y dinero; y sustentar con fuente las causas de 1.1.3."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Están todos los apartados con contenido: la ficha técnica (Tabla 2) tiene responsable de cada componente, sostenibilidad ambiental y base normativa, hay segmento con NSE y tres casos de uso. Para llegar al nivel superior falta un diferencial demostrado (la Tabla 6 compara con un consultorio cuyos datos son copia de los de RENACER y no tienen fuente; los competidores ya ofrecen horarios amplios, como Cálide, de 9:00 a. m. a 9:00 p. m.); y unificar detalles entre secciones (precio por validar en Tabla 2 y 2.2.5 pero S/ 150 en Tabla 6 y 3.2.10; seguimiento semanal en Tabla 2 y quincenal en el caso de uso 2)."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumenten la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "Mapa de empatía único y coherente, BMC con 9 bloques, apartado de coherencia con cifras (3.2.10), indicadores de gestión con fórmula y ejemplo (Tabla 9) y competidores directos e indirectos clasificados. Quedan detalles por pulir: las cifras de ejemplo de Tabla 9 no coinciden con las de 3.2.10; la fuente de los datos de competidores (Cálide, Senses, centros de ceremonias) es «testimonio directo» sin referencia verificable; y la relación del psicólogo (equipo o aliado) no es uniforme entre 2.1, 3.2.6, 3.2.8 y 3.2.10."}], "viabilidad": {"resumen": "Un servicio de educación emocional con talleres y sesiones con una psicóloga colegiada en Arequipa puede ser viable si se formaliza como servicio profesional y se valida el precio y el diferencial. El riesgo de la ayahuasca bajó: ya no es proveedor ni acompañamiento del consumo, «integración posterior» se define como apoyo educativo y se agregó la base normativa (2.2.3). Sigue como complemento de comunicación y redes, con necesidad de asesoría legal. Los riesgos principales son ahora la formalización del servicio de salud y la competencia con precios publicados.", "riesgos": [{"tema": "Regulación", "titulo": "Comunicación sobre ayahuasca como complemento educativo", "choque": "Se valora que 2.2.3 defina «integración posterior» como apoyo educativo, que cite el DS 023-2001-SA (el DMT figura en la Lista I B, DS 005-2019-SA) y la Ley 26842 art. 119 sobre publicidad en salud, y que el informe declare que no organiza ni acompaña ceremonias. Aun así, la ayahuasca se mantiene como servicio complementario (Tabla 2, Tabla 3, 2.2.8) y en redes, lo que puede generar riesgo de reputación y de cumplimiento; el propio informe dice que la aplicación a usos tradicionales «deberá ser evaluada por un asesor legal especializado», aún no hecho.", "ideas": ["Obtener y citar un dictamen legal breve (abogado o colegio profesional) sobre contenidos de ayahuasca y publicidad en salud, y escribir su conclusión en 2.2.3.", "Probar en la validación del cap. 5 si el contenido sobre ayahuasca atrae o aleja al cliente que busca bienestar emocional, y mantenerlo como complemento, no como diferencial.", "Revisar un protocolo de publicación en redes (qué se puede decir y qué no) alineado con la lista de «afirmaciones permitidas y que deben evitarse» de la Tabla 2."]}, {"tema": "Regulación", "titulo": "Formalización como servicio de salud", "choque": "Las sesiones las dará una psicóloga colegiada (C.Ps.P. N.° 63830, 2.1), lo cual resuelve la duda de quién presta el acompañamiento. Pero un local que atiende pacientes puede requerir registro ante GERESA Arequipa y SUSALUD, licencia municipal, ITSE y cumplir la Ley N.° 29733 (las fichas de orientación y de seguimiento son datos sensibles); el informe menciona la Ley 29733 solo en la nota de la Tabla 4 y no figura en las Referencias. Además, hay una psicóloga nominada pero el modelo de costos supone un «psicólogo aliado» pagado por hora (3.2.10): conviene definir el vínculo y la capacidad (20 atenciones al mes).", "ideas": ["Averiguar en GERESA Arequipa y en la municipalidad los trámites, costos y plazos para un centro de bienestar, o evaluar iniciar con talleres y una red de psicólogos independientes que facturan por sesión.", "Definir el vínculo con la psicóloga (socia, aliada o contratada) y qué actividades pueden hacer los facilitadores sin ejercer la psicología.", "Citar la Ley 29733 en las Referencias y describir cómo se protegerán las fichas y los registros de seguimiento."]}, {"tema": "Competencia", "titulo": "Oferta gratuita y psicólogos con precio publicado", "choque": "El informe identifica correctamente a la competencia (CSMC gratuitos, plataformas desde S/ 89 por sesión, Cálide y Senses) y la Tabla 6 plantea un diferencial en horario, seguimiento y talleres. Pero el horario (lunes a viernes de 6:00 a 9:00 p. m. y sábado de 9:00 a. m. a 1:00 p. m.) es menos amplio que el de Cálide (lunes a sábado de 9:00 a. m. a 9:00 p. m.) y que el de las plataformas en línea (flexible), y la columna del consultorio privado de la Tabla 6 no tiene datos reales. Con un precio propuesto de S/ 150 frente a S/ 89 en Psicologa.pe, el diferencial medible aún no se sostiene.", "ideas": ["Levantar precio, horario y modalidad de al menos 5 alternativas privadas llamando como cliente, citarlas y fijar el precio con una razón.", "Reforzar el nicho (talleres de gestión emocional para estudiantes y trabajadores jóvenes) y medir en el cap. 5 cuánto valoran el seguimiento estructurado."]}, {"tema": "Mercado", "titulo": "Precio referencial por validar", "choque": "El precio es referencial en la AA1; el modelo de ingresos (3.2.5 y 3.2.10, S/ 150 por sesión y 20 clientes al mes) deberá sustentarse con la tabla de costos del cap. 6 (AA2). Se anota como riesgo de mercado, sin efecto en la nota. Solo conviene unificar la cifra: Tabla 2 y 2.2.5 dicen «por validar» mientras Tabla 6 y 3.2.10 proponen S/ 150.", "ideas": ["Validar en la encuesta de la AA2 cuánto pagan hoy los jóvenes de 18 a 35 años de los niveles B y C y su disposición a pagar por talleres frente a sesiones individuales.", "Explorar un canal B2B: programas de bienestar para empresas de Arequipa."]}, {"tema": "Adopción", "titulo": "Estigma y costo de captar clientes", "choque": "El temor a ser juzgado, que el informe identifica como causa del problema, hace más lento y caro captar clientes, sobre todo para una marca nueva sin psicólogos con reputación propia.", "ideas": ["Usar talleres gratuitos o de bajo costo como puerta de entrada y medir cuántos asistentes pasan a un servicio pagado.", "Probar qué canal genera más confianza (recomendación, universidades, empresas, redes) y cuánto cuesta cada cliente captado."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula completa", "estado": "completo", "nota": "Tiene título, sección 394, grupo 06, docente, integrantes con carrera y escritura uniforme («Steyci»). Observación menor: «CICLO: V» (la UD corresponde al 6.º ciclo) y «MÓDULO: 3»; verificar."}, {"codigo": "—", "apartado": "Índice", "estado": "completo", "nota": "Índice automático con capítulos I a III numerados de forma uniforme. Pequeño detalle: el apartado 3.2.1 no aparece en el índice (salta de 3.2 a 3.2.2)."}, {"codigo": "1.1", "apartado": "Problema del cliente (necesidades, causas y consecuencias)", "estado": "completo", "nota": "Cap. 1 del 06/11: apartado propio 1.1.1 a 1.1.6 (qué le ocurre, necesidades, causas, consecuencias con Tabla 1, árbol Figura 1 y definición). Las causas no llevan fuente, el árbol es una lista lineal y la ayahuasca no aparece en causas ni en la definición."}, {"codigo": "1.2", "apartado": "Problema social (ODS y megatendencias)", "estado": "completo", "nota": "Cap. 1 del 06/11: 1.2.1 con cifras de Arequipa, 1.2.2 con metas ODS 3.4, 3.8 y 4.7, y 1.2.3 con dos megatendencias de CEPLAN. No se explicitan causas y consecuencias sociales y el dato de ODS 4 (ERCE) no corresponde al segmento."}, {"codigo": "1.3", "apartado": "Línea de investigación CERTUS", "estado": "incompleto", "nota": "Cap. 1 del 06/11: ya se consigna («gestión empresarial y emprendimiento», sublínea de modelos de negocio y servicios innovadores), pero sin fuente institucional; en las Referencias las entradas de CERTUS son notas («Consultar página oficial de CERTUS») y mencionan la carrera de Dirección de Empresas, distinta de la de la carátula."}, {"codigo": "1.4", "apartado": "Alcance y validación de las hipótesis", "estado": "completo", "nota": "Cap. 1 del 06/11: declara el problema y el segmento como hipótesis sustentadas en fuentes secundarias, a validar en el cap. 5. Adecuado para la AA1."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Describe dos tipos de servicio (educativo y acompañamiento psicológico), nombra a la psicóloga colegiada y explica el diferencial por forma de entrega (nicho, horarios, seguimiento y derivación)."}, {"codigo": "2.2", "apartado": "Ficha técnica (8 campos)", "estado": "completo", "nota": "Tabla 2 con los campos pedidos más 2.2.3 (criterios técnicos y responsabilidad, base normativa), 2.2.6 (proceso, Tabla 4) y 2.2.9 con medidas ambientales (ODS 12). Precio referencial y duración «por definir», aceptable en la AA1. Detalle: precio «por validar» en la ficha pero S/ 150 en Tabla 6 y 3.2.10; «Renacer» con minúscula en varios párrafos."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": "Cinco beneficios con vínculo a OMS y UNESCO."}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": "Tabla 5 problema-solución enlazada con el cap. I y 2.4.1 con Tabla 6 de comparación. La columna «Consultorio privado» repite horario y seguimiento de RENACER y propone S/ 160 sin fuente; la nota aún contiene una instrucción de trabajo."}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Segmento prioritario de 18 a 35 años con segmentación geográfica, demográfica (incluye NSE B y C y tamaño referencial), psicográfica y cliente prioritario. El NSE se sustenta con A+B (20.2 %) y C (37.4 %) del departamento y el tamaño con 405 479 personas del departamento (no de Arequipa Metropolitana); fuentes CPI e INEI sin enlace («Consultar…»)."}, {"codigo": "2.6–2.7", "apartado": "Casos de uso (y plan de entrevistas)", "estado": "completo", "nota": "Tres casos de uso con resultado esperado; el caso 3 aclara que Andrea no ha consumido ayahuasca. Plan de entrevistas (2.6) aceptable como hipótesis; la Tabla 7 propone 5 entrevistados y la Tabla 8 tiene 8 filas. Caso 2 menciona seguimiento «quincenal» y la Tabla 2 «semanal»."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Un único mapa con los seis cuadrantes (Figura 2), coherente con 2.5 y la propuesta de valor, más matices por perfil rotulados como hipótesis."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Figura 3 con los 9 bloques consistentes con el segmento y la propuesta; 3.2.1 a 3.2.9 los explican y 3.2.10 cuantifica la lógica de ingresos y costos. Se eliminó el texto duplicado."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Directos con precio, modalidad, seguimiento y horario (Tabla 10), fortalezas y limitaciones verificables con oportunidad (Tabla 11) e indirectos clasificados (Tabla 12). Faltan fuentes verificables para Cálide, Senses y los centros de ceremonias («testimonio directo»); queda la frase «sujeto a confirmación directa con el establecimiento»."}, {"codigo": "—", "apartado": "Indicadores de gestión (3.2.11)", "estado": "completo", "nota": "3.2.11 y Tabla 9: seis indicadores con fórmula, ejemplo de cálculo (correctos), meta y frecuencia. Las cifras del margen operativo (S/ 4 800 y S/ 3 600) no coinciden con las de 3.2.10."}, {"codigo": "—", "apartado": "Referencias APA 7", "estado": "incompleto", "nota": "Orden alfabético casi completo, pero con cuatro entradas «[COMPLETAR…]», unas catorce líneas «Consultar…», entradas sueltas («CPI», «proyectos.inei.gob.pe»), duplicados (Ley 26842, MINSA s. f.), «&amp;», UNESCO 2024 sin a/b, INEI 2025 dos veces sin a/b, y desajustes con el texto (Giove 2022 y Agencia Andina no se citan; Leyes 29571 y 29733 no figuran)."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "Versión del 06/11/2026. Mejoró de forma notable: estructura problema del cliente y problema social, incorpora cifras de Arequipa, metas ODS, dos megatendencias de CEPLAN, línea de investigación y alcance de validación, y desaparecieron las frases de indicaciones de corrección. Quedan por pulir la coherencia de una cifra, la evidencia de la ayahuasca como parte del problema, la pertinencia del dato de ODS 4 y las fuentes de la línea de investigación.", "observaciones": [{"severidad": "importante", "titulo": "Una cifra regional contradice la tendencia que se afirma y las cifras provienen sobre todo de prensa", "ubicacion": "1.2.1 Contexto nacional y regional (p. 6) y Tabla 1 (p. 5)", "cita": "La Gerencia Regional de Salud registró 78 suicidios en lo que va de 2026, frente a 121 en el mismo periodo de 2025", "problema": "Se subsanó el problema anterior de cifras solo nacionales y de fuente que no las respaldaba: ahora hay datos de Arequipa (16 % más de intentos de suicidio y problemas de salud mental desde 2024, Romero, 2026; psiquiatría del Centro Moisés Heresi de 4 115 a 4 837 atenciones, El Búho, 2026) y el MINSA (2023) coincide con su nota de prensa. Pero el dato de los 78 suicidios (Mamani, 2026) muestra una disminución frente a 2025 y se incluye sin comentario antes de concluir «Estas cifras muestran una demanda creciente en el segmento de 18 a 35 años». Además, el 16 % proviene de lo que informó un psicólogo en una nota periodística y el dato del segmento (18 a 29 años) no cubre hasta los 35. El MINSA (2023) y Frisancho (2023) tienen tres años de antigüedad.", "mejora": "Explicar la diferencia entre suicidios, intentos de suicidio y atenciones por salud mental y por qué, aun con menos suicidios, la demanda de atención crece; o retirar el dato. Complementar con una fuente oficial reciente (GERESA Arequipa, MINSA, INSM «Honorio Delgado – Hideyo Noguchi») y, si existe, con cifras de jóvenes de 18 a 35 años."}, {"severidad": "importante", "titulo": "La ayahuasca se presenta como parte del problema sin evidencia de demanda y sin reflejarse en el resto del capítulo", "ubicacion": "1.1.1 Qué le ocurre al cliente (p. 4)", "cita": "A ello se suma el interés de algunas personas por el autoconocimiento y la comprensión de experiencias subjetivas relacionadas con estados no ordinarios de conciencia, entre ellas la ayahuasca", "problema": "Se valora el tratamiento prudente del tema (enfoque educativo y remisión a 2.2.3). Sin embargo, la única fuente (Dos Santos y Hallak, 2024) señala la necesidad de más investigación sobre efectos y riesgos; no muestra que los jóvenes de Arequipa tengan dificultad para hallar información confiable sobre este tema. La ayahuasca tampoco figura en las necesidades (1.1.2), las causas (1.1.3), la Tabla 1, el árbol (Figura 1) ni la definición del problema (1.1.6), por lo que el problema central y el segundo párrafo de 1.1.1 no coinciden.", "mejora": "Aportar un dato o una hipótesis explícita sobre la demanda de información sobre ayahuasca en el segmento (puede quedar como hipótesis para el cap. 5) y reflejarla en 1.1.2, 1.1.3 y 1.1.6; o, si es un componente complementario, retirarla de la formulación del problema y tratarla solo en el capítulo 2."}, {"severidad": "importante", "titulo": "El dato de ODS 4 no corresponde al segmento y la cita de UNESCO es ambigua", "ubicacion": "1.2.2 ODS (p. 7) y Referencias", "cita": "el 71 % de los estudiantes evaluados reportó respuestas positivas en autorregulación escolar y el 85 % en apertura a la diversidad", "problema": "Los porcentajes del ERCE 2019 describen a estudiantes de educación básica y son respuestas positivas, de modo que no evidencian una brecha en jóvenes de 18 a 35 años ni sustentan la conclusión «Estos resultados muestran la importancia de fortalecer habilidades…». La meta 3.8 (cobertura sanitaria universal) se menciona sin relacionarla con lo que ofrece RENACER. En las Referencias hay dos entradas «UNESCO (2024)» y una de ellas termina en «Consultar documento», por lo que el lector no sabe cuál se cita (corresponde 2024a y 2024b).", "mejora": "Buscar un dato sobre educación socioemocional o salud mental en jóvenes y adultos jóvenes (INEI, MINEDU, OMS, UNESCO) o argumentar con claridad por qué el ERCE sirve de antecedente. Relacionar cada meta con una acción concreta de RENACER y diferenciar las citas de UNESCO con a y b."}, {"severidad": "importante", "titulo": "La línea de investigación se consigna, pero sin fuente institucional", "ubicacion": "1.3 Línea de investigación (p. 8) y Referencias", "cita": "El proyecto RENACER se vincula con el área de gestión empresarial y emprendimiento", "problema": "Se subsanó la instrucción pendiente: ahora se nombra un área y una sublínea y se explica su relación con el proyecto. No se indica de qué documento de CERTUS se toma la denominación y, en las Referencias, las entradas de CERTUS son notas incompletas («Consultar página oficial de CERTUS», «Consultar manual institucional») que además mencionan la carrera de Dirección de Empresas, mientras la carátula indica Administración de Empresas. El segundo párrafo de 1.3 repite lo del primero.", "mejora": "Citar la denominación oficial de la línea (documento o página de CERTUS) en APA 7, sustituir las notas «Consultar…» por referencias completas y unificar la carrera de la carátula con la de las Referencias. Condensar los dos párrafos de 1.3."}, {"severidad": "sugerencia", "titulo": "Consecuencias y causas del problema del cliente poco cuantificadas y árbol de problemas lineal", "ubicacion": "1.1.3 (p. 4), Tabla 1 (p. 5) y Figura 1 (p. 6)", "cita": "Listas de espera crecientes en los servicios de salud mental de la región (Frisancho, 2023).", "problema": "La Tabla 1 es un avance claro respecto de la versión anterior. Pero la fila «Tiempo» no da plazos de espera, la fila «Dinero» presenta el precio de una sesión y no el costo que asume el cliente por no atenderse, y las cinco causas de 1.1.3 (estigma, temor a ser juzgado, etc.) no llevan fuente. La Figura 1 es una lista de causas, problema y efectos en tres líneas, sin ramas que muestren qué causa produce qué efecto.", "mejora": "Agregar un dato de espera (días o semanas) y el gasto o la pérdida que afronta el cliente; sustentar al menos estigma y temor a ser juzgado con una cita (OMS u otra fuente); y dibujar el árbol con ramas causa-efecto."}, {"severidad": "sugerencia", "titulo": "Problema social: faltan causas y consecuencias sociales y se podría ajustar la megatendencia digital", "ubicacion": "1.2 y 1.2.3 (pp. 6-7)", "cita": "RENACER utilizará canales digitales para brindar información educativa, facilitar el contacto con los usuarios y complementar las actividades presenciales.", "problema": "La estructura del TAP pide en el problema social los ODS, las megatendencias, las causas y las consecuencias; 1.2 desarrolla los dos primeros, pero no resume causas ni consecuencias a nivel social. Las dos megatendencias están sustentadas en CEPLAN (2024, 2025), lo cual subsana la observación anterior; sin embargo, la de digitalización se apoya en un servicio que la Tabla 2 define como «presencial, complementada con herramientas digitales», por lo que la relación es parcial.", "mejora": "Añadir 3 o 4 líneas con causas y consecuencias sociales (p. ej., carga en los servicios públicos, deserción o menor productividad) y precisar qué parte del servicio es digital para que la megatendencia sea pertinente."}, {"severidad": "sugerencia", "titulo": "Redacción de 1.1.6: repite 1.1.1 y contiene una frase defensiva", "ubicacion": "1.1.6 Definición del problema (p. 6)", "cita": "En consecuencia, RENACER parte de una dificultad del cliente y no de una solución predefinida.", "problema": "La definición reproduce casi textualmente el primer párrafo de 1.1.1 y su última frase responde a una observación anterior en lugar de aportar contenido al trabajo. El condicional «pueden presentar» debilita la definición.", "mejora": "Redactar el problema en una sola oración clara (quién, qué dificultad, por qué y qué consecuencia), sin aludir a las revisiones, y suprimir la repetición de 1.1.1."}, {"severidad": "sugerencia", "titulo": "La validación real se exigirá en el capítulo 5 (AA2)", "ubicacion": "1.4 Alcance y validación de las hipótesis (p. 8)", "cita": "En el capítulo 5 se validarán mediante entrevistas o encuestas reales aplicadas a jóvenes de 18 a 35 años de Arequipa Metropolitana.", "problema": "El apartado 1.4 declara adecuadamente el problema y el segmento como hipótesis sustentadas en fuentes secundarias, lo cual es aceptable en la AA1.", "mejora": "Tener presente que en el capítulo 5 (AA2) deberán aplicar las entrevistas o encuestas y, si se presentan resultados simulados, rotularlos como tales."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "Mejoró de forma sustancial: nombra a la psicóloga colegiada que presta el acompañamiento y asigna responsables (Tabla 3), compara con un consultorio, un CSMC y una plataforma (Tabla 6), define «integración posterior» y agrega la base normativa de la ayahuasca (2.2.3), añade medidas ambientales (2.2.9) y precisa el segmento con nivel socioeconómico y tamaño (2.5.2). Quedan datos sin sustento en la Tabla 6 (columna del consultorio), una nota que es instrucción de trabajo, cálculos del segmento que no coinciden con la elección de B y C, y detalles de coherencia entre secciones.", "observaciones": [{"severidad": "importante", "titulo": "La columna «Consultorio privado» de la Tabla 6 copia los datos de RENACER y la nota conserva una instrucción de trabajo", "ubicacion": "2.4.1, Tabla 6 «Comparación de RENACER con alternativas de atención en Arequipa» (pp. 17-18)", "cita": "Los datos del consultorio privado se obtendrán llamando a al menos cinco alternativas como cliente.", "problema": "Se valora la nueva comparación (precio, horario, formato, seguimiento y especialización) y que ya se declare que la ayahuasca no es el diferencial principal, lo que subsana la observación sobre el diferencial. Pero en la columna «Consultorio privado» el horario («lunes a viernes de 6:00 p. m. a 9:00 p. m. y sábados de 9:00 a. m. a 1:00 p. m.») y el seguimiento («Contacto entre las 48 y 72 horas posteriores a la primera sesión…») son iguales, palabra por palabra, a los de RENACER; el precio de «S/ 160 por sesión» figura como «propuesta inicial, por validar» sin fuente; y la nota anuncia que esos datos «se obtendrán» llamando a cinco consultorios, es decir, aún no existen. Así, la tabla no permite concluir qué ventaja tiene RENACER. Además, el horario se escribe «unes a viernes» (falta la L) y los competidores ya ofrecen horarios amplios (Cálide: lunes a sábado de 9:00 a. m. a 9:00 p. m.; plataformas: flexible).", "mejora": "Completar la columna con datos reales de al menos dos consultorios (nombre, precio, horario, seguimiento y fuente o fecha de consulta) o retirar la columna y comparar solo con lo verificado (Cálide, Senses, CSMC, plataformas). Eliminar la frase de instrucción de la nota, y concretar la «ventaja medible»: p. ej., cuántas horas más de atención nocturna ofrece frente a las alternativas citadas."}, {"severidad": "sugerencia", "titulo": "Segmentación: el nivel socioeconómico y el tamaño no coinciden con lo que se sustenta", "ubicacion": "2.5.2 Segmentación demográfica (p. 18)", "cita": "una participación de 20.2 % en los niveles A y B conjuntamente, y 37.4 % en el nivel C", "problema": "Se subsana la observación anterior de dimensionar el segmento y precisar el nivel socioeconómico, y es adecuado que lo declaren hipótesis. Pero el texto elige los niveles B y C y cita datos de A y B conjuntos y de C, de modo que no se sabe qué porcentaje corresponde a B; las cifras son del departamento. La cifra de 405,479 personas de 18 a 35 años también es departamental (INEI, 2025) y el propio texto indica que no es el tamaño del segmento metropolitano. Las dos referencias de INEI y la de CPI figuran como «Consultar cuadro estadístico» o solo «CPI», y en el texto la cita de INEI no tiene año ni autor-fecha. La cifra usa coma como separador de miles («405,479») mientras el resto del informe usa espacio.", "mejora": "Citar en APA 7 la tabla exacta de INEI y el informe de APEIM/CPI (autor, año, título y URL), usar el porcentaje de niveles B y C si existe o redefinir el segmento como B y C con el dato correcto, y aproximar el tamaño en los distritos de Arequipa Metropolitana (o declararlo como pendiente para el cap. 5)."}, {"severidad": "sugerencia", "titulo": "La base normativa de la ayahuasca es adecuada, pero sus fuentes no se pueden verificar y la conclusión legal queda pendiente", "ubicacion": "2.2.3 Criterios técnicos y de responsabilidad (p. 13) y Referencias", "cita": "deberá ser evaluada por un asesor legal especializado, considerando también el reconocimiento de su valor cultural mediante la Resolución directoral nacional N.° 836/INC (2008)", "problema": "Se subsana la observación anterior: define «integración posterior» y agrega la base normativa (DS 023-2001-SA, DS 005-2019-SA, Ley 26842, Ley 29571). Falta que las normas se puedan verificar: en las Referencias aparecen como líneas «Consultar el reglamento oficial en PDF», «Consultar la Ley General de Salud en PDF» (dos veces) y «Consultar la modificación oficial de las listas. En esta norma puedes verificar que el DMT figura en la Lista I B», que son indicaciones y no referencias; la Ley 29571 y la Ley 29733 no están listadas, mientras Giove (2022) y Agencia Andina (2008) figuran en la lista pero no se citan en el texto. El apartado pide una opinión legal que aún no se obtuvo.", "mejora": "Citar cada norma en APA 7 (entidad, año, título, número, medio de publicación y enlace al Diario Oficial El Peruano o SPIJ), usar Giove (2022) y la nota de Andina en el texto o retirarlas, y conseguir una breve opinión legal para reemplazar la frase condicional por una conclusión."}, {"severidad": "sugerencia", "titulo": "Detalles que no coinciden entre secciones (precio, seguimiento, profesionales y entrevistados)", "ubicacion": "Tabla 2 y 2.2.5 (pp. 11-14), Tabla 6 (p. 18), caso de uso 2 (p. 22) y Tablas 7 y 8 (pp. 19-21)", "cita": "Por validar. Referencia de mercado: S/ 85 a 150 por sesión en línea", "problema": "El precio es referencial en la AA1, por lo que solo se señala la unificación de cifras: la Tabla 2 y 2.2.5 dicen «por validar» y la Tabla 6 y 3.2.10 proponen S/ 150. Además, el seguimiento es semanal durante el primer mes (Tabla 2) pero «quincenal» en el caso de uso 2; 2.1 nombra a una sola psicóloga y la Tabla 2 habla de «psicólogos colegiados y habilitados»; la Tabla 7 propone 5 entrevistados y la Tabla 8 tiene 8 filas (E1 a E8); y se escribe «Renacer» y «renacer» en lugar de «RENACER» (2.2.3, Tabla 3).", "mejora": "Unificar la cifra de precio como «S/ 150 (referencial)», la frecuencia de seguimiento, el número de profesionales y entrevistas, y la escritura del nombre del proyecto."}, {"severidad": "sugerencia", "titulo": "El diferencial aún se apoya en el complemento de ayahuasca en varias secciones", "ubicacion": "2.1 (p. 10), Tablas 2, 3 y 5 y caso de uso 3 (p. 22)", "cita": "Como complemento, el servicio incluye información educativa sobre experiencias no ordinarias de conciencia, incluida la ayahuasca", "problema": "Se valora que 2.4.1 declare que no es el diferencial principal y que 2.2.3 precise su alcance, y el caso de uso 3 ahora aclara que Andrea no ha consumido la sustancia. Sin embargo, el tema ocupa una fila en Tablas 2, 3 y 5, un caso de uso completo y una etapa del proceso (Tabla 4), con lo cual sigue pesando en la comunicación aunque el problema central (Cap. 1) no lo incluye en causas ni definición.", "mejora": "Mantenerla como un componente opcional y breve, o desarrollarla solo cuando exista evidencia de demanda (cap. 5); evitar que el caso de uso 3 tenga más peso que los dos casos centrales."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El capítulo mejoró mucho: un único mapa de empatía coherente (Figura 2), BMC de 9 bloques con articulación cuantificada (3.2.10), seis indicadores de gestión con fórmula y ejemplo (Tabla 9) y competidores con tablas comparativas y clasificación. Se eliminaron el texto duplicado y las frases de indicaciones de corrección. Quedan fuentes de competidores sin referencia verificable, unos restos de nota de verificación y cifras de ejemplo que no coinciden con las de 3.2.10.", "observaciones": [{"severidad": "importante", "titulo": "Los datos de competidores indirectos y de Cálide se apoyan en «testimonio directo» sin referencia verificable", "ubicacion": "3.3.1 a), 3.3.4.1 (pp. 30 y 34) y Referencias", "cita": "Información obtenida mediante testimonio directo de una integrante del equipo del proyecto RENACER.", "problema": "Se subsanaron el texto duplicado y la nota «para evitar el error identificado por el docente», y los competidores directos tienen precios y fuentes públicas (Psicologa.pe, Doctoralia, MINSA). Pero en las Referencias, las entradas de Ayahuasca Inner World, Cálide, Casa Muyuqui y Senses Psicólogos mantienen «[COMPLETAR: título de la página]» y la frase «Información obtenida mediante testimonio directo…», que no es una fuente citable en APA 7. En 3.3.1 a), el horario de Cálide se atribuye a «su ficha comercial, consultada el 5 de noviembre de 2026» sin enlace, y se añade «Este horario está sujeto a confirmación directa con el establecimiento», una nota de trabajo. Los datos de los tres espacios de ceremonias (3.3.4.1) tampoco permiten comprobar la afirmación.", "mejora": "Citar en APA 7 las páginas consultadas (título, URL y fecha de consulta) o, si fue una comunicación personal, citarla como tal en el texto y no en las Referencias; confirmar el horario de Cálide o retirar la frase de verificación pendiente; y numerar o resumir 3.3.4.2 y 3.3.4.3 con alguna fuente."}, {"severidad": "sugerencia", "titulo": "Los ejemplos de la Tabla 9 no coinciden con las cifras de 3.2.10 y el psicólogo no tiene vínculo uniforme", "ubicacion": "3.2.10 y 3.2.11, Tabla 9 (pp. 28-29); 2.1, 3.2.6 y 3.2.8", "cita": "((4 800 − 3 600) ÷ 4 800) × 100 = 25 %", "problema": "Se subsanó la ausencia de indicadores: la Tabla 9 trae seis KPI con fórmula, ejemplo de cálculo, meta y frecuencia, y los cálculos son correctos (12 ÷ 40 = 30 %; S/ 600 ÷ 12 = S/ 50; 9 ÷ 12 = 75 %; 22 ÷ 25 = 88 %; 18 ÷ 24 = 75 %). Pero el ejemplo del margen operativo usa ingresos de S/ 4 800 y costos de S/ 3 600, mientras 3.2.10 plantea S/ 3 000 de ingreso (20 clientes × S/ 150) y S/ 1 000 de honorarios; la nota aclara que los ejemplos son ilustrativos, pero conviene que partan de los mismos supuestos. Además, 3.2.10 y 3.2.8 hablan de un «psicólogo aliado» pagado a S/ 50 por hora, 3.2.6 lo trata como recurso clave propio y 2.1 nombra a una psicóloga determinada.", "mejora": "Reemplazar los datos del ejemplo por los de 3.2.10 (p. ej., 20 clientes, S/ 3 000, costo directo de S/ 1 000) o explicar la diferencia, y aclarar si el psicólogo es del equipo, socio o aliado remunerado por sesión."}, {"severidad": "sugerencia", "titulo": "El mapa de empatía único se apoya en hipótesis y no incluye evidencia propia", "ubicacion": "3.1 y Figura 2 (p. 24)", "cita": "Nota. Elaboración propia a partir de las hipótesis del capítulo I y del apartado 2.5.", "problema": "Se subsanó la repetición de los dos mapas casi idénticos: ahora hay un único mapa con los seis cuadrantes y coherente con 2.5, y los matices por mujeres y varones se rotulan como hipótesis. Es adecuado para la AA1. El mapa es un gráfico con texto y un personaje; los datos de «qué oye», «qué ve» y «qué dice y hace» son plausibles, pero no se vinculan a una fuente.", "mejora": "Tener presente que en el cap. 5 conviene contrastar cada cuadrante con las entrevistas; puede indicarse qué cuadrantes se validarán primero."}, {"severidad": "sugerencia", "titulo": "El BMC se puede apoyar mejor en la oferta de ingresos y costos", "ubicacion": "Figura 3 y 3.2.5 a 3.2.10 (pp. 25-28)", "cita": "Los ingresos provienen de sesiones individuales con psicólogos colegiados, talleres grupales, programas de seguimiento y contenido digital especializado.", "problema": "Se subsanó la franja ajena a los 9 bloques de la versión anterior, y la lectura de la Figura 3 es completa y coherente con el segmento y la propuesta. El apartado 3.2.10 cuantifica solo las sesiones individuales; los talleres, los programas de seguimiento y el contenido digital que figuran como fuentes de ingreso no tienen supuestos, aunque el precio sea referencial.", "mejora": "Agregar en 3.2.10 una línea sobre cuántos talleres y asistentes se esperan y qué parte del ingreso aportan."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "Mejoró la forma: numeración continua de tablas y figuras, notas de fuente, índice uniforme y carátula completa. El punto crítico son las Referencias, que conservan restos de redacción y no coinciden por completo con el texto.", "observaciones": [{"severidad": "importante", "titulo": "Las Referencias conservan restos de redacción («[COMPLETAR…]», «Consultar…») y no coinciden con el texto", "ubicacion": "Referencias (pp. 36 en adelante)", "cita": "Cálide. (s. f.). [COMPLETAR: título de la página]. Información obtenida mediante testimonio directo de una integrante del equipo del proyecto RENACER.", "problema": "La lista ya está casi en orden alfabético y ahora incluye normas, CEPLAN, INEI, CPI y los competidores, pero: (a) cuatro entradas (Ayahuasca Inner World, Cálide, Casa Muyuqui, Senses Psicólogos) tienen «[COMPLETAR: título de la página]» y, tres de ellas, «testimonio directo»; (b) unas catorce líneas son instrucciones y no referencias («Consultar página oficial de CERTUS», «Consultar manual institucional», «Consultar informe estadístico», «Consultar guía oficial», «Consultar directorio oficial de los 306 CSMC del Perú», «Consultar el reglamento oficial en PDF», «Consultar la Ley General de Salud en PDF», «Consultar la modificación oficial de las listas…», «Consultar cuadro estadístico», «Consultar publicación oficial», «Consultar documento…»); (c) hay entradas sueltas («CPI», «proyectos.inei.gob.pe»); (d) están duplicadas la Ley 26842 y la referencia de MINSA (s. f.); (e) aparece «&amp;» en Dos Santos & Hallak y Tindle et al.; (f) hay dos entradas «UNESCO (2024)» sin a/b y dos «INEI (2025)»; (g) las entradas de CERTUS indican «Dirección de Empresas» aunque la carátula dice Administración de Empresas, y CONCYTEC (2019) no se cita en el texto; (h) Giove (2022) y Agencia Andina (2008) se listan pero no se citan, y las Leyes 29571 y 29733 se citan pero no se listan.", "mejora": "Completar cada entrada con autor, año, título, medio y URL (APA 7), eliminar las líneas «Consultar…», unificar duplicados y diferenciar con a y b, quitar «&amp;» y comprobar una por una que cada cita del texto esté en la lista y viceversa. Las comunicaciones personales no van en las Referencias."}, {"severidad": "sugerencia", "titulo": "Carátula: ciclo y módulo por verificar", "ubicacion": "Carátula (p. 1)", "cita": "CICLO: V", "problema": "Se corrigió la escritura del nombre de la integrante (ahora uniforme), pero la carátula indica «CICLO: V» y «MÓDULO: 3» y la UD corresponde al 6.º ciclo.", "mejora": "Verificar ciclo y módulo según el plan de estudios y el formato de carátula de la UD."}, {"severidad": "sugerencia", "titulo": "Redacción: nombre del proyecto y espacios en blanco", "ubicacion": "2.2.3, Tabla 3, 3.3.3 (pp. 13, 15 y 32)", "cita": "Renacer distingue de manera explícita entre educación y atención psicológica.", "problema": "Se corrigieron la repetición de la aclaración ética, la lista duplicada de 2.2.2 y el texto en primera persona. Queda el nombre escrito «Renacer» y «renacer» junto a «RENACER», y bloques de espacios en blanco antes de la Tabla 11 (3.3.3) que dejan una página casi vacía.", "mejora": "Unificar la escritura de RENACER y eliminar los saltos de página manuales."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Encuesta de validación: retroalimentación de avance AA2", "resumen": "Avance AA2 (06/11/2026): retroalimentación formativa, sin calificación. El formulario coincide con la Tabla 22 del informe, cada pregunta responde a un objetivo específico (O1 a O7), la muestra está calculada (97 encuestas como mínimo) y los criterios de éxito están definidos en la Tabla 27. Para que la validación sea sólida conviene corregir cinco puntos antes de aplicarlo: filtro del segmento (residencia y sexo), medición del canal de contacto, intención de participar en el taller, criterio de precio alineado con el MVP y coherencia entre el informe y el formulario.", "observaciones": [{"severidad": "importante", "titulo": "El filtro del segmento está incompleto: faltan residencia y sexo", "ubicacion": "Preguntas 1 y 2; apartados 5.5.1 y 5.5.3", "cita": "«¿Cuál es tu edad?» / «¿A qué te dedicas actualmente?»", "problema": "El segmento de validación (5.5.1) son jóvenes de 18 a 35 años de Arequipa Metropolitana, y el informe distingue el mapa de empatía entre mujeres y varones, pero el cuestionario no pregunta dónde reside la persona ni su sexo. Así no es posible excluir a quien vive fuera del segmento ni comparar resultados por sexo.", "mejora": "Agregar una pregunta de residencia (Arequipa Metropolitana: sí/no, con fin de la encuesta si no) y una de sexo (con la opción «Prefiero no decirlo»). Registrar estas variables si se aplican cuotas."}, {"severidad": "importante", "titulo": "El canal de contacto no se mide", "ubicacion": "Pregunta 7; objetivo 5 de la Tabla 27; hipótesis H4 de la Tabla 13", "cita": "«¿Dónde buscas con más frecuencia información sobre bienestar emocional?»", "problema": "El objetivo 5 pide determinar los canales para informarse y para contactar el servicio, y H4 afirma que las redes y WhatsApp son canales eficaces. La pregunta 7 solo indaga dónde se informan y no incluye WhatsApp entre las opciones, por lo que H4 no puede contrastarse.", "mejora": "Mantener la pregunta 7 y agregar una pregunta sobre el medio preferido para contactar o inscribirse (WhatsApp, Instagram, formulario, llamada, presencial)."}, {"severidad": "importante", "titulo": "No se mide la intención de participar en el taller", "ubicacion": "Preguntas 10 y 11; hipótesis H2 de la Tabla 13", "cita": "«¿Cuánto estarías dispuesto(a) a pagar por un taller grupal de educación emocional de 2 horas?»", "problema": "H2 sostiene que el segmento está dispuesto a participar y pagar, pero el cuestionario solo mide el pago (incluye «No pagaría»). No hay una pregunta que mida si la persona se inscribiría, ni una forma de contactarla, por lo que la tasa de conversión del MVP (≥ 25 % de al menos 40 consultas, Tabla 14) quedaría sin insumos.", "mejora": "Agregar una pregunta de intención de participar (escala de 5 niveles) y una pregunta opcional para dejar un contacto y ser convocado al taller piloto."}, {"severidad": "importante", "titulo": "El único criterio de precio es el de la sesión individual, que en el MVP es opcional", "ubicacion": "Preguntas 10 y 11; Tabla 27, objetivo 3; apartado 4.1", "cita": "«≥ 40 % dispuesto a pagar un precio dentro del rango de S/ 85 a 150 por sesión»", "problema": "El MVP gira en torno al taller grupal de dos horas y la sesión individual es opcional, pero la meta de disposición de pago se fijó solo para la sesión. El taller (pregunta 10) no tiene criterio de validación ni un precio de referencia en el informe, y el cap. 6 necesitará ese dato.", "mejora": "Definir un precio de referencia y un criterio de validación para el taller (por ejemplo, porcentaje mínimo dispuesto a pagar el rango propuesto) y fijarlos antes de aplicar la encuesta."}, {"severidad": "importante", "titulo": "El formulario difiere del instrumento descrito en el informe", "ubicacion": "Preguntas 5 y 6; Tabla 22", "cita": "«(hasta 2)»", "problema": "La Tabla 22 define las preguntas 5 y 6 como de selección múltiple («hasta 2») y la 6 con la opción «g) Otro». En el formulario ambas son de opción única y la pregunta 6 no tiene la opción «Otro». Lo que se aplica debe ser exactamente lo que se describe y analiza en el informe.", "mejora": "Alinear el formulario con la Tabla 22 (o actualizar la tabla): selección múltiple con límite de dos respuestas y opción «Otro» en la pregunta 6."}, {"severidad": "sugerencia", "titulo": "La pregunta 8 mezcla modalidad y horario", "ubicacion": "Pregunta 8; objetivo 6 de la Tabla 27", "cita": "«¿Qué modalidad y horario preferirías para un taller o sesión?»", "problema": "Una misma pregunta combina dos variables y sus opciones no cubren todas las combinaciones (por ejemplo, virtual en sábado). Esto dificulta el análisis del objetivo 6.", "mejora": "Separar en dos preguntas: una de modalidad (presencial, virtual, mixta) y otra de franja horaria."}, {"severidad": "sugerencia", "titulo": "El criterio del objetivo 1 no indica qué respuestas cuentan como «declara la dificultad»", "ubicacion": "Tabla 27, objetivo 1; preguntas 3 y 4", "cita": "«≥ 60 % de los encuestados declara la dificultad»", "problema": "Las preguntas 3 y 4 usan escalas de cinco niveles y el informe no precisa qué niveles se contarán. Si se decide después de ver los datos, la validación pierde objetividad.", "mejora": "Definir antes de aplicar qué respuestas suman al criterio (por ejemplo, «A menudo» y «Casi siempre» en la pregunta 3; «De acuerdo» y «Totalmente de acuerdo» en la 4) y dejarlo escrito en la Tabla 27."}, {"severidad": "sugerencia", "titulo": "La pregunta 12 sobre ayahuasca necesita una salida neutral", "ubicacion": "Pregunta 12; objetivo 7 de la Tabla 27", "cita": "«…información educativa sobre experiencias no ordinarias de conciencia, como la ayahuasca, ¿cómo influiría en tu interés?»", "problema": "Es un tema sensible y el MVP lo excluye del taller. Las opciones no incluyen «No conozco el tema», lo que puede forzar una respuesta a quien no sabe de qué se trata.", "mejora": "Agregar la opción «No conozco el tema / No sé», mantener la nota ética y presentar el resultado como informativo, como indica el informe."}, {"severidad": "sugerencia", "titulo": "Elementos del formulario por verificar antes de difundirlo", "ubicacion": "Formulario en línea", "cita": "Consentimiento informado (5.1.4.1); escala de la pregunta 9; salto de la edad «otra»", "problema": "No fue posible comprobar desde el enlace si el texto de consentimiento aparece al inicio, si las preguntas son obligatorias, si la edad «otra» finaliza la encuesta ni cuál es la escala de la pregunta 9 (importancia de los horarios nocturnos y del seguimiento).", "mejora": "Verificar que el consentimiento del apartado 5.1.4.1 sea lo primero que se lee, que las preguntas clave sean obligatorias, que la edad fuera de rango termine la encuesta y que la pregunta 9 use una escala de «Nada importante» a «Muy importante»."}]}], "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 4, "responsabilidad": 3}}</script>

<div class="wrap">
  <nav class="toc" aria-label="Contenido">
    <div class="lbl">Contenido</div>
    <ol id="toc"></ol>
    <p class="progress" id="progress" style="margin-top:14px"></p>
  </nav>
  <main id="main"></main>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const isAA2 = s => /^AA2/.test(s.etiqueta || '');
const secAA2 = D.secciones.filter(isAA2);
const fortAA1 = (D.fortalezas || []).filter(f => !/^AA2:/.test(f));
const fortAA2 = (D.fortalezas || []).filter(f => /^AA2:/.test(f)).map(f => f.replace(/^AA2:\s*/, ''));
const priAA1 = (D.prioridades || []).filter(p => !/^AA2:/.test(p));
const priAA2 = (D.prioridades || []).filter(p => /^AA2:/.test(p)).map(p => p.replace(/^AA2:\s*/, ''));
const all = D.secciones.filter(s => !isAA2(s)).flatMap(s => s.observaciones.map(o => o.severidad));
const allAA2 = secAA2.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;
const countAA2 = sev => allAA2.filter(x => x === sev).length;

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${fortAA1.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA1.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>
    <div class="grade"><span class="big">${total}</span><span class="of">/ 20</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${priAA1.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

const renderSec = (s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
  </section>`;
};
D.secciones.forEach((s, si) => { if (!isAA2(s)) renderSec(s, si); });

if (secAA2.length || fortAA2.length || priAA2.length) {
  html += `<section class="block aa2" id="aa2">
    <div class="head"><div class="eyebrow">Evidencia 2 · avance en curso</div><h2>Evidencia 2 (AA2): retroalimentación de avance</h2></div>
    <p class="summary">Esta parte corresponde a la Evidencia 2 (capítulos 4, 5 y 6 y elevator pitch). Es retroalimentación formativa para que puedan mejorar mientras avanzan: todavía no es una calificación. Se irá actualizando en este mismo enlace.</p>
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const toc = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]))
  .concat(secAA2.length || fortAA2.length || priAA2.length ? [['aa2', 'Evidencia 2 (AA2)', allAA2.length]] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, '↳ ' + s.titulo, s.observaciones.length]));
document.getElementById('toc').innerHTML = toc.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
