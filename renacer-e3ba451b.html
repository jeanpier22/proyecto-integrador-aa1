 3 × 20 = 60, por lo que 40 casos quedan sin regla. La distribución por edad (40, 35 y 25) se funda en supuestos («mayor uso de redes») y no en la estructura poblacional de INEI. El nivel socioeconómico B y C, fijado en el capítulo II como parte del segmento, aparece como «[COMPLETAR: niveles]» y no se mide en ninguna pregunta. La Tabla 29 promete una «escala de interés y motivaciones» y «valora la privacidad» que no existen en el cuestionario (preguntas 1 a 12), de modo que esas variables no se validan.", "mejora": "Alinear las cuotas con las opciones de la pregunta 2, justificar las proporciones con datos de INEI, incorporar una pregunta o un filtro de nivel socioeconómico (o declararlo no medido) y ajustar la Tabla 29 a lo que el cuestionario realmente mide. Los aspectos de residencia y sexo ya se observaron en la sección del formulario."}, {"severidad": "importante", "titulo": "Tres juegos de criterios de éxito para las mismas hipótesis, con umbrales distintos y todavía «ajustables»", "ubicacion": "Tabla 15 (cap. IV), Tabla 26 y Tabla 27", "cita": "Los criterios son propuestos y pueden ajustarse antes de aplicar las entrevistas. / Los criterios de validación se ajustarán con el docente antes de aplicar los instrumentos.", "problema": "H1 se confirma con «6 de 8 entrevistados» (75 %) en la Tabla 26 y con «≥ 60 %» en la Tabla 27; H2 con «al menos la mitad» en la Tabla 26, con «≥ 40 %» en la Tabla 27 y con una conversión de 25 % en la Tabla 14; H4 es «la mayoría» frente a «el canal con mayor porcentaje». Cuatro de los siete objetivos (2, 5, 6 y 7) no tienen un umbral numérico («ordenadas por frecuencia», «mayor preferencia», «informativo»). No se justifica ninguna cifra. Mientras los criterios puedan ajustarse una vez aplicados los instrumentos, la validación pierde objetividad. Además, las notas que dicen «con el docente» son indicaciones de trabajo, no texto del informe.", "mejora": "Unificar en una sola matriz hipótesis, objetivo, instrumento, indicador, umbral y justificación del umbral; fijarla antes de la recolección y retirar las notas sobre ajustes."}, {"severidad": "importante", "titulo": "Coherencia entre hipótesis, objetivos y la propuesta de valor: faltan objetivos y sobran vínculos", "ubicacion": "Tabla 13, Tabla 23 y Tabla 27; objetivo general (5.3)", "cita": "Determinar ... si la propuesta de valor de RENACER responde a sus necesidades y si existe disposición de pago", "problema": "El objetivo general promete evaluar si la propuesta responde a las necesidades, pero ningún objetivo específico mide la aceptación de la propuesta ni la intención de participar (solo la pregunta 5 de entrevistas, sin criterio). Los objetivos 6 (modalidad) y 7 (ayahuasca) se asignan a H3, que según la Tabla 13 trata del horario y el seguimiento «frente a la oferta actual», pero el objetivo 4 solo mide importancia, sin comparar con la oferta actual de la Tabla 6 del capítulo II. La Tabla 23 asigna la pregunta 4 de entrevistas a los objetivos 3, 4 y 6, mientras la Tabla 27 lista «Encuesta» como única técnica para ellos; las indicaciones para el entrevistador no vinculan H4 con la pregunta 2.", "mejora": "Añadir un objetivo y un criterio de aceptación o intención de participar; crear hipótesis para modalidad y para el contenido sobre ayahuasca o retirar esos objetivos; incorporar un ítem comparativo con la oferta actual y reconciliar la columna Técnica con la Tabla 23."}, {"severidad": "importante", "titulo": "Ética de las entrevistas y uso de los datos: incongruencias y sesgos en la guía", "ubicacion": "5.1.3, 5.1.4.1 y Tabla 23", "cita": "Cuéntame cómo sueles manejar una situación de estrés o malestar emocional... ¿Cuándo fue la última vez? / Las respuestas se usarán solo con fines académicos", "problema": "La pregunta 1 invita a relatar episodios recientes de malestar, lo que contradice el compromiso de «no indagar sobre diagnósticos ni experiencias traumáticas», y el entrevistador no es clínico ni se prevé quién actuará si surge una crisis. El texto de consentimiento presentado corresponde solo a la encuesta; no se incluye el de las entrevistas con grabación de audio (plazo de conservación, destino, anonimización). El consentimiento dice «solo con fines académicos» pero los resultados fijan precio y se usan para decidir sobre un emprendimiento. En la pregunta 5 se presenta RENACER antes de preguntar «qué te parece útil», lo que induce respuestas de cortesía.", "mejora": "Reformular la pregunta 1 de modo general (estrategias y recursos, no episodios), adjuntar el consentimiento de las entrevistas, ajustar el propósito («con fines académicos y de validación de un proyecto de emprendimiento») y presentar el servicio con material neutral (maquetas de las Figuras 5 y 6) preguntando también qué no les convence."}, {"severidad": "importante", "titulo": "Dimensionamiento de mercado incompleto, mal definido y con cifras por verificar", "ubicacion": "5.5.1 y Tabla 28", "cita": "Mercado total: Población de la provincia de Arequipa, 1 322 000 (INEI, 2025) / [COMPLETAR: INEI]", "problema": "Los niveles de la Tabla 28 no son un embudo de mercado: el «mercado total» es la población general de la provincia (no de 18 a 35 años), el «mercado inicial» son los 8 a 12 participantes del piloto (una muestra, no un mercado) y el «mercado objetivo» se estimará con el porcentaje de interés de una muestra por conveniencia, lo que no es extrapolable. El dato del mercado disponible está en blanco aunque el capítulo II ya citaba 405 479 personas de 18 a 35 años del departamento. Las cifras de 1 815 000 y 1 322 000 habitantes deben contrastarse con la publicación oficial del INEI (Censos Nacionales 2025), indicando tabla y fecha de consulta, antes de usarlas como base del dimensionamiento.", "mejora": "Construir el embudo con jóvenes de 18 a 35 años de los distritos de Arequipa Metropolitana (INEI), nivel socioeconómico objetivo, y la capacidad de atención del primer año (20 clientes en la BMC); citar tabla y página de cada cifra; usar el resultado de la encuesta solo como indicio, no como porcentaje de mercado."}, {"severidad": "sugerencia", "titulo": "Secuencia metodológica y orden de apartados", "ubicacion": "5.1, 5.1.4, 5.3 y 5.4", "cita": "Los instrumentos se diseñaron para responder a los objetivos específicos de la Tabla 27.", "problema": "Se describe un diseño de dos etapas (primero entrevistas, luego encuesta) pero el cuestionario ya está elaborado y publicado, de modo que no podrá incorporar hallazgos de las entrevistas. Además, las Tablas 21 a 23 remiten a los objetivos O1 a O7 de la Tabla 27, que se presenta después (5.4).", "mejora": "Colocar los objetivos y criterios antes de la metodología (5.1 y 5.2), justificar que el cuestionario se ajustará tras las entrevistas o cambiar el diseño a uno simultáneo."}, {"severidad": "sugerencia", "titulo": "Marcadores y notas de trabajo en el cuerpo del informe", "ubicacion": "Tablas 21, 24, 25, 26, 27 y 30", "cita": "[COMPLETAR: fechas] / Por registrar / Las cuotas son propuestas y se ajustan a la disponibilidad real de participantes.", "problema": "El expediente final no debe contener marcadores ni instrucciones. Además, la explicación de una cuota flexible («se ajustan a la disponibilidad real») debilita su valor metodológico.", "mejora": "Completar o retirar cada marcador; definir una regla de reemplazo de cuotas (por ejemplo, tolerancia de ±5 por celda)."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Instrumento de la encuesta y guía de entrevista (5.1.4)", "resumen": "Instrumento bien organizado, pero incompleto para validar la funcionalidad del MVP y la disposición de pago, y sin datos recolectados.", "observaciones": [{"severidad": "critico", "titulo": "No se identifica el formulario en línea y no hay evidencia de recolección", "ubicacion": "Tabla 21 (Periodo y Modalidad) y 5.2", "cita": "Periodo: [COMPLETAR: fechas]", "problema": "No se entregó el enlace del formulario ni una captura del formulario publicado. El informe solo describe que se compartirá «por redes sociales y WhatsApp» y afirma que los resultados se registran «únicamente con respuestas reales», pero no existe ninguna respuesta ni fecha de aplicación. En la AA2 se exige recolección real de datos (muestra, instrumento, resultados y métricas).", "mejora": "Publicar el formulario, compartir el enlace de vista y agregarlo al informe (anexo). Aplicar como mínimo 97 encuestas y 8 entrevistas y completar la Tabla 21 con las fechas reales, el número de respuestas válidas y los códigos de los entrevistados."}, {"severidad": "critico", "titulo": "El cuestionario nunca muestra el servicio: no valida la funcionalidad del MVP", "ubicacion": "Tabla 22, preguntas 1 a 12", "cita": "¿Cuánto estarías dispuesto(a) a pagar por un taller grupal de educación emocional de 2 horas?", "problema": "Ninguna pregunta describe ni presenta el prototipo (contenido del taller, facilitador, sesión con psicólogo colegiado, seguimiento, canal de WhatsApp). El encuestado responde sobre un taller que no conoce, por lo que la encuesta mide actitudes generales, no la aceptación del MVP. Tampoco hay preguntas de usabilidad o comprensión de la propuesta de valor ni de intención de participar. En la guía de entrevista solo la pregunta 5 describe RENACER, y de forma verbal.", "mejora": "Insertar antes de las preguntas 8 a 11 una ficha breve con el servicio (qué incluye, duración, modalidad, quién lo dirige, precio de prueba) y una imagen del flujo (Figura 4) o de la comunicación en redes. Agregar preguntas de comprensión («¿Qué entiendes que incluye?»), intención de participar en el piloto (escala o sí/no) y qué elemento es más/menos valioso de los siete del MVP."}, {"severidad": "critico", "titulo": "Disposición de pago declarada, sin precio concreto y anclada en el rango que se quiere validar", "ubicacion": "Preguntas 10 y 11; Tabla 27, objetivo 3", "cita": "c) S/ 50 a 84 · d) S/ 85 a 120 · e) S/ 121 a 150", "problema": "Los rangos de la pregunta 11 reproducen la referencia de mercado de Doctoralia y Psicologa.pe (nota de la Tabla 22), por lo que el encuestado se ancla en esos montos. La pregunta 10 usa rangos desiguales (menos de S/ 30; 30 a 50; 51 a 80; más de 80) y no se propone un precio para el taller, que es el producto de entrada. Además, el criterio de éxito (≥ 40 % dispuesto a pagar S/ 85 a 150 por sesión) solo cubre la sesión individual, y la «Lectura de las respuestas» no aclara qué opciones cuentan como disposición de pago (por ejemplo, si «Menos de S/ 30» suma). Es disposición declarada, no pago real: no hay intención de compra ni prueba de pago.", "mejora": "Definir un precio de lanzamiento del taller (y de la sesión) y preguntar la probabilidad de inscribirse a ese precio (escala 1 a 5), complementada con un método de sensibilidad de precio (por ejemplo, Van Westendorp: muy barato, barato, caro, demasiado caro) con respuesta abierta numérica, sin mostrar rangos de referencia. Fijar un criterio de éxito para el taller. Idealmente, incluir una preinscripción con depósito simbólico o reserva como medición de pago real para el piloto."}, {"severidad": "importante", "titulo": "Pregunta 9: solo dos atributos y ambos son los diferenciadores del grupo", "ubicacion": "Pregunta 9; Tabla 27, objetivo 4", "cita": "a) Horarios nocturnos o de fin de semana: 1 2 3 4 5 · b) Seguimiento después del taller o sesión, por ejemplo un contacto a las dos semanas: 1 2 3 4 5", "problema": "La escala evalúa únicamente los atributos que RENACER quiere confirmar, por lo que induce a la aquiescencia (todo atributo propuesto parecerá importante). El ítem (a) es doble (nocturno o fin de semana) y el criterio de éxito es bajo (≥ 50 % puntúa 4 o 5), por lo que casi cualquier resultado lo cumplirá. La importancia declarada tampoco prueba que el seguimiento sea una ventaja frente al consultorio, el CSMC o la plataforma en línea de la Tabla 6.", "mejora": "Presentar una batería balanceada de 6 a 8 atributos (precio, ubicación, horario, modalidad, seguimiento, quién brinda el servicio, privacidad, certificación del psicólogo, contenido), con orden aleatorio, y pedir además que elijan los 2 más importantes (ranking). Separar «nocturno» de «fin de semana». Subir el umbral o definirlo en función de los demás atributos."}, {"severidad": "importante", "titulo": "Pregunta 8: opciones que empujan hacia la propuesta y mezclan dos dimensiones", "ubicacion": "Pregunta 8; Tabla 27, objetivo 6", "cita": "a) Presencial, en la noche entre semana · b) Presencial, sábado · c) Virtual, en la noche entre semana · d) Virtual, en horario flexible · e) Modalidad mixta", "problema": "Modalidad y horario se mezclan en una sola pregunta de respuesta única; no hay opciones de mañana, tarde entre semana ni domingo, y casi todas las alternativas son nocturnas, coherentes con el diseño del taller. El resultado no permite saber si la preferencia nocturna es real ni separar modalidad de franja horaria.", "mejora": "Dividir en dos preguntas: modalidad (presencial, virtual, mixta) y franja disponible (selección múltiple: mañana, tarde, noche entre semana, sábado, domingo). Incluir «Otra» y «Ninguna me conviene»."}, {"severidad": "importante", "titulo": "Preguntas 3 y 4: formulación doble y afirmativa que sesga la medición del problema", "ubicacion": "Preguntas 3 y 4; Tabla 27, objetivo 1", "cita": "¿Con qué frecuencia te cuesta identificar o expresar lo que sientes? · Me resulta difícil saber qué información sobre salud mental o bienestar emocional es confiable.", "problema": "La pregunta 3 pregunta por dos conductas distintas (identificar y expresar) en una misma escala; la 4 es una afirmación única de acuerdo/desacuerdo, tipo de ítem propenso a la aquiescencia. Con muestreo por conveniencia entre personas interesadas en bienestar emocional, el criterio de ≥ 60 % «declara la dificultad» (Tabla 27) tenderá a sobrestimarse. Además, el criterio cuenta «A menudo» y «Casi siempre» sin explicar por qué ese umbral prueba que el problema justifica el servicio.", "mejora": "Separar la pregunta 3 en dos ítems, añadir ítems inversos o neutros y una pregunta sobre conductas reales (si buscó ayuda en los últimos 12 meses y cuánto gastó). Reportar los resultados diferenciando a quienes ya buscaron ayuda de quienes no."}, {"severidad": "importante", "titulo": "Cobertura incompleta de hipótesis y del modelo de negocio", "ubicacion": "Tablas 13, 16, 22 y 27 (H2 y H4)", "cita": "H4: Las redes sociales y WhatsApp son canales eficaces y de costo razonable para captar al segmento.", "problema": "H4 se verifica con costo de captación y origen de las consultas (piloto), pero el cuestionario solo pregunta dónde se informan (pregunta 7, O5), no por dónde contactarían ni qué canal los convencería. No hay preguntas sobre experiencias de pago previas, quién influye en la decisión, ni sobre las alternativas que usan hoy y su precio. Tampoco se pregunta si prefieren el taller o la sesión individual, ni si les resulta confiable que lo brinde un facilitador que no es psicólogo. La encuesta de satisfacción del piloto (Tabla 16) no se presenta como instrumento.", "mejora": "Añadir: canal preferido de contacto, uso previo de servicios de bienestar y monto pagado, preferencia taller versus sesión, y confianza según quién brinda el servicio. Incluir la encuesta de satisfacción y la ficha de orientación como anexos, con las preguntas exactas."}, {"severidad": "importante", "titulo": "Cuotas y variables de control incoherentes con el instrumento", "ubicacion": "Pregunta 2, 5.1.4.1 y Tabla 30", "cita": "Ocupación: Mínimo 20 por categoría: estudiante, dependiente, independiente o profesional", "problema": "La pregunta 2 ofrece cinco opciones («Solo estudio», «Estudio y trabajo», «Trabajo en una empresa…», «Soy independiente o profesional», «Otra») que no coinciden con las tres categorías de la cuota; no se sabe dónde se clasifica a quien estudia y trabaja. Se piden sexo y distrito como datos de control, pero no el nivel socioeconómico, aunque el segmento objetivo (apartado 2.5) se define por NSE. La edad tiene un rango de 31 a 35 que quedaría en 25 encuestas, insuficiente para analizar por subgrupo.", "mejora": "Alinear las opciones de la pregunta 2 con las categorías de cuota, agregar una pregunta o proxy de nivel socioeconómico (distrito, ingreso aproximado) y declarar que los análisis por subgrupo son solo descriptivos."}, {"severidad": "sugerencia", "titulo": "Pregunta 12 sobre ayahuasca: formulación que informa antes de medir", "ubicacion": "Pregunta 12; Tabla 27, objetivo 7", "cita": "Si un servicio de bienestar emocional incluyera información educativa sobre experiencias no ordinarias de conciencia, como la ayahuasca, ¿cómo influiría en tu interés?", "problema": "El eufemismo «experiencias no ordinarias de conciencia» y la primera opción («Me interesaría más») sugieren una valoración positiva. Además, el MVP declara que la ayahuasca no es parte del piloto (4.1.1); preguntarla en una encuesta de validación de 12 preguntas sin explicar su rol puede confundir y desviar la atención del servicio principal.", "mejora": "Ubicarla al final, con redacción neutral (por ejemplo, «¿Cómo cambiaría tu interés si el servicio incluyera información sobre ayahuasca?») y opciones simétricas (aumentaría mucho, aumentaría algo, sin cambio, disminuiría algo, disminuiría mucho), con una nota que aclare que no es parte del servicio ofrecido."}, {"severidad": "sugerencia", "titulo": "Instrumento sin preguntas abiertas ni captación de contactos para el piloto", "ubicacion": "Tabla 22", "cita": "Cuestionario de 12 preguntas cerradas (apartado 5.1.4)", "problema": "Todo el cuestionario es cerrado: no se puede recoger objeciones, lenguaje del cliente ni sugerencias de mejora para el MVP, que es lo que sustenta el nivel 4 de la rúbrica. Tampoco se aprovecha la encuesta para formar la lista de interesados del taller piloto (meta de ≥ 40 consultas).", "mejora": "Agregar una pregunta abierta final («¿Qué te haría dudar de este servicio?» o «¿Qué cambiarías?») y un campo opcional de contacto, separado de las respuestas anónimas, para invitar a quienes quieran participar en el piloto."}, {"severidad": "sugerencia", "titulo": "Criterios de éxito propuestos, ajustables y repartidos en varias tablas", "ubicacion": "Tablas 15, 26 y 27", "cita": "Los criterios de validación se ajustarán con el docente antes de aplicar los instrumentos.", "problema": "Existen tres juegos de criterios con umbrales distintos y descritos como «propuestos» y «ajustables». Sin criterios fijados antes de recolectar, no se puede determinar objetivamente si una hipótesis se confirma, se ajusta o se descarta.", "mejora": "Unificar en una sola tabla los criterios con umbral, fuente de dato y decisión (confirmar, ajustar o descartar), y congelarla antes de aplicar el formulario."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Modelo de negocio: cambios menores y coherencia con el cap. 6", "resumen": "Solo se añadió el párrafo de articulación (3.2.10); los montos siguen siendo referenciales y no coinciden con el MVP.", "observaciones": [{"severidad": "importante", "titulo": "Ingresos del BMC no coinciden con lo que prueba el MVP", "ubicacion": "3.2.5 y 3.2.10; Tabla 19", "cita": "Como referencia inicial, el modelo se plantea con un precio de S/ 150 por sesión individual", "problema": "El BMC lista sesiones, talleres, programas de seguimiento y contenido digital, pero fija precio solo para la sesión (S/ 150). El MVP vende un taller a S/ 10 y deja la sesión en «tarifa de prueba por acordar». Sin una tabla de precios única el cap. 6 no puede construir el presupuesto de ingresos.", "mejora": "Agregar al cap. 3 o al inicio del cap. 6 una tabla: servicio, precio, costo variable, margen. Ejemplo: sesión S/ 150 − S/ 50 de honorario = S/ 100 (66,7 %); taller con precio P y 8 asistentes: margen = 8·P − costos del taller."}, {"severidad": "sugerencia", "titulo": "Meta de 20 clientes al mes sin conexión con el embudo del piloto", "ubicacion": "3.2.10 y Tabla 9", "cita": "Se establece una meta inicial de 20 clientes mensuales", "problema": "El piloto prevé 12 inscritos y 8 asistentes en seis semanas; la Tabla 9 usa 40 consultas y 30 % de conversión (12 clientes) y el MVP 36 consultas con 33 %. Tres embudos distintos.", "mejora": "Escoger un solo embudo (el de 4.2.2) y derivar de él la meta mensual del cap. 6; actualizar la Tabla 9 con los mismos números."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Producto mínimo viable: planteamiento y herramientas", "resumen": "Capítulo muy mejorado y ahora a nivel Logrado: define objetivos medibles, ficha del taller, pasos y herramientas con criterios. Falta evidencia de ejecución (fechas, capturas reales) y coherencia de roles y precios.", "observaciones": [{"severidad": "critico", "titulo": "Los once pasos de desarrollo no tienen fecha y las evidencias son maquetas", "ubicacion": "Tabla 15 y Tabla 31 (Figuras 7 a 11)", "cita": "Diseño ilustrativo; sustituir por evidencia auténtica al implementarlo", "problema": "Los once pasos dicen «Fecha pendiente de confirmar»; las Figuras 7 a 11 se rotulan «Maqueta digital referencial... no acredita que la cuenta esté activa». Para el nivel 4 se exige sustentar TODOS los pasos seguidos, y hoy no hay prueba de que alguno se ejecutó (el piloto empezaría el 09/11).", "mejora": "Registrar fecha real y adjuntar captura con fecha de cada paso (perfil de Instagram, WhatsApp Business, formulario, ensayo del taller con lista de asistencia). Si un paso no se hizo, indicarlo; eliminar la fila de «diseño ilustrativo»."}, {"severidad": "importante", "titulo": "Roles incoherentes: facilitadora, psicóloga y asistentes", "ubicacion": "Tabla 19, Tabla 26 y Tabla 13", "cita": "Facilitador: Alexandra Pilar Manrique Paredes, C.Ps.P. N.° 63830 / Facilitador: Gustavo Adolfo Mamani Chambilla / Roxana Lisseth Denos Mamani", "problema": "La Tabla 19 asigna a la misma psicóloga como facilitadora y como apoyo profesional por teléfono, mientras la Tabla 26 dice que el facilitador es un integrante del equipo, que no evalúa riesgo; si ella facilita, no puede estar disponible aparte. Además aparecen «Roxana Demos» y «Roxana Denos». El acuerdo con la psicóloga (honorarios, disponibilidad) se declara condicionalmente («si el psicólogo es aliado»).", "mejora": "Definir una sola persona por rol y un organigrama: facilitador, psicólogo de guardia (distinto del facilitador), asistente y coordinador de datos. Adjuntar el acuerdo firmado con honorario por hora y corregir el apellido."}, {"severidad": "importante", "titulo": "Costo del taller y del piloto sin cuantificar", "ubicacion": "Tabla 19, fila «Costo estimado por participante»; Tabla 22", "cita": "Por cotizar: alquiler del espacio (si corresponde), materiales por participante y honorarios del facilitador", "problema": "El MVP no cuesta nada en herramientas (S/ 0) pero sí en honorarios, local y publicidad. Con los datos del grupo: 2 h × S/ 50 = S/ 100 + S/ 150 de publicidad = S/ 250 como mínimo, contra un ingreso máximo de 12 × S/ 10 = S/ 120; resultado mínimo −S/ 130 antes de local y materiales. Este presupuesto del piloto no figura en el cap. 4.", "mejora": "Agregar una tabla «Presupuesto del piloto» (honorarios, local con cotización, materiales por participante, publicidad, imprevistos) y su financiamiento; trasladarla al cap. 6.1 como inversión inicial."}, {"severidad": "importante", "titulo": "Metas con denominadores que no miden demanda real", "ubicacion": "Tabla 16, metas 4 y 8; 4.2.2", "cita": "≥ 12 de 36 consultas (33 %)", "problema": "Como el aforo es de 12, la inscripción se topa en 12: no se puede observar demanda superior y la conversión máxima observable es 33 %. La meta 8 sobre 8 asistentes (4 personas) y la satisfacción de 7 de 8 son decisiones de una sola persona. La regla «continuar con 7 u 8 de 8 metas» tampoco pondera la meta 4, que es la más relevante para el precio.", "mejora": "Habilitar lista de espera para medir demanda excedente (por ejemplo, 12 cupos + 8 en espera) y reportar la conversión sobre consultas totales. Reforzar la meta 4 como condición necesaria también en «Ajustar» y «Replantear»."}, {"severidad": "sugerencia", "titulo": "Herramientas: falta fuente de costos, medios de pago y capturas reales", "ubicacion": "Tabla 22, nota; 4.2.2", "cita": "Los costos se verificaron en las condiciones de uso gratuito de cada herramienta 09/11/2026", "problema": "La Tabla 22 cumple los criterios de funcionalidad, usabilidad, viabilidad y costo, con alternativa y plan B (fortaleza). Para el nivel 4 falta citar la fuente de cada costo (enlace o captura), incluir Yape/transferencia (medio de la meta 4) y confirmar «que el equipo dispone de una cuenta Google institucional». Verificado con la lista de precios del docente: WhatsApp Business, Forms y Sheets gratis (S/ 0); Instagram S/ 0; coincide.", "mejora": "Añadir columna «Fuente y fecha» con URL oficial, fila de Yape/transferencia con su comisión y captura de la configuración real."}, {"severidad": "sugerencia", "titulo": "Mantener la decisión de no desarrollar software y declarar el costo de escalar", "ubicacion": "4.3, Tabla 18", "cita": "Otros elementos que se dejan fuera del piloto: una aplicación móvil y una página web", "problema": "La decisión es coherente con un MVP de servicio; la lista del docente prevé, como opcional, una web sencilla (30 h × S/ 50 = S/ 1 500 de desarrollo y 2 a 4 h de mantenimiento al mes a S/ 40/h). El cap. 6 debe decir si la web entra en el año 2 o 3.", "mejora": "Incluir en la inversión del año 2 el opcional de S/ 1 500 o justificar que no se hará, y anotar el costo de mantener las cuentas (S/ 0) y de la publicidad."}, {"severidad": "sugerencia", "titulo": "CAC de operación distinto al del piloto", "ubicacion": "Tabla 9 vs. Tabla 16, meta 3", "cita": "S/ 600 ÷ 12 = S/ 50 (meta ≤ S/ 60) / ≤ S/ 12,50 por inscrito", "problema": "El CAC objetivo de operación (S/ 50 a 60) es 4 a 5 veces el del piloto (S/ 12,50 = S/ 150 ÷ 12). Con CAC de S/ 60 y sesión de S/ 150, el margen por cliente (150 − 50 − 60) cae a S/ 40 (26,7 %), por lo que 20 clientes dejan S/ 800 al mes antes de local, materiales, impuestos y administración.", "mejora": "Explicar por qué el CAC pasaría de S/ 12,50 a S/ 50 o S/ 60 y usar en el cap. 6 el CAC real medido en el piloto, con sensibilidad (S/ 12,50, S/ 30, S/ 60)."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Validación: diseño sólido, sin resultados", "resumen": "Metodología muy superior a la versión del 06/11 (matriz única, Wilson, saturación, triangulación). Sin datos reales no se puede analizar viabilidad: las Tablas 34, 39, 40 y 58 a 65 están en «Por registrar».", "observaciones": [{"severidad": "critico", "titulo": "No hay un solo resultado real", "ubicacion": "Tablas 39, 40, 58 y 60 a 65; 5.16 a 5.22", "cita": "Por registrar", "problema": "Se cuentan 329 celdas «Por registrar» y 35 marcas «pendiente/por cotizar/por definir». No hay entrevistas, ni encuesta, ni piloto, ni conclusiones por hipótesis ni mejoras al MVP. El cronograma (Tabla 30) sitúa el piloto del 09/11 al 20/12/2026; al 11/11 está en la semana 1. La rúbrica exige analizar resultados (nivel 3) y sustentar mejoras (nivel 4).", "mejora": "Entregar la versión final con: n válido de la encuesta (meta 97 a 100) y de entrevistas (8), conteos del piloto (36, 12, 8, 4), la Tabla 62 con el estado confirmada/ajustada/descartada de H1 a H5 y la Tabla 64 con al menos tres mejoras concretas. Si el piloto no termina a tiempo, presentar resultados parciales con fecha de corte y rotular lo pendiente."}, {"severidad": "importante", "titulo": "Pregunta 13: solo evalúa los dos diferenciadores y el ítem es doble", "ubicacion": "Tabla 36, pregunta 13; C16", "cita": "a) Horarios nocturnos o de fin de semana: 1 2 3 4 5 / b) Seguimiento después del taller", "problema": "Sigue sin corregirse lo señalado el 06/11: la batería mide solo horario y seguimiento (los atributos que RENACER quiere confirmar) y el ítem a mezcla noche y fin de semana. El umbral C16 será fácil de superar por aquiescencia.", "mejora": "Ampliar a 6 a 8 atributos (precio, ubicación, privacidad, quién brinda el servicio, modalidad, contenido) en orden aleatorio, separar «nocturno» y «fin de semana» y pedir el ranking de los 2 principales. Fijar el umbral relativo a la media de los demás atributos."}, {"severidad": "importante", "titulo": "Disposición de pago: anclaje y supuesto sin fuente", "ubicacion": "Preguntas 15 y 16; C9, C10; Tabla 42", "cita": "Supuesto: la conducta real equivale a 80 % de la intención declarada", "problema": "La pregunta 16 repite los rangos de S/ 85 a 150 de Doctoralia y Psicologa.pe (nota de la tabla de la encuesta) y C10 exige «S/ 85 o más» como éxito, lo que mantiene el sesgo. C9 usa 40 % × 0,8 = 32 % para justificar el umbral, pero el 80 % no tiene fuente; las encuestas de intención suelen sobrestimar la compra. El precio de referencia del taller (S/ 40) tiene una redacción confusa («esto es un piloto del precio de S/10»).", "mejora": "Citar la fuente del 0,8 o reemplazarlo por un factor conservador (por ejemplo, 0,5) y apoyarse en la muestra de pago real (meta 4). Complementar con precio máximo y mínimo abierto (Van Westendorp) y redactar claramente la nota: precio de referencia S/ 40 en la encuesta; precio de prueba de S/ 10 solo en el piloto."}, {"severidad": "importante", "titulo": "Muestreo por conveniencia y mercado objetivo sin dimensionar", "ubicacion": "5.1.2, Tabla 43, Tabla 51", "cita": "100 000 × 60 % = 60 000 personas", "problema": "El informe reconoce el sesgo de autoselección, pero la Tabla 43 deja vacíos el mercado disponible y objetivo («se calculará con REDATAM») y la Tabla 51 es un ejemplo con 100 000 jóvenes sin fuente. El SOM ilustrativo (336 clientes, 2 % de captura) equivale a 1,4 veces la meta de 20 clientes mensuales (240 al año = S/ 36 000 a S/ 150), pero a 3 sesiones por cliente exige 84 sesiones al mes.", "mejora": "Calcular TAM-SAM-SOM con la población real del INEI/REDATAM de 18 a 35 años en Arequipa Metropolitana, sin filtro de interés, y aplicar un SOM anclado al piloto (inscritos pagos por consultas) y a la capacidad de la psicóloga."}, {"severidad": "importante", "titulo": "Estructura y control del informe", "ubicacion": "Índice (p. 2); Tabla 46", "cita": "Contenido: Índice … CAPÍTULO III … Referencias 36", "problema": "El índice solo lista los caps. I a III; los caps. IV y V (más de 2 400 líneas de texto) no aparecen. La Tabla 46 informa «19 preguntas cerradas» pero hay numeración 13c y 13d y dos abiertas (21 ítems).", "mejora": "Actualizar el índice automático con los capítulos IV a VI y anexos; corregir el conteo de preguntas."}, {"severidad": "sugerencia", "titulo": "Pregunta 17: opción positiva primera y sin aclarar el rol de la ayahuasca", "ubicacion": "Pregunta 17; C19", "cita": "a) Me interesaría más", "problema": "La redacción mejoró («sin ceremonias ni consumo») pero la primera opción es afirmativa y el MVP excluye el tema (4.1.1). Está bien que C19 no condicione ninguna hipótesis.", "mejora": "Reordenar con escala simétrica («aumentaría mucho… disminuiría mucho») y una nota que aclare que no forma parte del servicio."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Capítulo 6 ausente: las siete piezas no existen", "resumen": "No hay capítulo VI. Solo aparecen insumos sueltos (S/ 150 por sesión, S/ 50/h, S/ 10 de prueba, CAC y la Tabla 65 con todo «Por registrar»). El criterio Análisis presupuestal queda en 1.", "observaciones": [{"severidad": "critico", "titulo": "Falta el capítulo completo", "ubicacion": "Índice y fin del cap. V (5.22)", "cita": "Los resultados validados son los datos de partida del presupuesto y del modelo financiero del capítulo VI", "problema": "No existen estructura de inversión, costos y gastos, presupuesto de ingresos, de egresos, flujo mensual año 1, flujo económico a 3 años, ni VAN, TIR y PRI. Tampoco hay análisis del entorno interno y externo. Con solo 5.22 que remite al cap. VI, no hay coherencia que evaluar.", "mejora": "Elaborar las siete piezas (Word y Excel de respaldo), con horizonte de 3 años, a partir de: inversión inicial (piloto S/ 250 como mínimo, más capacitación en primeros auxilios, formalización, equipamiento y capital de trabajo de 2 a 3 meses), tasa de descuento declarada (COK) y escenarios pesimista, base y optimista."}, {"severidad": "critico", "titulo": "Precios no coherentes entre secciones", "ubicacion": "3.2.10; Tabla 19; pregunta 15; Tabla 51; Tabla 65", "cita": "S/ 150 / S/ 10 / S/ 40 / S/ 100 / «Tarifa de prueba»", "problema": "Hay cuatro cifras distintas: sesión S/ 150 (cap. 3), taller S/ 10 (prueba), S/ 40 (referencia de la encuesta) y S/ 100 en el ejemplo de ingreso (336 × S/ 100 × 3 = S/ 100 800, verificado). La tarifa de la sesión de prueba no se fija. Sin precio no hay presupuesto de ingresos.", "mejora": "Definir y justificar con costos y encuesta: precio de lanzamiento del taller (por ejemplo, S/ 40), sesión (S/ 150), paquete (por ejemplo, 4 sesiones con descuento) y un mix de ventas por mes. Ingreso mensual = clientes × sesiones × precio + asistentes × precio del taller × talleres."}, {"severidad": "importante", "titulo": "Punto de equilibrio y margen de contribución no calculados", "ubicacion": "3.2.10 y Tabla 9", "cita": "El saldo de S/ 2,000 corresponde al margen previo al descuento de otros costos operativos", "problema": "Con los datos del informe: margen de contribución por sesión = 150 − 50 = S/ 100 (66,7 %); con CAC de S/ 50, S/ 50 (33 %). Con costos fijos desconocidos, PE = CF ÷ (150 − 50 − CAC): por ejemplo, con CF de S/ 1 000 al mes y CAC S/ 50, PE = 20 sesiones; con CF de S/ 1 500, 30 sesiones (superior a la meta de 20). El margen operativo de 25 % de la Tabla 9 (4 800 − 3 600) es un ejemplo que no se vincula a costos reales.", "mejora": "Calcular el PE mensual con costos fijos reales (alquiler de sala por horas, internet, marketing mínimo, contador, capacitación) y compararlo con las 20 sesiones de la meta; si no se alcanza, subir el precio del taller o reducir el costo fijo."}, {"severidad": "importante", "titulo": "Capacidad, escalabilidad y confidencialidad sin impacto financiero", "ubicacion": "Tablas 23, 24 y 26", "cita": "Un coordinador de datos administra los archivos", "problema": "La confidencialidad está bien resuelta en lo normativo, pero no se costea: inscripción del banco de datos, asesoría legal, seguro de responsabilidad profesional, cuenta institucional de Google y capacitación (curso de primeros auxilios psicológicos). La capacidad por profesional (sesiones al mes) y el costo por sesión tampoco están calculados.", "mejora": "Incluir en egresos: asesoría legal (cotizar), seguro de responsabilidad civil, capacitación y honorarios por 20 h clínicas al mes (20 × S/ 50 = S/ 1 000). Fijar la capacidad por profesional y cuándo se contrata un segundo."}, {"severidad": "sugerencia", "titulo": "Alinear con la lista de precios y la hoja de costos del docente", "ubicacion": "Lista de precios del docente y hoja de costos", "cita": "WhatsApp Business gratis; Google Forms y Sheets gratis; desarrollo web opcional S/ 1 500", "problema": "La lista del docente coincide con el informe en lo gratuito (S/ 0) y con S/ 50/h de honorarios; deja como «Cotizar» el local, los materiales, la videollamada y la publicidad. La hoja de costos del docente prevé 20, 30 y 60 clientes al mes (S/ 3 000, S/ 4 500 y S/ 9 000 de ingreso a S/ 150).", "mejora": "Usar esos tres escenarios como base de sensibilidad del flujo de caja y reemplazar los rubros «Cotizar» por cotizaciones reales con comprobante."}]}], "fecha_aa2": "11/11/2026", "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 4, "responsabilidad": 3}, "calificacionAA2": {"validacion": 2}, "enlaces": [{"titulo": "Informe del TAP (Google Docs)", "url": "https://docs.google.com/document/d/1epB8tAy4oL64jzqCmjFnD3R5pKOcYNMY 7.1655, 327.8275], "ingreso_etiqueta": "Ingreso bruto (S/ 150 por sesión)", "ingreso_pen": [3000.0, 4500.0, 9000.0], "chat_pen": null, "desarrollo_pen": 1500.0, "mantenimiento_pen": [0.0, 80.0, 160.0], "total_con_mant_pen": [0.0, 136.5822, 417.2442], "tarifa_desarrollo": 50, "tarifa_mantenimiento": 40, "pct_ingreso": [0.0, 0.0126, 0.0286], "por_usuario_pen": [0.0, 1.8861, 4.2874], "notas": ["Sitio web estático en Firebase Hosting o similar: dentro de la capa gratuita; el costo real es solo el dominio.", "Formularios (Google Forms) y la app WhatsApp Business no tienen costo. La API de WhatsApp solo conviene con automatización y volumen.", "No requieren base de datos, IA ni servidores para el MVP: su costo digital es marginal."], "elaborado": "11/11/2026", "primer_pago_total_pen": [1500.0, 1627.1655, 1827.8275], "costo_anio1_pen": [1500.0, 3138.986, 6506.93], "necesidades": {"nombre": "Renacer", "resumen": "Servicio presencial de educación emocional (talleres y orientación). Sin software propio: sus costos son honorarios, local, materiales y captación.", "items": [{"rubro": "Honorarios del psicólogo", "necesidad": "Sesiones individuales y taller. El informe declara S/ 50 por hora y una meta de 20 clientes al mes (3.2.7).", "origen": "Declarado", "proveedor": "Profesional colegiado (psicólogo)", "producto": "Honorario por hora", "precio": "S/ 50 por hora (declarado por el grupo)", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": "Sustentar la tarifa con 2 referencias de mercado."}, {"rubro": "Local para taller y sesiones", "necesidad": "Piloto presencial en Arequipa Metropolitana.", "origen": "Declarado", "proveedor": "Alquiler de aulas o coworking por horas en Arequipa", "producto": "Alquiler por hora o por sesión", "precio": "Cotizar por hora", "pen": null, "frecuencia": "por uso", "estado": "Cotizar", "nota": ""}, {"rubro": "Materiales del taller", "necesidad": "Fichas, material de dinámicas y papelería.", "origen": "Inferido", "proveedor": "Librer otasAA2": {"id": "grupo-mamani-denos-vargas-mancha", "fecha": "11/11/2026", "mvp": 3, "herramientas": 3, "validacion": 2, "presupuesto": 1, "compromiso": 3, "total": 12, "justificacion": {"mvp": "Logrado: el cap. 4 define objetivos con metas en conteos derivadas de un solo embudo (Tabla 16: 36 consultas, 12 inscritos, 8 asistentes), ficha del taller (Tabla 19), módulos (Tabla 20), funcionalidades con exclusiones (Tabla 18) y once pasos de desarrollo (Tabla 15), coherentes con la propuesta de valor. No llega a 4 porque los once pasos dicen «Fecha pendiente de confirmar», las Figuras 7 a 11 son maquetas que «no acreditan» ejecución, y los roles de facilitadora y psicóloga se contradicen entre las Tablas 19 y 26.", "herramientas": "Logrado, en el límite alto: la Tabla 22 sustenta WhatsApp Business, Instagram, Google Forms y Sheets con funcionalidad, usabilidad, viabilidad y costo (S/ 0, coincide con la lista del docente), alternativa descartada y plan B, y las Tablas 23 y 24 tratan los datos de salud (Ley 29733, acceso limitado, eliminación a los 30 días). Para 4 faltan la fuente verificable de cada costo (solo dice «09/11/2026»), Yape o transferencia como medio de pago, capturas reales de las cuentas y la confirmación de la cuenta Google.", "validacion": "En proceso: el diseño es sólido (matriz única Tabla 42, Wilson verificado 40,4 % y 50,2 %, saturación, triangulación) y el instrumento corrige varias fallas del 06/11, pero las Tablas 34, 39, 40 y 58 a 65 están en «Por registrar» (329 celdas) y el piloto está previsto del 09/11 al 20/12/2026. Sin resultados no hay análisis de viabilidad ni mejoras al MVP; además persisten la pregunta 13 con solo dos atributos y el anclaje en S/ 85 a 150 de la pregunta 16.", "presupuesto": "Inicio: no existe el capítulo VI; el índice termina en el cap. III y el cap. V cierra remitiendo a él (5.22, Tabla 65 con todo «Por registrar»). Solo hay insumos sueltos y no coherentes entre sí: sesión S/ 150, taller S/ 10 de prueba, S/ 40 de referencia y S/ 100 en el ejemplo de la Tabla 51; ninguna de las siete piezas (inversión, costos, ingresos, egresos, flujo mensual, flujo a 3 años, VAN/TIR/PRI) está presente.", "compromiso": "a criterio del docente"}, "cambios_vs_6nov": "Mejoró mucho el cap. 4 (reescrito: ficha del taller, once pasos, herramientas con criterios, protocolo de riesgo, tratamiento de datos, psicóloga identificada) y el instrumento del cap. 5 (se muestra el servicio, precio de referencia, preguntas abiertas y de contacto, matriz única con Wilson). Se mantiene el cap. 3 con un párrafo nuevo. Empeora la visibilidad del avance financiero: sigue sin cap. 6 y el cap. 5 sigue sin datos reales (329 celdas «Por registrar»); el índice no incluye los caps. IV y V. Respecto de la revisión previa: MVP 3 (igual, más sólido), herramientas 3 (igual, más sólido), validación 2 (igual por falta de datos), presupuesto pasa de pendiente a 1.", "camino_al_20": ["Redactar el cap. 6 completo (inversión, costos y gastos, ingresos, egresos, flujo mensual año 1, flujo económico a 3 años, VAN/TIR/PRI) con escenarios de 20, 30 y 60 clientes al mes y S/ 150 por sesión; sube Análisis presupuestal de 1 a 3.", "Unificar precios en una tabla (taller de prueba S/ 10, taller de régimen, sesión S/ 150, paquete) y calcular margen de contribución por servicio: 150 − 50 = S/ 100 por sesión; taller = 8 × precio − costos del taller.", "Calcular el punto de equilibrio: PE = costos fijos ÷ (precio − costo variable − CAC), por ejemplo CF S/ 1 000 ÷ (150 − 50 − 50) = 20 sesiones; compararlo con la meta de 20 clientes y declarar capacidad por profesional (sesiones al mes).", "Ejecutar el piloto, las 8 entrevistas y las 97 a 100 encuestas, y llenar las Tablas 34, 39, 40 y 58 a 65 con conteos reales y conclusión por hipótesis; sube Validación de 2 a 3.", "Completar la Tabla 64 con al menos tres mejoras al MVP (antes, hallazgo, después, efecto en precio y volumen) y trasladar el precio y la conversión validados al cap. 6; sube Validación a 4 y Presupuesto a 4.", "Reemplazar las maquetas de las Figuras 7 a 11 por capturas reales con fecha, fechar los once pasos de la Tabla 15 y definir un solo facilitador, psicólogo de guardia y asistentes (corregir Tablas 19 y 26 y el apellido Denos); sube Planteamiento del MVP a 4.", "Añadir fuente y fecha a los costos de la Tabla 22, Yape/transferencia, cotizaciones de local y materiales, y actualizar el índice con los caps. IV a VI; sube Herramientas a 4."]}, "calculadoraXlsx": "calculadora-renacer-bf53054f.xlsx", "excelPE": {"id": "grupo-mamani-denos-vargas-mancha", "estado": "calificado", "revisado": "2026-11-13", "archivo": "D:\\05 - Personal\\Proyecto de Claude\\Cursos\\Proyecto Integrador\\entregas\\AA2_excel\\grupo-mamani-denos-vargas-mancha.xlsm", "logro": 53.8, "nivel": 2, "aviso": "Revisión experta (lectura con openpyxl, sin ejecutar macros; el libro no contiene macros). Primera calificación del Excel.", "tecnico": {"hojas": ["PORTADA", "SUPUESTOS", "BASE ENCUESTA", "ANALISIS ENCUESTA", "COMENTARIOS ABIERTOS", "PRECIOS Y DEMANDA", "PRESUPUESTO PILOTO", "COSTOS OPERATIVOS", "INGRESOS", "ESTADO RESULTADOS", "FLUJO CAJA 12M", "PUNTO EQUILIBRIO", "INVERSION FINANCIAMIENTO", "ESCENARIOS", "INDICADORES", "RIESGOS Y CONTROLES", "FUENTES Y CRITERIOS", "DEMANDA Y EMBUDO", "ACTIVOS DEPRECIACION", "PLAN MARKETING MVP", "VALORACION VAN TIR", "INDICADORES FINANCIEROS"], "formulas": 396, "errores_formula": [], "graficos": 0}, "criterios": [{"clave": "inversion", "nombre": "Inversión inicial", "peso": 10, "puntaje": 5, "comentario": "Hoja INVERSION FINANCIAMIENTO: capital inicial recomendado S/ 8 970 (B10) = capital de trabajo 3 meses S/ 6 465 (B6 = costo operativo mensual S/ 2 155 × 3) + presupuesto del MVP S/ 1 212 (B7) + contingencia 20 % del capital de trabajo S/ 1 293 (B9); aporte igualitario S/ 2 242,50 por socio (B13:B16) con fórmulas vivas y financiamiento 100 % propio. Pieza incompleta (tope 50 %): no hay activos fijos ni constitución/formalización (ACTIVOS D       ${s.puntuacion.nota ? `<p class="summary">${esc(s.puntuacion.nota)}</p>` : ''}

    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">

      </li>`;
    }).join('')}</ul>
    ${s.preguntas?.length ? `<div><h3 style="margin-bottom:8px">Preguntas que podrían mejorar el formulario</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Pregunta sugerida</th><th>Opciones o escala</th><th>Para qué sirve</th></tr></thead>
        <tbody>${s.preguntas.map(q => `<tr><td>${esc(q.pregunta)}</td><td>${esc(q.opciones)}</td><td>${esc(q.mide)}</td></tr>`).join('')}</tbody>

    ${s.consejos?.length ? `<div><h3 style="margin-bottom:8px">Consejos para que los resultados no salgan vacíos ni previsibles</h3>
      <ul class="strength">${s.consejos.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
  </section>`;
};
D.secciones.forEach((s, si) => { if (!isAA2(s)) renderSec(s, si); });
html += '</div>';

if (hasAA2) {
  html += '<div id="tab-aa2" class="tabpane" hidden>';
  html += `<section class="block aa2" id="aa2">
    <div class="head"><div class="eyebrow">Evidencia 2 · avance en curso</div><h2>Evidencia 2 (AA2): retroalimentación de avance</h2></div>
    <p class="summary">Esta parte corresponde a la Evidencia 2 (capítulos 4, 5 y 6 y elevator pitch). Es retroalimentación formativa para que puedan mejorar mientras avanzan. ${D.fecha_aa2 ? `Última actualización: ${esc(D.fecha_aa2)}. ` : ''}Se irá actualizando en este mismo enlace.</p>
    ${D.notasAA2 ? (() => {
      const N = D.notasAA2, NIV3 = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
      const filas = [['mvp', 'Planteamiento del MVP (cap. 4)'], ['herramientas', 'Herramientas para desarrollar el MVP (cap. 4)'], ['validacion', 'Validación del modelo de negocio (cap. 5)'], ['presupuesto', 'Análisis presupuestal (cap. 6)'], ['compromiso', 'Compromiso (individual)']];
      const tot = Number(N.total);
      return `<div class="scorebox" id="nota-aa2">
        <div class="eyebrow">Calificación preliminar de la Evidencia 2 · informe del ${esc(N.fecha)}</div>
        <div class="grade"><span class="big">${tot}</span><span class="of">/ 20</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio de la rúbrica AA2</th><th>Nivel</th><th class="num">Puntos</th><th>Por qué</th></tr></thead>
          <tbody>${filas.map(([k, t]) => { const p = Number(N[k]); return `<tr><td>${t}</td><td><span class="lvl l${p}">${NIV3[p] ?? '—'}</span></td><td class="num">${p} / 4</td><td>${esc((N.justificacion || {})[k] || '')}</td></tr>`; }).join('')}</tbody>

        ${N.cambios_vs_6nov ? `<p class="summary"><b>Cambios frente al 06/11:</b> ${esc(N.cambios_vs_6nov)}</p>` : ''}
        ${N.camino_al_20?.length ? `<h4 style="margin:12px 0 6px">Camino para subir la nota</h4><ol class="priorities">${N.camino_al_20.map(c => `<li><span>${esc(c)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Calificación preliminar con la rúbrica oficial de la AA2 y criterio exigente de revisión de negocios. El criterio «Compromiso» es individual y lo define el docente (se muestra 3 por defecto). El Excel de punto de equilibrio se evalúa aparte y puede modificar el criterio de análisis presupuestal. La nota final la decide el docente.</p>

    })() : ''}
    ${D.calificacionAA2 && !D.notasAA2 ? (() => {
      const p = Number(D.calificacionAA2.validacion);
      const NIV2 = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
      return `<div class="scorebox" id="nota-aa2">
        <div class="eyebrow">Calificación preliminar parcial · solo del formulario de validación</div>
        <div class="grade"><span class="big">${p}</span><span class="of">/ 4</span></div>

          <thead><tr><th>Criterio de la rúbrica AA2</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
          <tbody>
            <tr><td>Validación del modelo de negocio (cap. 5)</td><td><span class="lvl l${p}">${NIV2[p] ?? '—'}</span></td><td class="num">${p} / 4</td></tr>
            <tr><td>Planteamiento del MVP · Herramientas · Análisis presupuestal · Compromiso</td><td>Pendiente</td><td class="num">—</td></tr>
          </tbody>
        </table></div>
        <p class="summary">Esta nota evalúa solo el instrumento (el formulario), porque aún no hay resultados reales. Para subir de nivel: con muestra real y análisis de resultados (n y %) se llega a 3; con mejoras al MVP derivadas de esos datos, a 4. La calificación final de la AA2 la define el docente e incluye los demás criterios y la exposición.</p>
      </div>`;
    })() : ''}
    ${D.prototipoHtml ? `<div id="prototipo-aa2">
      <h3 style="margin:18px 0 8px">Prototipo navegable de la plataforma</h3>
      <p class="summary">Prototipo referencial elaborado a partir del MVP y de las imágenes de referencia de su informe, para visualizar cómo podría verse y usarse su plataforma. Los datos son ficticios; no es el producto final. Pruébenlo aquí o <a href="${esc(D.prototipoHtml)}" target="_blank" rel="noopener noreferrer">ábranlo en pantalla completa</a>.</p>
      <iframe src="${esc(D.prototipoHtml)}" title="Prototipo de la plataforma" loading="lazy" style="width:100%;height:680px;border:1px solid var(--rule);border-radius:10px;background:#fff"></iframe>
    </div>` : ''}
    ${D.costosAA2 ? (() => {
      const K = D.costosAA2, S = n => 'S/ ' + Number(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const f3 = arr => arr.map(v => `<td class="num">${S(v)}</td>`).join('');
      const sup = v => Number(v).toLocaleString('es-PE', { maximumFractionDigits: 2 });
      return `<div class="costos" id="costos-aa2">
        <h3 style="margin:18px 0 8px">Costos de nube y servicios digitales (estimación)</h3>
        <p class="summary">Estimación mensual con proveedores reales (Google Cloud / Firebase, OpenAI, WhatsApp) para tres escenarios de uso. Los volúmenes son supuestos elaborados a partir de su MVP: reemplácenlos con los datos de su prototipo. Tipo de cambio: S/ ${esc(K.tipo_cambio)} por USD. Los precios son cifras de referencia que deben confirmarse con la calculadora oficial de cada proveedor.</p>
        ${K.necesidades ? `<h4 style="margin:14px 0 6px">Qué necesita su proyecto, con proveedor y precio</h4>
        <p class="summary">${esc(K.necesidades.resumen)} Estado del precio: <b>Verificado</b> (fuente oficial, 11/11/2026), <b>Referencial</b> (confirmar en la lista oficial del proveedor) y <b>Cotizar</b> (pidan 2 o más cotizaciones y anéxenlas). Úsenla para armar su Excel.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Rubro</th><th>Qué necesitan (según su informe)</th><th>Proveedor · producto</th><th>Precio de referencia</th><th>Estado</th></tr></thead>
          <tbody>${K.necesidades.items.map(i => `<tr><td><b>${esc(i.rubro)}</b><br><span class="where">${esc(i.origen)}</span></td><td>${esc(i.necesidad)}</td><td>${esc(i.proveedor)}<br><span class="where">${esc(i.producto)}</span></td><td>${esc(i.precio)}${i.nota ? `<br><span class="where">${esc(i.nota)}</span>` : ''}</td><td><span class="lvl ${i.estado === 'Verificado' ? 'l4' : i.estado === 'Referencial' ? 'l2' : 'l1'}">${esc(i.estado)}</span></td></tr>`).join('')}</tbody>
        </table></div>` : ''}
        ${D.calculadoraXlsx ? `<p class="summary" style="margin-top:12px"><b>Calculadora de su proyecto:</b> <a href="${esc(D.calculadoraXlsx)}" download>descargar Excel</a>. Cambien la cantidad de usuarios en la columna «Calculadora (edite)» y verán el costo mensual de los servicios, el primer pago para construir la plataforma, el mantenimiento (bolsa de horas o un encargado fijo) y el costo del primer año.</p>` : ''}
        <div class="table-wrap"><table>
          <thead><tr><th>Supuesto de uso</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>${K.supuestos.map(r => `<tr><td>${esc(r.concepto)} <span class="where">${esc(r.unidad)}</span></td>${r.valores.map(v => `<td class="num">${sup(v)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Servicio (costo mensual)</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>

            <tr><td><b>Total mensual</b></td>${K.total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td>Primer pago (mes 1, con dominio anual)</td>${f3(K.primer_pago_pen)}</tr>
            <tr><td>Mantenimiento del desarrollador (horas al mes x S/ ${esc(K.tarifa_mantenimiento)} por hora)</td>${f3(K.mantenimiento_pen)}</tr>
            <tr><td><b>Total mensual con mantenimiento</b></td>${K.total_con_mant_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Desarrollo inicial de la plataforma (pago único al desarrollador, a S/ ${esc(K.tarifa_desarrollo)} por hora)</b></td><td class="num" colspan="${K.escenarios.length}"><b>${S(K.desarrollo_pen)}</b></td></tr>
            ${K.primer_pago_total_pen ? `<tr><td><b>Primer pago total: plataforma + primer mes de servicios</b></td>${K.primer_pago_total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Costo total del primer año (plataforma + 12 meses con mantenimiento)</b></td>${K.costo_anio1_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>` : ''}
            ${K.chat_pen ? `<tr><td>De ese total: chat interno y buzón de mensajes</td>${f3(K.chat_pen)}</tr>` : ''}
            <tr><td>${esc(K.ingreso_etiqueta)}</td>${f3(K.ingreso_pen)}</tr>
            <tr><td>Costo de nube / ingreso estimado</td>${K.pct_ingreso.map(v => `<td class="num">${(v * 100).toLocaleString('es-PE', { maximumFractionDigits: 1 })} %</td>`).join('')}</tr>
          </tbody>
        </table></div>
        <ul class="strength">${K.notas.map(n => `<li>${esc(n)}</li>`).join('')}<li>El desarrollo inicial y las horas de mantenimiento son referenciales: reemplácenlos con la cotización real de su desarrollador y verifiquen que el ingreso cubra el mantenimiento mensual.</li></ul>
      </div>`;
    })() : ''}
    ${D.excelPE ? (() => {
      const X = D.excelPE, NIV = pct => pct >= 85 ? 'Sobresaliente' : pct >= 70 ? 'Logrado' : pct >= 50 ? 'En proceso' : 'Inicio';
      const entrega = `<div class="scorebox" id="excel-pe">
        <div class="eyebrow">Evidencia 2 · Excel de costos y punto de equilibrio</div>
        <h3 style="margin:6px 0 8px">Cómo entregar el Excel</h3>
        <ol class="priorities">
          <li><span>Hagan el archivo en <b>.xlsx</b> (si lo trabajan en Google Sheets: Archivo → Descargar → Microsoft Excel).</span></li>
          <li><span>Súbanlo a <b>Google Drive</b> y compártanlo con «Cualquier persona con el enlace → Lector». Nombre: <b>AA2_Cap6_Excel_Punto de equilibrio_Grupo X</b>.</span></li>
          <li><span>Envíen <b>el enlace de Drive</b> al docente. Si no abre, se les pedirá el archivo.</span></li>
          <li><span>Anexen las cotizaciones (capturas o PDF) en una hoja «Cotizaciones» o en la misma carpeta de Drive.</span></li>
          <li><span>Si lo corrigen, suban la nueva versión con el mismo nombre y el mismo enlace.</span></li>
        </ol>`;
      if (X.estado !== 'calificado' || X.logro == null) {
        return entrega + `<p class="summary">Estado: <b>pendiente de entrega</b>. Cuando lo reciban, aquí aparecerá su porcentaje de logro (0 a 100 %) con la retroalimentación por criterio.</p></div>`;
      }
      const notaX = (Number(X.logro) * 0.2).toFixed(1).replace('.0', '');
      return entrega + `<div class="grade"><span class="big">${notaX} / 20</span><span class="of">nota del Excel · ${Number(X.logro)} % de logro · ${NIV(Number(X.logro))}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Criterio</th><th class="num">Puntaje</th><th>Retroalimentación</th></tr></thead>
          <tbody>${X.criterios.map(c => `<tr><td>${esc(c.nombre)}</td><td class="num">${Number(c.puntaje)} / ${Number(c.peso)}</td><td>${esc(c.comentario || '')}</td></tr>`).join('')}</tbody>
        </table></div>
        ${X.paridad?.length ? `<h4 style="margin:12px 0 6px">Comparación con el modelo del docente</h4><div class="table-wrap"><table>
          <thead><tr><th>Pieza del modelo</th><th>Hoja del grupo</th><th>Estado</th><th>Nota</th></tr></thead>
          <tbody>${X.paridad.map(p => `<tr><td>${esc(p.pieza)}</td><td>${esc(p.hoja || '—')}</td><td>${esc(p.estado || '')}</td><td>${esc(p.nota || '')}</td></tr>`).join('')}</tbody>
        </table></div>` : ''}
        ${X.fortalezas?.length ? `<h4 style="margin:12px 0 6px">Lo que está bien</h4><ul class="strength">${X.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        ${X.mejoras?.length ? `<h4 style="margin:12px 0 6px">Para mejorar</h4><ol class="priorities">${X.mejoras.map(m => `<li><span>${esc(m)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Indicador preliminar elaborado con la rúbrica del Excel de punto de equilibrio. La calificación final de la AA2 la define el docente.${X.revisado ? ' Revisión del ' + esc(X.revisado) + '.' : ''}</p></div>`;
    })() : ''}
    <div class="counts">
      <span class="pill critico">${countAA2('critico')} críticas</span>
      <span class="pill importante">${countAA2('importante')} importantes</span>
      <span class="pill sugerencia">${countAA2('sugerencia')} sugerencias</span>
    </div>
    ${fortAA2.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${fortAA2.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${priAA2.length ? `<div><h3 style="margin-bottom:8px">Prioridades para la Evidencia 2</h3><ol class="priorities">${priAA2.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol></div>` : ''}
  </section>`;
  D.secciones.forEach((s, si) => { if (isAA2(s)) renderSec(s, si); });
  html += '</div>';
}

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));
const tocAA2 = [['aa2', 'Resumen de la AA2', '']]
  .concat(D.notasAA2 ? [['nota-aa2', 'Calificación AA2 (/20)', '']] : D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.prototipoHtml ? [['prototipo-aa2', 'Prototipo', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.excelPE ? [['excel-pe', 'Excel de punto de equilibrio', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>
