<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-1", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "Stockly: plataforma web de gestión de inventarios con catálogo y pedidos por WhatsApp para bodegas de Arequipa", "grupo": "1", "seccion": "394 - 616 M", "fecha": "04/11/2026", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Solanch Coaquira Quispe", "Camila Mamani Nina", "Erick Acrota Huisa", "Jhon Hancco Yucra"], "dictamen": "menor", "resumen": "La tercera versión mejora de forma clara los puntos de fondo de la anterior. Se retomaron los ODS 8 (meta 8.3) y 12 (meta 12.3) con cita de Naciones Unidas (p. 4); se eliminó la frase “deberá justificarse mejor”; la megatendencia (acelerada innovación y desarrollo tecnológico) ahora se sustenta en CEPLAN (2025, pp. 5-6); se incorporaron cifras de bodegas atribuidas a la ABP (p. 7); PRODUCE (2025), Hidalgo Vergara y Xiao (2022), CEPLAN, la ONU y las páginas de Stoka, Stokr, Clarito y Bsale ya figuran en las referencias (pp. 42-43); el segmento de 2.5 y el mapa de empatía se centran en bodegas y minimarkets, y las tablas y figuras llevan numeración y título. Persisten, sin embargo: las cifras de la ABP no tienen respaldo verificable (se citan como 2024 y la referencia es la página de inicio, sin fecha); el índice y los títulos no se actualizaron (el índice aún dice “ODS 3” y “Sostenibilidad y ecología”); el BMC (p. 27 y lienzo) sigue incluyendo farmacias, librerías y ferreterías; el diferencial frente a Clarito Pro no se demuestra y la tabla comparativa no incluye a Bsale ni a Stockly; subsisten restos de otro modelo de negocio (“visitas válidas”, “tráfico no válido”) y la nota “Falta estimar un precio…” (pp. 12, 15, 30); el MRR usa S/ 85 frente a S/ 74,90, y las citas de las fuentes de los competidores no aparecen en el texto.", "fortalezas": ["Se corrigió el vínculo con los ODS: ahora se declaran el ODS 8 (meta 8.3) y el ODS 12 (meta 12.3), con explicación de por qué se relacionan con Stockly y cita de Naciones Unidas (p. 4). Se eliminó la frase de revisión “deberá justificarse mejor”.", "La megatendencia ya tiene fuente oficial: CEPLAN (2025) respalda “acelerada innovación y desarrollo tecnológico”, y la sección 1.2.1 explica cómo se relaciona con Stockly (pp. 5-6). La línea de investigación de CERTUS también se nombra (p. 6).", "El capítulo 1 incorpora cifras de bodegas en el Perú y en Arequipa (más de 500 000 y unas 14 500 en la provincia, p. 7), además de las cifras de PRODUCE (2025), y ahora las referencias incluyen PRODUCE, Hidalgo Vergara y Xiao, CEPLAN, Naciones Unidas y los cuatro competidores (pp. 42-43).", "El segmento de 2.5 y el mapa de empatía (pp. 24-26) se centran en bodegas y minimarkets de Arequipa, con distritos prioritarios; el mapa ya no menciona tiendas de ropa. El BMC conserva el lienzo numerado como Figura N° 2 (p. 33) y las tablas llevan número y título (Tablas 2 a 5).", "El análisis de competidores es honesto: reconoce que Clarito Pro (S/ 59) ya ofrece catálogo compartible por WhatsApp (pp. 35-37), y los indicadores de gestión (3.4, pp. 38-40) incluyen fórmula, meta, ejemplo, CAC y MRR."], "prioridades": ["Respaldar las cifras de la ABP (más de 500 000 bodegas, 14 500 en Arequipa, 78 % con cuaderno, pérdidas de 5 % a 8 %, p. 7): citar el documento o nota concreta con su año (el texto dice 2024 y la referencia es la página de inicio sin fecha) o reemplazarlas por datos de INEI, PRODUCE u otro estudio verificable.", "Demostrar el diferencial: Clarito Pro ya ofrece catálogo y pedidos por WhatsApp (tabla, p. 36). Indicar qué hace Stockly que ellos no hacen, agregar a Stockly y a Bsale a la tabla comparativa y citar en el texto las fuentes de los competidores.", "Unificar el segmento en el BMC (p. 27 y lienzo, p. 33): bodegas y minimarkets como segmento inicial, y farmacias, librerías y ferreterías solo como expansión futura. Unificar también la cifra referencial del precio (S/ 74,90 y S/ 85 en el MRR, p. 40).", "Retirar los restos de otro modelo de negocio (“visitas válidas”, p. 30; “Medición de visitas… tráfico no válido”, p. 15) y la nota “Falta estimar un precio…” (p. 12), y explicar la función de IA de boletas en 2.2.3 o retirarla.", "Corregir la coherencia del documento: actualizar el índice (aún dice ODS 3 y “Sostenibilidad y ecología”), ordenar las referencias alfabéticamente (sección “Referencias”), corregir la cita de la ONU (“s. f. 2026”) y cerrar el BMC con un párrafo de coherencia entre los 9 bloques."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, analizadas críticamente y vinculadas con megatendencias y ODS.", "falta": "Dar respaldo verificable a las cifras de la ABP (año y documento, no la página de inicio); citar la meta del ODS 12 en las referencias y corregir el formato “(Naciones Unidas, s. f. 2026)”; citar en el texto las fuentes de los competidores; ordenar alfabéticamente la lista APA 7."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cualitativa y cuantitativa, con vínculo explícito a megatendencias, ODS y necesidades del cliente.", "falta": "Ya hay vínculo con ODS 8 y 12 y megatendencia sustentada. Para llegar al nivel superior falta una cifra verificable del sector bodeguero de Arequipa (la de la ABP no tiene respaldo) y actualizar el índice y los títulos para que coincidan con el cuerpo del capítulo."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Demostrar con funciones concretas qué ofrece Stockly que Clarito Pro (catálogo y pedidos por WhatsApp) no ofrece; mantener el mismo segmento en 2.5 y en el BMC; explicar la IA de boletas en la ficha técnica; unificar la cifra referencial del precio."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumentan la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "Retirar los restos de otro modelo (visitas válidas, tráfico no válido); alinear el segmento del BMC con el de 2.5; completar la tabla de competidores con Stockly y Bsale; cerrar con un párrafo que explique cómo se conectan los 9 bloques y explicar los elementos del lienzo que no aparecen en el texto."}], "viabilidad": {"resumen": "Stockly responde a un dolor real de las bodegas y el informe ya identifica a sus competidores. El reto central sigue siendo el diferencial: Clarito Pro ya ofrece catálogo por WhatsApp y Stoka y Stokr ya ofrecen control de inventario, por lo que Stockly debe mostrar con claridad qué aporta que ellos no.", "riesgos": [{"tema": "Competencia", "titulo": "Competidores directos más baratos y con funciones similares", "choque": "Clarito Pro ya incluye catálogo compartible por WhatsApp y pedidos mediante su catálogo (pp. 35-36), y Stoka y Stokr ofrecen control de inventario y alertas. Los elementos de diferenciación de 3.3.5 (catálogo vinculado al inventario, pedidos por WhatsApp, asesoría del primer mes) no se contrastan con lo que ya hacen. La tabla comparativa (pp. 35-36) no incluye a Bsale ni a Stockly. Tampoco se analizan las alternativas gratuitas (WhatsApp Business, cuaderno, Excel).", "ideas": ["Agregar a la tabla comparativa una fila con Stockly y una columna de Bsale, y marcar con claridad dónde Stockly es mejor (por ejemplo, el vínculo catálogo-stock-pedido, la asesoría del primer mes o la función de IA con boletas).", "Probar durante una semana el plan Pro de Clarito y el catálogo gratuito de WhatsApp Business para identificar qué le falta a cada uno."]}, {"tema": "Adopción", "titulo": "El bodeguero no registra cada venta", "choque": "El texto reconoce que la actualización del stock depende de que “las operaciones se ingresen correctamente” (p. 11). Si no se registran las ventas, las alertas y el catálogo pierden confiabilidad. La IA para leer boletas figura en la tabla de la p. 10 y en la de costos (p. 13), pero no se explica en 2.2.3.", "ideas": ["Medir en una bodega piloto cuánto tiempo toma registrar las ventas de un día y cuántas quedan sin registrar.", "Describir en 2.2.3 cómo funciona la IA de boletas, o retirarla del texto y de la tabla de costos."]}, {"tema": "Regulación", "titulo": "Datos personales y comprobantes", "choque": "El catálogo con pedidos almacena nombres y teléfonos de consumidores, por lo que se aplica la Ley 29733 de Protección de Datos Personales. Además, Bsale ofrece emisión de comprobantes SUNAT, algo que Stockly no incluye y que algunas bodegas formales necesitan.", "ideas": ["Averiguar en la Autoridad Nacional de Protección de Datos Personales las obligaciones de una plataforma que almacena datos de terceros.", "Decidir si Stockly se posicionará como complemento de un facturador existente o integrará la emisión de comprobantes."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "completo", "nota": "Completa: sección, docente, integrantes con carrera y grupo. El título dice “Control de inventarios para pequeños negocios” sin el nombre comercial Stockly; el nombre de archivo debería seguir el formato indicado."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Existe, pero está desactualizado: aún dice “1.1.1 ODS 3” (el cuerpo trata el ODS 8) y “1.2.1 Sostenibilidad y ecología” (el cuerpo dice “Acelerada innovación y desarrollo económico”). Las páginas no coinciden (3.3 figura en la p. 31 y aparece en la p. 34; Bibliografía figura en la p. 37 y está en la p. 42)."}, {"codigo": "1.1", "apartado": "ODS (problema social)", "estado": "completo", "nota": "Mejoró: ODS 8 (meta 8.3) y ODS 12 (meta 12.3), con explicación del vínculo y cita de la ONU (p. 4). Falta citar la fuente del ODS 12 en las referencias y corregir “(Naciones Unidas, s. f. 2026)”; la meta 12.3 se enfoca en alimentos."}, {"codigo": "1.2", "apartado": "Megatendencias", "estado": "completo", "nota": "Mejoró: acelerada innovación y desarrollo tecnológico, con fuente CEPLAN (2025) y vínculo con Stockly (pp. 5-6). El título del índice no coincide."}, {"codigo": "1.3", "apartado": "Línea de investigación", "estado": "completo", "nota": "Mejoró: indica la línea de CERTUS “Gestión Comercial y Competitividad de las MYPEs” (p. 6). El subtítulo 1.3.1 “Tradicional” no corresponde a la línea; describe los métodos manuales de las bodegas."}, {"codigo": "1.4", "apartado": "Definición del problema (causas y consecuencias)", "estado": "incompleto", "nota": "Mejoró: cifras de bodegas (ABP), PRODUCE, causas y consecuencias (pp. 7-8). Las cifras de la ABP no tienen respaldo verificable (año 2024 en el texto; referencia sin fecha y de la página de inicio). Siguen frases en primera persona."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Completa. La frase “cuya utilidad y aceptación deberán contrastarse…” (pp. 8-9) parece una nota pendiente."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Los 8 campos están completos. La tabla de funcionalidades (p. 10) no tiene título y la nota “Falta estimar un precio…” sigue en la tabla de costos (p. 12). La IA de boletas no se explica en 2.2.3."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": ""}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": ""}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Mejoró: se centra en bodegas y minimarkets de Arequipa, con distritos prioritarios y precio S/ 74,90. Queda por alinear el segmento del BMC."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Dos casos (bodeguero y consumidora), el segundo con flujo paso a paso."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Mejoró: está centrado en el bodeguero y ya no menciona tiendas de ropa (pp. 24-26). Los enunciados siguen siendo bastante generales, no se presenta como figura y el párrafo introductorio se repite."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "incompleto", "nota": "Los 9 bloques están desarrollados y el lienzo es la Figura N° 2 (p. 33). El bloque de segmento (p. 27 y lienzo) incluye farmacias, librerías y ferreterías; hay restos de otro modelo (“visitas válidas”, p. 30); el lienzo menciona pasarelas de pago, alianzas financieras y logística que el texto no explica; falta el párrafo de coherencia entre bloques."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "incompleto", "nota": "Cuatro competidores con tabla comparativa (Tabla N° 4). La tabla omite a Bsale y a Stockly; se lee “Stocka” (p. 36); las fuentes figuran en las referencias pero no se citan en el texto; el diferencial frente a Clarito Pro no está demostrado (3.3.4 y 3.3.5)."}, {"codigo": "3.4", "apartado": "Indicadores de gestión", "estado": "completo", "nota": "Ocho indicadores con fórmula, meta y ejemplo (Tabla N° 5). El MRR usa S/ 85, no S/ 74,90."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Mejoró: ya figuran PRODUCE, Hidalgo Vergara y Xiao, CEPLAN, ONU y los cuatro competidores. Faltan orden alfabético, el título “Referencias”, la ABP con año y documento, y la cita en el texto de las páginas de competidores."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "El capítulo mejoró de forma importante: ODS 8 y 12 con meta y fuente, megatendencia sustentada en CEPLAN, línea de investigación nombrada y cifras de bodegas. Quedan por resolver el respaldo de las cifras de la ABP, la coherencia del índice con el cuerpo y detalles de citación y redacción.", "observaciones": [{"severidad": "importante", "titulo": "Las cifras de la ABP no tienen respaldo verificable", "ubicacion": "1.4, p. 7; referencias, p. 42", "cita": "de acuerdo con la Asociación de Bodegueros del Perú (ABP, 2024), en el país existen más de 500,000 bodegas, de las cuales aproximadamente 14,500 se concentran en la provincia de Arequipa", "problema": "Mejoró: ahora hay cifras de bodegas y la ABP figura en las referencias. Pero el texto cita “ABP, 2024” y la referencia es “(s. f.)” y apunta a la página de inicio de la asociación, no a un documento. De esa fuente dependen las cifras más importantes del problema (500 000 bodegas, 14 500 en Arequipa, 78 % con cuaderno, pérdidas de 5 % a 8 % de los ingresos). Al no poder verificarse, el sustento cuantitativo del problema queda débil.", "mejora": "Citar el documento, nota o estudio concreto del que salen las cifras, con año y enlace, o reemplazarlas por datos verificables (INEI, PRODUCE, Ipsos, Kantar u otro). Las cifras de PRODUCE (2025) sí están correctamente citadas."}, {"severidad": "importante", "titulo": "El índice y los títulos no coinciden con el cuerpo del capítulo", "ubicacion": "Índice, p. 2; 1.1.1, p. 4; 1.2.1, p. 5", "cita": "1.1.1. ODS 3: Salud y bienestar / 1.2.1. Sostenibilidad y ecología", "problema": "El cuerpo del capítulo trata el ODS 8 (1.1.1) y la megatendencia “Acelerada innovación y desarrollo económico” (1.2.1), pero el índice conserva los títulos de la versión anterior (ODS 3 y sostenibilidad). El lector no sabe cuáles son los ODS y la megatendencia declarados. Además, el título 1.2.1 habla de “desarrollo económico” y el texto de “desarrollo tecnológico”.", "mejora": "Actualizar el índice con la herramienta automática y unificar el nombre de la megatendencia entre el índice, el título y el texto (por ejemplo, el nombre exacto de la lista de CEPLAN)."}, {"severidad": "sugerencia", "titulo": "Cita de la ONU con formato incorrecto y sin referencia para el ODS 12", "ubicacion": "1.1.1 y 1.1.2, p. 4; referencias, p. 43", "cita": "(Naciones Unidas, s. f. 2026)", "problema": "El formato correcto es (Naciones Unidas, s. f.) o (Naciones Unidas, 2026) según la fecha de la página. En las referencias solo aparece la entrada del ODS 8; la meta 12.3 se cita sin su fuente. Además, la meta 12.3 se refiere a pérdidas y desperdicio de alimentos, y el texto aclara que se aplica a bodegas que comercializan alimentos y bebidas, lo que conviene mantener frente al segmento.", "mejora": "Agregar la referencia del ODS 12 (o de la página de metas) y corregir el formato de la cita en ambos apartados."}, {"severidad": "sugerencia", "titulo": "Lenguaje en primera persona, repeticiones y subtítulo de la línea de investigación", "ubicacion": "1.1.1, p. 4; 1.3.1, p. 6; 1.4, pp. 7-8", "cita": "bajo este contexto nuestra plataforma Stockly busca facilitar…", "problema": "Persisten “nuestra plataforma” (p. 4), “nuestro público objetivo” (p. 27) y “El nombre elegido para nuestra plataforma” (p. 9). Dini et al. (2021) y Puican Rodríguez et al. (2025) se explican más de una vez (pp. 5, 7 y 8). El subtítulo 1.3.1 “Tradicional” no corresponde a la línea de investigación, sino a los métodos manuales de las bodegas.", "mejora": "Redactar en forma impersonal (“la plataforma Stockly busca…”), condensar las ideas repetidas y retitular 1.3.1 con un nombre que refleje su contenido."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "La propuesta está completa y el segmento de 2.5 mejoró al centrarse en bodegas y minimarkets. Quedan por unificar el segmento del BMC, la cifra referencial del precio y la explicación de la IA de boletas.", "observaciones": [{"severidad": "importante", "titulo": "El segmento del BMC no coincide con el de 2.5", "ubicacion": "3.2 a), p. 27; lienzo, p. 33", "cita": "Dentro de este segmento se consideran bodegas, tiendas de abarrotes, minimarkets, farmacias independientes, librerías, ferreterías y pequeños almacenes", "problema": "Mejoró: 2.5 y el mapa de empatía se centran en bodegas y minimarkets. Pero el bloque de segmento del BMC (texto y lienzo) mantiene farmacias, librerías y ferreterías, rubros con necesidades distintas (vencimientos, códigos, tallas). El mercado inicial se describe como “Perú, con especial atención a la Macro Región Sur”, mientras que 2.5 delimita Arequipa y sus distritos.", "mejora": "Definir bodegas y minimarkets de Arequipa como segmento inicial en todo el documento y mencionar los demás rubros como expansión futura."}, {"severidad": "sugerencia", "titulo": "La cifra referencial del precio difiere en el indicador MRR", "ubicacion": "3.4, p. 40", "cita": "20 clientes × S/ 85 = S/ 1,700", "problema": "Mejoró: el precio de S/ 74,90 ya aparece de forma coherente en 2.2.4, 2.5.4, 3.3.5 y el resto del texto. Solo el indicador MRR sigue usando S/ 85, de modo que la meta de S/ 1 700 no corresponde a la tarifa propuesta.", "mejora": "Recalcular el MRR con el precio referencial (por ejemplo, 20 × 74,90 = S/ 1 498) o aclarar el supuesto. El sustento de costos y precio se trabaja en el cap. 6 (AA2)."}, {"severidad": "sugerencia", "titulo": "La IA para registrar boletas no está explicada en la ficha técnica", "ubicacion": "2.2.2, p. 10; 2.2.4, p. 12; tabla de costos, p. 13", "cita": "Usar la IA para guardar la informacion de las boletas de venta al momento de hacer el registro en caja", "problema": "La función de IA aparece como última fila de la tabla de especificaciones (con errores de redacción), como “módulo de inteligencia artificial” en 2.2.4 y como costo mensual de S/ 117,69, pero no figura entre las funcionalidades a) a h) de 2.2.3 ni en los casos de uso.", "mejora": "Decidir si forma parte de la primera versión: si es así, describirla en 2.2.3 y en un caso de uso; si no, retirarla del texto y de la tabla de costos."}, {"severidad": "sugerencia", "titulo": "La disposición de pago se presenta como hecho", "ubicacion": "3.3.5, p. 38", "cita": "de acuerdo con el público objetivo y la disposición de pago identificada en el proyecto", "problema": "El informe no presenta datos de una validación; para la AA1 las hipótesis son aceptables si se rotulan como tales.", "mejora": "Redactarla como hipótesis de trabajo. La validación real de precio y disposición de pago se exigirá en el cap. 5 (AA2)."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El BMC tiene los 9 bloques con lienzo numerado y el mapa de empatía se centra en el bodeguero. Persisten el diferencial no demostrado frente a Clarito Pro y los restos de otro modelo de negocio.", "observaciones": [{"severidad": "importante", "titulo": "El diferencial frente a Clarito Pro y Stoka sigue sin demostrarse", "ubicacion": "3.3.2 a 3.3.5, pp. 35-38", "cita": "Clarito: Pedidos por WhatsApp: Disponible mediante su catálogo online", "problema": "La propia tabla (p. 36) muestra que Clarito Pro ya ofrece catálogo y pedidos por WhatsApp, pero 3.3.5 presenta esos mismos elementos como diferenciadores (“Catálogo web vinculado al inventario”, “Pedidos mediante WhatsApp”). 3.3.4 plantea la ventaja de forma general (“busca centralizar”) y no indica qué función concreta no tienen los demás ni por qué sería difícil de copiar. La tabla no incluye a Bsale ni a Stockly, por lo que no se puede ver la comparación.", "mejora": "Precisar el diferencial con funciones concretas (por ejemplo, si el pedido descuenta stock, la IA de boletas o el acompañamiento del primer mes) y agregar a Stockly y Bsale como columnas de la tabla."}, {"severidad": "importante", "titulo": "Persisten restos de otro modelo de negocio y notas pendientes", "ubicacion": "3.2 g), p. 30; tabla de costos, p. 15; 2.2.4, p. 12", "cita": "verificando el número de visitas válidas o el nivel de utilización de cada cuenta", "problema": "La actividad “Gestión del uso y facturación” (p. 30) y la fila “Medición de visitas: registro de aperturas del catálogo y mecanismos para identificar tráfico no válido” (p. 15, continuación de la Tabla N° 3) corresponden a un modelo de cobro por visitas, no a la suscripción mensual de Stockly. En la Tabla N° 2 (p. 12) sigue la nota “Falta estimar un precio en base a nuestro programa”.", "mejora": "Reemplazar por actividades propias de una suscripción (cobro mensual, renovación, control de pagos), quitar la fila “Medición de visitas” y eliminar la nota pendiente."}, {"severidad": "sugerencia", "titulo": "Mapa de empatía centrado en el bodeguero, pero aún general", "ubicacion": "3.1, pp. 24-26", "cita": "Le preocupa mantener la estabilidad económica de su negocio y obtener ganancias.", "problema": "Mejoró: ya se centra en propietarios de bodegas de Arequipa y no menciona tiendas de ropa. Algunos enunciados siguen siendo válidos para cualquier comerciante, no se presenta como figura y el párrafo introductorio se repite (pp. 24-25).", "mejora": "Presentarlo como figura numerada con los 6 cuadrantes y agregar rasgos propios del bodeguero (por ejemplo, el cuaderno, el fiado o el uso de billeteras digitales), formulados como hipótesis."}, {"severidad": "sugerencia", "titulo": "BMC sin párrafo de coherencia y elementos del lienzo no explicados", "ubicacion": "3.2, pp. 27-34", "cita": "Alianzas con entidades financieras (para futuros pagos y promociones)", "problema": "Mejoró: el BMC tiene sus 9 bloques y el lienzo es la Figura N° 2 (p. 33). Falta el párrafo que explique la coherencia entre los bloques y la propuesta de valor. El lienzo incluye alianzas financieras, pasarelas de pago y empresas de logística que no se explican en el texto, y la fuente de la figura aparece en la página siguiente (p. 34).", "mejora": "Cerrar 3.2 con un párrafo de coherencia, revisar que el lienzo y el texto digan lo mismo y mantener título, figura y fuente en la misma página."}, {"severidad": "sugerencia", "titulo": "Tabla comparativa con celdas vacías y fuentes no citadas en el texto", "ubicacion": "3.3.1 a 3.3.3, pp. 34-37", "cita": "a) Stocka", "problema": "Las páginas de Stoka, Stokr, Clarito y Bsale ya figuran en las referencias (mejora), pero no se citan en el texto (por ejemplo, “(Stoka, s. f.)”) ni en la Tabla N° 4. Varias celdas dicen “No especificado en la información recopilada”, se lee “(super básico)” y el nombre aparece como “Stocka” (p. 36).", "mejora": "Citar cada competidor en el texto y en la tabla, completar las celdas con información de cada web oficial (con fecha de consulta) y corregir el nombre."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "El formato mejoró: las tablas y figuras están numeradas con título y fuente, y las referencias incluyen las fuentes que faltaban. Quedan por ordenar las referencias, actualizar el índice y hacer una última revisión de redacción.", "observaciones": [{"severidad": "sugerencia", "titulo": "Referencias: completas en su mayoría, pero sin orden ni título APA 7", "ubicacion": "Referencias, pp. 42-43", "cita": "Fuentes Bibliográficas", "problema": "Mejoró: ya figuran PRODUCE (2025), Hidalgo Vergara y Xiao (2022), CEPLAN (2025), Naciones Unidas y los cuatro competidores. La lista no está en orden alfabético (Hidalgo, ABP, CEPLAN, Naciones Unidas y PRODUCE aparecen después de Vega Alomía) y se titula “Fuentes Bibliográficas” en lugar de “Referencias”. La entrada de Bsale remite a un artículo de ayuda sobre control de stock, mientras que el texto cita sus planes y precios.", "mejora": "Ordenar alfabéticamente, titular la sección “Referencias”, verificar que cada cita del texto esté en la lista y viceversa, y citar la página de precios de Bsale."}, {"severidad": "sugerencia", "titulo": "Numeración de tablas y figuras no uniforme", "ubicacion": "pp. 10-11, 15, 33-34", "cita": "Cuadro N° 1", "problema": "Mejoró: hay Tablas N° 2 a 5 y Figuras N° 1 y 2 con título y fuente. La primera se rotula “Cuadro N° 1” y la tabla de funcionalidades (p. 10) no tiene número ni título. La Tabla N° 3 se corta en dos páginas y la fuente de la Figura N° 2 queda en otra página.", "mejora": "Usar “Tabla N°” en todas, numerar y titular la tabla de funcionalidades y mantener cada tabla o figura con su título y fuente en la misma página."}, {"severidad": "sugerencia", "titulo": "Índice desfasado y errores de redacción", "ubicacion": "Índice (pp. 2-3); pp. 8-9, 11, 36", "cita": "e) e) Catálogo web interactivo", "problema": "Los números de página del índice no coinciden con el documento (3.3 figura en la p. 31 y aparece en la p. 34; Bibliografía figura en la p. 37 y está en la p. 42). Persisten “e) e)” (p. 11) y “Stocka” (p. 36), además de la frase “cuya utilidad y aceptación deberán contrastarse con las alternativas existentes…” (pp. 8-9), que parece una nota pendiente.", "mejora": "Actualizar el índice automático al final y hacer una última lectura ortográfica y de estilo impersonal."}]}], "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 3, "responsabilidad": 3}}</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const all = D.secciones.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${D.fortalezas?.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${D.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>
    <div class="grade"><span class="big">${total}</span><span class="of">/ 20</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${D.prioridades.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

D.secciones.forEach((s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
  </section>`;
});

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const toc = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => ['s' + i, s.titulo, s.observaciones.length]));
document.getElementById('toc').innerHTML = toc.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
