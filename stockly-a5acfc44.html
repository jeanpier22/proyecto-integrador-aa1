<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab.on { color: var(--ink); background: var(--sheet); border-color: var(--rule); border-bottom: 1px solid var(--sheet); box-shadow: inset 0 3px 0 var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabpane { display: grid; gap: 40px; }
.scorebox { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tabpane[hidden] { display: none; }
section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.aa2 { padding: 18px 18px 18px 20px; border-left: 4px solid var(--accent); background: var(--sheet); border-radius: 8px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-1", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "Stockly: plataforma web de gestión de inventarios con catálogo y pedidos por WhatsApp para bodegas de Arequipa", "grupo": "1", "seccion": "394 - 616 M", "fecha": "04/11/2026 · formulario AA2 revisado el 06/11/2026", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Solanch Coaquira Quispe", "Camila Mamani Nina", "Erick Acrota Huisa", "Jhon Hancco Yucra"], "dictamen": "menor", "resumen": "La tercera versión mejora de forma clara los puntos de fondo de la anterior. Se retomaron los ODS 8 (meta 8.3) y 12 (meta 12.3) con cita de Naciones Unidas (p. 4); se eliminó la frase “deberá justificarse mejor”; la megatendencia (acelerada innovación y desarrollo tecnológico) ahora se sustenta en CEPLAN (2025, pp. 5-6); se incorporaron cifras de bodegas atribuidas a la ABP (p. 7); PRODUCE (2025), Hidalgo Vergara y Xiao (2022), CEPLAN, la ONU y las páginas de Stoka, Stokr, Clarito y Bsale ya figuran en las referencias (pp. 42-43); el segmento de 2.5 y el mapa de empatía se centran en bodegas y minimarkets, y las tablas y figuras llevan numeración y título. Persisten, sin embargo: las cifras de la ABP no tienen respaldo verificable (se citan como 2024 y la referencia es la página de inicio, sin fecha); el índice y los títulos no se actualizaron (el índice aún dice “ODS 3” y “Sostenibilidad y ecología”); el BMC (p. 27 y lienzo) sigue incluyendo farmacias, librerías y ferreterías; el diferencial frente a Clarito Pro no se demuestra y la tabla comparativa no incluye a Bsale ni a Stockly; subsisten restos de otro modelo de negocio (“visitas válidas”, “tráfico no válido”) y la nota “Falta estimar un precio…” (pp. 12, 15, 30); el MRR usa S/ 85 frente a S/ 74,90, y las citas de las fuentes de los competidores no aparecen en el texto.", "fortalezas": ["Se corrigió el vínculo con los ODS: ahora se declaran el ODS 8 (meta 8.3) y el ODS 12 (meta 12.3), con explicación de por qué se relacionan con Stockly y cita de Naciones Unidas (p. 4). Se eliminó la frase de revisión “deberá justificarse mejor”.", "La megatendencia ya tiene fuente oficial: CEPLAN (2025) respalda “acelerada innovación y desarrollo tecnológico”, y la sección 1.2.1 explica cómo se relaciona con Stockly (pp. 5-6). La línea de investigación de CERTUS también se nombra (p. 6).", "El capítulo 1 incorpora cifras de bodegas en el Perú y en Arequipa (más de 500 000 y unas 14 500 en la provincia, p. 7), además de las cifras de PRODUCE (2025), y ahora las referencias incluyen PRODUCE, Hidalgo Vergara y Xiao, CEPLAN, Naciones Unidas y los cuatro competidores (pp. 42-43).", "El segmento de 2.5 y el mapa de empatía (pp. 24-26) se centran en bodegas y minimarkets de Arequipa, con distritos prioritarios; el mapa ya no menciona tiendas de ropa. El BMC conserva el lienzo numerado como Figura N° 2 (p. 33) y las tablas llevan número y título (Tablas 2 a 5).", "El análisis de competidores es honesto: reconoce que Clarito Pro (S/ 59) ya ofrece catálogo compartible por WhatsApp (pp. 35-37), y los indicadores de gestión (3.4, pp. 38-40) incluyen fórmula, meta, ejemplo, CAC y MRR.", "AA2: Secuencia lógica en cinco secciones y funciones de P9 y P12 alineadas con las del MVP del informe (control de entradas y salidas, alertas, reportes, catálogo, pedidos, IA de boletas).", "AA2: P14 prueba directamente el precio del informe (S/ 74,90 mensuales) con opciones graduadas («Lo consideraría…», «Me parece un precio elevado»).", "AA2: P5 y P10 indagan dificultades reales de control y barreras de adopción (costo, tiempo, conexión), útiles para decidir mejoras al MVP.", "AA2: El cap. 4 pasó de índice a texto desarrollado (4.1 a 4.6): objetivo general y cinco específicos, cinco funcionalidades, plataforma web por navegador y dos tipos de usuario (propietario y S/ 1 498, 11,9 % menos); usar S/ 74,90 y reponer el CAC con el gasto real de captación."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, analizadas críticamente y vinculadas con megatendencias y ODS.", "falta": "Dar respaldo verificable a las cifras de la ABP (año y documento, no la página de inicio); citar la meta del ODS 12 en las referencias y corregir el formato “(Naciones Unidas, s. f. 2026)”; citar en el texto las fuentes de los competidores; ordenar alfabéticamente la lista APA 7."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cualitativa y cuantitativa, con vínculo explícito a megatendencias, ODS y necesidades del cliente.", "falta": "Ya hay vínculo con ODS 8 y 12 y megatendencia sustentada. Para llegar al nivel superior falta una cifra verificable del sector bodeguero de Arequipa (la de la ABP no tiene respaldo) y actualizar el índice y los títulos para que coincidan con el cuerpo del capítulo."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Demostrar con funciones concretas qué ofrece Stockly que Clarito Pro (catálogo y pedidos por WhatsApp) no ofrece; mantener el mismo segmento en 2.5 y en el BMC; explicar la IA de boletas en la ficha técnica; unificar la cifra referencial del precio."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumentan la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "Retirar los restos de otro modelo (visitas válidas, tráfico no válido); alinear el segmento del BMC con el de 2.5; completar la tabla de competidores con Stockly y Bsale; cerrar con un párrafo que explique cómo se conectan los 9 bloques y explicar los elementos del lienzo que no aparecen en el texto."}], "viabilidad": {"resumen": "Stockly responde a un dolor real de las bodegas y el informe ya identifica a sus competidores. El reto central sigue siendo el diferencial: Clarito Pro ya ofrece catálogo por WhatsApp y Stoka y Stokr ya ofrecen control de inventario, por lo que Stockly debe mostrar con claridad qué aporta que ellos no.", "riesgos": [{"tema": "Competencia", "titulo": "Competidores directos más baratos y con funciones similares", "choque": "Clarito Pro ya incluye catálogo compartible por WhatsApp y pedidos mediante su catálogo (pp. 35-36), y Stoka y Stokr ofrecen control de inventario y alertas. Los elementos de diferenciación de 3.3.5 (catálogo vinculado al inventario, pedidos por WhatsApp, asesoría del primer mes) no se contrastan con lo que ya hacen. La tabla comparativa (pp. 35-36) no incluye a Bsale ni a Stockly. Tampoco se analizan las alternativas gratuitas (WhatsApp Business, cuaderno, Excel).", "ideas": ["Agregar a la tabla comparativa una fila con Stockly y una columna de Bsale, y marcar con claridad dónde Stockly es mejor (por ejemplo, el vínculo catálogo-stock-pedido, la asesoría del primer mes o la función de IA con boletas).", "Probar durante una semana el plan Pro de Clarito y el catálogo gratuito de WhatsApp Business para identificar qué le falta a cada uno."]}, {"tema": "Adopción", "titulo": "El bodeguero no registra cada venta", "choque": "El texto reconoce que la actualización del stock depende de que “las operaciones se ingresen correctamente” (p. 11). Si no se registran las ventas, las alertas y el catálogo pierden confiabilidad. La IA para leer boletas figura en la tabla de la p. 10 y en la de costos (p. 13), pero no se explica en 2.2.3.", "ideas": ["Medir en una bodega piloto cuánto tiempo toma registrar las ventas de un día y cuántas quedan sin registrar.", "Describir en 2.2.3 cómo funciona la IA de boletas, o retirarla del texto y de la tabla de costos."]}, {"tema": "Regulación", "titulo": "Datos personales y comprobantes", "choque": "El catálogo con pedidos almacena nombres y teléfonos de consumidores, por lo que se aplica la Ley 29733 de Protección de Datos Personales. Además, Bsale ofrece emisión de comprobantes SUNAT, algo que Stockly no incluye y que algunas bodegas formales necesitan.", "ideas": ["Averiguar en la Autoridad Nacional de Protección de Datos Personales las obligaciones de una plataforma que almacena datos de terceros.", "Decidir si Stockly se posicionará como complemento de un facturador existente o integrará la emisión de comprobantes."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "completo", "nota": "Completa: sección, docente, integrantes con carrera y grupo. El título dice “Control de inventarios para pequeños negocios” sin el nombre comercial Stockly; el nombre de archivo debería seguir el formato indicado."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Existe, pero está desactualizado: aún dice “1.1.1 ODS 3” (el cuerpo trata el ODS 8) y “1.2.1 Sostenibilidad y ecología” (el cuerpo dice “Acelerada innovación y desarrollo económico”). Las páginas no coinciden (3.3 figura en la p. 31 y aparece en la p. 34; Bibliografía figura en la p. 37 y está en la p. 42)."}, {"codigo": "1.1", "apartado": "ODS (problema social)", "estado": "completo", "nota": "Mejoró: ODS 8 (meta 8.3) y ODS 12 (meta 12.3), con explicación del vínculo y cita de la ONU (p. 4). Falta citar la fuente del ODS 12 en las referencias y corregir “(Naciones Unidas, s. f. 2026)”; la meta 12.3 se enfoca en alimentos."}, {"codigo": "1.2", "apartado": "Megatendencias", "estado": "completo", "nota": "Mejoró: acelerada innovación y desarrollo tecnológico, con fuente CEPLAN (2025) y vínculo con Stockly (pp. 5-6). El título del índice no coincide."}, {"codigo": "1.3", "apartado": "Línea de investigación", "estado": "completo", "nota": "Mejoró: indica la línea de CERTUS “Gestión Comercial y Competitividad de las MYPEs” (p. 6). El subtítulo 1.3.1 “Tradicional” no corresponde a la línea; describe los métodos manuales de las bodegas."}, {"codigo": "1.4", "apartado": "Definición del problema (causas y consecuencias)", "estado": "incompleto", "nota": "Mejoró: cifras de bodegas (ABP), PRODUCE, causas y consecuencias (pp. 7-8). Las cifras de la ABP no tienen respaldo verificable (año 2024 en el texto; referencia sin fecha y de la página de inicio). Siguen frases en primera persona."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": "Completa. La frase “cuya utilidad y aceptación deberán contrastarse…” (pp. 8-9) parece una nota pendiente."}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Los 8 campos están completos. La tabla de funcionalidades (p. 10) no tiene título y la nota “Falta estimar un precio…” sigue en la tabla de costos (p. 12). La IA de boletas no se explica en 2.2.3."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": ""}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": ""}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "completo", "nota": "Mejoró: se centra en bodegas y minimarkets de Arequipa, con distritos prioritarios y precio S/ 74,90. Queda por alinear el segmento del BMC."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Dos casos (bodeguero y consumidora), el segundo con flujo paso a paso."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "completo", "nota": "Mejoró: está centrado en el bodeguero y ya no menciona tiendas de ropa (pp. 24-26). Los enunciados siguen siendo bastante generales, no se presenta como figura y el párrafo introductorio se repite."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "incompleto", "nota": "Los 9 bloques están desarrollados y el lienzo es la Figura N° 2 (p. 33). El bloque de segmento (p. 27 y lienzo) incluye farmacias, librerías y ferreterías; hay restos de otro modelo (“visitas válidas”, p. 30); el lienzo menciona pasarelas de pago, alianzas financieras y logística que el texto no explica; falta el párrafo de coherencia entre bloques."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "incompleto", "nota": "Cuatro competidores con tabla comparativa (Tabla N° 4). La tabla omite a Bsale y a Stockly; se lee “Stocka” (p. 36); las fuentes figuran en las referencias pero no se citan en el texto; el diferencial frente a Clarito Pro no está demostrado (3.3.4 y 3.3.5)."}, {"codigo": "3.4", "apartado": "Indicadores de gestión", "estado": "completo", "nota": "Ocho indicadores con fórmula, meta y ejemplo (Tabla N° 5). El MRR usa S/ 85, no S/ 74,90."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Mejoró: ya figuran PRODUCE, Hidalgo Vergara y Xiao, CEPLAN, ONU y los cuatro competidores. Faltan orden alfabético, el título “Referencias”, la ABP con año y documento, y la cita en el texto de las páginas de competidores."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "El capítulo mejoró de forma importante: ODS 8 y 12 con meta y fuente, megatendencia sustentada en CEPLAN, línea de investigación nombrada y cifras de bodegas. Quedan por resolver el respaldo de las cifras de la ABP, la coherencia del índice con el cuerpo y detalles de citación y redacción.", "observaciones": [{"severidad": "importante", "titulo": "Las cifras de la ABP no tienen respaldo verificable", "ubicacion": "1.4, p. 7; referencias, p. 42", "cita": "de acuerdo con la Asociación de Bodegueros del Perú (ABP, 2024), en el país existen más de 500,000 bodegas, de las cuales aproximadamente 14,500 se concentran en la provincia de Arequipa", "problema": "Mejoró: ahora hay cifras de bodegas y la ABP figura en las referencias. Pero el texto cita “ABP, 2024” y la referencia es “(s. f.)” y apunta a la página de inicio de la asociación, no a un documento. De esa fuente dependen las cifras más importantes del problema (500 000 bodegas, 14 500 en Arequipa, 78 % con cuaderno, pérdidas de 5 % a 8 % de los ingresos). Al no poder verificarse, el sustento cuantitativo del problema queda débil.", "mejora": "Citar el documento, nota o estudio concreto del que salen las cifras, con año y enlace, o reemplazarlas por datos verificables (INEI, PRODUCE, Ipsos, Kantar u otro). Las cifras de PRODUCE (2025) sí están correctamente citadas."}, {"severidad": "importante", "titulo": "El índice y los títulos no coinciden con el cuerpo del capítulo", "ubicacion": "Índice, p. 2; 1.1.1, p. 4; 1.2.1, p. 5", "cita": "1.1.1. ODS 3: Salud y bienestar / 1.2.1. Sostenibilidad y ecología", "problema": "El cuerpo del capítulo trata el ODS 8 (1.1.1) y la megatendencia “Acelerada innovación y desarrollo económico” (1.2.1), pero el índice conserva los títulos de la versión anterior (ODS 3 y sostenibilidad). El lector no sabe cuáles son los ODS y la megatendencia declarados. Además, el título 1.2.1 habla de “desarrollo económico” y el texto de “desarrollo tecnológico”.", "mejora": "Actualizar el índice con la herramienta automática y unificar el nombre de la megatendencia entre el índice, el título y el texto (por ejemplo, el nombre exacto de la lista de CEPLAN)."}, {"severidad": "sugerencia", "titulo": "Cita de la ONU con formato incorrecto y sin referencia para el ODS 12", "ubicacion": "1.1.1 y 1.1.2, p. 4; referencias, p. 43", "cita": "(Naciones Unidas, s. f. 2026)", "problema": "El formato correcto es (Naciones Unidas, s. f.) o (Naciones Unidas, 2026) según la fecha de la página. En las referencias solo aparece la entrada del ODS 8; la meta 12.3 se cita sin su fuente. Además, la meta 12.3 se refiere a pérdidas y desperdicio de alimentos, y el texto aclara que se aplica a bodegas que comercializan alimentos y bebidas, lo que conviene mantener frente al segmento.", "mejora": "Agregar la referencia del ODS 12 (o de la página de metas) y corregir el formato de la cita en ambos apartados."}, {"severidad": "sugerencia", "titulo": "Lenguaje en primera persona, repeticiones y subtítulo de la línea de investigación", "ubicacion": "1.1.1, p. 4; 1.3.1, p. 6; 1.4, pp. 7-8", "cita": "bajo este contexto nuestra plataforma Stockly busca facilitar…", "problema": "Persisten “nuestra plataforma” (p. 4), “nuestro público objetivo” (p. 27) y “El nombre elegido para nuestra plataforma” (p. 9). Dini et al. (2021) y Puican Rodríguez et al. (2025) se explican más de una vez (pp. 5, 7 y 8). El subtítulo 1.3.1 “Tradicional” no corresponde a la línea de investigación, sino a los métodos manuales de las bodegas.", "mejora": "Redactar en forma impersonal (“la plataforma Stockly busca…”), condensar las ideas repetidas y retitular 1.3.1 con un nombre que refleje su contenido."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "La propuesta está completa y el segmento de 2.5 mejoró al centrarse en bodegas y minimarkets. Quedan por unificar el segmento del BMC, la cifra referencial del precio y la explicación de la IA de boletas.", "observaciones": [{"severidad": "importante", "titulo": "El segmento del BMC no coincide con el de 2.5", "ubicacion": "3.2 a), p. 27; lienzo, p. 33", "cita": "Dentro de este segmento se consideran bodegas, tiendas de abarrotes, minimarkets, farmacias independientes, librerías, ferreterías y pequeños almacenes", "problema": "Mejoró: 2.5 y el mapa de empatía se centran en bodegas y minimarkets. Pero el bloque de segmento del BMC (texto y lienzo) mantiene farmacias, librerías y ferreterías, rubros con necesidades distintas (vencimientos, códigos, tallas). El mercado inicial se describe como “Perú, con especial atención a la Macro Región Sur”, mientras que 2.5 delimita Arequipa y sus distritos.", "mejora": "Definir bodegas y minimarkets de Arequipa como segmento inicial en todo el documento y mencionar los demás rubros como expansión futura."}, {"severidad": "sugerencia", "titulo": "La cifra referencial del precio difiere en el indicador MRR", "ubicacion": "3.4, p. 40", "cita": "20 clientes × S/ 85 = S/ 1,700", "problema": "Mejoró: el precio de S/ 74,90 ya aparece de forma coherente en 2.2.4, 2.5.4, 3.3.5 y el resto del texto. Solo el indicador MRR sigue usando S/ 85, de modo que la meta de S/ 1 700 no corresponde a la tarifa propuesta.", "mejora": "Recalcular el MRR con el precio referencial (por ejemplo, 20 × 74,90 = S/ 1 498) o aclarar el supuesto. El sustento de costos y precio se trabaja en el cap. 6 (AA2)."}, {"severidad": "sugerencia", "titulo": "La IA para registrar boletas no está explicada en la ficha técnica", "ubicacion": "2.2.2, p. 10; 2.2.4, p. 12; tabla de costos, p. 13", "cita": "Usar la IA para guardar la informacion de las boletas de venta al momento de hacer el registro en caja", "problema": "La función de IA aparece como última fila de la tabla de especificaciones (con errores de redacción), como “módulo de inteligencia artificial” en 2.2.4 y como costo mensual de S/ 117,69, pero no figura entre las funcionalidades a) a h) de 2.2.3 ni en los casos de uso.", "mejora": "Decidir si forma parte de la primera versión: si es así, describirla en 2.2.3 y en un caso de uso; si no, retirarla del texto y de la tabla de costos."}, {"severidad": "sugerencia", "titulo": "La disposición de pago se presenta como hecho", "ubicacion": "3.3.5, p. 38", "cita": "de acuerdo con el público objetivo y la disposición de pago identificada en el proyecto", "problema": "El informe no presenta datos de una validación; para la AA1 las hipótesis son aceptables si se rotulan como tales.", "mejora": "Redactarla como hipótesis de trabajo. La validación real de precio y disposición de pago se exigirá en el cap. 5 (AA2)."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El BMC tiene los 9 bloques con lienzo numerado y el mapa de empatía se centra en el bodeguero. Persisten el diferencial no demostrado frente a Clarito Pro y los restos de otro modelo de negocio.", "observaciones": [{"severidad": "importante", "titulo": "El diferencial frente a Clarito Pro y Stoka sigue sin demostrarse", "ubicacion": "3.3.2 a 3.3.5, pp. 35-38", "cita": "Clarito: Pedidos por WhatsApp: Disponible mediante su catálogo online", "problema": "La propia tabla (p. 36) muestra que Clarito Pro ya ofrece catálogo y pedidos por WhatsApp, pero 3.3.5 presenta esos mismos elementos como diferenciadores (“Catálogo web vinculado al inventario”, “Pedidos mediante WhatsApp”). 3.3.4 plantea la ventaja de forma general (“busca centralizar”) y no indica qué función concreta no tienen los demás ni por qué sería difícil de copiar. La tabla no incluye a Bsale ni a Stockly, por lo que no se puede ver la comparación.", "mejora": "Precisar el diferencial con funciones concretas (por ejemplo, si el pedido descuenta stock, la IA de boletas o el acompañamiento del primer mes) y agregar a Stockly y Bsale como columnas de la tabla."}, {"severidad": "importante", "titulo": "Persisten restos de otro modelo de negocio y notas pendientes", "ubicacion": "3.2 g), p. 30; tabla de costos, p. 15; 2.2.4, p. 12", "cita": "verificando el número de visitas válidas o el nivel de utilización de cada cuenta", "problema": "La actividad “Gestión del uso y facturación” (p. 30) y la fila “Medición de visitas: registro de aperturas del catálogo y mecanismos para identificar tráfico no válido” (p. 15, continuación de la Tabla N° 3) corresponden a un modelo de cobro por visitas, no a la suscripción mensual de Stockly. En la Tabla N° 2 (p. 12) sigue la nota “Falta estimar un precio en base a nuestro programa”.", "mejora": "Reemplazar por actividades propias de una suscripción (cobro mensual, renovación, control de pagos), quitar la fila “Medición de visitas” y eliminar la nota pendiente."}, {"severidad": "sugerencia", "titulo": "Mapa de empatía centrado en el bodeguero, pero aún general", "ubicacion": "3.1, pp. 24-26", "cita": "Le preocupa mantener la estabilidad económica de su negocio y obtener ganancias.", "problema": "Mejoró: ya se centra en propietarios de bodegas de Arequipa y no menciona tiendas de ropa. Algunos enunciados siguen siendo válidos para cualquier comerciante, no se presenta como figura y el párrafo introductorio se repite (pp. 24-25).", "mejora": "Presentarlo como figura numerada con los 6 cuadrantes y agregar rasgos propios del bodeguero (por ejemplo, el cuaderno, el fiado o el uso de billeteras digitales), formulados como hipótesis."}, {"severidad": "sugerencia", "titulo": "BMC sin párrafo de coherencia y elementos del lienzo no explicados", "ubicacion": "3.2, pp. 27-34", "cita": "Alianzas con entidades financieras (para futuros pagos y promociones)", "problema": "Mejoró: el BMC tiene sus 9 bloques y el lienzo es la Figura N° 2 (p. 33). Falta el párrafo que explique la coherencia entre los bloques y la propuesta de valor. El lienzo incluye alianzas financieras, pasarelas de pago y empresas de logística que no se explican en el texto, y la fuente de la figura aparece en la página siguiente (p. 34).", "mejora": "Cerrar 3.2 con un párrafo de coherencia, revisar que el lienzo y el texto digan lo mismo y mantener título, figura y fuente en la misma página."}, {"severidad": "sugerencia", "titulo": "Tabla comparativa con celdas vacías y fuentes no citadas en el texto", "ubicacion": "3.3.1 a 3.3.3, pp. 34-37", "cita": "a) Stocka", "problema": "Las páginas de Stoka, Stokr, Clarito y Bsale ya figuran en las referencias (mejora), pero no se citan en el texto (por ejemplo, “(Stoka, s. f.)”) ni en la Tabla N° 4. Varias celdas dicen “No especificado en la información recopilada”, se lee “(super básico)” y el nombre aparece como “Stocka” (p. 36).", "mejora": "Citar cada competidor en el texto y en la tabla, completar las celdas con información de cada web oficial (con fecha de consulta) y corregir el nombre."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "El formato mejoró: las tablas y figuras están numeradas con título y fuente, y las referencias incluyen las fuentes que faltaban. Quedan por ordenar las referencias, actualizar el índice y hacer una última revisión de redacción.", "observaciones": [{"severidad": "sugerencia", "titulo": "Referencias: completas en su mayoría, pero sin orden ni título APA 7", "ubicacion": "Referencias, pp. 42-43", "cita": "Fuentes Bibliográficas", "problema": "Mejoró: ya figuran PRODUCE (2025), Hidalgo Vergara y Xiao (2022), CEPLAN (2025), Naciones Unidas y los cuatro competidores. La lista no está en orden alfabético (Hidalgo, ABP, CEPLAN, Naciones Unidas y PRODUCE aparecen después de Vega Alomía) y se titula “Fuentes Bibliográficas” en lugar de “Referencias”. La entrada de Bsale remite a un artículo de ayuda sobre control de stock, mientras que el texto cita sus planes y precios.", "mejora": "Ordenar alfabéticamente, titular la sección “Referencias”, verificar que cada cita del texto esté en la lista y viceversa, y citar la página de precios de Bsale."}, {"severidad": "sugerencia", "titulo": "Numeración de tablas y figuras no uniforme", "ubicacion": "pp. 10-11, 15, 33-34", "cita": "Cuadro N° 1", "problema": "Mejoró: hay Tablas N° 2 a 5 y Figuras N° 1 y 2 con título y fuente. La primera se rotula “Cuadro N° 1” y la tabla de funcionalidades (p. 10) no tiene número ni título. La Tabla N° 3 se corta en dos páginas y la fuente de la Figura N° 2 queda en otra página.", "mejora": "Usar “Tabla N°” en todas, numerar y titular la tabla de funcionalidades y mantener cada tabla o figura con su título y fuente en la misma página."}, {"severidad": "sugerencia", "titulo": "Índice desfasado y errores de redacción", "ubicacion": "Índice (pp. 2-3); pp. 8-9, 11, 36", "cita": "e) e) Catálogo web interactivo", "problema": "Los números de página del índice no coinciden con el documento (3.3 figura en la p. 31 y aparece en la p. 34; Bibliografía figura en la p. 37 y está en la p. 42). Persisten “e) e)” (p. 11) y “Stocka” (p. 36), además de la frase “cuya utilidad y aceptación deberán contrastarse con las alternativas existentes…” (pp. 8-9), que parece una nota pendiente.", "mejora": "Actualizar el índice automático al final y hacer una última lectura ortográfica y de estilo impersonal."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Formulario de validación del MVP y del modelo de negocio", "resumen": "Instrumento ordenado y con precio probado, pero con filtro de segmento débil, valor no cuantificado, precio sin rango, catálogo y pedidos sin validar desde la demanda real y propuesta sin prototipo. Falta toda la recolección y el análisis.", "observaciones": [{"severidad": "critico", "titulo": "No hay validación real documentada: el cap. 5 es solo un índice", "ubicacion": "Informe 06/11, cap. 5 (5.1 a 5.11)", "cita": "5.10. Resultados de las encuestas / 5.11. Resultados de las entrevistas", "problema": "Sin objetivos, hipótesis, muestra, resultados ni conclusiones con métricas no se puede evaluar viabilidad ni proponer mejoras al MVP, que es lo que distingue el nivel 4 de la rúbrica. Ya no valen las flexibilizaciones de la AA1.", "mejora": "Documentar hipótesis (p. ej., «al menos 60 % pagaría S/ 74,90»), muestra y criterio de aceptación; aplicar el formulario; presentar resultados con n y %; y concluir qué se modifica en el MVP, el precio y el segmento."}, {"severidad": "importante", "titulo": "Sin filtro de ubicación ni de rol del decisor", "ubicacion": "Preguntas 1 y 2", "cita": "1. ¿Qué tipo de negocio tienes o administras? / 2. ¿Cuánto tiempo lleva funcionando tu negocio?", "problema": "El mercado inicial es Arequipa y el cliente es el propietario, pero nada impide que responda un encargado, alguien de otra ciudad o un negocio que no es del segmento. P1 incluye «Otros» sin criterio de exclusión. No se pregunta tamaño del negocio.", "mejora": "Agregar distrito, rol (propietario/encargado) y quién decide la compra de herramientas, con fin de la encuesta si no decide; sumar tamaño (ventas o personas)."}, {"severidad": "importante", "titulo": "El valor del problema no se cuantifica", "ubicacion": "Preguntas 6 y 7", "cita": "7. ¿Has tenido pérdidas económicas relacionadas con una mala gestión de tus productos? (Si / No / Otros)", "problema": "P7 solo registra si hubo pérdidas y P6 mide frecuencia de faltantes, no costo. No se puede demostrar que el problema cuesta más que S/ 74,90 al mes ni calcular ahorro de tiempo.", "mejora": "Preguntar pérdida mensual estimada en rangos (vencidos y faltantes) y horas semanales de inventario; usar esos datos en el cap. 6."}, {"severidad": "importante", "titulo": "Precio con un solo valor, sin rango ni máximo aceptable; no se prueba el modelo híbrido", "ubicacion": "Preguntas 13 y 14", "cita": "14. Si Stockly ofreciera todas las funciones mencionadas por una suscripción mensual de S/ 74.90, ¿estarías dispuesto(a) a pagar ese monto?", "problema": "Quien responde «Me parece un precio elevado» o «No estaría dispuesto(a)» no indica cuánto pagaría. «Lo consideraría dependiendo de sus beneficios» es ambigua. P13 es Sí/No sin matices. El informe plantea IA de boletas (costo variable) y no se pregunta si prefiere pago fijo o por uso. «Todas las funciones» ancla el precio al paquete completo.", "mejora": "Añadir pregunta de monto mensual razonable por rangos (p. ej., menos de S/ 20, 20-40, 41-60, 61-75, más de 75), máximo para quien rechaza S/ 74,90, y preferencia fijo/por uso; sustituir P13 por escala 1 a 5."}, {"severidad": "importante", "titulo": "Catálogo y pedidos por WhatsApp no se validan desde la demanda real", "ubicacion": "Preguntas 8, 9 y 12", "cita": "9. … Catálogo digital para mostrar productos. / Recepción de pedidos por internet.", "problema": "La función diferenciadora frente a Clarito Pro solo se mide como «útil» para el bodeguero. No se pregunta si sus clientes ya le piden por WhatsApp, cuántos pedidos al día, si hace entregas ni si compartiría un catálogo. Tampoco se pregunta si hoy paga alguna herramienta (Clarito, Stoka, Bsale), dato clave de competencia y precio.", "mejora": "Agregar preguntas de pedidos actuales por WhatsApp, entrega a domicilio, herramienta y costo actual, y complementar con entrevistas a consumidores finales."}, {"severidad": "importante", "titulo": "Propuesta descrita en dos líneas, sin prototipo ni tarea de uso, e incoherente con P12", "ubicacion": "Sección 4 (descripción), preguntas 11 y 12", "cita": "12. … Registro de boletas mediante inteligencia artificial.", "problema": "Se valida utilidad a partir de un párrafo, no la funcionalidad del MVP: el informe menciona un prototipo, pero el formulario no lo muestra ni mide si el usuario logra una tarea (registrar una venta, ver una alerta). La descripción no menciona la IA de boletas, pero P12 la ofrece como opción. Además la descripción solo lista beneficios, sin neutralidad.", "mejora": "Insertar capturas o video corto del prototipo y una tarea con pregunta «¿pudiste hacerlo? ¿qué te confundió?». Alinear la descripción con las funciones preguntadas y redactarla de forma neutral."}, {"severidad": "sugerencia", "titulo": "Opciones de selección única y pregunta de prioridad que no prioriza", "ubicacion": "Preguntas 3, 8, 10 y 12", "cita": "12. ¿Qué característica de Stockly te interesaría utilizar principalmente?", "problema": "Un bodeguero puede usar cuaderno y WhatsApp a la vez (P3, P8) y tener varias barreras (P10). P12 dice «principalmente» pero, según su configuración, permite marcar varias opciones, por lo que no se obtiene prioridad. P9 y P12 se repiten casi igual.", "mejora": "Selección múltiple en P3, P8 y P10; en P12 elegir las tres más importantes u ordenarlas; fusionar P9 y P12."}, {"severidad": "sugerencia", "titulo": "Introducción: anonimato y correo obligatorio; sin consentimiento ni compromiso de prueba", "ubicacion": "Introducción (correo) y sección 4", "cita": "La encuesta es anónima… Correo electrónico*", "problema": "La introducción promete anonimato pero el correo es obligatorio. No hay mención de uso de datos (Ley 29733) ni una pregunta que mida compromiso real (WhatsApp para prueba, reserva de cupo).", "mejora": "Aclarar «confidencial» en lugar de «anónima» e indicar el uso de datos; agregar invitación opcional a una prueba piloto de un mes con contacto."}, {"severidad": "sugerencia", "titulo": "Ortografía, mayúsculas y opción «Otros» sin especificar", "ubicacion": "Preguntas 3, 4, 5, 6 y 7", "cita": "«Aplicación movil», «UNa vez por semana», «Frecuentamente», «mercaderia», «Si»", "problema": "Errores en varias opciones. «Otros» aparece sin campo para especificar, lo que impide analizar esas respuestas; las escalas de P6 y P11 incluyen «Otros» como opción final, que no corresponde a una escala.", "mejora": "Corregir texto, usar «Otro (especifique)» solo en preguntas nominales y quitarlo de las escalas."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Cambios en el modelo de negocio y costos (Tabla 2)", "resumen": "Solo cambió la Tabla 2 (sección 2.2.4): Cloud Run y Hosting/Storage pasaron a S/ 0 y el dominio a S/ 0,12 anual. El resto del cap. 3 no cambió y mantiene una incoherencia de precio en los indicadores.", "observaciones": [{"severidad": "importante", "titulo": "Tabla 2: costos puestos en S/ 0 sin sustento y Firestore sin recalcular", "ubicacion": "Sección 2.2.4, Tabla N° 2", "cita": "Google Cloud Run (Falta estimar un precio en base a nuestro programa) S/ 0 · Firebase Firestore S/.172,88", "problema": "Entre el 06/11 y el 11/11 Cloud Run bajó de S/ 125 a S/ 0 y Hosting/Storage de S/ 20 a S/ 0, pero Firestore sigue en S/ 172,88: la base de datos no puede costar mucho más que el cómputo sin dimensionar el uso. El costo mensual declarado cae de S/ 460,58 a S/ 315,58 (172,88 + 117,69 + 25 + 0,01) sin haber medido nada. Con la cuota gratuita de Firestore (50 mil lecturas y 20 mil escrituras al día) y 20 negocios, Firestore costaría cerca de S/ 0.", "mejora": "Dimensionar con supuestos de uso del prototipo (requests, lecturas y escrituras por negocio, boletas con IA) en la calculadora de GCP. Ejemplo: 20 negocios x 8 000 lecturas = 160 mil lecturas al mes, dentro de la cuota gratis. Reemplazar los S/ 0 y S/ 172,88 por estos cálculos y citar la fuente."}, {"severidad": "importante", "titulo": "Dominio a S/ 0,12 anual: es precio promocional, no costo recurrente", "ubicacion": "Tabla N° 2, fila «Dominio de la página»", "cita": "GoDaddy (.com) S/.0,12 Anual", "problema": "El primer año puede ser casi gratis, pero la renovación del .com ronda USD 20 (aprox. S/ 70 con TC 3,50). Proyectar S/ 0,12 a 3 años subestima el costo en unos S/ 140.", "mejora": "Registrar S/ 0,12 en el año 1 y S/ 70 en los años 2 y 3 en el cap. 6."}, {"severidad": "sugerencia", "titulo": "Persisten dos precios en los indicadores de gestión", "ubicacion": "Sección 3.4, indicador 8 (MRR)", "cita": "20 clientes × S/ 85 = S/ 1,700", "problema": "El precio es S/ 74,90 en 2.2.4, 3.3 y el pitch; el MRR usa S/ 85. Con S/ 74,90 el MRR de 20 clientes es S/ 1 498 (11,9 % menos). El CAC S/ 300 / 10 clientes = S/ 30 es correcto, pero los S/ 300 no tienen desglose.", "mejora": "Usar S/ 74,90 y el CAC con el gasto real de captación; luego compararlo con el margen mensual por cliente (S/ 74,90 menos costo variable)."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Producto mínimo viable: objetivos, funcionalidades, plataforma, usuarios y herramientas", "resumen": "El cap. 4 se desarrolló (4.1 a 4.6) con objetivos y funcionalidades claros, pero el MVP de 4.3 no incluye catálogo ni pedidos (el diferenciador), no documenta los pasos seguidos ni sustenta las herramientas, y 4.7 está vacío. Nivel 2: describe, pero la coherencia con la propuesta de valor es parcial.", "observaciones": [{"severidad": "critico", "titulo": "El MVP de 4.3 no contiene el diferenciador: catálogo, enlace por WhatsApp y pedidos", "ubicacion": "Sección 4.3 vs 4.1, 2.2.3 y 4.4", "cita": "4.3: Registro de productos / Control de movimientos / Actualización de existencias / Alertas de stock bajo / Reportes básicos", "problema": "4.1 y el objetivo específico 4 prometen catálogo y pedidos, y el pitch dice «escanear productos» y «catálogo web», pero 4.3 lista solo 5 funciones de inventario; «Actualización de existencias» es casi lo mismo que «Control de movimientos». Con el MVP así, un cliente de Clarito (S/ 39) tiene lo mismo a menor precio: la ventaja competitiva de 3.3.4 no se prueba. La IA de boletas (Tabla 2, P12 del formulario) tampoco aparece, y «escanear productos» no existe en ninguna parte.", "mejora": "Reescribir 4.3 como lista priorizada (MoSCoW): Debe: registro, movimientos, alerta, catálogo con enlace, pedido; Podría: reportes e IA de boletas (v2). Indicar por función qué hipótesis valida y con qué métrica (p. ej., «al menos 60 % de los bodegueros comparte su catálogo en la primera semana»). Quitar «escanear» del pitch o implementarlo."}, {"severidad": "importante", "titulo": "Faltan los pasos seguidos y las imágenes del prototipo", "ubicacion": "Sección 4.7 «Imagenes» (vacía)", "cita": "4.7. Imagenes", "problema": "La rúbrica pide sustentar todos los pasos seguidos; el cap. 4 no cuenta cómo se pasó de requerimientos a prototipo ni muestra una sola pantalla (el proceso de 2.2.5 es genérico). El formulario tampoco muestra el prototipo.", "mejora": "Agregar 4.7 con 5 capturas rotuladas (inventario, alerta, catálogo, pedido, reporte), una línea de tiempo (fechas de diseño, prueba y ajuste) y qué cambió entre versiones. Usar esas imágenes también en el formulario."}, {"severidad": "importante", "titulo": "No hay un apartado de herramientas para diseñar y validar el MVP", "ubicacion": "Cap. 4 completo; Tabla 2 (cap. 2)", "cita": "Visual Studio Code y GitHub Free S/ 0", "problema": "Las herramientas aparecen solo en la tabla de costos de 2.2.4; el cap. 4 no explica por qué Cloud Run + Firestore + Hosting, qué herramienta de diseño se usó (la Tabla 2 cobra S/ 1 100 de UX/UI), ni cómo permiten usabilidad y viabilidad técnica. 4.4 y 4.6 hablan de plataformas y redes, no de herramientas de desarrollo.", "mejora": "Añadir «4.x Herramientas»: tabla con herramienta, para qué se usa, por qué se eligió, alternativa descartada y costo (Figma para el prototipo; Firebase Auth/Firestore/Hosting; GitHub; Google Forms para validar). Argumentar con una limitación concreta (p. ej., Firestore gratis hasta 50 mil lecturas diarias)."}, {"severidad": "importante", "titulo": "Objetivos del MVP sin metas medibles", "ubicacion": "Sección 4.2", "cita": "Evaluar la facilidad de uso y la aceptación de la plataforma mediante pruebas con propietarios de pequeñas bodegas", "problema": "Los cinco objetivos específicos usan verbos de proceso (facilitar, reducir, implementar) sin cifra ni plazo; no se puede decir al final si el MVP «funcionó». Tampoco hay criterio de éxito de la prueba.", "mejora": "Redactarlos SMART: «Reducir de 30 a 10 minutos el registro diario»; «al menos 70 % completa el registro de 10 productos sin ayuda»; «8 de 10 pedidos de prueba llegan al panel». Definirlos antes de probar y medirlos en el cap. 5."}, {"severidad": "sugerencia", "titulo": "Párrafo desordenado en 4.2 y sección 4.5 que describe, no segmenta con datos", "ubicacion": "Secciones 4.2 y 4.5", "cita": "(texto de 4.5) rango de 22 a 60 años establecido en la segmentación del proyecto", "problema": "El texto exportado de 4.2 muestra el párrafo de «Usuarios principales» donde debería ir el objetivo general (revisar el Doc); 4.5 enumera 6 distritos sin cifras de negocios por distrito ni cuotas de la prueba.", "mejora": "Verificar el formato del Doc y añadir una tabla de la prueba piloto: distrito, n de bodegas, n de consumidores y canal de llegada, que alimentará 5.5."}, {"severidad": "sugerencia", "titulo": "El pitch contradice la tabla de funciones y no sustenta el gancho", "ubicacion": "Elevator pitch 4.2 (cap. 4 del índice de la AA1)", "cita": "¿Sabías que la mayoría de las MYPEs comerciales quiebran por fallas en su gestión? … miles de bodegueros", "problema": "El gancho sin cifra ni fuente («la mayoría», «miles») es débil; se cita 136 000 MYPEs sin vincularlas a bodegas. Además promete «escanear productos».", "mejora": "Usar una cifra citada (PRODUCE 2024) y filtrada a bodegas de Arequipa; alinear las funciones con 4.3; ensayar 90 s y formato 6x6 con letra de 20 o más."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Metodología, instrumentos y resultados de la validación", "resumen": "Hay formulario y guía de entrevista, pero sigue sin muestra, sin objetivos, sin resultados ni mejoras al MVP: 5.2 a 5.11 son solo títulos con nombres de responsable. Sin datos reales no pasa de En proceso (2).", "observaciones": [{"severidad": "critico", "titulo": "Cero resultados: 5.10 y 5.11 están vacíos y no hay n", "ubicacion": "Secciones 5.2 a 5.11", "cita": "5.10. Resultados de las encuestas / 5.11. Resultados de las entrevistas", "problema": "El informe no dice si se aplicó el formulario ni a cuántas personas, ni si se hizo alguna entrevista. Ya no valen las hipótesis de la AA1: sin métricas no hay conclusión de viabilidad ni mejoras al MVP (nivel 4).", "mejora": "Aplicar y reportar: n encuestas (mín. 30), n entrevistas (mín. 6), % por pregunta, tabla de hallazgos y 3 mejoras al MVP. Ejemplo: «62 % (n=19) aceptó S/ 74,90; 7 de 10 pidió ver un video, se añadió tutorial»."}, {"severidad": "critico", "titulo": "Secciones 5.3 a 5.9 sin escribir: objetivos, segmentación, escalas, preguntas relevantes", "ubicacion": "Secciones 5.3 a 5.9", "cita": "5.3. Objetivos de la validación CAMILA · 5.5. Segmentación ERICK", "problema": "Aparecen los nombres de los integrantes («CAMILA», «ERICK», «SOLANCH», «TODOS») como asignaciones pendientes, no como contenido. No hay hipótesis ni criterio de aceptación que permita decidir si el modelo se valida.", "mejora": "Definir hipótesis con umbral: H1 «al menos 60 % usa cuaderno o Excel»; H2 «al menos 50 % pagaría S/ 74,90»; H3 «al menos 40 % compartiría un catálogo». Vincular cada pregunta del formulario a una hipótesis en una tabla (pregunta, hipótesis, métrica)."}, {"severidad": "importante", "titulo": "La guía de entrevista no filtra al entrevistado ni cuantifica pérdidas", "ubicacion": "Sección 5.1, Guía de entrevista (preguntas 3, 5, 6, 13)", "cita": "13. Considerando que el precio propuesto es de S/ 74.90 mensuales, ¿cómo evaluarías ese costo frente a los beneficios que recibirías?", "problema": "El formato de datos pide tipo de negocio y cargo pero no distrito ni quién decide la compra. P5 y P6 piden relatos, no montos: no sale cuánto pierde por mes ni cuánto tiempo gasta. P13 anuncia el precio y condiciona la respuesta; falta el máximo aceptable. Las preguntas 10 a 14 se hacen tras presentar Stockly solo con texto, sin prototipo.", "mejora": "Añadir: «¿Cuántos soles pierde al mes por vencidos y faltantes?», «¿cuántas horas semanales?», «¿cuánto pagaría como máximo?» antes de decir el precio. Mostrar el prototipo y observar una tarea (registrar un producto, ver una alerta)."}, {"severidad": "importante", "titulo": "Formulario ya evaluado: persisten sus brechas y no se documenta en el informe", "ubicacion": "Sección 5.1 (enlace del formulario)", "cita": "Encuesta: https://docs.google.com/forms/d/1SouFiVyRHOxuHNGXBkfOF0fqZLV3HuYdQmBjC1djhXA/edit", "problema": "Solo se pega el enlace (de edición). La revisión del formulario señaló falta de filtro de distrito y rol, precio de un solo valor, valor del problema no cuantificado y catálogo/pedidos sin validar. Ninguno aparece corregido en el informe.", "mejora": "Corregir el formulario antes de aplicarlo, documentar el instrumento en 5.6 a 5.8 (pregunta, escala, objetivo) y adjuntar el modelo en anexo con un enlace de solo respuesta."}, {"severidad": "sugerencia", "titulo": "Sin plan de la muestra ni forma de llegar al segmento", "ubicacion": "Secciones 5.5 y 4.6", "cita": "5.5. Segmentación ERICK", "problema": "4.6 define canales de difusión, pero la muestra no se reparte entre distritos ni se controla el sesgo (conocidos, encargados, otras ciudades).", "mejora": "Cuotas por distrito de 4.5 (p. ej., 5 por distrito = 30), 50 % presenciales en bodegas, registro del canal y distrito de cada respuesta."}]}, {"etiqueta": "AA2 · Formulario de validación", "titulo": "Proyección financiera y presupuestaria a 3 años (7 piezas)", "resumen": "El capítulo 6 solo contiene el índice (6.1 a 6.6) sin una cifra: ninguna de las siete piezas existe y no se analiza el entorno. Los datos útiles están dispersos en la Tabla 2 (cap. 2) y no se consolidan. Nivel 1.", "observaciones": [{"severidad": "critico", "titulo": "No existe ninguna de las 7 piezas del cap. 6", "ubicacion": "Sección 6 (6.1 a 6.6)", "cita": "6.1. Estructura de inversión total / 6.4. Flujo de caja / 6.6. Evaluación del proyecto", "problema": "Sin inversión, costos, ingresos, egresos, flujo mensual del año 1, flujo a 3 años ni VAN/TIR/PRI, no se puede determinar la viabilidad económica ni la coherencia con el MVP validado. Con solo el índice el criterio es 1. Además falta el análisis del entorno interno y externo.", "mejora": "Construir las 7 piezas con la Tabla 2 como base. 6.1: inversión inicial S/ 5 700 (desarrollo) + capital de trabajo. 6.2: separar fijos (mantenimiento, monitoreo, dominio) de variables por cliente (IA de boletas, mensajería). 6.3 a 6.6: ver observaciones siguientes."}, {"severidad": "critico", "titulo": "Coherencia con Tabla 2: los números existentes ya muestran riesgos que el cap. 6 debe resolver", "ubicacion": "Tabla N° 2 y sección 3.4", "cita": "Desarrollo S/ 5 700 (850+1 100+1 600+2 150); mensual S/ 172,88 + 117,69 + 25", "problema": "Verificación: el desarrollo suma S/ 5 700 (114 h a S/ 50) y el costo mensual declarado es S/ 315,58. El punto de equilibrio con ese costo es 315,58 / 74,90 = 4,2, es decir 5 clientes (antes de mantenimiento). Con 20 clientes el margen sería S/ 1 182/mes y el desarrollo se recupera en 4,8 meses; pero si entra mantenimiento (12 h x S/ 40 = S/ 480) el equilibrio sube a unos 9 clientes. Nada de esto está explicado.", "mejora": "Incluir en 6.2 una tabla de costos fijos y variables y calcular PE = costos fijos / (precio - costo variable unitario): p. ej., (172,88 + 25 + 480) / (74,90 - 1,02) = 9,2, es decir 10 clientes. Decidir si la IA es costo fijo (S/ 117,69) o variable y ponerla en el precio o en el pago por uso."}, {"severidad": "importante", "titulo": "Presupuesto de ingresos: falta la curva de clientes, precios y el pago por uso", "ubicacion": "Secciones 2.2.4 y 3.4", "cita": "20 clientes × S/ 85 = S/ 1,700", "problema": "No hay proyección mensual de clientes ni bajas. El modelo híbrido (S/ 74,90 + IA por uso, plan anual con tarifa preferencial) no tiene cifras. Con una rampa lineal de 0 a 20 clientes en 6 meses y luego 20 constantes, el año 1 produce unos S/ 14 231 de ingresos (190 clientes-mes x S/ 74,90); frente a S/ 5 700 de desarrollo, S/ 411 de nube y S/ 5 760 de mantenimiento (12 meses x 12 h x S/ 40) el saldo del año 1 es de apenas unos S/ 2 360.", "mejora": "Presupuestar ingresos mes a mes: clientes nuevos (con la tasa de conversión de la validación), bajas, precio S/ 74,90 y pago por IA (p. ej., S/ 0,10 por boleta). Calcular años 2 y 3 con crecimiento justificado (p. ej., 20, 50 y 100 clientes)."}, {"severidad": "importante", "titulo": "Flujo de caja y VAN/TIR/PRI: tasa de descuento y horizonte", "ubicacion": "Secciones 6.4 a 6.6", "cita": "6.5. FLujo de caja económico proyectado / 6.6. Evaluación del proyecto", "problema": "Para 3 años hay que decidir la tasa (COK) y reportar VAN, TIR y PRI. Con S/ 5 700 de inversión y un margen de unos S/ 1 000 al mes con 20 clientes, el PRI es de unos 6 meses tras alcanzar 20 clientes; con 100 clientes sería menos de 1 mes, pero llegar a 100 clientes en Arequipa exige un plan comercial que el informe no tiene (CAC y canales sin costos).", "mejora": "Armar el flujo del mes 0 al 36 (año 1 mensual, años 2 y 3 anual), VAN a una tasa justificada (p. ej., 15 %), TIR, PRI y escenarios pesimista, base y optimista con 10, 20 y 40 clientes. Concluir con un criterio explícito (VAN > 0, TIR > tasa)."}, {"severidad": "sugerencia", "titulo": "Costos de nube: usar la lista del docente como contraste", "ubicacion": "Tabla N° 2 vs estimación del docente", "cita": "Cloud Run S/ 0; Firestore S/ 172,88; IA S/ 117,69", "problema": "El estimado del docente para 20 negocios es S/ 34/mes de nube (casi todo IA, S/ 20,47 con 300 boletas por negocio) más S/ 480 de mantenimiento: los costos declarados de Firestore y de IA no coinciden. La IA depende del modelo y de las boletas reales.", "mejora": "Probar con 20 boletas reales y gpt-5-mini (USD 0,25 y 2,00 por millón de tokens) para fijar el costo por boleta; reemplazar S/ 172,88 y S/ 117,69 por cifras sustentadas."}]}], "fecha_aa2": "11/11/2026", "calificacion": {"fuentes": 3, "problema": 3, "propuesta": 3, "modelo": 3, "responsabilidad": 3}, "calificacionAA2": {"validacion": 2}, "enlaces": [{"titulo": "Informe del TAP (Google Docs)", "url": "https://docs.google.com/document/d/1ImkyJ5rfIh6xM6whPh_NELAJfzJxuKg9AVx21od8z9E"}, {"titulo": "Formulario de validación", "url": "https://docs.google.com/forms/d/1B_TYiGiVlrFAovPfVRLArwhGuMSD_IbK9-j9PkLazPg/edit"}], "costosAA2": {"hoja": "Stockly", "tipo_cambio": 3.5, "escenarios": ["Piloto", "Año 1", "Crecimiento"], "supuestos": [{"concepto": "Negocios cliente activos", "unidad": "negocios", "valores": [5.0, 20.0, 100.0], "nota": "Meta del informe: 20 clientes al mes 6 (indicador 8)."}, {"concepto": "Requests por negocio al mes", "unidad": "req/negocio", "valores": [20000.0, 20000.0, 20000.0], "nota": "SUPUESTO: ~650 por día entre catálogo, stock y pedidos."}, {"concepto": "Segundos de CPU por request", "unidad": "seg", "valores": [0.25, 0.25, 0.25], "nota": "SUPUESTO: API ligera."}, {"concepto": "vCPU por instancia", "unidad": "vCPU", "valores": [1.0, 1.0, 1.0], "nota": ""}, {"concepto": "Memoria por instancia", "unidad": "GiB", "valores": [0.5, 0.5, 0.5], "nota": ""}, {"co on pago mensual fijo para actualizar la plataforma, escriba aquí su pago; reemplaza a la bolsa de horas."}], "costos": [{"concepto": "Cloud Run: CPU", "valores": [0.0, 0.0, 26.88], "nota": "requests x segundos x vCPU"}, {"concepto": "Firestore: almacenamiento", "valores": [0.0, 0.0, 2.52], "nota": ""}, {"concepto": "Cloud Storage: fotos/archivos", "valores": [0.0, 0.0, 0.35], "nota": ""}, {"concepto": "Firebase Hosting: transferencia", "valores": [0.0, 4.83, 46.83], "nota": ""}, {"concepto": "IA (OpenAI gpt-5-mini)", "valores": [5.12, 20.47, 102.38], "nota": "llamadas x tokens x tarifa por millón"}, {"concepto": "Dominio propio (prorrateado)", "valores": [5.83, 5.83, 5.83], "nota": ""}, {"concepto": "Imprevistos", "valores": [1.1, 3.11, 18.48], "nota": ""}], "total_pen": [12.0473, 34.2522, 203.2672], "primer_pago_pen": [82.6306, 104.8355, 273.8505], "ingreso_etiqueta": "Ingreso por suscripciones (S/ 74,90 por negocio)", "ingreso_pen": [374.5, 1498.0, 7490.0], "chat_pen": null, "desarrollo_pen": 5700.0, "mantenimiento_pen": [320.0, 480.0, 960.0], "total_con_mant_pen": [332.0473, 514.2522, 1163.2672], "tarifa_desarrollo": 50, "tarifa_mantenimiento": 40, "pct_ingreso": [0.0322, 0.0229, 0.0271], "por_usuario_pen": [2.4095, 1.7126, 2.0327], "notas": ["El grupo declaro S/ 125 de Cloud Run y S/ 172,88 de Firestore sin dimensionar por uso; con estos supuestos casi todo cae dentro de las cuotas gratuitas.", "El mayor costo variable es la IA de boletas: depende del modelo y de cuántas boletas lea cada negocio. Es la cifra a validar con una prueba real.", "Las cifras de uso son supuestos del asistente basados en el MVP; el grupo debe reemplazarlas con datos de su prototipo."], "elaborado": "11/11/2026", "primer_pago_total_pen": [5782.6306, 5804.8355, 5973.8505], "costo_anio1_pen": [9684.5675, 11871.026, 19659.206], "necesidades": {"nombre": "Stockly", "resumen": "SaaS web de inventario, catálogo y pedidos para bodegas. Necesita nube real (cómputo, base de datos, archivos), IA if (hasAA2) {

    ${D.notasAA2 ? (() => {

        ${N.camino_al_20?.length ? `<h4 style="margin:12px 0 6px">Camino para subir la nota</h4><ol class="priorities">${N.camino_al_20.map(c => `<li><span>${esc(c)}</span></li>`).join('')}</ol>` : ''}
        <p class="summary">Calificación preliminar con la rúbrica oficial de la AA2 y criterio exigente de revisión de negocios. El criterio «Compromiso» es individual y lo define el docente (se muestra 3 por defecto). El Excel de punto de equilibrio se evalúa aparte y puede modificar el criterio de análisis presupuestal. La nota final la decide el docente.</p>

    ${D.calificacionAA2 && !D.notasAA2 ? (() => {

      return `<div class="scorebox" id="nota-aa2">

    ${D.prototipoHtml ? `<div id="prototipo-aa2">
      <h3 style="margin:18px 0 8px">Prototipo navegable de la plataforma</h3>
      <p class="summary">Prototipo referencial elaborado a partir del MVP y de las imágenes de referencia de su informe, para visualizar cómo podría verse y usarse su plataforma. Los datos son ficticios; no es el producto final. Pruébenlo aquí o <a href="${esc(D.prototipoHtml)}" target="_blank" rel="noopener noreferrer">ábranlo en pantalla completa</a>.</p>
      <iframe src="${esc(D.prototipoHtml)}" title="Prototipo de la plataforma" loading="lazy" style="width:100%;height:680px;border:1px solid var(--rule);border-radius:10px;background:#fff"></iframe>
    </div>` : ''}
    ${D.costosAA2 ? (() => {
      const K = D.costosAA2, S = n => 'S/ ' + Number(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      return `<div class="costos" id="costos-aa2">

        ${K.necesidades ? `<h4 style="margin:14px 0 6px">Qué necesita su proyecto, con proveedor y precio</h4>
        <p class="summary">${esc(K.necesidades.resumen)} Estado del precio: <b>Verificado</b> (fuente oficial, 11/11/2026), <b>Referencial</b> (confirmar en la lista oficial del proveedor) y <b>Cotizar</b> (pidan 2 o más cotizaciones y anéxenlas). Úsenla para armar su Excel.</p>

        </table></div>
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Servicio (costo mensual)</th>${K.escenarios.map(e => `<th class="num">${esc(e)}</th>`).join('')}</tr></thead>

            <tr><td>Mantenimiento del desarrollador (horas al mes x S/ ${esc(K.tarifa_mantenimiento)} por hora)</td>${f3(K.mantenimiento_pen)}</tr>
            <tr><td><b>Total mensual con mantenimiento</b></td>${K.total_con_mant_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>
            <tr><td><b>Desarrollo inicial de la plataforma (pago único al desarrollador, a S/ ${esc(K.tarifa_desarrollo)} por hora)</b></td><td class="num" colspan="${K.escenarios.length}"><b>${S(K.desarrollo_pen)}</b></td></tr>
            ${K.primer_pago_total_pen ? `<tr><td><b>Primer pago total: plataforma + primer mes de servicios</b></td>${K.primer_pago_total_pen.map(v => `<td class="num"><b>${S(v)}</b></td>`).join('')}</tr>

            <tr><td>${esc(K.ingreso_etiqueta)}</td>${f3(K.ingreso_pen)}</tr>
            <tr><td>Costo de nube / ingreso estimado</td>${K.pct_ingreso.map(v => `<td class="num">${(v * 100).toLocaleString('es-PE', { maximumFractionDigits: 1 })} %</td>`).join('')}</tr>
          </tbody>
        </table></div>
        <ul class="strength">${K.notas.map(n => `<li>${esc(n)}</li>`).join('')}<li>El desarrollo inicial y las horas de mantenimiento son referenciales: reemplácenlos con la cotización real de su desarrollador y verifiquen que el ingreso cubra el mantenimiento mensual.</li></ul>

    ${D.excelPE ? (() => {

          <li><span>Hagan el archivo en <b>.xlsx</b> (si lo trabajan en Google Sheets: Archivo → Descargar → Microsoft Excel).</span></li>
          <li><span>Súbanlo a <b>Google Drive</b> y compártanlo con «Cualquier persona con el enlace → Lector». Nombre: <b>AA2_Cap6_Excel_Punto de equilibrio_Grupo X</b>.</span></li>
          <li><span>Envíen <b>el enlace de Drive</b> al docente. Si no abre, se les pedirá el archivo.</span></li>
          <li><span>Anexen las cotizaciones (capturas o PDF) en una hoja «Cotizaciones» o en la misma carpeta de Drive.</span></li>
          <li><span>Si lo corrigen, suban la nueva versión con el mismo nombre y el mismo enlace.</span></li>
        </ol>`;
      if (X.estado !== 'calificado' || X.logro == null) {
        const lista = [
          'Las 7 piezas del cap. 6, parecidas al modelo del docente: estructura de inversión, costos y gastos, presupuesto de ingresos, presupuesto de egresos, flujo de caja mensual del año 1, flujo económico a 3 años e indicadores (VAN, TIR, B/C, recuperación).',
          'Precio y volumen iguales a los de su informe y su validación (cap. 5); si usan otro precio, explicar por qué.',
          'Todos los costos del MVP, incluidos indirectos, depreciación, mantenimiento y comisiones de pago, clasificados en fijos y variables, con proveedor y fuente.',
          'Hoja «Cotizaciones» con al menos 2 proveedores por rubro (captura o PDF, con fecha y vigencia).',
          'Punto de equilibrio en unidades y en soles, con fórmula (costos fijos ÷ margen de contribución), margen de seguridad y el mes en que se alcanza.',

          'Flujo mensual del año 1 con saldo acumulado y el mes de saldo más bajo (capital necesario); sin contar dos veces el capital de trabajo.',

        ${X.paridad?.length ? `<h4 style="margin:12px 0 6px">Comparación con el modelo del docente</h4><div class="table-wrap"><table>

          <tbody>${X.paridad.map(p => `<tr><td>${esc(p.pieza)}</td><td>${esc(p.hoja || '—')}</td><td>${esc(p.estado || '')}</td><td>${esc(p.nota || '')}</td></tr>`).join('')}</tbody>

        <p class="summary">Indicador preliminar elaborado con la rúbrica del Excel de punto de equilibrio. La calificación final de la AA2 la define el docente.${X.revisado ? ' Revisión del ' + esc(X.revisado) + '.' : ''}</p></div>`;

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>

const tocAA1 = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])

  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => !isAA2(s)).map(([s, i]) => ['s' + i, s.titulo, s.observaciones.length]));

  .concat(D.notasAA2 ? [['nota-aa2', 'Calificación AA2 (/20)', '']] : D.calificacionAA2 ? [['nota-aa2', 'Calificación parcial', '']] : [])
  .concat(D.prototipoHtml ? [['prototipo-aa2', 'Prototipo', '']] : [])
  .concat(D.costosAA2 ? [['costos-aa2', 'Costos de nube', '']] : [])
  .concat(D.excelPE ? [['excel-pe', 'Excel de punto de equilibrio', '']] : [])
  .concat(D.secciones.map((s, i) => [s, i]).filter(([s]) => isAA2(s)).map(([s, i]) => ['s' + i, (s.etiqueta || '').replace(/^AA2\s*·\s*/, '') || s.titulo, s.observaciones.length]));
const tocHtml = lista => lista.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');
function showTab(name) {
  if (!hasAA2) name = 'aa1';
  const p1 = document.getElementById('tab-aa1'), p2 = document.getElementById('tab-aa2');
  if (p1) p1.hidden = name !== 'aa1';
  if (p2) p2.hidden = name !== 'aa2';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('toc').innerHTML = tocHtml(name === 'aa2' ? tocAA2 : tocAA1);
  try { history.replaceState(null, '', name === 'aa2' ? '#evidencia-2' : location.pathname + location.search); } catch (err) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
showTab(hasAA2 && location.hash === '#evidencia-2' ? 'aa2' : 'aa1');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>
