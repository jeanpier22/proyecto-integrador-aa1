<style>
/* Layout: informe de revisión de tesina — columna de lectura centrada, índice lateral fijo en escritorio, sellos de severidad en el margen */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #5b6475;
  --rule: #dde1e8;
  --accent: #1f3a68;
  --accent-soft: #e8edf6;
  --crit: #a3262b;   --crit-bg: #fbeceb;
  --warn: #8a5a00;   --warn-bg: #fdf3df;
  --sug: #1d6a55;    --sug-bg: #e6f3ee;
  --ok: #1d6a55;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #191d26; --ink: #e6e9ef; --muted: #9aa3b4; --rule: #2c3240;
  --accent: #9db7e6; --accent-soft: #1f2a40;
  --crit: #f08c8f; --crit-bg: #3a1c1f; --warn: #e8bd6a; --warn-bg: #3a2e14; --sug: #7fcfb4; --sug-bg: #15312a; --ok: #7fcfb4;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } nav.toc { position: static !important; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13.5px; }
nav.toc .lbl, .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
nav.toc ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); outline: none; }
nav.toc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

main { min-width: 0; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }

.demo { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; }

header.cover { border-bottom: 2px solid var(--accent); padding-bottom: 24px; display: grid; gap: 14px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; margin-top: 6px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meta dd { margin: 0; font-weight: 500; }
.members { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.verdict { display: grid; gap: 14px; }
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--accent); }
.stamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.stamp.mayor { color: var(--crit); } .stamp.menor { color: var(--warn); } .stamp.apto { color: var(--ok); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.critico { background: var(--crit-bg); color: var(--crit); }
.pill.importante { background: var(--warn-bg); color: var(--warn); }
.pill.sugerencia { background: var(--sug-bg); color: var(--sug); }

.priorities { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.priorities li::before { content: counter(p); font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.4; }

section.block { display: grid; gap: 18px; scroll-margin-top: 24px; }
section.block > .head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.summary { color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-weight: 600; white-space: nowrap; }
.st.completo { color: var(--ok); } .st.incompleto { color: var(--warn); } .st.ausente { color: var(--crit); }

.obs { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ob { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.ob.done { opacity: .6; }
.ob .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ob .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ob blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rule); color: var(--muted); font-family: var(--display); font-style: italic; font-size: 14.5px; }
.ob .fix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.ob .fix b { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.8; }
.ob label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; justify-self: start; }
.ob input { accent-color: var(--accent); width: 16px; height: 16px; }
.grade { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); color: var(--accent); }
.grade .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .of { font-size: 22px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.l4, .lvl.l3 { background: var(--sug-bg); color: var(--sug); }
.lvl.l2 { background: var(--warn-bg); color: var(--warn); }
.lvl.l1, .lvl.l0 { background: var(--crit-bg); color: var(--crit); }
.ideas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.strength { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.strength li::before { content: "✓  "; color: var(--ok); font-weight: 700; }

.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script type="application/json" id="data">{"id": "grupo-1", "institucion": "CERTUS", "curso": "UD Proyecto Integrador", "evidencia": "AA1", "alcance": "capítulos 1, 2 y 3 (planteamiento del problema, propuesta de valor y modelo de negocio).", "proyecto": "Stockly: plataforma web de gestión de inventarios con catálogo y pedidos por WhatsApp para bodegas de Arequipa", "grupo": "1", "seccion": "394 - 616 M", "fecha": "04/11/2026", "docente": "Jeanpier Brandol Ancori Sanchez", "integrantes": ["Solanch Coaquira Quispe", "Camila Mamani Nina", "Erick Acrota Huisa", "Jhon Hancco Yucra"], "dictamen": "menor", "resumen": "La nueva versión mejora de forma notable el informe. Se completaron los apartados que estaban vacíos: el precio (2.2.4, S/ 74,90 con una tabla de costos), los casos de uso (2.6.1 y 2.6.2) y los 9 bloques del BMC, que además se presenta como lienzo (pp. 33-34). El análisis de competencia pasó de un solo competidor de gastronomía a cuatro alternativas peruanas (Stoka, Stokr, Clarito y Bsale) con tabla comparativa, y la ventaja competitiva (3.3.4) ya describe la de Stockly. También se completaron el índice y la carátula (sección y carreras), y los indicadores incluyen meta, ejemplo de cálculo y dos indicadores del negocio (CAC y MRR). Persisten, sin embargo, observaciones de fondo: los ODS cambiaron a 3 y 12 y el propio texto reconoce que el ODS 3 “deberá justificarse mejor” (p. 4); la megatendencia se declara, pero sin fuente que la respalde; PRODUCE (2025) e Hidalgo Vergara y Xiao (2022) siguen sin figurar en las referencias; la cita de la Asociación de Bodegueros sigue sin sustento; no hay cifras del sector bodeguero de Arequipa; el segmento y el precio no son uniformes (S/ 74,90 frente a S/ 85); y el mapa de empatía sigue siendo genérico. Aparecen además frases que parecen comentarios de revisión pegados en el texto y restos de otro modelo de negocio (“visitas válidas”, “tráfico no válido”).", "fortalezas": ["Mejora clara respecto de la versión anterior: se completaron 2.2.4 (precio), 2.6 (dos casos de uso, el segundo con flujo paso a paso del consumidor) y los bloques e) a i) del BMC, que además se presenta como lienzo (pp. 33-34).", "El análisis de competencia es ahora pertinente: compara Stoka, Stokr, Clarito y Bsale Perú con precios publicados y reconoce que Clarito ya ofrece catálogo por WhatsApp en su plan Pro (S/ 59), lo que muestra honestidad en el análisis (pp. 34-37).", "La redacción es ahora mayormente impersonal y cautelosa; por ejemplo, evita afirmar efectos no comprobados (“podrían contribuir”, “dependerá de que los movimientos se registren correctamente”, p. 23).", "Los indicadores de gestión (3.4, pp. 38-40) tienen fórmula, meta y ejemplo de cálculo, e incluyen indicadores del negocio como el costo de adquisición (CAC) y el ingreso recurrente mensual (MRR)."], "prioridades": ["Sustentar el vínculo con los ODS y la megatendencia: justificar el ODS 3 con una meta específica o reemplazarlo (el ODS 8 y su meta 8.3 de la versión anterior era más sólido), y citar una fuente oficial para la megatendencia (por ejemplo, CEPLAN). Retirar del texto frases como “deberá justificarse mejor” (p. 4).", "Completar las referencias APA 7: agregar PRODUCE (2025) e Hidalgo Vergara y Xiao (2022), la fuente de la declaración de Andrés Choy (ABP) o retirarla, y las páginas oficiales de Stoka, Stokr, Clarito y Bsale con fecha de consulta.", "Dimensionar el problema en Arequipa con cifras de bodegas (cuántas hay, qué porcentaje lleva control manual, cuánto pierden por mermas o quiebres de stock) y reemplazar el “miles de bodegueros” del elevator pitch por un dato citado.", "Unificar el segmento (bodegas y tiendas de abarrotes como segmento inicial; farmacias, librerías, ferreterías y tiendas de ropa como expansión) y el precio (S/ 74,90 en 2.2.4, 3.3.5 y el pitch; S/ 85 en 2.5.4 y en el MRR de 3.4). Sustentar la disposición de pago y explicar por qué cobrar más que Clarito Pro (S/ 59) o Stoka (desde S/ 45).", "Pulir el documento: eliminar restos de otro modelo (“visitas válidas”, “tráfico no válido”), completar el costo pendiente de Cloud Run (“Falta estimar un precio…”, p. 13), el segundo plan de contratación y corregir “Stocka”, “lataforma”, la numeración de tablas y figuras, y los números de página del índice."], "camino": [{"criterio": "Fuentes de información", "exige": "Fuentes secundarias actualizadas y confiables, analizadas críticamente y vinculadas con megatendencias y ODS.", "falta": "Respaldar el ODS 3 y la megatendencia con fuentes oficiales (ONU, CEPLAN); incorporar a las referencias PRODUCE (2025) e Hidalgo Vergara y Xiao (2022); sustentar o retirar la cita de la ABP; y sumar una fuente con cifras del sector bodeguero y las páginas de los competidores consultadas."}, {"criterio": "Planteamiento del problema", "exige": "Pertinencia del problema sustentada con evidencia cualitativa y cuantitativa, con vínculo explícito a megatendencias, ODS y necesidades del cliente.", "falta": "Vincular el problema de forma sólida con los ODS elegidos, respaldar la megatendencia con una fuente y aportar cifras de bodegas de Arequipa (no solo de mypes en general). Hoy el capítulo plantea muchas veces lo que “deberá investigarse”."}, {"criterio": "Propuesta de valor", "exige": "Propuesta innovadora y diferenciada, con descripción, ficha técnica, soluciones, segmentos y casos de uso coherentes con el problema.", "falta": "Unificar el segmento y el precio entre capítulos y demostrar el diferencial frente a Clarito Pro, que ya ofrece catálogo por WhatsApp a un precio menor."}, {"criterio": "Modelo de negocio", "exige": "BMC y mapa de empatía que argumentan la coherencia entre los 9 bloques y la propuesta de valor.", "falta": "Alinear el mapa de empatía con el segmento principal y con frases de bodegueros reales, numerar el lienzo como figura y cerrar con un párrafo que explique cómo se conectan los 9 bloques."}], "viabilidad": {"resumen": "Stockly sigue respondiendo a un dolor real de las bodegas, y la nueva versión muestra que los autores ya conocen a sus competidores. El reto es que Clarito, Stoka y otros ya ofrecen control de inventario, y Clarito incluso catálogo por WhatsApp, a precios iguales o menores que los S/ 74,90 propuestos.", "riesgos": [{"tema": "Competencia", "titulo": "Competidores directos más baratos y con funciones similares", "choque": "Clarito Pro cuesta S/ 59 mensuales e incluye catálogo compartible por WhatsApp (p. 35); Stoka tiene un plan desde S/ 45. Stockly cobraría S/ 74,90 por una oferta que, en lo declarado, no se diferencia claramente de la de Clarito. La tabla de competidores (pp. 35-36) no incluye a Bsale ni muestra qué hace Stockly que ellos no hacen. Tampoco se analizan las alternativas gratuitas (catálogo de WhatsApp Business, el cuaderno o Excel).", "ideas": ["Agregar a la tabla comparativa una fila con Stockly y una columna de Bsale, y marcar con claridad dónde Stockly es mejor (por ejemplo, el vínculo catálogo-stock-pedido, la asesoría del primer mes o la función de IA con boletas).", "Probar durante una semana el plan Pro de Clarito y el catálogo gratuito de WhatsApp Business para identificar qué le falta a cada uno.", "En la AA2, preguntar a bodegueros qué usan hoy, cuánto pagan y por qué cambiarían."]}, {"tema": "Mercado", "titulo": "Precio, disposición de pago y precio incoherente", "choque": "El informe menciona S/ 74,90 (2.2.4, 3.3.5, pitch) y S/ 85,00 (2.5.4 d, MRR en 3.4). Para una bodega de NSE C o D el pago mensual es relevante, y la “disposición de pago identificada en el proyecto” (p. 38) no se muestra. El plan mensual aparece como una única viñeta, aunque el BMC contempla una suscripción anual.", "ideas": ["Fijar una sola cifra de precio y explicar cómo se calculó, comparándola con los competidores.", "Validar el precio en la AA2 con preguntas de rango, por ejemplo con el método de Van Westendorp.", "Evaluar un plan básico sin catálogo y uno completo con catálogo, similar a la estructura de Clarito."]}, {"tema": "Costos", "titulo": "Costos recurrentes altos frente al ingreso por cliente", "choque": "La tabla de costos (pp. 13-14) suma cerca de S/ 460 mensuales (S/ 125 + 172,88 + 20 + 117,69 + 25), más S/ 5 700 de desarrollo inicial, con un costo de Cloud Run aún por estimar. A S/ 74,90 por cliente, se necesitarían alrededor de 6 clientes solo para cubrir la infraestructura, sin contar soporte ni captación. El indicador de MRR de la p. 40 proyecta S/ 1 700 con 20 clientes.", "ideas": ["Calcular el punto de equilibrio en número de clientes, considerando costos fijos, variables y de captación.", "Confirmar si el costo de IA por S/ 117,69 se mantiene fijo o crece con el número de boletas procesadas.", "Estimar el CAC con base en visitas reales y no solo con el supuesto de S/ 30."]}, {"tema": "Adopción", "titulo": "El bodeguero no registra cada venta", "choque": "El texto reconoce que la actualización del stock depende de que “las operaciones se ingresen correctamente” (p. 12). Si no se registran las ventas, las alertas y el catálogo pierden confiabilidad, que es justamente el problema que se quiere resolver. La IA para leer boletas (p. 13) podría ayudar, pero no se desarrolla en la ficha técnica.", "ideas": ["Medir en una bodega piloto cuánto tiempo toma registrar las ventas de un día y cuántas quedan sin registrar.", "Describir en 2.2.3 cómo funcionan la lectura de código de barras (mencionada en el pitch y en la p. 9) y la IA de boletas, o retirarlas."]}, {"tema": "Regulación", "titulo": "Datos personales y comprobantes", "choque": "El catálogo con pedidos almacena nombres y teléfonos de consumidores, por lo que se aplica la Ley 29733 de Protección de Datos Personales. Además, Bsale ofrece emisión de comprobantes SUNAT, algo que Stockly no incluye y que algunas bodegas formales necesitan.", "ideas": ["Averiguar en la Autoridad Nacional de Protección de Datos Personales las obligaciones de una plataforma que almacena datos de terceros.", "Decidir si Stockly se posicionará como complemento de un facturador existente o integrará la emisión de comprobantes."]}]}, "estructura": [{"codigo": "—", "apartado": "Carátula con integrantes", "estado": "completo", "nota": "Mejoró: ahora indica sección (394 - 616 M) y carrera de cada integrante (Dirección de empresas). Aún falta el nombre comercial del proyecto (Stockly) en el título, y el nombre de archivo debería seguir el formato indicado."}, {"codigo": "—", "apartado": "Índice", "estado": "incompleto", "nota": "Mejoró: ahora tiene contenido. Los números de página no coinciden con el documento (por ejemplo, 2.2.4 figura en la p. 12 y aparece en la p. 13; 3.2 figura en la p. 26 y aparece en la p. 27)."}, {"codigo": "1.1", "apartado": "ODS (problema social)", "estado": "incompleto", "nota": "Cambiaron a los ODS 3 y 12. El texto reconoce que el vínculo con el ODS 3 “deberá justificarse mejor” (p. 4). No se indica meta específica ni fuente de la ONU."}, {"codigo": "1.2", "apartado": "Megatendencias", "estado": "incompleto", "nota": "Mejoró: se declaran la transformación digital y la sostenibilidad (p. 5), pero no se cita una fuente oficial de megatendencias; Dini et al. (2021) trata de la digitalización de las mipymes."}, {"codigo": "1.3", "apartado": "Línea de investigación", "estado": "incompleto", "nota": "Se indica “Tradicional” (p. 6) sin explicar a qué línea de CERTUS corresponde ni citar la fuente de esa línea."}, {"codigo": "1.4", "apartado": "Definición del problema (causas y consecuencias)", "estado": "incompleto", "nota": "Mejoró en redacción y causas/consecuencias (pp. 6-9). Faltan cifras de bodegas de Arequipa y la cita de la ABP no se sustenta (p. 8). El texto usa “nuestra propuesta” y “hemos comprobado” (pp. 8-9)."}, {"codigo": "2.1", "apartado": "Descripción de la propuesta de valor", "estado": "completo", "nota": ""}, {"codigo": "2.2", "apartado": "Ficha técnica", "estado": "completo", "nota": "Mejoró: tiene los 8 campos. 2.2.4 trae precio, pero el plan mensual aparece como única modalidad pese a anunciar dos, y la tabla de costos no tiene título ni introducción."}, {"codigo": "2.3", "apartado": "Beneficios clave", "estado": "completo", "nota": ""}, {"codigo": "2.4", "apartado": "Solución a problemas o necesidades", "estado": "completo", "nota": ""}, {"codigo": "2.5", "apartado": "Segmentos de cliente", "estado": "incompleto", "nota": "Bien trabajados, pero 2.5.2 b) incluye farmacias, librerías y ferreterías, y 2.5.4 d) cita S/ 85,00 frente a S/ 74,90 del resto del informe."}, {"codigo": "2.6", "apartado": "Casos de uso", "estado": "completo", "nota": "Mejoró: hay dos casos (bodeguero y consumidora) bien explicados. El caso 1 es un párrafo largo que se podría ordenar en pasos."}, {"codigo": "3.1", "apartado": "Mapa de empatía", "estado": "incompleto", "nota": "Tiene los 6 cuadrantes, pero el texto sigue siendo genérico y menciona tiendas de ropa y accesorios (p. 24). No se indica si se basó en entrevistas."}, {"codigo": "3.2", "apartado": "Business Model Canvas (9 bloques)", "estado": "completo", "nota": "Mejoró: desarrolla los 9 bloques en texto y presenta el lienzo (pp. 33-34). Falta numerar la figura y revisar que el lienzo y el texto coincidan (por ejemplo, pasarelas de pago y alianzas financieras solo aparecen en el lienzo)."}, {"codigo": "3.3", "apartado": "Competidores", "estado": "completo", "nota": "Mejoró: 4 competidores y tabla comparativa. La tabla omite Bsale y a Stockly, y los competidores no figuran en las referencias."}, {"codigo": "3.4", "apartado": "Indicadores de gestión", "estado": "completo", "nota": "Mejoró: incluye meta, ejemplo de cálculo, CAC y MRR. El MRR usa S/ 85, no S/ 74,90."}, {"codigo": "—", "apartado": "Bibliografía APA 7", "estado": "incompleto", "nota": "Mejoró: Gómez Quispe y Puican Rodríguez ya están correctamente. Faltan PRODUCE (2025), Hidalgo Vergara y Xiao (2022) y la fuente de la ABP; las páginas de competidores no se citan, y la sección se titula “Bibliografía”."}], "secciones": [{"etiqueta": "Capítulo I", "titulo": "Planteamiento del problema", "resumen": "El capítulo ya está organizado (ODS, megatendencias, línea de investigación y definición del problema) y se apoya en buenas fuentes. Sin embargo, el vínculo con los ODS cambió y quedó débil, la megatendencia no tiene fuente y faltan cifras del sector bodeguero.", "observaciones": [{"severidad": "critico", "titulo": "El ODS 3 no está justificado y el texto lo reconoce", "ubicacion": "1.1.1, p. 4", "cita": "Sin embargo, la relación directa de Stockly con el ODS 3 deberá justificarse mejor, ya que la propuesta está enfocada principalmente en la administración de inventarios", "problema": "La versión anterior declaraba los ODS 8 (meta 8.3) y 9, que sí se vinculaban con el proyecto. En esta versión se reemplazaron por los ODS 3 y 12, y para el ODS 3 el propio texto admite que la relación no está sustentada; esa frase parece un comentario de revisión que quedó dentro del documento. No se indica la meta específica de ningún ODS ni se cita la fuente de la ONU.", "mejora": "Retomar los ODS 8 (meta 8.3) y 9, o reemplazar el ODS 3 por uno que se pueda argumentar, y citar la fuente de Naciones Unidas con la meta específica. Eliminar de inmediato las frases que parecen notas de revisión. El ODS 12 está bien planteado (mermas y vencimientos) y puede mantenerse con su meta (por ejemplo, 12.3 o 12.5)."}, {"severidad": "importante", "titulo": "La megatendencia se declara, pero sin fuente que la respalde", "ubicacion": "1.2 y 1.2.1, pp. 5-6", "cita": "La transformación digital y la sostenibilidad representan aspectos importantes para el desarrollo de los pequeños negocios", "problema": "Mejora respecto de la versión anterior, que no declaraba ninguna megatendencia. Ahora se mencionan la transformación digital y la sostenibilidad, pero no se cita un documento oficial de megatendencias. Dini et al. (2021) trata de la digitalización de las mipymes, no define una megatendencia. La sección 1.2.1 “Sostenibilidad y ecología” no tiene citas.", "mejora": "Elegir una megatendencia y sustentarla con una fuente oficial (por ejemplo, el informe de megatendencias de CEPLAN u otro organismo), explicar cómo afecta a las bodegas y por qué hace pertinente a Stockly. Citar fuente también en 1.2.1."}, {"severidad": "importante", "titulo": "Faltan cifras del sector bodeguero en Arequipa", "ubicacion": "1.4, pp. 7-9", "cita": "Arequipa concentraba 136 988 MYPE formales", "problema": "Las cifras (2 638 421 empresas, 55,4 % cesadas, 2 326 126 mypes, 136 988 en Arequipa) corresponden a mypes de todos los rubros, no a bodegas. No se sabe cuántas bodegas hay en Arequipa, qué porcentaje controla su inventario en cuaderno ni cuánto pierden por mermas. Además, varias causas quedan planteadas como pendientes (“deberán investigarse”, p. 7; “será importante investigar”, p. 8), lo que debilita la pertinencia del problema.", "mejora": "Buscar 2 o 3 datos del canal tradicional en INEI, Ipsos, Kantar o gremios de bodegueros, con año y cita. Redactar las causas como hallazgos sustentados y dejar lo que no se ha comprobado como hipótesis que se validará en la AA2."}, {"severidad": "importante", "titulo": "La cita de la Asociación de Bodegueros sigue sin sustento", "ubicacion": "1.4, p. 8", "cita": "Andrés Choy, presidente de la Asociación de Bodegueros del Perú (ABP), señala que…", "problema": "Persiste la observación anterior: se atribuye una afirmación a una persona sin año, sin documento ni entrevista, y la entrada ni siquiera figura ya en la lista de referencias (p. 42).", "mejora": "Ubicar la declaración original (medio, fecha, enlace) y citarla en formato autor-año, o reemplazarla por una fuente verificable."}, {"severidad": "importante", "titulo": "Fuentes citadas que no están en las referencias", "ubicacion": "1.4, pp. 7 y 9", "cita": "Según el Ministerio de la Producción (PRODUCE, 2025)", "problema": "PRODUCE (2025) e Hidalgo Vergara y Xiao (2022) aparecen en el texto, pero no en la lista de referencias. Es el segundo informe consecutivo en el que esta observación persiste. Las cifras clave del problema dependen de esa fuente.", "mejora": "Agregar ambas entradas con el formato APA 7: autor institucional, año, título del informe y enlace de acceso."}, {"severidad": "sugerencia", "titulo": "Lenguaje en primera persona y afirmaciones no comprobadas", "ubicacion": "1.4, pp. 8-9", "cita": "los efectos operativos que hemos comprobado y los impactos sociales en la comunidad que todavía necesitamos validar", "problema": "Se mantiene el “hemos comprobado”, afirmación que el informe no demuestra, y “nuestra propuesta” (p. 9). También hay textos repetidos: Dini et al. (2021) y Puican Rodríguez et al. (2025) se explican dos o tres veces (pp. 5, 7 y 8).", "mejora": "Redactar en forma impersonal (“se plantea”, “la propuesta”) y condensar las ideas repetidas para ganar espacio para las cifras que faltan."}, {"severidad": "sugerencia", "titulo": "Línea de investigación sin explicación", "ubicacion": "1.3.1, p. 6", "cita": "1.3.1. Tradicional", "problema": "El apartado indica “Tradicional” como subtítulo, pero no explica a qué línea de investigación de CERTUS corresponde el proyecto ni cómo se vincula con ella.", "mejora": "Nombrar la línea de investigación de CERTUS en la que se enmarca el proyecto y justificar el vínculo en un párrafo."}]}, {"etiqueta": "Capítulo II", "titulo": "Propuesta de valor", "resumen": "Mejoró de forma importante: la ficha técnica está completa (con precio) y hay dos casos de uso. Quedan por resolver la coherencia del segmento y del precio entre capítulos y el diferencial frente a competidores similares.", "observaciones": [{"severidad": "importante", "titulo": "El precio no es el mismo en todo el documento", "ubicacion": "2.2.4, p. 13; 2.5.4 d), p. 23; 3.4, p. 40", "cita": "Se establece una tarifa mensual propuesta de S/74.90 por establecimiento", "problema": "El precio se establece en S/ 74,90 en 2.2.4, 3.3.5 y el pitch, pero 2.5.4 d) menciona “S/ 85.00” y el indicador MRR de 3.4 usa “20 clientes × S/ 85 = S/ 1,700”. Además, 2.2.4 anuncia “dos modalidades de contratación” y solo desarrolla el plan mensual, mientras que el BMC (p. 28) habla de una suscripción anual preferencial.", "mejora": "Usar una sola cifra en todo el documento (y recalcular el MRR), desarrollar la segunda modalidad (plan anual con su precio) y explicar cómo se calculó el monto frente a la competencia."}, {"severidad": "importante", "titulo": "El segmento cambia de un capítulo a otro", "ubicacion": "2.1, 2.5.2 b), 3.1", "cita": "Dueños, gestores o responsables directos de farmacias independientes, minimarkets, tiendas de abarrotes, librerías, ferreterías y almacenes.", "problema": "El capítulo 1 y el nombre del proyecto se centran en bodegas, pero 2.5.2 agrega farmacias, librerías y ferreterías, y el mapa de empatía (p. 24) incluye tiendas de ropa y accesorios. Cada rubro tiene necesidades distintas (vencimientos, tallas, miles de códigos), y la propuesta pierde foco. Esta observación persiste de la versión anterior.", "mejora": "Elegir un segmento inicial (bodegas y tiendas de abarrotes) y mencionar los demás como expansión futura. Ajustar 2.5, 3.1 y el bloque de segmentos del BMC para que digan lo mismo."}, {"severidad": "importante", "titulo": "La disposición de pago se afirma sin evidencia", "ubicacion": "2.5.4 d), p. 23; 3.3.5, p. 38", "cita": "Muestran una alta disposición a adoptar herramientas digitales siempre que… representen un costo mensual accesible (S/ 85.00).", "problema": "Sigue sin indicarse de dónde sale esta conclusión (entrevistas, encuesta, fuente). En 3.3.5 se menciona “la disposición de pago identificada en el proyecto”, que el informe no muestra.", "mejora": "Si hubo entrevistas, indicar cuántas y qué respondieron en un anexo. Si no, presentarlo como supuesto que se validará en la AA2."}, {"severidad": "sugerencia", "titulo": "Funciones mencionadas que no están desarrolladas en la ficha técnica", "ubicacion": "1.4, p. 9; 2.2.4, p. 13; 4.2, p. 40", "cita": "facilitar el registro de productos mediante un lector de códigos de barras", "problema": "El lector de códigos de barras (p. 9) y la inteligencia artificial para registrar boletas (p. 13) no figuran en las especificaciones (p. 10-11) ni en 2.2.3, aunque el pitch ofrece “escanear productos” y la IA genera un costo mensual de S/ 117,69.", "mejora": "Decidir si ambas funciones forman parte de la primera versión. Si es así, agregarlas a 2.2.2 y 2.2.3 con una explicación de cómo funcionan; si no, retirarlas del texto y de la tabla de costos."}, {"severidad": "sugerencia", "titulo": "La tabla de costos aparece sin título ni introducción dentro de 2.2.4", "ubicacion": "2.2.4, pp. 13-14", "cita": "Falta estimar un precio en base a nuestro programa", "problema": "La tabla de costos aparece de forma abrupta después de la primera viñeta del plan mensual, sin número ni título, y tiene una celda con una nota pendiente (“Falta estimar un precio…”) para Google Cloud Run.", "mejora": "Introducir la tabla en el texto, numerarla, titularla y completar el costo de Cloud Run. Ubicarla mejor dentro de la estructura de costos del BMC."}]}, {"etiqueta": "Capítulo III", "titulo": "Modelo de negocio", "resumen": "El BMC está completo y con lienzo, y la competencia se analiza ahora con cuatro alternativas reales. Faltan un mapa de empatía alineado con el segmento y demostrar el diferencial frente a Clarito Pro.", "observaciones": [{"severidad": "importante", "titulo": "El diferencial frente a Clarito y Stoka no está demostrado", "ubicacion": "3.3.4 y 3.3.5, pp. 37-38", "cita": "La principal ventaja competitiva de Stockly radica en integrar el control de inventarios con la gestión de pedidos y la consulta de productos mediante un catálogo web sincronizado", "problema": "Mejoró: 3.3.4 ya describe la ventaja de Stockly. Sin embargo, el informe reconoce que Clarito Pro (S/ 59) ya ofrece catálogo compartible por WhatsApp, y Stoka parte de S/ 45; Stockly cuesta S/ 74,90. La ventaja se plantea de forma general (“busca centralizar”), sin indicar qué función concreta no tienen las demás o por qué sería difícil de copiar.", "mejora": "Indicar con claridad qué hace Stockly que Clarito y Stoka no hacen (por ejemplo, el pedido que descuenta stock, la IA para boletas o el acompañamiento del primer mes) y justificar por qué el cliente pagaría más. Agregar a Stockly como columna en la tabla comparativa."}, {"severidad": "importante", "titulo": "Mapa de empatía genérico y con segmento distinto", "ubicacion": "3.1, pp. 24-26", "cita": "Entre los negocios que podrían utilizar la plataforma se encuentran bodegas, minimarkets, tiendas de ropa, tiendas de accesorios y otros pequeños comercios", "problema": "Persiste la observación anterior: los enunciados podrían aplicarse a cualquier emprendedor (“Le preocupa mantener su negocio funcionando y obtener ganancias”), no reflejan el perfil de 2.5 (desconfianza ante herramientas complejas, uso de Yape y Plin) y no se indica si se basan en entrevistas. Tampoco hay figura con los 6 cuadrantes.", "mejora": "Presentar el mapa como figura numerada, centrarlo en el bodeguero y alimentarlo con frases reales de 3 a 5 bodegueros entrevistados, indicando cuándo y cuántos."}, {"severidad": "importante", "titulo": "Restos de otro modelo de negocio en el BMC y la tabla de costos", "ubicacion": "3.2 g), p. 30; 2.2.6, p. 15", "cita": "verificando el número de visitas válidas o el nivel de utilización de cada cuenta", "problema": "La actividad “Gestión del uso y facturación” habla de “visitas válidas” y “reportes de consumo”, y la tabla de costos (p. 15) incluye “Medición de visitas… tráfico no válido”. Eso corresponde a un modelo de cobro por visitas, que no es el de Stockly (suscripción mensual). Genera incoherencia con el bloque de ingresos.", "mejora": "Reemplazar esos textos por actividades propias de una suscripción (cobro mensual, renovación, control de pagos) y quitar la fila de “Medición de visitas” de la tabla."}, {"severidad": "sugerencia", "titulo": "Tabla comparativa incompleta y fuentes de competidores no citadas", "ubicacion": "3.3.1 a 3.3.3, pp. 34-37", "cita": "a) Stocka", "problema": "La tabla (pp. 35-36) compara a Stoka, Stokr y Clarito, pero no a Bsale ni a Stockly, y varias celdas dicen “No especificado en la información recopilada”. El nombre aparece como “Stocka” en 3.3.3 y “lataforma” en 3.3.1. Los precios y funciones provienen de páginas web que no figuran en las referencias, y la tabla no tiene número ni título.", "mejora": "Completar las celdas con la información de cada web oficial (con fecha de consulta), agregar a Bsale y a Stockly, numerar la tabla y citar las páginas en APA 7."}, {"severidad": "sugerencia", "titulo": "BMC: falta numerar la figura y explicar la coherencia entre bloques", "ubicacion": "3.2, pp. 27-34", "cita": "Fuente: Elaboracion propia", "problema": "Mejoró: el BMC tiene sus 9 bloques y el lienzo. Falta numerar el lienzo como figura, introducirlo en el texto y cerrar con un párrafo que explique la coherencia entre bloques y la propuesta de valor, como pide la rúbrica. El lienzo incluye elementos que no se explican en el texto (pasarelas de pago, alianzas financieras).", "mejora": "Agregar “Figura N” con título, una introducción breve y un párrafo final de coherencia. Revisar que lienzo y texto coincidan."}]}, {"etiqueta": "Formato académico", "titulo": "Presentación, redacción y citas", "resumen": "El formato mejoró (carátula e índice completos), pero siguen pendientes la numeración de tablas y figuras, las referencias y varios errores de redacción.", "observaciones": [{"severidad": "importante", "titulo": "Referencias incompletas y sin las fuentes de los competidores", "ubicacion": "Bibliografía, p. 42", "cita": "Bibliografía", "problema": "Mejoró: ya no hay duplicados y Gómez Quispe y Puican Rodríguez están bien formateados. Pero faltan PRODUCE (2025), Hidalgo Vergara y Xiao (2022), la fuente de la ABP, una fuente de los ODS y las páginas de Stoka, Stokr, Clarito y Bsale. La sección se llama “Bibliografía” y no “Referencias” (APA 7). Además, no se aplica sangría francesa.", "mejora": "Verificar que toda cita del texto esté en la lista y viceversa, titular la sección “Referencias” y usar sangría francesa."}, {"severidad": "importante", "titulo": "Tablas y figuras sin numeración ni título", "ubicacion": "pp. 10-11, 13-15, 19, 35-36, 38-40", "cita": "Fuente: Elaboración propia", "problema": "Las tablas de especificaciones, de costos, de competidores y de indicadores, y las imágenes del prototipo y del BMC, tienen nota de fuente (mejora), pero siguen sin “Tabla N” o “Figura N” ni título. Hay un párrafo de introducción que falta antes de varias.", "mejora": "Aplicar APA 7: “Tabla N” o “Figura N” en negrita, título en cursiva debajo y “Fuente:” al pie. Introducir cada una en el texto."}, {"severidad": "sugerencia", "titulo": "Índice con páginas desfasadas y errores de redacción", "ubicacion": "Índice (pp. 2-3); pp. 12, 34, 40", "cita": "e) e) Catálogo web interactivo", "problema": "Los números de página del índice no coinciden (por ejemplo, 2.2.4 figura en la p. 12 y está en la p. 13), aparecen errores como “e) e)”, “Stocka”, “lataforma”, “Elaboracion”, “nuestro público objetivo” (p. 27) o “S/74.90 soles” (p. 40).", "mejora": "Actualizar el índice automático al final y hacer una última lectura ortográfica y de estilo impersonal."}, {"severidad": "sugerencia", "titulo": "Dato del elevator pitch mal interpretado y afirmación sin cifra", "ubicacion": "4.2, p. 40", "cita": "¿Sabías que la mayoría de las MYPEs comerciales quiebran por fallas en su gestión? En Arequipa, miles de bodegueros usan cuadernos", "problema": "Mejoró: ya no se cita el 55,4 %, pero la afirmación “la mayoría de las MYPEs quiebran por fallas en su gestión” sigue sin dato verificable (PRODUCE habla de empresas formales que cesaron operaciones, no de causas) y “miles de bodegueros” no tiene fuente. El pitch ya incluye el precio completo.", "mejora": "Usar datos tal como los reporta la fuente (“según PRODUCE (2025), el 55,4 % de empresas formales creadas entre 2007 y 2024 cesó operaciones”) y citar una cifra sobre bodegas de Arequipa."}]}], "calificacion": {"fuentes": 2, "problema": 3, "propuesta": 3, "modelo": 3, "responsabilidad": 3}}</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = { critico: 'Crítico', importante: 'Importante', sugerencia: 'Sugerencia' };
const ST = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'Ausente' };
const DICT = { mayor: 'Requiere correcciones mayores', menor: 'Requiere correcciones menores', apto: 'Apto para continuar' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'tap-revision-' + (D.id || 'x');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const all = D.secciones.flatMap(s => s.observaciones.map(o => o.severidad));
const count = sev => all.filter(x => x === sev).length;

let html = '';
if (D.ejemplo) html += `<div class="demo">Ejemplo con datos ficticios: así verá cada grupo su revisión.</div>`;
html += `<header class="cover">
  <div class="eyebrow">${esc(D.institucion)} · ${esc(D.curso)} · ${esc(D.evidencia)}</div>
  <h1>${esc(D.proyecto)}</h1>
  <p class="summary">Revisión del Trabajo de Aplicación Profesional (TAP): ${esc(D.alcance)}</p>
  <dl class="meta">
    <div><dt>Grupo</dt><dd>${esc(D.grupo)}</dd></div>
    <div><dt>Sección</dt><dd>${esc(D.seccion)}</dd></div>
    <div><dt>Fecha de revisión</dt><dd>${esc(D.fecha)}</dd></div>
    <div><dt>Docente</dt><dd>${esc(D.docente)}</dd></div>
  </dl>
  <div><div class="eyebrow" style="margin-bottom:4px">Integrantes</div>
  <ul class="members">${D.integrantes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
</header>`;

html += `<section class="block verdict" id="dictamen">
  <div class="head"><div class="eyebrow">Dictamen</div><h2>Estado del informe</h2></div>
  <div class="stamp ${esc(D.dictamen)}">${DICT[D.dictamen] || esc(D.dictamen)}</div>
  <div class="counts">
    <span class="pill critico">${count('critico')} críticas</span>
    <span class="pill importante">${count('importante')} importantes</span>
    <span class="pill sugerencia">${count('sugerencia')} sugerencias</span>
  </div>
  <p>${esc(D.resumen)}</p>
  ${D.fortalezas?.length ? `<div><h3 style="margin-bottom:8px">Lo que está bien</h3><ul class="strength">${D.fortalezas.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
</section>`;

if (D.calificacion) {
  const C = D.calificacion;
  const NIV = { 4: 'Sobresaliente', 3: 'Logrado', 2: 'En proceso', 1: 'Inicio', 0: 'No presentó' };
  const filas = [['Fuentes de información', C.fuentes], ['Planteamiento del problema', C.problema],
    ['Propuesta de valor', C.propuesta], ['Modelo de negocio', C.modelo], ['Responsabilidad en la ejecución', C.responsabilidad]];
  const total = filas.reduce((s, f) => s + (Number(f[1]) || 0), 0);
  html += `<section class="block" id="nota">
    <div class="head"><div class="eyebrow">Rúbrica de la ${esc(D.evidencia)}</div><h2>Calificación preliminar del informe</h2></div>
    <div class="grade"><span class="big">${total}</span><span class="of">/ 20</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterio</th><th>Nivel</th><th class="num">Puntos</th></tr></thead>
      <tbody>${filas.map(([c, p]) => `<tr><td>${c}</td><td><span class="lvl l${p}">${NIV[p] ?? '—'}</span></td><td class="num">${p ?? '—'} / 4</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="summary">La nota es individual y la final de la ${esc(D.evidencia)} también considera la exposición y las respuestas de cada integrante. Para subir de nivel, revisen la sección “Camino al 20”.</p>
  </section>`;
}

html += `<section class="block" id="prioridades">
  <div class="head"><div class="eyebrow">Antes de la siguiente entrega</div><h2>Prioridades de corrección</h2></div>
  <ol class="priorities">${D.prioridades.map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
</section>`;

if (D.camino?.length) html += `<section class="block" id="camino">
  <div class="head"><div class="eyebrow">Meta: nivel Sobresaliente en cada criterio de la rúbrica</div><h2>Camino al 20</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Criterio</th><th>Qué exige el nivel Sobresaliente</th><th>Qué les falta para llegar</th></tr></thead>
    <tbody>${D.camino.map(c => `<tr><td><b>${esc(c.criterio)}</b></td><td>${esc(c.exige)}</td><td>${esc(c.falta)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

if (D.viabilidad?.riesgos?.length) html += `<section class="block" id="viabilidad">
  <div class="head"><div class="eyebrow">Mirada de negocio, más allá del documento</div><h2>Viabilidad: con qué se van a chocar</h2></div>
  ${D.viabilidad.resumen ? `<p>${esc(D.viabilidad.resumen)}</p>` : ''}
  <ul class="obs">${D.viabilidad.riesgos.map(r => `<li class="ob">
    <div class="top"><span class="pill importante">${esc(r.tema)}</span><h3>${esc(r.titulo)}</h3></div>
    <p>${esc(r.choque)}</p>
    <div class="fix"><b>Ideas</b><ul class="ideas">${(r.ideas || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
  </li>`).join('')}</ul>
</section>`;

html += `<section class="block" id="estructura">
  <div class="head"><div class="eyebrow">Contra la estructura oficial del TAP</div><h2>Revisión de estructura</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Ítem</th><th>Apartado</th><th>Estado</th><th>Comentario</th></tr></thead>
    <tbody>${D.estructura.map(r => `<tr><td class="code">${esc(r.codigo)}</td><td>${esc(r.apartado)}</td>
      <td class="st ${esc(r.estado)}">${ST[r.estado] || esc(r.estado)}</td><td>${esc(r.nota)}</td></tr>`).join('')}</tbody>
  </table></div>
</section>`;

D.secciones.forEach((s, si) => {
  html += `<section class="block" id="s${si}">
    <div class="head"><div class="eyebrow">${esc(s.etiqueta)}</div><h2>${esc(s.titulo)}</h2></div>
    ${s.resumen ? `<p class="summary">${esc(s.resumen)}</p>` : ''}
    <ul class="obs">${s.observaciones.map((o, oi) => {
      const k = si + '-' + oi;
      return `<li class="ob${done[k] ? ' done' : ''}" data-k="${k}">
        <div class="top"><span class="pill ${esc(o.severidad)}">${SEV[o.severidad] || esc(o.severidad)}</span>
        <h3>${esc(o.titulo)}</h3>${o.ubicacion ? `<span class="where">${esc(o.ubicacion)}</span>` : ''}</div>
        ${o.cita ? `<blockquote>“${esc(o.cita)}”</blockquote>` : ''}
        <p>${esc(o.problema)}</p>
        <div class="fix"><b>Mejora</b><p>${esc(o.mejora)}</p></div>
        <label><input type="checkbox" id="chk-${k}" ${done[k] ? 'checked' : ''}> Marcar como corregido</label>
      </li>`;
    }).join('')}</ul>
  </section>`;
});

html += `<footer>
  <span>Revisión elaborada con la rúbrica de la ${esc(D.evidencia)} y la estructura oficial del TAP de CERTUS.</span>
  <span>Las casillas “corregido” se guardan solo en este navegador, como ayuda para organizarse.</span>
</footer>`;
document.getElementById('main').innerHTML = html;

const toc = [['dictamen', 'Dictamen', '']]
  .concat(D.calificacion ? [['nota', 'Calificación', '']] : [])
  .concat([['prioridades', 'Prioridades', '']])
  .concat(D.camino?.length ? [['camino', 'Camino al 20', '']] : [])
  .concat(D.viabilidad?.riesgos?.length ? [['viabilidad', 'Viabilidad', '']] : [])
  .concat([['estructura', 'Estructura', '']])
  .concat(D.secciones.map((s, i) => ['s' + i, s.titulo, s.observaciones.length]));
document.getElementById('toc').innerHTML = toc.map(([id, t, n]) => `<li><a href="#${id}"><span>${esc(t)}</span><span class="n">${n}</span></a></li>`).join('');

function updateProgress() {
  const total = document.querySelectorAll('.ob').length;
  const ok = document.querySelectorAll('.ob.done').length;
  document.getElementById('progress').textContent = `${ok} de ${total} observaciones corregidas`;
}
document.getElementById('main').addEventListener('change', e => {
  const li = e.target.closest('.ob'); if (!li) return;
  li.classList.toggle('done', e.target.checked);
  done[li.dataset.k] = e.target.checked;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  updateProgress();
});
updateProgress();
</script>

</html>
